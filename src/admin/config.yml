# Sveltia CMS configuration for jeffandpaige.net
# Docs: https://sveltiacms.app/en/docs
#
# Every editable data file in src/_data/ has one entry below. Saving in the
# admin commits the change to the main branch on GitHub; Netlify then rebuilds
# the site, which takes about a minute.

backend:
  name: github
  repo: jgandertonjr-cpu/jeff-paige-wedding
  branch: main
  # base_url is intentionally not set, so sign-in uses Netlify's built-in
  # GitHub OAuth provider (see ADMIN-SETUP.md).
  # Readable history on GitHub: who changed which page.
  commit_messages:
    create: "Website edit: add {{collection}} → {{slug}} (by {{author-login}})"
    update: "Website edit: {{collection}} → {{slug}} (by {{author-login}})"
    delete: "Website edit: delete {{collection}} → {{slug}} (by {{author-login}})"
    uploadMedia: "Website edit: upload photo {{path}} (by {{author-login}})"
    deleteMedia: "Website edit: delete photo {{path}} (by {{author-login}})"

app_title: "Jeff & Paige — Website Editor"
logo_url: /images/apple-touch-icon.png
site_url: https://jeffandpaige.net

# Photo uploads go next to the site's existing photos, so old and new photos
# can all be picked from the same media library.
media_folder: src/images
public_folder: /images
media_libraries:
  default:
    config:
      # Phone photos are huge. Shrink every uploaded photo to at most 2000px on
      # its long side and save it as a compressed WebP, so pages stay fast.
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
          height: 2000
      # Rename uploads to safe, web-friendly names (e.g. "IMG 0412.JPG" → "img-0412.webp").
      slugify_filename: true
      max_file_size: 26214400 # 25 MB

collections:
  # ── Site-wide ────────────────────────────────────────────────────────────
  - name: settings
    label: Site Settings
    icon: settings
    description: Names, wedding date, venue and contact email. These appear on many pages at once.
    format: json
    editor:
      preview: false
    files:
      - name: site
        label: Names, Date & Venue
        file: src/_data/site.json
        fields:
          - name: couple
            label: The couple
            widget: object
            fields:
              - { name: partner1_first, label: "First partner — first name", widget: string, hint: "Shown everywhere, e.g. the big names on the home page and the J&P logo." }
              - { name: partner1_full, label: "First partner — full name", widget: string }
              - { name: partner1_formal, label: "First partner — formal name", widget: string, required: false, hint: "Optional, e.g. Jeffrey. Used by screen readers and Google." }
              - { name: partner2_first, label: "Second partner — first name", widget: string }
              - { name: partner2_full, label: "Second partner — full name", widget: string }
              - { name: partner2_formal, label: "Second partner — formal name", widget: string, required: false }
          - name: wedding_date
            label: Wedding date
            widget: datetime
            type: date
            hint: "Updates the countdown, the home page, Details, RSVP and more. Sentences you typed yourself that mention the date (like the Welcome text) need updating by hand."
          - name: venue
            label: Venue
            widget: object
            hint: Used for the address, the map and the directions links.
            fields:
              - { name: name, label: Venue name, widget: string }
              - { name: street, label: Street address, widget: string }
              - { name: city, label: City, widget: string }
              - { name: state, label: State, widget: string, hint: "Two letters, e.g. PA" }
              - { name: zip, label: ZIP code, widget: string }
          - name: calendar
            label: Calendar event
            widget: object
            collapsed: true
            hint: "What guests get from the Add to Calendar buttons. The date and venue address come from above. Guests who already added the event keep their copy, so tell them if the time changes."
            fields:
              - { name: title, label: Event title, widget: string }
              - { name: start_time, label: Start time (Eastern), widget: datetime, type: time, required: false, hint: "Leave empty for an all-day event, e.g. until the ceremony time is set. Use when guests should arrive." }
              - { name: end_time, label: End time (Eastern), widget: datetime, type: time, required: false, hint: "Optional. If empty, the event lasts six hours. A time after midnight counts as the next day." }
              - { name: description, label: Note in the event, widget: text, hint: "The website link is added automatically." }
          - { name: email, label: Contact email, widget: string, pattern: ['^[^\s@]+@[^\s@]+\.[^\s@]+$', "Enter an email address like name@example.com"], hint: "Every \"Email us\" link on the site uses this address." }
          - { name: footer_text, label: Footer text, widget: string, hint: "The small line at the bottom of every page." }
          - name: labels
            label: Button & label wording
            widget: object
            collapsed: true
            hint: "The words on the Get directions links, Show map buttons and the Add to Calendar menu, which appear on several pages."
            fields:
              - { name: get_directions, label: "Link: Get directions", widget: string }
              - { name: show_map, label: "Map button: Show map", widget: string }
              - { name: opens_in_new_tab, label: "Hidden note for screen readers on links that open a new tab", widget: string }
              - { name: add_to_calendar, label: "Button: Add to Calendar", widget: string }
              - { name: apple_calendar, label: "Calendar choice: Apple", widget: string }
              - { name: apple_calendar_hint, label: "Calendar choice: Apple, small text", widget: string }
              - { name: google_calendar, label: "Calendar choice: Google", widget: string }
              - { name: google_calendar_hint, label: "Calendar choice: Google, small text", widget: string }
              - { name: outlook, label: "Calendar choice: Outlook", widget: string }
              - { name: outlook_hint, label: "Calendar choice: Outlook, small text", widget: string }
              - { name: other_calendar, label: "Calendar choice: Other", widget: string }
              - { name: other_calendar_hint, label: "Calendar choice: Other, small text", widget: string }
      - name: theme
        label: Colours
        file: src/_data/theme.json
        fields:
          - { name: dusty_sage, label: Banner green, widget: string, pattern: ['^#[0-9A-Fa-f]{6}$', "Enter a colour like #BCCAB3"], hint: "Page banners, feature bands and the footer. Keep it readable against what sits behind it." }
          - { name: rosette, label: RSVP pink, widget: string, pattern: ['^#[0-9A-Fa-f]{6}$', "Enter a colour like #BCCAB3"], hint: "The RSVP button only. Keep it readable against what sits behind it." }
          - { name: gold, label: Gold, widget: string, pattern: ['^#[0-9A-Fa-f]{6}$', "Enter a colour like #BCCAB3"], hint: "Gold borders and rings. Keep it readable against what sits behind it." }
          - { name: ivory, label: Page background, widget: string, pattern: ['^#[0-9A-Fa-f]{6}$', "Enter a colour like #BCCAB3"], hint: "The main background of every page. Keep it readable against what sits behind it." }
          - { name: sage_mist, label: Alternate section background, widget: string, pattern: ['^#[0-9A-Fa-f]{6}$', "Enter a colour like #BCCAB3"], hint: "Every other section, so the page has gentle stripes. Keep it readable against what sits behind it." }
          - { name: white, label: Card white, widget: string, pattern: ['^#[0-9A-Fa-f]{6}$', "Enter a colour like #BCCAB3"], hint: "Cards and boxes. Keep it readable against what sits behind it." }
          - { name: hairline, label: Thin lines, widget: string, pattern: ['^#[0-9A-Fa-f]{6}$', "Enter a colour like #BCCAB3"], hint: "The fine lines around cards and between sections. Keep it readable against what sits behind it." }
          - { name: blush, label: Soft pink, widget: string, pattern: ['^#[0-9A-Fa-f]{6}$', "Enter a colour like #BCCAB3"], hint: "Small touches such as highlighted text. Keep it readable against what sits behind it." }
          - { name: evergreen, label: Main text, widget: string, pattern: ['^#[0-9A-Fa-f]{6}$', "Enter a colour like #BCCAB3"], hint: "Body text, headings and dark buttons. Keep it readable against what sits behind it." }
          - { name: sage_gray, label: Quiet text, widget: string, pattern: ['^#[0-9A-Fa-f]{6}$', "Enter a colour like #BCCAB3"], hint: "Captions and secondary text. Keep it readable against what sits behind it." }
          - { name: deep_gold, label: Gold text, widget: string, pattern: ['^#[0-9A-Fa-f]{6}$', "Enter a colour like #BCCAB3"], hint: "Small gold labels, links and icons. Keep it readable against what sits behind it." }
          - { name: deep_evergreen, label: Text on banners, widget: string, pattern: ['^#[0-9A-Fa-f]{6}$', "Enter a colour like #BCCAB3"], hint: "Text that sits on the banner green. Keep it readable against what sits behind it." }
          - { name: muted_on_sage, label: Quiet text on banners, widget: string, pattern: ['^#[0-9A-Fa-f]{6}$', "Enter a colour like #BCCAB3"], hint: "Secondary text that sits on the banner green. Keep it readable against what sits behind it." }
          - { name: gold_on_sage, label: Gold text on banners, widget: string, pattern: ['^#[0-9A-Fa-f]{6}$', "Enter a colour like #BCCAB3"], hint: "Gold text that sits on the banner green. Keep it readable against what sits behind it." }
      - name: nav
        label: Menu
        file: src/_data/nav.json
        fields:
          - name: essentials
            label: Main menu links
            label_singular: link
            widget: list
            hint: The links in the header and under the names on the home page. Change the wording only; the pages they go to stay the same.
            allow_add: false
            fields:
              - { name: label, label: Link wording, widget: string }
              - { name: url, label: Goes to, widget: hidden }
              - { name: rsvp, label: RSVP style, widget: hidden, required: false }
          - name: more
            label: More links
            label_singular: link
            widget: list
            hint: The extra links in the menu. Change the wording only; the pages they go to stay the same.
            allow_add: false
            fields:
              - { name: label, label: Link wording, widget: string }
              - { name: url, label: Goes to, widget: hidden }
              - { name: rsvp, label: RSVP style, widget: hidden, required: false }

  # ── Pages ────────────────────────────────────────────────────────────────
  - name: pages
    label: Pages
    icon: description
    description: The text and photos on each page of the website.
    format: json
    editor:
      preview: false
    files:
      # Home ------------------------------------------------------------------
      - name: home
        label: Home
        file: src/_data/home.json
        fields:
          - &seo
            name: seo
            label: Search & Sharing
            widget: object
            collapsed: true
            hint: How this page appears in Google results, browser tabs and link previews (texts, iMessage, Facebook). Rarely needs changing.
            fields:
              - { name: title, label: Browser tab title, widget: string, maxlength: 70 }
              - { name: description, label: Google description, widget: text, maxlength: 160, hint: "One or two sentences shown under the link in Google results. Google cuts off anything past about 160 characters." }
              - { name: social_title, label: Link preview title, widget: string, required: false, hint: "Leave empty to use the browser tab title." }
              - { name: social_description, label: Link preview description, widget: text, required: false, maxlength: 200, hint: "Shown when the link is shared in a text or on social media. Leave empty to use the Google description." }
          - name: section_order
            label: Order of sections
            widget: select
            multiple: true
            dropdown_threshold: 0
            min: 5
            max: 5
            hint: "The order the sections appear on the page, top to bottom. Keep every section in the list; drag to change the order. The colours alternate down the page by themselves. The countdown keeps its green band wherever it goes."
            options: [{ label: Welcome, value: welcome }, { label: Countdown, value: countdown }, { label: Photos, value: photos }, { label: "Explore links", value: quick_links }, { label: "Save the date", value: save_the_date }]
          - name: hero
            label: Top of page
            widget: object
            hint: The names, date and venue come from Site Settings.
            fields:
              - { name: eyebrow, label: Small text above the photo, widget: string }
              - { name: photo, label: Main photo, widget: image, hint: "A tall (portrait) photo works best." }
              - { name: photo_alt, label: Photo description, widget: string, hint: "Describe the photo for people using screen readers, e.g. \"Jeff and Paige on the beach\"." }
          - name: countdown
            label: Countdown band
            widget: object
            collapsed: true
            hint: The countdown itself counts to the wedding date in Site Settings.
            fields:
              - { name: label, label: Small text, widget: string }
              - { name: title, label: Heading, widget: string }
          - name: welcome
            label: Welcome section
            widget: object
            fields:
              - { name: label, label: Small text, widget: string }
              - { name: title, label: Heading, widget: string }
              - { name: text, label: Welcome message, widget: text }
          - name: photos
            label: Three photos
            widget: object
            fields:
              - { name: label, label: Small text, widget: string }
              - { name: title, label: Heading, widget: string }
              - name: items
                label: Photos
                label_singular: Photo
                widget: list
                min: 3
                max: 3
                summary: "{{fields.caption}}"
                hint: Exactly three photos, shown side by side.
                fields:
                  - { name: image, label: Photo, widget: image }
                  - { name: alt, label: Photo description, widget: string, hint: "For screen readers." }
                  - { name: caption, label: Caption, widget: string, hint: "Short and lowercase works best, e.g. \"the adventures\"." }
                  - &focus
                    name: focus
                    label: Photo crop
                    widget: select
                    default: center
                    hint: "If a face gets cut off, try showing more of the top or left."
                    options:
                      - { label: Center (default), value: center }
                      - { label: Show more of the top, value: high }
                      - { label: Show more of the left side, value: left }
          - name: quick_links
            label: '"Everything You Need to Know" cards'
            widget: object
            collapsed: true
            fields:
              - { name: label, label: Small text, widget: string }
              - { name: title, label: Heading, widget: string }
              - { name: our_story, label: Our Story card text, widget: string }
              - { name: details, label: Details card text, widget: string }
              - { name: rsvp, label: RSVP card text, widget: string, hint: "Update this when RSVPs open." }
              - { name: wedding_party, label: Wedding Party card text, widget: string }
          - name: save_the_date
            label: Save the Date band
            widget: object
            collapsed: true
            hint: The big date heading comes from Site Settings.
            fields:
              - { name: label, label: Small text, widget: string }
              - { name: text, label: Message, widget: text }
          - name: labels
            label: Button & label wording
            widget: object
            collapsed: true
            hint: "The words on this page's buttons and small labels. Rarely needs changing."
            fields:
              - { name: plan_your_trip, label: "Button: Plan your trip", widget: string }
              - { name: our_story, label: "Button: Our story", widget: string }
              - { name: days, label: "Countdown word: Days", widget: string }
              - { name: view_the_gallery, label: "Button: View the gallery", widget: string }
              - { name: card_our_story, label: "Explore list: Our Story title", widget: string }
              - { name: card_details, label: "Explore list: Details title", widget: string }
              - { name: card_rsvp, label: "Explore list: RSVP title", widget: string }
              - { name: card_wedding_party, label: "Explore list: Wedding Party title", widget: string }

      # Our Story -------------------------------------------------------------
      - name: story
        preview_path: our-story
        label: Our Story
        file: src/_data/story.json
        fields:
          - *seo
          - &hero
            name: hero
            label: Top of page
            widget: object
            hint: The banner at the very top of the page.
            fields:
              - { name: label, label: Small text above the title, widget: string }
              - { name: title, label: Page title, widget: string }
              - { name: subtitle, label: Text under the title, widget: text }
          - name: events
            label: Timeline
            label_singular: Moment
            widget: list
            collapsed: true
            summary: "{{fields.date_label}} — {{fields.title}}"
            hint: Moments alternate left and right automatically. Drag to reorder.
            fields:
              - { name: date_label, label: Date (as shown), widget: string, hint: "Written however you like, e.g. \"November 2022\" or \"2023 – 2026\"." }
              - name: date_value
                label: Date (for search engines)
                widget: string
                hint: "The same date as numbers: year, year-month or year-month-day, e.g. 2022-11"
                pattern: ['^\d{4}(-\d{2}(-\d{2})?)?$', "Use a format like 2022, 2022-11 or 2022-11-05"]
              - { name: title, label: Title, widget: string }
              - name: story
                label: Story
                widget: markdown
                modes: [rich_text]
                buttons: [bold, italic, link]
                editor_components: []
                hint: Press Enter twice to start a new paragraph.
              - { name: photo, label: Photo, widget: image, hint: "Wide photos get a landscape frame, tall photos a portrait frame — automatically." }
              - { name: photo_alt, label: Photo description, widget: string, hint: "For screen readers." }
              - *focus
          - name: cta
            label: Bottom section
            widget: object
            collapsed: true
            fields:
              - { name: label, label: Small text, widget: string }
              - { name: title, label: Heading, widget: string }
              - { name: text, label: Message, widget: text }
          - name: labels
            label: Button & label wording
            widget: object
            collapsed: true
            hint: "The words on this page's buttons and small labels. Rarely needs changing."
            fields:
              - { name: view_details, label: "Button: View details", widget: string }

      # Details ---------------------------------------------------------------
      - name: details
        preview_path: details
        label: Details (ceremony, reception, schedule)
        file: src/_data/details.json
        fields:
          - *seo
          - *hero
          - name: section_order
            label: Order of sections
            widget: select
            multiple: true
            dropdown_threshold: 0
            min: 4
            max: 4
            hint: "The order the sections appear on the page, top to bottom. Keep every section in the list; drag to change the order. The colours alternate down the page by themselves."
            options: [{ label: Ceremony, value: ceremony }, { label: Reception, value: reception }, { label: Schedule, value: schedule }, { label: "Closing message", value: cta }]
          - name: ceremony
            label: Ceremony
            widget: object
            hint: The venue name, address and map come from Site Settings. The small date above the heading comes from the wedding date.
            fields:
              - { name: title, label: Heading, widget: string }
              - { name: box_heading, label: Box heading, widget: string }
              - name: items
                label: Ceremony details
                label_singular: Detail
                widget: list
                summary: "{{fields.label}}: {{fields.value}}"
                hint: Rows shown under the address, e.g. Time, Dress Code, Parking.
                fields:
                  - { name: label, label: Label, widget: string, hint: "e.g. Time" }
                  - { name: value, label: Value, widget: string, hint: "e.g. 4:30 PM" }
                  - { name: note, label: Extra note, widget: text, required: false, hint: "Optional smaller text underneath." }
          - name: reception
            label: Reception
            widget: object
            fields:
              - { name: label, label: Small text, widget: string }
              - { name: title, label: Heading, widget: string }
              - { name: subtitle, label: Intro text, widget: text }
              - { name: box_heading, label: Box heading, widget: string }
              - name: items
                label: Reception details
                label_singular: Detail
                widget: list
                summary: "{{fields.label}}: {{fields.value}}"
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: value, label: Value, widget: string }
                  - { name: note, label: Extra note, widget: text, required: false }
          - name: schedule
            label: Schedule of the day
            widget: object
            fields:
              - { name: label, label: Small text, widget: string }
              - { name: title, label: Heading, widget: string }
              - { name: subtitle, label: Intro text, widget: text, required: false, hint: "e.g. \"Exact times will be shared closer to the day.\" Clear it once you add times." }
              - name: events
                label: Events
                label_singular: Event
                widget: list
                summary: "{{fields.time}} {{fields.title}}"
                hint: In order. Drag to reorder.
                fields:
                  - { name: time, label: Time, widget: string, required: false, hint: "e.g. 4:30 PM. Leave empty to show a number (01, 02, …) instead." }
                  - { name: title, label: Event, widget: string }
                  - { name: description, label: Description, widget: text }
          - name: cta
            label: Bottom section
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Heading, widget: string }
              - { name: text, label: Message, widget: text }
          - name: labels
            label: Button & label wording
            widget: object
            collapsed: true
            hint: "The words on this page's buttons and small labels. Rarely needs changing."
            fields:
              - { name: venue, label: "Label: Venue", widget: string }
              - { name: address, label: "Label: Address", widget: string }
              - { name: plan_your_trip, label: "Button: Plan your trip", widget: string }

      # Wedding Party ---------------------------------------------------------
      - name: party
        preview_path: wedding-party
        label: Wedding Party
        file: src/_data/party.json
        fields:
          - *seo
          - *hero
          - name: section_order
            label: Order of sections
            widget: select
            multiple: true
            dropdown_threshold: 0
            min: 3
            max: 3
            hint: "The order the sections appear on the page, top to bottom. Keep every section in the list; drag to change the order. The colours alternate down the page by themselves."
            options: [{ label: "Paige's side", value: bridesmaids }, { label: "Jeff's side", value: groomsmen }, { label: "Closing message", value: cta }]
          - name: bridesmaids
            label: "Paige's side"
            widget: object
            fields:
              - { name: label, label: Small text, widget: string }
              - { name: title, label: Heading, widget: string }
              - &members
                name: members
                label: People
                label_singular: Person
                widget: list
                summary: "{{fields.role}} — {{fields.name}}"
                hint: Drag to reorder.
                fields:
                  - { name: name, label: Name, widget: string }
                  - { name: role, label: Role, widget: string, hint: "e.g. Maid of Honor, Bridesmaid" }
                  - { name: bio, label: Short bio, widget: text }
                  - { name: photo, label: Photo, widget: image, required: false, hint: "Optional. A square or portrait photo of their face works best. Without one, a placeholder circle is shown." }
          - name: groomsmen
            label: "Jeff's side"
            widget: object
            fields:
              - { name: label, label: Small text, widget: string }
              - { name: title, label: Heading, widget: string }
              - *members
          - name: cta
            label: Bottom section
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Heading, widget: string }
              - { name: text, label: Message, widget: text }
          - name: labels
            label: Button & label wording
            widget: object
            collapsed: true
            hint: "The words on this page's buttons and small labels. Rarely needs changing."
            fields:
              - { name: see_the_details, label: "Button: See the details", widget: string }

      # RSVP ------------------------------------------------------------------
      - name: rsvp
        preview_path: rsvp
        label: RSVP
        file: src/_data/rsvp.json
        fields:
          - *seo
          - *hero
          - name: rsvp_open
            label: RSVPs are open
            widget: boolean
            default: false
            hint: "Off: guests see a Save the Date message. On: guests see the RSVP form. **[See RSVP responses →](/admin/rsvps/)**"
          - name: deadline
            label: Reply-by date
            widget: datetime
            type: date
            required: false
            hint: "Optional. Shown above the form while RSVPs are open."
          - name: closed_notice
            label: Message while RSVPs are closed
            widget: object
            fields:
              - { name: title, label: Heading, widget: string }
              - { name: text, label: Message, widget: text }
          - name: form_intro
            label: Heading above the form
            widget: object
            collapsed: true
            fields:
              - { name: label, label: Small text, widget: string }
              - { name: title, label: Heading, widget: string }
          - name: meal_options
            label: Meal choices
            label_singular: Meal
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: Meal name (what guests see), widget: string }
              - { name: value, label: Short code (what you see in responses), widget: string, hint: "One lowercase word, e.g. chicken. Don't change it after RSVPs open." }
          - name: extra_questions
            label: Extra questions
            widget: object
            collapsed: true
            hint: "Asked only of guests who accept. Answers appear on the **[RSVP responses](/admin/rsvps/)** page and in its downloads."
            fields:
              - { name: afterparty_show, label: Ask about the after party, widget: boolean, default: true, hint: "Asks the guest and everyone in their party who's coming. The place and timing note under it come from Pages → After Party." }
              - { name: afterparty_label, label: After party question, widget: string }
              - { name: wedding_song_show, label: Ask married guests for their wedding song, widget: boolean, default: true, hint: "Optional for guests. For the cocktail-hour playlist. Shown in its own \"For Married Guests\" box." }
              - { name: wedding_song_heading, label: Wedding song box heading, widget: string }
              - { name: wedding_song_label, label: Wedding song field label, widget: string }
              - { name: wedding_song_hint, label: Text under the wedding song heading, widget: string, required: false }
              - { name: wedding_song_placeholder, label: Example text inside the box, widget: string, required: false }
          - name: thank_you
            label: Thank-you message after sending
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Heading, widget: string }
              - { name: text, label: Message, widget: text }

      # Registry --------------------------------------------------------------
      - name: registry
        preview_path: registry
        label: Registry
        file: src/_data/registry.json
        fields:
          - *seo
          - *hero
          - { name: photo, label: Wide photo, widget: image, required: false, hint: "Shown wide under the page header, with the registry card overlapping its bottom edge. A landscape photo works best. Leave empty for no photo." }
          - { name: photo_alt, label: Photo description, widget: string, required: false, hint: "For screen readers, e.g. \"Jeff and Paige on the beach\"." }
          - *focus
          - name: intro
            label: Note at the top of the card
            widget: object
            fields:
              - { name: label, label: Small text, widget: string }
              - { name: title, label: Heading, widget: string }
              - { name: text, label: Message, widget: text }
          - name: coming_soon
            label: Coming soon
            widget: object
            hint: "While this is on, guests see this message instead of the registry buttons."
            fields:
              - { name: enabled, label: Show "coming soon" instead of the registry, widget: boolean, default: true, hint: "Turn off once the Amazon link below is filled in. The buttons stay hidden until the link is a real registry address." }
              - { name: label, label: Badge text, widget: string }
              - { name: title, label: Heading, widget: string }
              - { name: text, label: Message, widget: text }
          - name: amazon
            label: Amazon registry
            widget: object
            fields:
              - { name: url, label: Registry link, widget: string, pattern: ['^https?://\S+$', "Paste the full web address, starting with https://"], hint: "Your Amazon registry's share link. Opens in a new tab." }
              - { name: title, label: Card heading, widget: string }
              - { name: text, label: Note under the heading, widget: text }
              - { name: button_text, label: Button text, widget: string }
          - name: cash_fund
            label: Cash fund (optional)
            widget: object
            collapsed: true
            hint: "A second card next to Amazon, for a honeymoon or house fund. Shown only while the registry is live."
            fields:
              - { name: enabled, label: Show the cash fund card, widget: boolean, default: false }
              - { name: title, label: Card heading, widget: string }
              - { name: text, label: Note under the heading, widget: text }
              - { name: url, label: Fund page link, widget: string, required: false, pattern: ['^https?://\S+$', "Paste the full web address, starting with https://"], hint: "Optional. Leave empty for no button." }
              - { name: button_text, label: Button text, widget: string, required: false }
              - name: handles
                label: Payment handles
                label_singular: Handle
                widget: list
                required: false
                summary: "{{fields.label}}: {{fields.value}}"
                hint: "Optional, e.g. Venmo → @jeff-and-paige. Public usernames only — never bank or card numbers."
                fields:
                  - { name: label, label: App, widget: string }
                  - { name: value, label: Username or handle, widget: string }
          - name: shipping_note
            label: Shipping note
            widget: object
            collapsed: true
            hint: "One small line under the registry card."
            fields:
              - { name: enabled, label: Show the shipping note, widget: boolean, default: true }
              - { name: text, label: Message, widget: text }

      # Travel ----------------------------------------------------------------
      - name: travel
        preview_path: travel
        label: Travel & Hotels
        file: src/_data/travel.json
        fields:
          - *seo
          - *hero
          - name: section_order
            label: Order of sections
            widget: select
            multiple: true
            dropdown_threshold: 0
            min: 4
            max: 4
            hint: "The order the sections appear on the page, top to bottom. Keep every section in the list; drag to change the order. The colours alternate down the page by themselves."
            options: [{ label: "Room block", value: room_block }, { label: "Nearby hotels", value: nearby }, { label: Airports, value: airports }, { label: "Local tips", value: tips }]
          - name: room_block
            label: Room block
            widget: object
            fields:
              - { name: label, label: Small text, widget: string }
              - { name: title, label: Heading, widget: string }
              - { name: intro, label: Intro text, widget: text }
              - { name: hotel_name, label: Hotel name, widget: string }
              - { name: badge, label: Badge text, widget: string }
              - { name: hotel_details, label: Hotel address / distance, widget: string, required: false }
              - name: deadline
                label: Booking deadline
                widget: datetime
                type: date
                required: false
                hint: 'Leave empty to show "To be announced".'
              - { name: booking_note, label: Group code / booking note, widget: string }
              - { name: booking_url, label: Booking link, widget: string, required: false, pattern: ['^https?://\S+$', "Paste the full web address, starting with https://"], hint: "The full web address, starting with https://" }
          - name: nearby
            label: Nearby hotels
            widget: object
            fields:
              - { name: label, label: Small text, widget: string }
              - { name: title, label: Heading, widget: string }
              - { name: empty_text, label: Message when no hotels are listed, widget: string }
              - name: hotels
                label: Hotels
                label_singular: Hotel
                widget: list
                required: false
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: Hotel name, widget: string }
                  - { name: address, label: Address, widget: string, required: false }
                  - { name: distance, label: Distance from the venue, widget: string, required: false, hint: "e.g. 10 minutes, 4 miles" }
                  - { name: note, label: Note, widget: string, required: false }
                  - { name: url, label: Website, widget: string, required: false, pattern: ['^https?://\S+$', "Paste the full web address, starting with https://"], hint: "The full web address, starting with https://" }
          - name: airports
            label: Airports
            widget: object
            collapsed: true
            fields:
              - { name: label, label: Small text, widget: string }
              - { name: title, label: Heading, widget: string }
              - { name: card_title, label: Box heading, widget: string }
              - name: list
                label: Airports
                label_singular: Airport
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: Airport, widget: string, hint: "e.g. Philadelphia International (PHL)" }
                  - { name: details, label: Distance and notes, widget: text }
              - { name: footnote, label: Small print, widget: string }
          - name: tips
            label: Local tips
            widget: object
            collapsed: true
            fields:
              - { name: label, label: Small text, widget: string }
              - { name: title, label: Heading, widget: string }
              - name: list
                label: Tips
                label_singular: Tip
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - &icon
                    name: icon
                    label: Icon
                    widget: select
                    default: star
                    options:
                      - { label: "☀️ Sun / weather", value: sun }
                      - { label: "🚗 Car", value: car }
                      - { label: "🧭 Compass / explore", value: compass }
                      - { label: "🛏️ Bed / hotel", value: bed }
                      - { label: "🍺 Drink", value: mug }
                      - { label: "🎱 Billiard ball / games", value: billiard }
                      - { label: "👥 People", value: people }
                      - { label: "⭐ Star", value: star }
                  - { name: title, label: Title, widget: string }
                  - { name: text, label: Tip, widget: text }
          - name: labels
            label: Button & label wording
            widget: object
            collapsed: true
            hint: "The words on this page's buttons and small labels. Rarely needs changing."
            fields:
              - { name: block_deadline, label: "Label: Block deadline", widget: string }
              - { name: to_be_announced, label: "Text when there is no deadline yet", widget: string }
              - { name: book_your_room, label: "Button: Book your room", widget: string }
              - { name: booking_link_coming_soon, label: "Text when there is no booking link yet", widget: string }
              - { name: visit_website, label: "Button: Visit website", widget: string }

      # After Party -----------------------------------------------------------
      - name: afterparty
        preview_path: after-party
        label: After Party
        file: src/_data/afterparty.json
        fields:
          - *seo
          - *hero
          - name: section_order
            label: Order of sections
            widget: select
            multiple: true
            dropdown_threshold: 0
            min: 3
            max: 3
            hint: "The order the sections appear on the page, top to bottom. Keep every section in the list; drag to change the order. The colours alternate down the page by themselves."
            options: [{ label: "Where and when", value: details }, { label: "What to expect", value: expect }, { label: "Closing message", value: cta }]
          - name: details
            label: Where & when
            widget: object
            fields:
              - { name: label, label: Small text, widget: string }
              - { name: title, label: Heading, widget: string }
              - { name: venue_name, label: Place name, widget: string }
              - { name: address, label: Address, widget: string }
              - { name: map_address, label: Address for the map, widget: string, required: false, hint: "Optional. Once filled in (e.g. \"Stella, 50 S Main St, New Hope, PA\"), a map and directions link replace the \"coming soon\" box." }
              - { name: time, label: Time, widget: string }
              - { name: time_note, label: Time note, widget: string, required: false }
              - { name: dress_code, label: Dress code, widget: string }
              - { name: open_to, label: Who's invited, widget: string }
              - { name: map_note, label: Text in the map box before the address is known, widget: string }
          - name: expect
            label: What to expect
            widget: object
            collapsed: true
            fields:
              - { name: label, label: Small text, widget: string }
              - { name: title, label: Heading, widget: string }
              - name: items
                label: Items
                label_singular: Item
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - *icon
                  - { name: title, label: Title, widget: string }
                  - { name: text, label: Description, widget: text }
          - name: cta
            label: Bottom section
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Heading, widget: string }
              - { name: text, label: Message, widget: text }
          - name: labels
            label: Button & label wording
            widget: object
            collapsed: true
            hint: "The words on this page's buttons and small labels. Rarely needs changing."
            fields:
              - { name: address, label: "Label: Address", widget: string }
              - { name: time, label: "Label: Time", widget: string }
              - { name: dress_code, label: "Label: Dress code", widget: string }
              - { name: open_to, label: "Label: Open to", widget: string }
              - { name: wedding_details, label: "Button: Wedding details", widget: string }

      # FAQ -------------------------------------------------------------------
      - name: faq
        preview_path: faq
        label: FAQ
        file: src/_data/faq.json
        fields:
          - *seo
          - name: hero
            label: Top of page
            widget: object
            fields:
              - { name: label, label: Small text above the title, widget: string }
              - { name: title, label: Page title, widget: string }
              - { name: subtitle, label: Text under the title, widget: string, hint: "The contact email from Site Settings is added after this text." }
          - name: list_header
            label: Heading above the questions
            widget: object
            collapsed: true
            fields:
              - { name: label, label: Small text, widget: string }
              - { name: title, label: Heading, widget: string }
          - name: questions
            label: Questions
            label_singular: Question
            widget: list
            collapsed: true
            summary: "{{fields.question}}"
            hint: Drag to reorder.
            fields:
              - { name: question, label: Question, widget: string }
              - name: answer
                label: Answer
                widget: markdown
                modes: [rich_text]
                buttons: [bold, italic, link]
                editor_components: []
                hint: "Use the link button to link an email (mailto:you@example.com) or another page (e.g. travel.html)."
          - name: cta
            label: Bottom section
            widget: object
            collapsed: true
            fields:
              - { name: title, label: Heading, widget: string }
              - { name: text, label: Message, widget: text }
          - name: labels
            label: Button & label wording
            widget: object
            collapsed: true
            hint: "The words on this page's buttons and small labels. Rarely needs changing."
            fields:
              - { name: email_us, label: "Button: Email us", widget: string }
              - { name: see_the_details, label: "Button: See the details", widget: string }

      # Gallery ---------------------------------------------------------------
      - name: gallery
        preview_path: gallery
        label: Gallery
        file: src/_data/gallery.json
        fields:
