            fields:
              - { name: image, label: Photo, widget: image }
              - { name: alt, label: Photo description, widget: string, hint: "For screen readers, e.g. \"Jeff and Paige at a Phillies game\"." }
          - name: wedding_photos
            label: Wedding photos note
            widget: object
            collapsed: true
            fields:
              - { name: label, label: Small text, widget: string }
              - { name: title, label: Heading, widget: string }
              - { name: text, label: Message, widget: text }
          - name: labels
            label: Button & label wording
            widget: object
