/* Impact gate. The old app said ≤3/10 → proceed; that threshold came from
   Achilles tendinopathy research and does not transfer to bone. */
/* TIGHTENED on the PT review, his call (Oct 2026). v5/v6.0 cleared 2–4/10
   pain that "settles or plateaus" to run — but the header and his own
   description of the rule both said 0/10, and for a 245-lb runner with a
   bone-stress history the PT judged 4/10 too permissive: settling pain does
   not reliably rule out an early stress reaction. Now: run only at ≤2/10
   that SETTLES within ten minutes AND a 0/10 first-steps reading this
   morning. 3–4/10, a plateau, or a non-zero morning → swap to the bike
   today; strength and prehab stay. */
function impactGate(pm,shape,am){
  if(pm==null)return{k:"unrated",c:"#606877",h:"NOT RATED",m:"Rate the shin before any impact work."};
  if(pm===0)return{k:"go",c:"#22c55e",h:"CLEAR",m:"0/10. Run as prescribed. Add nothing."};
  if(pm>=6)return{k:"stop",c:"#f43f5e",h:"STOP IMPACT AND LEG LOADING",m:"6+/10. Stop, screen the red flags, and get seen in person before any impact or leg loading. Pain-free upper body and the bike can continue."};
  if(shape==null)return{k:"unrated",c:"#606877",h:"SHAPE NOT RATED",m:"A number alone does not decide this. Say what it DOES over the first ten minutes."};
  if(shape==="climbs")return{k:"stop",c:"#f43f5e",h:"STOP ON THE SPOT",m:"Pain that climbs minute over minute is the stress-injury pattern, not the MTSS pattern — whatever the number is. Stop now, screen the red flags, and do not finish the session."};
  if(pm>=5)return{k:"stop",c:"#f43f5e",h:"STOP ON THE SPOT",m:"5/10 is the ceiling regardless of shape. Stop, and treat it as a flare."};
  if(pm>=3)return{k:"swap",c:"#f59e0b",h:"SWAP TO THE BIKE TODAY",m:"3–4/10, even if it settles: no running and no jumps today. Use Swap The Run below; the strength and prehab stay. Tomorrow's first-steps reading decides what comes next."};
  if(shape!=="settles")return{k:"swap",c:"#f59e0b",h:"SWAP TO THE BIKE TODAY",m:"1–2/10 that plateaus rather than settling is not a running day. Swap the run; everything else stays."};
  if(am==null)return{k:"unrated",c:"#606877",h:"RATE THIS MORNING FIRST",m:"1–2/10 that settles is runnable ONLY if this morning's first steps were 0/10 — rate Gate 2."};
  if(am>0)return{k:"swap",c:"#f59e0b",h:"SWAP TO THE BIKE TODAY",m:"Pain now on top of a non-zero first-steps reading this morning. Swap the run; everything else stays."};
  return{k:"go",c:"#22c55e",h:"CLEAR — RUN AS PRESCRIBED",
    m:"1–2/10 that settles within ten minutes, with a 0/10 morning, is the MTSS warm-up pattern. Run the prescribed session and ADD NOTHING to it. Tomorrow morning's first-steps reading decides whether the dose was tolerated."};
}

/* Gate 1 is a START-AND-STOP gate. Gate 2 is a PROGRESSION gate. They were
   never in conflict — they answer different questions. A 2/10 during Tuesday's
   run does not veto Wednesday; Tuesday's dose is adjudicated by Wednesday
   morning's first steps, and that is Gate 2's job alone.
   What WAS mis-specified was Gate 1's threshold: a flat number cannot tell the
   MTSS warm-up pattern from the stress-injury pattern, and the strict reading
   would have forbidden the run that produced the 13:06 — the single most
   valuable result of this preparation. The gate now reads SHAPE. */
/* The 24-hour rule — rated at first steps out of bed, before coffee,
   before walking it off. This is the term the old app was missing, and
   the one that would actually have caught the original injury. */
function morningGate(am){
  if(am==null)return{k:"unrated",c:"#606877",h:"NOT RATED",m:"Rate at first steps out of bed — before coffee, before walking it off."};
  if(am===0)return{k:"go",c:"#22c55e",h:"DOSE TOLERATED",m:"0/10 and no new tenderness. Yesterday's dose was tolerated — eligible to progress."};
  if(am<=2)return{k:"hold",c:"#f59e0b",h:"AT THE CEILING",m:"1–2/10 clearing within 30 min of moving. The dose is at your ceiling: repeat it, do NOT progress. A descending 4/10 that resolved during yesterday’s session and is clean-ish now is NOT a flare."};
  return{k:"back",c:"#f43f5e",h:"DOSE EXCEEDED",m:"Over 2/10, or lasting past 30 min, or new/expanded tenderness. Drop back one step to your last tolerated session and hold it for two sessions."};
}

/* ═══ v7 SHIN RULES — reported by exception (blue-line-prep/HANDOFF.md §6) ═══
   His call, 4 Nov 2026: no daily shin ratings. He opens the Shins card only
   when something hurts, and this reads what he entered there:
     carry    no pain, or 2/10 or less that fades in the first ten minutes
              and is gone the next morning
     backoff  3–4/10 during a run, pain that does not fade, or ANY shin pain
              at first steps the next morning
     stop     5/10 or more, pain that builds as he runs, or a warning sign
   The thresholds are expert opinion, not trial evidence (Moen 2012 allows
   under 4/10 for shin splints; bone-stress guidance wants no pain during,
   after or the next day — Warden 2021). Both agree next-day pain halts
   progression, which is why any morning pain is a back-off here.
   Returns null when nothing has been entered. */
function shinVerdict(pm,shape,am,flags){
  if(pm==null&&am==null&&!flags)return null;
  if(flags>0||(pm!=null&&pm>=5)||shape==="climbs")
    return{k:"stop",c:"#f43f5e",h:"STOP — NO RUNNING OR JUMPING",m:"5/10 or more, pain that builds as you run, or a warning sign. Bike and rower only, upper body as normal. See a sports-medicine doctor or physical therapist before you run again — this is the pattern that needs a bone stress injury ruled out. In the academy, tell the PT staff today."};
  if(pm!=null&&pm>0&&pm<3&&!shape&&!(am>0))
    return{k:"ask",c:"#606877",h:"WHAT DID IT DO?",m:"Say what the pain did over the first ten minutes — that decides it."};
  if((pm!=null&&pm>=3)||(pm>0&&shape&&shape!=="settles")||(am!=null&&am>0))
    return{k:"backoff",c:"#f59e0b",h:"BACK OFF",m:"Swap your next two runs to the bike at 1.5× the minutes. No fast running or jumps for 7 days — the app takes them out. When you run again, repeat the last pain-free week before you progress. Everything else carries on."};
  return{k:"carry",c:"#22c55e",h:"CARRY ON",m:(pm>0?"2/10 or less that faded in the first ten minutes. ":"No pain. ")+"Run as written and add nothing. If your shins hurt at first steps tomorrow morning, come back here and enter it."};
}
const isPainDay7=(pm,shape,am)=>{const v=shinVerdict(pm,shape,am,0);return !!v&&(v.k==="backoff"||v.k==="stop");};

/* v6.2 READINESS (nutrition/recovery review), rated at wake. The shin
   morning gate is separate and always wins. 0–1 green · 2–3 amber · 4+ red. */
function readinessOf(r){
  if(!r)return{k:"unrated",score:null};
  const sl=parseFloat(r.sleep), hr=parseFloat(r.rhr), so=parseFloat(r.sore);
  if(!(sl>0)&&!(hr>0)&&isNaN(so))return{k:"unrated",score:null};
  const base=r.base||52;
  const p=(sl>0?(sl>=7.5?0:sl>=6.5?1:2):0)+(hr>0?(hr-base<=3?0:hr-base<=7?1:2):0)+(!isNaN(so)?(so<=3?0:so<=6?1:2):0);
  return p<=1?{k:"green",score:p,c:"#22c55e",h:"GREEN — TRAIN AS WRITTEN",m:"Nothing to change."}
    :p<=3?{k:"amber",score:p,c:"#f59e0b",h:"AMBER — TRIM TODAY",m:"Maintenance calories today. Drop the PM conditioning (row, Z2, obstacle block). Lifts keep their load but lose one set, no extra reps. A hard bike becomes 30 min Z2."}
    :{k:"red",score:p,c:"#f43f5e",h:"RED — RECOVERY DAY",m:"Prehab battery plus a 20 min recovery spin or a walk, nothing else. Maintenance calories, carbs 4–5 g/kg, 8.5–9 h in bed. Two ambers in a row count as a red; three reds in 7 days pull the next deload forward."};
}

/* ═══ NUTRITION ═════════════════════════════════════════════════════════
   The binding constraint is energy availability, not the calorie target.
   Below ~30 kcal/kg FFM bone health is impaired directly — not an
   acceptable risk for someone whose #1 constraint is a bone-stress history.
   So the app computes both and shows which one actually binds. */
const LB=0.45359237;
/* NEAT tiers. Because exercise cancels out of the energy-availability
   equation (EA = (BMR·mult − deficit) / FFM — the exercise term appears in
   TDEE and is subtracted straight back out), NON-exercise activity is the
   ONLY thing that widens the deficit you can safely run. The "active" tier
   was added for v6 because 10k+ steps is the gate on the faster rate. */
const NEAT=[
  {k:"desk",  n:"Desk-bound · under 5k steps", m:1.30},
  {k:"light", n:"Light · 5–8k steps", m:1.375},
  {k:"target",n:"Plan target · 8–10k steps",   m:1.45},
  {k:"active",n:"Active · 10–12k steps",       m:1.50},
  {k:"high",  n:"High · 12k+ steps",           m:1.55},
];
/* Protein is HIS target, 200–220 g, not a formula. The v5 formula (2.4 g/kg
   FFM) lands ~180 g at his size; his number sits above it, and above is the
   safe side in a deficit with four lifting days. */
const PROTEIN_LO=200, PROTEIN_HI=220;
/* opt = {shin:"clear"|"symptomatic"|"flare", phase:"A"|"B"|"C", wk, taper, neatK}
   RULES THAT OVERRIDE THE ARITHMETIC — each one exists because the thing it
   protects outranks fat loss in the priority order:
     • rate 0.5 %BW/wk by default; 0.75 only with 10k+ steps AND a shin-clean
       7 days — the faster rate is earned by the two things that protect bone
     • shins symptomatic (any pain day in the last 7) → deficit ≤ 250 kcal
     • flare (trend rule, red flag, RTR, gate fail) → maintenance
     • test inside its taper window, arrival taper, first two academy weeks
       → maintenance: performance and adaptation first
     • rest of the academy → ≤ 250 kcal: performance first, fat loss second
     • training-burn number stale (>14 days) in the academy → maintenance
     • average sleep under 6.5 h → ≤ 250 kcal */
function nutrition(bwLb,bfPct,exKcal,mult,opt={}){
  if(!bwLb||!bfPct||isNaN(exKcal))return null;      // 0 kcal of training is a real answer, not a missing one
  const bw=bwLb*LB, ffm=bw*(1-bfPct/100);
  const bmr=370+21.6*ffm;                       // Katch-McArdle (needs FFM only)
  const tdee=bmr*(mult||1.375)+exKcal;
  const rate=w=>bwLb*w/100*3500/7;              // kcal/day for w% bodyweight/wk
  const fast=opt.shin==="clear"&&(opt.neatK==="active"||opt.neatK==="high");
  const wantPct=fast?0.75:0.5;
  const want=rate(wantPct);
  /* 30 is the hard floor; 33 is where we would rather sit. Honest framing
     (nutrition review): 30 is a female-derived threshold and male thresholds
     are probably lower and less certain — it stays as a CONSERVATIVE floor
     because a bone-stress history earns the margin. */
  const capHard=Math.max(0,tdee-(exKcal+30*ffm));
  const capPref=Math.max(0,tdee-(exKcal+33*ffm));
  let defLo=Math.min(want,capPref), defHi=Math.min(want,capHard);
  let cap=Infinity, why=null;
  if(opt.taper){cap=0;why="A test is inside its taper window — maintenance until it is done.";}
  /* v7: the deficit runs through Week 10 (to 19 Dec — it used to stop on
     14 Dec), then maintenance from the mock week through the first two
     academy weeks (20 Dec – 17 Jan). */
  else if(opt.phase==="B"){cap=0;why="Mock PFT and arrival weeks (20 Dec – 3 Jan) — maintenance. You are arriving fresh, not lighter.";}
  else if(opt.phase==="C"&&opt.wk<ACADEMY_WK+2){cap=0;why="First two academy weeks — maintenance while the body absorbs a load nobody here controls.";}
  /* Academy: a small deficit (≤300 kcal) while the shins are quiet — 14 days
     with no shin flag. Maintenance in any test window (handled above) and
     from 3 May. A deficit blunts muscle gain and about 500 kcal a day
     removes it on average (Murphy & Koehler 2022), so it stays small. */
  else if(opt.phase==="C"&&opt.wk>=30){cap=0;why="Graduation block (from 3 May) — maintenance, carbs up.";}
  else if(opt.phase==="C"&&!opt.gateOK){cap=0;why="Academy: maintenance until you have gone 14 days with no shin flag. Then a small deficit (300 kcal at most) comes back.";}
  else if(opt.phase==="C"){cap=300;why="Academy, shins quiet — a small deficit at most (300 kcal). Performance first.";}
  /* A training-burn number entered once in October is wrong by March: academy
     PT raises the real burn, so a stale figure silently deepens the deficit
     and drops true EA under the floor (nutrition review). In the academy a
     stale number means maintenance until it is updated. */
  if(opt.exStale&&cap>0){cap=0;why="Training burn not updated in 14+ days — maintenance until you update it above.";}
  /* Short sleep in a deficit shifts the loss from fat to muscle (Nedeltcheva
     2010) and is linked to injury (Milewski 2014). */
  /* v6.2: a 7-day MEAN from the nightly readiness log (falls back to the
     typed average). Under 7.0 h → ≤250; under 6.5 h → maintenance. */
  if(opt.sleep!=null&&opt.sleep>0&&opt.sleep<6.5&&cap>0){cap=0;why="Sleep averaging under 6.5 h this week — maintenance. In a deficit, short sleep takes the loss from muscle, not fat.";}
  else if(opt.sleep!=null&&opt.sleep>0&&opt.sleep<7&&cap>250){cap=250;why="Sleep averaging under 7 h this week — deficit capped at 250 kcal.";}
  if(opt.shin==="flare"){cap=0;why="Shin flare active — maintenance. Low energy availability is the single most modifiable driver of MTSS becoming a fracture.";}
  else if(opt.shin==="symptomatic"&&cap>250){cap=250;why="Shin symptoms in the last 7 days — deficit capped at 250 kcal until a clean week.";}
  defLo=Math.min(defLo,cap); defHi=Math.min(defHi,cap);
  if(defLo>defHi)defLo=defHi;
  const ea=d=>(tdee-d-exKcal)/ffm;
  const lbWk=d=>d*7/3500;
  const eaCapped=want>capHard;
  /* The trend warning is tied to the phase's own target (nutrition review):
     v6.0 warned only past 1%/wk, which at 245 lb is a ~1,225 kcal/day
     deficit and EA ≈ 22 — far under his own floor before it fired. */
  const warnPct=cap===0?0.3:cap<=250?0.5:0.7;
  /* Macros past protein: fat ≥0.7 g/kg bodyweight, carbs get the rest — and
     the rest should lean toward run, PT and test days (≥3 g/kg there). */
  const intakeMid=tdee-(defLo+defHi)/2;
  const fatG=Math.round(0.7*bw), protMid=(PROTEIN_LO+PROTEIN_HI)/2;
  const carbG=Math.max(0,Math.round((intakeMid-protMid*4-fatG*9)/4));
  return{
    ffmKg:ffm,ffmLb:ffm/LB,bmr,tdee,exKcal,mult:mult||1.375,
    gainAtHigh:Math.round((bmr*1.55-30*ffm)*7/3500*10)/10,
    maxPct:(lbWk(capHard)/bwLb*100).toFixed(2),
    /* The EA-floor ceiling at each step tier, computed — v6.1 hard-coded
       "0.5–0.68%" in copy that also shows at the light tier, where the
       real ceiling is ~0.40%. */
    tierPct:Object.fromEntries(NEAT.map(t=>[t.k,(Math.max(0,bmr*t.m-30*ffm)*7/3500/bwLb*100).toFixed(2)])),
    intakeLo:Math.round(tdee-defHi),intakeHi:Math.round(tdee-defLo),
    defLo:Math.round(defLo),defHi:Math.round(defHi),
    eaLo:ea(defHi),eaHi:ea(defLo),
    proteinLo:PROTEIN_LO,proteinHi:PROTEIN_HI,proteinMeal:Math.round((PROTEIN_LO+PROTEIN_HI)/2/4),
    gPerKgFfm:(PROTEIN_LO/ffm).toFixed(1)+"–"+(PROTEIN_HI/ffm).toFixed(1),
    fatG,carbG,carbHard:Math.max(Math.round(3*bw),carbG+50),   // hard days must sit ABOVE the daily average, never below it
    /* v6.2 carb tiers by day type, g/kg bodyweight (ACSM / Burke). */
    carbTiers:{double:[Math.round(4.5*bw),Math.round(5.5*bw)],pt:[Math.round(4.5*bw),Math.round(5.5*bw)],train:[Math.round(3.5*bw),Math.round(4*bw)],rest:[Math.round(2.5*bw),Math.round(3*bw)]},
    lossLo:lbWk(defLo).toFixed(1),lossHi:lbWk(defHi).toFixed(1),
    pctLo:(lbWk(defLo)/bwLb*100).toFixed(2),pctHi:(lbWk(defHi)/bwLb*100).toFixed(2),
    wantPct,wantLb:lbWk(want).toFixed(1),fast,warnPct,
    capped:eaCapped,override:why,
    binding:why?"Rule override — "+why:eaCapped?`Energy availability — at a 30 kcal/kg floor your ceiling is ${(lbWk(capHard)/bwLb*100).toFixed(2)}%/wk, under the ${wantPct}% target`:`Rate target (${wantPct}%/wk)`,
  };
}
/* ── bodyweight trend ─────────────────────────────────────────────────────
   Trend, not noise. The LINE is a time-weighted exponential average
   (≈10-day window) seeded from the mean of the first three readings, so one
   odd first morning does not bend it for weeks. The RATE is the least-
   squares slope of the raw readings over the last 21 days, once there are
   at least 6 of them and they span ≥14 days — the EMA-difference rate v6.0
   used lags two to three weeks behind a real change (nutrition review).
   Until then there is no rate verdict: early water and glycogen loss would
   make any verdict wrong. */
/* resumes = dates a deficit (re)started. The first 7 days after the log
   starts, or after a deficit resumes, are mostly water and glycogen — a
   simulated 3 lb water drop on a true 0.5%/wk loss read −0.97%/wk at day 14
   and told him to eat more while he was exactly on target (nutrition
   review). Those days are left out of the RATE; the line still shows them. */
function weightTrend(ws,resumes){
  const pts=ws.filter(x=>x&&x.iso&&x.bw).map(x=>({iso:x.iso,bw:+x.bw,t:+parseISO(x.iso)})).sort((a,b)=>a.t-b.t);
  if(!pts.length)return null;
  const seed=pts.slice(0,3);
  let tr=seed.reduce((a,p)=>a+p.bw,0)/seed.length;
  pts.forEach((p,i)=>{if(i){const dd=Math.max(0,(p.t-pts[i-1].t)/86400000);tr+= (1-Math.exp(-dd/10))*(p.bw-tr);}p.tr=tr;});
  const last=pts[pts.length-1];
  const starts=[pts[0].t,...(resumes||[]).map(d=>+d)].filter(t=>t<=last.t);
  const cut=Math.max(...starts)+7*86400000;
  const win=pts.filter(p=>(last.t-p.t)/86400000<=21&&p.t>=cut);
  let pctWk=null,lbWk=null;
  const span=win.length?(last.t-win[0].t)/86400000:0;
  if(win.length>=6&&span>=14){
    const xs=win.map(p=>(p.t-win[0].t)/86400000), ys=win.map(p=>p.bw);
    const mx=xs.reduce((a,b)=>a+b,0)/xs.length, my=ys.reduce((a,b)=>a+b,0)/ys.length;
    const sxy=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0), sxx=xs.reduce((a,x)=>a+(x-mx)*(x-mx),0);
    if(sxx>0){lbWk=sxy/sxx*7;pctWk=lbWk/my*100;}
  }
  return{pts,trend:last.tr,pctWk,lbWk,first:pts[0],n:win.length};
}

/* ── store migration ──────────────────────────────────────────────────────
   v5 → v6: every week-keyed map shifts −7 weeks (see V5_SHIFT), scores and
   weights get their week recomputed from their own date where it parses,
   the single testDate becomes the first entry of the test list, and the
   speed-ladder step is dropped (the ladder no longer exists). blp-v5 is
   left in place, untouched, as a rollback copy.
   v4 → v6: the v4 path carried only scores and bodyweights, and still does. */
const shiftKey=k=>{const m=/^(-?\d+)-(.*)$/.exec(k);return m?`${Number(m[1])-V5_SHIFT}-${m[2]}`:k;};
const shiftMap=o=>Object.fromEntries(Object.entries(o||{}).map(([k,v])=>[shiftKey(k),v]));
const dateToIso=s=>{if(!s)return null;if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const d=new Date(s);return isNaN(d)?null:isoOf(d);};
const fixDated=(arr,shift)=>(arr||[]).map(x=>{
  const iso=x.iso||dateToIso(x.date);
  const week=iso?weekOfDate(parseISO(iso)):(x.week!=null?x.week-shift:null);
  return{...x,iso,week};
});
function migrateV5(d){
  const runLog={};
  Object.entries(d.runLog||{}).forEach(([k,v])=>{runLog[String(Number(k)-V5_SHIFT)]=v;});
  return{
    v:6,migratedFrom:"blp-v5",migratedAt:new Date().toISOString(),
    done:shiftMap(d.done),pmPain:shiftMap(d.pmPain),pmShape:shiftMap(d.pmShape),
    amPain:shiftMap(d.amPain),flags:shiftMap(d.flags),subs:shiftMap(d.subs),
    rtr:d.rtr??null,screen:d.screen||null,body:d.body||null,
    scores:fixDated(d.scores,V5_SHIFT),weights:fixDated(d.weights,V5_SHIFT),
    efforts:fixDated(d.efforts,V5_SHIFT),runLog,
    tests:d.testDate?[{date:d.testDate,label:"Carried over from v5"}]:[],
    lifts:[],acad:{},acadAssume:ACAD_ASSUME_DEFAULT,
  };
}
function migrateV4(d){
  return{v:6,migratedFrom:"blp-v4",migratedAt:new Date().toISOString(),
    scores:fixDated(d.scores,0),weights:fixDated(d.weights,0)};
}

function Spark({pts}){
  if(!pts||pts.length<2)return null;
  const W=320,H=76,P=6;
  const t0=pts[0].t,t1=pts[pts.length-1].t||t0+1;
  const vals=pts.flatMap(p=>[p.bw,p.tr]);
  const lo=Math.min(...vals)-0.5,hi=Math.max(...vals)+0.5;
  const X=t=>P+(W-2*P)*(t1===t0?0.5:(t-t0)/(t1-t0));
  const Y=v=>P+(H-2*P)*(1-(v-lo)/(hi-lo));
  return(
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} style={{display:"block"}} role="img" aria-label="bodyweight trend">
      {pts.map((p,i)=><circle key={i} cx={X(p.t)} cy={Y(p.bw)} r="2.2" fill="rgba(255,255,255,.28)"/>)}
      <polyline fill="none" stroke="#4ade80" strokeWidth="2.4" strokeLinejoin="round" strokeLinecap="round"
        points={pts.map(p=>`${X(p.t).toFixed(1)},${Y(p.tr).toFixed(1)}`).join(" ")}/>
    </svg>
  );
}

  const[tests,setTests]=useState([]);

  const[newTestLbl,setNewTestLbl]=useState("");
  const[lifts,setLifts]=useState([]);         // [{iso,week,k,wt,reps}]

  const[liftRpe,setLiftRpe]=useState("");

  const[acadForm,setAcadForm]=useState({type:ACAD_TYPES[0],dur:"",run:"",rpe:"",dt:"",pu:"",jumps:"",shoes:"PT shoes"});

  const last7=useMemo(()=>{const t=todayMid(),o=[];for(let i=0;i<7;i++){const d=new Date(t);d.setDate(d.getDate()-i);const w=weekOfDate(d),dd=(daysBetween(START,d)%7+7)%7;const r=ready[B(w,dd)];if(r)o.push(r);}return o;},[ready]);
  const sleepMean=useMemo(()=>{const v=last7.map(r=>parseFloat(r.sleep)).filter(x=>x>0);return v.length>=3?v.reduce((a,b)=>a+b,0)/v.length:null;},[last7]);
  const sleepUse=sleepMean!=null?sleepMean:(sleepFresh?parseFloat(body.sleep):null);
  /* 14 shin-clean days, for the academy's gated deficit. */
  const clean14=useMemo(()=>{let w=weekOfDate(todayMid()),d=(daysBetween(START,todayMid())%7+7)%7;for(let i=0;i<14;i++){const k=B(w,d);if(Math.max(pmPain[k]??0,amPain[k]??0)>0)return false;d--;if(d<0){d=6;w--;}}return true;},[pmPain,amPain]);
  const greenDays=last7.filter(r=>readinessOf(r).k==="green").length;
  /* v7: the academy's small deficit needs only 14 days with no shin flag.
     Sleep still caps it through the separate sleep rule when he logs it. */
  const gateOK=clean14&&shin==="clear";
  const nutri=useMemo(()=>nutrition(parseFloat(body.bw),parseFloat(body.bf),parseFloat(body.ex),(NEAT.find(x=>x.k===body.neat)||NEAT[1]).m,
    {shin,phase:getPhase(Math.max(1,realWk)).id,wk:realWk,taper:testInWindow14,neatK:body.neat,exStale,sleep:sleepUse,gateOK}),[body,shin,realWk,testInWindow14,exStale,sleepUse,gateOK]);
  const warnPct=nutri?nutri.warnPct:0.7;
  /* Deficit (re)starts on this calendar: Week 1, and Week 15 after the
     academy's two maintenance weeks. */
  const wt=useMemo(()=>weightTrend(weights,[START,dateOf(ACADEMY_WK+2,0)]),[weights]);

  const tStat=useMemo(()=>({
    am:{done:tracks.am.filter(k=>done[k]).length,total:tracks.am.length},
    pm:{done:tracks.pm.filter(k=>done[k]).length,total:tracks.pm.length},
  }),[tracks,done]);
  const totalItems=tracks.all.length;
  const pct=totalItems?Math.round(tracks.all.filter(k=>done[k]).length/totalItems*100):0;

  const streak=useMemo(()=>{
    let s=0,w=week,d=dow;
    for(let i=0;i<300;i++){
      const t=trackKeys(w,d,dtf(w,d),ctx);
      if(t.pre)break;
      const c=t.all.filter(k=>done[k]).length;
      const pass=t.all.length===0||c/t.all.length>=0.75;
      if(pass)s++;else if(!(w===week&&d===dow))break;
      d--;if(d<0){d=6;w--;}
      if(w<1)break;
    }
    return s;
  },[week,dow,done,ctx,dtf]);

  const weekDots=useMemo(()=>DAYS.map((_,d)=>{
    const t=trackKeys(week,d,dtf(week,d),ctx);
    if(t.pre)return"pre";
    if(!t.all.length)return"rest";
    const ratio=t.all.filter(k=>done[k]).length/t.all.length;
    return ratio>=0.8?"full":ratio>0?"part":"empty";
  }),[week,done,ctx,dtf]);

  const toggle=k=>setDone(p=>({...p,[k]:!p[k]}));
  const flip=k=>setOpenItems(p=>({...p,[k]:!p[k]}));
  const nowStamp=()=>{const t=todayMid();return{date:t.toLocaleDateString(),iso:isoOf(t),week:weekOfDate(t)};};

  const addScore=()=>{
    const pu=parseInt(logPU)||null,su=parseInt(logSU)||null,run15=logRun.trim()||null,t300=log300.trim()||null;
    const puSp=logPUsp.trim()||null,suSp=logSUsp.trim()||null;
    if(!pu&&!su&&!run15&&!t300)return;
    const st=nowStamp();
    if(t300&&st.week<ACADEMY_WK){
      if(effortsUsed>=MAX_300_EFFORTS&&!window.confirm(`You have already spent both full-effort 300m tokens before the academy (${effortsUsed}/${MAX_300_EFFORTS}). Bone fatigue life falls exponentially with strain magnitude, which is why the cap exists. Log this anyway?`))return;
      setEfforts(p=>[...p,{...st,t300}]);
    }
    setScores(p=>[...p,{...st,pushups:pu,situps:su,run15,t300,puSp,suSp}]);
    setLogPU("");setLogSU("");setLogRun("");setLog300("");setLogPUsp("");setLogSUsp("");
  };
  const addWeight=()=>{
    const bw=parseFloat(logBW);
    if(!bw)return;
    setWeights(p=>[...p,{...nowStamp(),bw}]);
    /* A weigh-in holds fat-free mass constant and re-derives body fat from it.
       v6.1 kept BF% fixed, which silently counted 68% of every pound lost as
       lean mass — ~3 kg of phantom FFM loss by December, which puts true
       energy availability under the floor the app thinks it is holding. */
    setBody(p=>{const obw=parseFloat(p.bw),obf=parseFloat(p.bf);
      if(obw&&obf){const ffm=obw*(1-obf/100);return{...p,bw:String(bw),bf:String(Math.max(5,Math.round((1-ffm/bw)*1000)/10))};}
      return{...p,bw:String(bw)};});
    setLogBW("");
  };
  const addLift=()=>{
    const wtv=parseFloat(liftWt),r=parseInt(liftReps);
    if(!wtv||!r){window.alert("Enter the weight and the reps of your last set.");return;}
    /* Asked as "reps left in the tank" (0–5) — plainer than RPE, same
       information: RPE = 10 − reps left. */
    const left=parseFloat(liftRpe);
    if(!(left>=0&&left<=5)){window.alert("Add how many more reps you could have done on that set (0–5). Without it the app cannot tell a hard set from an easy one, and your loads would drift down.");return;}
    const rpe=10-left;
    if(r>10&&!window.confirm("e1RM estimates are unreliable past 10 reps. Log anyway?"))return;
    const reNow=reentryOf(missStreakBefore(status,todayMid()));
    setLifts(p=>[...p,{...nowStamp(),k:liftK,wt:wtv,reps:r,rpe,...(reNow&&reNow.lift&&(reNow.lift.p||reNow.lift.t)?{re:true}:{})}]);
    setLiftWt("");setLiftReps("");setLiftRpe("");
    setLiftSaved(Date.now());setTimeout(()=>setLiftSaved(0),3000);
  };
  const addAcad=()=>{
    const f=acadForm;
    if(!f.dur&&!f.run)return;
    setAcad(p=>({...p,[b]:[...(p[b]||[]),{type:f.type,dur:+f.dur||0,run:+f.run||0,rpe:+f.rpe||0,dt:+f.dt||0,pu:+f.pu||0,jumps:+f.jumps||0,shoes:f.shoes}]}));
    setAcadForm(x=>({...x,dur:"",run:"",rpe:"",dt:"",pu:"",jumps:""}));
  };
  const delAcad=i=>setAcad(p=>({...p,[b]:(p[b]||[]).filter((_,j)=>j!==i)}));
  /* ── v7: the back-off rule's first step. It writes "bike" into the same
     per-day swap store the Swap card uses, so the change is visible on those
     days, survives a reload and can be undone with one tap. If today's pain
     was during a run, today's run is already done and the count starts
     tomorrow; if it was only this morning's first steps, it starts today. ── */
  const swapNextRuns=n=>{
    const out=[];let w=week,d=dow;
    if(pmVal!=null&&pmVal>0){d++;if(d>6){d=0;w++;}}
    for(let i=0;i<14&&out.length<n&&w<=TOTAL_WEEKS;i++){
      const p=buildDay(w,d,dtf(w,d),{...ctx,sub:null,status:null,runCaps:null});
      if(!p.rest&&!p.pre&&p.am.some(x=>RUNIDS.includes(x.id)))out.push([w,d]);
      d++;if(d>6){d=0;w++;}
    }
    if(!out.length)return;
    setSubs(x=>{const o={...x};out.forEach(([a,c])=>{o[B(a,c)]="bike";});return o;});
    setSwapMsg("Swapped to the bike: "+out.map(([a,c])=>`${DAYS[c]} ${fmtDate(dateOf(a,c))}`).join(" and ")+". Undo either one from Swap The Run on that day.");
  };

  /* ── v7: backup. His history lives in this browser's storage and nowhere
     else, so it can be saved to a file (or the clipboard) and restored. ── */
  const exportData=async()=>{
    const txt=JSON.stringify(snap()), name=`blue-line-prep-backup-${isoOf(todayMid())}.json`;
    try{
      const file=new File([txt],name,{type:"application/json"});
      if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Blue Line Prep backup"});setBackupMsg("Backup shared — save it to Files or email it to yourself.");return;}
    }catch(e){if(e&&e.name==="AbortError")return;}
    try{
      const url=URL.createObjectURL(new Blob([txt],{type:"application/json"}));
      const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      setBackupMsg(`Saved ${name} to your downloads.`);
    }catch{setBackupMsg("Could not save a file here — use Copy instead.");}
  };
  const copyData=async()=>{
    try{await navigator.clipboard.writeText(JSON.stringify(snap()));setBackupMsg("Copied. Paste it into a note or an email to yourself.");}
    catch{setBackupMsg("Copy was blocked by the browser — use Export instead.");}
  };
  const importData=file=>{
    if(!file)return;
    const rd=new FileReader();
    rd.onload=()=>{
      let d=null;
      try{d=JSON.parse(String(rd.result||""));}catch{d=null;}
      if(!d||typeof d!=="object"||d.v!==6){window.alert("That file is not a Blue Line Prep backup.");return;}
      if(!window.confirm("Replace everything on this device with this backup? This cannot be undone."))return;
      clearTimeout(saveRef.current);
      if(storage.set(STORE,JSON.stringify(d)))window.location.reload();
      else window.alert("The backup could not be written to this device.");

    rd.readAsText(file);

  const addTest=()=>{

    setLifts([]);setAcad({});setTests([]);setRunLog({...SEED_RUNLOG});   // wiping progress must not delete measured history
    setReady({});setStatus({});setRunAct({});
    storage.delete(STORE);

  if(!loaded)return(

      <div style={{width:120,height:2,background:"linear-gradient(90deg,transparent,#3b82f6,transparent)"}}/>
      <div style={{fontSize:11,letterSpacing:".2em",color:"var(--tx-3)"}}>LOADING…</div>
    </div>
  );

  const ringColor=pct>=80?"#22c55e":pct>=40?ph.color:"#4b5563";
  const dayDate=dateOf(week,dow);
  const screenWall=plan.impact&&plan.taper!=null&&!screenDone;
  const sBad=!!sVerdict&&(sVerdict.k==="backoff"||sVerdict.k==="stop");
  const blockedForImpact=plan.impact&&(iGate.k==="stop"||iGate.k==="swap"||flagsHit>0||screenWall||sBad);
  const acadDayBlocked=isAcademy(week)&&dow<=4&&(iGate.k==="stop"||iGate.k==="swap"||flagsHit>0||mGate.k==="back"||trend>=3||sBad);
  const daysToAcademy=daysBetween(todayMid(),dateOf(ACADEMY_WK,0));
  const latest=k=>{const r=[...scores].reverse().find(x=>x[k]!=null&&x[k]!=="");return r?r[k]:null;};
  /* v6.3: past days (last 9) with a run, lift or test, no status and nothing
     ticked — he is asked, never assumed to have missed them. */
  const KEYIDS=[...RUNIDS,...LIFT_IDS,"suAmrap","puAmrap","pz"];
  const unresolved=(()=>{const o=[],t=todayMid();for(let i=1;i<=9;i++){const d=new Date(t);d.setDate(d.getDate()-i);const w=weekOfDate(d),dd=(daysBetween(START,d)%7+7)%7;if(w<NEW_FROM)continue;const k=B(w,dd);if(status[k])continue;
    const p=buildDay(w,dd,dtf(w,dd),{...ctx,status:null,runCaps:null});if(p.rest||p.pre)continue;const items=[...p.am,...p.pm];if(!items.some(x=>KEYIDS.includes(x.id)))continue;
    const tk=trackKeys(w,dd,dtf(w,dd),ctx);if(tk.all.some(x=>done[x]))continue;o.push({w,d:dd,k,date:d,label:p.label});}return o;})();
  const isPastOrToday=dayDate<=todayMid();

  return(
    <div className="app">

      <header className="hero">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:14}}>
          <div style={{minWidth:0,flex:1}}>
            <div className="brand">BLUE LINE PREP</div>
            <div style={{display:"flex",alignItems:"flex-end",gap:11,marginTop:12}}>
              <span className="dayname">{DAYS[dow].toUpperCase()}</span>
              <div style={{paddingBottom:2}}>
                <div className="metaline">{plan.taper!=null?(plan.taper===0?"TEST DAY":`T−${plan.taper}`):wkLabel(week)}</div>
                <div className="metasub">{fmtDate(dayDate).toUpperCase()} · {plan.rest?(isAcademy(week)?"RANGE DAY":"REST"):ph.name.toUpperCase()}</div>
              </div>
            </div>

              <TrackBar label={isAcademy(week)&&dow<=4?"EVENING":isV7(week)?"THEN":"PM"} done={tStat.pm.done} total={tStat.pm.total} color="#22d3ee"/>
            </div>
          ):(
            <div style={{background:"rgba(255,255,255,.045)",border:"1px solid var(--line)",borderRadius:12,padding:"12px 14px",fontSize:13,color:"var(--tx-2)",lineHeight:1.55}}>{isAcademy(week)?"Range day. No supplemental training — the screen below is five minutes and it is the one thing worth doing.":"Genuine full rest. One per week, every week — sameness is its own injury risk factor, and this is the day that breaks it up."}</div>

            {plan.taper!=null&&<Pill label={plan.taper===0?"⭐ TEST DAY":`TAPER · T−${plan.taper}`} color="#f43f5e"/>}
            {plan.mock&&<Pill label="MOCK PFT" color="#f43f5e"/>}
            {plan.retest&&<Pill label={isV7(week)?"60-SECOND MAX":"AMRAP RETEST"} color="#a855f7"/>}
            {plan.dl&&<Pill label={isV7(week)?"Light run week":"🔄 Deload"} color="#22d3ee"/>}
            {plan.impact&&<Pill label="IMPACT DAY" color="#f4640a"/>}
          </div>
          <div className="save" style={{color:saveState==="error"||loadErr?"#fb7185":saveState==="saved"?"#4ade80":"var(--tx-3)"}}>
            {loadErr?"not saving":saveState==="saving"?"saving…":saveState==="saved"?"saved ✓":saveState==="error"?"save failed":""}
          </div>
        </div>
      </header>

      <div className="daybar">
        <button className="arr" onClick={()=>setWeek(Math.max(1,week-1))} disabled={week<=1} aria-label="previous week">‹</button>
        <div className="days">

            <button key={d} className={"day"+(i===dow?" on":"")} disabled={weekDots[i]==="pre"}
                    style={weekDots[i]==="pre"?{opacity:.3,cursor:"default"}:null} onClick={()=>setDow(i)}>
              <span className="day-t">{d}</span>
              <span className="dot" style={{background:weekDots[i]==="pre"?"transparent":weekDots[i]==="full"?"#22c55e":weekDots[i]==="part"?"#f59e0b":weekDots[i]==="rest"?"transparent":(i===dow?"rgba(0,0,0,.18)":"rgba(255,255,255,.14)")}}/>
            </button>

        </div>
        <button className="arr" onClick={()=>setWeek(Math.min(TOTAL_WEEKS,week+1))} disabled={week>=TOTAL_WEEKS} aria-label="next week">›</button>
      </div>

      {/* ══════════ TODAY ══════════ */}
      {tab==="today"&&(
        <div className="pane" key="today">

          {loadErr&&(
            <div style={{marginBottom:12}}>
              <Note color="#f43f5e"><strong className="k" style={{color:"#fb7185"}}>Saved data could not be read.</strong> Nothing will be saved this session, so your stored data is not overwritten. Your data is still on this device.</Note>
            </div>
          )}

          {migNote&&(
            <div style={{marginBottom:12}}>
              <Note color="#22c55e">
                <strong className="k" style={{color:"#4ade80"}}>Your {migNote} data was carried over.</strong> Pain history, flags, scores, bodyweights, the run log and the screen are all here, re-dated onto the new calendar. The old copy is kept untouched on this device.
              </Note>
            </div>
          )}

          {unresolved.length>0&&(
            <div style={{marginBottom:12}}>
              <Note color="#22d3ee">
                <strong className="k" style={{color:"#67e8f9"}}>Did these happen?</strong> Unmarked days count as done. If one didn't happen, mark it so the rest of the week and next week's running adjust.
                {unresolved.map(u=>(
                  <div key={u.k} style={{display:"flex",alignItems:"center",gap:6,marginTop:8,flexWrap:"wrap"}}>
                    <span style={{flex:"1 1 140px",fontSize:12.5}}><strong style={{color:"var(--tx)"}}>{DAYS[u.d]} {fmtDate(u.date)}</strong> · {u.label}</span>
                    {[["done","Done"],["skipped","Skipped"],["sick","Sick"]].map(([v,n])=>(
                      <button key={v} className="btn-ghost" style={{padding:"6px 10px"}} onClick={()=>setStatus(p=>({...p,[u.k]:v}))}>{n}</button>))}
                  </div>
                ))}
              </Note>
            </div>
          )}

          {plan.adjust&&plan.adjust.length>0&&(
            <div style={{marginBottom:12}}>
              <Note color="#22d3ee">
                <strong className="k" style={{color:"#67e8f9"}}>Today is adjusted.</strong>
                {plan.adjust.map((a,i)=><span key={i} style={{display:"block",marginTop:6}}>• {a}</span>)}
              </Note>
            </div>
          )}

          {t0.pre&&week===1&&(
            <div style={{marginBottom:12}}>
              <Note color="#f59e0b">
                <strong className="k" style={{color:"#fbbf24"}}>Week 1 opens Monday 12 October — this is a preview of day one.</strong> Monday is the TRUE baseline: your 9/21 push-ups and sit-ups were stopped at the standard, so nobody knows your max yet. Before then: <strong style={{color:"var(--tx)"}}>buy the duty boots if you don't have them</strong> (break-in starts Week 1), and enter bodyweight and body fat on the Fuel tab.
              </Note>
            </div>
          )}

          {plan.taper!=null&&(
            <div style={{marginBottom:12}}>
              <Note color="#f43f5e">
                <strong className="k" style={{color:"#fb7185"}}>Taper active — the written day is suspended.</strong> Nothing you add now produces adaptation; it produces fatigue. <strong style={{color:"var(--tx)"}}>The taper is not the last chance to get fitter. It is the only chance to arrive un-tired.</strong>{isAcademy(week)?<> Inside the academy the taper only cuts <em>your</em> work — the academy's PT still happens and still counts.</>:<> Volume comes down; <strong style={{color:"var(--tx)"}}>frequency and intensity do not.</strong></>}<br/><br/>
                <strong style={{color:"var(--tx)"}}>Nothing new.</strong> No movement, shoe, supplement or caffeine protocol you have not already used. <strong style={{color:"var(--tx)"}}>Maintenance calories</strong> until the test is done.

              </Note>

          {/* ── v7: shin status. Shown only when there is something to say —
              nothing to rate on a normal day. ── */}
          {trend>=3&&(

              </Note>

              <Note color="#f43f5e">
                <strong className="k" style={{color:"#fb7185"}}>Two shin flags in 14 days.</strong> Running drops to 70% of your last full week and is all easy for two weeks. No fast running, no jumps. The calorie deficit is paused until the shins have been quiet for 14 days.
              </Note>
            </div>
          )}
          {trend>0&&trend<3&&!twice14&&(
            <div style={{marginBottom:12}}>
              <Note color="#f59e0b">
                <strong className="k" style={{color:"#fbbf24"}}>Shin flag in the last 7 days.</strong> Goal-pace reps, time trials and jumps are out until seven days have passed without one. Easy runs carry on; use Swap The Run on any day you would rather ride.
              </Note>
            </div>
          )}
          {trend<3&&holds>=3&&(
