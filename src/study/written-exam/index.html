pproval is the only way; being official business is not enough by itself."},{"id":"rp-039","section":"reading","subtype":"true-false","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-08","stem":"According to the passage, a person who is being given emergency help may ride in a department vehicle without a supervisor's approval.","choices":["True","False"],"answer":0,"fixed":true,"explanation":"Non-employees need a supervisor's approval to ride in a department vehicle, except a prisoner or a person who is being given emergency help. The exception covers this rider."},{"id":"rp-040","section":"reading","subtype":"summary","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-08","stem":"Which of the following statements is accurate according to the passage?","choices":["A detective on call may take an unmarked car home on any night if the detective lives within 15 miles of the station.","An officer must inspect an assigned marked car and note any damage on the vehicle log before driving it.","Marked patrol cars may never be driven outside the township.","Every department vehicle must be refueled at the end of every shift.","The policy is meant to lower the township's insurance costs."],"answer":1,"fixed":false,"explanation":"The inspection-and-log requirement is stated directly. The other statements overreach: taking a car home is limited to certain nights, marked cars may leave the township in three situations, refueling is required only below one-quarter tank, and insurance costs are never mentioned."},{"id":"rp-041","section":"reading","subtype":"definition-match","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-09","stem":"Which of the following reports best illustrates the classification Suspended?","choices":["A woman reports her car stolen from a Stonebridge store lot. Officers find it two rows away, where she had parked it and forgotten.","A camera at a Stonebridge bakery records a man breaking the front window. He is identified from the video and arrested the next day.","A Stonebridge man identifies the coworker who took his jacket from the break room, then tells the detective he has chosen not to go forward. No arrest is made.","A Stonebridge resident reports that her purse was stolen while she was shopping in Elk Run Borough. The report is sent to the Elk Run police.","A bicycle is stolen from a rack on a Stonebridge street. The detective checks nearby cameras and interviews two witnesses, but no suspect is identified and no leads remain."],"answer":4,"fixed":false,"explanation":"Suspended applies when the incident happened in Stonebridge, every lead has been followed and no suspect has been identified, as with the bicycle theft. In the jacket case a suspect was identified, so it is Victim Declined."},{"id":"rp-042","section":"reading","subtype":"definition-match","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":"stim-rp-09","stem":"Which of the following reports best illustrates the classification Victim Declined?","choices":["A Stonebridge shop owner identifies the man who took cash from the register. The owner hesitates but decides to go forward, and the man is arrested.","A wallet is taken from a locker at a Stonebridge gym. The detective reviews the sign-in sheet and speaks with staff, but no suspect is identified and no leads remain.","A Stonebridge homeowner's camera shows a neighbor breaking her garden statue. The neighbor is identified, but the homeowner chooses not to go forward and no arrest is made.","A Stonebridge resident reports that his shed was broken into. The investigation shows that wind blew the door open and nothing was taken or damaged.","A man reports that his truck was damaged while it was parked at a ball field in Dunmore Township. The report is sent to the Dunmore Township police."],"answer":2,"fixed":false,"explanation":"Victim Declined requires an identified suspect and no arrest because the victim chose not to go forward, which matches the garden statue report. The shop owner only hesitated; he went forward and the man was arrested, so that report is Arrest Made."},{"id":"rp-043","section":"reading","subtype":"definition-match","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-rp-09","stem":"A Stonebridge resident reports that $200 was stolen from her kitchen drawer. The investigation shows that she had moved the money to another drawer herself and that nothing was taken. Under the definitions, this report should be classified as","choices":["No Incident","Arrest Made","Victim Declined","Suspended","Transferred"],"answer":0,"fixed":true,"explanation":"The investigation shows that the reported theft did not happen, which is the definition of No Incident. It is not Suspended, because that classification applies only when the incident did happen."},{"id":"rp-044","section":"reading","subtype":"definition-match","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":"stim-rp-09","stem":"Which of the following reports best illustrates the classification Transferred?","choices":["A visitor from Harlow City reports that her phone was stolen at a Stonebridge cafe. A suspect is identified from video and arrested.","Tools are taken from an unlocked truck on a Stonebridge street. There are no witnesses or cameras, every lead is followed and no suspect is identified.","A Stonebridge landlord identifies the former tenant who broke a window, then chooses not to go forward. No arrest is made.","A Stonebridge resident reports that his car was broken into while it was parked at a train station in Harlow City. The report is sent to the Harlow City police.","A Stonebridge resident reports a prowler in her yard. The investigation shows that she saw a utility worker reading the meter and that no prowling took place."],"answer":3,"fixed":false,"explanation":"Transferred depends on where the incident happened, not where the person lives: the break-in happened in Harlow City and the report was sent there. The visitor from Harlow City was a victim of a theft inside Stonebridge that ended in an arrest, so that report is Arrest Made."},{"id":"rp-045","section":"reading","subtype":"definition-match","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-09","stem":"Which of the following reports best illustrates the classification Arrest Made?","choices":["A suspect in a Stonebridge bicycle theft is identified from fingerprints, but the owner chooses not to go forward and no arrest is made.","A witness gives the plate number of a car that knocked down a Stonebridge street sign and drove off. The driver is identified and arrested.","A detective has a description of a man in a gray sweatshirt who took a lawn mower from a Stonebridge yard, but the man is never identified and no leads remain.","A woman reports that her bag was taken at a concert in Pell Township. The report is sent to the Pell Township police.","A Stonebridge store reports that a cash drawer is $100 short. A recount shows that the drawer was never short and no money was taken."],"answer":1,"fixed":false,"explanation":"Arrest Made requires an incident in Stonebridge with a suspect who has been both identified and arrested, as with the driver who hit the street sign. Identifying a suspect is not enough when no arrest follows."},{"id":"rp-046","section":"reading","subtype":"detail","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-rp-10","stem":"According to the passage, what first drew Officer Reyes's attention to the maintenance shed?","choices":["A light moving inside the shed","The sound of a padlock being cut","A person climbing over the fence","A call from the parks foreman"],"answer":0,"fixed":false,"explanation":"The first sentence says he noticed a light moving inside the shed. The person ran out and climbed the fence only after he began walking toward it, and the foreman arrived later."},{"id":"rp-047","section":"reading","subtype":"inference","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":"stim-rp-10","stem":"It can be concluded from the passage that","choices":["the person who ran from the shed was carrying the chain saw","the bolt cutters belonged to the parks department","Ms. Abernathy saw the person run from the shed","the park was closed to the public when Officer Reyes noticed the light"],"answer":3,"fixed":false,"explanation":"The park closes at dusk and the officer noticed the light shortly after 11:00 p.m., so the park was closed. The passage says the person carried a backpack, does not say whose bolt cutters they were, and has Ms. Abernathy arriving at 11:40 p.m., after the person had fled."},{"id":"rp-048","section":"reading","subtype":"true-false","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-10","stem":"The passage states whether the person who ran from the shed was a man or a woman.","choices":["True","False"],"answer":1,"fixed":true,"explanation":"The passage refers only to 'a person' in a dark jacket with a backpack and says Officer Reyes did not get a clear look at the person's face. It never says whether the person was a man or a woman."},{"id":"rp-049","section":"reading","subtype":"true-false","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-rp-10","stem":"According to the passage, the padlock was found on the floor of the shed, cut through.","choices":["True","False"],"answer":0,"fixed":true,"explanation":"The passage says that inside the shed Officer Reyes found the padlock on the floor, cut through, with a pair of bolt cutters beside it."},{"id":"rp-050","section":"reading","subtype":"detail","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-rp-10","stem":"According to the passage, which items did Lucille Abernathy report missing?","choices":["A leaf blower and a pair of bolt cutters","A chain saw and a backpack","A leaf blower and a chain saw","A padlock and a chain saw"],"answer":2,"fixed":false,"explanation":"Ms. Abernathy reported that a leaf blower and a chain saw were missing. The bolt cutters and the padlock were found in the shed, and the backpack was carried by the person who ran."},{"id":"rp-051","section":"reading","subtype":"rule-application","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-11","stem":"Naomi Feinberg is named as the victim in an incident report for a theft that is still under investigation. She submits Form R-1 at the records window. According to the passage, what may she receive?","choices":["The full incident report, for a $15 fee","The full incident report, at no charge","A one-page summary, for a $15 fee","Nothing at all until the case is closed","A one-page summary, at no charge"],"answer":4,"fixed":false,"explanation":"While a case is open, a victim may receive a one-page summary at no charge but not the full report. The $15 fee in the passage applies to crash reports."},{"id":"rp-052","section":"reading","subtype":"true-false","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-11","stem":"According to the passage, a request for a crash report may not be made by telephone.","choices":["True","False"],"answer":0,"fixed":true,"explanation":"The passage says every request must be made in writing on Form R-1 and that requests made by telephone are not accepted. That rule covers crash reports along with every other record."},{"id":"rp-053","section":"reading","subtype":"rule-application","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":"stim-rp-11","stem":"Victor Osei was the driver of a car involved in a crash on Monday, June 2. The borough has no holidays in June. According to the passage, what is the earliest date on which the crash report is available to him?","choices":["Friday, June 6","Saturday, June 7","Monday, June 9","Tuesday, June 10","Monday, June 16"],"answer":2,"fixed":true,"explanation":"The report is available beginning on the fifth business day after the day of the crash. Counting Tuesday, Wednesday, Thursday and Friday as the first four business days and skipping the weekend, the fifth is Monday, June 9. Saturday, June 7 is five calendar days later, not five business days."},{"id":"rp-054","section":"reading","subtype":"rule-application","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-11","stem":"Leon Barrett comes to the records window and submits Form R-1 asking for a report that involves his 15-year-old daughter. According to the passage, the records clerk should","choices":["tell him that the request must be sent to the Borough Solicitor","release the report after checking Mr. Barrett's identification","release a one-page summary at no charge","release the report as soon as the case is closed","collect the $15 fee and release the report on the fifth business day"],"answer":0,"fixed":false,"explanation":"Reports involving juveniles are not released at the records window under any circumstances; those requests must go to the Borough Solicitor. Being the juvenile's parent does not create an exception in the passage."},{"id":"rp-055","section":"reading","subtype":"summary","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":"stim-rp-11","stem":"Which of the following statements is accurate according to the passage?","choices":["Any person may obtain a crash report beginning on the fifth business day after a crash.","A victim named in an incident report may receive the full report while the case is still open.","The records clerk must provide every requested record within three business days.","The daily call log is free and may be requested by any person.","Requests are accepted at the records window seven days a week."],"answer":3,"fixed":false,"explanation":"The passage says any person may request the daily call log and that there is no fee. Crash reports go only to a named driver or owner or that person's insurer, and the clerk must answer within three business days, which may mean explaining why a record cannot be provided."},{"id":"rn-001","section":"reading","subtype":"which-is-true","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-01","stem":"According to the passage, which of the following statements is true?","choices":["Poor hearing is the main reason spoken information is lost.","Most people shift among several response habits in a single day.","Advising should be avoided in every situation.","Mirroring is one of the two habits described as most useful."],"answer":1,"fixed":false,"explanation":"The passage says nobody uses only one habit and most people shift among several in a single day. It also says the problem is seldom hearing, that advising is not always wrong, and that paraphrasing and probing (not mirroring) are the most useful."},{"id":"rn-002","section":"reading","subtype":"apply-definition","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-01","stem":"Tomas's coworker tells him, \"They cut our budget again, and I don't see how we finish the project by June.\" Tomas answers, \"So you're worried the money won't stretch far enough to meet the deadline.\" Which habit does Tomas's answer show?","choices":["Mirroring","Probing","Advising","Paraphrasing"],"answer":3,"fixed":false,"explanation":"Tomas restates the coworker's message in his own words to confirm he understood it, which is paraphrasing. It is not mirroring, because he rewords the message instead of repeating her last few words exactly."},{"id":"rn-003","section":"reading","subtype":"apply-definition","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":1,"stimulus":"stim-rn-01","stem":"While her supervisor explains a new schedule, Priya is silently working out how she will object to it, and she misses the date on which the schedule starts. Which habit is Priya showing?","choices":["Deflecting","Probing","Mirroring","Advising","Rehearsing"],"answer":4,"fixed":false,"explanation":"Rehearsing is planning what you will say next instead of attending to what is being said, which is exactly why Priya misses the start date. She has not said anything yet, so she has not deflected, advised, probed or mirrored."},{"id":"rn-004","section":"reading","subtype":"apply-definition","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":1,"stimulus":"stim-rn-01","stem":"Marcus tells Lena that his car broke down on the way to work. Lena replies, \"That reminds me of the time my truck died on the highway last winter,\" and goes on to describe her own trip. Which habit is Lena showing?","choices":["Deflecting","Advising","Paraphrasing","Rehearsing"],"answer":0,"fixed":false,"explanation":"Lena turns the conversation toward her own experience, which the passage defines as deflecting. She offers no solution and does not restate what Marcus said."},{"id":"rn-005","section":"reading","subtype":"apply-definition","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-01","stem":"Keisha's coworker says, \"The morning meeting went badly.\" Which reply by Keisha would be an example of probing?","choices":["\"You should bring it up with the manager today.\"","\"It sounds like the meeting did not go the way you hoped.\"","\"What happened in the meeting?\"","\"My meetings have been rough all week, too.\""],"answer":2,"fixed":false,"explanation":"Probing is asking an open question that invites the speaker to give more detail, and \"What happened in the meeting?\" does that. The other replies offer a solution (advising), restate the message (paraphrasing) or turn to Keisha's own experience (deflecting)."},{"id":"rn-006","section":"reading","subtype":"which-is-true","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-02","stem":"According to the passage, which of the following statements is true?","choices":["A single long night of sleep is enough to erase a sleep debt.","Workers on rotating shifts usually adjust completely to their schedules.","Most people find it easier to stay up later than to fall asleep earlier.","A worker should avoid napping before a night shift."],"answer":2,"fixed":false,"explanation":"The passage gives this as the reason forward rotation is easier on workers. It says the opposite of the other statements: sleep debt is repaid over several nights, adjustment is rarely complete, and a short nap before a night shift can help."},{"id":"rn-007","section":"reading","subtype":"apply-definition","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":1,"stimulus":"stim-rn-02","stem":"Renee wakes from a nap in the break room. For the next ten minutes she feels groggy and has trouble following a simple set of directions. What is Renee experiencing?","choices":["Sleep inertia","Microsleep","Sleep debt","Anchor sleep"],"answer":0,"fixed":false,"explanation":"Sleep inertia is the grogginess and slowed thinking felt in the first minutes after waking, which matches Renee's ten groggy minutes. A microsleep is a few seconds of sleep, not a period of grogginess after waking."},{"id":"rn-008","section":"reading","subtype":"apply-definition","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":1,"stimulus":"stim-rn-02","stem":"At 4:00 a.m., Hassan is entering numbers into a spreadsheet. His eyes close for about three seconds, and he realizes it only when he sees that he has skipped a line. What did Hassan experience?","choices":["Sleep inertia","Anchor sleep","Forward rotation","A microsleep"],"answer":3,"fixed":false,"explanation":"A microsleep is a lapse into sleep lasting only a few seconds, often without the person noticing, which is what happened to Hassan. Sleep inertia applies to the minutes after waking from sleep, not to a brief lapse during work."},{"id":"rn-009","section":"reading","subtype":"apply-definition","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-02","stem":"Wei works nights three days a week. He sleeps from 9:00 a.m. to 1:00 p.m. every single day, including his days off, and adds more sleep when he can. The 9:00 a.m. to 1:00 p.m. block is an example of","choices":["sleep debt","anchor sleep","circadian rhythm","forward rotation"],"answer":1,"fixed":false,"explanation":"Anchor sleep is a block of sleep taken at the same clock time every day, on workdays and days off alike, which describes Wei's daily 9:00 to 1:00 block. Circadian rhythm is the body's internal cycle, not a scheduled block of sleep."},{"id":"rn-010","section":"reading","subtype":"apply-definition","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-02","stem":"Which of the following crew schedules is an example of forward rotation?","choices":["Two weeks of night shifts, then two weeks of evening shifts, then two weeks of day shifts","Two weeks of day shifts, then two weeks of night shifts, then two weeks of evening shifts","Night shifts every week, with the same two days off each week","Two weeks of day shifts, then two weeks of evening shifts, then two weeks of night shifts"],"answer":3,"fixed":false,"explanation":"Forward rotation moves from day shift to evening shift to night shift, in that order. The other schedules either move in the opposite direction, skip from days straight to nights, or do not rotate at all."},{"id":"rn-011","section":"reading","subtype":"which-is-true","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-03","stem":"According to the passage, which of the following statements is true?","choices":["The city pays to repair a leaking service line.","The pumps run mainly at night to refill the standpipes.","Pressure in the pipes depends mostly on the pumps.","Untreated water enters the system at the clarifier."],"answer":1,"fixed":false,"explanation":"The passage states that the pumps run mainly at night, when electricity is cheaper, to refill the standpipes. It also says a service line leak is the building owner's expense, pressure depends mostly on the standpipes, and untreated water enters at the intake."},{"id":"rn-012","section":"reading","subtype":"apply-definition","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-03","stem":"A pipe runs from beneath Birch Street to Arjun Mehta's house and serves only his house. It begins to leak in his front yard. According to the passage, the leaking pipe is a","choices":["water main","standpipe","service line","clarifier"],"answer":2,"fixed":false,"explanation":"A service line is the smaller pipe that connects a single building to the water main, and this pipe serves only Arjun's house. A water main is the large pipe that runs beneath the street itself."},{"id":"rn-013","section":"reading","subtype":"apply-definition","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":1,"stimulus":"stim-rn-03","stem":"Ingrid Solberg, a lab technician, collects a sample of water that has been drawn from Lake Orrin but has not yet been treated. What is she sampling?","choices":["Raw water","Finished water","A clarifier","A service line"],"answer":0,"fixed":false,"explanation":"Raw water is water that has been drawn from the source but has not yet been treated. Finished water has already completed treatment."},{"id":"rn-014","section":"reading","subtype":"apply-definition","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":1,"stimulus":"stim-rn-03","stem":"Carmen Ruiz inspects a tall tank on Ridge Hill. The tank stores treated water, and its height keeps the pressure steady in the neighborhood below. What is Carmen inspecting?","choices":["A standpipe","A clarifier","A water main","An intake"],"answer":0,"fixed":false,"explanation":"A standpipe is a tall storage tank that holds finished water and uses its height to maintain pressure. A clarifier is a basin where particles settle during treatment, not a storage tank for treated water."},{"id":"rn-015","section":"reading","subtype":"apply-definition","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":3,"stimulus":"stim-rn-03","stem":"Samir Haddad owns the building that houses his bakery. A crew finds two leaks: one in the large pipe that carries finished water beneath Mill Road, and one in the smaller pipe that connects only his building to that large pipe. Based on the passage, who pays for the repairs?","choices":["The city pays for both repairs, because both pipes carry finished water.","Samir pays for both repairs, because both leaks affect his building.","The city pays for the pipe beneath Mill Road, and Samir pays for the pipe that connects to his building.","Samir pays for the pipe beneath Mill Road, and the city pays for the pipe that connects to his building."],"answer":2,"fixed":false,"explanation":"The large pipe beneath the street is a water main, which the city owns and pays to repair. The smaller pipe connecting one building to the main is a service line, which belongs to the building's owner, so that leak is Samir's expense."},{"id":"rn-016","section":"reading","subtype":"which-is-true","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-04","stem":"According to the passage, which of the following statements is true?","choices":["Joint problem-solving is the quickest way to settle a disagreement.","Forcing can be appropriate when a decision must be made at once.","Skilled employees rely on a single style in every situation.","Yielding is the style most likely to let a small problem grow."],"answer":1,"fixed":false,"explanation":"The passage says forcing can be appropriate in an emergency, when a decision must be made at once. It says joint problem-solving takes the most time, skilled employees fit the style to the situation, and withdrawing (not yielding) is most likely to let a problem grow."},{"id":"rn-017","section":"reading","subtype":"apply-definition","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-04","stem":"Anita and Joel both want the Friday before a holiday off, but only one of them can be away at a time. They agree that Anita will take the morning off and Joel will take the afternoon. Which style did they use?","choices":["Joint problem-solving","Yielding","Postponing","Splitting"],"answer":3,"fixed":false,"explanation":"Each of them gave up half of the day they wanted so that both got something, which is splitting. It is not joint problem-solving, because neither person's wish for the full day off was fully met."},{"id":"rn-018","section":"reading","subtype":"apply-definition","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-04","stem":"In a staff meeting, Curtis disagrees with a coworker's plan for the supply closet. He says nothing during the meeting and never brings the matter up afterward. Which style is Curtis using?","choices":["Withdrawing","Postponing","Forcing","Splitting","Joint problem-solving"],"answer":0,"fixed":false,"explanation":"Withdrawing is leaving or staying silent so that the disagreement is never addressed, which describes Curtis. It is not postponing, because he and the coworker never agreed on a later time to deal with the issue."},{"id":"rn-019","section":"reading","subtype":"apply-definition","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":3,"stimulus":"stim-rn-04","stem":"Mei and Victor begin to disagree about how shared files should be named. Mei says, \"I can't deal with this right now,\" and walks back to her desk. Which additional fact would make Mei's response an example of postponing rather than withdrawing?","choices":["She privately decides that she may raise the subject with Victor again someday, when both of them are less busy.","Before she leaves, she and Victor agree to meet at 2:00 the next day to settle the question.","She tells Victor to name the files however he likes.","She tells Victor that her naming method is the only one that will work."],"answer":1,"fixed":false,"explanation":"Postponing requires agreeing with the other person on a specific later time to deal with the issue, and only the 2:00 meeting does that. A private intention with no agreed time still leaves the disagreement unaddressed, and the other two facts describe yielding and forcing."},{"id":"rn-020","section":"reading","subtype":"apply-definition","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":3,"stimulus":"stim-rn-04","stem":"Farid and Olivia both ask for the small office. Farid needs a quiet place for client calls, and Olivia needs to sit close to the large printer. After talking through their reasons, they move the printer beside a desk in the open area for Olivia and give Farid the small office. Both say they now have everything they needed. Which style did they use?","choices":["Joint problem-solving","Splitting","Yielding","Forcing"],"answer":0,"fixed":false,"explanation":"They worked together and found an answer that fully met both sides' needs, which is joint problem-solving. It is not splitting, because neither person had to give up part of what they needed."},{"id":"rn-021","section":"reading","subtype":"which-is-true","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":3,"stimulus":"stim-rn-05","stem":"According to the passage, which of the following statements is true?","choices":["Pell Harbor has had its own government since 1841.","The first levy is still being collected today.","The ferry company continued to own the Front Street freight yard after 1910.","The town had two wards when it received its charter."],"answer":3,"fixed":false,"explanation":"The passage says the original charter gave the town only two wards. The town had no government for its first thirty years, the first levy ended when the breakwater was finished, and the ferry company gave the freight yard to the town, keeping only an easement across it."},{"id":"rn-022","section":"reading","subtype":"apply-definition","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":1,"stimulus":"stim-rn-05","stem":"The council approves a tax that will be collected for two years only, to pay for a new library roof. This tax is an example of","choices":["a charter","an easement","a levy","a commons"],"answer":2,"fixed":false,"explanation":"A levy is a tax approved by the council for one stated purpose (the library roof) and one stated period (two years)."},{"id":"rn-023","section":"reading","subtype":"apply-definition","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":1,"stimulus":"stim-rn-05","stem":"Residents of the town's north district elect Yusuf Demir to speak for them on the town council. What is Yusuf's position?","choices":["Ward","Charter","Warden","Levy"],"answer":2,"fixed":false,"explanation":"A warden is the official elected by a ward to speak for it on the town council. The ward is the district itself, not the person who represents it."},{"id":"rn-024","section":"reading","subtype":"apply-definition","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-05","stem":"Helen Brandt owns a lot on Dock Lane. Her neighbor, Paulo Mendes, has a recorded right to drive across a strip of her lot to reach his garage, although he owns none of her land. Paulo's right is an example of","choices":["a commons","a levy","an easement","a ward","a charter"],"answer":2,"fixed":false,"explanation":"An easement is a right to cross or use a strip of someone else's land without owning it, which is exactly what Paulo has. A commons is land owned by the town, and Helen's lot is private."},{"id":"rn-025","section":"reading","subtype":"apply-definition","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-05","stem":"Naomi Fischer proposes that a field owned by the town be fenced so that only members of the rowing club may use it. If her proposal is adopted, why would the field NOT fit the passage's definition of a commons?","choices":["It would be owned by the town.","It would not be located on Front Street.","It would not be paid for by a levy.","It would not be open to every resident."],"answer":3,"fixed":false,"explanation":"A commons is land owned by the town and open to every resident. The field would still be town-owned, but limiting it to rowing club members means it is no longer open to every resident; location and levies are not part of the definition."},{"id":"rn-026","section":"reading","subtype":"main-idea","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-06","stem":"What is the main purpose of the memo?","choices":["To announce a new deadline for submitting incident reports and explain the reasons for it","To criticize officers whose reports were submitted late in September","To announce that training on the new dictation software will be offered at roll call during the week of October 26","To explain how late reports affect residents' insurance claims"],"answer":0,"fixed":false,"explanation":"Most of the memo describes the new end-of-shift deadline, why it is needed and what is being done to help officers meet it. The software training and the insurance delays are supporting details, and the memo says plainly that it is not a criticism."},{"id":"rn-027","section":"reading","subtype":"detail","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-06","stem":"According to the memo, what must an officer do when a call late in the shift makes it impossible to finish a report before the shift ends?","choices":["Remain on duty until the report has been completed and submitted","Notify the shift sergeant before going off duty and submit the report by the end of the next scheduled shift","Record the extension in the shift log, then submit the report to the Records Unit within three days of the incident","Send the unfinished report to the Records Unit with a note explaining the delay"],"answer":1,"fixed":false,"explanation":"The memo says the officer must notify the shift sergeant before going off duty and submit the report by the end of his or her next scheduled shift. Recording the extension in the shift log is the sergeant's job, not the officer's."},{"id":"rn-028","section":"reading","subtype":"detail","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":1,"stimulus":"stim-rn-06","stem":"Which of the following does the memo give as a result of late reports?","choices":["Officers lose pay for the time they spend writing.","Residents file complaints against the department.","The Records Unit must rewrite the reports.","The work of detectives is slowed."],"answer":3,"fixed":false,"explanation":"The memo lists three results of late reports: delayed insurance claims, slower work by detectives, and less accurate recall of details. Lost pay, complaints and rewriting are not mentioned."},{"id":"rn-029","section":"reading","subtype":"inference","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":3,"stimulus":"stim-rn-06","stem":"Which conclusion is best supported by the memo?","choices":["The lieutenant believes that most of the late reports were caused by carelessness on the part of individual patrol officers.","The report-writing stations in the squad room were in working order throughout the quarter.","The lieutenant believes that a shortage of time and of working equipment contributed to the late reports.","The number of calls is expected to drop once the new procedure begins."],"answer":2,"fixed":false,"explanation":"The lieutenant says the change is not a criticism, notes that call volume has risen and writing time is scarce, and then lists repaired stations and new software as help. That points to time and equipment, not carelessness, and stations that had to be repaired were not in working order all along."},{"id":"rn-030","section":"reading","subtype":"vocabulary-in-context","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":1,"stimulus":"stim-rn-06","stem":"As used in the memo, the word \"scarce\" most nearly means","choices":["wasted","in short supply","unpaid","closely supervised"],"answer":1,"fixed":false,"explanation":"The lieutenant says call volume has risen and writing time is scarce, meaning there is little time available for writing. Nothing in the sentence suggests the time is wasted, unpaid or supervised."},{"id":"rn-031","section":"reading","subtype":"main-idea","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-07","stem":"Which statement best expresses the main idea of the bulletin?","choices":["Officers should learn to recognize signs of hearing loss and adjust the way they communicate.","Hearing loss is more common among borough residents over 65 than it is among younger borough residents.","Officers should write down everything they say to residents.","Residents with hearing loss often refuse to cooperate with officers."],"answer":0,"fixed":false,"explanation":"The bulletin first describes signs of hearing loss and then lists steps for communicating clearly, so recognizing and adjusting is its main idea. The age statistic is one detail, writing is recommended only for important information, and the bulletin says these residents are mistaken for uncooperative, not that they are."},{"id":"rn-032","section":"reading","subtype":"detail","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":1,"stimulus":"stim-rn-07","stem":"According to the bulletin, what should an officer do with important information such as an address or a date?","choices":["Write it down and ask the person to confirm it","Repeat it several times in a louder voice","Give it to a family member instead of the person","Say it slowly, one word at a time"],"answer":0,"fixed":false,"explanation":"The bulletin says that for anything important, such as an address, a date or a set of instructions, the officer should write it down and ask the person to confirm it."},{"id":"rn-033","section":"reading","subtype":"detail","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-07","stem":"Which of the following does the bulletin list as a possible sign of hearing loss?","choices":["Speaking in an unusually quiet voice","Answering a different question from the one that was asked","Asking the officer to write things down","Refusing to look at the officer's face"],"answer":1,"fixed":false,"explanation":"The bulletin names three signs: answering a different question from the one asked, watching the officer's mouth closely, and turning one ear toward the speaker. The other behaviors are not mentioned, and watching the mouth closely is the opposite of refusing to look."},{"id":"rn-034","section":"reading","subtype":"inference","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":3,"stimulus":"stim-rn-07","stem":"Which conclusion is best supported by the bulletin?","choices":["Most residents with hearing loss tell an officer about it right away.","Writing should replace speech whenever an officer suspects hearing loss.","Some people with hearing loss rely partly on watching a speaker's lips.","Hearing loss is the most common reason that people fail to cooperate with officers."],"answer":2,"fixed":false,"explanation":"The bulletin mentions people watching the officer's mouth, tells officers to keep their hands away from their mouths, and warns that shouting distorts the shape of words on the lips; together these imply that lip-watching helps. It says many will not mention the difficulty and limits writing to important information."},{"id":"rn-035","section":"reading","subtype":"vocabulary-in-context","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-07","stem":"As used in the bulletin, the word \"distorts\" most nearly means","choices":["makes much louder than normal","completely hides","slows down","changes the normal form of"],"answer":3,"fixed":false,"explanation":"The bulletin says shouting distorts the shape of words on the lips, meaning it pulls that shape out of its normal form so the words are harder to recognize. The lips are still visible, so the shape is changed, not hidden."},{"id":"rn-036","section":"reading","subtype":"main-idea","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-08","stem":"Which statement best summarizes the document?","choices":["Speeding on Corliss Avenue has become the most serious crime problem in Marlow Township, according to a police survey.","Reports of package thefts in Eastgate have risen sharply since last fall.","Residents raised concerns about speeding, package thefts and lighting, and officials responded to each.","Residents voted to begin the next community meeting at 7:00 p.m."],"answer":2,"fixed":false,"explanation":"The summary covers three subjects (speeding, package thefts and parking lot lights) and what officials said about each. Theft reports fell from 19 to 11, the later start time is only under review, and nothing calls speeding the township's most serious crime problem."},{"id":"rn-037","section":"reading","subtype":"detail","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-08","stem":"According to the summary, when will extra patrols be assigned to Corliss Avenue?","choices":["For the four weeks beginning October 5, alongside the speed display","Only if the portable speed display does not slow traffic","As soon as the bridge construction is finished","Whenever a resident reports a speeding driver"],"answer":1,"fixed":false,"explanation":"Sergeant Delgado said extra patrols will follow only if the display fails to slow traffic. The four weeks beginning October 5 is when the speed display, not the extra patrols, will be on the street."},{"id":"rn-038","section":"reading","subtype":"detail","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-08","stem":"What did the August speed survey find?","choices":["The average speed was 9 miles per hour above the posted limit.","Most drivers were traveling at or below the posted limit.","Drivers were using the street to avoid bridge construction.","Speeds dropped while the portable display was in place."],"answer":0,"fixed":false,"explanation":"The survey found an average speed of 34 miles per hour in a 25 zone, which is 9 above the limit. The shortcut explanation came from residents, not from the survey, and the display had not yet been placed in August."},{"id":"rn-039","section":"reading","subtype":"inference","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":3,"stimulus":"stim-rn-08","stem":"Based on Sergeant Delgado's remarks about package thefts, which conclusion is most reasonable?","choices":["Fewer packages were definitely stolen this fall than last fall.","Residents who fail to report a theft will be denied police service.","The drop in theft reports from 19 to 11 shows that the portable speed display on Corliss Avenue has discouraged package thieves.","If thefts go unreported, the neighborhood may receive less patrol attention than its true number of thefts would justify."],"answer":3,"fixed":false,"explanation":"Patrol assignments are based on reported incidents, so thefts that are never reported cannot count toward the neighborhood's share of patrols. Because many thefts go unreported, the fall in reports does not prove that fewer packages were actually stolen."},{"id":"rn-040","section":"reading","subtype":"vocabulary-in-context","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":1,"stimulus":"stim-rn-08","stem":"As used in the summary, the word \"acknowledged\" most nearly means","choices":["denied","admitted","predicted","demanded"],"answer":1,"fixed":false,"explanation":"After giving the lower report numbers, Sergeant Delgado acknowledged that many thefts are never reported; she was admitting a weakness in those numbers."},{"id":"rn-041","section":"reading","subtype":"main-idea","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":1,"stimulus":"stim-rn-09","stem":"What is the main purpose of the notice?","choices":["To announce new hours for the Quartermaster's window","To report that two officers were injured during calls when their portable radios shut off without warning","To teach officers how to charge a radio battery","To direct officers to exchange older radio batteries that no longer hold a full charge"],"answer":3,"fixed":false,"explanation":"The notice explains that batteries issued before January 2025 are failing and tells officers how and by when to exchange them. The window hours are a supporting detail, and the notice says no one was hurt."},{"id":"rn-042","section":"reading","subtype":"detail","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-09","stem":"What special arrangement does the notice make for officers assigned to the night shift?","choices":["They may keep using their old batteries until the Quartermaster's window begins offering hours during the night shift.","They may send their old batteries directly to the manufacturer.","They may leave old batteries with the desk sergeant and collect replacements at the start of their next shift.","They have until the end of December to complete the exchange."],"answer":2,"fixed":false,"explanation":"Because night-shift officers cannot easily reach the window during its weekday daytime hours, the notice lets them leave old batteries with the desk sergeant and collect replacements at the start of their next shift. The December 4 deadline applies to everyone."},{"id":"rn-043","section":"reading","subtype":"detail","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":1,"stimulus":"stim-rn-09","stem":"According to the notice, what must every officer do until the exchange is complete?","choices":["Carry a spare battery and begin each shift with a battery taken directly from the charger","Leave batteries in the patrol vehicle overnight so that they are ready for the next shift","Use the portable radio only for emergency calls","Trade radios with an officer on another shift"],"answer":0,"fixed":false,"explanation":"The notice tells every officer to carry a spare battery on duty and to begin each shift with a battery taken directly from the charger. It specifically says batteries should not be left in a vehicle overnight."},{"id":"rn-044","section":"reading","subtype":"inference","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":3,"stimulus":"stim-rn-09","stem":"Officer Leila Farouk has been issued three batteries, stamped December 2024, January 2025 and March 2025. According to the notice, which must she exchange?","choices":["The batteries stamped December 2024 and January 2025","All three batteries","Only the battery stamped March 2025","Only the battery stamped December 2024"],"answer":3,"fixed":false,"explanation":"The notice requires the exchange of any battery stamped with a date earlier than January 2025. December 2024 is earlier than January 2025, but a battery stamped January 2025 itself is not, and neither is one stamped March 2025."},{"id":"rn-045","section":"reading","subtype":"vocabulary-in-context","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":"stim-rn-09","stem":"As used in the last sentence of the notice, the word \"credit\" most nearly means","choices":["an amount of money allowed back to the department","public praise for good work","trust in a person's honesty","a loan to be repaid later"],"answer":0,"fixed":false,"explanation":"The old batteries are being returned to the manufacturer for credit, meaning the department will be allowed money back for them. That is why they must be turned in instead of thrown away."},{"id":"rn-046","section":"reading","subtype":"short-memo","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":1,"stimulus":null,"stem":"Read the notice.\n\n\"The second-floor locker room will be closed for painting from 6:00 a.m. Tuesday until 6:00 a.m. Thursday. Employees who will need items from their lockers during that time must remove them before the closing. Temporary lockers are available in Room 114; see the desk clerk for a key.\"\n\nWhich statement is accurate according to the notice?","choices":["The locker room will reopen on Tuesday evening.","An employee who wants a temporary locker should ask the desk clerk for a key.","Employees may enter the locker room during the painting if the desk clerk goes with them.","The temporary lockers are located on the second floor."],"answer":1,"fixed":false,"explanation":"The notice says temporary lockers are in Room 114 and that employees should see the desk clerk for a key. The locker room stays closed until 6:00 a.m. Thursday, and the notice gives no way to enter during the painting."},{"id":"rn-047","section":"reading","subtype":"short-memo","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":3,"stimulus":null,"stem":"Read the instruction.\n\n\"All found property turned in at the front desk must be logged before the end of the shift on which it is received. Items valued at more than $100 must also be reported to the shift supervisor at the time they are logged. Cash in any amount is treated as an item valued at more than $100.\"\n\nA desk clerk receives a found wallet that contains $12 in cash and nothing else of value. What should the clerk do?","choices":["Log the wallet before the end of the shift without reporting it, because $12 is less than the $100 limit","Report the wallet to the shift supervisor now and log it during the next shift","Log the wallet before the end of the shift and report it to the shift supervisor when it is logged","Hold the wallet at the front desk until the owner has had a full day to claim it"],"answer":2,"fixed":false,"explanation":"The instruction treats cash in any amount as an item valued at more than $100, so the $12 triggers the report to the shift supervisor as well as the logging. Logging alone would be correct only if the wallet held no cash."},{"id":"rn-048","section":"reading","subtype":"short-memo","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":1,"stimulus":null,"stem":"Read the notice.\n\n\"Beginning March 1, employee vehicles must display the new blue permit on the lower left corner of the windshield. The old green permits will not be accepted after that date. Blue permits can be picked up at the Township Clerk's office at no charge by showing an employee ID card.\"\n\nWhich statement is accurate according to the notice?","choices":["An employee must show an ID card to receive a blue permit.","Green permits will remain valid through the end of March.","There is a small fee for a blue permit.","The blue permit must hang from the rearview mirror."],"answer":0,"fixed":false,"explanation":"The notice says blue permits can be picked up by showing an employee ID card. It also says green permits end on March 1, the permits are free, and the permit goes on the lower left corner of the windshield."},{"id":"rn-049","section":"reading","subtype":"short-memo","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":1,"stimulus":null,"stem":"Read the notice.\n\n\"The CPR recertification class scheduled for Wednesday, May 6, has been moved to Wednesday, May 13, in the same room and at the same time. Anyone already registered remains registered and does not need to sign up again. Anyone who cannot attend on the new date must tell the training coordinator by May 8 to be placed in the June class.\"\n\nAsha Patel is already registered and is able to attend on May 13. What should she do?","choices":["Sign up again for the May 13 class","Tell the training coordinator by May 8 that she will attend","Wait for the June class","Attend the class on May 13; no other action is needed"],"answer":3,"fixed":false,"explanation":"The notice says anyone already registered remains registered and does not need to sign up again. Only people who cannot attend on May 13 need to contact the training coordinator."},{"id":"rn-050","section":"reading","subtype":"short-memo","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":null,"stem":"Read the instruction.\n\n\"Requests for time off of three or more consecutive days must be submitted on Form L-2 at least fourteen days before the first day requested. Requests for one or two days may be made by e-mail to the shift supervisor at least 48 hours in advance. No request is approved until the employee receives written confirmation.\"\n\nWhich statement is accurate according to the instruction?","choices":["A request for three consecutive days off may be made by e-mail to the shift supervisor if it is sent at least 48 hours in advance.","Form L-2 is required for every request for time off.","An employee who e-mails a request for two days off should not treat it as approved until written confirmation arrives.","A request is automatically approved if the supervisor does not answer within fourteen days."],"answer":2,"fixed":false,"explanation":"The last sentence says no request is approved until the employee receives written confirmation, and that applies to e-mailed requests too. Three or more consecutive days require Form L-2, while one or two days may be requested by e-mail."},{"id":"rn-051","section":"reading","subtype":"short-memo","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":null,"stem":"Read the instruction.\n\n\"Fleet vehicles are to be refueled whenever the gauge reads one-half or lower at the end of a shift. Fuel may be obtained only at the Public Works yard on Quarry Road, using the card assigned to that vehicle. If the yard pumps are out of service, notify the fleet manager, who will issue a one-time authorization for a commercial station.\"\n\nAt the end of his shift, Officer Minh Bui's vehicle shows one-quarter of a tank, and the yard pumps are out of service. What should he do?","choices":["Refuel at the nearest commercial station using the card assigned to the vehicle","Notify the fleet manager and obtain a one-time authorization to use a commercial station","Leave the vehicle as it is, because refueling is required only when the tank is nearly empty","Park the vehicle and let the next shift refuel it when the yard pumps are working again"],"answer":1,"fixed":false,"explanation":"One-quarter is lower than one-half, so the vehicle must be refueled, and when the yard pumps are out of service the instruction says to notify the fleet manager for a one-time authorization. Going to a commercial station without that authorization is not permitted."},{"id":"rn-052","section":"reading","subtype":"short-memo","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":null,"stem":"Read the notice.\n\n\"The elevator in the Hartley Building will be out of service for inspection on Friday from 9:00 a.m. to noon. Visitors who cannot use the stairs may be seen in Conference Room A on the ground floor during those hours. Staff should tell anyone with a Friday morning appointment about this arrangement before 5:00 p.m. Thursday.\"\n\nLucia Moreno, a staff member on the third floor, has an appointment with a visitor at 10:00 a.m. Friday. What should she do?","choices":["Move the appointment to Friday afternoon","Tell the visitor about the arrangement before 5:00 p.m. Thursday","Explain the arrangement when the visitor arrives on Friday","Cancel the appointment until the inspection is finished"],"answer":1,"fixed":false,"explanation":"The notice directs staff to tell anyone with a Friday morning appointment about the arrangement before 5:00 p.m. Thursday. It does not tell staff to move or cancel appointments, and waiting until Friday would miss the deadline."},{"id":"rn-053","section":"reading","subtype":"short-memo","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":2,"stimulus":null,"stem":"Read the notice.\n\n\"Copies of accident reports are available to the drivers involved, the vehicle owners and their insurance companies. Requests must be made in writing and must include either the report number or the date and location of the accident. Reports are normally ready five business days after the accident; the fee is $15, payable when the copy is picked up.\"\n\nWhich statement is accurate according to the notice?","choices":["The $15 fee must be paid at the time the request is submitted.","Any member of the public may obtain a copy of an accident report by making a request in writing and paying the fee.","A written request that gives the date and location of the accident, but not the report number, is acceptable.","A report is normally ready on the business day after the accident."],"answer":2,"fixed":false,"explanation":"The notice requires either the report number or the date and location of the accident, so a request with the date and location is acceptable. The fee is paid at pickup, copies are limited to the listed parties, and reports normally take five business days."},{"id":"rn-054","section":"reading","subtype":"short-memo","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":1,"stimulus":null,"stem":"Read the notice.\n\n\"Because of an upgrade to the telephone system, voicemail will be unavailable from 10:00 p.m. Saturday to 4:00 a.m. Sunday. Incoming calls will still ring at each desk, but callers will not be able to leave messages. Messages already saved will not be affected.\"\n\nWhich statement is accurate according to the notice?","choices":["Messages saved before the upgrade will still be there afterward.","Desk telephones will not ring during the upgrade.","Callers will be able to leave messages, but staff cannot hear them until Sunday.","The upgrade begins at 10:00 p.m. Sunday."],"answer":0,"fixed":false,"explanation":"The notice says messages already saved will not be affected. It also says calls will still ring at each desk, callers cannot leave messages during the upgrade, and the work begins at 10:00 p.m. Saturday."},{"id":"rn-055","section":"reading","subtype":"short-memo","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle","ncjosi2"],"difficulty":3,"stimulus":null,"stem":"Read the instruction.\n\n\"Winter uniform items may be worn beginning October 15 and must be worn beginning November 1. Summer uniform items may not be worn after October 31. Between October 15 and October 31, each officer may choose either uniform, but partners assigned to the same vehicle must wear the same one.\"\n\nOn October 20, Officers Kim and Alvarez are assigned to the same vehicle. Officer Kim arrives in the winter uniform and Officer Alvarez arrives in the summer uniform. Which statement is accurate?","choices":["Both officers must wear the winter uniform, because it has been required since October 15.","Either uniform is allowed on that date, but one of the officers must change so that the two match.","Each officer may keep the uniform he or she chose, because either one is allowed through October 31.","Officer Alvarez alone has broken the rule, because summer items may not be worn after October 15.","Both officers must wear the summer uniform until November 1."],"answer":1,"fixed":false,"explanation":"October 20 falls in the period when each officer may choose either uniform, so neither uniform is wrong by itself. However, partners assigned to the same vehicle must wear the same one, so the two must match; the instruction does not say which uniform they must pick."},{"id":"gu-001","section":"grammar","subtype":"plural-possessive","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"The two witnesses were interviewed separately, and both _____ statements matched the footage from the store's security camera.","choices":["witnesses'","witness's","witnesses"],"answer":0,"fixed":false,"explanation":"The statements belong to two witnesses, so the word must be plural and possessive. A plural noun that already ends in s shows ownership with an apostrophe after the s: witnesses'."},{"id":"gu-002","section":"grammar","subtype":"plural-possessive","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":1,"stimulus":null,"stem":"Sergeant Whitlock asked every officer on the shift to sign the log, but one _____ signature was missing.","choices":["officer's","officers'","officers"],"answer":0,"fixed":false,"explanation":"The word \"one\" shows that a single officer owns the signature. A singular noun shows ownership with an apostrophe and s: officer's."},{"id":"gu-003","section":"grammar","subtype":"plural-possessive","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":1,"stimulus":null,"stem":"The patrol car was towed after _____ front axle broke during the pursuit.","choices":["it's","its'","its"],"answer":2,"fixed":false,"explanation":"The axle belongs to the car, so the possessive \"its\" is needed, and possessive pronouns never take an apostrophe. \"It's\" always means \"it is\" or \"it has,\" and \"its'\" is not a word."},{"id":"gu-004","section":"grammar","subtype":"plural-possessive","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"The dispatcher said that _____ too early to tell how the fire started.","choices":["its","it's","its'"],"answer":1,"fixed":false,"explanation":"The sentence means \"it is too early,\" and the contraction of \"it is\" is \"it's.\" \"Its\" without an apostrophe shows ownership, which does not fit here."},{"id":"gu-005","section":"grammar","subtype":"plural-possessive","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":1,"stimulus":null,"stem":"Three _____ were interviewed at the scene before the ambulance arrived.","choices":["witness's","witnesses","witnesses'"],"answer":1,"fixed":false,"explanation":"Nothing is owned in this sentence; the word is simply the plural subject of \"were interviewed.\" A plain plural takes no apostrophe: witnesses."},{"id":"gu-006","section":"grammar","subtype":"plural-possessive","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"The _____ waiting room at the Harlow Borough station has toys and books for young visitors.","choices":["childrens","children's","childrens'"],"answer":1,"fixed":false,"explanation":"\"Children\" is already plural without an s, so its possessive is formed like a singular noun's, with an apostrophe and then s: children's. \"Childrens\" is not a word, with or without an apostrophe after it."},{"id":"gu-007","section":"grammar","subtype":"plural-possessive","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"The two drivers exchanged insurance cards, and Officer Nakamura copied both _____ names into her report.","choices":["drivers'","driver's","drivers"],"answer":0,"fixed":false,"explanation":"The names belong to two drivers, so the noun must be plural and possessive. Add only an apostrophe after the s of a plural noun: drivers'."},{"id":"gu-008","section":"grammar","subtype":"plural-possessive","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"Because the _____ flashlight was not working, she borrowed one from her partner.","choices":["detectives'","detectives","detective's"],"answer":2,"fixed":false,"explanation":"\"She\" later in the sentence shows that one detective owns the flashlight. One owner takes an apostrophe and s: detective's."},{"id":"gu-009","section":"grammar","subtype":"plural-possessive","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"The _____ were asked to wait in the lobby until a detective was available.","choices":["Hendersons","Henderson's","Hendersons'"],"answer":0,"fixed":false,"explanation":"The word is the plural subject of \"were asked\" and owns nothing, so no apostrophe is used. A family name is made plural by adding s: the Hendersons."},{"id":"gu-010","section":"grammar","subtype":"plural-possessive","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":3,"stimulus":null,"stem":"Officer Lindqvist recorded each _____ date of birth before taking the statements.","choices":["passengers'","passengers","passenger's"],"answer":2,"fixed":false,"explanation":"\"Each\" is always followed by a singular noun, and the date of birth belongs to that one person, so the singular possessive \"passenger's\" is correct. The plural possessive \"passengers'\" cannot follow \"each.\""},{"id":"gu-011","section":"grammar","subtype":"homophones","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"The officers stated that _____ planning to return to the address in the morning.","choices":["their","they're","there"],"answer":1,"fixed":false,"explanation":"The sentence means \"they are planning,\" and the contraction of \"they are\" is \"they're.\" \"Their\" shows ownership and \"there\" refers to a place."},{"id":"gu-012","section":"grammar","subtype":"homophones","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":1,"stimulus":null,"stem":"The driver admitted that he had been going _____ fast for the wet road.","choices":["to","too","two"],"answer":1,"fixed":false,"explanation":"\"Too\" means \"more than is wanted or safe,\" which fits \"too fast.\" \"To\" is a preposition and \"two\" is the number."},{"id":"gu-013","section":"grammar","subtype":"homophones","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":1,"stimulus":null,"stem":"The officer told the motorist, \"_____ free to leave once you sign the citation.\"","choices":["You're","Your"],"answer":0,"fixed":false,"explanation":"The sentence means \"You are free to leave,\" and the contraction of \"you are\" is \"you're.\" \"Your\" shows ownership, as in \"your license.\""},{"id":"gu-014","section":"grammar","subtype":"homophones","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"The clerk could not tell the officers _____ car was parked behind the store.","choices":["who's","whose"],"answer":1,"fixed":false,"explanation":"\"Whose\" is the possessive form and asks who owns the car. \"Who's\" is a contraction of \"who is\" or \"who has,\" and \"who is car\" makes no sense."},{"id":"gu-015","section":"grammar","subtype":"homophones","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":1,"stimulus":null,"stem":"The second suspect was noticeably taller _____ the first.","choices":["than","then"],"answer":0,"fixed":false,"explanation":"\"Than\" is used to compare two things, as in \"taller than.\" \"Then\" refers to time or to what happens next."},{"id":"gu-016","section":"grammar","subtype":"homophones","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"The heavy fog did not _____ the officer's ability to read the license plate.","choices":["effect","affect"],"answer":1,"fixed":false,"explanation":"A verb is needed after \"did not,\" and \"affect\" is the verb meaning \"to influence.\" \"Effect\" is normally a noun meaning \"a result.\""},{"id":"gu-017","section":"grammar","subtype":"homophones","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":1,"stimulus":null,"stem":"Every window on the ground floor was locked _____ the one above the kitchen sink.","choices":["except","accept"],"answer":0,"fixed":false,"explanation":"\"Except\" means \"other than\" or \"leaving out,\" which fits one window that was not locked. \"Accept\" is a verb meaning \"to receive\" or \"to agree to.\""},{"id":"gu-018","section":"grammar","subtype":"homophones","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":3,"stimulus":null,"stem":"The witness said the truck drove _____ her house three times before stopping.","choices":["past","passed"],"answer":0,"fixed":false,"explanation":"The sentence already has its verb, \"drove,\" so the blank needs the preposition \"past,\" meaning \"by\" or \"beyond.\" \"Passed\" is the past tense of the verb \"pass\" and cannot follow \"drove\" here."},{"id":"gu-019","section":"grammar","subtype":"homophones","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":1,"stimulus":null,"stem":"A _____ dog was reported running near the playground on Fenwick Avenue.","choices":["loose","lose"],"answer":0,"fixed":false,"explanation":"\"Loose\" is the adjective meaning \"not tied up or held in.\" \"Lose\" is a verb meaning \"to misplace\" or \"to fail to win.\""},{"id":"gu-020","section":"grammar","subtype":"homophones","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":3,"stimulus":null,"stem":"The _____ reason for the road closure was a downed power line.","choices":["principle","principal"],"answer":1,"fixed":false,"explanation":"\"Principal\" is the adjective meaning \"main\" or \"most important,\" which is what describes the reason. \"Principle\" is only a noun meaning \"a rule or belief.\""},{"id":"gu-021","section":"grammar","subtype":"homophones","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"Officer Brennan decided to _____ the driver for failing to stop at the red light.","choices":["site","cite","sight"],"answer":1,"fixed":false,"explanation":"\"Cite\" is the verb meaning \"to issue a citation to\" or \"to refer to.\" \"Site\" is a location and \"sight\" has to do with seeing."},{"id":"gu-022","section":"grammar","subtype":"homophones","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":1,"stimulus":null,"stem":"The witness could not say _____ the driver was wearing a seat belt.","choices":["whether","weather"],"answer":0,"fixed":false,"explanation":"\"Whether\" introduces a question of \"if or if not.\" \"Weather\" refers to rain, wind, temperature and similar conditions."},{"id":"gu-023","section":"grammar","subtype":"pronoun-case","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":1,"stimulus":null,"stem":"Officer Tran and _____ responded to the alarm at the Dunmore Pharmacy.","choices":["I","me","myself"],"answer":0,"fixed":false,"explanation":"The pronoun is part of the subject of \"responded,\" so the subject form \"I\" is needed. Test it by dropping the other person: \"I responded,\" not \"me responded.\""},{"id":"gu-024","section":"grammar","subtype":"pronoun-case","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"The sergeant asked Officer Bello and _____ to direct traffic at the intersection.","choices":["I","myself","me"],"answer":2,"fixed":false,"explanation":"The pronoun is an object of the verb \"asked,\" so the object form \"me\" is needed. Drop the other person to test it: \"The sergeant asked me,\" not \"asked I.\""},{"id":"gu-025","section":"grammar","subtype":"pronoun-case","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"The lieutenant divided the remaining reports between Officer Kowalski and _____.","choices":["I","me","myself"],"answer":1,"fixed":false,"explanation":"\"Between\" is a preposition, and a pronoun that follows a preposition takes the object form: \"between Officer Kowalski and me.\" \"Myself\" is used only when the same person is also the subject."},{"id":"gu-026","section":"grammar","subtype":"pronoun-case","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":1,"stimulus":null,"stem":"The officer separated the two men and asked _____ to wait on opposite sides of the street.","choices":["they","them"],"answer":1,"fixed":false,"explanation":"The pronoun receives the action of \"asked,\" so the object form \"them\" is correct. \"They\" is used only as a subject."},{"id":"gu-027","section":"grammar","subtype":"pronoun-case","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"The woman to _____ the wallet belonged came to the station the next day.","choices":["whom","who"],"answer":0,"fixed":false,"explanation":"The pronoun follows the preposition \"to,\" so the object form \"whom\" is needed. Test it with him or he: the wallet belonged \"to him,\" not \"to he.\""},{"id":"gu-028","section":"grammar","subtype":"pronoun-case","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"Mr. Abdi said that his brother and _____ had been home all evening.","choices":["he","him","himself"],"answer":0,"fixed":false,"explanation":"The pronoun is part of the subject of \"had been,\" so the subject form \"he\" is needed. Drop \"his brother and\" to test it: \"he had been home,\" not \"him had been home.\""},{"id":"gu-029","section":"grammar","subtype":"pronoun-case","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":3,"stimulus":null,"stem":"The chief said that the volunteers had worked all night and that _____ and their families deserved recognition.","choices":["them","themselves","they"],"answer":2,"fixed":false,"explanation":"The pronoun is part of the subject of \"deserved,\" so the subject form \"they\" is needed. Drop \"and their families\" to test it: \"they deserved recognition,\" not \"them deserved recognition.\""},{"id":"gu-030","section":"grammar","subtype":"pronoun-case","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"I completed the inventory of the trunk _____ because my partner was interviewing the driver.","choices":["myself","me","I"],"answer":0,"fixed":false,"explanation":"A pronoun ending in -self is used to emphasize a subject that is the same person, and here it stresses that \"I\" did the work alone. \"Me\" and \"I\" cannot do that job."},{"id":"gu-031","section":"grammar","subtype":"pronoun-case","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":3,"stimulus":null,"stem":"Officer Ruiz did not know _____ had reported the abandoned vehicle.","choices":["whom","who"],"answer":1,"fixed":false,"explanation":"The pronoun is the subject of \"had reported,\" so the subject form \"who\" is needed even though it follows the verb \"know.\" Test it with he or him: \"he had reported,\" not \"him had reported.\""},{"id":"gu-032","section":"grammar","subtype":"subject-verb-agreement","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"The box of shell casings _____ been logged into evidence.","choices":["have","has","was","were"],"answer":1,"fixed":false,"explanation":"The subject is \"box,\" which is singular; \"of shell casings\" only describes the box. A singular subject takes \"has,\" and only \"has\" or \"have\" can come before \"been.\""},{"id":"gu-033","section":"grammar","subtype":"subject-verb-agreement","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"Neither of the drivers _____ a valid license.","choices":["have","has"],"answer":1,"fixed":false,"explanation":"\"Neither\" used as a subject is singular; it means \"not one and not the other.\" It takes the singular verb \"has\" even though the plural word \"drivers\" comes right before the verb."},{"id":"gu-034","section":"grammar","subtype":"subject-verb-agreement","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"Each of the vehicles _____ searched before it was released to its owner.","choices":["was","were"],"answer":0,"fixed":false,"explanation":"\"Each\" is singular, so it takes the singular verb \"was.\" The words \"it\" and \"its\" later in the sentence confirm that the vehicles are being treated one at a time."},{"id":"gu-035","section":"grammar","subtype":"subject-verb-agreement","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":1,"stimulus":null,"stem":"The officers on the night shift _____ responsible for checking the business district.","choices":["is","are"],"answer":1,"fixed":false,"explanation":"The subject is \"officers,\" which is plural, so the plural verb \"are\" is needed. \"On the night shift\" only tells which officers and does not change the subject."},{"id":"gu-036","section":"grammar","subtype":"subject-verb-agreement","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"The jury _____ reached its verdict after two days of deliberation.","choices":["have","has"],"answer":1,"fixed":false,"explanation":"A collective noun such as \"jury\" takes a singular verb when the group acts as one unit. The singular pronoun \"its\" shows the jury is being treated as one unit, so \"has\" is correct."}
