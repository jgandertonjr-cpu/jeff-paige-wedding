/* Pre-academy own-running totals are static (they come from RUN_PLAN and the
   taper map), so they are computed once rather than on every render. */
const OWN_PRE=ownTotalsPre(null);

function Spark({pts}){
  if(!pts||pts.length<2)return null;
  const W=320,H=76,P=6;
  const t0=pts[0].t,t1=pts[pts.length-1].t||t0+1;
  const vals=pts.flatMap(p=>[p.bw,p.tr]);
  const lo=Math.min(...vals)-0.5,hi=Math.max(...vals)+0.5;
  const X=t=>P+(W-2*P)*(t1===t0?0.5:(t-t0)/(t1-t0));
  const Y=v=>P+(H-2*P)*(1-(v-lo)/(hi-lo));
  return(
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" height={H} style={{display:"block"}} role="img" aria-label="bodyweight trend">
      {pts.map((p,i)=><circle key={i} cx={X(p.t)} cy={Y(p.bw)} r="2.2" fill="rgba(255,255,255,.28)"/>)}
      <polyline fill="none" stroke="#4ade80" strokeWidth="2.4" strokeLinejoin="round" strokeLinecap="round"
        points={pts.map(p=>`${X(p.t).toFixed(1)},${Y(p.tr).toFixed(1)}`).join(" ")}/>
    </svg>
  );
}

const ACAD_TYPES=["Formation run","PT / calisthenics","Drill (boots)","Defensive tactics","Obstacle / agility","Other"];

/* ═══ APP ═══════════════════════════════════════════════════════════════ */
function App(){
  const t0=weekOfToday();
  const[week,setWeek]=useState(t0.week);
  const[dow,setDow]=useState(t0.dow);
  const[done,setDone]=useState({});
  const[pmPain,setPmPain]=useState({});
  const[pmShape,setPmShape]=useState({});   // what the pain DOES over the first 10 min
  const[amPain,setAmPain]=useState({});
  const[flags,setFlags]=useState({});
  const[scores,setScores]=useState([]);
  const[weights,setWeights]=useState([]);
  /* The screen is a RECORD, not a tick-box: the numbers are the point. */
  const[screen,setScreen]=useState(null);
  const[scr,setScr]=useState({tenderL:"",tenderR:"",hopL:"",hopR:"",raiseL:"",raiseR:""});
  const[efforts,setEfforts]=useState([]);
  const[runLog,setRunLog]=useState({...SEED_RUNLOG});   // week -> ACTUAL own running minutes
  const[logRM,setLogRM]=useState("");
  /* Defaults are MEASURED, not aspirational: an aspiration entered here
     silently inflates the calorie target and hides the real EA constraint. */
  const[body,setBody]=useState({bw:"",bf:"",ex:"450",neat:"light"});
  /* Any number of announced test dates — the taper engine fires before each. */
  const[tests,setTests]=useState([]);
  const[newTest,setNewTest]=useState("");
  const[newTestLbl,setNewTestLbl]=useState("");
  const[lifts,setLifts]=useState([]);         // [{iso,week,k,wt,reps}]
  const[liftK,setLiftK]=useState("squat");
  const[liftWt,setLiftWt]=useState("");
  const[liftReps,setLiftReps]=useState("");
  const[liftRpe,setLiftRpe]=useState("");
  const[acad,setAcad]=useState({});           // "w-d" -> [{type,dur,run,rpe}]
  const[acadForm,setAcadForm]=useState({type:ACAD_TYPES[0],dur:"",run:"",rpe:""});
  const[acadAssume,setAcadAssume]=useState(ACAD_ASSUME_DEFAULT);
  const[subs,setSubs]=useState({});   // per-day: bike | row | walk
  const[rtr,setRtr]=useState(null);   // null = not returning; 1-8 = ladder stage
  const[openItems,setOpenItems]=useState({});
  const[tab,setTab]=useState("today");
  const[logPU,setLogPU]=useState("");
  const[logSU,setLogSU]=useState("");
  const[logRun,setLogRun]=useState("");
  const[log300,setLog300]=useState("");
  const[logPUsp,setLogPUsp]=useState("");
  const[logSUsp,setLogSUsp]=useState("");
  const[logBW,setLogBW]=useState("");
  const[saveState,setSaveState]=useState("idle");
  const[loaded,setLoaded]=useState(false);
  /* If a stored payload cannot be read, the app must NOT then save an empty
     state over it. A failed load disables saving for the session. */
  const[loadErr,setLoadErr]=useState(false);
  const[migNote,setMigNote]=useState(null);
  const saveRef=useRef(null);

  useEffect(()=>{
    try{
      let d=null,from=null;
      const r6=storage.get(STORE);
      if(r6?.value)d=JSON.parse(r6.value);
      else{
        const r5=storage.get(V5_STORE);
        if(r5?.value){d=migrateV5(JSON.parse(r5.value));from="v5";}
        else{const r4=storage.get(LEGACY_STORE);if(r4?.value){d=migrateV4(JSON.parse(r4.value));from="v4";}}
      }
      if(d){
        if(d.done)setDone(d.done);
        if(d.pmPain)setPmPain(d.pmPain);
        if(d.pmShape)setPmShape(d.pmShape);
        if(d.amPain)setAmPain(d.amPain);
        if(d.flags)setFlags(d.flags);
        if(d.scores)setScores(d.scores);
        if(d.weights)setWeights(d.weights);
        if(d.screen)setScreen(d.screen);
        if(d.efforts)setEfforts(d.efforts);
        /* Merge, not replace — the seed history survives, his values win. */
        setRunLog({...SEED_RUNLOG,...(d.runLog||{})});
        if(d.body)setBody(b=>({...b,...d.body}));
        if(d.tests)setTests(d.tests);
        if(d.lifts)setLifts(d.lifts);
        if(d.acad)setAcad(d.acad);
        if(d.acadAssume!=null)setAcadAssume(d.acadAssume);
        if(d.subs)setSubs(d.subs);
        if(d.rtr!=null)setRtr(d.rtr);
        if(from)setMigNote(from);
      }
      /* v5 restored the last-VIEWED day on open, which on a daily-use app
         means opening on the wrong day. v6 always opens on today. */
    }catch(e){console.warn("blp: load failed — saving disabled this session",e);setLoadErr(true);}
    setLoaded(true);
  },[]);

  useEffect(()=>{
    if(!loaded||loadErr)return;
    setSaveState("saving");
    clearTimeout(saveRef.current);
    saveRef.current=setTimeout(()=>{
      try{
        storage.set(STORE,JSON.stringify({v:6,done,pmPain,pmShape,amPain,screen,subs,rtr,flags,scores,weights,efforts,runLog,body,tests,lifts,acad,acadAssume}));
        setSaveState("saved");
        setTimeout(()=>setSaveState("idle"),1500);
      }catch{setSaveState("error");}
    },600);
    return()=>clearTimeout(saveRef.current);
  },[done,pmPain,pmShape,amPain,screen,subs,rtr,flags,scores,weights,efforts,runLog,body,tests,lifts,acad,acadAssume,loaded,loadErr]);

  /* ── e1RM — most recent logged top set per lift, not the best: in a
     deficit a regression must bring the loads down with it. ── */
  const e1=useMemo(()=>{const o={};LIFTS.forEach(L=>{const v=e1Track(lifts.filter(x=>x.k===L.k));if(v)o[L.k]=v;});return o;},[lifts]);

  /* ── academy PT, per week ── */
  const acadWeek=useMemo(()=>{
    const o={};
    Object.entries(acad).forEach(([k,arr])=>{
      const m=/^(-?\d+)-(\d)$/.exec(k);if(!m)return;const w=+m[1];
      o[w]=o[w]||{run:0,srpe:0,n:0,min:0};
      (arr||[]).forEach(s=>{o[w].run+=+s.run||0;o[w].min+=+s.dur||0;o[w].srpe+=(+s.dur||0)*(+s.rpe||0);o[w].n++;});
    });
    return o;
  },[acad]);
  const acadLoggedRun=useMemo(()=>Object.fromEntries(Object.entries(acadWeek).filter(([w])=>+w>=ACADEMY_WK).map(([w,v])=>[w,v.run])),[acadWeek]);
  const acadPlan=useMemo(()=>academyWeeks(acadLoggedRun,+acadAssume||ACAD_ASSUME_DEFAULT,OWN_PRE),[acadLoggedRun,acadAssume]);

  /* ── test dates → per-day countdown ──
     Computed from the DATE of the day being built. v5 offset the countdown
     from the selected day, so browsing to another day dragged today's
     countdown onto it. */
  const testDates=useMemo(()=>tests.filter(t=>t&&t.date).map(t=>({...t,d:parseISO(t.date)})).sort((a,b)=>a.d-b.d),[tests]);
  const dtf=useMemo(()=>(w,d)=>{
    const day=dateOf(w,d);
    const nx=testDates.find(t=>t.d>=day);
    if(!nx)return null;
    const n=daysBetween(day,nx.d);
    const win=nx.d>=dateOf(ACADEMY_WK,0)?ACAD_TAPER_WINDOW:TAPER_WINDOW;
    return n<=win?n:null;
  },[testDates]);
  const nextTest=useMemo(()=>{const t=todayMid();const nx=testDates.find(x=>x.d>=t);return nx?{...nx,days:daysBetween(t,nx.d)}:null;},[testDates]);
  const daysToTest=nextTest?nextTest.days:null;

  /* ── RED LINE #21 · the collapse detector ────────────────────────────
     Fires on load SHAPE alone, regardless of reported pain: the Aug 10 → 17
     sequence (64 min, then 6) is the pattern that precedes an MTSS
     recurrence, and no pain score caught it. In the academy the week's total
     is his own logged running PLUS the academy PT log. */
  const runTot=w=>{const o=runLog[w]!=null?Number(runLog[w]):null;const a=acadWeek[w]?acadWeek[w].run:null;return o==null&&a==null?null:(o||0)+(a||0);};
  const load=useMemo(()=>{
    const at=runTot;
    const trailing=w=>{const v=[];for(let i=w-4;i<w;i++){const x=at(i);if(x!=null)v.push(x);}return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
    const cur=at(week),prev=at(week-1),tmPrev=trailing(week-1),tmCur=trailing(week);
    /* FLOOR: a ratio against a near-zero base carries no information.
       PLANNED: a taper is a deliberate cut, not a collapse. */
    const FLOOR=10;
    const planned=isTaperWk(week)||dtf(week,0)!=null||dtf(week,6)!=null;
    const spike=cur!=null&&tmCur!=null&&tmCur>=FLOOR&&cur>=1.3*tmCur;
    const collapsed=!planned&&cur!=null&&prev!=null&&prev>0&&tmPrev!=null&&tmPrev>=FLOOR&&cur<=0.5*prev&&prev>=1.3*tmPrev;
    /* The remedy resets to the trailing mean INCLUSIVE of the collapsed week. */
    const tmNext=trailing(week+1);
    return{cur,prev,trailing:tmCur,tmPrev,tmNext,spike,collapsed,
      reset:collapsed&&tmNext!=null?Math.round(tmNext):null};
  },[runLog,acadWeek,week,dtf]);

  const screenDone=!!screen;
  const puMax=useMemo(()=>{const r=[...scores].reverse().find(x=>x.pushups!=null);return r?r.pushups:PU_BASE;},[scores]);
  const suMax=useMemo(()=>{const r=[...scores].reverse().find(x=>x.situps!=null);return r?r.situps:SU_BASE;},[scores]);
  const puLogged=scores.some(x=>x.pushups!=null), suLogged=scores.some(x=>x.situps!=null);
  /* Most recent parseable 1.5 drives every pace — same rule as the maxes. */
  const run15=useMemo(()=>{const r=[...scores].reverse().map(x=>parseMMSS(x.run15)).find(x=>x!=null);return r||RUN15_ENTRY;},[scores]);

  /* 7-day trend rule — three or more days with ANY tibial pain in a rolling
     seven triggers the flare protocol regardless of the daily peak. It walks
     back across the v5 → v6 changeover, which is why the keys were shifted. */
  const trend=useMemo(()=>{
    let n=0,w=week,d=dow;
    for(let i=0;i<7;i++){
      const k=B(w,d);
      const v=Math.max(pmPain[k]??0,amPain[k]??0);
      if(v>0)n++;
      d--;if(d<0){d=6;w--;}
      if(w<-60)break;
    }
    return n;
  },[week,dow,pmPain,amPain]);

  const ctxLite=useMemo(()=>({puMax,suMax,e1,acadPlan,trend,run15}),[puMax,suMax,e1,acadPlan,trend,run15]);
  /* Days actually completed (≥75% of the day's items). Under 14 and a
     pre-academy taper runs COLD. */
  const programDays=useMemo(()=>{
    let n=0;
    for(let w=1;w<=week;w++)for(let d=0;d<7;d++){
      const t=trackKeys(w,d,null,ctxLite);
      if(t.all.length&&t.all.filter(k=>done[k]).length/t.all.length>=0.75)n++;
    }
    return n;
  },[done,week,ctxLite]);
  const recentTT=useMemo(()=>scores.some(x=>x.run15&&(week-x.week)<=2),[scores,week]);
  /* Days per week with an academy session logged at 8+/10. */
  const acadHard=useMemo(()=>{const o={};Object.entries(acad).forEach(([k,arr])=>{const m=/^(-?\d+)-(\d)$/.exec(k);if(m&&(arr||[]).some(x=>(+x.rpe||0)>=8))o[+m[1]]=(o[+m[1]]||0)+1;});return o;},[acad]);
  const ctx=useMemo(()=>({screenDone,programDays,recentTT,sub:subs[B(week,dow)]||null,rtr,puMax,suMax,e1,acadPlan,trend,dtf,run15,acadHard}),
    [screenDone,programDays,recentTT,subs,week,dow,rtr,puMax,suMax,e1,acadPlan,trend,dtf,run15,acadHard]);
  const plan=useMemo(()=>buildDay(week,dow,dtf(week,dow),ctx),[week,dow,dtf,ctx]);
  const tracks=useMemo(()=>trackKeys(week,dow,dtf(week,dow),ctx),[week,dow,dtf,ctx]);
  const b=B(week,dow);
  const ph=plan.ph;

  const pmVal=pmPain[b]??null, amVal=amPain[b]??null, shapeVal=pmShape[b]??null;
  const iGate=impactGate(pmVal,shapeVal,amVal), mGate=morningGate(amVal);
  const flagsHit=RED_FLAGS.filter((_,i)=>flags[`${b}-f${i}`]).length;
  const calisHit=CALIS_FLAGS.filter((_,i)=>flags[`${b}-c${i}`]).length;

  /* Shin status for the deficit rule — wired to the same gates the training
     reads, so the Fuel tab can never disagree with the Today tab. */
  const shin=(flagsHit>0||trend>=3||rtr!=null||iGate.k==="stop"||mGate.k==="back")?"flare":(trend>0||mGate.k==="hold")?"symptomatic":"clear";
  const effortsUsed=efforts.filter(e=>e.week>=1&&e.week<ACADEMY_WK).length;
  const testInWindow=nextTest!=null&&nextTest.days<=(nextTest.d>=dateOf(ACADEMY_WK,0)?ACAD_TAPER_WINDOW:TAPER_WINDOW);
  const realWk=weekOfDate(todayMid());
  const exAge=body.exAt?daysBetween(parseISO(body.exAt),todayMid()):null;
  const exStale=exAge==null||exAge>14;
  /* Sleep counts only while it is fresh: one old entry should not cap (or
     clear) the deficit for months. */
  const sleepAge=body.sleepAt?daysBetween(parseISO(body.sleepAt),todayMid()):null;
  const sleepFresh=sleepAge!=null&&sleepAge<=14;
  const nutri=useMemo(()=>nutrition(parseFloat(body.bw),parseFloat(body.bf),parseFloat(body.ex),(NEAT.find(x=>x.k===body.neat)||NEAT[1]).m,
    {shin,phase:getPhase(Math.max(1,realWk)).id,wk:realWk,taper:testInWindow,neatK:body.neat,exStale,sleep:sleepFresh?parseFloat(body.sleep):null}),[body,shin,realWk,testInWindow,exStale]);
  const warnPct=nutri?nutri.warnPct:0.7;
  /* Deficit (re)starts on this calendar: Week 1, and Week 15 after the
     academy's two maintenance weeks. */
  const wt=useMemo(()=>weightTrend(weights,[START,dateOf(ACADEMY_WK+2,0)]),[weights]);

  const tStat=useMemo(()=>({
    am:{done:tracks.am.filter(k=>done[k]).length,total:tracks.am.length},
    pm:{done:tracks.pm.filter(k=>done[k]).length,total:tracks.pm.length},
  }),[tracks,done]);
  const totalItems=tracks.all.length;
  const pct=totalItems?Math.round(tracks.all.filter(k=>done[k]).length/totalItems*100):0;

  const streak=useMemo(()=>{
    let s=0,w=week,d=dow;
    for(let i=0;i<300;i++){
      const t=trackKeys(w,d,dtf(w,d),ctx);
      if(t.pre)break;
      const c=t.all.filter(k=>done[k]).length;
      const pass=t.all.length===0||c/t.all.length>=0.75;
      if(pass)s++;else if(!(w===week&&d===dow))break;
      d--;if(d<0){d=6;w--;}
      if(w<1)break;
    }
    return s;
  },[week,dow,done,ctx,dtf]);

  const weekDots=useMemo(()=>DAYS.map((_,d)=>{
    const t=trackKeys(week,d,dtf(week,d),ctx);
    if(t.pre)return"pre";
    if(!t.all.length)return"rest";
    const ratio=t.all.filter(k=>done[k]).length/t.all.length;
    return ratio>=0.8?"full":ratio>0?"part":"empty";
  }),[week,done,ctx,dtf]);

  const toggle=k=>setDone(p=>({...p,[k]:!p[k]}));
  const flip=k=>setOpenItems(p=>({...p,[k]:!p[k]}));
  const nowStamp=()=>{const t=todayMid();return{date:t.toLocaleDateString(),iso:isoOf(t),week:weekOfDate(t)};};

  const addScore=()=>{
    const pu=parseInt(logPU)||null,su=parseInt(logSU)||null,run15=logRun.trim()||null,t300=log300.trim()||null;
    const puSp=logPUsp.trim()||null,suSp=logSUsp.trim()||null;
    if(!pu&&!su&&!run15&&!t300)return;
    const st=nowStamp();
    if(t300&&st.week<ACADEMY_WK){
      if(effortsUsed>=MAX_300_EFFORTS&&!window.confirm(`You have already spent both full-effort 300m tokens before the academy (${effortsUsed}/${MAX_300_EFFORTS}). Bone fatigue life falls exponentially with strain magnitude, which is why the cap exists. Log this anyway?`))return;
      setEfforts(p=>[...p,{...st,t300}]);
    }
    setScores(p=>[...p,{...st,pushups:pu,situps:su,run15,t300,puSp,suSp}]);
    setLogPU("");setLogSU("");setLogRun("");setLog300("");setLogPUsp("");setLogSUsp("");
  };
  const addWeight=()=>{
    const bw=parseFloat(logBW);
    if(!bw)return;
    setWeights(p=>[...p,{...nowStamp(),bw}]);
    /* A weigh-in holds fat-free mass constant and re-derives body fat from it.
       v6.1 kept BF% fixed, which silently counted 68% of every pound lost as
       lean mass — ~3 kg of phantom FFM loss by December, which puts true
       energy availability under the floor the app thinks it is holding. */
    setBody(p=>{const obw=parseFloat(p.bw),obf=parseFloat(p.bf);
      if(obw&&obf){const ffm=obw*(1-obf/100);return{...p,bw:String(bw),bf:String(Math.max(5,Math.round((1-ffm/bw)*1000)/10))};}
      return{...p,bw:String(bw)};});
    setLogBW("");
  };
  const addLift=()=>{
    const wtv=parseFloat(liftWt),r=parseInt(liftReps);
    if(!wtv||!r)return;
    /* Asked as "reps left in the tank" (0–5) — plainer than RPE, same
       information: RPE = 10 − reps left. */
    const left=parseFloat(liftRpe);
    if(!(left>=0&&left<=5)){window.alert("Add how many more reps you could have done on that set (0–5). Without it the app cannot tell a hard set from an easy one, and your loads would drift down.");return;}
    const rpe=10-left;
    if(r>10&&!window.confirm("e1RM estimates are unreliable past 10 reps. Log anyway?"))return;
    setLifts(p=>[...p,{...nowStamp(),k:liftK,wt:wtv,reps:r,rpe}]);
    setLiftWt("");setLiftReps("");setLiftRpe("");
  };
  const addAcad=()=>{
    const f=acadForm;
    if(!f.dur&&!f.run)return;
    setAcad(p=>({...p,[b]:[...(p[b]||[]),{type:f.type,dur:+f.dur||0,run:+f.run||0,rpe:+f.rpe||0}]}));
    setAcadForm(x=>({...x,dur:"",run:"",rpe:""}));
  };
  const delAcad=i=>setAcad(p=>({...p,[b]:(p[b]||[]).filter((_,j)=>j!==i)}));
  const addTest=()=>{
    if(!newTest)return;
    setTests(p=>[...p,{date:newTest,label:newTestLbl.trim()||"Fitness test"}]);
    setNewTest("");setNewTestLbl("");
  };
  const resetAll=()=>{
    if(!window.confirm("Wipe all progress? This can't be undone."))return;
    setDone({});setPmPain({});setPmShape({});setAmPain({});setFlags({});setScores([]);setWeights([]);setScreen(null);setSubs({});setRtr(null);setEfforts([]);
    setLifts([]);setAcad({});setTests([]);setRunLog({...SEED_RUNLOG});   // wiping progress must not delete measured history
    storage.delete(STORE);
  };

  if(!loaded)return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",gap:14}}>
      <div style={{fontFamily:"var(--cond)",fontSize:13,fontWeight:700,letterSpacing:".34em",color:"var(--org)"}}>BLUE LINE PREP</div>
      <div style={{width:120,height:2,background:"linear-gradient(90deg,transparent,#3b82f6,transparent)"}}/>
      <div style={{fontSize:11,letterSpacing:".2em",color:"var(--tx-3)"}}>LOADING…</div>
    </div>
  );

  const ringColor=pct>=80?"#22c55e":pct>=40?ph.color:"#4b5563";
  const dayDate=dateOf(week,dow);
  const screenWall=plan.impact&&plan.taper!=null&&!screenDone;
  const blockedForImpact=plan.impact&&(iGate.k==="stop"||iGate.k==="swap"||flagsHit>0||screenWall);
  const acadDayBlocked=isAcademy(week)&&dow<=4&&(iGate.k==="stop"||iGate.k==="swap"||flagsHit>0||mGate.k==="back"||trend>=3);
  const daysToAcademy=daysBetween(todayMid(),dateOf(ACADEMY_WK,0));
  const latest=k=>{const r=[...scores].reverse().find(x=>x[k]!=null&&x[k]!=="");return r?r[k]:null;};

  return(
    <div className="app">

      <header className="hero">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:14}}>
          <div style={{minWidth:0,flex:1}}>
            <div className="brand">BLUE LINE PREP</div>
            <div style={{display:"flex",alignItems:"flex-end",gap:11,marginTop:12}}>
              <span className="dayname">{DAYS[dow].toUpperCase()}</span>
              <div style={{paddingBottom:2}}>
                <div className="metaline">{plan.taper!=null?(plan.taper===0?"TEST DAY":`T−${plan.taper}`):wkLabel(week)}</div>
                <div className="metasub">{fmtDate(dayDate).toUpperCase()} · {plan.rest?(isAcademy(week)?"RANGE DAY":"REST"):ph.name.toUpperCase()}</div>
              </div>
            </div>
            <div className="streak">🔥 {streak}-day streak</div>
          </div>
          <div style={{textAlign:"center",flexShrink:0}}>
            <Ring pct={plan.rest?0:pct} label={plan.rest?"–":pct+"%"} color={ringColor}/>
            <div style={{fontSize:9.5,color:"var(--tx-3)",letterSpacing:".18em",fontWeight:700,marginTop:6}}>TODAY</div>
          </div>
        </div>

        <div style={{marginTop:16}}>
          {!plan.rest?(
            <div style={{display:"flex",gap:7}}>
              <TrackBar label="AM" done={tStat.am.done} total={tStat.am.total} color={ph.color}/>
              <TrackBar label="PM" done={tStat.pm.done} total={tStat.pm.total} color="#22d3ee"/>
            </div>
          ):(
            <div style={{background:"rgba(255,255,255,.045)",border:"1px solid var(--line)",borderRadius:12,padding:"12px 14px",fontSize:13,color:"var(--tx-2)",lineHeight:1.55}}>{isAcademy(week)?"Range day. No supplemental training — the screen below is five minutes and it is the one thing worth doing.":"Genuine full rest. One per week, every week — sameness is its own injury risk factor, and this is the day that breaks it up."}</div>
          )}
        </div>

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginTop:12}}>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            <Pill label={`PH ${ph.id} · ${ph.name}`} color={ph.color}/>
            {plan.taper!=null&&<Pill label={plan.taper===0?"⭐ TEST DAY":`TAPER · T−${plan.taper}`} color="#f43f5e"/>}
            {plan.mock&&<Pill label="MOCK PFT" color="#f43f5e"/>}
            {plan.retest&&<Pill label="AMRAP RETEST" color="#a855f7"/>}
            {plan.dl&&<Pill label="🔄 Deload" color="#22d3ee"/>}
            {plan.impact&&<Pill label="IMPACT DAY" color="#f4640a"/>}
          </div>
          <div className="save" style={{color:saveState==="error"||loadErr?"#fb7185":saveState==="saved"?"#4ade80":"var(--tx-3)"}}>
            {loadErr?"not saving":saveState==="saving"?"saving…":saveState==="saved"?"saved ✓":saveState==="error"?"save failed":""}
          </div>
        </div>
      </header>

      <div className="daybar">
        <button className="arr" onClick={()=>setWeek(Math.max(1,week-1))} disabled={week<=1} aria-label="previous week">‹</button>
        <div className="days">
          {DAYS.map((d,i)=>(
            <button key={d} className={"day"+(i===dow?" on":"")} disabled={weekDots[i]==="pre"}
                    style={weekDots[i]==="pre"?{opacity:.3,cursor:"default"}:null} onClick={()=>setDow(i)}>
              <span className="day-t">{d}</span>
              <span className="dot" style={{background:weekDots[i]==="pre"?"transparent":weekDots[i]==="full"?"#22c55e":weekDots[i]==="part"?"#f59e0b":weekDots[i]==="rest"?"transparent":(i===dow?"rgba(0,0,0,.18)":"rgba(255,255,255,.14)")}}/>
            </button>
          ))}
        </div>
        <button className="arr" onClick={()=>setWeek(Math.min(TOTAL_WEEKS,week+1))} disabled={week>=TOTAL_WEEKS} aria-label="next week">›</button>
      </div>

      {/* ══════════ TODAY ══════════ */}
      {tab==="today"&&(
        <div className="pane" key="today">

          {loadErr&&(
            <div style={{marginBottom:12}}>
              <Note color="#f43f5e"><strong className="k" style={{color:"#fb7185"}}>Saved data could not be read.</strong> Nothing will be saved this session, so your stored data is not overwritten. Your data is still on this device.</Note>
            </div>
          )}

          {migNote&&(
            <div style={{marginBottom:12}}>
              <Note color="#22c55e">
                <strong className="k" style={{color:"#4ade80"}}>Your {migNote} data was carried over.</strong> Pain history, flags, scores, bodyweights, the run log and the screen are all here, re-dated onto the new calendar. The old copy is kept untouched on this device.
              </Note>
            </div>
          )}

          {t0.pre&&week===1&&(
            <div style={{marginBottom:12}}>
              <Note color="#f59e0b">
                <strong className="k" style={{color:"#fbbf24"}}>Week 1 opens Monday 12 October — this is a preview of day one.</strong> Monday is the TRUE baseline: your 9/21 push-ups and sit-ups were stopped at the standard, so nobody knows your max yet. Before then: <strong style={{color:"var(--tx)"}}>buy the duty boots if you don't have them</strong> (break-in starts Week 1), and enter bodyweight and body fat on the Fuel tab.
              </Note>
            </div>
          )}

          {!screenDone&&(
            <div style={{marginBottom:12}}>
              <Note color="#f43f5e">
                <strong className="k" style={{color:"#fb7185"}}>No baseline screen on record — do it this week, before the running and boot load starts climbing.</strong> Tenderness map in cm photographed with a ruler, the eight red flags, ten single-leg hops per leg, heel-raise to failure both knee angles. About twenty minutes, zero shin cost.<br/><br/>
                Every weekly re-measure compares against it — <strong style={{color:"var(--tx)"}}>without a baseline nobody can tell whether tenderness has increased</strong>, which is the reading that separates managing this from missing it. Fill in the Baseline Screen card on the <strong style={{color:"var(--tx)"}}>Records</strong> tab; ticking items on a day card does not record it.
              </Note>
            </div>
          )}

          {plan.taper!=null&&(
            <div style={{marginBottom:12}}>
              <Note color="#f43f5e">
                <strong className="k" style={{color:"#fb7185"}}>Taper active — the written day is suspended.</strong> Nothing you add now produces adaptation; it produces fatigue. <strong style={{color:"var(--tx)"}}>The taper is not the last chance to get fitter. It is the only chance to arrive un-tired.</strong>{isAcademy(week)?<> Inside the academy the taper only cuts <em>your</em> work — the academy's PT still happens and still counts.</>:<> Volume comes down; <strong style={{color:"var(--tx)"}}>frequency and intensity do not.</strong></>}<br/><br/>
                <strong style={{color:"var(--tx)"}}>Nothing new.</strong> No movement, shoe, supplement or caffeine protocol you have not already used. <strong style={{color:"var(--tx)"}}>Maintenance calories</strong> until the test is done.
              </Note>
            </div>
          )}

          {plan.mock&&(
            <div style={{marginBottom:12}}>
              <Note color="#a855f7">
                <strong className="k" style={{color:"#c084fc"}}>Mock PFT — full test order, full effort.</strong> Sit-ups → 300 m → push-ups → 1.5 mile, ≥5 min between, inside two hours. It spends one of your two 300 m tokens. Log every number and the 15-second splits on the Records tab: this is the last read on your fitness before day one, and the push-up and sit-up doses rescale from it. If the morning gate is not 0/10, the runs come out and the calisthenics stay.
              </Note>
            </div>
          )}

          {daysToTest!=null&&daysToTest>=0&&daysToTest<=21&&plan.taper==null&&(
            <div style={{marginBottom:12}}>
              <Note color="#f59e0b">
                <strong className="k" style={{color:"#fbbf24"}}>{nextTest.label} in {daysToTest} days ({fmtDate(nextTest.d)}).</strong> The taper fires {nextTest.d>=dateOf(ACADEMY_WK,0)?`${ACAD_TAPER_WINDOW}`:`${TAPER_WINDOW}`} days out on its own. Until then, train as written — and no max effort of any event inside 10 days.
              </Note>
            </div>
          )}

          {plan.rest?(
            <>
              <div className="card" style={{padding:"34px 20px",textAlign:"center"}}>
                <div style={{fontSize:42,marginBottom:12}}>{isAcademy(week)?"🎯":"😴"}</div>
                <div style={{fontFamily:"var(--cond)",fontSize:24,fontWeight:800,letterSpacing:".1em",marginBottom:10}}>{isAcademy(week)?"RANGE DAY":"REST DAY"}</div>
                <div style={{fontSize:13.5,color:"var(--tx-2)",lineHeight:1.65,maxWidth:340,margin:"0 auto"}}>
                  {isAcademy(week)?"Hours on your feet in boots count as load. No supplemental training today.":"Full recovery."} Sleep is the highest-value thing you can track — short sleep carries roughly 34% higher injury odds, and no wearable metric detects bone stress.<br/><br/>
                  Walk if you feel like it. Still do the daily prehab battery — about 15–20 minutes, and the strongest MTSS prevention evidence there is.
                </div>
              </div>
              {plan.am.length>0&&(
                <div style={{marginTop:12}}>
                  <Block label={plan.taper!=null?"Last Touch Before The Test":"Weekly Objective Screen"} color="#22c55e" badge={plan.taper!=null?`T−${plan.taper}`:"SUNDAY"}>
                    {plan.am.map((item,i)=>{const k=`${b}-am-${i}`;return<ExItem key={k} item={item} checked={!!done[k]} onToggle={()=>toggle(k)} isOpen={!!openItems[k]} onOpen={()=>flip(k)} accent="#22c55e"/>;})}
                  </Block>
                  <div style={{marginTop:10}}>
                    <Note color="#22c55e">
                      The daily gates are things you <em>feel</em>. These two are things you <strong style={{color:"var(--tx)"}}>measure</strong> — and they catch the drift a pain score misses. Tenderness lengthening while your daily ratings sit at zero is exactly the pattern worth finding early.
                    </Note>
                  </div>
                </div>
              )}
            </>
          ):(
            <>
              {/* Gates come first — they decide whether the session happens at all. */}
              <Block label="Gate 1 · Shin Pain Now (0–10)" color="#94a3b8" badge={plan.impact?"IMPACT DAY":null}>
                <div className="pad">
                  <div className="pain">
                    {Array.from({length:11},(_,n)=>{
                      const on=pmVal===n;
                      const c=n===0?"#22c55e":n<=3?"#f59e0b":"#f43f5e";
                      return<button key={n} onClick={()=>setPmPain(p=>({...p,[b]:n}))} style={on?{background:c,borderColor:c,color:"#07080b",boxShadow:`0 4px 14px ${c}40`}:null}>{n}</button>;
                    })}
                  </div>
                  {pmVal!=null&&pmVal>0&&pmVal<6&&(
                    <div style={{marginTop:12}}>
                      <div style={{fontSize:9.5,color:"var(--tx-3)",fontWeight:700,letterSpacing:".13em",marginBottom:7}}>AND WHAT DOES IT DO OVER THE FIRST TEN MINUTES?</div>
                      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6}}>
                        {[["settles","Settles","#22c55e"],["plateau","Plateaus","#22c55e"],["climbs","Climbs","#f43f5e"]].map(([k,lbl,c])=>{
                          const on=shapeVal===k;
                          return <button key={k} onClick={()=>setPmShape(x=>({...x,[b]:k}))}
                            style={{height:44,borderRadius:11,border:`1px solid ${on?c:"var(--line)"}`,background:on?c:"rgba(255,255,255,.04)",
                              color:on?"#07080b":"var(--tx-2)",fontFamily:"var(--cond)",fontWeight:700,fontSize:14,letterSpacing:".04em"}}>{lbl}</button>;
                        })}
                      </div>
                    </div>
                  )}
                  <div style={{marginTop:12}}><Gate info={iGate}/></div>
                  <div className="fine" style={{marginTop:12}}>
                    <strong style={{color:"var(--tx-2)"}}>The rule:</strong> run only at 0/10, or at 1–2/10 that settles within ten minutes when this morning’s first steps were 0/10. 3–4/10 → bike today. Pain that climbs minute over minute, comes on earlier session by session, or that you can cover with one fingertip is the stress-injury pattern — that one stops the session whatever the number says.<br/><br/>
                    The 1–3/10 band is acceptable for <strong style={{color:"var(--tx-2)"}}>rehab strength work</strong> but not for impact — that threshold comes from tendon research and does not transfer to bone.
                  </div>
                </div>
              </Block>

              <div style={{marginTop:12}}>
                <Block label="Gate 2 · This Morning, First Steps" color="#94a3b8">
                  <div className="pad">
                    <div className="pain">
                      {Array.from({length:11},(_,n)=>{
                        const on=amVal===n;
                        const c=n===0?"#22c55e":n<=2?"#f59e0b":"#f43f5e";
                        return<button key={n} onClick={()=>setAmPain(p=>({...p,[b]:n}))} style={on?{background:c,borderColor:c,color:"#07080b",boxShadow:`0 4px 14px ${c}40`}:null}>{n}</button>;
                      })}
                    </div>
                    <div style={{marginTop:12}}><Gate info={mGate}/></div>
                    <div className="fine" style={{marginTop:12}}>The 24-hour response is what separates a dose you tolerated from one you did not.</div>
                  </div>
                </Block>
              </div>

              {trend>=3&&(
                <div style={{marginTop:12}}>
                  <Note color="#f43f5e">
                    <strong className="k" style={{color:"#fb7185"}}>7-day trend rule triggered — {trend} of the last 7 days had tibial pain.</strong> Enter the flare protocol regardless of how low the daily numbers were. Three low-grade days in a week is a pattern, and the pattern is what becomes the injury. The deficit goes to maintenance on the Fuel tab automatically.
                  </Note>
                </div>
              )}

              <div style={{marginTop:12}}>
                <Block label="Red Flags · Always On" color="#f43f5e" badge={flagsHit?`${flagsHit} HIT`:null}>
                  <div className="pad">
                    {RED_FLAGS.map((f,i)=>{
                      const k=`${b}-f${i}`,on=!!flags[k];
                      return(
                        <button key={i} className="flag" onClick={()=>setFlags(p=>({...p,[k]:!p[k]}))}>
                          <span className="flag-b" style={on?{borderColor:"#f43f5e",background:"#f43f5e"}:null}>{on&&<CheckSm/>}</span>
                          <span className="flag-t" style={on?{color:"#fda4af"}:null}>{f}</span>
                        </button>
                      );
                    })}
                    {flagsHit>0&&<div style={{marginTop:12}}><Gate info={{c:"#f43f5e",h:"STOP — GET IMAGED",m:"This channel is never gated behind a pain score. Anterior cortex pain in particular is never trained through. STOP TRAINING AND GET SEEN IN PERSON — a physical therapist or sports-medicine physician, for an actual examination and imaging if indicated. Nothing in this app is a diagnosis. A stress fracture costs you the academy class; two weeks of caution does not."}}/></div>}
                  </div>
                </Block>
              </div>

              <div style={{marginTop:12}}>
                <Block label="Stop Signs · Push-Ups &amp; Sit-Ups" color="#f43f5e" badge={calisHit?`${calisHit} HIT`:null}>
                  <div className="pad">
                    <div className="fine" style={{marginBottom:10}}>Separate from the shin flags because the action is different. Any single item stops training on its own.</div>
                    {CALIS_FLAGS.map((f,i)=>{
                      const k=`${b}-c${i}`,on=!!flags[k];
                      return(
                        <button key={i} className="flag" onClick={()=>setFlags(p=>({...p,[k]:!p[k]}))}>
                          <span className="flag-b" style={on?{borderColor:"#f43f5e",background:"#f43f5e"}:null}>{on&&<CheckSm/>}</span>
                          <span className="flag-t" style={on?{color:"#fda4af"}:null}>{f}</span>
                        </button>
                      );
                    })}
                    {calisHit>0&&<div style={{marginTop:12}}><Gate info={{c:"#f43f5e",h:"STOP — SEEN IN PERSON",m:"Item 1 is an emergency department visit today, not a phone call: ask for a creatine kinase level. In the academy, tell the staff the same day — high-rep PT is exactly the setting rhabdomyolysis happens in. The rest need an in-person assessment before another rep of either movement."}}/></div>}
                    <div className="fine" style={{marginTop:12}}>Also worth checking every morning: elbow stiffness lasting more than 15 minutes is the earliest honest sign of tendinopathy. If it shows up, barbell pressing comes out first — before a single push-up rep does. Bench is not on the test.</div>
                  </div>
                </Block>
              </div>

              {screenWall&&(
                <div style={{marginTop:12}}>
                  <Gate info={{c:"#f43f5e",h:"SCREEN NOT DONE — AND THIS IS AN IMPACT DAY INSIDE A TAPER",
                    m:"Ten single-leg hops at 0/10 and the eight red flags are what separate shins that ache from a stress reaction you are about to run a maximal test on. Twenty minutes — record it on the Records tab and this session appears."}}/>
                </div>
              )}
              {blockedForImpact&&!screenWall&&(
                <div style={{marginTop:12}}>
                  <Note color="#f59e0b">
                    <strong className="k" style={{color:"#fbbf24"}}>Today has impact work and the gate is closed.</strong> Skip any jumps and use <strong style={{color:"var(--tx)"}}>Swap The Run</strong> below (if there is a run) — the bike is tibially free, so shin pain never cancels a Z2 ride. Keep the strength and neuromuscular work. The TrueForm is <strong style={{color:"var(--tx)"}}>not</strong> a substitute — every minute counts as full impact volume. Boot walks stay only if WALKING is 0/10.<br/><br/>
                    <strong style={{color:"#fb7185"}}>Gate:</strong> if walking hurts, that is red flag 6. Stop and report it.
                  </Note>
                </div>
              )}
              {acadDayBlocked&&(
                <div style={{marginTop:12}}>
                  <Note color="#f43f5e">
                    <strong className="k" style={{color:"#fb7185"}}>Academy day with a closed shin gate.</strong> You cannot swap the academy's run, so the honest move is the hard one: <strong style={{color:"var(--tx)"}}>tell the PT staff today</strong>, before the formation run, and ask for the academy's injury pathway. Running through a stress reaction is how a class becomes the next class. Your own running this week is zero, the deficit is off, and the prehab still happens.
                  </Note>
                </div>
              )}

              {/* RED LINE #29 — the prescription stays hidden until the morning
                  rating is in. A gate whose consequence is visible before the
                  answer is given is not a gate, it is a negotiation. */}
              {amVal==null&&(
                <div style={{marginTop:4}}>
                  <Block label="Rate First · Session Hidden" color="#606877">
                    <div className="pad" style={{fontSize:13.5,color:"var(--tx-2)",lineHeight:1.65}}>
                      Enter <strong style={{color:"var(--tx)"}}>Gate 2</strong> above — your shin at first steps out of bed — and today's session appears.<br/><br/>
                      It is hidden on purpose. Rating your shin while looking at the session you stand to lose is not a measurement, it is a negotiation.
                    </div>
                  </Block>
                </div>
              )}

              <div style={{marginTop:12}}>
                <Block label="Return To Run" color="#22c55e" badge={rtr?`STAGE ${rtr}/8`:null}>
                  <div className="pad">
                    {rtr?(
                      <>
                        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:10}}>
                          <button className="btn-ghost" onClick={()=>setRtr(Math.max(1,rtr-1))}>− Stage</button>
                          <button className="btn-ghost" onClick={()=>setRtr(Math.min(8,rtr+1))}>+ Stage</button>
                          <button className="btn-ghost" onClick={()=>setRtr(null)} style={{gridColumn:"span 2"}}>Exit ladder</button>
                        </div>
                        <div className="fine">
                          <strong style={{color:"var(--tx-2)"}}>Alternate days only.</strong> Advance ONE stage only when the session was 0/10 <em>and</em> the next morning was 0/10. Any non-zero repeats the stage.<br/><br/>
                          Stage 8 cleared twice = back to the written plan. Everything except the run stays as written.
                        </div>
                      </>
                    ):(
                      <>
                        <button className="btn" style={{width:"100%"}} onClick={()=>setRtr(5)}>START AT STAGE 5</button>
                        <div className="fine" style={{marginTop:10}}>
                          Use this once you have been evaluated and cleared after a flare. <strong style={{color:"var(--tx-2)"}}>You do not restart from zero</strong> — with your base intact, stage 5 is a 10-minute continuous dose and stage 8 is about two weeks away on alternate days.
                        </div>
                      </>
                    )}
                  </div>
                </Block>

            <div className="fine" style={{marginTop:12}}>
