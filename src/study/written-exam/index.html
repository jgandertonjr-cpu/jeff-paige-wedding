<style>
:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#475569;--faint:#64748b;--border:#e2e8f0;--border2:#cbd5e1;--brand:#4f46e5;--brand-h:#4338ca;--brand-weak:#eef2ff;--brand-text:#4338ca;--good-bg:#ecfdf5;--good-bd:#6ee7b7;--good:#047857;--bad-bg:#fef2f2;--bad-bd:#fca5a5;--bad:#b91c1c;--warn-bg:#fef3c7;--warn:#92400e;--track:#e2e8f0;--nav:rgba(255,255,255,.95)}
.dark{--bg:#020617;--card:#0f172a;--text:#f1f5f9;--muted:#94a3b8;--faint:#94a3b8;--border:#334155;--border2:#475569;--brand:#4f46e5;--brand-h:#6366f1;--brand-weak:#1e293b;--brand-text:#a5b4fc;--good-bg:rgba(6,78,59,.35);--good-bd:#065f46;--good:#6ee7b7;--bad-bg:rgba(127,29,29,.35);--bad-bd:#991b1b;--bad:#fca5a5;--warn-bg:rgba(120,53,15,.5);--warn:#fde68a;--track:#334155;--nav:rgba(15,23,42,.95)}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
@media(min-width:1024px){html{font-size:17px}}
body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
main{max-width:56rem;margin:0 auto;padding:1.25rem 1rem 6.5rem}
main.run{padding-bottom:2rem}
h1{font-size:1.5rem;font-weight:700;letter-spacing:-.01em;margin:0 0 .25rem}
h2{font-size:1.1rem;font-weight:700;margin:0 0 .5rem}
h3{font-size:.95rem;font-weight:700;margin:0 0 .35rem}
p{margin:0 0 .6rem}
.sub{color:var(--muted);font-size:.875rem;margin-bottom:1rem}
.small{font-size:.8125rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:.75rem;padding:1rem;box-shadow:0 1px 2px rgba(0,0,0,.05);margin-bottom:.875rem}
.row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.75rem;padding:.5rem 1rem;border-radius:.5rem;border:1px solid transparent;font:inherit;font-size:.875rem;font-weight:600;cursor:pointer;background:var(--brand);color:#fff;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--brand-h)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:var(--card);color:var(--text);border-color:var(--border2)}
.btn.sec:hover{background:var(--brand-weak)}
.btn.ghost{background:transparent;color:var(--brand-text)}
.btn.ghost:hover{background:var(--brand-weak)}
.btn.danger{background:#dc2626}
.btn.big{min-height:3.25rem;font-size:1rem;width:100%}
.badge{display:inline-block;border-radius:999px;padding:.1rem .55rem;font-size:.75rem;font-weight:600;background:var(--brand-weak);color:var(--brand-text);white-space:nowrap}
.badge.good{background:var(--good-bg);color:var(--good)}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.plain{background:var(--track);color:var(--muted)}
.bar{height:.5rem;background:var(--track);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:#6366f1;border-radius:999px}
.count{display:flex;align-items:baseline;gap:.5rem}
.count b{font-size:2.75rem;line-height:1;font-weight:800;letter-spacing:-.02em;color:var(--brand-text)}
.task{display:flex;gap:.75rem;align-items:center;padding:.75rem 0;border-top:1px solid var(--border)}
.task:first-of-type{border-top:0}
.tick{width:1.6rem;height:1.6rem;border-radius:999px;border:2px solid var(--border2);display:inline-flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;flex:none;color:transparent}
.tick.done{background:#059669;border-color:#059669;color:#fff}
.task .t{font-weight:600}
.notice{border-radius:.75rem;padding:.75rem 1rem;background:var(--warn-bg);color:var(--warn);font-size:.875rem;margin-bottom:.875rem}
.stim{background:var(--card);border:1px solid var(--border);border-radius:.75rem;padding:.875rem 1rem;margin-bottom:.875rem;font-size:.95rem;line-height:1.6}
.stim summary{cursor:pointer;font-weight:700;font-size:.875rem;color:var(--brand-text);min-height:1.75rem}
.stim p{max-width:68ch;white-space:pre-wrap}
table.t{border-collapse:collapse;width:100%;font-size:.875rem}
table.t th,table.t td{border:1px solid var(--border);padding:.35rem .5rem;text-align:left;vertical-align:top}
table.t th{background:var(--brand-weak);font-weight:600}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.stim table.t{font-size:.8rem}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border2);border-radius:.5rem;overflow:hidden;font-size:.85rem}
.form div{padding:.35rem .5rem;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
.form small{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.03em;color:var(--faint)}
.form span{font-family:ui-monospace,Menlo,monospace}
.stem{font-size:1.1rem;font-weight:600;line-height:1.4;max-width:68ch;white-space:pre-wrap;margin:0 0 1rem}
.opts{display:flex;flex-direction:column;gap:.5rem}
.opt{display:flex;gap:.75rem;align-items:flex-start;width:100%;min-height:3rem;padding:.75rem;border-radius:.75rem;border:1px solid var(--border2);background:var(--card);color:var(--text);font:inherit;font-size:.95rem;line-height:1.35;text-align:left;cursor:pointer}
.opt:hover:not(:disabled){background:var(--brand-weak)}
.opt:disabled{cursor:default}
.opt .l{width:1.5rem;height:1.5rem;border-radius:999px;border:1px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;flex:none}
.opt.sel{border-color:var(--brand);background:var(--brand-weak);box-shadow:inset 0 0 0 1px var(--brand)}
.opt.ok{border-color:var(--good-bd);background:var(--good-bg)}
.opt.no{border-color:var(--bad-bd);background:var(--bad-bg)}
.fb{border-radius:.75rem;border:1px solid var(--good-bd);background:var(--good-bg);padding:1rem;margin-top:1rem}
.fb.no{border-color:var(--bad-bd);background:var(--bad-bg)}
.fb p{max-width:68ch;font-size:.95rem;line-height:1.6}
textarea,input[type=text],input[type=date],select{font:inherit;width:100%;padding:.6rem .75rem;border-radius:.5rem;border:1px solid var(--border2);background:var(--card);color:var(--text);min-height:2.75rem}
label{font-size:.875rem;font-weight:600;display:block;margin-bottom:.25rem}
.runhead{display:flex;gap:.75rem;align-items:center;justify-content:space-between;font-size:.8125rem;color:var(--muted);margin-bottom:.5rem}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--text)}
.timer.low{color:var(--bad)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.6rem,1fr));gap:.35rem;margin-top:.75rem}
.navgrid button{min-height:2.6rem;border-radius:.5rem;border:1px solid var(--border2);background:var(--card);color:var(--text);font:inherit;font-size:.8rem;font-weight:600;cursor:pointer}
.navgrid .a{background:var(--brand-weak);border-color:var(--brand)}
.navgrid .f{box-shadow:inset 0 -4px 0 #f59e0b}
.navgrid .c{outline:3px solid #6366f1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:var(--nav);backdrop-filter:blur(8px);border-top:1px solid var(--border);padding-bottom:max(env(safe-area-inset-bottom),.25rem)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;min-height:3.5rem;font-size:.6875rem;font-weight:600;color:var(--muted);text-decoration:none}
nav.tabs a span{font-size:1.15rem;line-height:1}
nav.tabs a.on{color:var(--brand-text)}
:focus-visible{outline:3px solid #6366f1;outline-offset:2px;border-radius:6px}
.grid2{display:grid;grid-template-columns:1fr;gap:.875rem}
@media(min-width:720px){.grid2{grid-template-columns:1fr 1fr}}
.kv{display:flex;justify-content:space-between;gap:1rem;font-size:.875rem;padding:.2rem 0}
.spark{width:100%;height:38px}
svg.map,svg.scene{width:100%;max-width:26rem;height:auto;display:block;margin:0 auto;background:#fff;border-radius:.5rem;border:1px solid var(--border)}
ol.legend{font-size:.85rem;columns:2;margin:.5rem 0 0;padding-left:1.25rem}
footer{font-size:.75rem;color:var(--faint);margin-top:1.5rem}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>

<script id="bank" type="application/json">{"built":"2026-11-17","stimuli":[{"id":"stim-rp-01","type":"passage","title":"Brightwater Borough Ordinance 22-C: Street Vending Permits","text":"The purpose of this ordinance is to keep borough sidewalks passable for pedestrians while allowing permitted vendors to do business.\n\nClass A (food cart) permit holders may sell on any public sidewalk in the borough Monday through Friday from 7:00 a.m. to 3:00 p.m. On Saturdays and Sundays they may sell only at Quarry Park, from 9:00 a.m. to 6:00 p.m.\n\nClass B (merchandise table) permit holders may sell only on Canal Street, and only on Fridays, Saturdays and Sundays from 10:00 a.m. to 8:00 p.m. They may not sell at Quarry Park at any time.\n\nClass C (nonprofit) permit holders may sell on any public sidewalk on any day from 8:00 a.m. to 5:00 p.m., but only on a block where no Class A or Class B vendor is already set up.\n\nNo vendor of any class may set up within 20 feet of a fire hydrant or a bus stop. Every vendor must display the permit where customers can see it. A vendor who sells outside the permitted days or hours receives a written warning for the first violation and a $75 fine for each later violation. Only the Borough Clerk may issue or renew a permit. A police officer may ask to inspect a permit but may not take it from the vendor."},{"id":"stim-rp-02","type":"passage","title":"Harlan Ridge Police Department Directive 6.4: Temporary Evidence Lockers","text":"The purpose of this directive is to maintain a documented chain of custody for every item of evidence from the time it is collected until it is received by the Evidence Custodian.\n\nAn officer who collects evidence must package it, label it and place it in a temporary locker before the end of the shift in which it was collected. General items may go in any open locker numbered 1 through 12. Firearms may go only in lockers 13 through 16, and each firearm must be unloaded and secured with a cable tie. Currency of any amount must be counted in the presence of a second officer, and both officers must sign the envelope. Items that must be kept cold go in the refrigerated locker, number 17. No other items may be stored there.\n\nAfter placing an item, the officer locks the locker and drops the key through the slot in the evidence room door. Once the key is dropped, only the Evidence Custodian may reopen the locker. The Custodian empties the lockers at 8:00 a.m. each weekday. The lockers are not emptied on Saturdays, Sundays or borough holidays. An item that cannot wait must be reported to the on-duty shift supervisor, who may call the Custodian in.\n\nAn officer who needs an item for court must submit a release form at least one business day in advance."},{"id":"stim-rp-03","type":"definitions","title":"Ashby County Emergency Communications Center: Call Priority Levels","text":"The Ashby County Emergency Communications Center assigns every incoming call one of the following priority levels. Use only these definitions, and do not assume anything that is not stated.\n\nPriority 1 (Immediate): A person is being physically harmed, or is in immediate danger of physical harm, at the time of the call.\n\nPriority 2 (Urgent): No person is in danger, but a crime is in progress or a suspect is still at or near the scene.\n\nPriority 3 (Routine): The incident is over and no suspect is at or near the scene, but physical evidence remains at the scene for an officer to examine.\n\nPriority 4 (Deferred): The incident is over, no suspect is at or near the scene and no physical evidence remains, so the report can be taken by telephone.\n\nPriority 5 (Advisory): The caller passes along information or asks a question, and does not report an incident or request any police action."},{"id":"stim-rp-04","type":"passage","title":"Incident at Dalton's Hardware","text":"At 6:40 a.m. on Tuesday, March 9, Officer Priya Nair was sent to Dalton's Hardware at 212 Ferry Road after the store's alarm company reported a signal from the rear door. She arrived at 6:48 a.m. and found the rear door closed but unlocked. The owner, Samuel Dalton, arrived ten minutes later and told her that he had locked the door himself at 9:00 p.m. the night before. Inside, the cash register drawer was open and empty, and a display case of cordless drills had been pried open. Mr. Dalton said that four drills were missing and that the register had held about $180. A security camera above the rear door had been turned to face the wall. Officer Nair photographed the door and the display case before leaving at 7:35 a.m."},{"id":"stim-rp-05","type":"passage","title":"Marlow Township Ordinance 14-B: Parking on Residential Streets","text":"This ordinance is intended to preserve on-street parking for residents and to keep residential streets clear for street sweeping and snow removal.\n\nPassenger vehicles displaying a resident sticker may park on any residential street at any hour, subject to the two general rules below.\n\nPassenger vehicles without a resident sticker may park on a residential street for up to two hours at a time between 7:00 a.m. and 7:00 p.m., Monday through Saturday. On Sundays the two-hour limit does not apply during those hours. They may not park on a residential street between 7:00 p.m. and 7:00 a.m. on any night unless a guest pass is displayed.\n\nCommercial vehicles, including any vehicle with business lettering, may park on a residential street only while the driver is making a delivery or doing work at an address on that block, and only between 7:00 a.m. and 6:00 p.m. on weekdays. They may not park on a residential street on Saturdays or Sundays for any reason.\n\nTwo general rules apply to every vehicle. On Wednesdays from 8:00 a.m. to noon, no vehicle may park on the even-numbered side of a residential street. When the township declares a snow emergency, no vehicle of any kind may park on a residential street until the declaration is lifted."},{"id":"stim-rp-06","type":"definitions","title":"Offense Categories (Invented for This Test)","text":"The following offense categories were invented for this test. They are not the law of any state. Use only these definitions, and do not assume anything that is not stated.\n\nTampering: Changing, damaging or moving property that belongs to another person, without that person's permission, when nothing is taken away.\n\nPilfering: Taking property that belongs to another person from a place that is open to the public, without permission and without using force or threats.\n\nIntrusion: Entering a building or fenced area that is not open to the public, without the owner's permission, whether or not anything is taken.\n\nCoercive Taking: Taking property directly from another person by using force or by threatening to use force.\n\nFalse Dealing: Getting money or property from another person by making a statement that the speaker knows is untrue."},{"id":"stim-rp-07","type":"passage","title":"Collision at Holloway Avenue and Ninth Street","text":"On Saturday, October 4, at 3:15 p.m., Officers Grace Lindqvist and Andre Baptiste responded to a two-vehicle collision at the intersection of Holloway Avenue and Ninth Street in Cedar Hollow Borough. A blue pickup truck driven by Walter Oyelaran had struck the rear of a white sedan that was stopped at a red light. The sedan's driver, Mei Tanaka, said her neck was sore but declined an ambulance. Her passenger, a 12-year-old boy, was not hurt. Mr. Oyelaran told Officer Baptiste that he had looked down to adjust the radio and did not see the sedan until it was too late to stop. A witness standing at the bus shelter, Irene Kowalski, confirmed that the light was red when the truck hit the sedan. Both vehicles were driven from the scene."},{"id":"stim-rp-08","type":"passage","title":"Larkfield Township Police Department Policy 3.2: Use of Department Vehicles","text":"This policy is meant to keep department vehicles available and in safe working order and to limit their use to official business.\n\nMarked patrol cars are assigned by shift. An officer must inspect the assigned car at the start of the shift and note any damage on the vehicle log before driving it. Marked cars may not leave the township except in active pursuit, to transport a prisoner, or when a supervisor approves the trip.\n\nUnmarked cars are assigned to detectives. A detective who is on call may take an unmarked car home on Monday, Tuesday, Wednesday and Thursday nights if the detective lives within 15 miles of the station. On Friday, Saturday and Sunday nights, an unmarked car may be taken home only with the written approval of the Chief.\n\nThe prisoner transport van may be driven only by an officer who has completed the department's van course, and a second officer must ride along whenever a prisoner is on board.\n\nAny vehicle with less than one-quarter tank of fuel at the end of a shift must be refueled before it is turned in. No person who is not a department employee may ride in any department vehicle without a supervisor's approval, except a prisoner or a person who is being given emergency help."},{"id":"stim-rp-09","type":"definitions","title":"Stonebridge Police Department: Report Closing Classifications","text":"The Stonebridge Police Department closes every report with one of the following classifications. Use only these definitions, and do not assume anything that is not stated.\n\nNo Incident: The investigation shows that the reported incident did not happen.\n\nArrest Made: The incident happened in Stonebridge, and a suspect has been identified and arrested.\n\nVictim Declined: The incident happened in Stonebridge and a suspect has been identified, but no arrest is made because the victim has chosen not to go forward.\n\nSuspended: The incident happened in Stonebridge, but every available lead has been followed and no suspect has been identified.\n\nTransferred: The incident happened outside Stonebridge, and the report has been sent to the police department for the place where it happened."},{"id":"stim-rp-10","type":"passage","title":"Incident at Birchwood Park","text":"Shortly after 11:00 p.m. on Thursday, Officer Daniel Reyes was patrolling Birchwood Park in Tamsin Township when he noticed a light moving inside the park's maintenance shed. The park closes at dusk, and the shed is normally padlocked. As he walked toward the shed, a person ran out of the side door and climbed over the fence onto Wren Lane. Officer Reyes did not get a clear look at the person's face but saw that the person wore a dark jacket and carried a backpack. Inside the shed he found the padlock on the floor, cut through, and a pair of bolt cutters beside it. The parks foreman, Lucille Abernathy, arrived at 11:40 p.m. and reported that a leaf blower and a chain saw were missing."},{"id":"stim-rp-11","type":"passage","title":"Quillan Borough Police Department Procedure 9.1: Requests for Records","text":"This procedure is intended to give the public timely access to police records while protecting the privacy of victims and the integrity of open investigations.\n\nRequests are accepted at the records window Monday through Friday, 8:30 a.m. to 4:00 p.m. Every request must be made in writing on Form R-1. Requests made by telephone are not accepted.\n\nA crash report is available to any driver or vehicle owner named in the report, or to that person's insurance company, beginning on the fifth business day after the day of the crash. The fee is $15.\n\nAn incident report is available only to a victim named in the report, and only after the case is closed. While a case is open, a victim may receive a one-page summary at no charge, but not the full report.\n\nAny person, whether or not involved in an incident, may request the daily call log, which lists the time, type and block location of each call. There is no fee for the call log.\n\nReports involving juveniles are not released at the records window under any circumstances. Those requests must be sent to the Borough Solicitor.\n\nThe records clerk must answer every written request within three business days, either by providing the record or by explaining in writing why it cannot be provided."},{"id":"stim-rn-01","type":"definitions","title":"Listening Habits at Work","text":"Most people believe they are good listeners, yet studies of office teams suggest that a great deal of spoken information is lost within minutes. The problem is seldom hearing. It is habit. People settle into familiar ways of responding to a speaker, and some of those ways shut a conversation down while others keep it going.\n\nTrainers who teach workplace communication often describe the following response habits. Nobody uses only one, and most people shift among several in a single day.\n\nParaphrasing: restating the speaker's message in your own words to confirm that you understood it.\nProbing: asking an open question that invites the speaker to give more detail.\nAdvising: offering a solution before the speaker has asked for one.\nDeflecting: turning the conversation toward your own experience or toward a different subject.\nRehearsing: planning what you will say next instead of attending to what is being said.\nMirroring: repeating the speaker's last few words exactly, without rewording them.\n\nParaphrasing and probing are generally the most useful habits because they give the speaker a chance to correct a misunderstanding. Advising is not always wrong, but it works best after the listener has first shown that the message was understood. Deflecting and rehearsing are the habits most likely to leave a speaker feeling ignored."},{"id":"stim-rn-02","type":"definitions","title":"Sleep and the Rotating Schedule","text":"People who work nights or rotating shifts are asking their bodies to be alert at hours when the body expects rest. Most can adjust, but the adjustment is rarely complete, and workers who understand a few basic terms tend to manage their schedules better.\n\nCircadian rhythm: the body's internal cycle of roughly 24 hours that controls when a person feels sleepy or alert.\nSleep debt: the running total of sleep a person has missed over several days.\nSleep inertia: the grogginess and slowed thinking felt in the first minutes after waking.\nMicrosleep: a lapse into sleep lasting only a few seconds, often without the person noticing.\nAnchor sleep: a block of sleep taken at the same clock time every day, on workdays and days off alike.\nForward rotation: a schedule that moves from day shift to evening shift to night shift, in that order.\n\nSleep specialists generally find that forward rotation is easier on workers than a schedule that moves in the opposite direction, because most people find it easier to stay up later than to fall asleep earlier. They also note that a short nap before a night shift can help, but that a worker should allow fifteen to twenty minutes after waking before doing anything that demands quick judgment. Sleep debt cannot be erased by a single long night of sleep; it is usually repaid over several nights."},{"id":"stim-rn-03","type":"definitions","title":"How Calder Falls Gets Its Water","text":"Turn on a tap in the city of Calder Falls and the water that comes out has traveled about eleven miles, passing through a treatment plant and a storage tank on the way. The Water Bureau uses the following terms in its public reports.\n\nIntake: the screened opening at Lake Orrin where untreated water enters the system.\nRaw water: water that has been drawn from the source but has not yet been treated.\nClarifier: a large basin in which heavy particles settle to the bottom so that they can be removed.\nFinished water: water that has completed treatment and is safe to drink.\nStandpipe: a tall storage tank that holds finished water and uses its height to maintain pressure in the pipes.\nWater main: a large underground pipe that carries finished water beneath a street.\nService line: the smaller pipe that connects a single building to the water main.\n\nThe city owns, and pays to repair, everything up to and including the water main. A service line belongs to the owner of the building it serves, so a leak in a service line is the owner's expense. Pressure in the system depends mostly on the standpipes rather than on pumps; the pumps run mainly at night, when electricity is cheaper, to refill the standpipes for the next day. When a main breaks, crews close valves on both sides of the break, and nearby customers may see cloudy water for a few hours afterward."},{"id":"stim-rn-04","type":"definitions","title":"Six Ways People Handle Disagreement","text":"Disagreements at work are normal. What differs from person to person is the way a disagreement is handled. Researchers who study workplace teams commonly sort these approaches into a small number of styles. No style is best in every case, and skilled employees choose a style to fit the situation rather than relying on one out of habit.\n\nForcing: pressing for your own position until the other person gives in.\nYielding: giving the other person what they want and setting aside your own preference.\nWithdrawing: leaving or staying silent so that the disagreement is never addressed.\nPostponing: agreeing with the other person on a specific later time to deal with the issue.\nSplitting: each side giving up part of what it wants so that both get something.\nJoint problem-solving: working together to find an answer that fully meets both sides' needs.\n\nJoint problem-solving usually produces the most lasting agreements, but it takes the most time and requires that both people be willing to share information. Forcing can be appropriate in an emergency, when a decision must be made at once. Yielding makes sense when the issue matters far more to the other person than it does to you. Withdrawing is the style most likely to let a small problem grow, because nothing about the problem changes."},{"id":"stim-rn-05","type":"definitions","title":"A Short History of Pell Harbor","text":"Pell Harbor began in 1841 as a ferry landing on the Wessick River. For its first thirty years it had no government of its own; disputes were carried by boat to the county seat, a full day away. In 1871 the residents obtained a charter, and many words from that document are still heard at town meetings today.\n\nCharter: the written document that created the town and set out its powers.\nWard: one of the four districts into which the town is divided for elections.\nWarden: the official elected by a ward to speak for it on the town council.\nLevy: a tax approved by the council for one stated purpose and one stated period.\nCommons: land owned by the town and open to every resident.\nEasement: a right to cross or use a strip of someone else's land without owning it.\n\nThe original charter gave the town only two wards. Two more were added in 1902, after the cannery opened and the population doubled. The first levy, approved in 1874, paid for a stone breakwater and ended when the work was finished three years later. The commons along Front Street was once the ferry company's freight yard; the company gave the land to the town in 1910 but kept an easement so that its wagons could still reach the dock. The ferry stopped running in 1938, when the Wessick bridge opened."},{"id":"stim-rn-06","type":"passage","title":"Harwick Township Police Department Memo: Report Deadlines","text":"TO: All Patrol Personnel\nFROM: Lieutenant Adaeze Nwosu, Patrol Division\nSUBJECT: Report completion deadlines\n\nOver the past quarter, the Records Unit has received a growing number of incident reports several days after the incident occurred. Late reports delay insurance claims for residents, slow the work of detectives, and make it harder for officers to recall details accurately. In September alone, 41 reports were submitted more than three days late.\n\nEffective Monday, November 2, the following procedure applies. Every incident report must be completed and submitted before the end of the shift on which the incident was handled. If a call late in the shift makes this impossible, the officer must notify the shift sergeant before going off duty and must submit the report by the end of his or her next scheduled shift. The sergeant will record each extension in the shift log.\n\nThis change is not a criticism of anyone's effort. Call volume has risen, and I recognize that writing time is scarce. To help, the two report-writing stations in the squad room have been repaired, and dictation software has been installed on every patrol car computer. Training on the software will be offered at roll call during the week of October 26.\n\nQuestions should be directed to your shift sergeant."},{"id":"stim-rn-07","type":"passage","title":"Training Bulletin 26-07: Communicating With Residents Who Have Hearing Loss","text":"Brightwater Borough Police Department\nTraining Bulletin 26-07\n\nRoughly one in eight borough residents has some degree of hearing loss, and the proportion is higher among residents over 65. Many do not consider themselves deaf and will not mention the difficulty. An officer may instead notice that a person answers a different question from the one asked, watches the officer's mouth closely, or turns one ear toward the speaker. These behaviors are easily mistaken for confusion, intoxication or a refusal to cooperate.\n\nWhen an officer suspects hearing loss, the following steps are recommended. Face the person directly and keep your hands away from your mouth. Reduce background noise where you can; step away from a running engine or turn down the radio. Speak at a normal pace and a slightly raised volume, but do not shout, because shouting distorts the shape of words on the lips. If a sentence is not understood, rephrase it rather than repeating the same words. For anything important, such as an address, a date or a set of instructions, write it down and ask the person to confirm it.\n\nPatience is the main requirement. A conversation that takes two extra minutes is preferable to one that ends in a misunderstanding."},{"id":"stim-rn-08","type":"passage","title":"Summary: Eastgate Neighborhood Community Meeting, Marlow Township","text":"Prepared by Officer Daniel Kowalski, Community Relations Unit\n\nAbout sixty residents attended the quarterly meeting held Thursday evening at the Eastgate Library. Three subjects took up most of the ninety minutes.\n\nSpeeding on Corliss Avenue drew the most comments. Residents said drivers use the street as a shortcut around the construction on the Tannery Road bridge. Sergeant Maria Delgado reported that a speed survey in August found an average speed of 34 miles per hour in a 25 zone. She said a portable speed display will be placed on Corliss Avenue for four weeks beginning October 5, and that extra patrols will follow only if the display fails to slow traffic.\n\nSeveral residents asked about package thefts from porches. Sergeant Delgado said reports had actually fallen from 19 last fall to 11 this fall, but she acknowledged that many thefts are never reported. She urged residents to report every theft, however small, because patrol assignments are based on reported incidents.\n\nFinally, the library director announced that the building's parking lot lights, which have been out since July, will be replaced by the township by the end of the month.\n\nThe next meeting is scheduled for January 14. Residents asked that it begin at 7:00 p.m. rather than 6:00 p.m. so that more commuters can attend; the request is under review."},{"id":"stim-rn-09","type":"passage","title":"Equipment Notice 26-14: Portable Radio Batteries","text":"Ashgrove Township Police Department\nEquipment Notice 26-14\n\nThe Quartermaster has determined that portable radio batteries issued before January 2025 are no longer holding a full charge. In testing, these older batteries lasted an average of six hours, well short of a ten-hour shift. Two officers have reported radios shutting off without warning during calls. No one was hurt, but the risk is obvious.\n\nAll officers must check the date stamped on the underside of each battery they have been issued. Any battery stamped with a date earlier than January 2025 is to be exchanged at the Quartermaster's window, which is open weekdays from 7:00 a.m. to 3:00 p.m. Officers assigned to the night shift, who cannot easily reach the window during those hours, may leave their old batteries with the desk sergeant and collect replacements at the start of their next shift.\n\nUntil the exchange is complete, every officer is to carry a spare battery on duty and to begin each shift with a battery taken directly from the charger. Batteries should not be left in a vehicle overnight, since cold shortens the charge further.\n\nThe exchange must be finished by Friday, December 4. Old batteries are to be turned in, not discarded, because they are being returned to the manufacturer for credit."},{"id":"stim-rs-01","type":"definitions","title":"Brightwater Borough Police: Call Priority Codes","text":"Brightwater Borough dispatchers give every call exactly one priority code, using the definitions below.\n\nPriority 1: A person is being physically harmed, or is in immediate danger of being physically harmed, at the time of the call.\nPriority 2: A crime against property is in progress at the time of the call, and no person is in immediate danger.\nPriority 3: A crime has already ended, and no person is in immediate danger.\nPriority 4: No crime is involved and no person is in danger. The caller wants information or non-urgent help."},{"id":"stim-rs-02","type":"passage","title":"Marlow Township Police Rule 7.3: Take-Home Vehicles","text":"An officer may be assigned a take-home patrol vehicle only if the officer lives inside Marlow Township or within 10 miles of the township line. Off duty, a take-home vehicle may be driven only by the officer to whom it is assigned. While driving the vehicle off duty, the officer must carry a department radio and must not carry any passenger who is not a department employee. An officer who will be away from home for more than 3 days in a row must first return the vehicle to the station lot."},{"id":"stim-rs-03","type":"definitions","title":"Tamsin County Sheriff's Office: Categories for Reports of Taken Property","text":"Every report of taken property is placed in exactly one of four categories.\n\nMajor Loss: The property taken was worth $2,000 or more, no matter how it was taken.\nForce Taking: The property was worth less than $2,000, and force or a threat of force was used against a person.\nEntry Taking: The property was worth less than $2,000, no force or threat was used against a person, and the property was taken from inside a building or vehicle that the taker entered without permission.\nSimple Taking: The property was worth less than $2,000 and was taken in any way not described above."},{"id":"stim-rs-04","type":"passage","title":"Stonebridge Borough Police: Saturday Post Assignments","text":"Sergeant Ruth Calloway must assign five officers - Alvarez, Brooks, Chaudhry, Dempsey and Eze - to posts for Saturday. Each officer gets exactly one post. The Front Desk needs exactly one officer, Patrol needs exactly two officers, and Traffic needs exactly two officers. The assignments must follow these rules:\n1. Alvarez and Brooks cannot be assigned to the same post.\n2. Chaudhry must be assigned to Patrol.\n3. Dempsey cannot be assigned to Traffic.\n4. If Brooks is assigned to Patrol, Eze must be assigned to the Front Desk."},{"id":"stim-rs-05","type":"table","title":"Ashford Township Burglary Reports, March","text":"All four homes back onto the Otter Run Trail. In each home, a television and a laptop in plain view were left behind.","columns":["Report","Date and time window","Address","Entry point","Property taken"],"rows":[["B-1","Thursday, March 5, 10:00 a.m. to noon","22 Fern Road","Rear sliding door pried open","Jewelry, cash"],["B-2","Thursday, March 12, 10:30 a.m. to 12:30 p.m.","9 Heron Court","Rear sliding door pried open","Jewelry"],["B-3","Thursday, March 19, 11:00 a.m. to 1:00 p.m.","140 Sorrel Lane","Rear sliding door pried open","Jewelry, cash, wristwatch"],["B-4","Thursday, March 26, 10:00 a.m. to 12:30 p.m.","61 Fern Road","Rear sliding door pried open","Jewelry, cash"]]},{"id":"stim-rs-06","type":"table","title":"Marlow Township Thefts from Vehicles at Valley Line Station Lots, June","text":"Valley Line stations in order from south to north: Ashby, Birchwood, Carver, Dalton, Elmhurst, Fenwick.","columns":["Report","Date","Station lot","Time window","Method","Property taken"],"rows":[["V-1","June 2","Ashby","9:00 a.m. to 2:00 p.m.","Rear passenger window broken","Gym bag from back seat"],["V-2","June 5","Birchwood","9:30 a.m. to 1:00 p.m.","Rear passenger window broken","Laptop bag from back seat"],["V-3","June 8","Carver","10:00 a.m. to 3:00 p.m.","Rear passenger window broken","Backpack from back seat"],["V-4","June 11","Dalton","9:00 a.m. to 1:30 p.m.","Rear passenger window broken","Briefcase from back seat"]]},{"id":"stim-rs-07","type":"passage","title":"Wexley Township Police: Five October Theft Reports","text":"Report 1: On a Saturday afternoon at Hanley's Pharmacy, a woman asked the only clerk on duty to help her find an item in the back aisle. While the clerk was away from the counter, a man reached over and took cash from the register.\n\nReport 2: On a Saturday afternoon at Corner Hardware, a woman asked the only employee on duty to carry a bag of potting soil out to her car. When he came back, cash was missing from the register.\n\nReport 3: On a Saturday afternoon at Bell's Card Shop, a woman asked the only clerk on duty to take down a display from a high shelf at the back of the store. While the clerk was on the ladder, a man took cash from the register.\n\nReport 4: On a Wednesday night after closing, someone broke the glass in the rear door of Sunrise Bakery and carried away a small safe.\n\nReport 5: On a Saturday afternoon at Pioneer Pet Supply, a woman asked the only employee on duty to help her load a bag of dog food into her car. When the employee returned, cash was missing from the register."},{"id":"stim-rs-08","type":"passage","title":"Witness Statements: Theft at Tolliver Electronics","text":"At 4:20 p.m. on a Monday, a man took a tablet computer from a counter display at Tolliver Electronics in Brightwater Borough and ran out. Officer Marcus Bell took statements from four people.\n\nMs. Aguilar (clerk): \"He was tall and wore a red hooded sweatshirt and jeans. He grabbed the tablet, ran out the front door and turned right, toward the parking garage.\"\n\nMr. Sandhu (customer): \"A tall man in a red hooded sweatshirt took it. He went out the front door and turned right, toward the garage. I was the only customer in the store, so I saw the whole thing.\"\n\nMs. Whitaker (customer): \"I was at the back of the store looking at headphones. I saw a tall man in a red hooded sweatshirt run out the front door. I could not see which way he turned.\"\n\nMr. Diallo (passerby): \"I was on the sidewalk outside. A short man in a red hooded sweatshirt ran out of the store carrying something flat. He turned right and ran toward the parking garage.\""},{"id":"stim-sx-map1","type":"map","title":"Map 1","text":"North is at the top. Arrows mark one-way streets; all other streets are two-way. Each landmark sits at the intersection marked by its dot.","cols":["Oak St","Pine St","Birch St","Cedar St","Maple St"],"rows":["1st Ave","2nd Ave","3rd Ave","4th Ave","5th Ave"],"oneWay":{"Maple St":"S","Oak St":"N","4th Ave":"E","1st Ave":"E"},"landmarks":[{"name":"Police Station","c":1,"r":1},{"name":"Hospital","c":4,"r":4},{"name":"Library","c":1,"r":2},{"name":"High School","c":2,"r":3},{"name":"Bus Depot","c":3,"r":2},{"name":"Courthouse","c":4,"r":0}]},{"id":"stim-sx-map2","type":"map","title":"Map 2","text":"North is ahman"],["Victim address","240 Bellamy Street, Unit 12"],["Victim phone","555-0193"],["Assigned officer 1","Officer Gabriel Santos"],["Officer 1 badge number","761"],["Assigned officer 2","Officer Mei-Ling Chow"],["Officer 2 badge number","804"],["Victim age","27"],["Victim date of birth","December 3, 1998"],["Suspect name","Curtis Ebersole"],["Suspect address","66 Pinecrest Avenue"],["Suspect age","41"],["Suspect sex","Male"],["Suspect date of birth","February 28, 1985"],["Suspect height","6 feet 2 inches"],["Suspect weight","210 pounds"],["Suspect hair","Black"],["Suspect eyes","Brown"],["Clothing / physical description","Red baseball cap and tan work jacket; tattoo of an anchor on the right forearm"],["Charge","Theft from a motor vehicle"],["Item 1","Laptop computer"],["Item 1 brand","Lumetra"],["Item 1 serial number","LM-4471902"],["Item 1 value","$950"],["Item 2","Wireless headphones"],["Item 2 brand","Soundarc"],["Item 2 serial number","SA-209-5518"],["Item 2 value","$220"],["Item 3","Leather briefcase"],["Item 3 brand","Pembry"],["Item 3 serial number","PB-0036641"],["Item 3 value","$175"],["Reporting officer","Officer Mei-Ling Chow"]]},{"id":"stim-ms-01","type":"scene-svg","title":"Street scene 1","studySeconds":60,"text":"Study the scene. It will be hidden before the questions appear.","spec":{"street":"Alder Street","clock":"2:40","shops":[["Rosa's Bakery","red"],["Keystone Hardware","green"],["Nine Lives Books","blue"]],"vehicles":[["sedan","blue","HTR-2291"],["van","white","KVM-6038"],["pickup","red","BDL-7714"]],"people":[["green","a backpack"],["yellow","an umbrella"],["purple","a dog on a leash"]]}},{"id":"stim-ms-02","type":"scene-svg","title":"Street scene 2","studySeconds":60,"text":"Study the scene. It will be hidden before the questions appear.","spec":{"street":"Wharf Road","clock":"11:15","shops":[["Tidewater Pharmacy","blue"],["Lucky Coin Laundry","orange"],["Bellamy Shoes","purple"],["Corner Deli","green"]],"vehicles":[["van","yellow","PRW-4405"],["sedan","black","JNC-8172"]],"people":[["red","a shopping bag"],["blue","a skateboard"],["orange","a briefcase"]]}},{"id":"stim-ms-03","type":"scene-svg","title":"Street scene 3","studySeconds":60,"text":"Study the scene. It will be hidden before the questions appear.","spec":{"street":"Quarry Avenue","clock":"7:05","shops":[["Summit Bank","green"],["Pho Lotus","red"],["Harlow Florist","purple"]],"vehicles":[["pickup","green","TSF-3360"],["sedan","white","LMA-5927"],["van","orange","CEK-1483"]],"people":[["blue","a guitar case"],["red","a coffee cup"],["yellow","a toolbox"]]}},{"id":"stim-ms-04","type":"scene-svg","title":"Street scene 4","studySeconds":60,"text":"Study the scene. It will be hidden before the questions appear.","spec":{"street":"Mercer Lane","clock":"4:50","shops":[["Bright Smile Dental","blue"],["Gino's Pizza","red"],["Second Wind Cycles","yellow"],["Maple Yarn Shop","purple"]],"vehicles":[["sedan","red","WGD-9051"],["pickup","black","FYH-2846"]],"people":[["green","a ladder"],["purple","a stroller"],["orange","a clipboard"]]}},{"id":"stim-mo-01","type":"scene-text","title":"Wanted Bulletin 61-B, Brightwater Borough Police","studySeconds":100,"text":"WANTED BULLETIN 61-B\nName: Dennis Roy Kessler\nAlias: \"Red\"\nAge: 34\nHeight: 5 ft 10 in\nWeight: 185 lb\nHair: Brown, cut short\nEyes: Green\nDistinguishing mark: Anchor tattoo on left forearm\nLast seen: Outside the Corner Mart on Fulton Street, Tuesday at 9:40 p.m.\nVehicle: Dark blue Honda sedan, partial plate KTR-4 (remaining characters unknown)\nWanted for: Theft of copper wiring from a construction site\nCaution: Has run from officers on foot before. Do not approach alone; request backup."},{"id":"stim-mo-02","type":"scene-text","title":"Day Shift Briefing, Marlow Township Police","studySeconds":150,"text":"DAY SHIFT BRIEFING\n1. ROAD CLOSURE: Quarry Road is closed between Elm Street and Tanner Avenue from 9:00 a.m. to 3:00 p.m. for water main repair. Detour by way of Hollis Street.\n2. STOLEN VEHICLE: White Toyota minivan, plate HVN-2861, taken overnight from the 300 block of Birch Lane. It has a roof rack and a dented rear bumper.\n3. MISSING PERSON: Walter Odum, age 78, last seen at 6:30 a.m. leaving Cedar Grove Apartments on foot. He is wearing a tan jacket and a green cap and walks with a cane.\n4. REPEAT COMPLAINT: 52 Mill Street. Third noise complaint this week about loud music after 11:00 p.m. The caller each time is the neighbor at 54 Mill Street.\n5. EQUIPMENT: Car 14 is out of service for brake repair. Officers assigned to it will take Car 9. Dock all body cameras at the end of the shift.\n6. SCHOOL ZONE: Extra patrol is requested at Lindell Elementary from 2:30 p.m. to 3:15 p.m."},{"id":"stim-mo-03","type":"scene-text","title":"Arrival on Weller Avenue","studySeconds":120,"text":"Officer Priya Nair stops across the street from a row of four businesses on Weller Avenue.\n\nSTOREFRONTS, from left to right as she faces them:\nDalton's Hardware - Sunrise Bakery - First Harbor Bank - Lucky Penny Laundromat\nThe clock above the bank door reads 2:15.\n\nVEHICLES parked at the curb:\n- A red pickup truck, plate ending 73K, in front of the hardware store\n- A silver sedan, plate ending 4QD, in front of the bakery, with its driver's door standing open\n- A white delivery van, plate ending 918, in front of the laundromat, with its hazard lights flashing\n\nPEOPLE:\n- A woman in a yellow raincoat stands outside the bakery holding a paper bag\n- A man in a blue hooded sweatshirt sits on a bench outside the bank with a black backpack at his feet\n- A teenager in a green jacket walks a bicycle past the laundromat\n- A man in a gray uniform unloads boxes from the van"},{"id":"stim-mo-04","type":"scene-text","title":"Burglary Scene: Den at 18 Aldercrest Lane","studySeconds":120,"text":"Officer Marcus Bell steps into the den of a house at 18 Aldercrest Lane after a reported break-in.\n\nPOINTS OF ENTRY:\n- The window on the north wall is wide open. Its screen is lying on the floor directly beneath it.\n- The door to the back porch has one pane of glass broken out next to the handle, but the door is shut and its deadbolt is still locked.\n\nITEMS DISTURBED:\n- All three drawers of the desk have been pulled out. The bottom drawer is upside down on the rug beside the desk.\n- A bookshelf has been tipped over against the couch.\n- The closet door is open. An empty gray lockbox sits on the closet floor with its lid up.\n\nON THE TABLE in the middle of the room:\n- A closed laptop computer\n- A set of car keys on a red key ring\n- A coffee mug, half full\n- A black flashlight, still switched on\n\nON THE WALL above the desk:\n- A calendar turned to March, with the 14th circled\n- A clock that has stopped at 3:52"}],"questions":[{"id":"rp-001","section":"reading","subtype":"rule-application","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-01","stem":"Teresa Okafor holds a Class A permit and never sets up near a fire hydrant or bus stop. According to the passage, at which of the following times and places may she sell?","choices":["Saturday at 10:00 a.m. on a Canal Street sidewalk","Tuesday at 2:00 p.m. on a Canal Street sidewalk","Sunday at 7:30 a.m. at Quarry Park","Wednesday at 4:00 p.m. on a Mill Street sidewalk","Saturday at 7:00 p.m. at Quarry Park"],"answer":1,"fixed":false,"explanation":"Class A holders may sell on any public sidewalk on weekdays from 7:00 a.m. to 3:00 p.m., so Tuesday at 2:00 p.m. on Canal Street is allowed. On weekends they are limited to Quarry Park from 9:00 a.m. to 6:00 p.m., and the Wednesday choice is after 3:00 p.m."},{"id":"rp-002","section":"reading","subtype":"true-false","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-rp-01","stem":"According to the passage, a Class B permit holder may sell at Quarry Park on a Saturday afternoon.","choices":["True","False"],"answer":1,"fixed":true,"explanation":"The passage says Class B holders may sell only on Canal Street and may not sell at Quarry Park at any time. Saturday is one of their permitted days, but the location is not permitted."},{"id":"rp-003","section":"reading","subtype":"rule-application","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-01","stem":"Devon Marsh holds a Class C permit. At 9:00 a.m. on a Thursday he wants to set up on a block of Canal Street where a Class A food cart is already set up. According to the passage, Marsh","choices":["may sell on that block, because Class C permit holders may sell on any day","may sell on that block, because Class B vendors are not permitted on Canal Street on Thursdays","may not sell on that block, because Class C permit holders may sell only on weekends","may not sell on that block, because a Class A vendor is already set up there","may not sell on that block until 10:00 a.m."],"answer":3,"fixed":false,"explanation":"Class C holders may sell on any day, but only on a block where no Class A or Class B vendor is already set up. The day and hour are fine; the food cart already on the block is what rules it out."},{"id":"rp-004","section":"reading","subtype":"true-false","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":"stim-rp-01","stem":"According to the passage, of the three permit classes, only Class C permit holders may sell at 4:00 p.m. on a Monday.","choices":["True","False"],"answer":0,"fixed":true,"explanation":"Class A holders must stop at 3:00 p.m. on weekdays, and Class B holders may sell only on Fridays, Saturdays and Sundays. Class C holders may sell on any day from 8:00 a.m. to 5:00 p.m., so they are the only class allowed at that time."},{"id":"rp-005","section":"reading","subtype":"summary","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-01","stem":"Which of the following is the most accurate summary of the passage?","choices":["Each permit class has its own permitted days, hours and places, and some rules apply to vendors of every class.","The ordinance is intended to remove vendors from borough sidewalks.","Any vendor with a permit may sell on any day of the week.","A vendor who sells outside the permitted hours is fined $75 for a first violation.","Police officers issue vending permits and may take them from vendors who break the rules."],"answer":0,"fixed":false,"explanation":"The passage sets different days, hours and places for Classes A, B and C and then lists rules for vendors of any class. The stated purpose is to keep sidewalks passable while allowing vending, not to remove vendors, and a first violation brings only a written warning."},{"id":"rp-006","section":"reading","subtype":"rule-application","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-02","stem":"Officer Mei-Ling Lin collects a handgun as evidence during her Saturday evening shift. According to the passage, she should place the handgun","choices":["in any open locker numbered 1 through 12, before her shift ends","in locker 17, because the other lockers are not emptied on weekends","in one of lockers 13 through 16 on Monday morning, when the lockers are next emptied","with the on-duty shift supervisor, who will hold it until the Custodian is called in","in one of lockers 13 through 16, unloaded and secured with a cable tie, before her shift ends"],"answer":4,"fixed":false,"explanation":"Firearms go only in lockers 13 through 16, unloaded and cable-tied, and all evidence must be placed before the end of the shift in which it was collected. The weekend affects when lockers are emptied, not when or where the officer must place the item."},{"id":"rp-007","section":"reading","subtype":"true-false","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-rp-02","stem":"According to the passage, an officer who collects a single $20 bill may count it alone, because the two-officer rule applies only to large amounts of currency.","choices":["True","False"],"answer":1,"fixed":true,"explanation":"The passage says currency of any amount must be counted in the presence of a second officer, and both must sign the envelope. There is no exception for small amounts."},{"id":"rp-008","section":"reading","subtype":"rule-application","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-02","stem":"Officer Karim Abbas places a labeled bag in locker 5, locks it and drops the key through the slot. A few minutes later he realizes he wrote the wrong date on the label. According to the passage, who may reopen the locker?","choices":["Officer Abbas, because he placed the item","Any officer working the same shift","Only the Evidence Custodian","The on-duty shift supervisor","Officer Abbas, if a second officer is present"],"answer":2,"fixed":false,"explanation":"Once the key is dropped, only the Evidence Custodian may reopen the locker. The shift supervisor may call the Custodian in, but the passage does not let the supervisor open a locker."},{"id":"rp-009","section":"reading","subtype":"true-false","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-rp-02","stem":"According to the passage, a sealed envelope of currency may be stored in locker 17 together with an item that must be kept cold, as long as both are labeled.","choices":["True","False"],"answer":1,"fixed":true,"explanation":"Locker 17 is for items that must be kept cold, and the passage says no other items may be stored there. Labeling does not create an exception."},{"id":"rp-010","section":"reading","subtype":"summary","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-02","stem":"According to the passage, the purpose of the directive is to","choices":["guarantee that no item of evidence is ever lost or damaged","maintain a documented chain of custody from the time evidence is collected until the Evidence Custodian receives it","make sure that evidence will be accepted in court","reduce the number of hours the Evidence Custodian must work","allow officers to get evidence back whenever they need it"],"answer":1,"fixed":false,"explanation":"The first sentence states the purpose: a documented chain of custody from collection until the Custodian receives the item. A guarantee against all loss overstates that purpose, and acceptance in court may be a real-world benefit but is not stated in the passage."},{"id":"rp-011","section":"reading","subtype":"definition-match","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-03","stem":"Which of the following calls best illustrates a Priority 2 (Urgent) call?","choices":["A caller says a man is punching her neighbor in the driveway right now.","A shop owner arrives to find the front window broken overnight. No one is around, and a brick is lying inside among the broken glass.","A woman reports that her wallet was taken from her gym bag two days ago. No one is around, nothing was left behind, and she gives the details over the phone.","A caller watching from across the street says someone is spray-painting the wall of a closed, empty warehouse right now. No one else is around.","A resident calls to ask what time the road closures for the street fair begin."],"answer":3,"fixed":false,"explanation":"Priority 2 covers a crime in progress when no person is in danger, which fits the spray-painting of an empty warehouse. The driveway assault puts a person in danger (Priority 1), and the broken window and stolen wallet are incidents that are already over."},{"id":"rp-012","section":"reading","subtype":"definition-match","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-03","stem":"Which of the following calls best illustrates a Priority 4 (Deferred) call?","choices":["A man reports that a package was taken from his porch three days ago. No one is around, nothing was left behind, and he gives the details over the phone.","A caller says his elderly father has walked out of the house and is standing in a lane of fast-moving traffic.","A store clerk says a man who took a jacket without paying walked out a minute ago and is waiting at the bus stop in front of the store. No one was threatened or hurt.","A resident returns from a week away and finds the garage door pried open and tools missing. No one is around, and pry marks are visible on the door frame.","A caller asks whether the police station lobby is open on Sundays."],"answer":0,"fixed":false,"explanation":"Priority 4 requires that the incident is over, no suspect is near and no physical evidence remains, so the report can be taken by telephone. The porch theft meets all three; the pried garage door still has physical evidence to examine, which makes that call Priority 3."},{"id":"rp-013","section":"reading","subtype":"definition-match","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-03","stem":"A caller returns to a parking lot and finds her car window smashed and her radio gone. No one is near the car. Broken glass and a screwdriver that is not hers are lying on the front seat. Under the definitions, this call is","choices":["Priority 1 (Immediate)","Priority 2 (Urgent)","Priority 3 (Routine)","Priority 4 (Deferred)","Priority 5 (Advisory)"],"answer":2,"fixed":true,"explanation":"The incident is over and no suspect is near, but the glass and the screwdriver are physical evidence for an officer to examine, which is Priority 3 (Routine). It is not Priority 4 (Deferred) because that level applies only when no physical evidence remains."},{"id":"rp-014","section":"reading","subtype":"definition-match","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-rp-03","stem":"Which of the following calls best illustrates a Priority 1 (Immediate) call?","choices":["A security guard watching a camera says a man is pulling on the door handles of parked cars in a parking garage. No one else is in the garage.","An office manager unlocks a church office and finds the donation box broken open and empty. No one is inside, and the broken lock is on the floor.","A caller reports that someone she cannot identify used her credit card number for an online purchase last month. There is nothing to examine, and she gives the details over the phone.","A business owner calls to tell the police that his alarm company has a new phone number. He does not ask for anything.","A caller says two men are fighting in a parking lot and one of them has just picked up a metal pipe."],"answer":4,"fixed":false,"explanation":"Priority 1 applies when a person is being physically harmed or is in immediate danger of harm, as in a fight where one man has picked up a pipe. In the garage call a crime may be in progress, but the scenario states that no one else is there."},{"id":"rp-015","section":"reading","subtype":"definition-match","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-rp-03","stem":"Which of the following calls best illustrates a Priority 5 (Advisory) call?","choices":["A caller says a small child has climbed out onto a third-floor window ledge.","A school crossing guard calls to let the department know that school will dismiss two hours early on Friday. She does not ask for anything.","A caller across the street says a man who just kicked in the glass of a vending machine at an empty laundromat is still standing outside its door. No one else is there.","A farmer finds a section of fence cut and a tractor gone. No one is around, and tire tracks lead away from the gap.","A caller reports that the license plate was taken from her car sometime last month. No one is around, nothing was left behind, and she gives the details over the phone."],"answer":1,"fixed":false,"explanation":"Priority 5 is a call that only passes along information or asks a question, with no incident reported and no police action requested. The crossing guard's call fits; each of the other calls reports an incident."},{"id":"rp-016","section":"reading","subtype":"detail","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-04","stem":"According to the passage, at what time did Samuel Dalton arrive at the store?","choices":["6:40 a.m.","6:48 a.m.","6:58 a.m.","7:35 a.m."],"answer":2,"fixed":true,"explanation":"Officer Nair arrived at 6:48 a.m. and Mr. Dalton arrived ten minutes later, which is 6:58 a.m. The time 6:40 a.m. is when the officer was sent, and 7:35 a.m. is when she left."},{"id":"rp-017","section":"reading","subtype":"inference","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":"stim-rp-04","stem":"Based on the passage, including Mr. Dalton's statement, it can be concluded that","choices":["the security camera recorded the person who took the drills","the rear door was unlocked at some point after 9:00 p.m. on Monday","the person who entered the store was a current or former employee","the missing property and cash were worth more than $500 in total"],"answer":1,"fixed":false,"explanation":"Mr. Dalton said he locked the door at 9:00 p.m. the night before, and Officer Nair found it unlocked on Tuesday morning, so it was unlocked sometime in between. The passage gives no value for the drills, says nothing about employees, and says only that the camera had been turned to the wall."},{"id":"rp-018","section":"reading","subtype":"true-false","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-rp-04","stem":"The passage states the dollar value of the missing drills.","choices":["True","False"],"answer":1,"fixed":true,"explanation":"The passage says four drills were missing and that the register had held about $180, but it gives no value for the drills."},{"id":"rp-019","section":"reading","subtype":"true-false","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-04","stem":"According to the passage, Officer Nair was at the store for less than one hour.","choices":["True","False"],"answer":0,"fixed":true,"explanation":"She arrived at 6:48 a.m. and left at 7:35 a.m., which is 47 minutes."},{"id":"rp-020","section":"reading","subtype":"detail","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-rp-04","stem":"According to the passage, which of the following did Officer Nair do before leaving the store?","choices":["Dusted the cash register for fingerprints","Watched the security camera recording","Interviewed the owners of neighboring businesses","Photographed the rear door and the display case"],"answer":3,"fixed":false,"explanation":"The last sentence says she photographed the door and the display case before leaving. The other actions might happen in a real investigation, but none of them is stated in the passage."},{"id":"rp-021","section":"reading","subtype":"rule-application","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":"stim-rp-05","stem":"Marcus Feld's sedan has no resident sticker and no guest pass. No snow emergency is in effect. According to the passage, on which occasion would his car be legally parked on a residential street for the entire time shown?","choices":["Saturday from 9:00 a.m. to 1:00 p.m.","Monday from 6:00 p.m. to 8:00 p.m.","Sunday from 9:00 a.m. to 3:00 p.m.","Friday from 10:00 p.m. to 11:00 p.m.","Tuesday from 8:00 a.m. to 11:00 a.m."],"answer":2,"fixed":false,"explanation":"Without a sticker, the two-hour limit applies Monday through Saturday, but on Sundays it does not apply between 7:00 a.m. and 7:00 p.m. The Saturday choice runs four hours and Saturday is still covered by the limit; the Monday choice runs past 7:00 p.m."},{"id":"rp-022","section":"reading","subtype":"true-false","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-05","stem":"According to the passage, a plumber's van with business lettering may park on a residential street on a Saturday morning while the plumber repairs a pipe at a house on that block.","choices":["True","False"],"answer":1,"fixed":true,"explanation":"Commercial vehicles may park while work is being done on the block only on weekdays. The passage says they may not park on a residential street on Saturdays or Sundays for any reason."},{"id":"rp-023","section":"reading","subtype":"rule-application","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-05","stem":"Elena Vasquez's car displays a resident sticker. At 9:00 a.m. on a Wednesday she parks on the even-numbered side of her own residential street. No snow emergency is in effect. According to the passage, her car is","choices":["legally parked, because vehicles with a resident sticker may park at any hour","legally parked, because the Wednesday rule applies only to vehicles without a sticker","illegally parked, because a resident may park for only two hours at a time","illegally parked, because no vehicle may park on any residential street on Wednesdays","illegally parked, because no vehicle may park on the even-numbered side at that time on a Wednesday"],"answer":4,"fixed":false,"explanation":"Resident-sticker parking is subject to the two general rules, and one of them bars every vehicle from the even-numbered side on Wednesdays from 8:00 a.m. to noon. The rule covers only that side and those hours, not every street all day."},{"id":"rp-024","section":"reading","subtype":"true-false","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-05","stem":"According to the passage, when no snow emergency is in effect, a passenger vehicle without a resident sticker may be parked on a residential street at 11:00 p.m. on a Friday if it displays a guest pass.","choices":["True","False"],"answer":0,"fixed":true,"explanation":"Vehicles without a sticker may not park between 7:00 p.m. and 7:00 a.m. unless a guest pass is displayed. With a guest pass and no snow emergency, parking at 11:00 p.m. on a Friday is allowed."},{"id":"rp-025","section":"reading","subtype":"summary","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":"stim-rp-05","stem":"Which of the following is the most accurate summary of the passage?","choices":["Only vehicles displaying a resident sticker may park on residential streets.","Commercial vehicles may not park on residential streets at any time.","Any vehicle may park on a residential street on Sundays, because the weekday limits do not apply.","Parking rules on residential streets differ by type of vehicle, and two rules apply to every vehicle.","The ordinance was adopted mainly to raise money through parking fines."],"answer":3,"fixed":false,"explanation":"The passage gives separate rules for resident, non-resident and commercial vehicles and then two rules for every vehicle. The statements using 'only', 'at any time' and 'any vehicle' each go further than the passage, and fines are never mentioned."},{"id":"rp-026","section":"reading","subtype":"definition-match","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-rp-06","stem":"Which of the following situations best illustrates Pilfering?","choices":["While a hardware store is open, Colin slips a tape measure from a shelf into his coat and walks out without paying.","Without asking, Renee lets the air out of the tires of a coworker's car parked on the street. She takes nothing.","Late at night, Amir climbs over the locked gate of a closed lumber yard without permission, walks around and leaves without touching anything.","Joanna tells a man at a bus stop to hand over his phone or she will punch him, and he gives it to her.","Peter tells a neighbor he is collecting for a charity that he knows does not exist, and she gives him $40."],"answer":0,"fixed":false,"explanation":"Pilfering is taking another person's property from a place open to the public without permission and without force or threats, which is what Colin does in the open store. The bus-stop situation involves a threat of force, so it is Coercive Taking."},{"id":"rp-027","section":"reading","subtype":"definition-match","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-06","stem":"Which of the following situations best illustrates Tampering?","choices":["During business hours, Nora takes a pair of sunglasses from a rack in a pharmacy and leaves without paying.","Tyrone enters a neighbor's shed through an unlocked window without permission and leaves with the neighbor's rake.","In a public parking lot, Luis bends the windshield wipers on a stranger's car without permission and walks away. He takes nothing.","Marcus twists a woman's arm and pulls her purse away from her.","Ivy sells a watch for $300 after telling the buyer it is solid gold, which she knows is untrue."],"answer":2,"fixed":false,"explanation":"Tampering is changing, damaging or moving another person's property without permission when nothing is taken away. Luis damages the wipers and takes nothing; in every other situation something is taken or obtained."},{"id":"rp-028","section":"reading","subtype":"definition-match","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-rp-06","stem":"Hannah knocks on a homeowner's front door and says she is from the water company, which she knows is untrue. Standing on the porch, she collects a $60 'inspection fee' from the homeowner and leaves. Under the definitions, Hannah's conduct is best classified as","choices":["Tampering","Pilfering","Intrusion","Coercive Taking","False Dealing"],"answer":4,"fixed":false,"explanation":"Hannah gets money by making a statement she knows is untrue, which is False Dealing. She uses no force or threat, and she stays on the porch, so she does not enter a building."},{"id":"rp-029","section":"reading","subtype":"definition-match","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":"stim-rp-06","stem":"Which of the following situations best illustrates Intrusion?","choices":["At an open-air public market, Bea takes a scarf from a vendor's table while the vendor's back is turned.","After a warehouse closes for the night, Omar goes in through an unlocked side door without the owner's permission, looks around and leaves empty-handed.","Carl carves his initials into a township-owned bench in a public park.","Outside a bank, Wes raises his fist and tells a woman she will be hurt unless she gives him her envelope of cash, and she does.","With the owner's permission, Lena enters a fenced storage lot after closing to pick up her own trailer."],"answer":1,"fixed":false,"explanation":"Intrusion is entering a building or fenced area that is not open to the public without the owner's permission, whether or not anything is taken, which describes Omar. Lena also enters a fenced area after closing, but she has the owner's permission."},{"id":"rp-030","section":"reading","subtype":"definition-match","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":"stim-rp-06","stem":"Which of the following situations best illustrates Coercive Taking?","choices":["While a diner is busy, Sam quietly takes a customer's wallet from the counter without the customer noticing.","Tariq tells a tourist that a free parking space costs $20, which he knows is untrue, and keeps the money.","Vera pours paint over a neighbor's bicycle that is chained to a public rack. She takes nothing.","Rosa pushes a delivery driver to the ground and takes the package he was carrying.","Zoe climbs through an open window of a closed dental office at night without permission and takes a laptop from a desk."],"answer":3,"fixed":false,"explanation":"Coercive Taking requires taking property directly from a person by force or threat of force, as when Rosa pushes the driver down and takes the package. Sam also takes a person's property, but quietly and without force, which fits Pilfering instead."},{"id":"rp-031","section":"reading","subtype":"detail","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-rp-07","stem":"According to the passage, to whom did Walter Oyelaran explain how the collision happened?","choices":["Officer Baptiste","Officer Lindqvist","Irene Kowalski","Mei Tanaka"],"answer":0,"fixed":false,"explanation":"The passage says Mr. Oyelaran told Officer Baptiste that he had looked down to adjust the radio. Officer Lindqvist also responded, but the passage does not say he spoke to her."},{"id":"rp-032","section":"reading","subtype":"inference","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-07","stem":"It can be concluded from the passage that","choices":["Mr. Oyelaran was driving faster than the speed limit","Ms. Tanaka was taken to a hospital by ambulance","neither vehicle had to be towed from the intersection","Ms. Kowalski was riding in the sedan when it was hit"],"answer":2,"fixed":false,"explanation":"The last sentence says both vehicles were driven from the scene, so neither was towed. Speed is never mentioned, Ms. Tanaka declined an ambulance, and Ms. Kowalski was standing at the bus shelter."},{"id":"rp-033","section":"reading","subtype":"true-false","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-07","stem":"The passage states that Walter Oyelaran was given a traffic citation.","choices":["True","False"],"answer":1,"fixed":true,"explanation":"The passage reports what Mr. Oyelaran said about the collision but never says whether he was cited. A citation may seem likely, but it is not stated."},{"id":"rp-034","section":"reading","subtype":"true-false","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-rp-07","stem":"According to the passage, the white sedan was stopped when it was struck.","choices":["True","False"],"answer":0,"fixed":true,"explanation":"The passage says the pickup truck struck the rear of a white sedan that was stopped at a red light, and the witness confirmed the light was red."},{"id":"rp-035","section":"reading","subtype":"inference","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-07","stem":"Based on the passage, which of the following is the most reasonable conclusion about the cause of the collision?","choices":["The traffic light was not working properly.","The driver of the pickup truck was not watching the road ahead.","The sedan stopped suddenly without warning.","The pavement was wet from rain."],"answer":1,"fixed":false,"explanation":"Mr. Oyelaran said he looked down to adjust the radio and did not see the sedan until it was too late to stop. Nothing in the passage mentions a faulty light, a sudden stop or wet pavement."},{"id":"rp-036","section":"reading","subtype":"rule-application","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-08","stem":"Detective Simone Achterberg is on call and lives 9 miles from the station. According to the passage, on which night may she take an unmarked car home without the Chief's written approval?","choices":["Wednesday","Friday","Saturday","Sunday","No night; the Chief's written approval is always required"],"answer":0,"fixed":true,"explanation":"An on-call detective who lives within 15 miles may take an unmarked car home on Monday through Thursday nights, so Wednesday qualifies. Friday is a weekday, but the passage groups Friday night with Saturday and Sunday as nights that need the Chief's written approval."},{"id":"rp-037","section":"reading","subtype":"true-false","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-rp-08","stem":"According to the passage, any officer may drive the prisoner transport van as long as a second officer rides along.","choices":["True","False"],"answer":1,"fixed":true,"explanation":"The van may be driven only by an officer who has completed the department's van course. The second-officer rule is a separate requirement that applies whenever a prisoner is on board."},{"id":"rp-038","section":"reading","subtype":"rule-application","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rp-08","stem":"Officer Kayla Brandt is on duty in a marked patrol car. She is asked to drive to a store in neighboring Dorrance Township to pick up supplies for the station. She is not in a pursuit and is not transporting a prisoner. According to the passage, she may make the trip in the marked car","choices":["at any time, because picking up supplies is official business","only after noting the trip on the vehicle log","only on a Monday, Tuesday, Wednesday or Thursday","only if a supervisor approves the trip","under no circumstances, because marked cars may not leave the township"],"answer":3,"fixed":false,"explanation":"Marked cars may leave the township only in active pursuit, to transport a prisoner, or when a supervisor approves the trip. Neither of the first two applies, so supervisor a
