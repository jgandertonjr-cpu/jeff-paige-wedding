  rehearse:{n:"Full PFT Rehearsal",sr:"Event order, 5 min rests",c:"Sit-ups → 300m → push-ups → 1.5-mile, minimum 5 minutes between events. Use the BIKE SPRINT substitute for the 300m unless a measured 300m has shown ≥8–10% headroom — a 90% rehearsal of a 62-second 300m is a max effort in everything but name, and it would spend a token you do not have."},
};

const LIBS={...SHIN_EX,...PACE_EX,...STR_EX,...CARDIO_EX,...RUN_EX};

/* ── daily neuromuscular battery (every day, all phases) ──────────────── */
/* Daily, ~8 min. Toe yoga is OUT at the athlete's request and the evidence
   agrees — the only RCT on foot-intrinsic training did not move pain (p=.17).
   Balance STAYS despite feeling like nothing: neuromuscular/balance training is
   the single strongest evidence-backed MTSS prevention intervention in the
   whole file (2025 meta, n=3,887, OR CI 0.13–0.64). Tib raises added — cheap,
   standard, and he asked. v6 adds the short-foot DOME (no toe yoga) on Mon /
   Wed / Fri: foot intrinsics were on his evidence list, and three days keeps
   the battery under ten minutes. */
const DAILY_NEURO=["balance","ankleMob","fdlCurl","tibRaise","smr"];

/* Loaded shin strength now lives inside the two lower days: heavy bent-knee
   soleus + split squat + dorsiflexion on Lower A, straight-knee calf +
   soleus endurance + single-leg RDL on Lower B. */

/* ═══ session builder ═══════════════════════════════════════════════════
   Day shapes are Monday-anchored. Runs are Mon / Wed / Sat, plus a short
   Friday run from Week 8; low-dose jump prep makes Tue / Thu impact days
   from Week 3. The academy will load him five days a week, so the build
   ends there on purpose, in small doses.

   IMPACT DAY = any day containing running, plyometrics, or TrueForm
   minutes. Plyometrics count — which is why the Friday durability work uses
   a step-back sprawl and never a jumping burpee: Friday sits between two
   run days. Boot WALKS are not impact by this definition, but they are
   gated 0/10 like one.
   ═══════════════════════════════════════════════════════════════════════ */
/* Strain is DERIVED from content, never hand-labelled. The rule: any day
   containing a hard effort renders as high strain, and where the label and
   the definition disagree the label is wrong — that is exactly how a double
   plyometric bout came to render as an easy day. Equally, a long EASY run is
   tibially expensive but is not a hard effort: it spends the impact budget,
   not the hard-effort budget, and labelling it "high" hides real headroom. */
const HARD_SR=/≥80%|80–85%/;

/* ═══ THE BIKE ═══════════════════════════════════════════════════
   Every prescription used to read "N min, Zone 2", and he confirmed he rides
   Z1–3 and effectively never above. That wastes the single best asset in the
   plan: the bike is TIBIALLY FREE, so it is the one place hard aerobic work
   costs nothing at the shin. With impact restricted it is the only place
   intensity can legally live.
   Peloton Power Zones (% of FTP): Z1 <55 · Z2 56–75 · Z3 76–90 · Z4 91–105
   · Z5 106–120 · Z6 121–150 · Z7 max.
   Hard bike stays clear of the run days, so THURSDAY is the hard bike day. */
/* HEART RATE IS THE PRIMARY TARGET, not Power Zone. He has not run an FTP test,
   so %FTP zones were unactionable — and a ride prescribed as "Zone 1–2,
   conversational" came back at 106 bpm average, which is 40% of HR reserve:
   below even Z1, and 28–41 bpm under the intended stimulus. An aerobic ride
   that produces no aerobic stress is just time on a bike.
   Karvonen, from his MEASURED resting HR of 52 and an estimated max of 188
   (Tanaka, age 29). If he ever measures a true max, these move. */
const HR_REST=52, HR_MAX=188, HRR=HR_MAX-HR_REST;
const hrz=(lo,hi)=>`HR ${Math.round(HR_REST+lo*HRR)}–${Math.round(HR_REST+hi*HRR)}`;
const BIKE={
  recovery:(m)=>`${m} min easy spin · heart rate ${hrz(0.45,0.60).replace("HR ","")} · recovery, not training.`,
  endurance:(m)=>`${m} min steady ride · heart rate ${hrz(0.60,0.70).replace("HR ","")} the whole time (steady work, not a spin)`,
  /* Interval COUNT scales to the session length. Previously the structure was
     fixed, so a substituted 15-minute session prescribed 4 x 6 min of work plus
     recoveries — 33 minutes of intervals inside a 15-minute ride. Arithmetically
     impossible, and it shipped. Reps now derive from the time available after a
     10 min warm-up and ~5 min cool-down. */
  tempo:(m)=>{const r=Math.max(2,Math.min(4,Math.round((m-15)/11)));return `${m} min · 10 min warm-up · ${r} × 8 min at heart rate ${hrz(0.70,0.80).replace("HR ","")}, 3 min easy between · easy to finish`;},
  threshold:(m)=>{const r=Math.max(3,Math.min(6,Math.round((m-15)/9)));return `${m} min · 10 min warm-up · ${r} × 6 min hard (heart rate ${hrz(0.80,0.88).replace("HR ","")}), 3 min easy between · easy to finish`;},
  vo2:(m)=>{const r=Math.max(4,Math.min(6,Math.round((m-15)/6)));return `${m} min · 10 min warm-up · ${r} × 3 min very hard (heart rate climbing toward ${hrz(0.88,0.95).replace("HR ","")} by the end), 3 min easy between · easy to finish`;},
  climb:(m)=>{const r=Math.max(3,Math.min(5,Math.round((m-15)/8)));return `${m} min · 10 min warm-up · ${r} × 5 min seated on heavy resistance, 60–70 pedal rpm, heart rate ${hrz(0.80,0.88).replace("HR ","")}, 3 min easy between · easy to finish`;},
};
const BIKE_HARD=[BIKE.threshold,BIKE.vo2,BIKE.climb,BIKE.tempo];
const bikeHard=(w,m)=>BIKE_HARD[w%BIKE_HARD.length](m);
/* Varies the PM ride AROUND its per-day base, so Tuesday stays the long one
   and Wednesday the short one, but no duration repeats week to week. This is
   the monotony rule applied to the bike: an identical ride every day drives
   Foster's monotony index up, and monotony is an independent injury risk. */
const BIKE_VAR=[-4,8,0,-6,4,-4,8,0];
/* Clamped 25–65 min. An 80-minute "recovery" ride after a morning session is
   not recovery, and a 20-minute one is not worth changing for. */
const bikePM=(w,d,base)=>Math.min(65,Math.max(25,base+BIKE_VAR[(w*3+d)%BIKE_VAR.length]));

/* ═══ RETURN-TO-RUN LADDER ═════════════════════════════════════════════════
   The path back after any flare that took impact away — evaluated and
   cleared first.
   ALTERNATE DAYS ONLY. Advance one stage only on a 0/10 session AND a 0/10
   next morning. Any non-zero repeats the stage — "five pain-free days then
   resume" is not a criterion, it is how the same injury comes back.
   He does NOT restart at stage 1: with an intact base and a clean evaluation
   he re-enters at stage 5–6, which is ~2 weeks to test-ready. */
const RTR=[
  {s:1,n:"Walk only",           sr:"25 min brisk walk. No running. Pain-free walking is the entry ticket to everything below."},
  {s:2,n:"Walk-jog introduction",sr:"20 min walk with 4 × 1 min easy jog inside it. Stop at the time, not at a feeling."},
  {s:3,n:"Walk-jog build",      sr:"18 min walk with 6 × 1 min easy jog. One extra increment per session, never two."},
  {s:4,n:"First continuous",    sr:"8 min continuous easy, ~11:30–12:30/mi, HR ≤ 147. Walk before and after."},
  {s:5,n:"Continuous build",    sr:"10 min continuous easy. This is the Week-1 dose — if you are re-entering after a clean evaluation, start here."},
  {s:6,n:"Continuous + strides",sr:"12 min continuous easy, then 2 × 20 s strides at ~80% on grass."},
  {s:7,n:"Pace touch",          sr:"15 min continuous with ONE 3 min block at 8:40/mi in the middle. First real pace exposure."},
  {s:8,n:"Test-ready",          sr:"18 min continuous + 4 × 60 m at ~85%. Clear this twice and you are ready to run the test."},
];
const RTR_MAX=RTR.length;

/* ═══ SUBSTITUTIONS ═══════════════════════════════════════════════════════
   When impact is off — by gate, by flare, or by choice — the run is replaced,
   and WHAT it is replaced by depends on what the run was for.
   Bike and rower are tibially FREE and substitute the aerobic stimulus almost
   completely. Walking substitutes the WEIGHT-BEARING stimulus, which the bike
   cannot touch at all — and it is dosed for bone, not for calories, which is
   why it is split across the day rather than done in one block (bone
   desensitises within a bout and resensitises over ~8 h). */
const SUB_OPTS=[{k:"bike",n:"Peloton"},{k:"row",n:"Rower"},{k:"walk",n:"Walk"}];
function subFor(kind,mins,hard,noRow){
  const m=Math.max(10,Math.round(mins));
  if(kind==="bike") return hard
    ? {id:"pz",sr:BIKE.threshold(Math.max(45,Math.round(m*1.5)))+" Replaces the quality run's INTENSITY, which is the part that actually transfers."}
    : {id:"z2",sr:BIKE.endurance(Math.round(m*1.5))+" Shin pain never cancels this."};
  if(kind==="row"&&noRow) return{id:"z2",sr:BIKE.endurance(Math.round(m*1.5))+" ROWER OVERRIDDEN — today carries anchored sit-ups, and the rowing finish is repeated loaded lumbar flexion under fatigue drawing on the same weekly budget. Bike instead."};
  if(kind==="row") return hard
    ? {id:"rowErg",sr:`${Math.max(40,Math.round(m*1.3))} min — 10 min easy, then ${Math.max(3,Math.round(m/4))} × 500 m hard with 2 min easy paddle. Damper 3–5. Stop if your lower back is the limiter.`}
    : {id:"rowErg",sr:`${Math.round(m*1.3)} min steady row, damper 3–5, at a pace you could talk at`};
  const wm=Math.round(m*2.5), mi=(wm/17).toFixed(1);
  return {id:"walk",sr:`${wm} min brisk ≈ ${mi} mi at ~17 min/mi (3.5 mph). SPLIT IT: 2–3 walks across the day, not one block — separated doses carry more bone signal than one long one.`};
}

/* ═══ THE TAPER ENGINE ════════════════════════════════════════════════════
   Nothing added in the final fortnight produces adaptation. It produces
   fatigue. VOLUME COMES DOWN. FREQUENCY AND INTENSITY DO NOT. */
const TAPER_WINDOW=14;
const TAPER_DAYS={
  0:{l:"TEST DAY",am:[{id:"testday",sr:"Warm-up ~25 min, finishing 6–15 min before the start — never more, never less"}],pm:[],off:true,strain:"high",impact:true},
  1:{l:"T−1 · Prime, Don't Rest",am:[{id:"strides",rm:1,sr:"ONE session: 20 min easy walk, with 2 × 20 s strides at ~80% in the middle of it — DO NOT rest completely today. This is the non-obvious instruction and it is the one that protects the 300m"}],pm:[],off:true,impact:true},
  2:{l:"T−2 · Full Rest",am:[{id:"tender",sr:"Gate reading and weigh-in. Then the two cadence sets below and nothing else — they keep the movement pattern warm without costing you anything."}],pm:[],off:true,rest:true},
  3:{l:"T−3 · Easy + Strides",am:[{id:"easyRun",rm:10,sr:"10 min of running, ONE session: ~9 min easy jog, then 2 × 60 m at ~85% with full walk-back (walking on top)"}],pm:[],off:true,impact:true},
  4:{l:"T−4 · Rest or Spin",am:[{id:"recov",sr:"20 min · Rest, or an easy Zone 1 spin — do not train. Err toward rest."}],pm:[],off:true},
  5:{l:"T−5 · Partial Rehearsal",am:[{id:"suIso",sr:"1 set × 30 reps · pace 40/min, pause 5 s sitting up after every 10 · ~85% effort, not max · first, in test order"},{id:"puIso",sr:"1 set × 30 reps · pace 33/min, pause 5 s at the top after every 10 · ~85% effort, not max · 5 min after the sit-ups"}],pm:[{id:"recov",sr:"25 min · TRUE recovery · HR 113–134 bpm · under 55% FTP. Spin, do not train."}],off:true,strain:"mod"},
  6:{l:"T−6 · Last Speed Touch",am:[{id:"easyRun",rm:11,sr:"11 min of running, ONE session: 10 min easy, then 4 × 60 m building to ~85% with full walk-back — your last speed touch. This is the session most likely to be skipped. Do not skip it"}],pm:[{id:"pz",sr:"28 min — 10 min warm-up, then 3 × 2 min at HR 169–178 bpm (Power Zone 5, 106–120% FTP) with 3 min easy between, 5 min spin down. The LAST intensity of the fortnight: same watts as last week, work volume cut 70%. Frequency and intensity held, minutes cut — that is what a taper is."}],off:true,impact:true,strain:"mod"},
};

/* ═══ THE ACADEMY TAPER ═════════════════════════════════════════════════
   Inside the academy the taper can only cut YOUR work — academy PT runs
   regardless. So it removes own running and heavy lower-body work first
   (the two things that cost the 1.5 mile), holds upper strength at moderate
   loads, and keeps the push-up / sit-up pattern warm. Seven days, not
   fourteen: there is no build to taper off, only supplemental fatigue. */
const ACAD_TAPER_WINDOW=7;
const RUNIDS=["easyRun","longRun","quality","ttRun","walkRun","strides","speedEnd","cadence","t300","wedRun","check15"];
const STRENGTH_IDS=["squat","bench","dl","ohp"];
const PU_IDS=["puAmrap","puClust","puIso","puPacing"], SU_IDS=["suAmrap","suLadder","suIso","suPacing"];
/* Weeks whose Sunday screen adds the calf-capacity test (PT review). */
/* Week 9, not 10: Sunday Dec 20 is 48 h before the mock PFT, and a calf
   test to fatigue is the wrong thing to do two days before a max 300 m. */
const HEEL_WKS=[1,4,7,9];

function buildDay(week,dow,dTest,ctx){
  const p=buildDayRaw(week,dow,dTest,ctx);
  /* Return-to-run overrides the written run entirely, and every non-impact
     element of the day survives untouched. Jumps come out with it. */
  const rtr=ctx&&ctx.rtr;
  if(rtr&&!p.rest&&!p.pre){
    const i=p.am.findIndex(x=>RUNIDS.includes(x.id));
    if(i>=0){
      const st=RTR[Math.max(0,Math.min(RTR_MAX-1,rtr-1))];
      const am=p.am.filter((x,j)=>(j===i||!RUNIDS.includes(x.id))&&x.id!=="pogo");
      const k=am.findIndex(x=>RUNIDS.includes(x.id));
      am[k]={id:st.s<=3?"walkRun":"easyRun",rm:st.s<=3?4:(st.s===4?8:st.s===5?10:st.s===6?12:st.s===7?15:18),sr:`RTR STAGE ${st.s}/${RTR_MAX} · ${st.n} — ${st.sr}`};
      return{...p,am,pm:p.pm.filter(x=>x.id!=="pogo"),strain:"easy",rtrStage:st.s,label:`Return-To-Run · Stage ${st.s}`};
    }
    return{...p,am:p.am.filter(x=>x.id!=="pogo"),pm:p.pm.filter(x=>x.id!=="pogo")};
  }
  /* Swap the running item for the chosen substitute. The day keeps its shape —
     strength, prehab and the calisthenics lane are untouched — and it stops
     being an impact day, which is the entire point. */
  const sub=ctx&&ctx.sub;
  if(sub&&!p.rest&&!p.pre){
    const i=p.am.findIndex(x=>RUNIDS.includes(x.id));
    if(i>=0){
      const orig=p.am[i];
      /* Every run item carries `rm`, so the substitute reads a real DURATION. */
      let mins=orig.rm||12;
      let hard=["quality","ttRun","speedEnd","strides","t300","check15"].includes(orig.id)||!!orig.hard;
      if(dTest!=null&&dTest<=9)hard=false;          // matches the no-all-out-inside-9-days rule
      if(dTest!=null&&dTest<=2)mins=Math.min(mins,12);
      const swap=subFor(sub,mins,hard,SU_DAYS.includes(dow));
      /* Strip EVERY other impact item too — leaving strides or jumps on a day
         that reports impact:false also suppresses the impact gate. */
      const am=[]; p.am.forEach((x,j)=>{ if(j===i)am.push(swap); else if(!RUNIDS.includes(x.id)&&x.id!=="pogo")am.push(x); });
      return{...p,am,pm:p.pm.filter(x=>x.id!=="pogo"),impact:false,strain:hard?"mod":"easy",substituted:sub,label:p.label+" — substituted"};
    }
  }
  return p;
}

function buildDayRaw(week,dow,dTest,ctx){
  const ph=getPhase(week),dl=isDeload(week);
  const out={ph,dl,rest:false,pre:false,impact:false,strain:"easy",am:[],pm:[],pmOff:false,label:"",note:null};
  const rp15=runPaces(ctx&&ctx.run15);
  const e1=(ctx&&ctx.e1)||{};
  const trendClean=!(ctx&&ctx.trend>0);
  const _pm=(ctx&&ctx.puMax)||PU_BASE, _sm=(ctx&&ctx.suMax)||SU_BASE;
  const _acc=calisTaper(dTest)>0&&!(dTest!=null&&dTest<=2);
  const pu=()=>{const x=puFor(_pm,week,dow,dTest);return x?[x]:[];};
  const su=()=>{const x=suFor(_sm,week,dow,dTest);return x?[x]:[];};
  const neck=()=>_acc&&NECK_DAYS.includes(dow)?[{id:"neckEnd"}]:[];
  const hipf=()=>_acc&&HIPF_DAYS.includes(dow)?[{id:"hipFlexTol"}]:[];
  /* PT: shin rehab FIRST, when motor quality is highest, and never after an
     all-out bike sprint. The battery sits out of the last two days before a
     test: nothing is gained on test morning and a loaded tib raise before a
     maximal 300 m is a straightforward mistake. */
  const neu=(dTest!=null&&dTest<=1)?[]:DAILY_NEURO.map(id=>({id}));
  const foot=[0,2,4].includes(dow)&&!(dTest!=null&&dTest<=1)?[{id:"shortFoot"}]:[];
  const z2=(m)=>({id:"z2",sr:BIKE.endurance(m)});
  /* The boot walk is its OWN item and its own outing — v6.0 wedged a 40-min
     walk between a circuit and push-up clusters. On a Tuesday from Week 6 it
     carries the time-on-feet block too. */
  const boot=(w)=>{const m=bootMin(w),h=dow===1?BOOT_HOURS[w]:null;
    if(!m)return{id:"bootWalk",sr:"Break-in only: wear the boots indoors 30–60 min today, laced as you will on day one. No walking program yet. If you do not own them yet, buy them THIS week."};
    return{id:"bootWalk",bm:m,sr:`${m} min brisk walk in duty boots, any time today${h?` · then wear them ~${h} h (incl. 10 min marching)`:""} · any shin pain tonight or tomorrow morning → repeat last week's time`};};
  const jumps=()=>(!isAcademy(week)&&JUMPS[week]&&jumpDays(week).includes(dow)&&trendClean&&!(dTest!=null&&dTest<=7))
    ?[{id:"pogo",sr:`${JUMPS[week]} · 60 s rest · before the lifting, after the prehab · count every jump as one rep · stop on any shin pain`}]:[];

  if(!inProgram(week,dow))return{...out,rest:true,pre:true,label:"Before Start"};

  /* Sunday is a genuine rest day in every phase — and in the academy it is
     range day. It carries the WEEKLY objective screen in every week: loads
     rise every build week, boots arrive in Week 2, and academy onset is the
     highest-risk month of the year. Tenderness drift is what this catches. */
  if(dow===6&&dTest!==0){
    return{...out,rest:true,label:isAcademy(week)?"Range Day · Checks Only":HEEL_WKS.includes(week)?"Rest + Checks":"Full Rest",
      am:[{id:"tender",sr:"Weekly re-measure — compare against your baseline photo. An INCREASE in length is a flare trigger on its own."},
          {id:"slHop",sr:"10 hops per leg — must be pain-free"},
          ...(HEEL_WKS.includes(week)?[{id:"heelTest",sr:`Single-leg heel raises to fatigue at 30/min, each leg — target 25–30+ and within 10% side to side by Dec 13. Update the Baseline Screen with the numbers.`}]:[])]};
  }

  /* ── TEST-DATE TAPER OVERLAY ─────────────────────────────────────────── */
  if(dTest!=null&&dTest>=0){
    if(isAcademy(week)&&dTest<=ACAD_TAPER_WINDOW){
      /* Weekday mornings belong to the academy — your part is the evening. */
      const acad=dow<=4?[{id:"acadPT",sr:"Academy PT — whatever they run, log it below. It counts."}]:[];
      if(dTest===0)return{...out,label:"TEST DAY",am:[{id:"testday",sr:"Warm-up ~25 min if they allow it, finishing 6–15 min before the start. Then the playbook on the Plan tab."}],pm:[],pmOff:true,impact:true,strain:"high",taper:0};
      if(dTest===1)return{...out,label:"T−1 · Easy Walk Only",am:acad,pm:[{id:"walk",sr:"15–20 min easy walk this evening — move, do not train"}],taper:1};
      if(dTest===2)return{...out,label:"T−2 · Pattern Touch Only",am:acad,pm:[...neu,...pu(),...su()],taper:2};
      if(dTest<=4)return{...out,label:`T−${dTest} · Supplemental Off`,am:acad,pm:[...neu,{id:"recov",sr:BIKE.recovery(20)+" Optional — only if today's academy PT was light."}],taper:dTest};
      const b80=e1.bench?`2 sets × 3 reps @ ${rnd5(0.8*e1.bench)} lb · 2–3 min rest · moderate`:"2 sets × 3 reps at a moderate load · 2–3 min rest";
      return{...out,label:`T−${dTest} · Moderate Only`,am:acad,
        pm:[...neu,{id:"bench",sr:b80+" · no lower-body barbell this week"},{id:"chin",sr:"2 sets × (your best set minus 3) reps · 90 s rest"},{id:"calfSol",sr:"2 sets × 8 reps · 90 s rest · moderate load, nothing heavier"},...pu(),...su()],taper:dTest};
    }
    if(!isAcademy(week)&&dTest<=TAPER_WINDOW){
      const cold=!ctx||ctx.programDays==null||ctx.programDays<14;
      const screenDone=ctx?!!ctx.screenDone:true;
      const calis=()=>[...su(),...pu()];
      const lane=(main)=>[...neu,...foot,...main,...calis()];
      /* THE SCREEN INTERLOCK — substitutes into an early non-impact taper
         day so a maximal 300 m is never run on unscreened shins. */
      const nonImpactSlot=dTest>=10&&[1,3].includes(dow);
      if(!screenDone&&nonImpactSlot){
        return{...out,label:`T−${dTest} · SCREEN FIRST`,
          am:[...DAILY_NEURO.map(id=>({id})),{id:"tender",sr:"Both tibiae — mark the ends in pen, measure in cm, photograph with a ruler in frame. A documented zero is a baseline."},
              {id:"slHop",sr:"10 hops per leg, rate 0–10. Pain here is itself a red flag."},
              {id:"calfSol",sr:"BASELINE ONLY — single-leg heel raise to failure, straight- and bent-knee, both legs. Primary read is limb symmetry within 10%."},
              ...calis()],
          pm:[],pmOff:true,impact:false,taper:dTest,screenFirst:true};
      }
      if(dTest<=6){
        const t=TAPER_DAYS[dTest];
        const am=t.am.map(x=>RUNIDS.includes(x.id)?{...x,rm:x.rm||(x.id==="strides"?3:10)}:x);
        return{...out,label:t.l,am:t.rest?[...am,...calis()]:lane(am),pm:t.pm,
          pmOff:true,rest:!!t.rest,impact:!!t.impact,strain:t.strain||"easy",taper:dTest};
      }
      const tm=[
        cold
          ?(dTest>=10&&!(ctx&&ctx.recentTT)
            ?{l:"Taper · Pace Calibration",am:[{id:"ttRun",rm:14,sr:"1.5 miles at RPE 7 on a flat measured course, TIMED. This is not a workout — it is the number your race plan is built from."}],pm:[{id:"recov",sr:BIKE.recovery(25)}],impact:true}
            :{l:"Taper · Easy Run",am:[{id:"easyRun",rm:12,sr:"12 min easy — inside 10 days there is no assessment. Build the race plan off your most recent logged 1.5 and state the error bar out loud."}],pm:[{id:"recov",sr:BIKE.recovery(25)}],impact:true})
          :{l:"Taper · Short Quality",am:[{id:"quality",rm:14,sr:`14 min of running: 5 min easy → 3 × 90 s at ${rp15.repMi} (2 min walk between, on top) → easy to 14. Calibration, not a workout.`}],pm:[{id:"recov",sr:BIKE.recovery(25)}],impact:true},
        {l:"Taper · Strength Maintenance",am:[{id:"squat",sr:"2 top sets, MODERATE — no failure work, no new movements"},{id:"calfSol"},{id:"hipAbdL"}],pm:[],off:true},
        {l:"Taper · Easy + Strides",am:[{id:"easyRun",rm:12,sr:"12 min of running, ONE session: ~10 min easy, then 4 × 60 m at ~85% on grass with full walk-back — the sprint-preparation dose"}],pm:[{id:"recov",sr:BIKE.recovery(25)}],impact:true},
        {l:"Taper · Upper Maintenance",am:[{id:"bench",sr:"2 top sets, MODERATE"},{id:"row"},{id:"carry"}],pm:[],off:true},
        {l:"Taper · Easy Spin",am:[{id:"recov",sr:BIKE.recovery(30)}],pm:[],off:true},
        {l:"Taper · Easy + Goal-Pace Block",am:[{id:"easyRun",rm:14,sr:`14 min easy continuous with ONE 3-minute block at ${rp15.repMi} mid-run. NOT a time trial`}],pm:[{id:"recov",sr:BIKE.recovery(25)}],impact:true},
        {l:"Full Rest",am:[],pm:[],rest:true},
      ][dow];
      return{...out,label:tm.l,am:tm.rest?[]:lane(tm.am),
        pm:tm.pm||[],pmOff:!!tm.off,rest:!!tm.rest,impact:!!tm.impact,taper:dTest};
    }
  }

  /* ── PHASE B · ARRIVAL TAPER (wks 11–12, Dec 21 – Jan 3) ───────────────
     Rebuilt on the review. The academy is not a race: the job is to arrive
     with tissue tolerance intact AND fresh legs, so RUNNING VOLUME HOLDS
     (58 → 56 min, four runs, all easy, the Saturday runs 20 and 22 min) and INTENSITY comes out; lifting
     halves its sets; push-ups and sit-ups get their own small doses here
     rather than the build-week engine (v6.0's Week 11 had MORE calisthenics
     than any build week). The mock PFT gets a real mini-taper: Monday is an
     8-minute jog and prehab only — no pressing inside 24 h of a push-up max
     — and Wednesday is a recovery spin, nothing else. Every session ≤45 min
     so a travel day loses nothing. Full day in boots: Sat 26 Dec. */
  if(isTaperWk(week)){
    const puR=Math.min(15,Math.round(0.5*_pm)), suL=Math.min(20,Math.round(0.55*_sm));
    const W11=[
      {l:"Easy Day Before The Mock",am:[...neu,...foot,{id:"easyRun",rm:6,sr:"6 min easy jog with 3 relaxed strides at the end. Nothing else today — no pressing, no push-ups, no sit-ups."}],pm:[],off:true,impact:true},
      {l:"MOCK PFT · Full Test Order",am:[{id:"testday",sr:"~25 min warm-up (8–10 min easy jog, drills, a few builds), finishing 6–15 min before the first event"},
        {id:"suAmrap",sr:"Event 1 · 60 s ALL OUT, full test position · log total + 15 s splits"},
        {id:"t300",rm:2,sr:"Event 2 · 300 m FULL EFFORT, 5+ min after the sit-ups · through 200 m in ~36 s, then hold form"},
        {id:"puAmrap",sr:"Event 3 · 60 s ALL OUT, 5+ min after the 300 · log total + 15 s splits"},
        {id:"ttRun",rm:22,sr:`Event 4 · 1.5 mi FULL EFFORT, 5+ min after the push-ups · check your watch at the half-mile: aim for ${mmss(rp15.next/3)} (${rp15.repMi.replace("/mi","/mile")}, the pace you've been training) · on pace at the mile? empty the tank`}],
        pm:[],off:true,impact:true,strain:"high",mock:true},
      {l:"Recovery · Spin + Boots",am:[...neu,...foot],pm:[{id:"recov",sr:BIKE.recovery(25)},{id:"bootWalk",bm:30,sr:"30 min easy walk in duty boots, then keep them on for ~2–3 h — the bridge to Saturday's long day, so it is not a jump from nothing."}]},
      {l:"Easy Run + Lower Light",am:[...neu,{id:"easyRun",rm:8,sr:"8 min run on grass: 7 min easy jog, then 3 × 20 s relaxed strides, walk back between"}],pm:[...jumps(),{id:"squat",sr:liftSr("squat",week,e1)},{id:"calfSol",sr:solSr(week,e1)}],impact:true},
      {l:"Christmas · Nothing Required",am:[{id:"walk",sr:"Optional 20–40 min walk. The prehab battery if you feel like it. That is the whole list."}],pm:[],off:true},
      {l:"Easy Run + Full Day In Boots",am:[...neu,{id:"longRun",rm:20,sr:"20 min easy, all on asphalt"},{id:"bootWalk",sr:"LONG DAY IN BOOTS — the rehearsal: on after the run for ~6 h (standing, errands, 10 min marching at ~120 steps/min, stairs). It is here, not on Jan 2, so a sore spot has a week to settle."}],
       pm:[{id:"bench",sr:liftSr("bench",week,e1)},{id:"chin",sr:"2 sets × (your best set minus 3) reps · 90 s rest"},{id:"puIso",sr:isoSr(_pm,PU_CAD,1,"locked-arm")},{id:"suIso",sr:isoSr(_sm,SU_CAD,1,"crunched")}],impact:true},
    ];
    const W12=[
      {l:"Easy Run + Upper",am:[...neu,...foot,{id:"easyRun",rm:12,sr:"12 min easy jog, at a pace you could talk at"}],pm:[{id:"bench",sr:liftSr("bench",week,e1)},{id:"chin",sr:"2 sets × (your best set minus 3) reps · 90 s rest"},{id:"puClust",sr:setLine(3,puR,"45–60 s","after the bench · easy, nothing near failure")}],impact:true},
      {l:"Lower · Last Heavy Lower Before Day One",am:[...neu,...jumps(),{id:"squat",sr:liftSr("squat",week,e1)},{id:"dl",sr:liftSr("dl",week,e1,"your last barbell lower-body session before day one — moderate")},{id:"calfSol",sr:solSr(week,e1)}],pm:[z2(30),{...boot(week),sr:boot(week).sr+" · day 1 of 3 in a row in boots"}],impact:jumps().length>0},
      {l:"Easy Run + Strides",am:[...neu,...foot,{id:"easyRun",rm:12,sr:"12 min run on grass: 11 min easy jog, then 3 × 20 s relaxed strides, walk back between"}],pm:[{id:"puIso",sr:isoSr(_pm,PU_CAD,1,"locked-arm")},{id:"suLadder",sr:setLine(2,suL,"45–60 s","easy")},{id:"bootWalk",sr:"Wear the duty boots ~3 h today (standing, errands) — day 2 of 3 in a row"}],impact:true},
      {l:"Easy Run + Upper Light",am:[...neu,{id:"easyRun",rm:10,sr:"10 min easy jog"}],pm:[...jumps(),{id:"ohp",sr:liftSr("ohp",week,e1)},{id:"row"},{id:"puClust",sr:setLine(3,puR,"45–60 s","after the pressing · easy")},{id:"bootWalk",sr:"Wear the duty boots ~3 h today (standing, errands) — day 3 of 3 in a row. The academy is five days running; this is the rehearsal for the next-day recovery."}],impact:true},
      {l:"New Year's Day · Nothing Required",am:[{id:"bootWalk",sr:"~2 h in the duty boots, easy (a walk, errands). That is the whole list today."}],pm:[],off:true},
      {l:"Easy Run · Academy Rehearsal",impact:true,am:[...neu,{id:"longRun",rm:22,sr:"22 min easy on asphalt, in the shoes you will wear for academy PT"}],pm:[{id:"suLadder",sr:setLine(2,suL,"45–60 s","easy")},{id:"bootWalk",sr:"Up to 3 h in the boots, no more. The long-day rehearsal was Dec 26 — today is not the day to add load."}]},
    ];
    const m=(week===11?W11:W12)[dow];
    return{...out,label:m.l,am:m.am,pm:m.pm,pmOff:!!m.off||!m.pm.length,impact:!!m.impact,strain:m.strain||"easy",mock:!!m.mock};
  }

  /* ── PHASE C · ACADEMY ─────────────────────────────────────────────────
     Mon–Fri the academy owns the MORNING: the AM list is the academy and
     nothing else. Prehab moves to the evening, ahead of a short session
     (clarity review: v6.0 asked for 20+ min of prehab before reporting).
     Saturday is optional and light — six months without a real rest day was
     the coach review's #3 must-fix: Mon–Fri academy, Sunday range. */
  if(isAcademy(week)){
    const acadPT={id:"acadPT",sr:"Academy PT — log it below: what you did, minutes of running, how hard (1–10)"};
    const ap=ctx&&ctx.acadPlan&&ctx.acadPlan[week];
    const own=ap?ap.own:0, exp=ap?ap.acadExp:ACAD_ASSUME_DEFAULT;
    if(dow===5){
      if(dl){
        /* Retest morning: tests FIRST, before anything that could fatigue them. */
        return{...out,label:"Saturday · Retest Morning",am:[...neu,...su(),...pu(),{id:"recov",sr:BIKE.recovery(20)+" After the tests, if you want it."}],pm:[],pmOff:true,strain:"high",academy:true};
      }
      const item=own>0
        ?{id:"quality",rm:own,sr:`${own} min of running: easy, with ${Math.max(3,Math.floor(own/3))} × 1 min at ${rp15.repMi} in the middle. The only running the academy leaves room for this week.`}
        /* Hard bike by default (coach review): the 1.5 is his thinnest margin,
           formation runs are far slower than race pace, and the bike puts no
           load on the tibia — so academy RUNNING minutes were the wrong gate.
           It drops to a recovery spin on shin symptoms or a hard academy week
           (3+ PT days logged at 8+/10). */
        :(trendClean&&!((ctx&&ctx.acadHard&&ctx.acadHard[week])>=3))
          ?{id:"pz",sr:BIKE.threshold(40)+" · keeps your 1.5-mile engine with no impact · optional, but worth it"}
          :{id:"recov",sr:BIKE.recovery(20)+(trendClean?" · or nothing — it was a hard academy week, rest IS the session":" · or nothing — shin symptoms this week, no hard work")};
      return{...out,label:"Saturday · Optional",am:[...neu,item,{id:"grip"}],pm:[],pmOff:true,impact:own>0,academy:true};
    }
    const ev=[...neu,...foot];
    const map=[
      {l:"Academy · Evening Strength C1",pm:[...ev,{id:"squat",sr:liftSr("squat",week,e1)},{id:"bench",sr:liftSr("bench",week,e1)},{id:"calfSol",sr:solSr(week,e1)}]},
      {l:"Academy · Evening Recovery",pm:[...ev,{id:"hipAbdL"},{id:"recov",sr:BIKE.recovery(25)+" Optional — skip it if today's PT was hard."}]},
      {l:"Academy · Evening Strength C2",pm:[...ev,{id:"dl",sr:liftSr("dl",week,e1)},{id:"ohp",sr:liftSr("ohp",week,e1)},{id:"chin",sr:"3 sets × (your best set minus 2) reps · 90 s rest · under 5 clean reps? use a band"},{id:"splitSq"},{id:"calfStr"}]},
      {l:"Academy · Evening Pacing Touch",pm:[...ev,...pu(),...su(),{id:"neckEnd"}]},
      {l:"Academy · Evening Prehab Only",pm:ev},
    ][dow];
    return{...out,label:map.l,am:[acadPT],pm:map.pm,pmOff:false,impact:false,strain:"easy",academy:true};
  }

  /* ── PHASE A · BUILD (wks 1–10) ───────────────────────────────────────── */
  const rp=RUN_PLAN[week]||{mon:12,wed:10,sat:14};
  const retest=isRetestMon(week,dow);
  const sim=retest&&calisTaper(dTest)>0&&!(dTest!=null&&dTest<=10);
  /* Goal-pace work buys CALIBRATION and economy at the next-step pace, not
     mileage: short reps, walk recoveries, on a track. Written so the minutes
     ADD UP: 5 easy + reps + 3 easy = the Monday running. */
  const gp=GP_REPS[week];
  const repTxt=gp?`${gp[0]} × ${gp[1]===1.5?"90 s":gp[1]+" min"}`:"";
  const mon=dl||retest||!gp
    ?{id:"easyRun",rm:rp.mon,sr:`${rp.mon} min easy jog on grass or track, at a pace you could talk at${retest?" — after the tests, nothing hard":""}.${cadNote(week,0)}`}
    :{id:"quality",rm:rp.mon,sr:`${rp.mon} min run on a track: 5 min easy · ${repTxt} at ${rp15.repMi.replace("/mi","/mile")}, walk the same time after each (walking doesn't count) · 3 min easy.${cadNote(week,0)}`};
  /* ONE Wednesday run, written as ONE item with its parts in order. */
  const sp=SPEED[week];
  const fast=/×\s*(100|150|200|250)\s*m/.test(sp||"");
  const speedOK=!!sp&&!dl&&(trendClean||!fast);
  const spTxt=speedOK?sp.replace(/\s*—\s*ONLY if.*$/,""):(dl?null:"4 × 20 s fast-but-relaxed strides on grass, walk back between (the speed-endurance reps are OFF this week: the last 7 days were not pain-free)");
  const repSec=spTxt?(speedOK?(SPEED_SEC[week]||80):80):0;
  const easyT=mmss(rp.wed*60-repSec);
  const wedItem={id:"wedRun",rm:rp.wed,hard:speedOK&&fast,
    sr:`${rp.wed} min run on grass or track: about ${Math.round(rp.wed-repSec/60)} min easy jog${spTxt?`, then ${spTxt} (walking back doesn't count toward the ${rp.wed})`:" — deload week, no speed"}.${cadNote(week,2)}`};
  const satItem=week===RUN15_CHECK_WK&&trendClean
    ?{id:"check15",rm:rp.sat,sr:`${rp.sat} min of running, ONE session: ~7 min easy warm-up jog with 3 strides, then 1.5 miles hard but controlled — not a race — on a track or flat measured course, even pace, starting near ${rp15.curMi.replace("/mi","/mile")}. Log the time in Records: your interval paces update from it.`}
    :FORMATION[week]
      ?(()=>{const a=Math.min(ASPHALT[week]||0,rp.sat),f=FORMATION[week];
        /* Asphalt is the LAST part of the run so the formation-pace finish is
           on the formation surface — v6.1 draft put them at opposite ends. */
        return{id:"longRun",rm:rp.sat,sr:`${rp.sat} min continuous: ${a>=rp.sat?`all on asphalt — easy for ${rp.sat-f} min`:`${rp.sat-a} min easy on grass or track, then ${a} min on asphalt — easy at first`}, and the last ${f} min STEADY at ~10:00/mile (a typical formation-run pace: comfortably hard, not a race). Only if this morning's first steps were pain-free — otherwise run it all easy on grass.${cadNote(week,5)}`};})()
      :{id:"longRun",rm:rp.sat,sr:`${rp.sat} min continuous, easy · surface: ${surfaceOf(week,rp.sat)}${week===RUN15_CHECK_WK?" (the 1.5-mile check is OFF — the last 7 days were not pain-free)":""}.${cadNote(week,5)}`};
  const friRun=rp.fri?{id:"easyRun",rm:rp.fri,sr:`${rp.fri} min easy jog on grass or track ONLY (tomorrow is the long run on the road) — gets your legs used to back-to-back days.${cadNote(week,4)}`}:null;
  const bikeHardPM=()=>({id:"pz",sr:bikeHard(week,45)});
  /* A deload ride is never longer than the shortest build ride — the
     duration rotation once handed a deload week its longest rides. */
  const ride=(d,base)=>dl?25:bikePM(week,d,base);
  /* Durability: small doses of what the academy will ask for — getting up
     off the ground, grip, carries, a short bodyweight circuit, and from
     Week 8 a generic drag + shuttle for the (unpublished) obstacle course.
     Never a second program: two items, rotating. */
  const DUR=[[{id:"getup"},{id:"grip"}],[{id:"sprawl"},{id:"carry"}],[{id:"circuit"},{id:"grip"}]];
  const dur=dl?[{id:"grip"}]:(week>=8&&week%2===0)?[{id:"drag"},{id:"grip"}]:DUR[week%3];
  const upperB=[{id:"ohp",sr:liftSr("ohp",week,e1)},{id:"chin",sr:"2 sets × (your best set minus 3) reps · 90 s rest"},{id:"row"},...pu()];
  const friTail=[...dur,...su(),...neck(),...hipf()];
  const days=[
    sim
      ?{l:"RETEST · Test-Order Rehearsal + Upper A",strain:"high",impact:true,
        am:[...neu,...foot,...su(),{id:"acid",sr:"In the 5 min after the sit-ups: 3 min easy spin with 2 short pick-ups, then 45–60 s ALL OUT, seated · then 5 min rest"},...pu(),mon],
        pm:[{id:"bench",sr:liftSr("bench",week,e1)},{id:"chin",sr:dl?"2 sets × (your best set minus 3) reps · 90 s rest":"3 sets × (your best set minus 2) reps · 90 s rest · under 5 clean reps? use a band"},{id:"row"}]}
      :{l:dl?"Easy Run + Upper A":"Goal-Pace Run + Upper A",impact:true,
        am:[...neu,...foot,mon],
        pm:[{id:"bench",sr:liftSr("bench",week,e1)},{id:"chin",sr:dl?"2 sets × (your best set minus 3) reps · 90 s rest":"3 sets × (your best set minus 2) reps · 90 s rest · under 5 clean reps? use a band"},{id:"row"},...pu(),...su(),...neck()]},
    {l:"Lower A · Squat + Soleus",impact:jumps().length>0,
     /* Banded dorsiflexion dropped here (coach review): the tib raises in
        the morning battery already work the same muscle. */
     am:[...neu,...jumps(),{id:"squat",sr:liftSr("squat",week,e1)},{id:"calfSol",sr:solSr(week,e1)},{id:"splitSq"},{id:"hipAbdL"},...hipf()],
     pm:[{id:"rowErg",sr:`${ride(dow,28)} min steady row, damper 3–5, at a pace you could talk at`},...(bootDays(week).includes(1)?[boot(week)]:[])]},
    {l:dl?"Short Run":"Short Run + Speed",impact:true,
     am:[...neu,...foot,wedItem],
     pm:[z2(ride(dow,28)),...pu(),...su(),...neck()]},
    {l:"Lower B · Deadlift",impact:jumps().length>0,
     am:[...neu,...jumps(),{id:"dl",sr:liftSr("dl",week,e1)},{id:"slRDL"},{id:"calfStr"},{id:"solEnd"},{id:"hipAbdL"},{id:"carry"}],
     pm:[dl?{id:"recov",sr:BIKE.recovery(25)}:bikeHardPM(),...(bootDays(week).includes(3)?[boot(week)]:[])]},
    /* Friday PM ride DROPPED (coach review): Phase A ran ~10 sessions and
       11–12 h a week for a 245-lb man in a deficit, and Friday was the
       biggest day of the week right before the long run. */
    friRun
      ?{l:"Short Run + Upper B",impact:true,am:[...neu,...foot,friRun],pm:[...upperB,...friTail]}
      :{l:"Upper B · Press + Durability",am:[...neu,...foot,...upperB],pm:[...friTail,...(bootDays(week).includes(4)?[boot(week)]:[])]},
    {l:satItem.id==="check15"?"1.5-Mile Check":"Long Run",impact:true,am:[...neu,satItem],pm:[],off:true},
  ];
  const m=days[dow];
  return{...out,label:m.l,am:m.am,pm:m.pm,pmOff:!!m.off||!m.pm.length,impact:!!m.impact,strain:m.strain||"easy",retest:sim};
}

/* Weekly bike + rower minutes, surfaced rather than implicit — a 260 min/wk
   week once got built without anyone noticing. Target ~130–170 while
   running normally; higher is legitimate when impact is suspended. */
function weekBikeMin(week,ctx){
  let t=0;
  for(let d=0;d<7;d++){
    const p=buildDay(week,d,ctx&&ctx.dtf?ctx.dtf(week,d):null,{...(ctx||{}),sub:null});
    [...p.am,...p.pm].forEach(x=>{
      if(["z2","pz","rowErg","recov"].includes(x.id)){
        const m=/^(\d+) min/.exec(x.sr||""); if(m)t+=+m[1];
      }
    });
  }
  return t;
}
/* One week, counted the way the audits count it. Used by the Plan tab and
   by the verification sweep (window.__blp.weekSummary), so the table and
   the UI cannot disagree. */
function weekSummary(week,ctx){
  const s={own:0,acad:0,total:0,bike:0,strength:0,pu:0,su:0,prehab:0,boot:0,runDays:0};
  for(let d=0;d<7;d++){
    const p=buildDay(week,d,ctx&&ctx.dtf?ctx.dtf(week,d):null,{...(ctx||{}),sub:null});
    const items=[...p.am,...p.pm];
    const rm=items.reduce((a,x)=>a+(RUNIDS.includes(x.id)?(x.rm||0):0),0);
    s.own+=rm; if(rm>0)s.runDays++;
    if(items.some(x=>STRENGTH_IDS.includes(x.id)))s.strength++;
    if(items.some(x=>PU_IDS.includes(x.id)))s.pu++;
    if(items.some(x=>SU_IDS.includes(x.id)))s.su++;
    if(items.some(x=>x.id==="tibRaise"))s.prehab++;
    /* Boot minutes come from the item's own field, not parsed from its text —
       parsing broke silently the first time the wording changed. */
    items.forEach(x=>{if(x.id==="bootWalk"&&x.bm)s.boot+=x.bm;});
  }
  s.bike=weekBikeMin(week,ctx);
  if(isAcademy(week)){
    const ap=ctx&&ctx.acadPlan&&ctx.acadPlan[week];
    s.acad=ap?(ap.acadLogged!=null?Math.max(ap.acadLogged,ap.acadExp):ap.acadExp):ACAD_ASSUME_DEFAULT;
  }
  s.total=s.own+s.acad;
  return s;
}
/* Own running minutes for every pre-academy week — the input the academy
   room calculation needs for its first comparisons. */
function ownTotalsPre(ctx){const o={};for(let w=1;w<ACADEMY_WK;w++)o[w]=weekSummary(w,{...(ctx||{}),acadPlan:null}).own;return o;}

const B=(w,d)=>`${w}-${d}`;
/* Keys are positional, not id-based, so changing a dose does not orphan a
   day's existing check-offs. */
function trackKeys(week,dow,dTest,ctx){
  const p=buildDay(week,dow,dTest,ctx);
  if(p.pre)return{am:[],pm:[],all:[],pre:true};
  /* A rest day may still carry tracked MEASUREMENTS (Sunday's screen). */
  if(p.rest&&!p.am.length&&!p.pm.length)return{am:[],pm:[],all:[]};
  const b=B(week,dow);
  const am=p.am.map((_,i)=>`${b}-am-${i}`);
  const pm=p.pm.map((_,i)=>`${b}-pm-${i}`);
  return{am,pm,all:[...am,...pm]};
}

/* ═══ GATES ═════════════════════════════════════════════════════════════ */
const CALIS_FLAGS=[
  "Dark or cola-coloured urine — STOP, emergency department SAME DAY, ask for a CK. This is rhabdomyolysis until proven otherwise and it is the most likely serious thing that can happen in a high-rep sit-up block",
  "Abdominal swelling, rigidity, or you cannot straighten up, 24–72 h after sit-ups — this does NOT look like ordinary soreness",
  "Back pain radiating below the buttock crease, or numbness / tingling / weakness in a leg",
  "Neck pain radiating past the shoulder, or ANY numbness or tingling in a hand",
  "Sharp, point-tender pain at the lower abdominal wall or pubic bone, or a new groin or lower-abdominal bulge",
];
const RED_FLAGS=[
  "Focal tenderness under 5 cm — MEASURED with pen marks and a ruler, not estimated. Search for the EDGES; do not press where you expect pain and describe your thumb",
  "Pain over the ANTERIOR tibial cortex (the shin bone's front edge)",
  "Night pain or pain at complete rest",
  "Pain that worsens as a run goes on, rather than warming up",
  "Hop test: FOCAL, sharp pain in the first 1–3 hops, ≥4/10 or you won't continue — mild ache after several hops is NOT this",
  "Pain when simply walking",

  "Pins and needles, numbness, or swelling",
];

/* Impact gate. The old app said ≤3/10 → proceed; that threshold came from
   Achilles tendinopathy research and does not transfer to bone. */
/* TIGHTENED on the PT review, his call (Oct 2026). v5/v6.0 cleared 2–4/10
   pain that "settles or plateaus" to run — but the header and his own
   description of the rule both said 0/10, and for a 245-lb runner with a
   bone-stress history the PT judged 4/10 too permissive: settling pain does
   not reliably rule out an early stress reaction. Now: run only at ≤2/10
   that SETTLES within ten minutes AND a 0/10 first-steps reading this
   morning. 3–4/10, a plateau, or a non-zero morning → swap to the bike
   today; strength and prehab stay. */
function impactGate(pm,shape,am){
  if(pm==null)return{k:"unrated",c:"#606877",h:"NOT RATED",m:"Rate the shin before any impact work."};
  if(pm===0)return{k:"go",c:"#22c55e",h:"CLEAR",m:"0/10. Run as prescribed. Add nothing."};
  if(pm>=6)return{k:"stop",c:"#f43f5e",h:"STOP ALL LOADING",m:"6+/10. Stop, screen the red flags, and get seen in person before loading again."};
  if(shape==null)return{k:"unrated",c:"#606877",h:"SHAPE NOT RATED",m:"A number alone does not decide this. Say what it DOES over the first ten minutes."};
  if(shape==="climbs")return{k:"stop",c:"#f43f5e",h:"STOP ON THE SPOT",m:"Pain that climbs minute over minute is the stress-injury pattern, not the MTSS pattern — whatever the number is. Stop now, screen the red flags, and do not finish the session."};
  if(pm>=5)return{k:"stop",c:"#f43f5e",h:"STOP ON THE SPOT",m:"5/10 is the ceiling regardless of shape. Stop, and treat it as a flare."};
  if(pm>=3)return{k:"swap",c:"#f59e0b",h:"SWAP TO THE BIKE TODAY",m:"3–4/10, even if it settles: no running and no jumps today. Use Swap The Run below; the strength and prehab stay. Tomorrow's first-steps reading decides what comes next."};
  if(shape!=="settles")return{k:"swap",c:"#f59e0b",h:"SWAP TO THE BIKE TODAY",m:"1–2/10 that plateaus rather than settling is not a running day. Swap the run; everything else stays."};
  if(am==null)return{k:"unrated",c:"#606877",h:"RATE THIS MORNING FIRST",m:"1–2/10 that settles is runnable ONLY if this morning's first steps were 0/10 — rate Gate 2."};
  if(am>0)return{k:"swap",c:"#f59e0b",h:"SWAP TO THE BIKE TODAY",m:"Pain now on top of a non-zero first-steps reading this morning. Swap the run; everything else stays."};
  return{k:"go",c:"#22c55e",h:"CLEAR — RUN AS PRESCRIBED",
    m:"1–2/10 that settles within ten minutes, with a 0/10 morning, is the MTSS warm-up pattern. Run the prescribed session and ADD NOTHING to it. Tomorrow morning's first-steps reading decides whether the dose was tolerated."};
}

/* Gate 1 is a START-AND-STOP gate. Gate 2 is a PROGRESSION gate. They were
   never in conflict — they answer different questions. A 2/10 during Tuesday's
   run does not veto Wednesday; Tuesday's dose is adjudicated by Wednesday
   morning's first steps, and that is Gate 2's job alone.
   What WAS mis-specified was Gate 1's threshold: a flat number cannot tell the
   MTSS warm-up pattern from the stress-injury pattern, and the strict reading
   would have forbidden the run that produced the 13:06 — the single most
   valuable result of this preparation. The gate now reads SHAPE. */
/* The 24-hour rule — rated at first steps out of bed, before coffee,
   before walking it off. This is the term the old app was missing, and
   the one that would actually have caught the original injury. */
function morningGate(am){
  if(am==null)return{k:"unrated",c:"#606877",h:"NOT RATED",m:"Rate at first steps out of bed — before coffee, before walking it off."};
  if(am===0)return{k:"go",c:"#22c55e",h:"DOSE TOLERATED",m:"0/10 and no new tenderness. Yesterday's dose was tolerated — eligible to progress."};
  if(am<=2)return{k:"hold",c:"#f59e0b",h:"AT THE CEILING",m:"1–2/10 clearing within 30 min of moving. The dose is at your ceiling: repeat it, do NOT progress. A descending 4/10 that resolved during yesterday’s session and is clean-ish now is NOT a flare."};
  return{k:"back",c:"#f43f5e",h:"DOSE EXCEEDED",m:"Over 2/10, or lasting past 30 min, or new/expanded tenderness. Drop back one step to your last tolerated session and hold it for two sessions."};
}

/* ═══ NUTRITION ═════════════════════════════════════════════════════════
   The binding constraint is energy availability, not the calorie target.
   Below ~30 kcal/kg FFM bone health is impaired directly — not an
   acceptable risk for someone whose #1 constraint is a bone-stress history.
   So the app computes both and shows which one actually binds. */
const LB=0.45359237;
/* NEAT tiers. Because exercise cancels out of the energy-availability
   equation (EA = (BMR·mult − deficit) / FFM — the exercise term appears in
   TDEE and is subtracted straight back out), NON-exercise activity is the
   ONLY thing that widens the deficit you can safely run. The "active" tier
   was added for v6 because 10k+ steps is the gate on the faster rate. */
const NEAT=[
  {k:"desk",  n:"Desk-bound · under 5k steps", m:1.30},
  {k:"light", n:"Light · 5–8k steps", m:1.375},
  {k:"target",n:"Plan target · 8–10k steps",   m:1.45},
  {k:"active",n:"Active · 10–12k steps",       m:1.50},
  {k:"high",  n:"High · 12k+ steps",           m:1.55},
];
/* Protein is HIS target, 200–220 g, not a formula. The v5 formula (2.4 g/kg
   FFM) lands ~180 g at his size; his number sits above it, and above is the
   safe side in a deficit with four lifting days. */
const PROTEIN_LO=200, PROTEIN_HI=220;
/* opt = {shin:"clear"|"symptomatic"|"flare", phase:"A"|"B"|"C", wk, taper, neatK}
   RULES THAT OVERRIDE THE ARITHMETIC — each one exists because the thing it
   protects outranks fat loss in the priority order:
     • rate 0.5 %BW/wk by default; 0.75 only with 10k+ steps AND a shin-clean
       7 days — the faster rate is earned by the two things that protect bone
     • shins symptomatic (any pain day in the last 7) → deficit ≤ 250 kcal
     • flare (trend rule, red flag, RTR, gate fail) → maintenance
     • test inside its taper window, arrival taper, first two academy weeks
       → maintenance: performance and adaptation first
     • rest of the academy → ≤ 250 kcal: performance first, fat loss second
     • training-burn number stale (>14 days) in the academy → maintenance
     • average sleep under 6.5 h → ≤ 250 kcal */
function nutrition(bwLb,bfPct,exKcal,mult,opt={}){
  if(!bwLb||!bfPct||isNaN(exKcal))return null;      // 0 kcal of training is a real answer, not a missing one
  const bw=bwLb*LB, ffm=bw*(1-bfPct/100);
  const bmr=370+21.6*ffm;                       // Katch-McArdle (needs FFM only)
  const tdee=bmr*(mult||1.375)+exKcal;
  const rate=w=>bwLb*w/100*3500/7;              // kcal/day for w% bodyweight/wk
  const fast=opt.shin==="clear"&&(opt.neatK==="active"||opt.neatK==="high");
  const wantPct=fast?0.75:0.5;
  const want=rate(wantPct);
  /* 30 is the hard floor; 33 is where we would rather sit. Honest framing
     (nutrition review): 30 is a female-derived threshold and male thresholds
     are probably lower and less certain — it stays as a CONSERVATIVE floor
     because a bone-stress history earns the margin. */
  const capHard=Math.max(0,tdee-(exKcal+30*ffm));
  const capPref=Math.max(0,tdee-(exKcal+33*ffm));
  let defLo=Math.min(want,capPref), defHi=Math.min(want,capHard);
  let cap=Infinity, why=null;
  if(opt.taper){cap=0;why="A test is inside its taper window — maintenance until it is done.";}
  else if(opt.phase==="B"){cap=0;why="Arrival taper — maintenance. You are arriving fresh, not lighter.";}
  else if(opt.phase==="C"&&opt.wk<ACADEMY_WK+2){cap=0;why="First two academy weeks — maintenance while the body absorbs a load nobody here controls.";}
  else if(opt.phase==="C"){cap=250;why="Academy — a small deficit at most. Performance first.";}
  /* A training-burn number entered once in October is wrong by March: academy
     PT raises the real burn, so a stale figure silently deepens the deficit
     and drops true EA under the floor (nutrition review). In the academy a
     stale number means maintenance until it is updated. */
  if(opt.exStale&&opt.phase==="C"&&cap>0){cap=0;why="Training burn not updated in 14+ days while the academy is changing it — maintenance until you update it above.";}
  /* Short sleep in a deficit shifts the loss from fat to muscle (Nedeltcheva
     2010) and is linked to injury (Milewski 2014). */
  if(opt.sleep!=null&&opt.sleep>0&&opt.sleep<6.5&&cap>250){cap=250;why="Averaging under 6.5 h of sleep — deficit capped at 250 kcal. In a deficit, short sleep takes the loss from muscle, not fat.";}
  if(opt.shin==="flare"){cap=0;why="Shin flare active — maintenance. Low energy availability is the single most modifiable driver of MTSS becoming a fracture.";}
  else if(opt.shin==="symptomatic"&&cap>250){cap=250;why="Shin symptoms in the last 7 days — deficit capped at 250 kcal until a clean week.";}
  defLo=Math.min(defLo,cap); defHi=Math.min(defHi,cap);
  if(defLo>defHi)defLo=defHi;
  const ea=d=>(tdee-d-exKcal)/ffm;
  const lbWk=d=>d*7/3500;
  const eaCapped=want>capHard;
  /* The trend warning is tied to the phase's own target (nutrition review):
     v6.0 warned only past 1%/wk, which at 245 lb is a ~1,225 kcal/day
     deficit and EA ≈ 22 — far under his own floor before it fired. */
  const warnPct=cap===0?0.3:cap<=250?0.5:0.7;
  /* Macros past protein: fat ≥0.7 g/kg bodyweight, carbs get the rest — and
     the rest should lean toward run, PT and test days (≥3 g/kg there). */
  const intakeMid=tdee-(defLo+defHi)/2;
  const fatG=Math.round(0.7*bw), protMid=(PROTEIN_LO+PROTEIN_HI)/2;
  const carbG=Math.max(0,Math.round((intakeMid-protMid*4-fatG*9)/4));
  return{
    ffmKg:ffm,ffmLb:ffm/LB,bmr,tdee,exKcal,mult:mult||1.375,
    gainAtHigh:Math.round((bmr*1.55-30*ffm)*7/3500*10)/10,
    maxPct:(lbWk(capHard)/bwLb*100).toFixed(2),
    /* The EA-floor ceiling at each step tier, computed — v6.1 hard-coded
       "0.5–0.68%" in copy that also shows at the light tier, where the
       real ceiling is ~0.40%. */
    tierPct:Object.fromEntries(NEAT.map(t=>[t.k,(Math.max(0,bmr*t.m-30*ffm)*7/3500/bwLb*100).toFixed(2)])),
    intakeLo:Math.round(tdee-defHi),intakeHi:Math.round(tdee-defLo),
    defLo:Math.round(defLo),defHi:Math.round(defHi),
    eaLo:ea(defHi),eaHi:ea(defLo),
    proteinLo:PROTEIN_LO,proteinHi:PROTEIN_HI,proteinMeal:Math.round((PROTEIN_LO+PROTEIN_HI)/2/4),
    gPerKgFfm:(PROTEIN_LO/ffm).toFixed(1)+"–"+(PROTEIN_HI/ffm).toFixed(1),
    fatG,carbG,carbHard:Math.max(Math.round(3*bw),carbG+50),   // hard days must sit ABOVE the daily average, never below it
    lossLo:lbWk(defLo).toFixed(1),lossHi:lbWk(defHi).toFixed(1),
    pctLo:(lbWk(defLo)/bwLb*100).toFixed(2),pctHi:(lbWk(defHi)/bwLb*100).toFixed(2),
    wantPct,wantLb:lbWk(want).toFixed(1),fast,warnPct,
    capped:eaCapped,override:why,
    binding:why?"Rule override — "+why:eaCapped?`Energy availability — at a 30 kcal/kg floor your ceiling is ${(lbWk(capHard)/bwLb*100).toFixed(2)}%/wk, under the ${wantPct}% target`:`Rate target (${wantPct}%/wk)`,
  };
}
/* ── bodyweight trend ─────────────────────────────────────────────────────
   Trend, not noise. The LINE is a time-weighted exponential average
   (≈10-day window) seeded from the mean of the first three readings, so one
   odd first morning does not bend it for weeks. The RATE is the least-
   squares slope of the raw readings over the last 21 days, once there are
   at least 6 of them and they span ≥14 days — the EMA-difference rate v6.0
   used lags two to three weeks behind a real change (nutrition review).
   Until then there is no rate verdict: early water and glycogen loss would
   make any verdict wrong. */
/* resumes = dates a deficit (re)started. The first 7 days after the log
   starts, or after a deficit resumes, are mostly water and glycogen — a
   simulated 3 lb water drop on a true 0.5%/wk loss read −0.97%/wk at day 14
   and told him to eat more while he was exactly on target (nutrition
   review). Those days are left out of the RATE; the line still shows them. */
function weightTrend(ws,resumes){
  const pts=ws.filter(x=>x&&x.iso&&x.bw).map(x=>({iso:x.iso,bw:+x.bw,t:+parseISO(x.iso)})).sort((a,b)=>a.t-b.t);
  if(!pts.length)return null;
  const seed=pts.slice(0,3);
  let tr=seed.reduce((a,p)=>a+p.bw,0)/seed.length;
  pts.forEach((p,i)=>{if(i){const dd=Math.max(0,(p.t-pts[i-1].t)/86400000);tr+= (1-Math.exp(-dd/10))*(p.bw-tr);}p.tr=tr;});
  const last=pts[pts.length-1];
  const starts=[pts[0].t,...(resumes||[]).map(d=>+d)].filter(t=>t<=last.t);
  const cut=Math.max(...starts)+7*86400000;
  const win=pts.filter(p=>(last.t-p.t)/86400000<=21&&p.t>=cut);
  let pctWk=null,lbWk=null;
  const span=win.length?(last.t-win[0].t)/86400000:0;
  if(win.length>=6&&span>=14){
    const xs=win.map(p=>(p.t-win[0].t)/86400000), ys=win.map(p=>p.bw);
    const mx=xs.reduce((a,b)=>a+b,0)/xs.length, my=ys.reduce((a,b)=>a+b,0)/ys.length;
    const sxy=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0), sxx=xs.reduce((a,x)=>a+(x-mx)*(x-mx),0);
    if(sxx>0){lbWk=sxy/sxx*7;pctWk=lbWk/my*100;}
  }
  return{pts,trend:last.tr,pctWk,lbWk,first:pts[0],n:win.length};
}

/* ── store migration ──────────────────────────────────────────────────────
   v5 → v6: every week-keyed map shifts −7 weeks (see V5_SHIFT), scores and
   weights get their week recomputed from their own date where it parses,
   the single testDate becomes the first entry of the test list, and the
   speed-ladder step is dropped (the ladder no longer exists). blp-v5 is
   left in place, untouched, as a rollback copy.
   v4 → v6: the v4 path carried only scores and bodyweights, and still does. */
const shiftKey=k=>{const m=/^(-?\d+)-(.*)$/.exec(k);return m?`${Number(m[1])-V5_SHIFT}-${m[2]}`:k;};
const shiftMap=o=>Object.fromEntries(Object.entries(o||{}).map(([k,v])=>[shiftKey(k),v]));
const dateToIso=s=>{if(!s)return null;if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const d=new Date(s);return isNaN(d)?null:isoOf(d);};
const fixDated=(arr,shift)=>(arr||[]).map(x=>{
  const iso=x.iso||dateToIso(x.date);
  const week=iso?weekOfDate(parseISO(iso)):(x.week!=null?x.week-shift:null);
  return{...x,iso,week};
});
function migrateV5(d){
  const runLog={};
  Object.entries(d.runLog||{}).forEach(([k,v])=>{runLog[String(Number(k)-V5_SHIFT)]=v;});
  return{
    v:6,migratedFrom:"blp-v5",migratedAt:new Date().toISOString(),
    done:shiftMap(d.done),pmPain:shiftMap(d.pmPain),pmShape:shiftMap(d.pmShape),
    amPain:shiftMap(d.amPain),flags:shiftMap(d.flags),subs:shiftMap(d.subs),
    rtr:d.rtr??null,screen:d.screen||null,body:d.body||null,
    scores:fixDated(d.scores,V5_SHIFT),weights:fixDated(d.weights,V5_SHIFT),
    efforts:fixDated(d.efforts,V5_SHIFT),runLog,
    tests:d.testDate?[{date:d.testDate,label:"Carried over from v5"}]:[],
    lifts:[],acad:{},acadAssume:ACAD_ASSUME_DEFAULT,
  };
}
function migrateV4(d){
  return{v:6,migratedFrom:"blp-v4",migratedAt:new Date().toISOString(),
    scores:fixDated(d.scores,0),weights:fixDated(d.weights,0)};
}

    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{display:"block"}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,.08)" strokeWidth={stroke}/>
