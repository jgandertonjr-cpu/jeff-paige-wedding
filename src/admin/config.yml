              - { name: back_to_home, label: "Button: Back to home", widget: string }
              - { name: rsvp, label: "Button: RSVP", widget: string }

  # ── Guest list ───────────────────────────────────────────────────────────
  - name: guest_list
    label: Guest List
    icon: group
    description: "Names the RSVP form recognizes as guests type, and who's on each invitation. Note: this list is part of the public website code, so anyone who knows where to look can see it."
    format: json
    editor:
      preview: false
    files:
      - name: guests
        preview_path: rsvp
        label: Guest List
        file: src/_data/guests.json
        fields:
          - name: guests
            label: Guests
            label_singular: Guest
            widget: list
            collapsed: true
            summary: "{{fields.name}}"
            hint: "One entry per invitation. When this person RSVPs, the form also asks about everyone listed under \"Others on this invitation\". **[See who has replied →](/admin/rsvps/)**"
            fields:
              - { name: id, label: Guest number, widget: string, hint: "Any number not used by another guest — just use the next one." }
              - { name: name, label: Full name, widget: string, hint: "Exactly as written on the invitation." }
              - name: party
                label: Others on this invitation
                label_singular: Person
                widget: list
                required: false
                summary: "{{fields.name}}"
                hint: "Plus-one, spouse, kids — add one entry per extra person, in any number. Leave a name blank if they can bring a guest of their choosing. Leave the list empty if the invitation is just for them."
                fields:
                  - { name: name, label: Name, widget: string, required: false, hint: "Optional. Fills in this person's name on the RSVP form; the guest can still correct it." }
