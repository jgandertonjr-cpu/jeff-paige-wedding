  ohp:     {n:"Overhead Press",sr:"see dose",c:"Standing, strict. Shoulder strength and trunk stiffness that a push-up never trains overhead. Pressing comes before the push-up clusters on the same day, never after."},
  chin:    {n:"Pull-Ups / Chin-Ups",sr:"3 sets × (your best set minus 2) reps · 90 s rest · under 5 clean reps? use a band",c:"On the bar. Balances the pressing volume, protects the shoulders that push-ups hammer, and builds the pulling an obstacle course asks for. Band-assist if you are under 5 clean reps; add load past 12."},
  bench:   {n:"Bench Press",sr:"see dose",c:"Bench strength explains only about a fifth of a one-minute push-up score (Mayhew 1991), so this lift is here for chest, shoulder and triceps size — the push-up sessions do the test work. From 9 Nov: four sets of six, the last set taken to one rep short of failure, and that set is the one you log. The real caution is accumulated elbow and shoulder volume, so push-ups come after pressing, never before."},
  row:     {n:"DB Row",sr:"3 sets × 8–10 reps / arm · 60 s rest",c:"Heavy, braced on the bench. Balances the pressing volume."},
  carry:   {n:"Loaded Carry",sr:"4 sets × 40–50 m · 60 s rest · heaviest dumbbells you can hold without your grip opening",c:"Suitcase and farmer variations. Trunk stiffness that transfers directly to running posture under fatigue, and the grip every drag and wall asks for."},
  drag:    {n:"Drag + Shuttle",sr:"3 rounds: drag a heavy bag or sled 25 m backwards · 4 × 10 m shuttle, touch the floor at each turn · 90 s walk between rounds",c:"Generic obstacle-course prep — MCCC has not published its course, so this covers what most police courses share. Each round: drag a loaded sandbag, sled or heavy bag ~25 m backwards (low hips, short steps), then 4 × 10 m shuttle with a get-down-and-up at each turn, walk 90 s. Moderate, not all-out: it is skill and tolerance, not conditioning."},
  complex: {n:"DB Metabolic Complex",sr:"5 rounds, 60–90s rest",c:"Upper-biased and NO JUMPING — the legs are already spoken for by the running budget. Conditioning that does not spend tibia."},
  /* Academy durability — small doses of what PT and the obstacle course will
     ask for. Never a second program: two short items on Friday, rotating. */
  grip:    {n:"Grip · Dead Hang",sr:"3 sets × longest hang you can · 90 s rest",c:"Hang from the pull-up bar, shoulders packed. Grip fails before anything else on walls, drags and long carries. Log the best hang; aim to pass 60 s."},
  getup:   {n:"Ground-to-Standing",sr:"2 sets × 5 reps / side · 60 s rest · controlled",c:"From lying on your back to standing and back down, alternating the lead side, no hands on the knees on the way up. Academy PT is hundreds of trips to the ground and back. Slow and owned beats fast and sloppy."},
  sprawl:  {n:"Step-Back Sprawl (No-Jump Burpee)",sr:"3 sets × 8 reps · 60 s rest",c:"Hands down, STEP the feet back one at a time, chest to the floor, step back in, stand. No jump. This builds the burpee pattern without spending tibia between two run days; the JUMPING version arrives separately, in small doses, in Jump Prep from Week 9."},
  circuit: {n:"Bodyweight Circuit",sr:"2 rounds: 15 squats · 10 reverse lunges / leg · 20 mountain climbers · 30 s plank · 20 flutter kicks · 1–2 min between rounds · moderate pace, you could still talk",c:"Air squat 15 · reverse lunge 10/leg · mountain climber 20 · plank 30 s · flutter kick 20. Steady, not a race. It is exposure to the kind of session academy PT runs, at a dose that leaves nothing behind."},
  /* v6.2 additions (head-coach review). */
  wallSup: {n:"Wall Prep · Jump To Support",sr:"3 sets × 3 reps · full rest",c:"Prep for the MPOETC obstacle course's 5 ft solid wall with no handles — the element a 245 lb cadet is most likely to fail.\n\nAt home: a barbell racked on the safety arms at about chest-to-chin height, loaded heavy (2× bodyweight) and ONLY if the bar is locked in so it cannot roll or tip. Jump to front support — arms locked, bar at the hips — hold 2 s, step down. If your rack cannot hold the bar dead still, skip it and wait for the school wall from 4 Jan.\n\nAt the school gym: the real wall — approach, hands on top, swing a leg over, 3 × 3."},
  ob:      {n:"Obstacle Block · MPO-245",sr:"~12 min · moderate, skill not conditioning",c:"The statewide obstacle course (MPOETC form MPO-245), in order: exit a patrol car from the driver's seat with the belt buckled · 6-inch low obstacles with direction changes · a 5 ft solid wall with no handles · a 36 in × 3 ft obstacle · drag a 165 lb dummy behind the wall · carry a 25 lb medicine ball to the finish. Three chances to pass before graduation.\n\nAt home, from 9 Nov, it is a 5-minute finisher every second Tuesday: drag a duffel loaded with plates BACKWARDS 3 × 15 m (low hips, short steps), building to the full 165 lb by mid-December, then hug a 25 lb plate to the chest and carry it 2 × 40 m. The wall is trained with pull-ups now and on the real wall at the academy — not on a loaded barbell at home."},
  obRun:   {n:"Obstacle-Course Rehearsal",sr:"all six elements in order, ~70% effort",c:"All six MPO-245 elements in order, timed, at about 70% — this is a rehearsal of the sequence, not a max effort. Car exit with the belt buckled → low obstacles with direction changes → wall (or the wall-support drill if no wall) → a low crawl/step-over obstacle → 165 lb duffel drag ~15 m backwards → 25 lb carry 40 m. Note the time and anything that felt awkward."},
  ptSim:   {n:"Academy PT Simulation",sr:"see dose",c:"What academy PT actually looks like: calisthenics in formation to a CALLED cadence, then a run. You have never done that combination, and day one is the wrong place to meet it.\n\nUse a cadence-caller app or a partner, four-count push-ups and flutter kicks. Step-back burpees only (no jump). Then walk 3 minutes and go straight into the run on the line — that is the point of the session.\n\nIt replaces that Wednesday's push-up and sit-up sets, so nothing is doubled. Jacks count half a jump contact. From 9 Nov it runs three times: 2, 16 and 30 Dec."},
  cuff:    {n:"Shoulder Care · External Rotation + Y-T",sr:"side-lying DB external rotation 2 × 15 / side · prone Y-T raise 2 × 10 · light",c:"After every push-up session. Push-up volume at your size is about 155 lb a rep, and nothing else in the week trains the rotator cuff or lower traps that keep the shoulder centred under it. Light dumbbells (5–10 lb), slow, no swinging."},
  deadbug: {n:"Dead Bug",sr:"2 sets × 8 / side · slow",c:"Lying on your back, arms up, knees at 90°. Lower the opposite arm and leg toward the floor without letting the low back lift, return, switch. Trunk control without more anchored hip-flexor load — it replaces flutter kicks outside the PT simulation."},
  /* v7 additions — the upper-body volume that v6.2 did not have. Every one
     follows the same rule (ACC_RULE, appended below): pick a weight for the
     bottom of the rep range, add reps week to week, and add weight once
     every set reaches the top of the range. */
  inclineDB:{n:"Incline Dumbbell Press",sr:"see dose",c:"Bench at about 30°. Lower the dumbbells to the outside of the chest with the elbows at roughly 45°, press up and slightly in. Upper chest and front shoulder — the part of the chest a flat bench and push-ups load least.\n\nNo adjustable bench? Prop the head end of a flat bench on a couple of plates, or do feet-elevated push-ups with a pause at the bottom."},
  latRaise: {n:"Dumbbell Lateral Raise",sr:"see dose",c:"Slight forward lean, a soft bend in the elbows, raise out to the sides until the hands are at shoulder height, lower over two seconds. Light weights and honest reps: if you have to swing, it is too heavy.\n\nThis is the exercise that makes shoulders look wide, and nothing else in the week trains the side of the shoulder directly — pressing mostly loads the front."},
  triExt:   {n:"Lying Triceps Extension",sr:"see dose",c:"On the bench, a barbell or two dumbbells held over the forehead with the upper arms still. Bend only at the elbow, lower behind the head for a stretch, press back up.\n\nThe triceps are two-thirds of the upper arm and the muscle that fails last in a push-up minute. If the elbows complain, swap to an overhead dumbbell extension or a close-grip push-up."},
  bbRow:    {n:"Barbell Row",sr:"see dose",c:"Hinge to about 45°, back flat, pull the bar to the lower ribs, lower under control. Lats, mid-back and rear shoulder in one lift.\n\nIf the low back is already tired from the week, row chest-down on an incline bench with dumbbells instead — same muscles, no hinge."},
  rearDelt: {n:"Rear-Delt Raise",sr:"see dose",c:"Bent over (or chest-down on an incline bench), light dumbbells, raise out to the sides leading with the elbows. Rear shoulder and the muscles between the shoulder blades.\n\nIt balances the pressing and push-up volume, which is why the separate shoulder-care block is gone."},
  curl:     {n:"Curl",sr:"see dose",c:"Barbell or dumbbells, elbows pinned to the sides, no swing, lower over two seconds. On Friday use an incline or hammer variation for a different angle.\n\nChin-ups and rows train the biceps too; this is the direct work that makes them grow."},
  shrug:    {n:"Shrug",sr:"see dose",c:"Barbell or heavy dumbbells. Straight up toward the ears, hold a second at the top, lower slowly. No rolling.\n\nUpper traps — with the deadlift and the carries, this is what builds the yoke."},
  dbPress:  {n:"Dumbbell Shoulder Press",sr:"see dose",c:"Seated or standing, dumbbells at shoulder height with the palms forward or facing each other, press overhead without leaning back.\n\nA second, lighter pressing exposure for the shoulders after Wednesday's barbell work, in a rep range that builds size."},
  kneeRaise:{n:"Hanging Knee Raise",sr:"see dose",c:"Hang from the bar, bring the knees to the chest without swinging, lower slowly. Lying leg raises if the grip gives out first.\n\nTrains the hip flexors and lower abs that do the work in a timed sit-up, without another set of anchored sit-ups. In a 2,616-soldier trial, swapping sit-ups for core work did not lower sit-up scores (Childs 2009)."},
};

const CARDIO_EX={
  z2:      {n:"Peloton Zone 2",sr:"see dose",c:"The bike is the aerobic engine; running is the tissue-tolerance stimulus. Cycling transfers VO2max well but gives ZERO tibial adaptation — which is exactly why it carries the easy volume. Vary the duration week to week; identical daily sessions drive Foster's monotony index up, and monotony is an independent injury risk factor."},
  pz:      {n:"Peloton Power Zone Intervals",sr:"see dose",c:"Hard aerobic work with no impact cost. This is where intensity goes on weeks the tibia cannot take it."},
  acid:    {n:"Bike Sprint — stands in for the 300m",sr:"45–60 s ALL OUT, seated, legs only · then exactly 5 min rest",c:"This is the middle event of Monday's test-day rehearsal: sit-ups → sprint → push-ups, in order, with 5 minutes between, exactly as MPOETC runs it. It buys the sequence without spending a tibia.\n\nSEATED, and legs only if the machine allows it — hands off the handles on an Echo or Assault bike. A full-body sprint fatigues your triceps and shoulders in a way a 300m run does not, which makes the rehearsal HARDER than the test and makes the push-up number read low. Do not let a disappointing rehearsal trigger a panic increase in volume. Out-of-saddle and standing efforts are banned while the shins are symptomatic.\n\nNot the rower on this day — the rowing finish is repeated loaded lumbar flexion under fatigue and draws on the same weekly budget as the sit-ups you just did.\n\nHonest framing: the closest published experiment (a maximal upper-body time trial nine minutes after a 25-second all-out cycling bout) found no decrement at all — 225.1 s versus 226.1 s. The pre-fatigue effect is probably small. Rehearse the sequence so nothing on the day is novel, but do not build the program around it."},
  testday: {n:"TEST DAY — Warm-Up Protocol",sr:"~25 min, finishing 6–15 min before the start",c:"8–10 min easy jog. Then dynamic mobility: leg swings both planes, walking lunges, A-skips, knee-to-wall. Then build-up strides over 60–80 m at roughly 60%, 70%, 80%, 85%, 90%, full walk-back between — the last one should touch the pace you intend to run. Finish the last stride NO MORE than 15 minutes and NO LESS than 6 minutes before the start, and KEEP MOVING in the gap. Walk, easy skips. Do not sit down. Ten minutes of stillness after a warm-up undoes the warm-up."},
  recov:   {n:"Recovery Ride",sr:"see dose",c:"Easy spin, Zone 1. It moves blood and costs nothing; it is not training. Optional on any day the rest of the load was high. Tibially free."},
  rowErg:  {n:"Rower",sr:"see dose",c:"Rowing is tibially FREE — no ground contact at all — and it loads the posterior chain and the aerobic system hard. It is where a metcon appetite legitimately goes.\n\nDamper 3–5, not 10. Drive with the legs, hinge, then arms; reverse that order coming forward. If your lower back is the limiter rather than your legs and lungs, stop the piece — that is a technique fault, not a fitness one."},
  walk:    {n:"Continuous Walk",sr:"see dose",c:"Peak tibial stress in walking is about half that of running (Meardon 2021), so walking buys daily movement cheaply in bone terms. Build your step count by 1,000–2,000 a week, not in jumps."},
  cadence: {n:"Cadence Block",sr:"3 × 3 min at +5–10% step rate",c:"Inside the run, not added to it. Metronome or the Watch's cadence readout. A 5–10% step-rate increase measurably lowers per-step loading (Heiderscheit 2011) — the best-supported biomechanical fix available to you. The TrueForm naturally raises cadence, which is its single best legitimate use."},
  bootWalk:{n:"Duty-Boot Walk",sr:"see dose",c:"In the boots you will wear at the academy, laced the way you will wear them, on flat ground. WALKING ONLY — never run in them here.\n\nWhy: a new, stiffer, heavier shoe changes how the tibia is loaded. Meeting it for the first time in January, in the same week as academy running starts, is the classic recruit MTSS trigger. Changing one variable at a time, months early, is the whole trick.\n\nGate: 0/10 during AND next morning. Any symptom → repeat last week's time, do not progress. Blisters or hot spots → fix the fit and socks now, not on day one."},
  acadPT:  {n:"Academy PT",sr:"log it",c:"Whatever the academy runs is training load, and it counts toward the same caps as your own running. Log type, minutes, ESTIMATED running minutes and RPE in the quick log below. If your shin gate is closed on an academy day, tell the PT staff before the run — you cannot swap their session, and running through a stress reaction is how a class becomes the next class."},
};

const RUN_EX={
  walkRun: {n:"Walk-Run",sr:"see dose",c:"NOT part of the normal program — you arrived with a running base and do not need to rebuild one. This is the vehicle for the graded return-to-run ladder after a flare, which is the only context the walk-run evidence actually covers. Inside a 20-min walk, add ONE run increment per session, never two."},
  strides: {n:"Strides",sr:"4 × 20 s @ 7:30–8:00/mi on grass",c:"Relaxed and fast, not a sprint — these are neuromuscular and economy work, and at this pace they are not governed by the sprint-entry rules. Grass or track, full walk-back recovery, and never on the TrueForm. Stop the set the moment form degrades."},
  easyRun: {n:"Easy Run",sr:"see dose",c:"Conversational. If you cannot talk, it is not easy and it is stealing from the quality day."},
  longRun: {n:"Long Run",sr:"see dose",c:"Continuous and easy unless the line says otherwise. This is the session that builds the continuous-running tolerance formation runs ask for, and where the surface moves onto asphalt in steps."},
  wedRun:  {n:"Short Run · Cadence + Speed",sr:"see dose",c:"One run, two parts, done in order — the minutes on the line are the whole run, not separate sessions.\n\n① EASY, conversational, with the cadence instruction on the line (a metronome or the Watch cadence readout, same pace, shorter quicker steps). A 5–10% step-rate increase measurably lowers per-step loading (Heiderscheit 2011) — the best-supported running-form fix there is, and the point is to make it your normal stride before formation runs start.\n\n② SPEED, after the easy part: strides or short 300 m-pace reps, as written. Relaxed and fast, never a sprint, grass or track, NEVER the TrueForm, full walk-back. Stop the set the moment form degrades. The faster reps only appear when the last 7 days were pain-free; otherwise the app writes strides instead."},
  quality: {n:"Goal-Pace Run",sr:"see dose",c:"Short repeats at 1.5-mile goal pace with WALK recoveries. They buy calibration and economy at the pace — your legs learning the next-step pace — not mileage. The pace on the line is computed from your most recent logged 1.5 and moves every time you log a new one. One per week, on a track or grass. The bike and rower carry the aerobic engine; this session teaches the pace."},
  speedEnd:{n:"Speed-Endurance",sr:"see dose",c:"Short reps at or near 300 m pace, full recovery, ONLY when the last 7 days were pain-free — otherwise the app swaps in strides. Holds the 300 m without spending a max effort. One near-max-velocity exposure a week is protective; seven or eight is how people get hurt."},
  t300:    {n:"300 m — FULL EFFORT",sr:"see dose",c:"Spends one of your two pre-academy full-effort 300 m tokens (the mock PFT is the planned one; the other is a spare). Full warm-up first — a cold max 300 is how tibias break. Through 200 m in ~36 s, then hold form; do not redline the first 100, the 1.5 mile is still to come."},
  ttRun:   {n:"1.5-Mile Run",sr:"1.5 miles, full effort",c:"Off the watch, even pace. Full effort at the mock PFT or a scheduled test. Log the time — every interval pace in the app is recalculated from your most recent 1.5."},
  check15: {n:"1.5-Mile Time Trial",sr:"see dose",c:"A real, fresh, all-out 1.5 miles — outdoors, on a track or a flat measured course, because the academy runs it outdoors. Warm up on the bike first so the run itself stays inside the single-run cap, then a short jog and three strides.\n\nRun it evenly: the first lap at the time on the line and no faster, then hold, then empty the tank over the last lap. Nothing shows a slow start is better, and a first lap that is too quick is how the last two fall apart.\n\nLog the time on the Records tab. Every goal pace in the app is 3% faster than your best recent 1.5 and moves the moment you log a new one. It comes out automatically if your shins have flagged anything in the last 7 days."},
  rehearse:{n:"Full PFT Rehearsal",sr:"Event order, 5 min rests",c:"Sit-ups → 300m → push-ups → 1.5-mile, minimum 5 minutes between events. Use the BIKE SPRINT substitute for the 300m unless a measured 300m has shown ≥8–10% headroom — a 90% rehearsal of a 62-second 300m is a max effort in everything but name, and it would spend a token you do not have."},
};

const ACC_RULE="\n\nHOW TO PROGRESS IT: start with a weight you can take to the bottom of the rep range with a rep or two left. Add reps each week. When every set reaches the top of the range, add the smallest weight you can and start again from the bottom. The last set goes to failure (from Week 7) because sets ended close to failure are the ones that build size.";
["inclineDB","latRaise","triExt","bbRow","rearDelt","curl","shrug","dbPress"].forEach(k=>{STR_EX[k]={...STR_EX[k],c:STR_EX[k].c+ACC_RULE};});
const LIBS={...SHIN_EX,...PACE_EX,...STR_EX,...CARDIO_EX,...RUN_EX};

/* ── daily neuromuscular battery (every day, all phases) ──────────────── */
/* Daily, ~8 min. Toe yoga is OUT at the athlete's request and the evidence
   agrees — the only RCT on foot-intrinsic training did not move pain (p=.17).
   Balance STAYS despite feeling like nothing: neuromuscular/balance training is
   the single strongest evidence-backed MTSS prevention intervention in the
   whole file (2025 meta, n=3,887, OR CI 0.13–0.64). Tib raises added — cheap,
   standard, and he asked. v6 adds the short-foot DOME (no toe yoga) on Mon /
   Wed / Fri: foot intrinsics were on his evidence list, and three days keeps
   the battery under ten minutes. */
const DAILY_NEURO=["balance","ankleMob","fdlCurl","tibRaise","smr"];

/* Loaded shin strength now lives inside the two lower days: heavy bent-knee
   soleus + split squat + dorsiflexion on Lower A, straight-knee calf +
   soleus endurance + single-leg RDL on Lower B. */

/* ═══ session builder ═══════════════════════════════════════════════════
   Day shapes are Monday-anchored. Runs are Mon / Wed / Sat, plus a short
   Friday run from Week 8; low-dose jump prep makes Tue / Thu impact days
   from Week 3. The academy will load him five days a week, so the build
   ends there on purpose, in small doses.

   IMPACT DAY = any day containing running, plyometrics, or TrueForm
   minutes. Plyometrics count — which is why the Friday durability work uses
   a step-back sprawl and never a jumping burpee: Friday sits between two
   run days. Boot WALKS are not impact by this definition, but they are
   gated 0/10 like one.
   ═══════════════════════════════════════════════════════════════════════ */
/* Strain is DERIVED from content, never hand-labelled. The rule: any day
   containing a hard effort renders as high strain, and where the label and
   the definition disagree the label is wrong — that is exactly how a double
   plyometric bout came to render as an easy day. Equally, a long EASY run is
   tibially expensive but is not a hard effort: it spends the impact budget,
   not the hard-effort budget, and labelling it "high" hides real headroom. */
const HARD_SR=/≥80%|80–85%/;

/* ═══ THE BIKE ═══════════════════════════════════════════════════
   Every prescription used to read "N min, Zone 2", and he confirmed he rides
   Z1–3 and effectively never above. That wastes the single best asset in the
   plan: the bike is TIBIALLY FREE, so it is the one place hard aerobic work
   costs nothing at the shin. With impact restricted it is the only place
   intensity can legally live.
   Peloton Power Zones (% of FTP): Z1 <55 · Z2 56–75 · Z3 76–90 · Z4 91–105
   · Z5 106–120 · Z6 121–150 · Z7 max.
   Hard bike stays clear of the run days, so THURSDAY is the hard bike day. */
/* HEART RATE IS THE PRIMARY TARGET, not Power Zone. He has not run an FTP test,
   so %FTP zones were unactionable — and a ride prescribed as "Zone 1–2,
   conversational" came back at 106 bpm average, which is 40% of HR reserve:
   below even Z1, and 28–41 bpm under the intended stimulus. An aerobic ride
   that produces no aerobic stress is just time on a bike.
   Karvonen, from his MEASURED resting HR of 52 and an estimated max of 188
   (Tanaka, age 29). If he ever measures a true max, these move. */
const HR_REST=52, HR_MAX=188, HRR=HR_MAX-HR_REST;
const hrz=(lo,hi)=>`HR ${Math.round(HR_REST+lo*HRR)}–${Math.round(HR_REST+hi*HRR)}`;
const BIKE={
  recovery:(m)=>`${m} min easy spin · heart rate ${hrz(0.45,0.60).replace("HR ","")} · recovery, not training.`,
  endurance:(m)=>`${m} min steady ride · heart rate ${hrz(0.60,0.70).replace("HR ","")} the whole time (steady work, not a spin)`,
  /* Interval COUNT scales to the session length. Previously the structure was
     fixed, so a substituted 15-minute session prescribed 4 x 6 min of work plus
     recoveries — 33 minutes of intervals inside a 15-minute ride. Arithmetically
     impossible, and it shipped. Reps now derive from the time available after a
     10 min warm-up and ~5 min cool-down. */
  tempo:(m)=>{const r=Math.max(2,Math.min(4,Math.round((m-15)/11)));return `${m} min · 10 min warm-up · ${r} × 8 min at heart rate ${hrz(0.70,0.80).replace("HR ","")}, 3 min easy between · easy to finish`;},
  threshold:(m)=>{const r=Math.max(3,Math.min(6,Math.round((m-15)/9)));return `${m} min · 10 min warm-up · ${r} × 6 min hard (heart rate ${hrz(0.80,0.88).replace("HR ","")}), 3 min easy between · easy to finish`;},
  vo2:(m)=>{const r=Math.max(4,Math.min(6,Math.round((m-15)/6)));return `${m} min · 10 min warm-up · ${r} × 3 min very hard (heart rate climbing toward ${hrz(0.88,0.95).replace("HR ","")} by the end), 3 min easy between · easy to finish`;},
  climb:(m)=>{const r=Math.max(3,Math.min(5,Math.round((m-15)/8)));return `${m} min · 10 min warm-up · ${r} × 5 min seated on heavy resistance, 60–70 pedal rpm, heart rate ${hrz(0.80,0.88).replace("HR ","")}, 3 min easy between · easy to finish`;},
};
const BIKE_HARD=[BIKE.threshold,BIKE.vo2,BIKE.climb,BIKE.tempo];
/* v6.2 (running review): from Week 5 the Thursday ride follows a fixed
   1.5-mile-specific rotation, prescribed by Peloton Power Zones from the
   12 Nov FTP test and by effort. Heart rate is a floor check only — bike HR
   runs 5–10 bpm under running HR, so the old run-derived targets were
   unreachable. No more 60–70 rpm "climb" (least run-specific). */
const BIKE_WK={
  4:"Peloton 20-min FTP test (the class, ~40 min with its warm-up). It sets your Power Zones — every hard ride after this is prescribed in them. Even effort; the last 5 minutes should be the hardest.",
  5:"35 min · 10 min warm-up · 3 × 6 min at Power Zone 4 (~95–100% FTP, effort 7/10), 3 min easy between · easy to finish. Kept moderate: Saturday is the 1.5-mile time trial.",
  7:"45 min · 10 min warm-up · 5 × 3 min at Power Zone 5–6 (~110–118% FTP, effort 9/10), 3 min easy between · easy to finish",
  8:"45 min · 10 min warm-up · 3 sets of 13 × (30 s hard at Power Zone 6 / 15 s easy), 3 min easy between sets · easy to finish (Rønnestad 30/15s)",
  9:"45 min · 10 min warm-up · 3 × 8–10 min at Power Zone 4 (effort 7–8/10), 3 min easy between · easy to finish",
  10:"45 min · 10 min warm-up · 5 × 3 min at Power Zone 5–6 (~110–118% FTP, effort 9/10), 3 min easy between · easy to finish",
};
/* Academy hard ride, alternating by week: VO2 5 × 3 and 30/15s. */
const bikeAcad=w=>w%2?"40 min · 10 min warm-up · 5 × 3 min at Power Zone 5–6 (effort 9/10), 3 min easy between · easy to finish":"40 min · 10 min warm-up · 2 sets of 13 × (30 s hard / 15 s easy), 3 min easy between · easy to finish";
const bikeHard=(w,m)=>BIKE_HARD[w%BIKE_HARD.length](m);
/* Varies the PM ride AROUND its per-day base, so Tuesday stays the long one
   and Wednesday the short one, but no duration repeats week to week. This is
   the monotony rule applied to the bike: an identical ride every day drives
   Foster's monotony index up, and monotony is an independent injury risk. */
const BIKE_VAR=[-4,8,0,-6,4,-4,8,0];
/* Clamped 25–65 min. An 80-minute "recovery" ride after a morning session is
   not recovery, and a 20-minute one is not worth changing for. */
const bikePM=(w,d,base)=>Math.min(65,Math.max(25,base+BIKE_VAR[(w*3+d)%BIKE_VAR.length]));

/* ═══ RETURN-TO-RUN LADDER ═════════════════════════════════════════════════
   The path back after any flare that took impact away — evaluated and
   cleared first.
   ALTERNATE DAYS ONLY. Advance one stage only on a 0/10 session AND a 0/10
   next morning. Any non-zero repeats the stage — "five pain-free days then
   resume" is not a criterion, it is how the same injury comes back.
   He does NOT restart at stage 1: with an intact base and a clean evaluation
   he re-enters at stage 5–6, which is ~2 weeks to test-ready. */
const RTR=[
  {s:1,n:"Walk only",           sr:"25 min brisk walk. No running. Pain-free walking is the entry ticket to everything below."},
  {s:2,n:"Walk-jog introduction",sr:"20 min walk with 4 × 1 min easy jog inside it. Stop at the time, not at a feeling."},
  {s:3,n:"Walk-jog build",      sr:"18 min walk with 6 × 1 min easy jog. One extra increment per session, never two."},
  {s:4,n:"First continuous",    sr:"8 min continuous easy, ~11:30–12:30/mi, HR ≤ 147. Walk before and after."},
  {s:5,n:"Continuous build",    sr:"10 min continuous easy. This is the Week-1 dose — if you are re-entering after a clean evaluation, start here."},
  {s:6,n:"Continuous + strides",sr:"12 min continuous easy, then 2 × 20 s strides at ~80% on grass."},
  {s:7,n:"Pace touch",          sr:"15 min continuous with ONE 3 min block at 8:40/mi in the middle. First real pace exposure."},
  {s:8,n:"Test-ready",          sr:"18 min continuous + 4 × 60 m at ~85%. Clear this twice and you are ready to run the test."},
];
const RTR_MAX=RTR.length;

/* ═══ SUBSTITUTIONS ═══════════════════════════════════════════════════════
   When impact is off — by gate, by flare, or by choice — the run is replaced,
   and WHAT it is replaced by depends on what the run was for.
   Bike and rower are tibially FREE and substitute the aerobic stimulus almost
   completely. Walking substitutes the WEIGHT-BEARING stimulus, which the bike
   cannot touch at all — and it is dosed for bone, not for calories, which is
   why it is split across the day rather than done in one block (bone
   desensitises within a bout and resensitises over ~8 h). */
const SUB_OPTS=[{k:"bike",n:"Peloton"},{k:"row",n:"Rower"},{k:"walk",n:"Walk"}];
function subFor(kind,mins,hard,noRow){
  const m=Math.max(10,Math.round(mins));
  if(kind==="bike") return hard
    ? {id:"pz",sr:BIKE.threshold(Math.max(45,Math.round(m*1.5)))+" Replaces the quality run's INTENSITY, which is the part that actually transfers."}
    : {id:"z2",sr:BIKE.endurance(Math.round(m*1.5))+" Shin pain never cancels this."};
  if(kind==="row"&&noRow) return{id:"z2",sr:BIKE.endurance(Math.round(m*1.5))+" ROWER OVERRIDDEN — today carries anchored sit-ups, and the rowing finish is repeated loaded lumbar flexion under fatigue drawing on the same weekly budget. Bike instead."};
  if(kind==="row") return hard
    ? {id:"rowErg",sr:`${Math.max(40,Math.round(m*1.3))} min — 10 min easy, then ${Math.max(3,Math.round(m/4))} × 500 m hard with 2 min easy paddle. Damper 3–5. Stop if your lower back is the limiter.`}
    : {id:"rowErg",sr:`${Math.round(m*1.3)} min steady row, damper 3–5, at a pace you could talk at`};
  const wm=Math.round(m*2.5), mi=(wm/17).toFixed(1);
  return {id:"walk",sr:`${wm} min brisk ≈ ${mi} mi at ~17 min/mi (3.5 mph). SPLIT IT: 2–3 walks across the day, not one block — separated doses carry more bone signal than one long one.`};
}

/* ═══ THE TAPER ENGINE ════════════════════════════════════════════════════
   Nothing added in the final fortnight produces adaptation. It produces
   fatigue. VOLUME COMES DOWN. FREQUENCY AND INTENSITY DO NOT. */
const TAPER_WINDOW=14;
const TAPER_DAYS={
  0:{l:"TEST DAY",am:[{id:"testday",sr:"Warm-up ~25 min, finishing 6–15 min before the start — never more, never less"}],pm:[],off:true,strain:"high",impact:true},
  1:{l:"T−1 · Prime, Don't Rest",am:[{id:"strides",rm:1,sr:"ONE session: 20 min easy walk, with 2 × 20 s strides at ~80% in the middle of it — DO NOT rest completely today. This is the non-obvious instruction and it is the one that protects the 300m"}],pm:[],off:true,impact:true},
  2:{l:"T−2 · Full Rest",am:[{id:"tender",sr:"Gate reading and weigh-in. Then the two cadence sets below and nothing else — they keep the movement pattern warm without costing you anything."}],pm:[],off:true,rest:true},
  3:{l:"T−3 · Easy + Strides",am:[{id:"easyRun",rm:10,sr:"10 min of running, ONE session: ~9 min easy jog, then 2 × 60 m at ~85% with full walk-back (walking on top)"}],pm:[],off:true,impact:true},
  4:{l:"T−4 · Rest or Spin",am:[{id:"recov",sr:"20 min · Rest, or an easy Zone 1 spin — do not train. Err toward rest."}],pm:[],off:true},
  5:{l:"T−5 · Partial Rehearsal",am:[{id:"suIso",sr:"1 set × 30 reps · pace 40/min, pause 5 s sitting up after every 10 · ~85% effort, not max · first, in test order"},{id:"puIso",sr:"1 set × 30 reps · pace 33/min, pause 5 s at the top after every 10 · ~85% effort, not max · 5 min after the sit-ups"}],pm:[{id:"recov",sr:"25 min · TRUE recovery · HR 113–134 bpm · under 55% FTP. Spin, do not train."}],off:true,strain:"mod"},
  6:{l:"T−6 · Last Speed Touch",am:[{id:"easyRun",rm:11,sr:"11 min of running, ONE session: 10 min easy, then 4 × 60 m building to ~85% with full walk-back — your last speed touch. This is the session most likely to be skipped. Do not skip it"}],pm:[{id:"pz",sr:"28 min — 10 min warm-up, then 3 × 2 min at HR 169–178 bpm (Power Zone 5, 106–120% FTP) with 3 min easy between, 5 min spin down. The LAST intensity of the fortnight: same watts as last week, work volume cut 70%. Frequency and intensity held, minutes cut — that is what a taper is."}],off:true,impact:true,strain:"mod"},
};

/* ═══ THE ACADEMY TAPER ═════════════════════════════════════════════════
   Inside the academy the taper can only cut YOUR work — academy PT runs
   regardless. So it removes own running and heavy lower-body work first
   (the two things that cost the 1.5 mile), holds upper strength at moderate
   loads, and keeps the push-up / sit-up pattern warm. Seven days, not
   fourteen: there is no build to taper off, only supplemental fatigue. */
const ACAD_TAPER_WINDOW=7;
const RUNIDS=["easyRun","longRun","quality","ttRun","walkRun","strides","speedEnd","cadence","t300","wedRun","check15"];
const STRENGTH_IDS=["squat","bench","dl","ohp"];
const PU_IDS=["puAmrap","puClust","puIso","puPacing"], SU_IDS=["suAmrap","suLadder","suIso","suPacing"];
/* Weeks whose Sunday screen adds the calf-capacity test (PT review). */
/* Week 9, not 10: Sunday Dec 20 is 48 h before the mock PFT, and a calf
   test to fatigue is the wrong thing to do two days before a max 300 m. */
/* v6.2: + Week 11 (Sun 27 Dec), the last read before day one. Target ≥30
   straight-knee / ≥25 bent-knee per leg, within 10%. */
const HEEL_WKS=[1,4,6,8,11];

/* ═══ MISSED SESSIONS (v6.3, 2 Nov 2026 — lower-leg, S&C and running-coach
   lanes, reconciled injury-first) ══════════════════════════════════════════
   He marks a day Done / Partial / Skipped / Sick. That status is keyed by
   week-day ("w-d"), never by item position, so nothing already ticked moves.
   An UNMARKED past day counts as done (a false "miss" would reshape a plan he
   follows without ticking); the Today tab asks about unmarked run/test days.
   Every adjustment applies only to TODAY OR LATER — past days stay as built.
     • Same week: the few sessions worth saving move to a day that already
       carries that kind of load; everything else simply drops. Nothing is
       ever doubled, and no move creates a new impact day.
     • Next week: running is capped from what he ACTUALLY ran (runCaps, built
       in App) — never from the plan.
     • After days off: a re-entry ladder for the first week back, slower if
       he was sick. Bone loses tolerance faster than the engine feels it. */
const isMiss=x=>x==="skipped"||x==="sick";
const LIFT_IDS=["squat","bench","dl","ohp"];
/* The most recent run of consecutive missed days ending before `day` (rest
   days with no status don't break it), if it ended within the last 7 days. */
function missStreakBefore(status,day){
  const at=d=>{const w=weekOfDate(d),dd=(daysBetween(START,d)%7+7)%7;return{s:status[B(w,dd)],dd};};
  let last=null;
  for(let i=1;i<=7&&!last;i++){const d=new Date(day);d.setDate(d.getDate()-i);if(isMiss(at(d).s))last=d;}
  if(!last)return null;
  let n=0,sick=false;const d=new Date(last);
  for(let i=0;i<120;i++){
    const a=at(d);
    if(isMiss(a.s)){n++;if(a.s==="sick")sick=true;}
    else if(a.dd===6&&a.s==null&&n>0)n++;          // an unmarked Sunday inside a streak
    else break;
    d.setDate(d.getDate()-1);
  }
  return n>=2?{days:n,sick,since:daysBetween(last,day)}:null;
}
function reentryOf(st){
  if(!st)return null;
  const n=st.days,sk=st.sick;
  if(!sk&&n<4)return null;
  const run=sk?(n<=3?1:n<=6?0.75:n<=13?0.6:0.5):(n<=6?0.9:n<=13?0.7:n<=27?0.5:0.4);
  const lift=sk?(n<=3?{t:"−1 set, no extra reps"}:n<=6?{t:"−1 set, 5% lighter"}:n<=13?{s:2,r:5,p:.70}:{s:2,r:5,p:.65})
                :(n<=6?{cap:.80}:n<=13?{s:3,r:5,p:.75}:{s:2,r:5,p:.70});
  return{days:n,sick:sk,run,lift,noQuality:sk||n>=4,noJumps:sk?n>=4:n>=7,noMax:n>=7||sk,halfCalis:n>=14,easyBike:sk||n>=14,
    rtr:n>=14&&(sk||n>=28),
    msg:`Back after ${n} days off${sk?" (sick)":""}: running at ${Math.round(run*100)}% this first week, all easy${sk?"":" + strides"}, no jumps${n>=7||sk?", no max efforts":""}; lifting ${lift.p?`${lift.s}×${lift.r} @ ${Math.round(lift.p*100)}%`:lift.cap?"capped at 80%":lift.t}.${sk?" Train only once you are 24 h fever-free without meds, symptoms are above the neck only, and resting HR is within 5 beats of normal.":""}${n>=14&&(sk||n>=28)?" Use the Return-To-Run ladder (start at stage 5) for the running.":""}`};
}
function missAdapt(week,dow,p,ctx){
  const st=ctx&&ctx.status;
  if(!st||p.pre)return p;
  const day=dateOf(week,dow);
  if(day<(ctx.today||todayMid()))return p;                   // forward-only
  const notes=[];
  let am=[...p.am],pm=[...p.pm],q={};
  const sOf=(w,d)=>st[B(w,d)];
  const raw=(w,d)=>buildDayRaw(w,d,null,{...ctx,status:null});
  const phaseA=isNew(week)&&!isV7(week)&&week<=10;   // v6.2 template: Week 4 only now
  const phaseA7=isV7(week)&&week<=10;
  const tag=(x,t)=>({...x,sr:(x.sr||(LIBS[x.id]||{}).sr||"")+" · "+t});

  /* ── same-week moves (Phase A build weeks) ── */
  if(phaseA&&!p.rest){
    const monMiss=isMiss(sOf(week,0)), tueMiss=isMiss(sOf(week,1)), wedMiss=isMiss(sOf(week,2)), thuMiss=isMiss(sOf(week,3));
    if(monMiss&&dow===1){
      const m=raw(week,0);
      const tests=m.am.filter(x=>x.id==="suAmrap"||x.id==="puAmrap").map(x=>tag(x,"moved from Monday · at least 90 min after waking, test order"));
      const lifts=m.pm.filter(x=>["squat","bench","chin"].includes(x.id)).map(x=>tag(x,x.id==="squat"?"moved from Monday · one set fewer, no extra reps":"moved from Monday"));
      if(tests.length){am=[...am,...tests];notes.push("Monday's retest moved to this morning.");}
      if(lifts.length){pm=pm.map(x=>x.id==="rowErg"||x.id==="ob"?{...x,sr:"Skip today — Monday's lift moved here"}:x).concat(lifts);notes.push("Monday was missed: its squat + bench + chins moved to this evening (row and obstacle block skipped). Monday's jumps are dropped, not moved.");}
    }
    if(monMiss&&dow===2&&GP_REPS[week]){
      const mins=RUN_PLAN[week].mon, rr={7:"2 × 3 min",8:"4 × 2 min",9:"3 × 2.5 min",10:"2 × 4 min"}[week]||"3 × 2 min";
      am=am.map(x=>x.id==="wedRun"?{id:"quality",rm:mins,hard:true,sr:`${mins} min run on a track: 5 min easy · ${rr} at goal pace (${ctx.run15?runPaces(ctx.run15).repMi:runPaces().repMi}), walk the same time after each · easy to ${mins} · moved from Monday, one rep fewer — no fast 100s/150s or strides today`}:x);
      const sim=am.find(x=>x.id==="ptSim");
      if(sim){am=am.filter(x=>x.id!=="ptSim");notes.push("The PT simulation moves to Friday morning (no jacks).");}
      notes.push("Monday's goal-pace run is today instead of the short run — same impact days, nothing doubled.");
    }
    if(dow===4&&(wedMiss||(monMiss&&GP_REPS[week]))){
      const w=raw(week,2), sim=w.am.find(x=>x.id==="ptSim");
      if(sim&&!(wedMiss&&monMiss)){
        const i=am.findIndex(x=>RUNIDS.includes(x.id));
        const s2={...sim,sr:sim.sr.replace(/ · \d+ jumping jacks/,"")+" · moved from Wednesday, jacks out (tomorrow is the long run)"};
        am=i>=0?[...am.slice(0,i),s2,...am.slice(i)]:[...am,s2];
        pm=pm.map(x=>(PU_IDS.includes(x.id)||SU_IDS.includes(x.id))?{...x,sr:"Skip today — the PT simulation covered it"}:x);
        notes.push("Wednesday's PT simulation is this morning, before the run.");
      }
    }
    if(thuMiss&&dow===4){
      const t=raw(week,3);
      const ohp=t.pm.find(x=>x.id==="ohp"), ftp=t.am.find(x=>x.id==="pz"&&/FTP/.test(x.sr||""));
      if(ohp){pm=[...pm,tag(ohp,"moved from Thursday · last thing in the session")];notes.push("Thursday was missed: the overhead press moved here. The deadlift drops — never the day before the long run.");}
      if(ftp){am=[...am,tag(ftp,"moved from Thursday — every later ride is set from it")];notes.push("The FTP test moved to this morning.");}
    }
    if(tueMiss&&dow===3){
      const t=raw(week,1), bw=t.pm.find(x=>x.id==="bootWalk");
      if(bw){pm=[...pm,tag(bw,"moved from Tuesday")];notes.push("Tuesday's boot walk moved here.");}
    }
    if(dow===5&&week===RUN15_CHECK_WK+1&&isMiss(sOf(RUN15_CHECK_WK,5))&&!isMiss(sOf(RUN15_CHECK_WK,6))){
      const tt=raw(RUN15_CHECK_WK,5).am.find(x=>x.id==="check15");
      if(tt){am=am.map(x=>RUNIDS.includes(x.id)?{...tt,sr:tt.sr+" · moved from last Saturday (replaces today's easy run)"}:x);notes.push("Last week's 1.5-mile time trial is today.");}
    }
  }
  /* ── v7 same-week moves (Weeks 5–10). Same rule as before: the few
     sessions worth saving move to a day that already carries that kind of
     load, everything else drops, nothing is doubled and no move creates a
     new impact day. ── */
  if(phaseA7&&!p.rest){
    const monMiss=isMiss(sOf(week,0)), tueMiss=isMiss(sOf(week,1)), wedMiss=isMiss(sOf(week,2)), thuMiss=isMiss(sOf(week,3)), friMiss=isMiss(sOf(week,4));
    if(monMiss&&dow===1){
      const lifts=raw(week,0).pm.filter(x=>x.id==="bench"||x.id==="chin").map(x=>tag(x,"moved from Monday"));
      if(lifts.length){pm=[...lifts,...pm.filter(x=>x.id!=="ob")];notes.push("Monday was missed: its bench and pull-ups moved to today, ahead of the squat. The rest of Monday's upper-body work drops.");}
    }
    if(monMiss&&dow===2&&GP_REPS[week]&&!(ctx.trend>0)){
      const i=am.findIndex(x=>RUNIDS.includes(x.id));
      if(i>=0){
        const mins=RUN_PLAN[week].mon, rr={7:"4 × 2 min",9:"3 × 3 min",10:"3 × 4 min"}[week]||"3 × 2 min";
        am[i]={id:"quality",rm:mins,hard:true,sr:`${mins} min run on a track or flat path: 5 min easy · ${rr} at ${runPaces(ctx.run15).repMi.replace("/mi","/mile")}, walk 2 min after each · easy to ${mins} · moved from Monday, one rep fewer — no strides today`};
        if(am.some(x=>x.id==="ptSim")){am=am.filter(x=>x.id!=="ptSim");notes.push("The PT simulation drops this week — not on the same morning as the goal-pace run.");}
        notes.push("Monday's goal-pace run is today in place of the easy run — same run days, nothing doubled.");
      }
    }
    if(wedMiss&&dow===4){
      const w=raw(week,2).pm, ohp=w.find(x=>x.id==="ohp"), brow=w.find(x=>x.id==="bbRow");
      if(ohp&&brow){
        pm=pm.map(x=>x.id==="dbPress"?tag(ohp,"moved from Wednesday, in place of the dumbbell press"):x.id==="row"?tag(brow,"moved from Wednesday, in place of the one-arm row"):x);
        notes.push("Wednesday was missed: the overhead press and barbell row replace today's dumbbell press and one-arm row.");
      }
    }
    if(tueMiss&&dow===3){
      const bw=raw(week,1).pm.find(x=>x.id==="bootWalk");
      if(bw)pm=[...pm,tag(bw,"moved from Tuesday")];
      notes.push("Tuesday was missed: its ride and squat drop (two hard rides never go back to back)"+(bw?", and the boot walk moved here.":"."));
    }
    if(thuMiss&&dow===4)notes.push("Thursday was missed: its ride and deadlift drop. Nothing hard moves to the day before the long run.");
    if(friMiss&&dow===5&&FRI_MAX_WKS.includes(week)){
      const tests=raw(week,4).am.filter(x=>x.id==="suAmrap"||x.id==="puAmrap").map(x=>tag(x,"moved from Friday"));
      if(tests.length){am=[...tests,...am];notes.push("Friday's 60-second maxes moved to this morning, before the run — the same order as the test.");}
    }
    TT_WKS.forEach(T=>{
      if(dow===5&&week===T+1&&isMiss(sOf(T,5))&&!isMiss(sOf(T,6))){
        const src=raw(T,5).am, tt=src.find(x=>x.id==="check15"), spin=src.find(x=>x.id==="recov");
        if(tt){
          am=am.map(x=>RUNIDS.includes(x.id)?{...tt,sr:tt.sr+" · moved from last Saturday (replaces today's run)"}:(x.id==="z2"&&spin?spin:x));
          q={...q,label:"1.5-Mile Time Trial · Moved From Last Saturday",strain:"high"};
          notes.push("Last week's 1.5-mile time trial is today.");
        }
      }
    });
  }
  /* Saturday long run missed → Sunday, all easy, only after a 0/10 morning;
     then Monday's run is easy (no reps, no jumps). Not in taper weeks. */
  if(dow===6&&week>=NEW_FROM&&week<=10&&isMiss(sOf(week,5))&&!sOf(week,6)){
    const lr=raw(week,5).am.find(x=>x.id==="longRun");
    if(lr){
      const mv={...lr,sr:`${lr.rm} min continuous, ALL easy (no formation-pace finish) · moved from Saturday — only if this morning's first steps were 0/10; otherwise skip it`};
      am=[...am,mv];
      q={rest:false,impact:true,label:"Long Run · Moved From Saturday",pmOff:true};
      notes.push("Saturday's long run is today, all easy. Monday's run will be easy too.");
    }
  }
  if(dow===0&&week>NEW_FROM&&week<=11&&isMiss(sOf(week-1,5))&&!isMiss(sOf(week-1,6))&&sOf(week-1,6)!=null){
    am=am.map(x=>x.id==="quality"?{id:"easyRun",rm:x.rm,sr:`${x.rm} min easy · no reps today — yesterday was the moved long run`}:x);
    pm=pm.map(x=>x.id==="pogo"?{...x,sr:"Skip today — yesterday was the moved long run"}:x);
    if(isV7(week))am=am.map(x=>x.id==="pogo"?{...x,sr:"Skip today — yesterday was the moved long run"}:x);
  }
  /* The mock PFT (Tue 22 Dec), missed while busy → Wed 23 Dec, the only
     grace day. Sick → no max 300 or 1.5 before day one. */
  if(week===11&&dow===2&&sOf(11,1)==="skipped"){
    const mk=raw(11,1);am=[...mk.am];pm=[];q={label:"MOCK PFT · Moved From Tuesday",impact:true,strain:"high",mock:true,pmOff:true};
    notes.push("The mock PFT moved to today. No later make-up exists.");
  }
  if(week===11&&(dow===2||dow===3)&&sOf(11,1)==="sick"){
    notes.push("Mock missed sick: no max 300 or 1.5 before day one. If you are 48 h fever-free and readiness is green today, do the sit-up and push-up 60-second maxes only. Saturday's 20 min can include 1.5 mi at effort 7/10, timed — a note, not a test.");
  }

  /* ── next week's running cap, from what was actually run ── */
  const cap=ctx.runCaps&&ctx.runCaps[week];
  if(cap&&!p.rest){
    const i=am.findIndex(x=>RUNIDS.includes(x.id));
    if(i>=0){
      const x=am[i], nm=cap.byDay&&cap.byDay[dow]!=null?cap.byDay[dow]:x.rm;
      if(nm<(x.rm||0)){
        const why=cap.why==="shin"?`two shin flags in 14 days, so this week is capped at ${cap.ceil} min — 70% of your last full week, all easy`
          :`last week you ran ${cap.actual} of ${cap.planned} min, so this week is capped at ${cap.ceil}`;
        if(nm<=0){am=am.filter((y,j)=>j!==i&&y.id!=="primer");q={...q,impact:am.some(y=>RUNIDS.includes(y.id)||y.id==="pogo")};notes.push(`No run today: ${why}.`);}
        else if(cap.why==="shin"){am[i]={id:x.id==="longRun"?"longRun":"easyRun",rm:nm,sr:`${nm} min easy on grass or track, nothing fast · cut from ${x.rm}: ${why}`};am=am.filter(y=>y.id!=="pogo");pm=pm.filter(y=>y.id!=="pogo");}
        else{am[i]={...x,rm:nm,id:x.id==="longRun"||x.id==="quality"?x.id:"easyRun",sr:`${nm} min${x.id==="quality"?" — keep the reps, shorten the easy parts":" easy"} · cut from ${x.rm}: ${why}${x.id==="longRun"?" and no formation-pace finish":""} · `+(x.sr||"")};}
        if(nm>0)notes.push(cap.why==="shin"?`Two shin flags in 14 days: running is capped at ${cap.ceil} min this week, all easy, and the calorie deficit is paused.`:`Running capped at ${cap.ceil} min this week (last week: ${cap.actual} of ${cap.planned}).`);
      }
    }
  }

  /* ── re-entry after days off ── */
  const re=reentryOf(missStreakBefore(st,day));
  if(re&&!p.rest&&!(week===11&&dow===1)){
    am=am.map(x=>{
      if(RUNIDS.includes(x.id)){
        if(re.noMax&&(x.id==="check15"||x.id==="t300"||x.id==="ttRun"))return{id:"easyRun",rm:Math.round((x.rm||12)*re.run),sr:`${Math.round((x.rm||12)*re.run)} min easy — no time trial in your first week back; it moves to a later week`};
        const m=Math.max(6,Math.round((x.rm||0)*re.run));
        return re.noQuality?{id:"easyRun",rm:m,sr:`${m} min easy${re.sick?"":" + 4 × 20 s relaxed strides"} · first week back (${Math.round(re.run*100)}% of the written run)`}:{...x,rm:m};
      }
      return x;
    }).filter(x=>!(re.noJumps&&x.id==="pogo")&&!(re.noMax&&(x.id==="suAmrap"||x.id==="puAmrap"||x.id==="acid")));
    const liftFix=x=>{
      if(!LIFT_IDS.includes(x.id))return x;
      const e=ctx.e1&&ctx.e1[x.id], L=re.lift;
      const txt=L.p?`${L.s} sets × ${L.r} reps @ ${e?rnd5(L.p*e)+" lb":Math.round(L.p*100)+"%"} · re-entry session — log it; it won't move your numbers`
        :L.cap?`${x.sr} · capped at 80%${e?` (${rnd5(.8*e)} lb)`:""} this first week back`:`${x.sr} · ${L.t}`;
      return{...x,sr:txt,re:true};
    };
    const calisFix=x=>re.halfCalis&&(PU_IDS.includes(x.id)||SU_IDS.includes(x.id))?{...x,sr:x.sr+" · HALF the reps this first week back"}:x;
    const bikeFix=x=>re.easyBike&&x.id==="pz"?{id:"z2",sr:BIKE.endurance(30)+" · easy aerobic only this first week back"}:x;
    pm=pm.map(liftFix).map(calisFix).map(bikeFix).filter(x=>!(re.noJumps&&x.id==="pogo"));
    am=am.map(liftFix).map(calisFix).map(bikeFix);
    notes.unshift(re.msg);
    q={...q,reentry:re,impact:(q.impact!=null?q.impact:p.impact)&&am.some(y=>RUNIDS.includes(y.id)||y.id==="pogo"),
      ...(re.noMax&&/RETEST/.test(p.label)?{label:"First Week Back · Full-Body A",retest:false}:{}),
      ...(re.noMax&&/Time Trial|60-Second Maxes/.test(q.label||p.label)?{label:"First Week Back · "+(/Time Trial/.test(q.label||p.label)?"Easy Run":"Upper C"),retest:false,strain:"easy"}:{})};
  }
  if(!notes.length)return p;
  return{...p,...q,am,pm,adjust:notes};
}

function buildDay(week,dow,dTest,ctx){
  const p=missAdapt(week,dow,buildDayRaw(week,dow,dTest,ctx),ctx);
  /* Return-to-run overrides the written run entirely, and every non-impact
     element of the day survives untouched. Jumps come out with it. */
  const rtr=ctx&&ctx.rtr;
  /* v6.2: "alternate days only" is enforced — on the ladder the Friday run
     (Weeks 8–10) comes out, so Fri and Sat are never back-to-back stages. */
  if(rtr&&!p.rest&&!p.pre&&isNew(week)&&dow===4&&p.am.some(x=>RUNIDS.includes(x.id)))
    return{...p,am:p.am.filter(x=>!RUNIDS.includes(x.id)&&x.id!=="pogo"),pm:p.pm.filter(x=>x.id!=="pogo"),impact:false,strain:"easy",label:"Return-To-Run · Off Day"};
  if(rtr&&!p.rest&&!p.pre){
    const i=p.am.findIndex(x=>RUNIDS.includes(x.id));
    if(i>=0){
      const st=RTR[Math.max(0,Math.min(RTR_MAX-1,rtr-1))];
      const am=p.am.filter((x,j)=>(j===i||!RUNIDS.includes(x.id))&&x.id!=="pogo");
      const k=am.findIndex(x=>RUNIDS.includes(x.id));
      am[k]={id:st.s<=3?"walkRun":"easyRun",rm:st.s<=3?4:(st.s===4?8:st.s===5?10:st.s===6?12:st.s===7?15:18),sr:`RTR STAGE ${st.s}/${RTR_MAX} · ${st.n} — ${st.sr}`};
      return{...p,am,pm:p.pm.filter(x=>x.id!=="pogo"),strain:"easy",rtrStage:st.s,label:`Return-To-Run · Stage ${st.s}`};
    }
    return{...p,am:p.am.filter(x=>x.id!=="pogo"),pm:p.pm.filter(x=>x.id!=="pogo")};
  }
  /* Swap the running item for the chosen substitute. The day keeps its shape —
     strength, prehab and the calisthenics lane are untouched — and it stops
     being an impact day, which is the entire point. */
  const sub=ctx&&ctx.sub;
  if(sub&&!p.rest&&!p.pre){
    const i=p.am.findIndex(x=>RUNIDS.includes(x.id));
    if(i>=0){
      const orig=p.am[i];
      /* Every run item carries `rm`, so the substitute reads a real DURATION. */
      let mins=orig.rm||12;
      let hard=["quality","ttRun","speedEnd","strides","t300","check15"].includes(orig.id)||!!orig.hard;
      if(dTest!=null&&dTest<=9)hard=false;          // matches the no-all-out-inside-9-days rule
      if(dTest!=null&&dTest<=2)mins=Math.min(mins,12);
      const swap=subFor(sub,mins,hard,SU_DAYS.includes(dow));
      /* Strip EVERY other impact item too — leaving strides or jumps on a day
         that reports impact:false also suppresses the impact gate. */
      const am=[]; p.am.forEach((x,j)=>{ if(j===i)am.push(swap); else if(!RUNIDS.includes(x.id)&&x.id!=="pogo"&&x.id!=="primer")am.push(x); });
      return{...p,am,pm:p.pm.filter(x=>x.id!=="pogo"),impact:false,strain:hard?"mod":"easy",substituted:sub,label:p.label+" — substituted"};
    }
  }
  return p;
}

function buildDayRaw(week,dow,dTest,ctx){
  const ph=getPhase(week),dl=isDeload(week);
  const out={ph,dl,rest:false,pre:false,impact:false,strain:"easy",am:[],pm:[],pmOff:false,label:"",note:null};
  const rp15=runPaces(ctx&&ctx.run15);
  const e1=(ctx&&ctx.e1)||{};
  const trendClean=!(ctx&&ctx.trend>0);
  const _pm=(ctx&&ctx.puMax)||PU_BASE, _sm=(ctx&&ctx.suMax)||SU_BASE;
  const _acc=calisTaper(dTest)>0&&!(dTest!=null&&dTest<=2);
  const pu=()=>{const x=puFor(_pm,week,dow,dTest);return x?[x]:[];};
  const su=()=>{const x=suFor(_sm,week,dow,dTest);return x?[x]:[];};
  const neck=()=>_acc&&NECK_DAYS.includes(dow)?[{id:"neckEnd"}]:[];
  const hipf=()=>_acc&&HIPF_DAYS.includes(dow)?[{id:"hipFlexTol"}]:[];
  /* PT: shin rehab FIRST, when motor quality is highest, and never after an
     all-out bike sprint. The battery sits out of the last two days before a
     test: nothing is gained on test morning and a loaded tib raise before a
     maximal 300 m is a straightforward mistake. */
  /* v7: from Week 5 the daily battery is gone (his call, and no prevention
     exercise for shin splints has good trial evidence). Run days get the
     3-minute primer instead, placed by each template right before the run. */
  const neu=isV7(week)?[]:((dTest!=null&&dTest<=1)?[]:DAILY_NEURO.map(id=>({id})));
  const foot=isV7(week)?[]:([0,2,4].includes(dow)&&!(dTest!=null&&dTest<=1)?[{id:"shortFoot"}]:[]);

  const boot=(w)=>{const m=bootMin(w),h=dow===1?BOOT_HOURS[w]:null;
    if(!m)return{id:"bootWalk",sr:"Break-in only: wear the boots indoors 30–60 min today, laced as you will on day one. No walking program yet. If you do not own them yet, buy them THIS week."};
    return{id:"bootWalk",bm:m,sr:`${m} min brisk walk in duty boots, any time today${h?` · then wear them ~${h} h (incl. 10 min marching)`:""} · any shin pain tonight or tomorrow morning → repeat last week's time`};};
  const jumps=()=>(!isAcademy(week)&&JUMPS[week]&&jumpDays(week).includes(dow)&&trendClean&&!(dTest!=null&&dTest<=7))
    ?[{id:"pogo",sr:`${JUMPS[week]} · 60 s rest · before the lifting, after the prehab · count every jump as one rep · stop on any shin pain`}]:[];

  if(!inProgram(week,dow))return{...out,rest:true,pre:true,label:"Before Start"};

  /* Sunday is a genuine rest day in every phase — and in the academy it is
     range day. It carries the WEEKLY objective screen in every week: loads
     rise every build week, boots arrive in Week 2, and academy onset is the
     highest-risk month of the year. Tenderness drift is what this catches. */
  if(dow===6&&dTest!==0){
    return{...out,rest:true,label:isAcademy(week)?"Range Day · Checks Only":HEEL_WKS.includes(week)?"Rest + Checks":"Full Rest",
      am:[{id:"tender",sr:isV7(week)?"One minute, both shins: press along the inner edge of the bone. Anything tender, or one sore spot smaller than 2 inches? Open the Shins card on the Today tab.":"Weekly re-measure — compare against your baseline photo. An INCREASE in length is a flare trigger on its own."},
          {id:"slHop",sr:isV7(week)?"10 hops per leg — any pain, open the Shins card on the Today tab":"10 hops per leg — must be pain-free"},
          ...(HEEL_WKS.includes(week)?[{id:"heelTest",sr:isV7(week)?"Single-leg heel raises to fatigue at 30 a minute, each leg — aim for 30+ and the two legs within 10% of each other. Put the numbers in the Baseline Screen on the Records tab.":`Single-leg heel raises to fatigue at 30/min, each leg — target 25–30+ and within 10% side to side by Dec 13. Update the Baseline Screen with the numbers.`}]:[])]};
  }

  /* ── TEST-DATE TAPER OVERLAY ─────────────────────────────────────────── */
  if(dTest!=null&&dTest>=0){
    /* The final assessment has its own 24-day graduation peak (Phase C). */
    const isGradT=ctx&&ctx.gradT&&daysBetween(dateOf(week,dow),ctx.gradT)===dTest;
    if(isAcademy(week)&&dTest<=ACAD_TAPER_WINDOW&&!isGradT){
      /* Weekday mornings belong to the academy — your part is the evening. */
      const acad=dow<=4?[{id:"acadPT",sr:"Academy PT — whatever they run, log it below. It counts."}]:[];
      if(dTest===0)return{...out,label:"TEST DAY",am:[{id:"testday",sr:"Warm-up ~25 min if they allow it, finishing 6–15 min before the start. Then the playbook on the Plan tab."}],pm:[],pmOff:true,impact:true,strain:"high",taper:0};
      if(dTest===1)return{...out,label:"T−1 · Easy Walk Only",am:acad,pm:[{id:"walk",sr:"15–20 min easy walk this evening — move, do not train"}],taper:1};
      if(dTest===2)return{...out,label:"T−2 · Pattern Touch Only",am:acad,pm:[...neu,...pu(),...su()],taper:2};
      if(dTest<=4)return{...out,label:`T−${dTest} · Supplemental Off`,am:acad,pm:[...neu,{id:"recov",sr:BIKE.recovery(20)+" Optional — only if today's academy PT was light."}],taper:dTest};
      const b80=e1.bench?`2 sets × 3 reps @ ${rnd5(0.8*e1.bench)} lb · 2–3 min rest · moderate`:"2 sets × 3 reps at a moderate load · 2–3 min rest";
      return{...out,label:`T−${dTest} · Moderate Only`,am:acad,
        pm:[...neu,{id:"bench",sr:b80+" · no lower-body barbell this week"},{id:"chin",sr:"2 sets × (your best set minus 3) reps · 90 s rest"},{id:"calfSol",sr:"2 sets × 8 reps · 90 s rest · moderate load, nothing heavier"},...pu(),...su()],taper:dTest};
    }
    if(!isAcademy(week)&&dTest<=TAPER_WINDOW){

      const calis=()=>[...su(),...pu()];

      /* THE SCREEN INTERLOCK — substitutes into an early non-impact taper
         day so a maximal 300 m is never run on unscreened shins. */
      const nonImpactSlot=dTest>=10&&[1,3].includes(dow);
      if(!screenDone&&nonImpactSlot){

          am:[...DAILY_NEURO.map(id=>({id})),{id:"tender",sr:"Both tibiae — mark the ends in pen, measure in cm, photograph with a ruler in frame. A documented zero is a baseline."},
              {id:"slHop",sr:"10 hops per leg, rate 0–10. Pain here is itself a red flag."},
              {id:"calfSol",sr:"BASELINE ONLY — single-leg heel raise to failure, straight- and bent-knee, both legs. Primary read is limb symmetry within 10%."},
              ...calis()],
          pm:[],pmOff:true,impact:false,taper:dTest,screenFirst:true};
      }
      if(dTest<=6){
        const t=TAPER_DAYS[dTest];
        const am=t.am.map(x=>RUNIDS.includes(x.id)?{...x,rm:x.rm||(x.id==="strides"?3:10)}:x);
        return{...out,label:t.l,am:t.rest?[...am,...calis()]:lane(am),pm:t.pm,
          pmOff:true,rest:!!t.rest,impact:!!t.impact,strain:t.strain||"easy",taper:dTest};
      }
      const tm=[
        cold
          ?(dTest>=10&&!(ctx&&ctx.recentTT)
            ?{l:"Taper · Pace Calibration",am:[{id:"ttRun",rm:14,sr:"1.5 miles at RPE 7 on a flat measured course, TIMED. This is not a workout — it is the number your race plan is built from."}],pm:[{id:"recov",sr:BIKE.recovery(25)}],impact:true}
            :{l:"Taper · Easy Run",am:[{id:"easyRun",rm:12,sr:"12 min easy — inside 10 days there is no assessment. Build the race plan off your most recent logged 1.5 and state the error bar out loud."}],pm:[{id:"recov",sr:BIKE.recovery(25)}],impact:true})
          :{l:"Taper · Short Quality",am:[{id:"quality",rm:14,sr:`14 min of running: 5 min easy → 3 × 90 s at ${rp15.repMi} (2 min walk between, on top) → easy to 14. Calibration, not a workout.`}],pm:[{id:"recov",sr:BIKE.recovery(25)}],impact:true},
        {l:"Taper · Strength Maintenance",am:[{id:"squat",sr:"2 top sets, MODERATE — no failure work, no new movements"},{id:"calfSol"},{id:"hipAbdL"}],pm:[],off:true},
        {l:"Taper · Easy + Strides",am:[{id:"easyRun",rm:12,sr:"12 min of running, ONE session: ~10 min easy, then 4 × 60 m at ~85% on grass with full walk-back — the sprint-preparation dose"}],pm:[{id:"recov",sr:BIKE.recovery(25)}],impact:true},
        {l:"Taper · Upper Maintenance",am:[{id:"bench",sr:"2 top sets, MODERATE"},{id:"row"},{id:"carry"}],pm:[],off:true},
        {l:"Taper · Easy Spin",am:[{id:"recov",sr:BIKE.recovery(30)}],pm:[],off:true},
        {l:"Taper · Easy + Goal-Pace Block",am:[{id:"easyRun",rm:14,sr:`14 min easy continuous with ONE 3-minute block at ${rp15.repMi} mid-run. NOT a time trial`}],pm:[{id:"recov",sr:BIKE.recovery(25)}],impact:true},
        {l:"Full Rest",am:[],pm:[],rest:true},
      ][dow];
      return{...out,label:tm.l,am:tm.rest?[]:lane(tm.am),
        pm:tm.pm||[],pmOff:!!tm.off,rest:!!tm.rest,impact:!!tm.impact,taper:dTest};
    }
  }

  /* ── PHASE B · MOCK + ARRIVAL (wks 11–12, Dec 21 – Jan 3) ──────────────
     v7. The mock PFT (Tue 22 Dec) gets a short, real taper — a pre-test
     taper is the one kind of easy week with evidence behind it (Bosquet
     2007): Monday is a 6-minute jog and nothing else, and there is no
     pressing inside 24 h of a push-up max. After it RUNNING VOLUME HOLDS
     (58, then 60 min, all easy), because a collapsed running base is how
     academy week one becomes a spike. Lifting no longer halves for a
     fortnight: it runs at about two-thirds volume with nothing to failure
     and stops after Thu 31 Dec. Full day in boots: Sat 26 Dec. 26 min on
     the road: Sat 2 Jan. */
  if(isTaperWk(week)){
    const jr=()=>(JUMPS[week]&&jumpDays(week).includes(dow)&&trendClean&&!(dTest!=null&&dTest<=7))
      ?[{id:"pogo",sr:`${JUMPS[week]} · 60 s rest · count every jump as one rep (jacks as half) · stop on any shin pain`}]:[];
    const easyZ=(m,cue)=>({id:"z2",sr:`${m} min easy on the bike or rower · heart rate ${hrz(0.60,0.70).replace("HR ","")}${cue?" · "+cue:""}`});
    const W11=[
      {l:"Easy Day Before The Mock",am:[...primer,{id:"easyRun",rm:6,sr:"6 min easy jog with 3 relaxed strides at the end. Nothing else today — no pressing, no push-ups, no sit-ups."}],pm:[],off:true,impact:true},
      {l:"MOCK PFT · Full Test Order",am:[{id:"testday",sr:"~25 min warm-up (8–10 min easy jog, drills, a few builds), finishing 6–15 min before the first event"},

        {id:"t300",rm:2,sr:"Event 2 · 300 m FULL EFFORT, 5+ min after the sit-ups · through 200 m in ~36 s, then hold form · target 56 s or better"},
        {id:"puAmrap",sr:"Event 3 · 60 s ALL OUT, 5+ min after the 300 · target 37 · log total + 15 s splits"},
        {id:"ttRun",rm:22,sr:`Event 4 · 1.5 mi FULL EFFORT, 5+ min after the push-ups · outdoors, as the academy runs it · check your watch at the half-mile: aim for ${mmss(rp15.next/3)} (${rp15.repMi.replace("/mi","/mile")}, the pace you've been training) · on pace at the mile? empty the tank · target 12:30 or better, stretch 12:15`}],
        pm:[],off:true,impact:true,strain:"high",mock:true},
      {l:"Recovery · Spin + Boots",am:[],pm:[{id:"recov",sr:BIKE.recovery(25)},{id:"bootWalk",bm:30,sr:"30 min easy walk in duty boots, then keep them on for ~2–3 h — the bridge to Saturday's long day, so it is not a jump from nothing."}]},
      {l:"Easy Run + Upper A + Light Lower",am:[...primer,{id:"easyRun",rm:8,sr:"8 min run on grass: 7 min easy jog, then 3 × 20 s relaxed strides, walk back between"},...jr()],
       pm:[...upper7("A",e1,vol),...lowerA7(e1,vol).slice(0,2),easyZ(30,"spin the legs out")],impact:true},
      {l:"Christmas · Nothing Required",am:[{id:"walk",sr:"Optional 20–40 min walk. That is the whole list."}],pm:[],off:true},
      {l:"Easy Run + Full Day In Boots + Upper B",am:[...primer,{id:"longRun",rm:20,sr:"20 min easy on grass or the TrueForm — NOT the road: four days after a max 1.5 and on the same day as six hours in boots, the surface is the one load you can take out"},easyZ(30,"straight off the run"),{id:"bootWalk",sr:"LONG DAY IN BOOTS — the rehearsal: wear them INSTEAD of your normal shoes for ~6 h after the run (standing, errands, 10 min marching at ~120 steps/min, stairs). It is here, not on Jan 2, so a sore spot has a week to settle."}],

      {l:"PT Simulation + Easy Run + Upper B",am:[...primer,{id:"ptSim",sr:"Push-ups 60 (4 × 15) · ab work 60 (20 sit-ups + 40 flutter-kick four-counts) · 40 jumping jacks · 10 step-back burpees · to a called cadence, then walk 3 min and go straight into the run"},{id:"easyRun",rm:12,sr:"12 min run on grass: easy, with 4 × 20 s relaxed strides at the end, walk back between"}],
       pm:[...upper7("B",e1,vol),{id:"bootWalk",sr:"Wear the duty boots ~3 h today (standing, errands) — day 2 of 3 in a row"}],impact:true},
      {l:"Easy Run + Upper C · Last Lifting Before Day One",am:[...primer,{id:"easyRun",rm:10,sr:"10 min easy jog"},...(trendClean?[{id:"pogo",sr:"2 sets × 15 pogo hops · 60 s rest · stop on any shin pain"}]:[])],
       pm:[...upper7("C",e1,vol),easyZ(30),{id:"bootWalk",sr:"Wear the duty boots ~3 h today (standing, errands) — day 3 of 3 in a row. The academy is five days running; this is the rehearsal for the next-day recovery."}],impact:true},

      {l:"Formation Rehearsal · 26 Min On The Road",impact:true,am:[...primer,{id:"longRun",rm:26,sr:"26 min on the road in your academy PT shoes, starting at 07:30 (academy start time): 16 min easy, then 10 min at 10:30–11:00/mile, at least 10 min of it in step behind a partner, holding their stride · if your shins have flagged anything this week, run 22 min easy on grass instead"},easyZ(30,"straight off the run")],
       pm:[{id:"bootWalk",sr:"Up to 3 h in the boots, no more. The long-day rehearsal was Dec 26 — today is not the day to add load."}]},
    ];
    const m=(week===11?W11:W12)[dow];
    return{...out,label:m.l,am:m.am,pm:m.pm,pmOff:!!m.off||!m.pm.length,impact:!!m.impact,strain:m.strain||"easy",mock:!!m.mock};
  }

  /* ── PHASE C · ACADEMY (v7) ────────────────────────────────────────────
     Mon–Fri the academy owns the day; his own work is the evening and
     Saturday. The state syllabus gives fitness 72 hours across the whole
     academy — about 3 hours a week — so this is what holds and raises the
     standards. It is small on purpose: fitness holds on far less training
     as long as the intensity stays up (Spiering 2021).
       Day AFTER academy PT   upper body, A then B               ~40 min
       A PT-free evening      the hard bike, 4 × 4 min           35–40 min
       PT-day evening         calf raises, an optional easy ride 0–30 min
       Saturday               own run inside the cap, then squat or deadlift
                              (alternating weeks) and soleus     ~70 min
       Sunday                 range · weekly check
     First two weeks: two sets per exercise, one easy ride, no own running.
     Every second Saturday (even weeks from 16): a 60-second max of sit-ups

     Light weeks (16, 20, 24, 28): his own RUNNING halves and is all easy;

  if(isAcademy(week)){

    const isPT=pt.includes(dow);
    const wk=x=>({...out,academy:true,am:x.am||(isPT?[acadPT]:[]),pm:x.pm||[],label:x.l,pmOff:!(x.pm&&x.pm.length),impact:!!x.impact,strain:x.strain||"easy",mock:!!x.mock,retest:!!x.retest});
    const easyZ=(mn,cue)=>({id:"z2",sr:`${mn} min easy on the bike or rower · heart rate ${hrz(0.60,0.70).replace("HR ","")}${cue?" · "+cue:""}`});
    const calves={id:"calfStr",sr:"2 sets × 12–15 reps · 60 s rest · bodyweight or light, slow lowering · after a heavy academy day (hard PT plus an hour on the mats) this is the whole evening"};

    /* ── Which evening gets what, from the PT days he set ── */
    const freeWd=[0,1,2,3,4].filter(d=>!pt.includes(d));
    const afterDays=freeWd.filter(d=>dayTypeOf(d,pt)==="after");
    const liftDays=[...afterDays,...freeWd.filter(d=>!afterDays.includes(d))].slice(0,2).sort((a,b)=>a-b);
    const restWd=freeWd.filter(d=>!liftDays.includes(d));

    /* ── GRADUATION PEAK (T = final assessment; default Tue 1 Jun 2027). The
       academy's PT runs regardless — only HIS work tapers. Volume −40% then
       −60%, intensity and frequency held, no max inside 10 days (Bosquet
       2007). ── */
    const gT=(ctx&&ctx.gradT)||parseISO(GRAD_T_DEFAULT);
    const dG=daysBetween(dateOf(week,dow),gT);
    if(dG>=0&&dG<=24&&dow<6){
      const rep=rp15.repMi;
      const G={
        24:{l:"MOCK PFT · Full Test Order",strain:"high",impact:true,mock:true,am:[{id:"testday",sr:"~25 min warm-up, finishing 6–15 min before the first event"},{id:"suAmrap",sr:"Event 1 · 60 s ALL OUT · target 48 · log total + 15 s splits"},{id:"t300",rm:2,sr:"Event 2 · 300 m FULL EFFORT, 5+ min after the sit-ups · target 55 s or better"},{id:"puAmrap",sr:"Event 3 · 60 s ALL OUT, 5+ min after the 300 · target 43 · log total + 15 s splits"},{id:"ttRun",rm:13,sr:`Event 4 · 1.5 mi FULL EFFORT, 5+ min after the push-ups · half-mile split at goal pace (${rep}) · target 12:00 or better`}]},

    }

    /* ── 4–5 PT days a week: the academy IS the program. No running or
       hard riding of his own; one upper session on the first free evening,
       the rest on Saturday. ── */
    if(tpl==="4"){
      const firstFree=[0,1,2,3,4].find(d=>!pt.includes(d));
      if(dow===5)return wk({l:"Saturday · Upper B + Lower + Easy Bike",am:[...upper7("B",e1,"lite"),{id:"squat",sr:liftSr7("squat",e1,"lite")},{id:"calfSol",sr:sol7(e1,2)},easyZ(30)]});
      if(isPT)return wk({l:"Academy PT Day",pm:[calves]});
      if(dow===firstFree)return wk({l:"Upper A",pm:[...upper7("A",e1,"lite"),{id:"puIso",sr:`1 set × ${r(.7)} reps at ${pc} a minute`},{id:"suIso",sr:`1 set × ${Math.round(.75*sm)} reps at ${sc} a minute`}]});

    }

    /* The hard bike takes a PT-free evening that is not a lifting day:
       one touching no PT day if there is one, and Friday only as a last

    const bikeDay=restWd.length?[...restWd].sort((a,b)=>((dayTypeOf(a,pt)==="free"?0:1)+(a===4?2:0))-((dayTypeOf(b,pt)==="free"?0:1)+(b===4?2:0)))[0]:null;
    const skipNote="skip it in a week the academy gave you 150+ push-ups";

    if(dow===5){

      let main, ran=false;

  /* ── PHASE A · BUILD (wks 1–10) ───────────────────────────────────────── */

    const d7=[
      {l:quality?"Goal-Pace Run + Upper A":"Easy Run + Upper A",impact:true,strain:quality?"mod":null,

      {l:`${b7.tue[0]} + Lower A`,strain:"mod",
       am:[{id:"pz",sr:b7.tue[1]}],pm:[...lowerA7(e1,vol),...drag,...(bootDays(week).includes(1)?[boot(week)]:[])]},
      {l:ptSim?"PT Simulation + Easy Run + Upper B":"Easy Run + Upper B",impact:true,
       am:[...primer,...(ptSim?[ptSim]:[]),wed,...jump(2)],pm:[...upper7("B",e1,vol),...(ptSim?[]:calis7("wed",week,m,sm))]},
      {l:`${b7.thu[0]} + Lower B`,strain:"mod",
       am:[{id:"pz",sr:b7.thu[1]}],pm:[...lowerB7(e1,vol)]},
      {l:friMax?"60-Second Maxes + Upper C":"Pace Sets + Upper C",impact:!!rp.fri,strain:friMax?"mod":null,retest:friMax,
       am:[...friRun,...calis7(friMax?"fri":"pace",week,m,sm)],
       pm:[...upper7("C",e1,vol),...(b7.fri?[{id:"z2",sr:`${b7.fri} min easy ride · heart rate ${zone2}`}]:[]),...(bootDays(week).includes(4)?[boot(week)]:[])]},

  }

  const retest=isRetestMon(week,dow);
  const sim=retest&&calisTaper(dTest)>0&&!(dTest!=null&&dTest<=10);
  /* Goal-pace work buys CALIBRATION and economy at the next-step pace, not
     mileage: short reps, walk recoveries, on a track. Written so the minutes
     ADD UP: 5 easy + reps + 3 easy = the Monday running. */
  const gp=GP_REPS[week];
  const repTxt=gp?`${gp[0]} × ${gp[1]===1.5?"90 s":gp[1]+" min"}`:"";
  /* v6.2: Week 9's AMRAP Monday keeps its goal-pace run (10 min after the

  const mon=dl||(retest&&week!==8)||!gp
    ?{id:"easyRun",rm:rp.mon,sr:`${rp.mon} min easy jog on grass or track, at a pace you could talk at${retest?" — after the tests, nothing hard":""}.${cadNote(week,0)}`}
    :{id:"quality",rm:rp.mon,sr:`${rp.mon} min run on a track${retest?", 10 min after the push-ups":""}: 5 min easy · ${repTxt} at ${rp15.repMi.replace("/mi","/mile")}, walk ${GP_WALK[week]||"the same time"} after each (walking doesn't count) · ${Math.round(rp.mon-5-gp[0]*gp[1])} min easy.${cadNote(week,0)}`};
  /* ONE Wednesday run, written as ONE item with its parts in order. */
  const sp=SPEED[week];
  const fast=/×\s*(100|150|200|250)\s*m/.test(sp||"");
  const speedOK=!!sp&&!dl&&(trendClean||!fast);
  const spTxt=speedOK?sp.replace(/\s*—\s*ONLY if.*$/,""):(dl?null:"4 × 20 s fast-but-relaxed strides on grass, walk back between (the speed-endurance reps are OFF this week: the last 7 days were not pain-free)");
  const repSec=spTxt?(speedOK?(SPEED_SEC[week]||80):80):0;
  const easyT=mmss(rp.wed*60-repSec);
  const wedItem={id:"wedRun",rm:rp.wed,hard:speedOK&&fast,
    sr:`${rp.wed} min run on grass or track: about ${Math.round(rp.wed-repSec/60)} min easy jog${spTxt?`, then ${spTxt} (walking back doesn't count toward the ${rp.wed})`:" — deload week, no speed"}.${cadNote(week,2)}`};
  /* v6.2 (running review): Week 6 is a true TIME TRIAL — "hard but
     controlled" under-read his fitness and then set every pace from it. */
  const satItem=week===RUN15_CHECK_WK&&trendClean
    ?{id:"check15",rm:rp.sat,sr:isNew(week)
      ?`${rp.sat} min of running, ONE session: ~6 min easy warm-up jog with 3 strides, then a 1.5-mile TIME TRIAL on a track or flat measured course — even pace, first 400 m in 2:08–2:10, then empty the tank over the last 400. Target ≤12:55 (red line: slower than 13:05). Log the time AND your peak heart rate in Records: every interval pace updates from it.`
      :`${rp.sat} min of running, ONE session: ~7 min easy warm-up jog with 3 strides, then 1.5 miles hard but controlled — not a race — on a track or flat measured course, even pace, starting near ${rp15.curMi.replace("/mi","/mile")}. Log the time in Records: your interval paces update from it.`}
    :FORMATION[week]
      ?(()=>{const a=Math.min(ASPHALT[week]||0,rp.sat),f=FORMATION[week];
        /* Asphalt is the LAST part of the run so the formation-pace finish is
           on the formation surface — v6.1 draft put them at opposite ends. */
        return{id:"longRun",rm:rp.sat,sr:`${rp.sat} min continuous: ${a>=rp.sat?`all on asphalt — easy for ${rp.sat-f} min`:`${rp.sat-a} min easy on grass or track, then ${a} min on asphalt — easy at first`}, and the last ${f} min STEADY at ~10:00/mile (a typical formation-run pace: comfortably hard, not a race). Only if this morning's first steps were pain-free — otherwise run it all easy on grass.${cadNote(week,5)}`};})()
      :{id:"longRun",rm:rp.sat,sr:`${rp.sat} min continuous, easy · surface: ${surfaceOf(week,rp.sat)}${week===RUN15_CHECK_WK?" (the 1.5-mile check is OFF — the last 7 days were not pain-free)":""}.${cadNote(week,5)}`};
  const friRun=rp.fri?{id:"easyRun",rm:rp.fri,sr:`${rp.fri} min easy jog on grass or track ONLY (tomorrow is the long run on the road) — gets your legs used to back-to-back days.${cadNote(week,4)}`}:null;
  const bikeHardPM=()=>({id:"pz",sr:bikeHard(week,45)});
  /* A deload ride is never longer than the shortest build ride — the
     duration rotation once handed a deload week its longest rides. */
  const ride=(d,base)=>dl?25:bikePM(week,d,base);
  /* Durability: small doses of what the academy will ask for — getting up
     off the ground, grip, carries, a short bodyweight circuit, and from
     Week 8 a generic drag + shuttle for the (unpublished) obstacle course.
     Never a second program: two items, rotating. */
  /* ── v6.2 PHASE A, WEEKS 5–10 (head-coach review) ─────────────────────
     Two full-body barbell days instead of four: the same four lifts, each
     still once a week at the same %e1RM, so barbell volume does not jump —
     but Mon–Thu stop being four hard leg days in a row. Hard days hard
     (Mon, Thu), Tue and Fri easy single blocks.
       Mon  AM goal-pace run · PM jumps + wall prep → squat + bench + chins → PU/SU
       Tue  PM heavy soleus, hips, steady row, obstacle block, boots
       Wed  AM (PT simulation Wks 8–10 →) short run + speed → jumps · PM Z2 bike, PU/SU
       Thu  AM hard bike · PM deadlift + OHP + single-leg/calf work
       Fri  (Wk 8+ AM short run) · PM row, chins, PU/SU, durability, shoulder care, boots
       Sat  long run (Week 6: 1.5-mile time trial)
     Caps: 280 push-ups / 160 anchored sit-ups a week. */
  if(isNew(week)){
    const m=_pm, sm=_sm, pc=puCad(week), sc=suCad(week);
    const r=f=>Math.max(6,Math.min(Math.floor(0.7*m),Math.round(f*m))), rs=f=>Math.max(6,Math.round(f*sm));
    const holdP=Math.max(10,m-8), holdS=Math.max(10,sm-8);
    const PU={
      4:{mon:setLine(5,r(.60),"60 s","after the bench"),wed:`2 sets × 30 s at ${pc}/min (≈${Math.round(pc/2)} reps) · 2 min rest · if you need a rest, lock out 2 s at rep ${holdP}`,fri:"1 ladder: 2-4-6-8-10-8-6-4-2 (50 reps) · rest as long as the last set took"},
      5:{mon:setLine(5,r(.65),"50 s","after the bench"),wed:`2 sets × 40 s at ${pc}/min (≈${Math.round(pc*2/3)} reps) · 2 min rest · planned 2 s lockout rest at rep ${holdP}`,fri:setLine(6,r(.55),"45 s")},
      6:{wed:`1 set × 30 s at ${pc}/min (≈${Math.round(pc/2)} reps) · easy week`,fri:setLine(4,r(.50),"45 s","easy week")},
      7:{mon:setLine(5,r(.65),"45 s","after the bench"),fri:"1 ladder: 2-4-6-8-10-12-10-8-6-4-2 (72 reps) · rest as long as the last set took"},

/* Weekly bike + rower minutes, surfaced rather than implicit — a 260 min/wk
   week once got built without anyone noticing. Target ~130–170 while
   running normally; higher is legitimate when impact is suspended. */
function weekBikeMin(week,ctx){
  let t=0;
  for(let d=0;d<7;d++){
    const p=buildDay(week,d,ctx&&ctx.dtf?ctx.dtf(week,d):null,{...(ctx||{}),sub:null});
    [...p.am,...p.pm].forEach(x=>{
      if(["z2","pz","rowErg","recov"].includes(x.id)){
        const m=/^(\d+) min/.exec(x.sr||""); if(m)t+=+m[1];
      }
    });
  }
  return t;
}
/* One week, counted the way the audits count it. Used by the Plan tab and
   by the verification sweep (window.__blp.weekSummary), so the table and
   the UI cannot disagree. */
function weekSummary(week,ctx){
  const s={own:0,acad:0,total:0,bike:0,strength:0,pu:0,su:0,prehab:0,boot:0,runDays:0};
  for(let d=0;d<7;d++){
    const p=buildDay(week,d,ctx&&ctx.dtf?ctx.dtf(week,d):null,{...(ctx||{}),sub:null});
    const items=[...p.am,...p.pm];
    const rm=items.reduce((a,x)=>a+(RUNIDS.includes(x.id)?(x.rm||0):0),0);
    s.own+=rm; if(rm>0)s.runDays++;
    if(items.some(x=>STRENGTH_IDS.includes(x.id)))s.strength++;
    if(items.some(x=>PU_IDS.includes(x.id)))s.pu++;
    if(items.some(x=>SU_IDS.includes(x.id)))s.su++;
    if(items.some(x=>x.id==="tibRaise"||x.id==="primer"))s.prehab++;
    /* Boot minutes come from the item's own field, not parsed from its text —
       parsing broke silently the first time the wording changed. */
    items.forEach(x=>{if(x.id==="bootWalk"&&x.bm)s.boot+=x.bm;});
  }
  s.bike=weekBikeMin(week,ctx);
  if(isAcademy(week)){
    const ap=ctx&&ctx.acadPlan&&ctx.acadPlan[week];
    s.acad=ap?(ap.acadLogged!=null?Math.max(ap.acadLogged,ap.acadExp):ap.acadExp):ACAD_ASSUME_DEFAULT;
  }
  s.total=s.own+s.acad;
  return s;
}
/* Own running minutes for every pre-academy week — the input the academy
   room calculation needs for its first comparisons. */
function ownTotalsPre(ctx){const o={};for(let w=1;w<ACADEMY_WK;w++)o[w]=weekSummary(w,{...(ctx||{}),acadPlan:null}).own;return o;}

const B=(w,d)=>`${w}-${d}`;
/* Keys are positional, not id-based, so changing a dose does not orphan a
   day's existing check-offs. */
function trackKeys(week,dow,dTest,ctx){
  const p=buildDay(week,dow,dTest,ctx);
  if(p.pre)return{am:[],pm:[],all:[],pre:true};
  /* A rest day may still carry tracked MEASUREMENTS (Sunday's screen). */
  if(p.rest&&!p.am.length&&!p.pm.length)return{am:[],pm:[],all:[]};
  const b=B(week,dow);
  const am=p.am.map((_,i)=>`${b}-am-${i}`);
  const pm=p.pm.map((_,i)=>`${b}-pm-${i}`);
  return{am,pm,all:[...am,...pm]};
}
