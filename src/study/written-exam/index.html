oon at a small florist, a woman asked the only clerk to help her at the back of the shop; register cash was later found missing.","On a Tuesday morning at a pharmacy, a woman asked the only clerk for directions to the post office and then left; nothing was missing."],"answer":2,"fixed":false,"explanation":"The florist report matches every feature of the series: a Saturday afternoon, a shop with one employee, a woman drawing that employee away, and missing register cash. The supermarket and gift shop reports share only the day or the cash, and in the Tuesday pharmacy report the clerk was not drawn away and nothing was taken."},{"id":"rs-041","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":"stim-rs-07","stem":"Based on the pattern in most of the reports, which business is most likely to be targeted next?","choices":["A large department store with many cashiers working on a Saturday afternoon","A small shop with one employee working on a Saturday afternoon","A small shop that is closed and locked on a Wednesday night","A bank branch with several tellers working on a Monday morning"],"answer":1,"fixed":false,"explanation":"The repeated method depends on a business being open with only one employee, who can be drawn away from the register, and every such theft happened on a Saturday afternoon. Businesses with several employees on duty, or closed businesses, do not fit that method."},{"id":"rs-042","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":null,"stem":"Which number comes next in the series?\n3, 7, 11, 15, 19, ?","choices":["21","22","23","24"],"answer":2,"fixed":true,"explanation":"Each number is 4 more than the one before it, so the next number is 19 + 4 = 23."},{"id":"rs-043","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":null,"stem":"Which number comes next in the series?\n2, 6, 18, 54, ?","choices":["72","108","162","216"],"answer":2,"fixed":true,"explanation":"Each number is 3 times the one before it, so the next number is 54 x 3 = 162."},{"id":"rs-044","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"Which number comes next in the series?\n5, 6, 8, 11, 15, 20, ?","choices":["25","26","27","30"],"answer":1,"fixed":true,"explanation":"The amount added grows by one each step: +1, +2, +3, +4, +5. The next step is +6, and 20 + 6 = 26."},{"id":"rs-045","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":3,"stimulus":null,"stem":"Which number comes next in the series?\n80, 77, 71, 62, 50, ?","choices":["32","35","38","41"],"answer":1,"fixed":true,"explanation":"The amount subtracted grows by 3 each step: 3, 6, 9, 12. The next step subtracts 15, and 50 - 15 = 35."},{"id":"rs-046","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"Which number comes next in the series?\n4, 9, 7, 12, 10, 15, ?","choices":["12","13","17","20"],"answer":1,"fixed":true,"explanation":"The series alternates between adding 5 and subtracting 2: 4, 9, 7, 12, 10, 15. After adding 5 to reach 15, the next step subtracts 2, giving 13."},{"id":"rs-047","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":null,"stem":"Which letter comes next in the series?\nB, E, H, K, N, ?","choices":["P","Q","R","S"],"answer":1,"fixed":true,"explanation":"Each letter is three letters after the one before it (two letters are skipped each time). Three letters after N is Q."},{"id":"rs-048","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":3,"stimulus":null,"stem":"Which letter comes next in the series?\nZ, X, U, Q, ?","choices":["L","M","N","O"],"answer":0,"fixed":true,"explanation":"The series moves backward through the alphabet by 2 letters, then 3, then 4, so the next step is back 5 letters. Five letters before Q is L."},{"id":"rs-049","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"Which letter pair comes next in the series?\nAZ, CX, EV, GT, ?","choices":["HS","IQ","IR","JR"],"answer":2,"fixed":true,"explanation":"The first letters move forward two at a time (A, C, E, G, I) and the second letters move backward two at a time (Z, X, V, T, R). The next pair is IR."},{"id":"rs-050","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":null,"stem":"The last five badge numbers issued by the Orrin Borough Police Department were 4107, 4114, 4121, 4128 and 4135. If the pattern continues, which badge number will be issued next?","choices":["4142","4143","4145","4149"],"answer":0,"fixed":true,"explanation":"Each badge number is 7 higher than the one before it, so the next number is 4135 + 7 = 4142."},{"id":"rs-051","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"A records clerk notices that four case numbers in a row follow a pattern: 24-B-0116, 24-C-0232, 24-D-0348, 24-E-0464. If the pattern continues, what is the next case number?","choices":["24-F-0580","24-F-0570","24-G-0580","24-E-0580"],"answer":0,"fixed":false,"explanation":"The middle letter moves forward one letter each time (B, C, D, E, then F) and the final number rises by 116 each time (0116, 0232, 0348, 0464, then 0580). The next case number is 24-F-0580."},{"id":"rs-052","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"Which comes next in the series?\nA3, D6, G12, J24, ?","choices":["M36","N48","M48","L36"],"answer":2,"fixed":false,"explanation":"The letters move forward three at a time (A, D, G, J, M) and the numbers double each time (3, 6, 12, 24, 48). The next term is M48."},{"id":"rs-053","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":3,"stimulus":null,"stem":"Which number comes next in the series?\n1, 20, 3, 17, 5, 14, 7, ?","choices":["8","9","10","11"],"answer":3,"fixed":true,"explanation":"Two series are interleaved. The numbers in the odd positions rise by 2 (1, 3, 5, 7) and the numbers in the even positions fall by 3 (20, 17, 14). The missing number is in the falling series: 14 - 3 = 11."},{"id":"rs-054","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":null,"stem":"Which word does not belong with the other three: North, East, Left, South?","choices":["North","East","Left","South"],"answer":2,"fixed":false,"explanation":"North, East and South are compass directions, which stay the same no matter which way a person is facing. Left depends on which way the person is facing."},{"id":"rs-055","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"Which number does not belong with the other three: 14, 21, 35, 40?","choices":["14","21","35","40"],"answer":3,"fixed":true,"explanation":"14, 21 and 35 are all multiples of 7 (7 x 2, 7 x 3 and 7 x 5). 40 cannot be divided evenly by 7."},{"id":"rs-056","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"Which letter group does not follow the same pattern as the other three: ACE, GIK, MOQ, SUV?","choices":["SUV","ACE","GIK","MOQ"],"answer":0,"fixed":false,"explanation":"In ACE, GIK and MOQ, each letter skips one letter of the alphabet to reach the next. SUV breaks the pattern because V comes directly after U; the matching group would be SUW."},{"id":"rs-057","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"Three of these four theft reports share the same key feature. Which report does not belong with the others?","choices":["A wallet was taken from a car that had been left unlocked.","A toolbox was taken from a pickup truck that had been left unlocked.","A phone was taken from a van that had been left unlocked.","A radio was taken from an SUV after a side window was broken."],"answer":3,"fixed":false,"explanation":"Three of the thefts were from vehicles that had been left unlocked, so no force was needed to get in. The SUV theft is the only one in which the thief had to break in."},{"id":"rs-058","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"Which number pair does not follow the same rule as the other three: 3-9, 5-15, 6-16, 8-24?","choices":["6-16","3-9","5-15","8-24"],"answer":0,"fixed":false,"explanation":"In three pairs the second number is 3 times the first (3 x 3 = 9, 5 x 3 = 15, 8 x 3 = 24). In 6-16 it is not, since 6 x 3 = 18."},{"id":"rs-059","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":null,"stem":"Which code does not follow the same pattern as the other three: K7K, M4M, R2T, P9P?","choices":["R2T","K7K","M4M","P9P"],"answer":0,"fixed":false,"explanation":"In K7K, M4M and P9P the first and last letters are the same. R2T begins and ends with different letters."},{"id":"rs-060","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":null,"stem":"An officer is listing ways to describe a person. Which item does not belong with the other three: Scar, Tattoo, Birthmark, Jacket?","choices":["Scar","Tattoo","Birthmark","Jacket"],"answer":3,"fixed":false,"explanation":"A scar, a tattoo and a birthmark are all marks on a person's body. A jacket is clothing that can be taken off or changed."},{"id":"rs-061","section":"reasoning","subtype":"problem-sensitivity","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":"stim-rs-08","stem":"Whose description of the man's appearance is inconsistent with the other witnesses' descriptions?","choices":["Ms. Aguilar","Mr. Sandhu","Mr. Diallo","Ms. Whitaker"],"answer":2,"fixed":false,"explanation":"Ms. Aguilar, Mr. Sandhu and Ms. Whitaker all describe the man as tall, while Mr. Diallo describes him as short. All four agree on the red hooded sweatshirt."},{"id":"rs-062","section":"reasoning","subtype":"problem-sensitivity","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":"stim-rs-08","stem":"Which of the following statements conflicts with what another witness said?","choices":["Ms. Aguilar's statement that the man ran out the front door","Mr. Sandhu's statement that he was the only customer in the store","Ms. Whitaker's statement that she could not see which way the man turned","Mr. Diallo's statement that the man ran toward the parking garage"],"answer":1,"fixed":false,"explanation":"Ms. Whitaker says she was a customer at the back of the store, which conflicts with Mr. Sandhu's claim that he was the only customer. The front door and the turn toward the garage are each supported by more than one witness, and no one contradicts Ms. Whitaker's limited view."},{"id":"rs-063","section":"reasoning","subtype":"problem-sensitivity","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":"stim-rs-08","stem":"Ms. Aguilar is interviewed again the next day. Which of the following new statements would conflict with her original statement?","choices":["\"I was in the stockroom and did not see him leave.\"","\"He was at least a head taller than I am.\"","\"The hood of his sweatshirt was up the whole time.\"","\"I had not seen him in the store before that day.\""],"answer":0,"fixed":false,"explanation":"Ms. Aguilar originally described the man grabbing the tablet, running out the front door and turning right, which she could not have seen from the stockroom. The other statements add detail without contradicting anything she said the first time."},{"id":"rs-064","section":"reasoning","subtype":"problem-sensitivity","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":null,"stem":"At 3:00 a.m., Officer Lena Fischer drives past a row of businesses in Pine Hollow Borough. Her briefing sheet says the bakery's staff start work at 2:30 a.m., the grocery store is open 24 hours, and the jewelry store closes at 6:00 p.m. Which observation most strongly suggests that something is wrong and should be looked into?","choices":["The lights are on in the bakery's kitchen.","A delivery truck is being unloaded at the grocery store.","The jewelry store's front door is standing partly open.","A bakery worker is carrying trash bags out of the bakery's back door."],"answer":2,"fixed":false,"explanation":"The jewelry store closed nine hours earlier, so an open front door at 3:00 a.m. has no normal explanation. The bakery and grocery store are both expected to be active at that hour according to the briefing sheet."},{"id":"rs-065","section":"reasoning","subtype":"problem-sensitivity","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":null,"stem":"During a traffic stop in Marlow Township, a driver tells Officer Tomas Varga, \"I have been driving for three hours straight from Garnet Lake. I have not stopped anywhere.\" Which observation is inconsistent with the driver's statement?","choices":["A diner receipt on the dashboard is time-stamped 25 minutes ago.","A road map of the Garnet Lake area is lying on the passenger seat.","The car has a Garnet Lake parking permit on its windshield.","The driver says he is tired and wants to get home soon."],"answer":0,"fixed":false,"explanation":"A diner receipt from 25 minutes ago indicates a recent stop, which conflicts with the claim of three hours of driving without stopping. The map, the parking permit and the driver's tiredness all fit a long drive from Garnet Lake."},{"id":"rs-066","section":"reasoning","subtype":"problem-sensitivity","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"Sergeant Amara Nwosu reviews an incident report that lists these times: call dispatched at 10:42 p.m.; officer arrived at 10:35 p.m.; officer began interviewing the caller at 10:50 p.m.; officer cleared the scene at 11:20 p.m. Which detail should Sergeant Nwosu question as a likely error?","choices":["The interview began 8 minutes after the call was dispatched.","The officer cleared the scene 30 minutes after the interview began.","The officer was still at the scene after 11:00 p.m.","The arrival time is earlier than the dispatch time."],"answer":3,"fixed":false,"explanation":"An officer cannot arrive at 10:35 p.m. in response to a call that was not dispatched until 10:42 p.m., so one of those two times must be wrong. The other times follow one another in a possible order."},{"id":"rs-067","section":"reasoning","subtype":"problem-sensitivity","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"Ms. Okafor tells Officer Ben Hartley that someone broke into her locked backyard shed overnight and stole her bicycle. Officer Hartley notes four facts. Which fact most strongly suggests that her account needs a closer look?","choices":["The shed's only door is still padlocked and undamaged, and she holds the only key.","The bicycle was three years old and had a worn seat.","She noticed that the bicycle was missing at 7:00 a.m. the next day.","The shed stands at the back of the yard, away from the street."],"answer":0,"fixed":false,"explanation":"A break-in at a locked shed should leave a damaged or opened lock, yet the only door is still padlocked and undamaged and no one else has a key. The bicycle's age, the time it was missed and the shed's location do not conflict with her account."},{"id":"rs-068","section":"reasoning","subtype":"problem-sensitivity","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":null,"stem":"Officer Chloe Bertrand answers a noise complaint at an apartment in Ashford Township. The man who opens the door says, \"I am the only one here, and everything is fine.\" Which observation most strongly suggests that his statement should be checked further?","choices":["A television is playing in the living room.","The man is wearing a bathrobe and slippers.","The man took about a minute to come to the door.","A voice from a back room calls out, \"Who is at the door?\""],"answer":3,"fixed":false,"explanation":"A second voice from a back room directly contradicts the man's claim that he is the only one there. A television, a bathrobe and a short delay in coming to the door are all ordinary for someone at home."},{"id":"rs-069","section":"reasoning","subtype":"problem-sensitivity","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":null,"stem":"Riverside Park in Orrin Borough closes at 9:00 p.m. Overnight parking is allowed only for borough vehicles and for vehicles showing a camping permit. At 11:00 p.m., Officer Dev Malhotra checks the parking lot. Which vehicle most strongly suggests that something is wrong and should be looked into first?","choices":["A locked station wagon showing a valid camping permit","A sedan with its engine running, its driver's door standing open and no one in sight","A locked borough maintenance truck parked beside the maintenance shed","A locked pickup truck showing a valid camping permit, with a tent set up nearby"],"answer":1,"fixed":false,"explanation":"A running car with its door open and no driver around, two hours after the park closed, has no ordinary explanation and may mean someone needs help or left in a hurry. The permit vehicles are allowed overnight and the maintenance truck is where it would be expected."},{"id":"rs-070","section":"reasoning","subtype":"problem-sensitivity","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"A delivery driver gives Officer Hana Sato this account: \"I left my house at 7:05 a.m. I clocked in at the depot at 7:20 a.m., loaded the truck until 8:00 a.m. and started my deliveries at 8:10 a.m.\" The driver also says the drive from his house to the depot never takes less than 30 minutes. Given that drive time, which two parts of the account cannot both be true?","choices":["Clocking in at 7:20 a.m. and loading the truck until 8:00 a.m.","Loading the truck until 8:00 a.m. and starting deliveries at 8:10 a.m.","Leaving home at 7:05 a.m. and clocking in at the depot at 7:20 a.m.","Leaving home at 7:05 a.m. and starting deliveries at 8:10 a.m."],"answer":2,"fixed":false,"explanation":"Only 15 minutes separate 7:05 a.m. and 7:20 a.m., but the drive takes at least 30 minutes, so the driver could not have left home at 7:05 and clocked in at 7:20. The other pairs of times leave enough time for what is described."},{"id":"rs-071","section":"reasoning","subtype":"information-gathering","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":null,"stem":"Officer Rafael Mendes needs to determine when a parked car was scratched. Which piece of information would be MOST useful?","choices":["When the owner last saw the car undamaged and when she first noticed the scratch","The make, model and color of the car, as listed on its registration","The estimated cost of repairing the scratch at a local body shop","The name of the owner's insurance company and her policy number"],"answer":0,"fixed":false,"explanation":"The last time the car was seen undamaged and the time the scratch was first noticed mark the beginning and end of the period in which the damage happened. The other facts describe the car or the loss but say nothing about timing."},{"id":"rs-072","section":"reasoning","subtype":"information-gathering","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"Two drivers collide in an intersection controlled by a traffic light, and each says the other drove through a red light. Officer Ingrid Solberg needs to determine which driver had the red light. Which piece of information would be MOST useful?","choices":["Photographs showing the damage to the front and side of both cars","Each driver's explanation of where he or she was going at the time","A passenger's opinion that the driver she was riding with is always careful","Store camera video showing the traffic light and both cars at the moment of the crash"],"answer":3,"fixed":false,"explanation":"A recording that shows the light and both cars at the moment of the crash answers the question directly. Damage photographs show where the cars struck each other but not what color the light was, and the other choices do not bear on the light at all."},{"id":"rs-073","section":"reasoning","subtype":"information-gathering","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":null,"stem":"Officer Kwame Asante is interviewing a woman who says she saw a crash. He first needs to establish whether she was in a position to see it clearly. Which question should he ask first?","choices":["\"Where were you standing, and what were you looking at, when the cars collided?\"","\"How fast do you think the blue car was going when it reached the corner?\"","\"Which of the two drivers do you think caused the crash?\"","\"Would you be willing to come to the station later this week to sign a statement?\""],"answer":0,"fixed":false,"explanation":"Her location and where she was looking establish whether she could actually see the collision. Questions about speed and fault ask for the very observations whose reliability has not yet been established."},{"id":"rs-074","section":"reasoning","subtype":"information-gathering","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":3,"stimulus":null,"stem":"Mr. Varela says a storm on Tuesday night knocked down the fence between his yard and his neighbor's. The neighbor, Ms. Lund, says the fence was still standing until a delivery truck backed into it at about 10:00 a.m. on Wednesday. Both agree that there was a storm and that a truck made a delivery. Which piece of information would be MOST useful in deciding between the two accounts?","choices":["A time-stamped photo of the fence taken at 7:00 a.m. on Wednesday","A weather report confirming strong winds on Tuesday night","The delivery company's record confirming a delivery at 10:00 a.m. on Wednesday","A contractor's estimate of the cost of rebuilding the fence"],"answer":0,"fixed":false,"explanation":"A photo taken after the storm but before the delivery shows whether the fence was already down, which is the one point on which the two accounts differ. The weather report and the delivery record only confirm facts both neighbors already agree on."},{"id":"rs-075","section":"reasoning","subtype":"information-gathering","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":null,"stem":"A car was driven away from a store parking lot after a theft. Officer Yusuf Demir needs to determine which direction the car went when it left the lot. Which piece of information would be MOST useful?","choices":["A list of the items that were taken from the store","A statement from a customer who watched the car pull out onto the road","The time that the store opened for business that morning","The clerk's description of the jacket the thief was wearing"],"answer":1,"fixed":false,"explanation":"Only someone who watched the car leave the lot can say which way it turned. The stolen items, the opening time and the thief's jacket may matter for other purposes but say nothing about direction of travel."},{"id":"rs-076","section":"reasoning","subtype":"information-gathering","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"Officer Elena Petrakis is handed a found wallet that holds cash but no identification card. She needs to identify the owner. Which item in the wallet would be MOST useful?","choices":["Three twenty-dollar bills folded together","A blank sticky note with nothing written on it","A printed schedule for the borough bus line","A pharmacy receipt showing a customer account number"],"answer":3,"fixed":false,"explanation":"A customer account number is tied to one particular person, so the pharmacy's records could lead to the owner. Cash, a blank note and a bus schedule could belong to anyone."},{"id":"rs-077","section":"reasoning","subtype":"information-gathering","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"After a crash, a driver tells Officer Noah Greene that she did not stop because tree branches hid the stop sign. Officer Greene needs to determine whether that claim is accurate. Which piece of information would be MOST useful?","choices":["The driver's record of traffic tickets over the past five years","The number of crashes reported at that intersection last year","How many years the driver has lived in the area","How much of the stop sign is visible from the driver's approach lane"],"answer":3,"fixed":false,"explanation":"The claim is about whether the sign could be seen, and looking at it from the driver's approach lane tests that directly. Her ticket history, the intersection's crash count and her time in the area do not show whether branches block the sign."},{"id":"rs-078","section":"reasoning","subtype":"information-gathering","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"A Stonebridge Borough rule limits street parking to 72 hours in one spot. A resident complains that a gray van has not moved in more than a week. Officer Sana Qureshi needs to determine how long the van has been parked in its current spot. Which piece of information would be MOST useful?","choices":["A neighbor's dated camera images showing the van in that spot each day","The expiration date printed on the van's registration sticker","The total mileage shown on the van's odometer","Whether the van's doors are locked and its windows are closed"],"answer":0,"fixed":false,"explanation":"Dated images of the van in the same spot show how many days it has been there. The registration date, the total mileage and the door locks reveal nothing about when the van was parked."},{"id":"rs-079","section":"reasoning","subtype":"information-gathering","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":null,"stem":"A dispatcher takes a call from a man who says someone was looking into his back windows. The dispatcher first needs to establish whether the person is still there. Which question should be asked first?","choices":["\"What was the person wearing, and how tall was he?\"","\"Have you ever reported a prowler at this address before?\"","\"Can you see the person right now, and if so, where?\"","\"How long have you lived at this address?\""],"answer":2,"fixed":false,"explanation":"Asking whether the caller can see the person right now goes straight to whether the person is still there. A description of the person is useful later, but it does not establish whether the person has left."},{"id":"rs-080","section":"reasoning","subtype":"information-gathering","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"Brightwater Borough keeps a bicycle registry that lists each registered bicycle's frame serial number next to its owner's name. Officer Jamal Whitlock stops a man who is walking a bicycle, gets the man's name, and needs to determine whether he is the bicycle's registered owner. Which piece of information would be MOST useful?","choices":["The color and brand of the bicycle","The serial number stamped on the bicycle's frame","The man's statement that he bought the bicycle last spring","Whether the bicycle has a lock attached"],"answer":1,"fixed":false,"explanation":"The registry matches serial numbers to owners' names, so the frame's serial number lets the officer check the man's name against the registered owner. Color and brand are shared by many bicycles, and the man's own statement cannot confirm itself."},{"id":"se-001","section":"sjt","subtype":"professional-skills","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"You work at a hardware store. Your supervisor, Ms. Okafor, tells you to rearrange the paint aisle in a way that you think will make items harder for customers to find. The new layout is not unsafe, and she wants it finished by the end of your shift. What is the best thing to do?","choices":["Set the aisle up your own way, since she will probably agree once she sees how well it works.","Tell Ms. Okafor your concern briefly, then set it up her way if she still wants it.","Set it up as told without comment, then tell co-workers that the new layout makes no sense.","Email the store owner to explain why the layout your supervisor chose is a mistake."],"answer":1,"fixed":false,"principle":"Chain of command","explanation":"Chain of command: a supervisor's safe, reasonable instruction should be followed, and the right way to disagree is to raise the concern with her directly and then accept her decision. Setting it up your own way may seem better for customers, but it replaces her decision with yours without her knowledge."},{"id":"se-002","section":"sjt","subtype":"professional-skills","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":1,"stimulus":null,"stem":"You work at the front desk of a fitness center. A long-time member, Mr. Brandt, has forgotten his membership card, and the center's policy says staff must check a photo ID before admitting anyone without a card. He says he is in a hurry and that you know perfectly well who he is. What would be the most effective response?","choices":["Wave him through this once, since you recognize him and he has been a member for years.","Tell him that rules are rules and that he should have remembered to bring his card.","Explain the policy politely and ask for his photo ID so that you can check him in.","Ask him to wait off to the side until your manager returns from lunch and can decide what to do."],"answer":2,"fixed":false,"principle":"Following policy","explanation":"Following policy: the rule applies to every member, and applying it courteously and quickly respects both the policy and the member. Waving him through because you recognize him is tempting, but it means the rule is applied only when it is convenient."},{"id":"se-003","section":"sjt","subtype":"professional-skills","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"You are a server at a busy restaurant. A customer, Mrs. Halloran, complains loudly that her meal took far too long and that you have been ignoring her table. You know that the kitchen was backed up and that you checked on her table twice. What is the best thing to do?","choices":["Explain that the kitchen was backed up and remind her that you did stop by her table twice.","Ask another server to take over her table for the rest of the meal.","Apologize for the wait, hear her out, and ask what you can do to make things right.","Go straight to the manager so that she can complain to someone with more authority."],"answer":2,"fixed":false,"principle":"Service and respect","explanation":"Service and respect: an upset customer mainly wants to be heard and to have the problem fixed, so an apology and an offer to help calm things fastest. Explaining that the delay was not your fault may be accurate, but it sounds like arguing and leaves her complaint unresolved."},{"id":"se-004","section":"sjt","subtype":"professional-skills","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":1,"stimulus":null,"stem":"Your office has switched to a new scheduling program, and you were out sick on the day everyone was trained. This morning your supervisor assigns you a task that must be done in the new program by Friday. What is the best thing to do?","choices":["Tell your supervisor that you missed the training and ask how you can learn the program.","Work it out by trial and error, and correct any mistakes if someone points them out later.","Ask a co-worker to do the task for you this time in return for a favor later on.","Set the task aside until the next training session is offered, whenever that turns out to be."],"answer":0,"fixed":false,"principle":"Accountability","explanation":"Accountability: owning the gap in your training and asking for help early is the surest way to get the task done correctly and on time. Working it out by trial and error is tempting because it avoids admitting you are behind, but it risks errors in work that others rely on."},{"id":"se-005","section":"sjt","subtype":"professional-skills","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":3,"stimulus":null,"stem":"You work in a warehouse where a posted safety rule says that boxes may not be stacked above a red line painted on the wall. Your team leader, Mr. Vasquez, is short on space before a large delivery and tells you to stack a few rows above the line for today only. What would be the most effective response?","choices":["Stack the boxes above the line as told, since the team leader is responsible for the decision.","Stack them as told, then send an unsigned complaint to the safety office afterward.","Refuse, and tell him that you will report him if he asks anyone else to do it.","Point out the posted rule to Mr. Vasquez and ask where else he would like the extra boxes to go."],"answer":3,"fixed":false,"principle":"Following policy","explanation":"Following policy: a posted safety rule still applies on a busy day, and raising it respectfully with the team leader gives him the chance to solve the space problem properly. Simply doing as told is the most tempting choice, but being told to break a safety rule does not make it safe or remove your part in it."},{"id":"se-006","section":"sjt","subtype":"professional-skills","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":1,"stimulus":null,"stem":"You are riding the train to work when a signal problem stops it between stations. You can tell that you will be about 20 minutes late for your shift, and the co-worker you relieve cannot leave until you arrive. What is the best thing to do?","choices":["Get there as quickly as you can, and explain what happened if anyone asks about it.","Call your supervisor now, explain the delay, and say when you expect to arrive.","Text the co-worker to ask her to cover quietly so that the supervisor need not know.","Wait until you arrive, then offer to stay 20 minutes late to make up the time."],"answer":1,"fixed":false,"principle":"Accountability","explanation":"Accountability: telling your supervisor right away gives her time to plan and shows that you take responsibility for your shift, even when the delay is not your fault. Making up the time afterward sounds fair, but it does nothing for the co-worker who is left waiting without notice."},{"id":"se-007","section":"sjt","subtype":"professional-skills","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"A co-worker, Tomas, has locked himself out of the company computer system and has a deadline in an hour. He asks to use your login just this once. Company policy forbids sharing logins, and the help desk usually resets passwords within 15 minutes. What would be the most effective response?","choices":["Log in for him yourself and stay beside him at the computer while he finishes his work.","Give him your password for the hour and change it as soon as he is done.","Say that you cannot share your login, and help him get a reset from the help desk now.","Tell him no, and let your supervisor know that he asked you to break the login policy."],"answer":2,"fixed":false,"principle":"Following policy","explanation":"Following policy: the rule covers any use of your login by someone else, and the help desk can solve his problem in time without breaking it. Logging in for him and watching feels like a safe compromise, but his work would still be recorded under your name, which is exactly what the policy is meant to prevent."},{"id":"se-008","section":"sjt","subtype":"professional-skills","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"You work at a garden center. Before leaving for the day, the day manager told you to finish the plant inventory before you go home. An hour later the evening manager, Ms. Lindqvist, tells you to stop and work a cash register for the rest of your shift. You cannot do both. What is the best thing to do?","choices":["Tell Ms. Lindqvist about the day manager's instruction and ask which task comes first.","Move to the register without comment, since she is the manager who is present.","Keep working on the inventory, because that instruction was given to you first.","Call the day manager at home to say that you are being pulled off the inventory he wanted."],"answer":0,"fixed":false,"principle":"Chain of command","explanation":"Chain of command: when two instructions conflict, the supervisor in charge needs the full picture so that she can decide, and it takes only a sentence to give it to her. Moving to the register without comment is tempting because it obeys the manager on duty, but it leaves the inventory undone with nobody aware of it."},{"id":"se-009","section":"sjt","subtype":"community-interaction","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":1,"stimulus":null,"stem":"Your next-door neighbor's dog has started barking for about an hour most mornings beginning at 6:00, and it wakes you up. You are on friendly terms with the neighbor, Mr. Petrakis, but have never mentioned the barking. What is the best thing to do?","choices":["Stop by at a reasonable hour, calmly describe the problem, and ask whether something can be done.","File a noise complaint with the township so that there is an official record of the problem.","Leave an unsigned note on his door asking him to keep the dog quiet in the mornings.","Put up with the barking, since bringing it up could spoil a good relationship."],"answer":0,"fixed":false,"principle":"De-escalation","explanation":"De-escalation: a calm, direct conversation gives the neighbor a chance to fix a problem he may not know about, and it keeps the relationship friendly. A township complaint is tempting because it avoids an awkward talk, but it escalates a minor nuisance before the simple route has been tried."},{"id":"se-010","section":"sjt","subtype":"community-interaction","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"You volunteer at the information desk of a county library. A man who speaks limited English is trying to ask you something and is becoming frustrated because you do not understand him. Three other people are waiting behind him. What would be the most effective response?","choices":["Ask him to step aside while you help the others, and return to him when the line is gone.","Repeat the same explanation in a louder voice until he is able to follow it.","Stay patient, use simple words and the printed floor map, and work out what he needs.","Suggest that he come back with a friend or relative who can translate for him."],"answer":2,"fixed":false,"principle":"Service and respect","explanation":"Service and respect: every visitor deserves the same effort, and patience with plain words and something to point at usually solves the problem in a minute or two. Asking him to step aside looks efficient, but it tells him that he matters less than the people behind him."},{"id":"se-011","section":"sjt","subtype":"community-interaction","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"An elderly neighbor, Mrs. Abernathy, lives alone and normally collects her newspaper every morning. You notice that three newspapers have piled up on her step, her car has not moved, and you have not seen her all week. What is the best thing to do?","choices":["Give it a few more days before doing anything, since she may simply be away visiting family.","Pick up the newspapers so that her house does not look empty to people passing by.","Try her doors and windows to see whether you can get inside to look for her.","Knock on her door, and if nobody answers, ask the non-emergency line to check on her."],"answer":3,"fixed":false,"principle":"Sound judgment","explanation":"Sound judgment: several signs together suggest she may need help, so the sensible step is to check directly and then bring in people equipped to follow up. Waiting a few more days is tempting because there may be an innocent reason, but if she is ill or has fallen, the delay could matter."},{"id":"se-012","section":"sjt","subtype":"community-interaction","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":1,"stimulus":null,"stem":"Guests of your new neighbors have parked partly across your driveway twice this month. Tonight it has happened again, the neighbors are clearly at home, and you need to drive to an appointment in an hour. What would be the most effective response?","choices":["Call a towing company and have the car removed at the owner's expense.","Go next door, explain politely that you need to get out, and ask that the car be moved.","Leave a sharply worded note under the windshield wiper and wait to see whether the car is moved.","Drive over the edge of your lawn to get out, and say nothing so as not to start a quarrel."],"answer":1,"fixed":false,"principle":"De-escalation","explanation":"De-escalation: a polite request solves tonight's problem and lets the neighbors know about the pattern without creating bad feeling. Calling a tow truck is tempting because you may be within your rights, but it is an over-reaction when the people who can fix it are a few steps away."},{"id":"se-013","section":"sjt","subtype":"community-interaction","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"You volunteer at a community food pantry. A visitor, Ms. Delgado, becomes upset when she learns that the pantry has run out of baby formula, and she says the volunteers must be saving it for their friends. What is the best thing to do?","choices":["Listen, say you are sorry, and tell her what is available and when more is due.","Tell her firmly that the accusation is untrue and unfair to people who give up their time.","Take formula from a box already packed for another family so that she will calm down.","Step away to another task and give her time to settle down without an audience."],"answer":0,"fixed":false,"principle":"Service and respect","explanation":"Service and respect: her anger comes from worry, and listening and offering real information addresses the worry without rewarding the accusation. Defending the volunteers is tempting because the charge is unfair, but arguing the point does nothing to help her and is likely to raise the temperature."},{"id":"se-014","section":"sjt","subtype":"community-interaction","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"You are a cashier at a pharmacy. Two customers reach your register at the same moment and begin to argue about who was first, and their voices are getting louder. You did not see who arrived first. A co-worker is stocking a shelf a few steps away. What would be the most effective response?","choices":["Tell them that you will not ring up either one until they have settled it between themselves.","Call the store manager to the front to decide which customer should go first.","Serve the quieter customer first, since the louder one is the one causing the problem.","Say calmly that both will be helped at once, and ask the co-worker to open a register."],"answer":3,"fixed":false,"principle":"De-escalation","explanation":"De-escalation: removing the thing they are arguing about, the wait, ends the dispute without either customer having to lose. Serving the quieter customer first is tempting, but it takes a side on a point you did not see and is likely to make the other customer angrier."},{"id":"se-015","section":"sjt","subtype":"community-interaction","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"You coach a youth basketball team as a volunteer. Right after a game, a parent, Mr. Osei, confronts you angrily in front of the players about how little his daughter played. What is the best thing to do?","choices":["Explain to him then and there, in front of the group, how playing time is decided.","Tell him that coaching decisions are yours to make and are not open to discussion.","Say calmly that you want to hear him out, and ask to talk once the players have left.","Promise him that his daughter will play more in the next game so that the scene ends quickly."],"answer":2,"fixed":false,"principle":"De-escalation","explanation":"De-escalation: moving the talk to a private moment lowers the tension, keeps the players out of the argument, and still shows the parent that he will be heard. Explaining on the spot is tempting because you have a fair answer, but a debate in front of the children is likely to grow instead of settling."},{"id":"se-016","section":"sjt","subtype":"community-interaction","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":3,"stimulus":null,"stem":"Several teenagers have begun skateboarding in the parking lot of your apartment complex in the evenings, and one of them nearly hit a parked car yesterday. You know two of the teenagers by name, and nothing has been damaged so far. What would be the most effective response?","choices":["Call the police the next time they are out, before a car is damaged or a person is hit.","Shout from your window that they need to leave before somebody gets hurt.","Post a complaint about the teenagers and their parents on the residents' message board.","Talk with them in a friendly way about the cars, and suggest the skate area at the park."],"answer":3,"fixed":false,"principle":"Sound judgment","explanation":"Sound judgment: nothing has been damaged and you know some of them, so a friendly word that offers a better place to skate fits the size of the problem. Calling the police is tempting as a way to prevent harm, but it over-escalates a minor issue that nobody has yet raised with the teenagers at all."},{"id":"se-017","section":"sjt","subtype":"conscientiousness","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"You realize that a monthly sales report you turned in yesterday contains a wrong total because you copied a figure incorrectly. Your supervisor has already forwarded the report to the regional office, and nobody has noticed the error. What is the best thing to do?","choices":["Wait to see whether the wrong total causes a problem before bringing it up.","Quietly correct the copy saved in the shared folder and say nothing more about it.","Mention at the next staff meeting that the report form is confusing and invites mistakes.","Tell your supervisor about the error today and give her the corrected figure."],"answer":3,"fixed":false,"principle":"Accountability","explanation":"Accountability: the report has already gone to people who may rely on it, so the person who made the error should report it promptly and supply the fix. Quietly correcting the saved copy is tempting because it avoids embarrassment, but the regional office would still hold the wrong figure."},{"id":"se-018","section":"sjt","subtype":"conscientiousness","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":1,"stimulus":null,"stem":"While returning a shopping cart at a grocery store, you find a wallet on the ground. It holds a driver's license, two credit cards and about $80 in cash. Nobody nearby seems to be looking for it. What would be the most effective response?","choices":["Leave it where it lies so that the owner can find it by retracing her steps.","Hand it in, untouched, at the store's customer service desk and say where it was found.","Take it home and plan to mail it to the address on the license when you next have the time.","Post a photo of the license on a neighborhood web page and ask whether anyone knows the owner."],"answer":1,"fixed":false,"principle":"Integrity","explanation":"Integrity: turning the wallet in promptly and untouched, at the place the owner is most likely to ask, gets it back to her fastest. Taking it home to mail later means well, but the owner may spend days worrying and cancelling cards while the wallet sits with a stranger."},{"id":"se-019","section":"sjt","subtype":"conscientiousness","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"You work evenings at a movie theater. On a slow night a good friend, Jamal, shows up with two other people and asks you to let them in without tickets, pointing out that the theater is nearly empty anyway. What is the best thing to do?","choices":["Let them in this one time, since the seats would otherwise go unused.","Tell him in a friendly way that you cannot let anyone in without a ticket.","Tell him you would do it, but that your manager happens to be watching tonight.","Tell them to wait outside and slip in after the manager has gone home."],"answer":1,"fixed":false,"principle":"Integrity","explanation":"Integrity: the tickets are not yours to give away, and an honest, friendly no keeps both your job and the friendship on solid ground. Blaming the manager is tempting because it avoids an awkward refusal, but it is untrue and invites him to ask again on a night when nobody is watching."},{"id":"se-020","section":"sjt","subtype":"conscientiousness","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":1,"stimulus":null,"stem":"Three weeks ago you promised to help a friend, Priya, move to a new apartment this Saturday. On Thursday another friend offers you a free ticket to an all-day music festival on Saturday. What would be the most effective response?","choices":["Tell Priya that you have been called in to work on Saturday.","Help for the first hour, then slip away once the heavy furniture has been loaded.","Keep your promise to help with the move, and thank the other friend for the offer.","Text Priya on Friday night that you cannot make it, and offer to help her unpack later."],"answer":2,"fixed":false,"principle":"Accountability","explanation":"Accountability: she has planned her move around your promise, and following through on a commitment matters most when something more appealing comes along. Cancelling with an offer to help later sounds considerate, but it leaves her short-handed with no time to find someone else."},{"id":"se-021","section":"sjt","subtype":"conscientiousness","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":1,"stimulus":null,"stem":"While backing a company van out of a tight space, you scrape a post and leave a small dent in the rear bumper. Nobody saw it happen, and the van already has several scratches from other drivers. What would be the most effective response?","choices":["Say nothing, since one more mark will not stand out among the scratches already there.","Keep quiet for now, and admit it only if someone asks you directly.","Have a friend repair the dent over the weekend so that it never needs to be reported.","Report the damage to your supervisor before your shift ends."],"answer":3,"fixed":false,"principle":"Accountability","explanation":"Accountability: you caused the damage, so reporting it promptly is the honest course whether or not anyone saw it. Arranging a quiet repair is tempting because it seems to make things right, but it hides the incident from an employer who is entitled to know about it."},{"id":"se-022","section":"sjt","subtype":"conscientiousness","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"You are closing a gift shop alone and are already late for a family dinner. The closing checklist requires you to count the cash drawer and write the amount in the log, which takes about ten minutes. The drawer has matched the register every night this month. What is the best thing to do?","choices":["Write in the amount shown on the register, since the two have matched all month.","Leave a note asking the morning employee to do the count before the shop opens.","Count the drawer and log the amount as required, and tell your family you will be late.","Lock up now and come in early tomorrow to do the count before the manager arrives for the day."],"answer":2,"fixed":false,"principle":"Following policy","explanation":"Following policy: the count is useful only if it is actually done each night by the person closing, and ten minutes is a small cost. Writing in the register amount is tempting because it would probably be right, but it records a count that never happened."},{"id":"se-023","section":"sjt","subtype":"conscientiousness","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"A co-worker, Renee, texts to say that she will be 15 minutes late and asks you to clock her in on time. She is a dependable worker and has swapped shifts with you several times when you needed it. What would be the most effective response?","choices":["Reply that you cannot clock her in, and suggest that she call the supervisor herself.","Clock her in this once, since she is reliable and has done several favors for you in the past.","Clock her in, but tell her afterward that you will not be able to do it again.","Leave the message unanswered so that you cannot be blamed either way."],"answer":0,"fixed":false,"principle":"Integrity","explanation":"Integrity: clocking in for someone else makes the time record false, however good a co-worker she is, and pointing her to the supervisor gives her an honest way to handle being late. Doing it once out of gratitude is the tempting choice, but a favor owed does not make a false record acceptable."},{"id":"se-024","section":"sjt","subtype":"conscientiousness","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":3,"stimulus":null,"stem":"You are the volunteer treasurer of a neighborhood garden club. While preparing tonight's report, you find that the cash box holds $40 less than your records show, and you cannot find the reason. What is the best thing to do?","choices":["Report the shortage at tonight's meeting, show your records, and ask another member to check them.","Add $40 of your own money to the cash box so that the cash and the records agree.","Leave the shortage out of tonight's report and keep looking for the cause for another month.","Enter a $40 expense for supplies so that the books balance, and watch for it to happen again."],"answer":0,"fixed":false,"principle":"Integrity","explanation":"Integrity: club money has to be reported as it actually stands, and asking for a second set of eyes is the quickest way to find the cause. Covering the gap with your own money is tempting because nobody appears to lose anything, but it hides a problem in the records that may well happen again."},{"id":"se-025","section":"sjt","subtype":"critical-thinking","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"A co-worker tells you he has heard that your department will have layoffs next month. He heard it from someone in another building, and nothing has been announced. Several people on your team are already anxious about it. What would be the most effective response?","choices":["Do not pass it along, and ask your supervisor whether there is anything she can confirm.","Warn your closest co-workers quietly so that they can begin looking for other jobs in good time.","Assume it is true, since rumors like this usually are, and begin applying elsewhere.","Post a question about the layoffs on the company-wide message board."],"answer":0,"fixed":false,"principle":"Sound judgment","explanation":"Sound judgment: a third-hand report is not a fact, so the sensible step is to check it with someone who would know before acting on it or repeating it. Warning close co-workers feels loyal, but it spreads an unverified claim and adds to the anxiety."},{"id":"se-026","section":"sjt","subtype":"critical-thinking","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":1,"stimulus":null,"stem":"You are in charge of a volunteer park cleanup. Within the same minute, a volunteer cuts her hand badly on broken glass, the driver of the supply truck asks you to sign for a delivery, and a local reporter asks for a short interview. What is the best thing to do?","choices":["Sign for the delivery first, since it takes only a moment and the driver is on a schedule.","Give the interview first, since it is brief and good publicity brings in more volunteers.","Stop the cleanup and send all of the volunteers home in case there is more glass.","See to the injured volunteer's first aid, then sign for the delivery, then talk to the reporter."],"answer":3,"fixed":false,"principle":"Sound judgment","explanation":"Sound judgment: an injury comes before paperwork or publicity, and the other two requests lose nothing by waiting a few minutes. Signing for the delivery first is tempting because it is quick, but it leaves a bleeding volunteer unattended."},{"id":"se-027","section":"sjt","subtype":"critical-thinking","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":3,"stimulus":null,"stem":"You receive an email at work that appears to come from your manager, who is travelling. It says she needs you to buy $300 in gift cards for a client right away and to email her the card numbers, and it asks you to keep the request confidential. What would be the most effective response?","choices":["Buy the cards promptly, since she is travelling and has marked the request as urgent.","Call your manager at the number you already have and confirm the request before acting.","Reply to the email and ask whether the request is genuine before you go out and buy anything.","Delete the email and carry on with your work without mentioning it to anyone."],"answer":1,"fixed":false,"principle":"Sound judgment","explanation":"Sound judgment: urgency, secrecy and an unusual form of payment are reasons to verify the request through a separate channel that you know belongs to her. Replying to the email is the tempting choice, but a reply goes to whoever sent the message, who will simply say yes."},{"id":"se-028","section":"sjt","subtype":"critical-thinking","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"Your supervisor asks you to find out why an order reached a customer three days late. One co-worker says the packing team received the order late; another says the packing team had it on time and let it sit. You have access to the order log, which records times. What is the best thing to do?","choices":["Hear both co-workers out, then check the times in the order log before drawing a conclusion.","Go with the account given by the co-worker you have known longer and trust more.","Report that both teams share the blame, so that nobody feels singled out.","Tell your supervisor that the cause cannot be determined because the accounts conflict."],"answer":0,"fixed":false,"principle":"Sound judgment","explanation":"Sound judgment: when two accounts conflict, an independent record is the best evidence, and here one is available. Splitting the blame seems fair and keeps the peace, but it is a guess presented as a finding."},{"id":"se-029","section":"sjt","subtype":"critical-thinking","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"You have worked out a faster way to process returns at the store where you work. It skips one step in the written procedure, a step you believe is unnecessary. Your supervisor has not seen your method. What would be the most effective response?","choices":["Begin using your method, and show your supervisor the time saved after a few weeks.","Explain your method to your supervisor and ask for approval before you change how you do the work.","Teach the method to your co-workers first, so that management can see it has support.","Keep the idea to yourself, since written procedures are there for good reasons."],"answer":1,"fixed":false,"principle":"Chain of command","explanation":"Chain of command: a change to a written procedure is the supervisor's decision, and she may know why the step exists. Proving the method first is tempting because results are persuasive, but it means breaking the procedure without approval, while keeping quiet wastes what may be a good idea."},{"id":"se-030","section":"sjt","subtype":"critical-thinking","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"You work in a clothing shop where refunds require a receipt or a manager's approval. A customer without a receipt says that another employee promised her a refund yesterday. That employee is off today, and your manager is in the back office. What is the best thing to do?","choices":["Give the refund, since a co-worker has apparently already promised it to her and she expects it.","Tell her politely that without a receipt there is nothing you are able to do.","Ask her to come back on a day when the other employee is working and can confirm it.","Say that you want to help, and ask the manager to come out and decide on the refund."],"answer":3,"fixed":false,"principle":"Following policy","explanation":"Following policy: the policy itself provides the solution, a manager's approval, and the manager is a few steps away. Refusing outright is tempting because the rule mentions a receipt, but it ignores the second half of the rule and sends away a customer who may be entitled to a refund."},{"id":"se-031","section":"sjt","subtype":"critical-thinking","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":3,"stimulus":null,"stem":"You are looking after a friend's house while she is overseas. One evening you find water dripping steadily from a pipe under the kitchen sink. You call your friend, but she does not answer, and she will probably be asleep for several more hours. What would be the most effective response?","choices":["Call a plumber and approve whatever repair is needed, since water damage is expensive.","Put a bucket under the drip and plan to tell her about it when she calls you back.","Leave it alone, since it is not your house and you could make matters worse.","Close the shutoff valve under the sink, dry the area, and leave her a message saying what you did."],"answer":3,"fixed":false,"principle":"Sound judgment","explanation":"Sound judgment: shutting off the water stops the damage at no cost and leaves the repair decision to the owner, who is told promptly. Hiring a plumber is tempting because it seems responsible, but it spends her money on a repair she has not agreed to when a simple step already contains the problem."},{"id":"se-032","section":"sjt","subtype":"emotional-stability","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":1,"stimulus":null,"stem":"You are watching your niece's soccer game. After you cheer for a goal, a stranger supporting the other team turns and makes a loud, insulting remark about you. People nearby hear it. What is the best thing to do?","choices":["Let the remark pass without answering and turn your attention back to the game.","Answer with a sharp remark of your own so that he knows you will not be pushed around.","Walk over and tell him firmly that he owes you an apology.","Ask the referee to stop play and have him removed from the field."],"answer":0,"fixed":false,"principle":"De-escalation","explanation":"De-escalation: a single insult from a stranger does no real harm, and not reacting ends the matter and keeps the day about the children. Demanding an apology is tempting because the remark was out of line, but it turns one rude comment into a confrontation."},{"id":"se-033","section":"sjt","subtype":"emotional-stability","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"In a team meeting, your supervisor, Mr. Castellano, criticizes you for missing a deadline. In fact the delay happened because another department sent its figures four days late. You feel embarrassed and angry. What would be the most effective response?","choices":["Interrupt him to point out that the other department, not you, caused the delay.","Say nothing now or later, since disagreeing with a supervisor rarely ends well for anyone.","Email his manager after the meeting to set the record straight.","Stay composed, then ask to see him privately and explain what caused the delay."],"answer":3,"fixed":false,"principle":"De-escalation","explanation":"De-escalation: holding your temper and then giving him the facts in private corrects the record without a public argument. Interrupting is tempting because the criticism is unfair, but it puts him on the defensive in front of the team, and staying silent for good leaves the wrong impression in place."},{"id":"se-034","section":"sjt","subtype":"emotional-stability","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":1,"stimulus":null,"stem":"You have been waiting with your turn signal on for a parking space at a crowded shopping center. As the car backs out, another driver swings in from the other direction and takes the space, then grins at you. What is the best thing to do?","choices":["Let it go and look for another space.","Stop behind his car so that he cannot leave, and tell him that the space was yours.","Lower your window and tell him exactly what you think of him.","Photograph his car and license plate and post the picture online."],"answer":0,"fixed":false,"principle":"De-escalation","explanation":"De-escalation: a parking space is not worth a confrontation with a stranger, and moving on costs you only a minute or two. Telling him off is tempting because he was plainly rude, but it will not get the space back and could turn a small annoyance into a real dispute."},{"id":"se-035","section":"sjt","subtype":"emotional-stability","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"A co-worker, Dmitri, reviews a proposal you wrote and tells you bluntly that it is disorganized and that two of your cost figures are out of date. His tone is rude, but when you check, the two figures are in fact out of date. What would be the most effective response?","choices":["Point out to him that his own reports have had errors in them too.","Thank him for catching the figures, correct them, and review how it is organized.","Fix the two figures, but disregard the rest of what he said because of the way he said it.","Ask your supervisor to have someone else review your work from now on."],"answer":1,"fixed":false,"principle":"Accountability","explanation":"Accountability: useful criticism is still useful when it is delivered badly, and owning the errors improves the proposal. Fixing only the figures is tempting because his tone was rude, but it throws away feedback that may be just as valid."},{"id":"se-036","section":"sjt","subtype":"emotional-stability","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"You have had an exhausting week at work. On Friday afternoon a co-worker, Hannah, accidentally deletes a file you spent two hours on, and you will have to redo it before you leave. She apologizes, and you feel like snapping at her. What is the best thing to do?","choices":["Take a moment to steady yourself, accept her apology, and ask her to help you rebuild the file.","Tell her sharply how much time she has cost you so that she will be more careful.","Say that it is fine, redo the file alone, and keep your distance from her for a while.","Step out and complain to another co-worker about how careless she is."],"answer":0,"fixed":false,"principle":"De-escalation","explanation":"De-escalation: pausing before you respond keeps a tired moment from damaging a working relationship, and asking for her help gets the file redone sooner. Saying that it is fine while staying resentful is tempting because it avoids a scene, but it is not honest and the irritation tends to come out later in other ways."},{"id":"se-037","section":"sjt","subtype":"emotional-stability","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":3,"stimulus":null,"stem":"You applied for a team leader position and believed you were the strongest candidate. Today you learn that the job has gone to Marisol, a co-worker with two years less experience than you. You are disappointed. What would be the most effective response?","choices":["Tell your supervisor that the decision was unfair in view of your longer experience.","Keep doing your job, but stop volunteering for anything beyond the duties you are assigned.","Congratulate Marisol, and later ask your supervisor how you can be a stronger candidate.","Ask your co-workers whether they agree that you should have been chosen."],"answer":2,"fixed":false,"principle":"Accountability","explanation":"Accountability: treating the setback as information about what to improve is the response that actually raises your chances next time. Telling the supervisor the decision was unfair is tempting because experience feels as though it should settle the matter, but it argues with a decision already made instead of learning what it was based on."},{"id":"se-038","section":"sjt","subtype":"emotional-stability","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"You answer telephones for a utility company. A caller, Mr. Whitfield, shouts that his bill is wrong for the second month in a row and calls you incompetent. You did not handle his account last month. What is the best thing to do?","choices":["Tell him that you will end the call unless he speaks to you respectfully.","Explain that someone else handled his account last month, so the mistake was not yours.","Place him on hold for a few minutes so that he has time to cool down.","Keep your voice even, let him finish, and then go through the bill with him to find the error."],"answer":3,"fixed":false,"principle":"Service and respect","explanation":"Service and respect: his anger is about the bill, not about you, and it fades fastest when someone calmly fixes the problem. Pointing out that the mistake was not yours is tempting because the insult is unfair, but who made the error does not matter to him and explaining it delays the fix."},{"id":"se-039","section":"sjt","subtype":"social-engagement","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":1,"stimulus":null,"stem":"You are one of four people preparing a presentation at work. One member, Curtis, has missed two deadlines for his part, and the presentation is due in a week. Nobody has spoken to him about it. What would be the most effective response?","choices":["Tell your supervisor that Curtis is not doing his share and that the deadline is at risk.","Split his part among the other three members without saying anything to him about it.","Talk with Curtis privately, ask what is in the way, and agree on new dates for his part.","Raise his missed deadlines in front of the whole group at the next meeting."],"answer":2,"fixed":false,"principle":"Teamwork","explanation":"Teamwork: speaking with him directly and privately gives him the chance to explain and to recommit, which is the quickest way to get the work done. Going to the supervisor is tempting, but it skips the direct conversation that nobody has yet tried."},{"id":"se-040","section":"sjt","subtype":"social-engagement","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"A normally dependable co-worker, Ms. Nakamura, has been making small mistakes for two weeks and seems distracted. She has mentioned that things are difficult at home. Your employer offers a free, confidential counseling service for employees. What is the best thing to do?","choices":["Let your supervisor know that her problems at home are affecting her work.","Ask her privately how she is doing, offer help, and mention the counseling service.","Correct her mistakes quietly yourself so that she does not get into trouble.","Give her space and avoid the subject altogether, since her home life is her own business."],"answer":1,"fixed":false,"principle":"Teamwork","explanation":"Teamwork: a private, supportive word shows concern and points her to help that is equipped to deal with what she is facing. Quietly fixing her mistakes is tempting because it feels kind, but it hides the problem without helping her with its cause."},{"id":"se-041","section":"sjt","subtype":"social-engagement","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":1,"stimulus":null,"stem":"A new employee, Farid, started in your department this week. For the third day in a row you see him eating lunch alone in the break room, looking unsure whether to join anyone. What would be the most effective response?","choices":["Leave him be, since he may simply prefer to eat by himself.","Invite him to sit with your group and introduce him to the others.","Wait for him to come over, because joining in is something he has to learn to do.","Mention to your supervisor that the new employee does not seem to be fitting in."],"answer":1,"fixed":false,"principle":"Service and respect","explanation":"Service and respect: a simple invitation costs nothing, and he remains free to say no if he would rather eat alone. Leaving him be is tempting because he might prefer it, but his manner suggests he is unsure, not unwilling, and an invitation is how you find out."},{"id":"se-042","section":"sjt","subtype":"social-engagement","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":3,"stimulus":null,"stem":"Two members of your work team, Leah and Marcus, have stopped speaking to each other after a disagreement, and jobs that need both of them are falling behind. Each has complained to you about the other. What is the best thing to do?","choices":["Agree with each of them when they complain, so that you stay on good terms with both.","Carry messages between the two of them so that the shared jobs still get finished.","Encourage each to talk to the other directly, and offer to sit in if that would help.","Tell them both at the next team meeting that it is time to grow up."],"answer":2,"fixed":false,"principle":"Teamwork","explanation":"Teamwork: the dispute will end only when the two of them talk, so nudging them toward that, with support, deals with the cause. Carrying messages is tempting because it keeps the work moving, but it makes the silence easier to continue and leaves you in the middle indefinitely."},{"id":"se-043","section":"sjt","subtype":"social-engagement","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"You serve on a committee planning a fundraiser for a youth center. You argued for a weekend car wash, but after a fair discussion the committee voted for a bake sale, which you expect to raise less money. You have been asked to organize the volunteers. What would be the most effective response?","choices":["Do the job you were given, but remind the others of your objection whenever a problem comes up.","Step back from the committee until this event is over.","Call the members one at a time to persuade them to reverse the vote.","Accept the vote and put your full effort into organizing the volunteers for the bake sale."],"answer":3,"fixed":false,"principle":"Teamwork","explanation":"Teamwork: once a group has decided fairly, supporting the decision fully is what makes it most likely to succeed. Doing the job while repeating your objection is tempting because you may be right, but it undercuts the group's effort and its goodwill."},{"id":"se-044","section":"sjt","subtype":"social-engagement","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":3,"stimulus":null,"stem":"You are leading a meeting of five volunteers to plan a neighborhood event. One member, Gordon, has done most of the talking. Another member, Ms. Yilmaz, who ran a similar event last year, has not said anything. What is the best thing to do?","choices":["Let the discussion run its course, since anyone with something to add will speak up.","Thank Gordon for his ideas, then ask Ms. Yilmaz what she learned from running last year's event.","Tell Gordon in front of the group that he needs to give the others a turn.","Speak with Ms. Yilmaz after the meeting and bring her ideas to the group yourself next time."],"answer":1,"fixed":false,"principle":"Teamwork","explanation":"Teamwork: a leader's job is to draw on everyone's knowledge, and a direct, friendly invitation brings in the quiet member without embarrassing the talkative one. Collecting her ideas afterward is tempting because it spares her the spotlight, but the group loses the chance to discuss them with her now."},{"id":"se-045","section":"sjt","subtype":"social-engagement","families":["upper-dublin","montco"],"products":["ngle"],"difficulty":3,"stimulus":null,"stem":"In a staff meeting, a co-worker, Brendan, presents an idea that you described to him last week, and he does not mention you. Your supervisor praises him for it. This is the first time anything like this has happened. What would be the most effective response?","choices":["Break in during the meeting to announce that the idea was actually yours.","Say nothing to anyone, but stop sharing your ideas with him from now on.","Tell Brendan privately that the idea began with you, and ask him to say so in future.","Email your supervisor after the meeting to explain whose idea it really was in the first place."],"answer":2,"fixed":false,"principle":"Sound judgment","explanation":"Sound judgment: it may have been an oversight, so a direct private conversation is the fair first step and gives him the chance to put it right. Emailing the supervisor is tempting because it restores the credit quickly, but it goes around the co-worker before he has had a chance to explain."},{"id":"sp-001","section":"sjt","subtype":"integrity","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":1,"stimulus":null,"stem":"Officer Dana Whitfield is walking a foot beat in Brightwater Borough when she finds a wallet on the sidewalk. It holds $340 in cash and a library card, and no one nearby claims it. What is the best course of action?","choices":["Record exactly what the wallet contains and tu
