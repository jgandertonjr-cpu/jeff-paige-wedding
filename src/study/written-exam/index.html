pe":"add-subtract","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"On Monday, Cedar Hollow Township officers issued 47 citations on the day shift, 68 on the evening shift and 29 on the overnight shift. How many citations were issued on Monday in all?","choices":["76","115","134","144"],"answer":3,"fixed":true,"answerValue":144,"check":"47 + 68 + 29","explanation":"47 + 68 = 115, and 115 + 29 = 144. Stopping at 115 leaves out the overnight shift."},{"id":"ar-004","section":"arithmetic","subtype":"add-subtract","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"Sergeant Haddad began the week with $500.00 in the petty cash fund. She spent $86.45 on batteries, $129.80 on evidence tape and $47.25 on printer paper. How much money was left in the fund?","choices":["$226.50","$236.50","$263.50","$336.50"],"answer":1,"fixed":true,"answerValue":236.5,"check":"500 - 86.45 - 129.80 - 47.25","explanation":"The purchases total 86.45 + 129.80 + 47.25 = 263.50, and 500.00 - 263.50 = $236.50. $263.50 is the amount spent, not the amount left."},{"id":"ar-005","section":"arithmetic","subtype":"add-subtract","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"The odometer on Officer Nakamura's patrol car read 48,726 miles at the start of his shift and 48,913 miles at the end. How many miles did he drive during the shift?","choices":["87 miles","177 miles","187 miles","213 miles"],"answer":2,"fixed":true,"answerValue":187,"check":"48913 - 48726","explanation":"48,913 - 48,726 = 187 miles. Check by adding: 48,726 + 187 = 48,913. 177 comes from a borrowing slip in the tens column."},{"id":"ar-006","section":"arithmetic","subtype":"add-subtract","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"Items worth a total of $1,415.00 were shoplifted from a store in Brightwater Borough. Officers recovered a jacket worth $268.75 and a game console worth $412.50. What is the value of the items that are still missing?","choices":["$681.25","$733.75","$833.75","$1,002.50","$1,146.25"],"answer":1,"fixed":true,"answerValue":733.75,"check":"1415 - 268.75 - 412.50","explanation":"The recovered items total 268.75 + 412.50 = 681.25, and 1,415.00 - 681.25 = $733.75. $681.25 is the value recovered, not the value still missing."},{"id":"ar-007","section":"arithmetic","subtype":"add-subtract","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"In March, the Wexley Township traffic unit issued 312 speeding citations, 148 seat-belt citations and 97 red-light citations. In April, the unit issued 489 citations in all. How many more citations did the unit issue in March than in April?","choices":["68","78","168","557"],"answer":0,"fixed":true,"answerValue":68,"check":"312 + 148 + 97 - 489","explanation":"March total: 312 + 148 + 97 = 557. Then 557 - 489 = 68. 557 is the March total, not the difference."},{"id":"ar-008","section":"arithmetic","subtype":"add-subtract","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"A police academy class starts with 135 recruits. During the first month 18 recruits withdraw and 9 are dismissed, and 6 recruits transfer in from another academy. How many recruits are in the class at the end of the month?","choices":["102","108","114","168"],"answer":2,"fixed":true,"answerValue":114,"check":"135 - 18 - 9 + 6","explanation":"135 - 18 - 9 = 108, and 108 + 6 = 114. 102 comes from subtracting the 6 transfers instead of adding them, and 108 leaves them out."},{"id":"ar-009","section":"arithmetic","subtype":"add-subtract","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"Detective Castillo seized three forged checks written for $1,275.40, $862.75 and $2,049.85. What is the total amount of the three checks?","choices":["$2,138.15","$3,325.25","$4,088.00","$4,178.00","$4,188.00"],"answer":4,"fixed":true,"answerValue":4188,"check":"1275.40 + 862.75 + 2049.85","explanation":"1,275.40 + 862.75 = 2,138.15, and 2,138.15 + 2,049.85 = $4,188.00. $3,325.25 leaves out the $862.75 check."},{"id":"ar-010","section":"arithmetic","subtype":"add-subtract","families":["bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":null,"stem":"An equipment room had 264 radio batteries on Monday morning. On Monday 78 batteries were issued, on Tuesday 56 recharged batteries were returned, and on Wednesday 95 batteries were issued. How many batteries were in the equipment room after Wednesday?","choices":["147","157","186","242","493"],"answer":0,"fixed":true,"answerValue":147,"check":"264 - 78 + 56 - 95","explanation":"264 - 78 = 186; 186 + 56 = 242; 242 - 95 = 147. Stopping at 242 leaves out the batteries issued on Wednesday."},{"id":"ar-011","section":"arithmetic","subtype":"multiply-divide","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"The Ashby Glen Borough Police Department paid $1,416 for 24 identical flashlights. What was the cost of each flashlight?","choices":["$5.90","$49","$59","$69","$590"],"answer":2,"fixed":true,"answerValue":59,"check":"1416 / 24","explanation":"1,416 / 24 = 59, because 24 x 50 = 1,200 and 24 x 9 = 216, and 1,200 + 216 = 1,416. Each flashlight cost $59."},{"id":"ar-012","section":"arithmetic","subtype":"multiply-divide","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"Each of Marlow Township's 36 patrol cars must carry 12 road flares. Flares are sold in boxes of 48. How many boxes are needed to supply all 36 cars?","choices":["3 boxes","9 boxes","36 boxes","432 boxes"],"answer":1,"fixed":true,"answerValue":9,"check":"36 * 12 / 48","explanation":"36 x 12 = 432 flares are needed, and 432 / 48 = 9 boxes. 432 is the number of flares, not the number of boxes."},{"id":"ar-013","section":"arithmetic","subtype":"multiply-divide","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"At a firearms qualification, each of 28 officers fires 150 rounds of ammunition. How many rounds are fired in all?","choices":["420 rounds","2,800 rounds","2,940 rounds","4,100 rounds","4,200 rounds"],"answer":4,"fixed":true,"answerValue":4200,"check":"28 * 150","explanation":"28 x 100 = 2,800 and 28 x 50 = 1,400; 2,800 + 1,400 = 4,200 rounds. 2,800 leaves out the 50 rounds beyond the first 100."},{"id":"ar-014","section":"arithmetic","subtype":"multiply-divide","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"A shipment of 6,000 rounds of ammunition is divided equally among 4 squads. Each squad has 12 officers and divides its share equally among them. How many rounds does each officer receive?","choices":["125 rounds","375 rounds","500 rounds","1,500 rounds"],"answer":0,"fixed":true,"answerValue":125,"check":"6000 / 4 / 12","explanation":"6,000 / 4 = 1,500 rounds per squad, and 1,500 / 12 = 125 rounds per officer. 1,500 is one squad's share, not one officer's."},{"id":"ar-015","section":"arithmetic","subtype":"multiply-divide","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"A $2,340 grant is split equally among 9 community safety events. How much money does each event receive?","choices":["$26","$234","$260","$2,331"],"answer":2,"fixed":true,"answerValue":260,"check":"2340 / 9","explanation":"2,340 / 9 = 260, because 9 x 260 = 2,340. $26 is off by a factor of 10, and $2,331 comes from subtracting 9 instead of dividing by it."},{"id":"ar-016","section":"arithmetic","subtype":"multiply-divide","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"Quarry Bend Borough orders 15 ballistic vests at $685 each. What is the total cost of the order?","choices":["$700","$4,110","$6,850","$10,175","$10,275"],"answer":4,"fixed":true,"answerValue":10275,"check":"15 * 685","explanation":"685 x 10 = 6,850 and 685 x 5 = 3,425; 6,850 + 3,425 = $10,275. $6,850 is the cost of only 10 vests."},{"id":"ar-017","section":"arithmetic","subtype":"multiply-divide","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"A patrol fleet used 1,026 gallons of fuel over 27 days, using the same amount each day. How many gallons did the fleet use each day?","choices":["38 gallons","48 gallons","380 gallons","999 gallons"],"answer":0,"fixed":true,"answerValue":38,"check":"1026 / 27","explanation":"1,026 / 27 = 38, because 27 x 30 = 810 and 27 x 8 = 216, and 810 + 216 = 1,026. 999 comes from subtracting 27 instead of dividing by it."},{"id":"ar-018","section":"arithmetic","subtype":"multiply-divide","families":["bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":null,"stem":"In Brightwater Borough, the fine for an overweight truck is $35 for every 100 pounds over the weight limit. A truck weighs 41,800 pounds on a road with a 40,000-pound limit. What is the fine?","choices":["$630","$730","$1,463","$6,300","$14,630"],"answer":0,"fixed":true,"answerValue":630,"check":"(41800 - 40000) / 100 * 35","explanation":"The truck is 41,800 - 40,000 = 1,800 pounds over the limit, which is 18 groups of 100 pounds; 18 x 35 = $630. $14,630 comes from using the truck's full weight instead of the amount over the limit."},{"id":"ar-019","section":"arithmetic","subtype":"multiply-divide","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"Officer Tran drives 240 patrol miles in each week that she works. In a 52-week year she takes 4 weeks of vacation. How many patrol miles does she drive in the year?","choices":["960 miles","11,520 miles","12,480 miles","13,440 miles"],"answer":1,"fixed":true,"answerValue":11520,"check":"(52 - 4) * 240","explanation":"She works 52 - 4 = 48 weeks, and 48 x 240 = 11,520 miles. 12,480 is the result when the vacation weeks are not subtracted."},{"id":"ar-020","section":"arithmetic","subtype":"multiply-divide","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"Evidence technicians use 18 pairs of gloves each day. A box holds 90 pairs. How many days will 7 boxes of gloves last?","choices":["3.5 days","5 days","30 days","35 days","630 days"],"answer":3,"fixed":true,"answerValue":35,"check":"7 * 90 / 18","explanation":"7 x 90 = 630 pairs, and 630 / 18 = 35 days. 5 days is how long a single box lasts, and 630 is the number of pairs, not days."},{"id":"ar-021","section":"arithmetic","subtype":"table-list","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-ar-01","stem":"What is the total value of all five stolen items?","choices":["$846.00","$1,092.20","$1,231.00","$1,321.00","$1,331.00"],"answer":4,"fixed":true,"answerValue":1331,"check":"485.00 + 129.95 + 164.50 + 312.75 + 238.80","explanation":"485.00 + 129.95 = 614.95; adding 164.50 gives 779.45; adding 312.75 gives 1,092.20; adding 238.80 gives $1,331.00. $1,092.20 leaves out the air compressor."},{"id":"ar-022","section":"arithmetic","subtype":"table-list","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-ar-01","stem":"The mountain bicycle is recovered the next day. What is the total value of the four items that are still missing?","choices":["$846.00","$856.00","$946.00","$1,018.25","$1,331.00"],"answer":0,"fixed":true,"answerValue":846,"check":"129.95 + 164.50 + 312.75 + 238.80","explanation":"129.95 + 164.50 + 312.75 + 238.80 = $846.00, which is also 1,331.00 - 485.00. $1,331.00 still includes the bicycle, and $1,018.25 leaves out the tool chest instead of the bicycle."},{"id":"ar-023","section":"arithmetic","subtype":"table-list","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-ar-01","stem":"How much more is the most valuable item worth than the least valuable item?","choices":["$320.50","$355.05","$355.95","$614.95"],"answer":1,"fixed":true,"answerValue":355.05,"check":"485.00 - 129.95","explanation":"The bicycle ($485.00) is worth the most and the drill set ($129.95) is worth the least; 485.00 - 129.95 = $355.05. $320.50 compares the bicycle with the leaf blower, which is not the least valuable item."},{"id":"ar-024","section":"arithmetic","subtype":"table-list","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-ar-02","stem":"How many calls did the evening shift handle during the five days?","choices":["215 calls","235 calls","300 calls","310 calls"],"answer":3,"fixed":true,"answerValue":310,"check":"57 + 61 + 54 + 63 + 75","explanation":"57 + 61 = 118; adding 54 gives 172; adding 63 gives 235; adding 75 gives 310. 215 is the day shift's total, and 235 leaves out Friday."},{"id":"ar-025","section":"arithmetic","subtype":"table-list","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-ar-02","stem":"How many calls did the day shift handle on the four days other than Wednesday?","choices":["160 calls","170 calls","215 calls","260 calls"],"answer":1,"fixed":true,"answerValue":170,"check":"42 + 38 + 40 + 50","explanation":"42 + 38 + 40 + 50 = 170, which is also the day shift's five-day total of 215 minus Wednesday's 45. 215 still includes Wednesday."},{"id":"ar-026","section":"arithmetic","subtype":"table-list","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-ar-02","stem":"What was the average number of calls per day for the overnight shift?","choices":["25 calls","27 calls","31.25 calls","125 calls"],"answer":0,"fixed":true,"answerValue":25,"check":"(23 + 19 + 26 + 21 + 36) / 5","explanation":"23 + 19 + 26 + 21 + 36 = 125 calls, and 125 / 5 days = 25 calls per day. 125 is the total, not the average."},{"id":"ar-027","section":"arithmetic","subtype":"table-list","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-ar-03","stem":"How many miles was Unit 14 driven during the five days?","choices":["35 miles","420 miles","510 miles","520 miles"],"answer":3,"fixed":true,"answerValue":520,"check":"89 + 118 + 76 + 137 + 100","explanation":"89 + 118 = 207; adding 76 gives 283; adding 137 gives 420; adding 100 gives 520 miles. 420 leaves out Friday, and 35 is the total of the fuel column."},{"id":"ar-028","section":"arithmetic","subtype":"table-list","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-ar-03","stem":"On Thursday the car was on loan to another department. How many miles was Unit 14 driven on the other four days?","choices":["383 miles","393 miles","444 miles","520 miles","657 miles"],"answer":0,"fixed":true,"answerValue":383,"check":"89 + 118 + 76 + 100","explanation":"89 + 118 + 76 + 100 = 383, which is also 520 - 137. 444 leaves out Wednesday instead of Thursday, and 520 still includes Thursday."},{"id":"ar-029","section":"arithmetic","subtype":"table-list","families":["bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":"stim-ar-03","stem":"Wednesday was a half shift and is left out of the weekly average. What was the average number of miles driven per day on the other four days?","choices":["88.8 miles","104 miles","111 miles","130 miles"],"answer":2,"fixed":true,"answerValue":111,"check":"(89 + 118 + 137 + 100) / 4","explanation":"89 + 118 + 137 + 100 = 444 miles, and 444 / 4 = 111 miles per day. 104 is the average for all five days, and 130 divides the five-day total by 4."},{"id":"ar-030","section":"arithmetic","subtype":"table-list","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-ar-04","stem":"How many boxes of supplies are on hand in all?","choices":["51 boxes","59 boxes","69 boxes","876 boxes"],"answer":1,"fixed":true,"answerValue":59,"check":"14 + 9 + 22 + 6 + 8","explanation":"14 + 9 + 22 + 6 + 8 = 59 boxes. 51 leaves out the property tags, and 876 is the total of the items-per-box column."},{"id":"ar-031","section":"arithmetic","subtype":"table-list","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-ar-04","stem":"The boxes of glove pairs are moved to another building. How many boxes remain on hand?","choices":["27 boxes","37 boxes","45 boxes","59 boxes","81 boxes"],"answer":1,"fixed":true,"answerValue":37,"check":"14 + 9 + 6 + 8","explanation":"14 + 9 + 6 + 8 = 37 boxes, which is also 59 - 22. 59 still includes the glove boxes, and 45 leaves out the evidence bags instead."},{"id":"ar-032","section":"arithmetic","subtype":"table-list","families":["bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":"stim-ar-04","stem":"How many more individual property tags than individual evidence bags are on hand?","choices":["6","250","500","1,500","7,500"],"answer":2,"fixed":true,"answerValue":500,"check":"8 * 500 - 14 * 250","explanation":"There are 8 x 500 = 4,000 property tags and 14 x 250 = 3,500 evidence bags, and 4,000 - 3,500 = 500. 250 is only the difference between the items-per-box figures, and 6 is only the difference in boxes."},{"id":"ar-033","section":"arithmetic","subtype":"percent","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"Last week Cedar Hollow Township officers answered 240 calls. Traffic accidents made up 15% of the calls. How many of the calls were traffic accidents?","choices":["3.6 calls","12 calls","24 calls","36 calls","204 calls"],"answer":3,"fixed":true,"answerValue":36,"check":"240 * 15 / 100","explanation":"10% of 240 is 24 and 5% of 240 is 12, so 15% is 24 + 12 = 36 calls. 204 is the number of calls that were not traffic accidents."},{"id":"ar-034","section":"arithmetic","subtype":"percent","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"Last year 80 burglaries were reported in Fenwick Borough, and detectives cleared 28 of them. What percent of the burglaries were cleared?","choices":["28%","35%","52%","65%"],"answer":1,"fixed":true,"answerValue":35,"check":"28 * 100 / 80","explanation":"28 / 80 = 0.35, which is 35%. 65% is the share that was not cleared, and 28 is the number of cases, not the percent."},{"id":"ar-035","section":"arithmetic","subtype":"percent","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"Calls for service in Wexley Township rose from 400 in one month to 460 in the next month. What was the percent increase?","choices":["6%","13%","15%","60%","115%"],"answer":2,"fixed":true,"answerValue":15,"check":"(460 - 400) * 100 / 400","explanation":"The increase is 460 - 400 = 60 calls, and 60 / 400 = 0.15, or 15%. Dividing by 460 instead of the starting figure of 400 gives about 13%, and 60 is the number of calls, not the percent."},{"id":"ar-036","section":"arithmetic","subtype":"percent","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"Vehicle thefts in Stonemill Township fell from 125 last year to 95 this year. What was the percent decrease?","choices":["24%","30%","32%","76%"],"answer":0,"fixed":true,"answerValue":24,"check":"(125 - 95) * 100 / 125","explanation":"The drop is 125 - 95 = 30 thefts, and 30 / 125 = 0.24, or 24%. 30 is the number of thefts, not the percent, and 76% is this year's figure as a share of last year's."},{"id":"ar-037","section":"arithmetic","subtype":"percent","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"A pair of duty boots has a list price of $160. The department receives a 15% discount. What does the department pay for one pair?","choices":["$24","$136","$145","$184"],"answer":1,"fixed":true,"answerValue":136,"check":"160 - 160 * 15 / 100","explanation":"15% of 160 is 24, and 160 - 24 = $136. $24 is the amount of the discount, and $145 comes from subtracting 15 dollars instead of 15 percent."},{"id":"ar-038","section":"arithmetic","subtype":"percent","families":["bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":null,"stem":"Portable radios are priced at $320 each. A supplier gives a 25% discount on an order of 12 radios. What is the total cost of the order after the discount?","choices":["$240","$960","$2,880","$3,815","$3,840"],"answer":2,"fixed":true,"answerValue":2880,"check":"12 * 320 * 75 / 100","explanation":"12 x 320 = 3,840. The discount is 25% of 3,840 = 960, and 3,840 - 960 = $2,880. $960 is the discount itself, and $3,840 is the price before the discount."},{"id":"ar-039","section":"arithmetic","subtype":"percent","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"Officer Petrov made 45 arrests last quarter, and 60% of them were for misdemeanors. How many of the arrests were NOT for misdemeanors?","choices":["18 arrests","27 arrests","40 arrests","72 arrests"],"answer":0,"fixed":true,"answerValue":18,"check":"45 - 45 * 60 / 100","explanation":"60% of 45 is 27 misdemeanor arrests, so 45 - 27 = 18 were not for misdemeanors. 27 is the number that were for misdemeanors."},{"id":"ar-040","section":"arithmetic","subtype":"percent","families":["bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":null,"stem":"A detective unit was assigned 180 cases and cleared 126 of them. What percent of the cases were NOT cleared?","choices":["30%","43%","54%","70%"],"answer":0,"fixed":true,"answerValue":30,"check":"(180 - 126) * 100 / 180","explanation":"180 - 126 = 54 cases were not cleared, and 54 / 180 = 0.30, or 30%. 70% is the share that was cleared, and 54 is a number of cases, not a percent."},{"id":"ar-041","section":"arithmetic","subtype":"percent","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"Ashby Glen Borough's police equipment budget is $48,000. Five percent of the budget is set aside for training ammunition. How much money is set aside for training ammunition?","choices":["$240","$2,400","$9,600","$24,000"],"answer":1,"fixed":true,"answerValue":2400,"check":"48000 * 5 / 100","explanation":"10% of 48,000 is 4,800, and 5% is half of that, or $2,400. $9,600 comes from dividing by 5 instead of taking 5 percent."},{"id":"ar-042","section":"arithmetic","subtype":"percent","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"Of the 650 alarm calls that Quarry Bend Borough officers answered last year, 52 turned out to be actual break-ins. What percent of the alarm calls were actual break-ins?","choices":["0.8%","5.2%","8%","12.5%"],"answer":2,"fixed":true,"answerValue":8,"check":"52 * 100 / 650","explanation":"52 / 650 = 0.08, which is 8%. 12.5 comes from dividing 650 by 52, which is upside down, and 0.8% is off by a factor of 10."},{"id":"ar-043","section":"arithmetic","subtype":"percent","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"Marlow Township has 40 police officers and plans to increase that number by 15% next year. How many officers will the township have after the increase?","choices":["6 officers","34 officers","46 officers","55 officers"],"answer":2,"fixed":true,"answerValue":46,"check":"40 + 40 * 15 / 100","explanation":"15% of 40 is 6, and 40 + 6 = 46 officers. 6 is only the increase, and 55 comes from adding 15 officers instead of 15 percent."},{"id":"ar-044","section":"arithmetic","subtype":"percent","families":["bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":null,"stem":"This year Brightwater Borough officers issued 300 speeding citations, which is 20% more than they issued last year. How many speeding citations did they issue last year?","choices":["60","240","250","280","360"],"answer":2,"fixed":true,"answerValue":250,"check":"300 * 100 / 120","explanation":"This year's 300 is 120% of last year's number, so last year's number is 300 / 1.20 = 250 (check: 250 + 20% of 250 = 250 + 50 = 300). Taking 20% off 300 gives 240, which is wrong because the 20% is figured on last year's number."},{"id":"ar-045","section":"arithmetic","subtype":"average","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"Officer Delgado's response times to five calls were 6, 9, 4, 11 and 5 minutes. What was her average response time?","choices":["6 minutes","7 minutes","8.75 minutes","35 minutes"],"answer":1,"fixed":true,"answerValue":7,"check":"(6 + 9 + 4 + 11 + 5) / 5","explanation":"6 + 9 + 4 + 11 + 5 = 35 minutes, and 35 / 5 calls = 7 minutes. 35 is the total, not the average."},{"id":"ar-046","section":"arithmetic","subtype":"average","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"Officer Okafor wrote 62 citations during a five-day work week. He wrote 18 of them on Monday. What was the average number of citations he wrote per day on the other four days?","choices":["8.8","11","12.4","15.5","44"],"answer":1,"fixed":true,"answerValue":11,"check":"(62 - 18) / 4","explanation":"62 - 18 = 44 citations on the other four days, and 44 / 4 = 11 per day. 12.4 is the average for all five days, and 44 is the four-day total."},{"id":"ar-047","section":"arithmetic","subtype":"average","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"Over four weeks, a patrol squad made 12, 9, 15 and 8 impaired-driving arrests. What was the average number of arrests per week?","choices":["8.8 arrests","10 arrests","11 arrests","44 arrests"],"answer":2,"fixed":true,"answerValue":11,"check":"(12 + 9 + 15 + 8) / 4","explanation":"12 + 9 + 15 + 8 = 44 arrests, and 44 / 4 weeks = 11 per week. 44 is the total, not the average."},{"id":"ar-048","section":"arithmetic","subtype":"average","families":["bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":null,"stem":"The average response time for four calls was 8 minutes. Three of the calls took 6, 7 and 10 minutes. How long did the fourth call take?","choices":["5.75 minutes","7.75 minutes","8 minutes","9 minutes","23 minutes"],"answer":3,"fixed":true,"answerValue":9,"check":"4 * 8 - (6 + 7 + 10)","explanation":"Four calls averaging 8 minutes total 4 x 8 = 32 minutes. The three known calls total 6 + 7 + 10 = 23 minutes, so the fourth call took 32 - 23 = 9 minutes. 8 is the average, not the missing time."},{"id":"ar-049","section":"arithmetic","subtype":"average","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"Officer Whitfield drove 96, 112, 88 and 104 miles on four shifts. What was the average number of miles she drove per shift?","choices":["74 miles","80 miles","90 miles","100 miles"],"answer":3,"fixed":true,"answerValue":100,"check":"(96 + 112 + 88 + 104) / 4","explanation":"96 + 112 + 88 + 104 = 400 miles, and 400 / 4 shifts = 100 miles per shift. 74 leaves the 104-mile shift out of the total but still divides by 4."},{"id":"ar-050","section":"arithmetic","subtype":"average","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"A squad handled 315 calls during a seven-day week. A festival on Saturday accounted for 87 of those calls. What was the average number of calls per day on the other six days?","choices":["38 calls","45 calls","52.5 calls","228 calls"],"answer":0,"fixed":true,"answerValue":38,"check":"(315 - 87) / 6","explanation":"315 - 87 = 228 calls on the other six days, and 228 / 6 = 38 per day. 45 is the average for all seven days, Saturday included."},{"id":"ar-051","section":"arithmetic","subtype":"average","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"Three theft victims reported losses of $145, $230 and $90. What was the average loss?","choices":["$116.25","$145","$155","$232.50","$465"],"answer":2,"fixed":true,"answerValue":155,"check":"(145 + 230 + 90) / 3","explanation":"145 + 230 + 90 = 465, and 465 / 3 = $155. $465 is the total loss, not the average, and $145 is simply the middle amount."},{"id":"ar-052","section":"arithmetic","subtype":"average","families":["bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":null,"stem":"During a 10-day period, Officer Park averaged 14 calls per day for the first 6 days and 9 calls per day for the last 4 days. What was his average number of calls per day for the whole 10 days?","choices":["1.2 calls","2.3 calls","11.5 calls","12 calls"],"answer":3,"fixed":true,"answerValue":12,"check":"(6 * 14 + 4 * 9) / 10","explanation":"The first 6 days total 6 x 14 = 84 calls and the last 4 days total 4 x 9 = 36 calls; 84 + 36 = 120 calls, and 120 / 10 = 12 per day. 11.5 simply averages 14 and 9 and ignores that the two periods are different lengths."},{"id":"ar-053","section":"arithmetic","subtype":"time-distance-speed","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"A patrol car travels at a constant speed of 54 miles per hour for 2 hours and 30 minutes. How far does it travel?","choices":["21.6 miles","108 miles","124.2 miles","135 miles"],"answer":3,"fixed":true,"answerValue":135,"check":"54 * 2.5","explanation":"2 hours 30 minutes is 2.5 hours, and 54 x 2.5 = 108 + 27 = 135 miles. 124.2 comes from treating 2 hours 30 minutes as 2.3 hours, and 108 leaves out the half hour."},{"id":"ar-054","section":"arithmetic","subtype":"time-distance-speed","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"A backup unit is 12 miles from a scene and drives there at a constant speed of 48 miles per hour. How many minutes will it take the unit to arrive?","choices":["4 minutes","15 minutes","25 minutes","36 minutes"],"answer":1,"fixed":true,"answerValue":15,"check":"12 * 60 / 48","explanation":"12 / 48 = 0.25 hour, and 0.25 x 60 = 15 minutes. 25 comes from reading 0.25 hour as 25 minutes."},{"id":"ar-055","section":"arithmetic","subtype":"time-distance-speed","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"During an 8-hour shift, Officer Lindqvist spends 6.5 hours driving on patrol and the rest of the shift writing reports. While driving she averages 22 miles per hour. How many miles does she drive during the shift?","choices":["33 miles","132 miles","143 miles","176 miles"],"answer":2,"fixed":true,"answerValue":143,"check":"6.5 * 22","explanation":"6 x 22 = 132, and half an hour adds 11 more; 132 + 11 = 143 miles. 176 uses all 8 hours of the shift instead of the 6.5 hours spent driving."},{"id":"ar-056","section":"arithmetic","subtype":"time-distance-speed","families":["bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":null,"stem":"A cruiser covers 21 miles in 28 minutes at a constant speed. What is its speed in miles per hour?","choices":["45 miles per hour","49 miles per hour","75 miles per hour","80 miles per hour"],"answer":0,"fixed":true,"answerValue":45,"check":"21 * 60 / 28","explanation":"21 miles in 28 minutes is 21 / 28 = 0.75 mile per minute, and 0.75 x 60 = 45 miles per hour. 80 comes from dividing 28 by 21, which is upside down."},{"id":"ar-057","section":"arithmetic","subtype":"time-distance-speed","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"A vehicle travels at a constant speed of 60 miles per hour. How far does it travel in 20 minutes?","choices":["3 miles","20 miles","30 miles","180 miles","1,200 miles"],"answer":1,"fixed":true,"answerValue":20,"check":"60 * 20 / 60","explanation":"20 minutes is one-third of an hour, and one-third of 60 miles is 20 miles. 1,200 comes from multiplying 60 by 20 without changing the minutes to hours."},{"id":"ar-058","section":"arithmetic","subtype":"time-distance-speed","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"Two officers transport a prisoner to a county facility 78 miles away, driving at a constant speed of 52 miles per hour. How many hours does the trip take?","choices":["0.67 hours","1.26 hours","1.5 hours","26 hours"],"answer":2,"fixed":true,"answerValue":1.5,"check":"78 / 52","explanation":"78 / 52 = 1.5 hours. 1.26 comes from writing the remainder of 26 as a decimal, and 26 comes from subtracting instead of dividing."},{"id":"ar-059","section":"arithmetic","subtype":"time-distance-speed","families":["bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":null,"stem":"Officer Yusuf drives for 30 minutes at a constant 40 miles per hour, then for 15 minutes at a constant 60 miles per hour. How many miles does he drive in all?","choices":["35 miles","37.5 miles","50 miles","75 miles","100 miles"],"answer":0,"fixed":true,"answerValue":35,"check":"40 * 30 / 60 + 60 * 15 / 60","explanation":"30 minutes at 40 miles per hour is 20 miles, and 15 minutes at 60 miles per hour is 15 miles; 20 + 15 = 35 miles. 37.5 comes from averaging the two speeds, which ignores that he spent longer at the slower speed."},{"id":"ar-060","section":"arithmetic","subtype":"time-distance-speed","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"An officer on foot patrol walks at a constant speed of 3 miles per hour. How far does the officer walk in 40 minutes?","choices":["1.2 miles","2 miles","7.5 miles","120 miles"],"answer":1,"fixed":true,"answerValue":2,"check":"3 * 40 / 60","explanation":"40 minutes is two-thirds of an hour, and two-thirds of 3 miles is 2 miles. 1.2 comes from treating 40 minutes as 0.4 hour."},{"id":"ar-061","section":"arithmetic","subtype":"time-distance-speed","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"A patrol car is driven an average of 85 miles per shift. It is used for 3 shifts a day, 7 days a week. How many miles is the car driven in one week?","choices":["255 miles","595 miles","1,685 miles","1,785 miles"],"answer":3,"fixed":true,"answerValue":1785,"check":"85 * 3 * 7","explanation":"3 shifts x 7 days = 21 shifts, and 85 x 21 = 1,700 + 85 = 1,785 miles. 595 counts only one shift a day."},{"id":"ar-062","section":"arithmetic","subtype":"time-distance-speed","families":["bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":null,"stem":"An escort detail must travel 36 miles to a hospital at a constant speed of 54 miles per hour. How many minutes will the trip take?","choices":["0.67 minutes","18 minutes","32.4 minutes","40 minutes","90 minutes"],"answer":3,"fixed":true,"answerValue":40,"check":"36 * 60 / 54","explanation":"36 / 54 = 2/3 of an hour, and 2/3 of 60 minutes is 40 minutes. 90 comes from dividing 54 by 36, which is upside down, and 0.67 is the time in hours, not minutes."},{"id":"ar-063","section":"arithmetic","subtype":"elapsed-time","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"Officer Goldberg was dispatched to a call at 9:47 a.m. and cleared the call at 11:22 a.m. the same morning. How many minutes did the call take?","choices":["85 minutes","95 minutes","145 minutes","175 minutes"],"answer":1,"fixed":true,"answerValue":95,"check":"(11 * 60 + 22) - (9 * 60 + 47)","explanation":"From 9:47 to 10:47 is 60 minutes, and from 10:47 to 11:22 is 35 more; 60 + 35 = 95 minutes. 175 comes from subtracting 947 from 1,122 as if they were ordinary numbers."},{"id":"ar-064","section":"arithmetic","subtype":"elapsed-time","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"An overnight shift begins at 10:30 p.m. and ends at 7:00 a.m. the next morning. How many hours long is the shift?","choices":["3.5 hours","7.5 hours","8.3 hours","8.5 hours"],"answer":3,"fixed":true,"answerValue":8.5,"check":"(24 * 60 - (22 * 60 + 30) + 7 * 60) / 60","explanation":"From 10:30 p.m. to midnight is 1.5 hours, and from midnight to 7:00 a.m. is 7 hours; 1.5 + 7 = 8.5 hours. 8.3 mistakes 30 minutes for 0.3 hour, and 3.5 ignores the change of day."},{"id":"ar-065","section":"arithmetic","subtype":"elapsed-time","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"A traffic detail starts at 6:45 a.m. and ends at 2:30 p.m. the same day. How many hours does the detail last?","choices":["4.25 hours","7.25 hours","7.45 hours","7.75 hours"],"answer":3,"fixed":true,"answerValue":7.75,"check":"((14 * 60 + 30) - (6 * 60 + 45)) / 60","explanation":"From 6:45 a.m. to 2:45 p.m. would be 8 hours; the detail ends 15 minutes sooner, so it lasts 7 hours 45 minutes, which is 7.75 hours. 7.45 mistakes 45 minutes for 0.45 hour."},{"id":"ar-066","section":"arithmetic","subtype":"elapsed-time","families":["bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":null,"stem":"A surveillance detail begins at 11:40 p.m. and ends at 2:25 a.m. the next morning. How many minutes does the detail last?","choices":["105 minutes","145 minutes","165 minutes","555 minutes"],"answer":2,"fixed":true,"answerValue":165,"check":"(24 * 60 - (23 * 60 + 40)) + (2 * 60 + 25)","explanation":"From 11:40 p.m. to midnight is 20 minutes, and from midnight to 2:25 a.m. is 145 minutes; 20 + 145 = 165 minutes. 145 leaves out the 20 minutes before midnight."},{"id":"ar-067","section":"arithmetic","subtype":"elapsed-time","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"Officer Abernathy is on duty from 7:00 a.m. to 3:30 p.m. and takes a 45-minute unpaid meal break. For how many minutes is she paid?","choices":["465 minutes","510 minutes","525 minutes","555 minutes"],"answer":0,"fixed":true,"answerValue":465,"check":"((15 * 60 + 30) - 7 * 60) - 45","explanation":"7:00 a.m. to 3:30 p.m. is 8.5 hours, or 510 minutes, and 510 - 45 = 465 minutes. 510 leaves the meal break in, and 555 adds the break instead of subtracting it."},{"id":"ar-068","section":"arithmetic","subtype":"elapsed-time","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"Officer Mbeki spent 1 hour 35 minutes at a crash scene, 50 minutes at a hospital and 2 hours 10 minutes writing reports. How many minutes did the three tasks take in all?","choices":["95 minutes","215 minutes","265 minutes","275 minutes"],"answer":3,"fixed":true,"answerValue":275,"check":"(60 + 35) + 50 + (2 * 60 + 10)","explanation":"1 hour 35 minutes is 95 minutes and 2 hours 10 minutes is 130 minutes; 95 + 50 + 130 = 275 minutes. 95 adds only the minutes and ignores the 3 full hours."},{"id":"ar-069","section":"arithmetic","subtype":"overtime-pay","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"Officer Kowalski is paid $34.50 per hour for an 8-hour special detail. How much does he earn for the detail?","choices":["$27.60","$42.50","$272","$276"],"answer":3,"fixed":true,"answerValue":276,"check":"34.50 * 8","explanation":"34 x 8 = 272, and 0.50 x 8 = 4; 272 + 4 = $276. $272 leaves out the 50 cents per hour."},{"id":"ar-070","section":"arithmetic","subtype":"overtime-pay","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"Officer Reyes's regular pay rate is $28 per hour. Overtime is paid at time and a half (1.5 times the regular rate). What is her overtime rate per hour?","choices":["$14","$29.50","$42","$56"],"answer":2,"fixed":true,"answerValue":42,"check":"28 * 1.5","explanation":"Half of 28 is 14, and 28 + 14 = $42 per hour. $14 is only the extra half, and $56 would be double time."},{"id":"ar-071","section":"arithmetic","subtype":"overtime-pay","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"Officer O'Brien's regular pay rate is $30 per hour. He works 6 hours of overtime, which is paid at time and a half (1.5 times the regular rate). How much overtime pay does he earn?","choices":["$45","$90","$180","$270"],"answer":3,"fixed":true,"answerValue":270,"check":"30 * 1.5 * 6","explanation":"The overtime rate is 30 x 1.5 = $45 per hour, and 45 x 6 = $270. $180 pays the 6 hours at the regular rate, and $45 is the rate for a single hour."},{"id":"ar-072","section":"arithmetic","subtype":"overtime-pay","families":["bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":null,"stem":"Officer Vasquez earns $26 per hour for the first 40 hours she works in a week and time and a half (1.5 times the regular rate) for every hour over 40. Last week she worked 48 hours. What was her total pay for the week?","choices":["$312","$1,040","$1,248","$1,352","$1,456"],"answer":3,"fixed":true,"answerValue":1352,"check":"40 * 26 + 8 * 26 * 1.5","explanation":"Regular pay is 40 x 26 = 1,040 and overtime pay is 8 hours x $39 = 312; 1,040 + 312 = $1,352. $1,248 pays all 48 hours at the regular rate, and $312 is the overtime alone."},{"id":"ar-073","section":"arithmetic","subtype":"overtime-pay","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"Officer Banerjee's regular pay rate is $36 per hour. For a court appearance on his day off he is paid for 3 hours at time and a half (1.5 times the regular rate). How much is he paid for the appearance?","choices":["$54","$108","$126","$162"],"answer":3,"fixed":true,"answerValue":162,"check":"36 * 1.5 * 3","explanation":"The overtime rate is 36 x 1.5 = $54 per hour, and 54 x 3 = $162. $108 pays the 3 hours at the regular rate, and $54 is the rate for a single hour."},{"id":"ar-074","section":"arithmetic","subtype":"overtime-pay","families":["bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":null,"stem":"Officer Lambert's regular pay rate is $24 per hour, and overtime is paid at time and a half (1.5 times the regular rate). Her overtime pay for one pay period was $432. How many hours of overtime did she work?","choices":["9 hours","12 hours","18 hours","36 hours"],"answer":1,"fixed":true,"answerValue":12,"check":"432 / (24 * 1.5)","explanation":"The overtime rate is 24 x 1.5 = $36 per hour, and 432 / 36 = 12 hours. 18 comes from dividing by the regular rate of $24, and 36 is the overtime rate, not a number of hours."},{"id":"ar-075","section":"arithmetic","subtype":"unit-conversion","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"Skid marks at a crash scene measure 54 yards. There are 3 feet in 1 yard. How long are the skid marks in feet?","choices":["18 feet","51 feet","57 feet","162 feet"],"answer":3,"fixed":true,"answerValue":162,"check":"54 * 3","explanation":"Each yard is 3 feet, so 54 x 3 = 162 feet. 18 comes from dividing by 3, which would change feet to yards instead."},{"id":"ar-076","section":"arithmetic","subtype":"unit-conversion","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"A foot pursuit covered one-quarter of a mile. There are 5,280 feet in 1 mile. How many feet did the pursuit cover?","choices":["1,320 feet","1,760 feet","2,640 feet","21,120 feet"],"answer":0,"fixed":true,"answerValue":1320,"check":"5280 / 4","explanation":"One-quarter of 5,280 is 5,280 / 4 = 1,320 feet. 2,640 is half a mile, and 21,120 comes from multiplying by 4 instead of dividing."},{"id":"ar-077","section":"arithmetic","subtype":"unit-conversion","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"A seized package weighs 3 pounds 4 ounces. What is its weight in ounces?","choices":["7 ounces","34 ounces","40 ounces","48 ounces","52 ounces"],"answer":4,"fixed":true,"answerValue":52,"check":"3 * 16 + 4","explanation":"There are 16 ounces in a pound, so 3 pounds is 48 ounces, and 48 + 4 = 52 ounces. 48 leaves out the extra 4 ounces, and 40 uses 12 ounces to the pound."},{"id":"ar-078","section":"arithmetic","subtype":"unit-conversion","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"An officer logged 435 minutes of in-service training. How many hours is that?","choices":["4.35 hours","7.15 hours","7.25 hours","43.5 hours"],"answer":2,"fixed":true,"answerValue":7.25,"check":"435 / 60","explanation":"435 / 60 = 7 with 15 minutes left over, and 15 minutes is 0.25 hour, so the answer is 7.25 hours. 7.15 mistakes 15 minutes for 0.15 hour."},{"id":"ar-079","section":"arithmetic","subtype":"unit-conversion","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"A witness describes a suspect as 5 feet 10 inches tall. What is that height in inches?","choices":["15 inches","60 inches","70 inches","510 inches"],"answer":2,"fixed":true,"answerValue":70,"check":"5 * 12 + 10","explanation":"There are 12 inches in a foot, so 5 feet is 60 inches, and 60 + 10 = 70 inches. 60 leaves out the extra 10 inches."},{"id":"ar-080","section":"arithmetic","subtype":"unit-conversion","families":["bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":null,"stem":"Officers tape off a square area that measures 45 feet on each side, running one strip of barrier tape along all four sides. There are 3 feet in 1 yard. How many yards of tape are needed?","choices":["15 yards","60 yards","135 yards","180 yards","540 yards"],"answer":1,"fixed":true,"answerValue":60,"check":"4 * 45 / 3","explanation":"Four sides of 45 feet total 4 x 45 = 180 feet, and 180 / 3 = 60 yards. 15 converts only one side, and 180 is the length in feet, not yards."},{"id":"rw-001","section":"report","subtype":"form-sentence","families":["bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":"stim-rw-01","format":"written","stem":"Where did the incident occur?","model":["The incident occurred at 2260 Fenwick Avenue.","The incident took place at 2260 Fenwick Avenue."],"must":["2260 Fenwick Avenue"],"explanation":"The address of incident on the form is 2260 Fenwick Avenue. Credit requires the correct fact in a complete sentence with correct grammar and spelling, so copy the street name exactly; the address written alone is a fragment."},{"id":"rw-002","section":"report","subtype":"form-sentence","families":["bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":"stim-rw-01","format":"written","stem":"When did the incident occur?","model":["The incident occurred on March 14, 2026, at 4:25 PM.","The incident occurred at 4:25 PM on March 14, 2026."],"must":["March 14, 2026","4:25 PM"],"explanation":"The form gives the date as March 14, 2026, and the tim
