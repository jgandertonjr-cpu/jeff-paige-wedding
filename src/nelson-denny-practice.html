<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Nelson-Denny Reading Test — Practice Tool</title>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#1c2430; --muted:#5b6675; --line:#e2e6ec;
  --accent:#2563eb; --accent-ink:#ffffff;
  --ok:#15803d; --ok-bg:#dcfce7; --no:#b91c1c; --no-bg:#fee2e2;
  --warn:#b45309; --warn-bg:#fef3c7; --danger:#dc2626; --danger-bg:#fee2e2;
  --radius:12px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f141a; --card:#171e26; --ink:#e6eaf0; --muted:#93a0b0; --line:#29323d;
    --accent:#3b82f6; --accent-ink:#0b1016;
    --ok:#4ade80; --ok-bg:#0f2a1a; --no:#f87171; --no-bg:#2c1416;
    --warn:#f59e0b; --warn-bg:#2a2109; --danger:#ef4444; --danger-bg:#2c1416;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
}
.topbar{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
  padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line);
}
.brand{
  font-weight:700; font-size:16px; background:none; border:0; color:var(--ink); cursor:pointer; padding:4px 6px;
}
.brand:hover{color:var(--accent)}
.spacer{flex:1}
.top-right{font-size:13px; color:var(--muted); text-align:right}
.wrap{max-width:820px; margin:0 auto; padding:20px 16px 64px}
h1{font-size:22px; margin:0 0 4px}
h2{font-size:18px; margin:22px 0 10px}
h3{font-size:16px; margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; margin-bottom:14px;
}
.btn{
  display:inline-block; font:inherit; font-weight:600; cursor:pointer;
  border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:10px 16px; border-radius:10px;
}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn-primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-danger{color:var(--no); border-color:var(--no)}
.btn-block{display:block; width:100%; text-align:center}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.btn-row{display:flex; flex-wrap:wrap; gap:10px}
.link{background:none; border:0; color:var(--accent); cursor:pointer; padding:0; font:inherit; text-decoration:underline}

.count{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.count .num{font-size:44px; font-weight:800; line-height:1; color:var(--accent)}
.stats{display:flex; flex-wrap:wrap; gap:10px; margin-top:6px}
.stat{flex:1 1 120px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px}
.stat .n{font-size:22px; font-weight:700}
.stat .l{font-size:12px; color:var(--muted)}

.modes{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.mode{
  text-align:left; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; cursor:pointer; color:var(--ink); font:inherit;
}
.mode:hover{border-color:var(--accent)}
.mode h3{margin-bottom:4px}
.mode p{margin:0; font-size:13px; color:var(--muted)}

.field{margin:12px 0}
.field label{display:block; font-weight:600; margin-bottom:6px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden}
.seg button{font:inherit; padding:8px 14px; background:var(--card); color:var(--ink); border:0; border-left:1px solid var(--line); cursor:pointer}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent); color:var(--accent-ink)}
.toggle{display:flex; align-items:center; gap:8px; margin:10px 0}
.toggle input{width:18px; height:18px}
select.grade{font:inherit; padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink)}

.qhead{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px}
.qnum{font-size:13px; color:var(--muted); font-weight:600}
.tag{font-size:11px; text-transform:uppercase; letter-spacing:.04em; font-weight:700; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 8px}
.qtext{font-size:17px; margin:8px 0 12px}
.vstem{font-weight:800}
.choices{display:flex; flex-direction:column; gap:8px}
.choice{
  display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%;
  background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px 12px;
  cursor:pointer; font:inherit; color:var(--ink);
}
.choice:hover{border-color:var(--accent)}
.choice .k{font-weight:700; color:var(--muted); min-width:18px}
.choice.sel{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.choice.correct{border-color:var(--ok); background:var(--ok-bg)}
.choice.wrong{border-color:var(--no); background:var(--no-bg)}
.choice[disabled]{cursor:default}
.feedback{margin-top:12px; font-weight:700}
.feedback.ok{color:var(--ok)}
.feedback.no{color:var(--no)}
.explain{margin-top:4px; font-weight:400; color:var(--ink)}

.passage h3{margin-bottom:2px}
.passage .domain{font-size:12px; color:var(--muted); margin-bottom:10px}
.passage p{font-size:15px}

.prog{height:6px; background:var(--line); border-radius:999px; overflow:hidden; margin-bottom:14px}
.prog > i{display:block; height:100%; background:var(--accent)}

.timerbar{
  position:sticky; top:52px; z-index:10; display:flex; align-items:center; justify-content:space-between;
  gap:10px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:14px;
}
.timer{font-variant-numeric:tabular-nums; font-weight:800; font-size:20px}
.timer.warn{color:var(--warn)}
.timer.danger{color:var(--danger); animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}

.navgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(38px,1fr)); gap:6px; margin:12px 0}
.navgrid button{
  font:inherit; font-size:13px; padding:8px 0; border-radius:8px; border:1px solid var(--line);
  background:var(--card); color:var(--ink); cursor:pointer;
}
.navgrid button.on{border-color:var(--accent); background:color-mix(in srgb,var(--accent) 14%, var(--card))}
.navgrid button.cur{outline:2px solid var(--accent); outline-offset:1px}

.ratelines{border:1px solid var(--line); border-radius:10px; padding:6px; margin:12px 0}
.rateline{
  display:block; width:100%; text-align:left; font:inherit; font-size:16px; line-height:1.7;
  background:none; border:0; border-radius:6px; color:var(--ink); cursor:pointer; padding:2px 8px;
}
.rateline:hover{background:color-mix(in srgb,var(--accent) 10%, transparent)}
.rateline .ln{color:var(--muted); font-size:12px; display:inline-block; min-width:26px}
.rateline.picked{background:var(--ok-bg); border:1px solid var(--ok)}
.rateline.after{opacity:.38}

.banner{background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn); border-radius:10px; padding:10px 12px; margin-bottom:12px; font-weight:700}
.disclaimer{border-left:3px solid var(--line); padding:6px 0 6px 12px; color:var(--muted); font-size:13px; margin:10px 0}

.tbl{width:100%; border-collapse:collapse; font-size:14px}
.tbl th,.tbl td{text-align:left; padding:7px 8px; border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted); font-weight:600}
.tbl td.r,.tbl th.r{text-align:right}

.scoreline{font-size:30px; font-weight:800}
.pill{display:inline-block; font-weight:700; border-radius:999px; padding:3px 10px; font-size:13px}
.pill.ok{background:var(--ok-bg); color:var(--ok)}
.pill.no{background:var(--warn-bg); color:var(--warn)}

details{border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-top:10px}
summary{cursor:pointer; font-weight:600}
.rev-item{padding:10px 0; border-bottom:1px solid var(--line); font-size:14px}
.rev-item:last-child{border-bottom:0}
.rev-yours.bad{color:var(--no)}
.rev-yours.good{color:var(--ok)}

.foot{margin-top:26px; font-size:12px; color:var(--muted)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);border:0}

@media (max-width:640px){
  .wrap{padding:16px 12px 56px}
  .modes{grid-template-columns:1fr}
  .count .num{font-size:36px}
  .timerbar{top:50px}
  .timer{font-size:18px}
}
</style>
</head>

  <button class="brand" id="brandBtn">📖 Nelson-Denny Practice</button>
  <div class="spacer"></div>

<main class="wrap" id="app"></main>

  text:
"The human immune system learns from experience. When a virus or bacterium enters the body for the first time, the immune system needs several days to identify the invader, build defenses against it, and bring those defenses to full strength. During that delay the pathogen multiplies freely, and the person often becomes ill. If the body survives the encounter, it keeps a molecular memory of the intruder. A second exposure to the same pathogen triggers a response that is faster and stronger, and the person may notice no symptoms at all.\n\n"+
"A vaccine takes advantage of this memory without requiring a dangerous first infection. Most vaccines introduce a harmless piece or version of a pathogen: a weakened virus, a killed bacterium, a single surface protein, or a set of instructions that tells the body's own cells to make that protein briefly. None of these can cause the disease, but each carries the distinctive molecular shapes, called antigens, that the immune system uses for recognition. Specialized cells engulf the material, display its fragments, and present them to roving white blood cells. The white cells that happen to match the antigen begin to multiply.\n\n"+
"Two products of that response matter most. Antibodies, which circulate in the blood and stick to a specific antigen, can block a pathogen from entering cells and can flag it for destruction. Memory cells, which can persist for years, stand ready to launch antibody production quickly if the real pathogen ever appears. The first vaccine dose produces a modest, short-lived reaction; booster doses, spaced weeks or months apart, push the memory response to a higher and more durable level. This is why many vaccine schedules call for more than one shot.\n\n"+

  text:
"In 1964 the killing of a woman outside her apartment building in New York, reportedly witnessed by numerous neighbors who did not call for help, prompted psychologists to ask a hard question: does the presence of other people make an individual less likely to assist someone in trouble? Early news coverage of the case was later shown to be exaggerated, but the research it inspired has held up well.\n\n"+
"In a series of experiments, John Darley and Bibb Latane placed volunteers in situations that seemed to call for help: smoke curling from a vent, a stranger crying out as if injured, a staged seizure heard over an intercom. The researchers varied one thing — how many other people the volunteer believed were present. The result was consistent. A person who thought they were the only witness usually acted, and acted quickly. A person who believed several others were also aware of the emergency was slower to respond, and often did nothing.\n\n"+
"Darley and Latane explained the pattern with two ideas. The first is diffusion of responsibility: when others are available to act, each individual feels a smaller personal share of the duty to intervene, and assumes someone else will. The second is pluralistic ignorance: people look to those around them to decide whether a situation is truly an emergency, and if everyone is staying calm and waiting, each observer concludes that nothing serious is happening. The two forces reinforce each other, and the larger the group, the stronger their combined pull.\n\n"+
"Later work has refined the picture. The effect weakens when the need for help is unmistakable, when the victim and bystander share a group identity, and when at least one person breaks from the crowd and takes visible action. Training also helps: people who have learned about the bystander effect are measurably more likely to step forward. That last finding is the practical payoff of the research. Knowing that the presence of a crowd can quietly suppress your impulse to help makes it easier to recognize the hesitation for what it is, and to act anyway.",

  text:
"For most of the Middle Ages, European painters showed space in ways that look, to modern eyes, slightly wrong. Figures stood on tilted floors. Buildings in the background loomed as large as those in front. Objects were sized according to their importance rather than their distance, so a saint might tower over the city behind him. These were not mistakes in the ordinary sense. Medieval painters were following a different set of rules, in which a picture was a symbolic arrangement rather than a window onto a scene.\n\n"+
"In early fifteenth-century Florence, that changed. The architect Filippo Brunelleschi worked out a geometric method for representing depth on a flat surface, and the painter Masaccio applied it to a wall. The method, known as linear perspective, rests on a simple observation: parallel lines running away from the viewer appear to converge, and if extended they would meet at a single point on the horizon, the vanishing point. Floor tiles, ceiling beams, and the edges of buildings could all be drawn toward that point. Figures and objects were then reduced in size at a steady rate as they receded. The result was a painted space that behaved, more or less, like the space people actually saw.\n\n"+
"The new technique spread quickly, carried by written treatises that laid out the geometry step by step. Leon Battista Alberti's short book of 1435 told painters to imagine the picture surface as a pane of glass through which the scene was viewed, and to build everything behind that pane according to measured proportion. Within a generation, perspective construction was a standard part of a painter's training across Italy, and later across Europe.\n\n"+

{
  id:"p_tardigrade", domain:"Science", title:"Life on Pause: The Tardigrade",
  text:
"Tardigrades, sometimes called water bears, are among the toughest animals known. They are also tiny: most are less than a millimeter long, with eight stubby legs and a slow, lumbering walk that earned them their nickname. They live almost everywhere there is a film of water, from ocean sediment to mountain glaciers, but the place most people meet them is a cushion of damp moss on a garden wall.\n\n"+
"What makes tardigrades remarkable is not where they live but what they can survive. When their surroundings dry out, a tardigrade does not die. Instead it pulls in its legs, forces most of the water from its body, and curls into a barrel-shaped form called a tun. In this state its metabolism falls to less than one percent of normal, sometimes so low that it cannot be measured at all. The animal is not quite alive in the usual sense, and not dead. Biologists call the condition cryptobiosis, meaning hidden life.\n\n"+
"A tardigrade in a tun can endure conditions that would destroy almost any active organism. Laboratory tests have exposed tuns to temperatures near absolute zero and above the boiling point of water, to pressures far greater than those in the deepest ocean trench, and to doses of radiation hundreds of times higher than a person could survive. In one experiment, tardigrades were carried outside a spacecraft and exposed to the vacuum and ultraviolet glare of open space for ten days. Many revived once they were back on Earth and given water.\n\n"+
"The protection seems to come partly from special molecules that take the place of lost water and hold the animal's cell structures in position, forming a kind of glassy scaffold inside each cell. When water returns, the scaffold dissolves, the machinery of the cell restarts, and within hours the tardigrade is walking and feeding again. A tun may remain able to revive for years, and there are disputed reports of much longer spans.\n\n"+
"None of this makes tardigrades indestructible. In their active, watery state they are as fragile as any other small animal, and easily killed. Their gift is narrower and stranger: the ability to switch themselves off, wait out the bad times, and switch back on.",

{
  id:"p_leaves", domain:"Science", title:"Why Leaves Turn",
  text:
"A green leaf is a solar factory. Inside it are millions of tiny structures packed with chlorophyll, the pigment that captures sunlight and drives the chemistry that feeds the tree. Chlorophyll is abundant through the growing season, and its strong green masks the other pigments that are also present in the leaf.\n\n"+
"Those other pigments fall into two main groups. Carotenoids produce yellow and orange; they sit in the leaf all summer, quietly helping to gather light, but they are hidden by the green. Anthocyanins are different. Most trees make them only in late summer and autumn, and in many species they are not present until the days shorten.\n\n"+
"The turn begins with light and temperature, not with cold snaps alone. As nights lengthen, a tree registers the change and starts to prepare for winter. It grows a thin layer of cells, the abscission layer, across the base of each leaf stalk. This layer gradually seals the leaf off from the tree's plumbing. With the supply lines closing, the leaf stops making new chlorophyll, and the chlorophyll already there breaks down. The green fades, and the yellows and oranges of the carotenoids show through at last.\n\n"+
"Red and purple are a later story. When sugars made in the leaf can no longer flow back into the tree, they build up, and in bright light some trees convert those trapped sugars into red anthocyanins. This is why a cold, sunny autumn tends to produce the most vivid reds, while a warm, cloudy one leaves the display muted. A wet growing season, an early frost, or a windy storm can each cut the show short.\n\n"+
"Eventually the abscission layer finishes its work. The leaf, now dry and brightly colored, breaks free and falls. What looks like decoration is really the visible trace of a tree taking apart its own food factory and pulling the valuable parts back inside before the cold arrives.",

{
  id:"p_anc", domain:"Science", title:"Quiet by Design",
  text:
"Sound is a pattern of pressure moving through the air: regions where molecules bunch together, followed by regions where they spread apart, repeating many times a second. A microphone turns that pattern into a matching electrical wave. A speaker does the reverse, pushing air back and forth to recreate the pattern in a listener's ear.\n\n"+
"Active noise cancellation uses both. A small microphone on the outside of each earcup samples the sound arriving from the surroundings. A processor inspects that wave and generates a second wave that is its mirror image: wherever the incoming wave pushes, the new wave pulls, and wherever the incoming wave pulls, the new wave pushes. The earcup's speaker plays this mirror wave. When the two waves meet in the space near the eardrum, their opposite pressures add up to something close to zero. Engineers call this destructive interference. The physical noise has not been blocked so much as canceled by an equal and opposite sound.\n\n"+
"The technique works best on steady, low-pitched drones: the roar of a jet engine, the hum of a train, the rumble of a ventilation system. These sounds change slowly, which gives the processor time to track them and keep its mirror wave lined up. Sudden, high-pitched sounds are much harder. A short clap or a burst of speech shifts too quickly for the system to follow, and the cancellation lags behind the target. This is why noise-cancelling headphones dull the background of a plane cabin but do little to hide a nearby conversation.\n\n"+
"Most headphones pair the electronics with ordinary physical blocking. Dense foam and a snug seal around the ear stop many high frequencies on their own, while the active system handles the low ones that foam cannot. The result is a division of labor: passive materials for the treble, electronic cancellation for the bass. Neither approach is complete, but together they can take the edge off a noisy world.",

    {type:"detail", q:"The \"mirror wave\" produced by the processor is designed to",
     c:["amplify the incoming sound","match the incoming wave exactly","block high frequencies with foam","push where the incoming wave pulls, and pull where it pushes","travel faster than the incoming sound"],

{
  id:"p_biolum", domain:"Science", title:"Light in the Dark Ocean",
  text:
"Below about a thousand meters, the ocean is effectively without sunlight. Yet this dark zone is not lightless. A large share of the animals that live there make their own light, a chemical glow called bioluminescence. On many nights it is the most common source of light in the sea.\n\n"+
"The chemistry is simple in outline. A molecule generally called luciferin reacts with oxygen, helped along by a protein, and releases energy as light rather than heat. The light is usually blue-green, the color that travels farthest through seawater. Because almost none of the energy is lost as warmth, biologists sometimes describe it as cold light. Some animals produce the ingredients themselves; others host colonies of glowing bacteria in special pouches and switch the light on and off by covering or exposing them.\n\n"+
"The uses are varied, and often work against one another. A deep-sea anglerfish dangles a glowing lure in front of its jaws to draw prey close. Many small shrimp do the opposite, spitting a cloud of luminous fluid to dazzle a predator while they escape into the dark. Countless mid-water animals use a trick called counterillumination: they cover their undersides with faint light that matches the dim glow filtering down from the surface, erasing the silhouette a predator below would otherwise see. Others flash to find mates, or to warn that they taste foul.\n\n"+
"Studying these signals is difficult. Bright ship lights and the disturbance of a net destroy the very behavior researchers want to observe, and most glows are too faint to record with ordinary cameras. Newer approaches use dim red light, which most deep-sea animals cannot see, along with extremely sensitive sensors lowered quietly into the water. The picture that is emerging is of an environment where light is less a steady background, as it is on land, than a language: brief, purposeful, and spoken by almost everyone present.",

{
  id:"p_library", domain:"Humanities", title:"The Public's Library",
  text:
"The idea that anyone may walk into a building, borrow a book, and take it home for free is younger than it seems. For most of the history of libraries, collections were private or semi-private. Monasteries chained their manuscripts to the shelves. Universities lent only to scholars. Subscription libraries, popular in the seventeenth and eighteenth centuries, charged a yearly fee that put them out of reach of working people.\n\n"+
"The free public library, paid for by taxes and open to all, took shape in the nineteenth century. Reformers argued that a republic depended on an informed population, and that a person who could not afford books should still be able to read widely. In Britain, a law of 1850 let towns levy a small tax to fund libraries. In the United States, the city of Boston opened a large tax-supported library in 1854, and the model spread quickly. Late in the century the industrialist Andrew Carnegie paid for the construction of more than 2,500 library buildings around the world, on the condition that local governments agree to stock and staff them.\n\n"+
"Early public libraries were not always as open as their supporters claimed. Some limited who could enter, kept the most-requested books behind a counter, or arranged their halls to discourage the poor from lingering. Over time, the profession pushed against these limits. Open shelves, which let readers browse and choose for themselves, became standard. Children's rooms, once rare, became central. Branch libraries carried the service into neighborhoods far from downtown.\n\n"+
"The mission has kept widening. A modern public library lends films and tools, offers internet access and tax help, runs story hours and job workshops, and provides one of the few indoor public spaces a person can use all day without being asked to buy anything. Librarians describe this as a natural extension of the founding promise. Critics sometimes argue that the institution has drifted from its purpose. Its defenders answer that the purpose was never only books; it was access, and access takes whatever form the moment requires.",

{
  id:"p_translation", domain:"Humanities", title:"The Trouble with Translation",
  text:
"To translate is to carry a meaning from one language into another, and the word itself, from Latin, means to carry across. The difficulty is that meaning is not a single object that can be lifted intact. It is bound up with the sound, structure, and history of the language that holds it.\n\n"+
"Some losses are obvious. A pun depends on two meanings sharing one set of sounds; move to another language and the sounds, and the joke, fall apart. Poetry that leans on rhyme and meter cannot keep both its music and its literal sense in a new tongue, and the translator must decide which to sacrifice. Other losses are quieter. Many languages carry information in places where English does not. A single verb may state whether the speaker witnessed an event or only heard of it. A pronoun may mark respect or intimacy. Rendered in plain English, these shadings simply vanish unless the translator adds words the original never needed.\n\n"+
"There are also gains, or at least trades. A skilled translator may find an image that the first author would have loved but never reached, or may clear up a passage that was tangled in the original. Translations age, too, in a way originals do not: each generation tends to want a new version in its own idiom, which is why long-admired works are translated again and again.\n\n"+
"Because a perfect copy is impossible, translators work from principles rather than rules. Some aim to keep the reader comfortable, smoothing the text until it reads as though written in the new language from the start. Others deliberately leave a foreign texture in place, believing that a translation should remind you it came from somewhere else. Neither choice is simply right. Each decides what to carry across and what, of necessity, to leave on the far bank.",

{
  id:"p_graphicnovel", domain:"Humanities", title:"Pictures That Read as Books",
  text:
"For much of the twentieth century, comics were treated as a children's medium, or worse. In the 1950s a wave of alarm in the United States linked comic books to youth crime, and the industry adopted a strict code that kept its content mild for decades. The form was widely seen as simple by nature: bright pictures, short words, nothing that asked much of a reader.\n\n"+
"That view has largely collapsed. The turning point is often placed in the 1980s and 1990s, when several long, serious works in comics form reached a wide adult audience and drew reviews in the same pages as prose fiction. One, a memoir of a father's survival of the Holocaust told with animals standing in for people, won a major literary prize in 1992. Bookstores began shelving such works together under the label graphic novel, a term that had circulated for years but now stuck.\n\n"+
"Critics who study the form argue that its supposed simplicity is nothing of the kind. A comics page asks the reader to do a particular kind of work: to move through a grid of still images, to supply the motion and time that pass in the white gaps between panels, and to hold picture and text in mind at once. A skilled cartoonist controls pace through panel size and spacing, hides information at the turn of a page, and lets a drawing carry a feeling that the words on the same panel deny.\n\n"+
"None of this means the old audience went away. Superhero series still sell, and plenty of comics are made purely to entertain. What changed is the ceiling. A form once assumed to be incapable of seriousness is now used for reporting, history, biography, and criticism, and is taught in universities. The pictures were never the limitation. The assumption was.",

{
  id:"p_jazz", domain:"Humanities", title:"Making It Up, Together",
  text:
"To an outsider, a jazz solo can sound like pure invention, a musician playing whatever comes to mind. It is closer to a conversation held under rules that everyone in the band already knows.\n\n"+
"Most jazz performances are built on a tune's underlying structure: a fixed sequence of chords, a set number of measures, and a steady pulse. The melody stated at the top is only the starting point. Once it has been played, the musicians take turns improvising new melodies over that same chord sequence, which cycles again and again. A soloist is free to invent, but the invention has to fit the harmony passing beneath it and land in time with the rest of the group. Freedom and constraint operate at once.\n\n"+
"Improvisers do not begin from nothing. Over years of practice they absorb a vocabulary of short melodic phrases, rhythmic figures, and ways of moving from one chord to the next. In performance they draw on this store, reshaping and combining fragments to suit the moment, much as a fluent speaker builds fresh sentences from familiar words without planning each one in advance. Skilled players also listen closely and answer one another, so a phrase from the piano may be echoed, a beat later, by the horn.\n\n"+

"A foraging honeybee may fly several kilometers from the hive, visit dozens of flowers, and then return in a nearly straight line to a hole a few centimeters wide. For an animal with a brain smaller than a grain of rice, this is a remarkable feat of navigation, and biologists have spent decades working out how it is done. "+
"The bee's most important tool is the sun. A bee can read the sun's position in the sky and use it as a compass, holding a steady angle between its flight path and the sun's direction. Because the sun moves across the sky during the day, the bee must correct for that drift, and it does. A bee held inside a dark hive for several hours will leave and fly in the correct compass direction, as though it had kept track of time and adjusted its internal map. "+
"On cloudy days the sun may be hidden, but the sky still carries a clue. Sunlight scattered by the atmosphere forms patterns of polarized light, invisible to humans but detectable by a special region at the top of the bee's eye. From even a small patch of blue sky, a bee can work out where the sun must be and hold its bearings. "+
"Closer to home, bees rely on landmarks. A bee learns the shapes, colors, and positions of trees, rocks, and buildings near the hive and along familiar routes. On its first flights, a young bee performs slow backward loops in front of the entrance, turning to face the hive and memorizing how it looks from outside. Experiments that shift local landmarks a short distance will send returning bees to search in the wrong place. "+
"Distance is measured in a different way. As a bee flies, the visual world streams past its eyes, and the speed of that flow gives an estimate of how far it has traveled. A bee flown through a narrow tunnel with patterned walls, where the world rushes past quickly, will overestimate the distance it covered. "+
"All of this information comes together in the waggle dance. A returning forager walks a straight line on the vertical comb while shaking its body, then circles back and repeats. The angle of the straight run, measured against vertical, matches the angle of the food relative to the sun. The length of the run signals the distance. Nestmates follow closely, reading the dance in the darkness of the hive, and then fly out to search the direction and distance it described. "+
"None of these systems is perfect on its own. Together they let a small insect leave home, wander a wide and changing landscape, and come back with food, again and again, through a summer.";

function el(tag, attrs){
  const n = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(v==null) continue;
    if(k==="class") n.className=v;
    else if(k==="text") n.textContent=v;
    else if(k.slice(0,2)==="on" && typeof v==="function") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for(let i=2;i<arguments.length;i++){
    let kid = arguments[i];
    if(kid==null || kid===false) continue;
    if(Array.isArray(kid)){ kid.forEach(function(k){ if(k!=null&&k!==false) n.appendChild(typeof k==="string"?document.createTextNode(k):k); }); }
    else n.appendChild(typeof kid==="string"?document.createTextNode(kid):kid);
  }
  return n;
}
function fmtTime(s){
  s = Math.max(0, Math.round(s));
  const m = Math.floor(s/60), r = s%60;
  return m+":"+(r<10?"0":"")+r;
}
function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function sample(a,n){ const s = shuffle(a); return n>=s.length ? s : s.slice(0,n); }
function chunk(a,size){ const out=[]; for(let i=0;i<a.length;i+=size) out.push(a.slice(i,i+size)); return out; }
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
function pct(c,t){ return t ? Math.round(100*c/t)+"%" : "—"; }
function daysLeft(){ return Math.ceil((TEST_DATE - Date.now())/86400000); }

/* ---- weak words ---- */
function weakFind(stem){ return store.weak.find(function(w){ return w.stem===stem; }); }
function addWeak(item){
  if(!item || item.type!=="vocab") return;
  const key = item.stem || item.frame || item.id;
  let w = store.weak.find(function(x){ return (x.stem||x.frame||x.id)===key; });
  if(w){ w.misses = (w.misses||0)+1; w.hits = 0; }
  else{
    store.weak.push({stem:item.stem, frame:item.frame, choices:item.choices, answer:item.answer, note:item.note, d:item.d, misses:1, hits:0});
    if(store.weak.length>250) store.weak.shift();
  }
  save();
}
function weakHit(item){
  const key = item.stem || item.frame || item.id;
  const idx = store.weak.findIndex(function(x){ return (x.stem||x.frame||x.id)===key; });
  if(idx<0) return;
  store.weak[idx].hits = (store.weak[idx].hits||0)+1;
  if(store.weak[idx].hits>=2) store.weak.splice(idx,1);
  save();
}
function weakAsItems(){
  return store.weak.map(function(w,i){
    return {id:"w"+i, type:"vocab", stem:w.stem, choices:w.choices, answer:w.answer, note:w.note, d:w.d||2, frame:w.frame||null};
  });
}

function recordSession(sess){

}
function aggAccuracy(section){
  let c=0,t=0;
  store.sessions.forEach(function(s){
    if(s.sections && s.sections[section]){ c+=s.sections[section].c; t+=s.sections[section].t; }
  });
  return {c:c,t:t};
}
function avgWpm(){
  const xs = store.sessions.filter(function(s){ return s.wpm; }).map(function(s){ return s.wpm; });
  if(!xs.length) return null;
  return Math.round(xs.reduce(function(a,b){return a+b;},0)/xs.length);
}

/* ---- reading-level band (rough proxy only) ---- */
function estimateBand(vAcc, cAcc, wpm){
  const parts=[], weights=[];
  if(cAcc!=null){ parts.push(cAcc); weights.push(0.50); }
  if(vAcc!=null){ parts.push(vAcc); weights.push(0.35); }
  if(wpm!=null){ parts.push(clamp((wpm-140)/(320-140),0,1)); weights.push(0.15); }
  if(!parts.length) return null;
  const wsum = weights.reduce(function(a,b){return a+b;},0);
  let score = 0;
  parts.forEach(function(p,i){ score += p*weights[i]; });
  score = score/wsum;
  const table = [[0.90,13,"College level"],[0.80,12,"Grade 12"],[0.70,11,"Grade 11"],[0.60,10,"Grade 10"],[0.50,9,"Grade 9"],[0.40,8,"Grade 8"],[0,7,"Below Grade 8"]];
  const row = table.find(function(r){ return score>=r[0]; });
  return {score:score, grade:row[1], label:row[2]};

   TIMERS  (all tracked so the router can stop them)
   ================================================================ */
let activeTimers = [];
function makeTimer(seconds, onExpire){
  const node = el("span",{class:"timer", text:fmtTime(seconds)});
  let iv=null, end=0;
  function tick(){
    const rem = (end - Date.now())/1000;
    node.textContent = fmtTime(rem);
    node.classList.toggle("warn", rem<=300 && rem>60);
    node.classList.toggle("danger", rem<=60);
    if(rem<=0){ stop(); if(onExpire) onExpire(); }
  }
  function start(){ end = Date.now()+seconds*1000; tick(); iv=setInterval(tick,250); activeTimers.push(stop); }
  function stop(){ if(iv){ clearInterval(iv); iv=null; } }
  function remaining(){ return Math.max(0,(end-Date.now())/1000); }
  return {node:node, start:start, stop:stop, remaining:remaining};
}
function makeStopwatch(){
  const node = el("span",{class:"timer", text:"0:00"});
  let iv=null, t0=0;
  function start(){ t0=Date.now(); iv=setInterval(function(){ node.textContent=fmtTime((Date.now()-t0)/1000); },500); activeTimers.push(stop); }
  function stop(){ if(iv){ clearInterval(iv); iv=null; } }
  function elapsed(){ return (Date.now()-t0)/1000; }
  return {node:node, start:start, stop:stop, elapsed:elapsed};
}
function stopAllTimers(){ activeTimers.forEach(function(fn){ try{fn();}catch(e){} }); activeTimers = []; }

    }, text:"Start drill"}),

function buildVocabDrill(n, useWeak){
  let weakItems = [];
  if(useWeak && store.weak.length){
    weakItems = shuffle(weakAsItems()).slice(0, Math.min(store.weak.length, Math.floor(n*0.4)));
  }
  const usedKeys = {};
  weakItems.forEach(function(it){ usedKeys[it.stem||it.frame||it.id]=1; });
  let pool = allVocabItems().filter(function(it){ return !usedKeys[it.stem||it.frame||it.id]; });
  if(store.targetGrade>=12) pool.sort(function(a,b){ return (b.d-a.d) + (Math.random()-0.5); });
  else if(store.targetGrade>=11){ const hard = pool.filter(function(it){return it.d>=2;}); pool = shuffle(hard.length>=(n) ? hard : pool); }
  else pool = shuffle(pool);
  const chosen = pool.slice(0, Math.max(0, n - weakItems.length));
  return shuffle(weakItems.concat(chosen));
}

/* ================================================================
   SCREEN: DRILL  (vocab or comp, instant feedback)
   ================================================================ */
function renderDrill(params){
  const app = document.getElementById("app");
  const items = params.items;
  if(!items.length){ app.appendChild(el("div",{class:"card"}, el("p",{text:"Nothing to practice here yet."}), el("button",{class:"btn", text:"Back", onclick:function(){ go("home"); }}))); return; }
  let i = 0;
  const picks = new Array(items.length).fill(null);
  let correct = 0;

  app.appendChild(el("h1",{text:params.title}));
  let sw = null;
  if(params.timed){
    sw = makeStopwatch();
    app.appendChild(el("div",{class:"timerbar"}, el("span",{class:"muted small", text:"Elapsed"}), sw.node));
    sw.start();
  }
  const prog = el("div",{class:"prog"}, el("i",{style:"width:0%"}));
  app.appendChild(prog);
  const host = el("div",{}); app.appendChild(host);

  function renderQ(){
    while(host.firstChild) host.removeChild(host.firstChild);
    prog.firstChild.style.width = Math.round(100*i/items.length)+"%";
    const it = items[i];

    if(params.kind==="comp" && (i===0 || items[i-1].passageId!==it.passageId)){
      host.appendChild(passageCard(it.passage));
    }
    const card = el("div",{class:"card"});
    card.appendChild(el("div",{class:"qhead"},
      el("span",{class:"qnum", text:"Question "+(i+1)+" of "+items.length}),
      el("span",{class:"tag", text:TYPE_LABEL[it.type]||it.type})
    ));
    card.appendChild(params.kind==="vocab" ? vocabPromptNode(it) : el("div",{class:"qtext", text:it.q}));

    const choices = el("div",{class:"choices"});
    const btns = [];
    it.choices.forEach(function(ch, idx){
      const b = el("button",{class:"choice"},
        el("span",{class:"k", text:"ABCDE"[idx]}), el("span",{text:ch}));
      b.addEventListener("click", function(){ if(picks[i]!=null) return; answer(idx, btns, card); });
      btns.push(b); choices.appendChild(b);
    });
    card.appendChild(choices);
    host.appendChild(card);
  }
  function answer(idx, btns, card){
    picks[i] = idx;
    const it = items[i];
    const right = idx===it.answer;
    if(right) correct++;
    btns.forEach(function(b,k){
      b.setAttribute("disabled","disabled");
      if(k===it.answer) b.classList.add("correct");
      if(k===idx && !right) b.classList.add("wrong");
    });
    if(params.kind==="vocab"){ if(right) weakHit(it); else addWeak(it); }
    card.appendChild(el("div",{class:"feedback "+(right?"ok":"no")},
      right ? "Correct" : "Not quite",
      el("div",{class:"explain", text:it.note})
    ));
    card.appendChild(el("div",{class:"btn-row", style:"margin-top:12px"},
      el("button",{class:"btn btn-primary", text: i+1<items.length ? "Next" : "See results", onclick:function(){
        i++; if(i<items.length) renderQ(); else finish();
      }})
    ));
  }
  function finish(){
    if(sw) sw.stop();
    const byType = {};
    items.forEach(function(it,k){
      const T = byType[it.type] || (byType[it.type]={c:0,t:0});
      T.t++; if(picks[k]===it.answer) T.c++;
    });
    const sect = params.kind==="vocab" ? {vocab:{c:correct,t:items.length}} : {comp:{c:correct,t:items.length}};
    const session = {mode:params.kind, sections:sect, byType:byType, wpm:null};
    const vAcc = sect.vocab ? sect.vocab.c/sect.vocab.t : null;
    const cAcc = sect.comp ? sect.comp.c/sect.comp.t : null;
    session.band = estimateBand(vAcc, cAcc, null);
    recordSession(session);
    go("results", {session:session, items:items, picks:picks, origin:{name:"drill", kind:params.kind}});
  }

  app.appendChild(el("div",{class:"btn-row", style:"margin-top:6px"},
    el("button",{class:"link", text:"Quit to home", onclick:function(){ if(confirm("Quit this drill? It will not be saved.")) go("home"); }})
  ));
  renderQ();
}

function endSim(){
  armUnloadGuard(false);
  const V = simState.vocab, C = simState.comp;
  let vc=0; V.items.forEach(function(it,k){ if(V.picks[k]===it.answer) vc++; else addWeak(it); });

  C.items.forEach(function(it,k){
    const T = byType[it.type] || (byType[it.type]={c:0,t:0});
    T.t++;
    if(C.picks[k]===it.answer){ cc++; T.c++; }
  });
  byType.vocab = {c:vc, t:V.items.length};
  const sections = {vocab:{c:vc,t:V.items.length}, comp:{c:cc,t:C.items.length}};
  const band = estimateBand(vc/V.items.length, cc/C.items.length, null);
  const session = {mode:"sim", sections:sections, byType:byType, wpm:null, band:band};
  recordSession(session);
  const items = V.items.concat(C.items);
  const picks = V.picks.concat(C.picks);
  simState = null;
  go("results", {session:session, items:items, picks:picks, origin:{name:"sim"}});
}

function renderRate(){
  const app = document.getElementById("app");
  app.appendChild(el("h1",{text:"Reading Rate"}));

  if(!rateState){
    const card = el("div",{class:"card"});
    card.appendChild(el("p",{text:"When you press start, a passage appears with a 60-second timer. Read at your normal, comfortable pace for understanding. When time is called, click the last line you finished. Your words-per-minute figure is the running total of words up to that line."}));
    card.appendChild(el("div",{class:"disclaimer", text:"On the real test, reading rate is a minor, optional score that some agencies skip entirely. Comprehension accuracy matters far more — do not sacrifice it for speed."}));
    card.appendChild(el("div",{class:"btn-row"},
      el("button",{class:"btn btn-primary", text:"Start the 1-minute timer", onclick:function(){ rateState={started:true, picked:null, awaiting:false}; go("rate",{}); }}),
      el("button",{class:"btn", text:"Back", onclick:function(){ go("home"); }})
    ));
    app.appendChild(card);
    return;
  }

  const words = RATE_TEXT.split(/\s+/);
  const lines = chunk(words, 11);
  const cum = []; let run=0;
  lines.forEach(function(ln){ run += ln.length; cum.push(run); });

  const timer = makeTimer(RATE_TIME, function(){
    rateState.awaiting = true;
    banner.hidden = false;
    doneBtn.hidden = false;
  });
  app.appendChild(el("div",{class:"timerbar"}, el("span",{class:"muted small", text:"Reading time"}), timer.node));
  const startAt = Date.now();
  timer.start();

  const banner = el("div",{class:"banner", text:"Time! Click the last line you finished, then press Done."}); banner.hidden = true;
  app.appendChild(banner);

  const box = el("div",{class:"ratelines"});
  lines.forEach(function(ln, idx){
    const b = el("button",{class:"rateline"},
      el("span",{class:"ln", text:(idx+1)+"."}), " "+ln.join(" "));
    b.addEventListener("click", function(){
      rateState.picked = idx;
      box.querySelectorAll(".rateline").forEach(function(x,k){
        x.classList.toggle("picked", k===idx);
        x.classList.toggle("after", k>idx);
      });
      doneBtn.hidden = false;
    });
    box.appendChild(b);
  });
  app.appendChild(box);

  function finishRate(){
    if(rateState.picked==null){ alert("Click the last line you reached first."); return; }
    const actual = (Date.now()-startAt)/1000;
    if(!rateState.awaiting && actual < 20){
      alert("That was too quick to measure. Read at your normal pace and mark the line where the minute ends.");
      return;
    }
    timer.stop();
    const elapsed = rateState.awaiting ? RATE_TIME : Math.min(RATE_TIME, actual);
    const wordCount = cum[rateState.picked];
    const wpm = Math.round(wordCount/(elapsed/60));
    recordSession({mode:"rate", sections:{}, byType:{}, wpm:wpm, band:null});
    rateState = null;
    renderRateResult(wpm, wordCount, elapsed);
  }

  const doneBtn = el("button",{class:"btn btn-primary", text:"Done — I marked my line", onclick:finishRate});
  doneBtn.hidden = true;
  const earlyBtn = el("button",{class:"btn", text:"I read to the end before time", onclick:function(){
    if(rateState.picked==null) rateState.picked = lines.length-1;
    box.querySelectorAll(".rateline").forEach(function(x,k){ x.classList.toggle("picked", k===rateState.picked); x.classList.toggle("after", k>rateState.picked); });
    finishRate();
  }});
  app.appendChild(el("div",{class:"btn-row", style:"margin-top:10px"}, doneBtn, earlyBtn,
    el("button",{class:"link", text:"Cancel", onclick:function(){ timer.stop(); rateState=null; go("home"); }})
  ));
}
function renderRateResult(wpm, wordCount, elapsed){
  const app = document.getElementById("app");
  while(app.firstChild) app.removeChild(app.firstChild);
  app.appendChild(el("h1",{text:"Reading Rate — Result"}));
  const card = el("div",{class:"card"});
  card.appendChild(el("div",{class:"scoreline", text:wpm+" words per minute"}));
  card.appendChild(el("p",{class:"muted", text:"About "+wordCount+" words in "+Math.round(elapsed)+" seconds."}));
  let band = "typical adult reading speed";
  if(wpm<150) band = "below the typical adult range — slow and careful";
  else if(wpm<=250) band = "typical adult reading speed";
  else if(wpm<=350) band = "faster than average";
  else band = "very fast — make sure comprehension holds up at this pace";
  card.appendChild(el("p",{text:"That is "+band+"."}));
  card.appendChild(el("div",{class:"disclaimer", text:"Rough figure from one short passage. Reading rate is a small part of the Nelson-Denny and is optional for many agencies; comprehension accuracy is what carries weight."}));
  card.appendChild(el("div",{class:"btn-row"},
    el("button",{class:"btn btn-primary", text:"Home", onclick:function(){ go("home"); }}),
    el("button",{class:"btn", text:"Try again", onclick:function(){ rateState={started:true,picked:null,awaiting:false}; go("rate",{}); }})
  ));
  app.appendChild(card);
  updateTopRight();
}

/* ================================================================
   SCREEN: RESULTS
   ================================================================ */
function renderResults(params){
  const app = document.getElementById("app");
  const s = params.session;
  app.appendChild(el("h1",{text:(MODE_LABEL[s.mode]||"Session")+" — Results"}));

  let totC=0, totT=0;
  ["vocab","comp"].forEach(function(k){ if(s.sections[k]){ totC+=s.sections[k].c; totT+=s.sections[k].t; } });

  const top = el("div",{class:"card"});
  top.appendChild(el("div",{class:"scoreline", text:totC+" / "+totT+" correct"}));
  top.appendChild(el("div",{class:"muted", text:pct(totC,totT)+" overall"}));
  const sr = el("div",{class:"stats", style:"margin-top:8px"});
  if(s.sections.vocab) sr.appendChild(el("div",{class:"stat"}, el("div",{class:"n", text:pct(s.sections.vocab.c,s.sections.vocab.t)}), el("div",{class:"l", text:"Vocabulary"})));
  if(s.sections.comp) sr.appendChild(el("div",{class:"stat"}, el("div",{class:"n", text:pct(s.sections.comp.c,s.sections.comp.t)}), el("div",{class:"l", text:"Comprehension"})));
  if(s.wpm) sr.appendChild(el("div",{class:"stat"}, el("div",{class:"n", text:String(s.wpm)}), el("div",{class:"l", text:"WPM"})));
  top.appendChild(sr);
  app.appendChild(top);

  // by type
  const types = Object.keys(s.byType||{}).filter(function(k){ return s.byType[k].t>0; });
  if(types.length){
    const tbl = el("table",{class:"tbl"});
    tbl.appendChild(el("tr",{}, el("th",{text:"Question type"}), el("th",{class:"r", text:"Correct"}), el("th",{class:"r", text:"Accuracy"})));
    types.forEach(function(k){
      const T = s.byType[k];
      tbl.appendChild(el("tr",{}, el("td",{text:TYPE_LABEL[k]||k}), el("td",{class:"r", text:T.c+"/"+T.t}), el("td",{class:"r", text:pct(T.c,T.t)})));
    });
    app.appendChild(el("div",{class:"card"}, el("h3",{text:"By question type"}), tbl));
  }

  // band
  if(s.band){
    const t = store.targetGrade;
    const meets = s.band.grade>=t;
    const bc = el("div",{class:"card"});
    bc.appendChild(el("h3",{text:"Estimated reading-level band"}));
    bc.appendChild(el("div",{style:"font-size:22px;font-weight:800;margin:4px 0"}, s.band.label,
      " ", el("span",{class:"pill "+(meets?"ok":"no"), text: meets ? "at or above your Grade "+t+" target" : "below your Grade "+t+" target"})));
    bc.appendChild(el("div",{class:"disclaimer", text:
      "Rough self-check only. This band blends your vocabulary accuracy, comprehension accuracy, and (when available) reading rate into one number so you can watch it move over time. It is NOT the official Nelson-Denny grade-equivalent score — those norm tables are proprietary and unpublished. Treat it as a training signal, not a prediction of your result."}));
    app.appendChild(bc);
  }

  // per-question review
  if(params.items && params.picks){
    const det = el("details");
    det.appendChild(el("summary",{text:"Review every question"}));
    params.items.forEach(function(it,k){
      const mine = params.picks[k];
      const right = mine===it.answer;
      const promptText = it.type==="vocab" ? (it.frame ? it.frame.replace("___", it.stem) : it.stem) : it.q;
      const row = el("div",{class:"rev-item"});
      row.appendChild(el("div",{}, el("b",{text:(k+1)+". "}), promptText, "  ", el("span",{class:"tag", text:TYPE_LABEL[it.type]||it.type})));
      row.appendChild(el("div",{class:"rev-yours "+(right?"good":"bad"), text:"Your answer: "+(mine==null?"(blank)":it.choices[mine])+(right?"  ✓":"")}));
      if(!right) row.appendChild(el("div",{class:"good rev-yours", text:"Correct: "+it.choices[it.answer]}));
      row.appendChild(el("div",{class:"muted small", text:it.note}));
      det.appendChild(row);
    });
    app.appendChild(det);
  }

  const row = el("div",{class:"btn-row", style:"margin-top:14px"});
  row.appendChild(el("button",{class:"btn btn-primary", text:"Home", onclick:function(){ go("home"); }}));
  row.appendChild(el("button",{class:"btn", text:"Review / weak spots", onclick:function(){ go("review"); }}));
  if(params.origin && params.origin.name==="drill"){
    row.appendChild(el("button",{class:"btn", text:"Another drill", onclick:function(){ go(params.origin.kind==="vocab"?"vsetup":"csetup"); }}));
  }
  app.appendChild(row);
}

/* ================================================================
   SCREEN: REVIEW / WEAK SPOTS
   ================================================================ */
function renderReview(){
  const app = document.getElementById("app");
  app.appendChild(el("h1",{text:"Review / Weak Spots"}));

  // aggregate by type
  const agg = {};
  store.sessions.forEach(function(s){
    if(!s.byType) return;
    Object.keys(s.byType).forEach(function(k){
      const A = agg[k] || (agg[k]={c:0,t:0});
      A.c += s.byType[k].c; A.t += s.byType[k].t;
    });
  });
  const keys = Object.keys(agg);
  if(keys.length){
    const tbl = el("table",{class:"tbl"});
    tbl.appendChild(el("tr",{}, el("th",{text:"Question type"}), el("th",{class:"r", text:"Attempted"}), el("th",{class:"r", text:"Accuracy"})));
    keys.sort(function(a,b){ return (agg[a].c/Math.max(1,agg[a].t)) - (agg[b].c/Math.max(1,agg[b].t)); });
    keys.forEach(function(k){
      tbl.appendChild(el("tr",{}, el("td",{text:TYPE_LABEL[k]||k}), el("td",{class:"r", text:String(agg[k].t)}), el("td",{class:"r", text:pct(agg[k].c,agg[k].t)})));
    });
    app.appendChild(el("div",{class:"card"}, el("h3",{text:"Accuracy by question type (all sessions)"}), tbl,
      el("div",{class:"muted small", text:"Lowest accuracy is listed first — that is where to spend practice time."})));
  } else {
    app.appendChild(el("div",{class:"card"}, el("p",{class:"muted", text:"No sessions yet. Finish a drill or simulation and this fills in."})));
  }

  // weak words
  const wc = el("div",{class:"card"});
  wc.appendChild(el("h3",{text:"Words to relearn ("+store.weak.length+")"}));
  if(store.weak.length){
    const sorted = store.weak.slice().sort(function(a,b){ return (b.misses||0)-(a.misses||0); });
    const tbl = el("table",{class:"tbl"});
    tbl.appendChild(el("tr",{}, el("th",{text:"Item"}), el("th",{text:"Closest meaning"}), el("th",{class:"r", text:"Missed"})));
    sorted.forEach(function(w){
      const label = w.stem || (w.frame ? w.frame.replace("___","___") : "(item)");
      tbl.appendChild(el("tr",{}, el("td",{text:label}), el("td",{text:w.choices?w.choices[w.answer]:""}), el("td",{class:"r", text:String(w.misses||1)})));
    });
    wc.appendChild(tbl);
    wc.appendChild(el("div",{class:"btn-row", style:"margin-top:10px"},
      el("button",{class:"btn btn-primary", text:"Drill these words", onclick:function(){
        go("drill", {kind:"vocab", items:shuffle(weakAsItems()), title:"Weak-word drill", timed:false});
      }}),
      el("button",{class:"btn btn-danger", text:"Clear list", onclick:function(){ if(confirm("Clear the weak-word list?")){ store.weak=[]; save(); go("review"); } }})
    ));
    wc.appendChild(el("div",{class:"muted small", text:"An item leaves this list after you get it right twice in later drills. Weak words are also mixed into new Vocabulary Drills."}));
  } else {
    wc.appendChild(el("p",{class:"muted", text:"Empty. Missed vocabulary items land here automatically."}));
  }
  app.appendChild(wc);

  // history
  if(store.sessions.length){
    const hs = store.sessions.slice(-12).reverse();
    const tbl = el("table",{class:"tbl"});
    tbl.appendChild(el("tr",{}, el("th",{text:"When"}), el("th",{text:"Mode"}), el("th",{class:"r", text:"Result"})));
    hs.forEach(function(s){
      let res = "";
      if(s.wpm) res = s.wpm+" WPM";
      else{
        let c=0,t=0; ["vocab","comp"].forEach(function(k){ if(s.sections&&s.sections[k]){ c+=s.sections[k].c; t+=s.sections[k].t; } });
        res = c+"/"+t;
      }
      const dt = new Date(s.ts);
      tbl.appendChild(el("tr",{}, el("td",{text:(dt.getMonth()+1)+"/"+dt.getDate()+" "+dt.getHours()+":"+(dt.getMinutes()<10?"0":"")+dt.getMinutes()}), el("td",{text:MODE_LABEL[s.mode]||s.mode}), el("td",{class:"r", text:res})));
    });
    app.appendChild(el("div",{class:"card"}, el("h3",{text:"Recent sessions"}), tbl));
  }

  app.appendChild(el("button",{class:"btn", text:"Home", onclick:function(){ go("home"); }}));
}

/* ================================================================
   BOOT
   ================================================================ */
const SCREENS = {
  home:renderHome, vsetup:renderVocabSetup, csetup:renderCompSetup, drill:renderDrill,
  simIntro:renderSimIntro, sim:renderSim, rate:renderRate, review:renderReview, results:renderResults
};

function selftest(){
  let problems = 0;
  VOCAB_RAW.forEach(function(t,i){
    if(!Array.isArray(t[1]) || t[1].length!==5){ console.warn("vocab["+i+"] "+t[0]+" not 5 choices"); problems++; }
    if(typeof t[2]!=="number" || t[2]<0 || t[2]>4){ console.warn("vocab["+i+"] "+t[0]+" bad answer index"); problems++; }
    if(!t[3]){ console.warn("vocab["+i+"] "+t[0]+" missing note"); problems++; }
  });
  PASSAGES.forEach(function(p){
    const wc = p.text.split(/\s+/).length;
    if(wc<250 || wc>500) console.warn("passage "+p.id+" word count "+wc+" (target 300-450)");
    p.questions.forEach(function(q,k){
      if(!q.c || q.c.length!==5){ console.warn(p.id+" q"+k+" not 5 choices"); problems++; }
      if(q.a<0 || q.a>4){ console.warn(p.id+" q"+k+" bad answer"); problems++; }
      if(!TYPE_LABEL[q.type]){ console.warn(p.id+" q"+k+" unknown type "+q.type); problems++; }
      if(!q.n){ console.warn(p.id+" q"+k+" missing explanation"); problems++; }
    });
  });
  console.log("NDRT self-test: "+(problems?problems+" problem(s)":"OK")+" — "+VOCAB_RAW.length+" vocab, "+PASSAGES.length+" passages");
}
selftest();
go("home");

})();
</script>
