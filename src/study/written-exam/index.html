rn it in as found property before her shift ends.","Keep the wallet in her patrol bag for a few days in case the owner stops her on the street to ask about it.","Leave the wallet with a nearby shopkeeper and ask him to hold it until the owner comes looking.","Take the cash out for safekeeping and place the empty wallet back where she found it."],"answer":0,"fixed":false,"principle":"Integrity","explanation":"Integrity means every dollar of found property is documented and handed in promptly, so there is never a question about what happened to it. Holding the wallet herself for a few days may sound helpful, but it leaves cash unrecorded and in her personal control."},{"id":"sp-002","section":"sjt","subtype":"integrity","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":1,"stimulus":null,"stem":"Officer Luis Ramirez eats lunch at a diner on his beat. When he goes to pay, the owner waves him off and says, 'Your money is no good here. We like having officers around.' What is the best course of action?","choices":["Accept the free meal this one time so the owner is not offended, and pay on future visits.","Accept the meal and make a point of driving past the diner more often during his shift.","Put money on the counter, tell the owner sharply that offering an officer free food is improper, and walk out.","Thank the owner for the kind thought, explain that he pays like any other customer, and pay the full bill."],"answer":3,"fixed":false,"principle":"Integrity","explanation":"Integrity: accepting even a small gift tied to the uniform can create an expectation of special treatment, so the officer pays his own way. Taking it 'just once' to avoid offense is tempting, but a polite thank-you and full payment keeps things friendly without owing the owner anything."},{"id":"sp-003","section":"sjt","subtype":"integrity","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":3,"stimulus":null,"stem":"Officer Mei Tran stops a car that rolled through a stop sign near a school. The driver is a close friend from high school, who laughs and says, 'Come on, it's me. You're not really going to write this up, are you?' What is the best course of action?","choices":["Handle the stop the same way she would for any other driver who did the same thing.","Let him go with no record of the stop, since no one was hurt and he is unlikely to do it again.","Give him a tougher penalty than she normally would, to prove that friendship earns no favors.","Agree to let it go this once, as long as he promises to keep it between the two of them."],"answer":0,"fixed":false,"principle":"Integrity","explanation":"Integrity means the outcome of a stop depends on what the driver did, not on who the driver is. Coming down harder than usual may look like the opposite of favoritism, but it is just as unfair; treating the friend exactly like anyone else is the only even-handed result."},{"id":"sp-004","section":"sjt","subtype":"integrity","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"While backing out of a parking space, Officer Kowalski's partner scrapes the patrol car against a low post, leaving a small dent. The partner says, 'This car is already banged up. Nobody will notice, so let's not mention it.' What is the best course of action?","choices":["Tell the partner the damage has to be reported, and make sure the supervisor is told.","Say nothing, because the partner was driving and any report is the partner's responsibility alone.","Go along with it for now, but be ready to tell the truth if a supervisor ever asks directly.","Suggest that the two of them quietly pay a body shop to fix the dent before anyone sees it."],"answer":0,"fixed":false,"principle":"Integrity","explanation":"Integrity: damage to department property is reported honestly, even when it is small and a co-worker would rather hide it. Staying quiet unless asked is tempting because it avoids friction, but it makes the officer part of concealing the damage."},{"id":"sp-005","section":"sjt","subtype":"integrity","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"Two days after turning in a report on a garage break-in, Officer Amara Okafor rereads her notes and realizes she typed the wrong house number in the report. No one has noticed the error. What is the best course of action?","choices":["Leave the report alone, since the street name is right and the mistake is unlikely to matter.","Tell her supervisor about the error and submit a correction to the report.","Wait to see whether anyone notices, and fix it only if she is asked about it.","Change the number in the filed report herself without telling anyone, so the error never draws attention."],"answer":1,"fixed":false,"principle":"Accountability","explanation":"Accountability means owning a mistake and correcting it openly, so everyone relying on the report knows what changed. Fixing it silently is tempting because the report ends up right, but altering a filed report without telling anyone hides the error instead of correcting it."},{"id":"sp-006","section":"sjt","subtype":"integrity","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":3,"stimulus":null,"stem":"Officer Hughes arrives at a tow yard just after a senior officer has finished listing the contents of a towed car. The senior officer hands him the list and says, 'Sign on the witness line. I counted everything, I just need a second signature.' Officer Hughes did not see the items counted. What is the best course of action?","choices":["Explain politely that he can sign only for what he saw, and offer to go through the items together now.","Sign the list, because a senior officer's word is reliable and refusing would damage their working relationship.","Sign the list, but keep a private note that he was not actually present for the count.","Refuse to sign, and tell the tow yard staff that the senior officer asked him to falsify a record."],"answer":0,"fixed":false,"principle":"Integrity","explanation":"Integrity: a witness signature says 'I saw this,' so an officer signs only for what he actually witnessed. Signing and keeping a private note is tempting because it feels like protection, but the official record would still be untrue; recounting together solves the problem honestly."},{"id":"sp-007","section":"sjt","subtype":"integrity","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"Before a shift, several officers are trading a rumor that Officer Priya Nair is about to be disciplined. One of them turns to Officer Ben Carver, who is new, and asks what he has heard. Carver has heard only the same rumor, secondhand. What is the best course of action?","choices":["Repeat what he heard, since everyone in the room already knows the rumor anyway.","Add a guess about the reason, so the others see him as part of the group.","Say that he knows nothing about it firsthand and decline to pass the rumor along.","Go to Officer Nair and give her the names of everyone who was talking about her."],"answer":2,"fixed":false,"principle":"Integrity","explanation":"Integrity includes not repeating things about a co-worker that he cannot verify. Repeating a rumor that 'everyone already knows' seems harmless, but each retelling makes it sound more true and wears away trust within the squad."},{"id":"sp-008","section":"sjt","subtype":"integrity","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"Officer Santos takes her personal car to a repair shop in the township where she works. The owner recognizes her and says, 'I'll take forty percent off for you. Just remember us when drivers at your crash scenes need a shop.' What is the best course of action?","choices":["Accept the discount, but make no promise to recommend the shop to anyone.","Decline the discount politely and pay the same price as any other customer.","Accept the discount and mention the shop only to drivers who ask her for a suggestion.","Tell the owner she will decide about his offer after she sees the quality of the work."],"answer":1,"fixed":false,"principle":"Integrity","explanation":"Integrity: a discount offered in return for steering business is a favor tied to her job, so she turns it down and pays what anyone else would. Taking the discount 'with no promises' is tempting, but the owner would still expect something back, and her recommendations could no longer be trusted."},{"id":"sp-009","section":"sjt","subtype":"chain-of-command","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"During a town parade, a sergeant assigns Officer Jamal Greene to stay at one intersection and keep cars off the route. After an hour the corner is quiet, and Greene believes he would be more useful two blocks away, where the crowd is larger. What is the best course of action?","choices":["Walk to the busier block for a while, since he can return quickly if cars approach his corner.","Ask another officer nearby to watch both corners so that he can move to where he is needed.","Stay at the assigned intersection and briefly let the sergeant know what he has observed.","Call the lieutenant in charge of the event and ask to be reassigned."],"answer":2,"fixed":false,"principle":"Chain of command","explanation":"Chain of command: the sergeant may have reasons for the post that the officer cannot see, so he holds it and passes his observation to the person who gave the order. Arranging his own coverage with another officer sounds responsible, but it changes the sergeant's plan without the sergeant knowing."},{"id":"sp-010","section":"sjt","subtype":"chain-of-command","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"Officer Elena Petrov turns in a crash report. Her sergeant hands it back and tells her to rewrite the narrative in strict time order. Petrov thinks her original version was clearer. What is the best course of action?","choices":["Turn the original back in with a note explaining why it is the clearer version.","Ask the lieutenant to read both versions and decide which one should be filed.","Rewrite it as directed, but let the other officers on the squad know the sergeant's format is confusing.","Rewrite the report as directed, and later explain respectfully why she preferred the original."],"answer":3,"fixed":false,"principle":"Chain of command","explanation":"Chain of command: a supervisor's reasonable direction is carried out first, and disagreement is raised respectfully with that supervisor afterward. Taking it to the lieutenant goes over the sergeant's head before the sergeant has even heard her concern."},{"id":"sp-011","section":"sjt","subtype":"chain-of-command","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":3,"stimulus":null,"stem":"At roll call, a sergeant tells Officer Nikhil Mehta to spend the first two hours of his shift checking the business district. Twenty minutes later, a lieutenant stops him in the hallway and tells him to go direct traffic at a school instead. The lieutenant does not seem to know about the sergeant's instruction. What should the officer do first?","choices":["Go to the school without comment, since the lieutenant outranks the sergeant.","Stay with the business district, since that assignment was given first.","Tell the lieutenant about the sergeant's assignment and ask which one to carry out.","Split the two hours between both assignments so that neither supervisor is let down."],"answer":2,"fixed":false,"principle":"Chain of command","explanation":"Chain of command works only when supervisors know what their officers have been told to do. Simply obeying the higher rank is tempting, but speaking up first lets the lieutenant decide with full information and keeps the sergeant from finding the business district unexpectedly uncovered."},{"id":"sp-012","section":"sjt","subtype":"chain-of-command","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":3,"stimulus":null,"stem":"While Officer Grace Adeyemi is taking a report at a convenience store, the clerk says quietly that another officer from her department often takes drinks and snacks from the store without paying. The clerk seems nervous about raising it. What is the best course of action?","choices":["Speak privately to the other officer first, so he has a chance to settle up before anyone else finds out.","Assure the clerk it is probably a misunderstanding, and suggest he raise it with that officer next time.","Listen, write down what the clerk says, and pass the information to her supervisor.","Stop by the store at different hours to see for herself whether it is true before saying anything."],"answer":2,"fixed":false,"principle":"Chain of command","explanation":"Chain of command: a citizen's report of possible misconduct goes to a supervisor, who has the authority to look into it fairly. Warning the other officer privately feels loyal, but it handles a complaint informally and takes the decision away from the people responsible for it."},{"id":"sp-013","section":"sjt","subtype":"chain-of-command","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"A sergeant tells the officers working a school-zone detail to give drivers verbal warnings only this week. Officer Tom Brennan believes written tickets would slow drivers down faster. What is the best course of action?","choices":["Give warnings as directed, and share his view with the sergeant after the shift.","Write tickets for the fastest drivers only, since the sergeant would surely want those drivers ticketed.","Give warnings as directed, but tell each driver that he personally thinks a ticket is deserved.","Send a message to the chief explaining why the sergeant's approach will not work."],"answer":0,"fixed":false,"principle":"Chain of command","explanation":"Chain of command: the sergeant's direction is followed as given, and a different opinion is offered respectfully afterward. Making an exception for the fastest drivers is tempting, but it replaces the supervisor's decision with his own."},{"id":"sp-014","section":"sjt","subtype":"chain-of-command","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":1,"stimulus":null,"stem":"After a month on patrol, Officer Hana Sato has an idea for a simpler way for her squad to hand off information between shifts. She thinks it would save time for everyone. What is the best course of action?","choices":["Explain the idea to her immediate supervisor and ask whether it could be tried.","Start using her own method right away so that others can see how well it works.","Write directly to the chief, since the chief has the power to change procedures.","Keep the idea to herself, because new officers should not make suggestions."],"answer":0,"fixed":false,"principle":"Chain of command","explanation":"Chain of command: suggestions go first to the immediate supervisor, who can weigh them and carry them upward. Writing straight to the chief skips the person responsible for the squad, and simply doing it her own way changes a shared procedure without approval."},{"id":"sp-015","section":"sjt","subtype":"chain-of-command","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"A member of the Fernwick Township board flags down Officer Diaz and says speeding on his street is out of control. He tells the officer to park on his block every evening this week. What is the best course of action?","choices":["Promise to park on his block every evening, since he is a township official.","Tell him that officers take assignments only from their supervisors and that he should not ask again.","Listen, write down the details, and tell him the request will go to the shift supervisor.","Quietly spend extra time on his street each evening and cover the rest of the patrol area when possible."],"answer":2,"fixed":false,"principle":"Chain of command","explanation":"Chain of command: where officers are assigned is the supervisor's decision, so the officer takes the concern seriously and passes it up. Promising the patrols himself is tempting because the request comes from an official, but it commits the shift to something only a supervisor can approve."},{"id":"sp-016","section":"sjt","subtype":"chain-of-command","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":3,"stimulus":null,"stem":"A sergeant instructs Officer Rachel Kim to get out of her car and check the doors of each closed business on Mill Street during the night shift. A veteran officer later tells her, 'Nobody actually walks those. Just drive by slowly and you're covered.' What is the best course of action?","choices":["Follow the veteran officer's advice, since he knows how things are really done on the night shift.","Drive by slowly, and note in her log that the businesses were checked.","Walk the doors only on nights when the sergeant is likely to be out watching.","Check the doors on foot, and take any question about what is expected to the sergeant."],"answer":3,"fixed":false,"principle":"Chain of command","explanation":"Chain of command: direction comes from the sergeant, not from a co-worker's shortcut, however experienced that co-worker is. Trusting the veteran is tempting for a new officer, but a slow drive-by does not do what the supervisor actually asked for."},{"id":"sp-017","section":"sjt","subtype":"de-escalation","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":1,"stimulus":null,"stem":"Officer Carla Morales is placing a parking ticket on a car outside a bakery when the owner runs out, red-faced, shouting that he was 'only inside for two minutes.' He is loud, but he keeps his distance and makes no threats. What should the officer do first?","choices":["Stay calm, let him finish, and then explain why the ticket was written and how to contest it.","Tell him that if he does not lower his voice immediately, he will be leaving in handcuffs.","Tear up the ticket, since it is not worth an argument on a busy street.","Finish writing, turn her back on him, and walk to her car without answering anything he has said."],"answer":0,"fixed":false,"principle":"De-escalation","explanation":"De-escalation: a person who is angry but not threatening usually calms down once he has been heard and given a clear explanation. Threatening him raises the tension over a parking ticket, and tearing the ticket up rewards shouting without resolving anything."},{"id":"sp-018","section":"sjt","subtype":"de-escalation","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":3,"stimulus":null,"stem":"Officer Andre Lowell is speaking with a driver during a traffic stop when a man on the sidewalk begins recording with his phone and calling out sarcastic remarks. The man is about twenty feet away and is not coming any closer. What is the best course of action?","choices":["Order the man to stop recording and put his phone away until the stop is over.","Walk over and explain to the man, on camera, why the driver was stopped.","Tell the man he will be taken into custody if he says one more word.","Continue the traffic stop in a professional manner and give the remarks no response."],"answer":3,"fixed":false,"principle":"De-escalation","explanation":"De-escalation: the man is at a distance and is not interfering, so the calm response is to keep doing the job well and give the remarks no reaction. Walking over to explain may seem reasonable, but it leaves the driver unattended and turns a bystander's comments into a confrontation."},{"id":"sp-019","section":"sjt","subtype":"de-escalation","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"Officer Ortiz is sent to a dispute between two neighbors over tree branches hanging across a fence. When he arrives, both are standing in a driveway shouting over each other, and each demands that he take their side. Neither has made any threat. What should the officer do first?","choices":["Ask them to step a short distance apart, and then hear each one out in turn.","Tell both of them to go inside immediately or each of them will be written up.","Decide on the spot who is in the right, so the argument ends quickly.","Explain that arguments over branches are not a police matter, and return to patrol."],"answer":0,"fixed":false,"principle":"De-escalation","explanation":"De-escalation: separating the two and listening to each lowers the volume and shows that both will be treated fairly. Picking a winner quickly is tempting, but ruling before hearing either side leaves at least one neighbor angrier than before."},{"id":"sp-020","section":"sjt","subtype":"de-escalation","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":1,"stimulus":null,"stem":"A store owner in Calder Heights calls to say that a group of teenagers has been standing in front of his entrance for an hour, laughing loudly and making it hard for customers to get in. When Officer Jensen arrives, the teens are joking around but are not bothering anyone directly. What is the best course of action?","choices":["Order them off the block at once, and warn that anyone still there in one minute will be taken in.","Walk over in a friendly manner, explain the owner's concern, and ask them to keep the doorway clear.","Tell the owner that teenagers will be teenagers and that there is nothing to be done.","Sit in the patrol car across the street with the lights flashing until the group gets uncomfortable and leaves."],"answer":1,"fixed":false,"principle":"De-escalation","explanation":"De-escalation: a respectful request that comes with a reason usually gets cooperation and solves the owner's problem without a confrontation. Ordering them off the block with a threat is tempting as the quick fix, but it invites an argument with a group that has done nothing more than crowd a doorway."},{"id":"sp-021","section":"sjt","subtype":"de-escalation","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"Officer Bauer stops a driver for a broken headlight. The driver hands over her license as asked, but she mutters insults about the police the whole time and tells him he should 'go find a real job.' What is the best course of action?","choices":["Stay polite, let the insults pass, and complete the stop the same way he would for any driver.","Explain firmly that she will be treated better once she shows some respect.","Look the car over for more problems to write up, since her attitude shows she needs a lesson.","Skip the paperwork and send her on her way, since she seems like the type to file a complaint."],"answer":0,"fixed":false,"principle":"De-escalation","explanation":"De-escalation: the driver is cooperating with every request, so her words are best met with calm professionalism. Demanding respect is tempting, but it starts an argument that has nothing to do with the headlight, and the stop should end the same way whether she is pleasant or rude."},{"id":"sp-022","section":"sjt","subtype":"de-escalation","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"A caller reports a man on a park bench in Larkfield Borough who has been crying and shouting at no one in particular. When Officer Yamada arrives, the man is alone on the bench with his hands in view, and he is not threatening anyone. What should the officer do first?","choices":["Call out sharply from across the park for him to quiet down.","Take him by the arm and walk him out of the park before he upsets any more of the people nearby.","Approach slowly, stop a few steps away, and ask in a calm voice whether he is all right.","Stand directly over him and tell him he must explain himself or leave."],"answer":2,"fixed":false,"principle":"De-escalation","explanation":"De-escalation: a slow approach, some space and a calm voice give an upset person room to settle and to talk. Walking him out by the arm may seem efficient, but touching someone who is already distressed, before even speaking to him, is likely to make things worse."},{"id":"sp-023","section":"sjt","subtype":"de-escalation","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"Officer Fontaine answers a noise complaint at a house party. The host comes to the door annoyed, and several guests gather behind him to watch and laugh. What should the officer do first?","choices":["Announce loudly to everyone inside that the party is over and the guests must go home.","Tell the host in front of his guests that he is being irresponsible.","Walk past the host and turn the music down himself.","Ask the host to step outside so the two of them can talk away from the guests."],"answer":3,"fixed":false,"principle":"De-escalation","explanation":"De-escalation: talking with the host privately removes the audience, so he can agree to lower the noise without losing face. Announcing that the party is over is tempting as a show of authority, but it challenges the whole crowd before a simple request has even been tried."},{"id":"sp-024","section":"sjt","subtype":"de-escalation","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":3,"stimulus":null,"stem":"Officer Lena Novak and her partner are speaking with a man whose car is about to be towed. The man is upset but not threatening. Her partner starts trading sharp remarks with him, and both voices are rising. What is the best course of action?","choices":["Step in calmly, take over the conversation with the man, and give her partner room to step back.","Stay out of it, because stepping in while a citizen is watching would undermine her partner.","Tell her partner in front of the man that he is the one causing the problem.","Radio for a supervisor to come to the scene, and say nothing until one arrives."],"answer":0,"fixed":false,"principle":"De-escalation","explanation":"De-escalation: a fresh, calm voice can lower the temperature, and taking over the talking does it without embarrassing anyone. Staying out of it seems loyal, but it lets an argument keep building that she is in a position to stop; criticizing her partner in front of the man would only add a second conflict."},{"id":"sp-025","section":"sjt","subtype":"officer-safety","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":1,"stimulus":null,"stem":"At 2:30 a.m., Officer Eze is patrolling alone in Marlow Township and sees the back door of a closed hardware store standing open. A flashlight beam is moving around inside. What should the officer do first?","choices":["Slip inside quietly to catch whoever is there before they have a chance to get away.","Stand in the doorway and shout for whoever is inside to come out.","Continue his patrol and plan to check the store again in an hour.","Radio what he sees, ask for backup, and watch the door from a protected spot."],"answer":3,"fixed":false,"principle":"Officer safety","explanation":"Officer safety: he is alone, cannot tell how many people are inside, and help is a radio call away. Going in quietly is tempting because the person might get away, but entering a dark building alone risks far more than waiting a few minutes for backup."},{"id":"sp-026","section":"sjt","subtype":"officer-safety","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":3,"stimulus":null,"stem":"Officer Castillo is the first to arrive at a report of a fight outside a bowling alley. Six people are shoving and yelling in the parking lot, no one appears to be badly hurt, and the dispatcher says a second unit is two minutes away. What should the officer do first?","choices":["Report what she sees by radio and stay where she can watch the group until the second unit arrives.","Step into the middle of the group and pull the two loudest people apart.","Take hold of the nearest person to show the others that the police are in control.","Drive a few blocks away and come back with the second unit, so that the group never sees her there alone."],"answer":0,"fixed":false,"principle":"Officer safety","explanation":"Officer safety: one officer cannot safely control six people, and with no one badly hurt, two minutes of watching and reporting costs little. Stepping in to separate the loudest pair is tempting, but it puts her in the middle of a crowd with no one to help; driving off would mean no one is watching if things get worse."},{"id":"sp-027","section":"sjt","subtype":"officer-safety","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"Late at night on an unlit road, Officer Darnell Bishop stops a car for driving without headlights. As he pulls in behind it, he sees four people inside turning around and moving about. He is working alone. What should the officer do first?","choices":["Tell the dispatcher where he is, and ask for another unit before walking up to the car.","Walk up to the car quickly, before the people inside have time to do anything.","Order all four people out of the car at once and have them stand around him.","Switch off his emergency lights and let the car drive away, since the stop is not worth the risk."],"answer":0,"fixed":false,"principle":"Officer safety","explanation":"Officer safety: he is outnumbered on a dark road and does not know what the movement means, so the first step is to make sure others know where he is and that help is coming. Hurrying to the window is tempting, but speed does not make up for being alone with no one aware of his situation."},{"id":"sp-028","section":"sjt","subtype":"officer-safety","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"Officer Walsh is first on the scene of a two-car crash on a busy road. Both drivers say they are not hurt, and they are standing between their cars in a travel lane, arguing, as traffic squeezes past. What should the officer do first?","choices":["Take each driver's statement right where they stand, while the details are still fresh in their minds.","Shield the scene with the patrol car's emergency lights and move both drivers off the roadway.","Photograph the position of both cars before anything is disturbed.","Stand in the open lane and wave traffic around the two cars."],"answer":1,"fixed":false,"principle":"Officer safety","explanation":"Officer safety, along with the safety of everyone at the scene, comes before paperwork: people standing in a live traffic lane are the most urgent problem. Taking statements while memories are fresh is tempting, but statements can wait two minutes and a second collision cannot be undone."},{"id":"sp-029","section":"sjt","subtype":"officer-safety","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":1,"stimulus":null,"stem":"Officer Chowdhury is sent to check on a house where a neighbor reports a strong smell of gas. The resident opens the door, says she feels dizzy, and asks him to come in and look at her stove. The smell is strong at the doorway. What should the officer do first?","choices":["Go inside with her to find where the smell is coming from.","Go in with her, open the windows, and switch on the kitchen fan to clear the air before anyone else arrives.","Get the resident well away from the house and ask the dispatcher to send the fire department.","Advise her to keep the stove off and call the gas company in the morning."],"answer":2,"fixed":false,"principle":"Officer safety","explanation":"Officer safety: a strong gas smell and a dizzy resident mean the house itself is the danger, so the first job is to get people away and call those equipped to handle it. Going in to find the source feels helpful, but it puts two people at risk instead of none."},{"id":"sp-030","section":"sjt","subtype":"officer-safety","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":1,"stimulus":null,"stem":"A bus station worker points out a taped cardboard box that has been sitting under a bench for an hour. Officer Park can see wires sticking out of one corner, and no one in the station claims it. What should the officer do first?","choices":["Open the box carefully to see whether it is something harmless.","Move people away, leave the box untouched, and report it to the dispatcher.","Carry the box outside to an empty part of the parking lot.","Put the box in the lost-and-found office so that the owner can come back and claim it."],"answer":1,"fixed":false,"principle":"Officer safety","explanation":"Officer safety: when an object could be dangerous, the officer keeps people back and calls for those trained to deal with it instead of handling it. Carrying it outside seems protective, but moving an unknown package is exactly the risk to avoid."},{"id":"sp-031","section":"sjt","subtype":"officer-safety","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":1,"stimulus":null,"stem":"Officer Keller needs to speak with a resident about a wallet that was turned in. As she reaches the gate, a large dog inside the fenced yard charges the fence, barking and snapping. No one comes out of the house. What is the best course of action?","choices":["Open the gate slowly and walk to the door while speaking softly to the dog.","Climb the fence at the far corner of the yard, away from the dog.","Stay outside the fence and have the dispatcher try to reach the resident by phone.","Rattle the gate and shout until the dog backs away from it."],"answer":2,"fixed":false,"principle":"Officer safety","explanation":"Officer safety: returning a wallet is not urgent, so there is no reason to enter a yard with an aggressive dog when a phone call will do. Easing through the gate while talking softly is tempting, but it bets her safety on a dog that is already charging the fence."},{"id":"sp-032","section":"sjt","subtype":"following-policy","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"A resident stops Officer Singh in a parking lot and hands him a shopping bag full of prescription medicines that belonged to a relative who died. She asks him to get rid of them. He has never handled this before and does not know his department's procedure. What should the officer do first?","choices":["Drop the bag in the trash bin behind the station at the end of his shift.","Contact his supervisor and ask how the department wants the medicines handled.","Put the bag in his locker until he has time to look up the procedure.","Hand the bag back and tell her the police have nothing to do with medicines."],"answer":1,"fixed":false,"principle":"Following policy","explanation":"Following policy: when an officer does not know the procedure, the right move is to ask before acting, not to guess. Keeping the bag in his locker until he can look it up sounds careful, but it leaves medicines unrecorded in his personal space, and a quick call to a supervisor settles it at once."},{"id":"sp-033","section":"sjt","subtype":"following-policy","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":1,"stimulus":null,"stem":"Officer Alvarez and his partner are running ten minutes late leaving the station. Their department requires officers to check the patrol car's lights, siren and equipment before each shift, and the partner says, 'Skip it today. It was fine yesterday.' What is the best course of action?","choices":["Skip the check and mark it as completed, since the car was fine yesterday.","Skip the check now and do it at the end of the shift instead.","Check only the lights, since those are the most likely to fail.","Do the full check before leaving, as quickly as it can be done properly."],"answer":3,"fixed":false,"principle":"Following policy","explanation":"Following policy: the check exists so that problems are found before the car is needed in an emergency, which is exactly when it is too late to discover them. Doing it at the end of the shift is tempting as a compromise, but that defeats the purpose of a check that is required before going out."},{"id":"sp-034","section":"sjt","subtype":"following-policy","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"Ten minutes before her shift ends, a jogger hands Officer Ito a cell phone found on a trail. Her department requires every found item to be logged before the officer goes off duty. A co-worker says, 'Just leave it in your desk and log it tomorrow. Nobody will care.' What is the best course of action?","choices":["Lock the phone in her desk overnight and log it first thing in the morning.","Log the phone as found property before she leaves, even though it means staying a little late.","Leave the phone on the co-worker's desk with a note asking him to log it when he can.","Take the phone home so it is safe, and bring it back for logging tomorrow."],"answer":1,"fixed":false,"principle":"Following policy","explanation":"Following policy: the rule is stated plainly, and it exists so that found property is never sitting unrecorded. Locking the phone in her desk overnight seems safe enough, but an unlogged item in a desk is the very gap the rule is meant to close."},{"id":"sp-035","section":"sjt","subtype":"following-policy","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"Officer Ferraro is keeping onlookers back from a house fire when a news reporter holds out a microphone and asks what caused it and whether anyone was hurt. Ferraro has overheard a few things from firefighters but has no official information, and his sergeant is nearby. What is the best course of action?","choices":["Share what he overheard from the firefighters, making clear that none of it has been confirmed.","Say 'no comment' and order the reporter to leave the area.","Give his own opinion of the cause, but ask her not to use his name.","Politely say he cannot speak for the department, and point her to the sergeant."],"answer":3,"fixed":false,"principle":"Following policy","explanation":"Following policy: a new officer does not speak for the department, least of all with unconfirmed information, so he refers the question to the supervisor on scene. Passing along what he overheard with a warning is tempting, but once it is broadcast the warning is forgotten and the error belongs to the department."},{"id":"sp-036","section":"sjt","subtype":"following-policy","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"A man about to be taken to the hospital by ambulance asks Officer Dunn to hold his toolbox for safekeeping. Department procedure requires a written receipt whenever an officer takes a citizen's property. The man says, 'Don't bother with the paperwork. I trust you.' What is the best course of action?","choices":["Skip the receipt, since the owner himself has said it is not needed.","Take the toolbox now and write the receipt from memory after the shift.","Have the man sign a blank receipt and fill in the details later.","Fill out the receipt anyway, and explain that it protects both of them."],"answer":3,"fixed":false,"principle":"Following policy","explanation":"Following policy: the receipt is required whether or not the owner asks for one, and it is what shows later exactly what was taken and returned. Skipping it because the owner said so is tempting, but his trust today does not settle a disagreement next week about what was in the box."},{"id":"sp-037","section":"sjt","subtype":"following-policy","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":1,"stimulus":null,"stem":"At a hurried roll call, a sergeant explains a new form that officers must fill out for every alarm call. Officer Rosen, who is new, does not understand which part of the form the officer completes and which part the business owner completes. What is the best course of action?","choices":["Fill the form out whichever way seems most logical, and wait to see if it is sent back.","Ask the sergeant to clarify before going out on patrol.","Copy whatever another new officer does, since they both heard the same instructions.","Let each business owner decide which sections to fill out."],"answer":1,"fixed":false,"principle":"Following policy","explanation":"Following policy: an officer cannot follow a procedure he does not understand, and a question now takes a minute. Guessing and waiting to be corrected is tempting when the sergeant seems rushed, but it means the first several forms may all be wrong."},{"id":"sp-038","section":"sjt","subtype":"following-policy","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"Officers in Stonebridge Township are told in training that department records may be looked up only for official police work. Officer Abernathy's cousin calls and asks her to look up the name and address that go with a license plate, because the driver was rude to him in a parking lot. What is the best course of action?","choices":["Look it up this once, since he is family and only wants a name.","Look it up herself, and tell him only whether the driver seems worth worrying about.","Suggest that he ask a different officer, so that she is not the one involved.","Explain that the records are for police work only, and decline to look up the plate."],"answer":3,"fixed":false,"principle":"Following policy","explanation":"Following policy: the rule given in training is clear, and a personal grudge is not police work. Looking it up but holding back the details is tempting as a middle path, but the search itself is the misuse, no matter how little she passes on."},{"id":"sp-039","section":"sjt","subtype":"service","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":1,"stimulus":null,"stem":"Officer Haddad arrives at a home that was broken into while the owner was at work. The owner is standing in the living room in tears, repeating that her late mother's jewelry is gone. He needs a list of what was taken. What should the officer do first?","choices":["Tell her she needs to calm down so that he can do his job.","Promise her that the jewelry will be found and returned.","Say he is sorry this happened, give her a moment, and then ask his questions gently.","Hand her a blank form to fill out on her own, and wait outside on the porch until she is done."],"answer":2,"fixed":false,"principle":"Service and respect","explanation":"Service and respect: a victim who feels heard gives better information, and a moment of patience costs very little. Promising that the jewelry will be returned is tempting because it would comfort her, but it is a promise the officer cannot be sure of keeping."},{"id":"sp-040","section":"sjt","subtype":"service","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"A woman hurries up to Officer Lindqvist on a downtown sidewalk, speaking quickly in a language he does not understand and pointing down a side street. She looks worried, but he cannot tell what she is trying to say. What should the officer do first?","choices":["Repeat his questions in English, more slowly and loudly each time, until she understands.","Use simple gestures to learn whether someone is hurt, and ask the dispatcher for an interpreter.","Tell her to find someone who speaks English and come back with that person.","Nod politely and continue his patrol, since he cannot take a report without understanding what she says."],"answer":1,"fixed":false,"principle":"Service and respect","explanation":"Service and respect: everyone is entitled to help, whatever language they speak, so he works to understand her and gets an interpreter. Speaking louder is the common instinct, but volume does not translate anything, and it can come across as anger."},{"id":"sp-041","section":"sjt","subtype":"service","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":1,"stimulus":null,"stem":"At 6:00 a.m., Officer Delgado sees an elderly man in pajamas and slippers walking along a busy road. He says he is going home, but he cannot tell her his address or what day it is. What is the best course of action?","choices":["Point him toward the nearest houses and suggest he knock until someone recognizes him.","Stay with him, look for an ID bracelet, and ask the dispatcher about missing-person reports.","Tell him firmly that she cannot help until he remembers where he lives.","Seat him on a bench well away from the traffic, and come back to check on him in about an hour."],"answer":1,"fixed":false,"principle":"Service and respect","explanation":"Service and respect: a confused person near traffic cannot be left to manage alone, so she stays with him and works to find out who he is. Seating him safely and checking back sounds considerate, but a confused man is likely to wander off again the moment she leaves."},{"id":"sp-042","section":"sjt","subtype":"service","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"Officer Patel is at a resident's front door taking a report about a garden statue stolen sometime last week. The dispatcher announces a crash with injuries three blocks away and asks for the nearest unit. He is the closest officer. What is the best course of action?","choices":["Finish taking the theft report first, since he is already in the middle of it and needs only a few more minutes.","Leave for the crash at once without stopping to say anything to the resident.","Tell the resident an emergency has come up and he will finish the report later, then go to the crash.","Stay quiet on the radio and let a unit that is not busy take the crash."],"answer":2,"fixed":false,"principle":"Service and respect","explanation":"Service and respect: people who may be hurt come before a week-old theft, and a ten-second explanation lets the resident know she has not been forgotten. Finishing the report first is tempting because he is halfway through, but the statue report can wait and injured people cannot."},{"id":"sp-043","section":"sjt","subtype":"service","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":2,"stimulus":null,"stem":"At the end of a traffic stop, a driver tells Officer O'Malley that she was rude and that he intends to file a complaint against her. She believes she was polite throughout. What is the best course of action?","choices":["Explain point by point why she was not rude, and ask him to reconsider before he does anything.","Stay courteous, give him her name and badge number, and tell him how to reach a supervisor.","Decline to give her name, since she is confident the complaint has no basis.","Tell him that complaints like his are a waste of everyone's time."],"answer":1,"fixed":false,"principle":"Accountability","explanation":"Accountability: an officer's conduct is open to review, so she makes it easy for the driver to raise his concern even though she disagrees with it. Arguing her side at the roadside is tempting, but it is likely to look like pressure to drop the complaint; the review is where her side gets heard."},{"id":"sp-044","section":"sjt","subtype":"service","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":1,"stimulus":null,"stem":"Yesterday Officer Tariq Hassan told a resident he would call her that afternoon with the report number she needs for her insurance company. He got busy and forgot. He remembers at the start of today's shift. What is the best course of action?","choices":["Wait for her to call the station, since she will ask for the number when she needs it.","Ask the front desk to call her, so that he does not have to explain the delay.","Call her now, apologize for the delay, and give her the report number.","Call her and say the number only became available this morning."],"answer":2,"fixed":false,"principle":"Accountability","explanation":"Accountability: he made a promise and missed it, so he owns the slip and fixes it himself right away. Having the front desk call would get her the number, but it dodges the apology she is owed, and saying the number was not ready would be a lie."},{"id":"sp-045","section":"sjt","subtype":"service","families":["upper-dublin","montco"],"products":["ngle","ntn"],"difficulty":3,"stimulus":null,"stem":"A woman stops Officer Anika Rao at a community event and says, clearly frustrated, that her bicycle was stolen three weeks ago and no one has called her back. Rao did not take the report and knows nothing about the case. What is the best course of action?","choices":["Explain that it is not her case and that the woman should call the station again and ask for a detective.","Assure her that the department is close to finding the bicycle.","Tell her that stolen bicycles are rarely recovered and she should not expect a call.","Take her name and number, and find out who has the case so that someone calls her back."],"answer":3,"fixed":false,"principle":"Service and respect","explanation":"Service and respect: to the woman, any officer is the department, so Rao takes ownership of getting her a reply. Sending her back to the station is accurate, but it leaves her exactly where she started, and reassuring her without knowing the facts would be dishonest."},{"id":"sx-001","section":"spatial","subtype":"compass-turns","families":["upper-dublin"],"products":["ncjosi2"],"difficulty":1,"stimulus":null,"stem":"Officer Reyes is driving east on Elm Street. The officer turns left, then turns left. In which direction is the officer now traveling?","choices":["North","East","South","West"],"answer":3,"fixed":true,"explanation":"Track the heading one move at a time, starting east: left -> north; left -> west. The officer ends up traveling west."},{"id":"sx-002","section":"spatial","subtype":"compass-turns","families":["upper-dublin"],"products":["ncjosi2"],"difficulty":1,"stimulus":null,"stem":"Officer Chen is driving north on Mill Road. The officer turns left, then makes a U-turn. In which direction is the officer now traveling?","choices":["North","East","South","West"],"answer":1,"fixed":true,"explanation":"Track the heading one move at a time, starting north: left -> west; U-turn -> east. The officer ends up traveling east."},{"id":"sx-003","section":"spatial","subtype":"compass-turns","families":["upper-dublin"],"products":["ncjosi2"],"difficulty":1,"stimulus":null,"stem":"Officer Okafor is driving north on Harbor Avenue. The officer turns right, then turns left. In which direction is the officer now traveling?","choices":["North","East","South","West"],"answer":0,"fixed":true,"explanation":"Track the heading one move at a time, starting north: right -> east; left -> north. The officer ends up traveling north."},{"id":"sx-004","section":"spatial","subtype":"compass-turns","families":["upper-dublin"],"products":["ncjosi2"],"difficulty":2,"stimulus":null,"stem":"Officer Novak is driving west on Kestrel Lane. The officer turns left, then turns left, then makes a U-turn. In which direction is the officer now traveling?","choices":["North","East","South","West"],"answer":3,"fixed":true,"explanation":"Track the heading one move at a time, starting west: left -> south; left -> east; U-turn -> west. The officer ends up traveling west."},{"id":"sx-005","section":"spatial","subtype":"compass-turns","families":["upper-dublin"],"products":["ncjosi2"],"difficulty":2,"stimulus":null,"stem":"Officer Haddad is driving south on Quarry Road. The officer makes a U-turn, then turns left, then turns left. In which direction is the officer now traveling?","choices":["North","East","South","West"],"answer":2,"fixed":true,"explanation":"Track the heading one move at a time, starting south: U-turn -> north; left -> west; left -> south. The officer ends up traveling south."},{"id":"sx-006","section":"spatial","subtype":"compass-turns","families":["upper-dublin"],"products":["ncjosi2"],"difficulty":2,"stimulus":null,"stem":"Officer Brandt is driving south on Tanner Street. The officer turns right, then turns right, then turns left. In which direction is the officer now traveling?","choices":["North","East","South","West"],"answer":3,"fixed":true,"explanation":"Track the heading one move at a time, starting south: right -> west; right -> north; left -> west. The officer ends up traveling west."},{"id":"sx-007","section":"spatial","subtype":"compass-turns","families":["upper-dublin"],"products":["ncjosi2"],"difficulty":2,"stimulus":null,"stem":"Officer Singh is driving south on Linden Avenue. The officer turns right, then turns left, then turns left, then makes a U-turn. In which direction is the officer now traveling?","choices":["North","East","South","West"],"answer":3,"fixed":true,"explanation":"Track the heading one move at a time, starting south: right -> west; left -> south; left -> east; U-turn -> west. The officer ends up traveling west."},{"id":"sx-008","section":"spatial","subtype":"compass-turns","families":["upper-dublin"],"products":["ncjosi2"],"difficulty":2,"stimulus":null,"stem":"Officer Moreau is driving north on Ferry Road. The officer turns right, then makes a U-turn, then turns left, then turns right. In which direction is the officer now traveling?","choices":["North","East","South","West"],"answer":3,"fixed":true,"explanation":"Track the heading one move at a time, starting north: right -> east; U-turn -> west; left -> south; right -> west. The officer ends up traveling west."},{"id":"sx-009","section":"spatial","subtype":"compass-turns","families":["upper-dublin"],"products":["ncjosi2"],"difficulty":2,"stimulus":null,"stem":"Officer Castillo is driving east on Juniper Street. The officer turns right, then turns left, then makes a U-turn, then turns left. In which direction is the officer now traveling?","choices":["North","East","South","West"],"answer":2,"fixed":true,"explanation":"Track the heading one move at a time, starting east: right -> south; left -> east; U-turn -> west; left -> south. The officer ends up traveling south."},{"id":"sx-010","section":"spatial","subtype":"compass-turns","families":["upper-dublin"],"products":["ncjosi2"],"difficulty":3,"stimulus":null,"stem":"Officer Whitfield is driving east on Canal Street. The officer turns right, then turns left, then turns right, then turns left, then turns left. In which direction is the officer now traveling?","choices":["North","East","South","West"],"answer":0,"fixed":true,"explanation":"Track the heading one move at a time, starting east: right -> south; left -> east; right -> south; left -> east; left -> north. The officer ends up traveling north."},{"id":"sx-011","section":"spatial","subtype":"compass-turns","families":["upper-dublin"],"products":["ncjosi2"],"difficulty":3,"stimulus":null,"stem":"Officer Tanaka is driving north on Orchard Road. The officer turns right, then turns left, then makes a U-turn, then turns left, then turns left. In which direction is the officer now traveling?","choices":["North","East","South","West"],"answer":0,"fixed":true,"explanation":"Track the heading one move at a time, starting north: right -> east; left -> north; U-turn -> south; left -> east; left -> north. The officer ends up traveling north."},{"id":"sx-012","section":"spatial","subtype":"compass-turns","families":["upper-dublin"],"products":["ncjosi2"],"difficulty":3,"stimulus":null,"stem":"Officer Abara is driving east on Summit Avenue. The officer turns right, then makes a U-turn, then turns right, then turns right, then turns right. In which direction is the officer now traveling?","choices":["North","East","South","West"],"answer":3,"fixed":true,"explanation":"Track the heading one move at a time, starting east: right -> south; U-turn -> north; right -> east; right -> south; right -> west. The officer ends up traveling west."},{"id":"sx-013","section":"spatial","subtype":"left-right","families":["upper-dublin"],"products":["ncjosi2"],"difficulty":1,"stimulus":null,"stem":"An officer on foot is facing south. There is a pharmacy to the officer's right. In which direction is it from the officer?","choices":["North","East","South","West"],"answer":3,"fixed":true,"explanation":"Facing south, right is west, left is east and behind is north. So it is to the west."},{"id":"sx-014","section":"spatial","subtype":"left-right","families":["upper-dublin"],"products":["ncjosi2"],"difficulty":1,"stimulus":null,"stem":"An officer on foot is facing north. There is a bus shelter to the officer's left. In which direction is it from the officer?","choices":["North","East","South","West"],"answer":3,"fixed":true,"explanation":"Facing north, right is east, left is west and behind is south. So it is to the west."},{"id":"sx-015","section":"spatial","subtype":"left-right","families":["upper-dublin"],"products":["ncjosi2"],"difficulty":1,"stimulus":null,"stem":"An officer on foot is facing south. There is a fire hydrant directly behind the officer. In which direction is it from the officer?","choices":["North","East","South","West"],"answer":0,"fixed":true,"explanation":"Facing south, right is west, left is east and behind is north. So it is to the north."},{"id":"sx-016","section":"spatial","subtype":"left-right","families":["upper-dublin"],"products":["ncjosi2"],"difficulty":1,"stimulus":null,"stem":"An officer on foot is facing south. There is a parked delivery van to the officer's right. In which direction is it from the officer?","choices":["North","East","South","West"],"answer":3,"fixed":true,"explanation":"Facing south, right is west, left is east and behind is north. So it is to the west."},{"id":"sx-017","section":"spatial","subtype":"left-right","families":["upper-dublin"],"products":["ncjosi2"],"difficulty":1,"stimulus":null,"stem":"An officer on foot is facing east. There is the bank entrance to the officer's left. In which direction is it from the officer?","choices":["North","East","South","West"],"answer":0,"fixed":true,"explanation":"Facing east, right is south, left is north and behind is west. So it is to the north."},{"id":"sx-018","section":"spatial","subtype":"left-right","families":["upper-dublin"],"products":["ncjosi2"],"difficulty":1,"stimulus":null,"stem":"An officer on foot is facing west. There is a mailbox directly behind the officer. In which direction is it from the officer?","choices":["North","East","South","West"],"answer":1,"fixed":true,"explanation":"Facing west, right is north, left is south and behind is east. So it is to the east."},{"id":"sx-019","section":"spatial","subtype":"left-right","families":["upper-dublin"],"products":["ncjosi2"],"difficulty":2,"stimulus":null,"stem":"An officer walks west out of the station and turns right onto Main Street. As the officer walks along Main Street, the alley is on the officer's right. Which side of Main Street is it on?","choices":["The north side","The east side","The south side","The west side"],"answer":1,"fixed":true,"explanation":"Walking west and turning right puts the officer heading north. Heading north, the right hand points east, so it is on the east side."},{"id":"sx-020","section":"spatial","subtype":"left-right","families":["upper-dublin"],"products":["ncjosi2"],"difficulty":2,"stimulus":null,"stem":"An officer walks west out of the station and turns left onto Carver Avenue. As the officer walks along Carver Avenue, a bakery is on the officer's right. Which side of Carver Avenue is it on?","choices":["The north side","The east side","The south side","The west side"],
