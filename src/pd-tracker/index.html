<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PD Tracker</title>
<meta name="description" content="Track police department applications, sponsorships, and hiring steps.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#13294b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PD Tracker">
<style>
:root {
  --bg: #e8ecf1;
  --surface: #ffffff;
  --surface-2: #f2f4f7;
  --text: #0b1726;
  --muted: #3f4d5e;
  --border: #c3ccd7;
  --border-strong: #8592a3;
  --navy: #13294b;
  --accent: #1a4a99;
  --primary: #13294b;
  --primary-ink: #ffffff;
  --focus: #2f6fde;
  --danger: #a3221b;
  --danger-bg: #fdeceb;
  --warn-bg: #fff3d1;
  --warn-border: #b77c00;
  --warn-text: #4d3300;
  --ok: #1e6b3a;
  --input-bg: #ffffff;
  --tab-h: 64px;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0a111c;
    --surface: #131c2b;
    --surface-2: #1a2538;
    --text: #eef2f7;
    --muted: #b0bccb;
    --border: #2f3d52;
    --border-strong: #6a7a90;
    --navy: #0e1d36;
    --accent: #a8c6ff;
    --primary: #a8c6ff;
    --primary-ink: #06101f;
    --focus: #a8c6ff;
    --danger: #ff8a80;
    --danger-bg: #3a1513;
    --warn-bg: #3a2c06;
    --warn-border: #e0aa1f;
    --warn-text: #ffe6a1;
    --ok: #7fd49c;
    --input-bg: #0e1625;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
a { color: var(--accent); }
h1, h2, h3 { line-height: 1.2; margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* Top bar */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--navy); color: #fff;
  padding: calc(env(safe-area-inset-top) + 8px) 16px 8px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.topbar .brand { font-size: 19px; font-weight: 750; letter-spacing: .2px; color: #fff; text-decoration: none; }
.topbar .data-link {
  color: #fff; min-height: 44px; display: inline-flex; align-items: center; gap: 6px;
  padding: 0 14px; border: 1.5px solid rgba(255,255,255,.6); border-radius: 10px;
  text-decoration: none; font-weight: 650; font-size: 15px;
}
.topbar .data-link[aria-current="page"] { background: #fff; color: #13294b; }
.topbar .data-link svg { width: 18px; height: 18px; }

main {
  max-width: 760px; margin: 0 auto;
  padding: 16px 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 28px);
}

/* Bottom tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; background: var(--surface);
  border-top: 1.5px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar a {
  flex: 1; position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: var(--tab-h); color: var(--muted); text-decoration: none;
  font-size: 13px; font-weight: 650;
}
.tabbar a svg { width: 25px; height: 25px; }
.tabbar a[aria-current="page"] { color: var(--accent); }
.tabbar a[aria-current="page"]::before {
  content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px;
  background: var(--accent); border-radius: 0 0 3px 3px;
}
@media (min-width: 760px) {
  .tabbar { justify-content: center; }
  .tabbar a { flex: 0 1 200px; }
}

/* Generic blocks */
.page-title { font-size: 24px; font-weight: 780; margin: 4px 0 14px; }
.card {
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px;
}
.card > h2, .section-title { font-size: 18px; font-weight: 750; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.count-pill {
  font-size: 13px; font-weight: 700; background: var(--surface-2); color: var(--muted);
  border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px;
}
.muted { color: var(--muted); }
.small { font-size: 15px; }
.empty { color: var(--muted); margin: 6px 0; }
.stack > * + * { margin-top: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border-radius: 10px;
  font: inherit; font-weight: 680; text-decoration: none; cursor: pointer;
  border: 2px solid var(--border-strong); background: var(--surface); color: var(--text);
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn-danger { color: var(--danger); border-color: var(--danger); background: var(--surface); }
.btn-danger-solid { background: var(--danger); color: #fff; border-color: var(--danger); }
@media (prefers-color-scheme: dark) { .btn-danger-solid { color: #1a0402; } }
.btn-small { min-height: 44px; padding: 0 14px; font-size: 15px; }
.btn-block { width: 100%; }
.btn svg { width: 18px; height: 18px; flex: none; }
.link-btn {
  background: none; border: 0; padding: 0 4px; min-height: 44px; font: inherit; font-size: 15px;
  font-weight: 650; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
}
.link-btn.danger { color: var(--danger); }

/* Forms */
.fields { display: grid; gap: 14px; }
@media (min-width: 560px) { .fields { grid-template-columns: 1fr 1fr; } .span2 { grid-column: 1 / -1; } }
.field label { display: block; font-size: 15px; font-weight: 680; margin-bottom: 5px; }
.field .req { font-weight: 500; color: var(--muted); }
input[type=text], input[type=url], input[type=email], input[type=tel], input[type=number],
input[type=date], input[type=search], select, textarea {
  display: block; width: 100%; min-width: 0; min-height: 48px;
  font: inherit; font-size: 17px; color: var(--text);
  background: var(--input-bg); border: 1.5px solid var(--border-strong); border-radius: 10px;
  padding: 10px 12px;
}
input[type=date] { -webkit-appearance: none; appearance: none; }
input[type=date]::-webkit-date-and-time-value { text-align: left; }
textarea { resize: vertical; line-height: 1.4; }
select { cursor: pointer; }
.field-error { color: var(--danger); font-size: 15px; font-weight: 650; margin-top: 5px; }
[aria-invalid="true"] { border-color: var(--danger) !important; border-width: 2px !important; }
.form-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.form-actions .btn { flex: 1 1 140px; }
fieldset { border: 0; padding: 0; margin: 0; }
legend { font-size: 18px; font-weight: 750; padding: 0; margin-bottom: 12px; }

/* Status badges */
.badge {
  display: inline-block; padding: 3px 10px; border-radius: 999px;
  font-size: 13.5px; font-weight: 720; line-height: 1.35; color: #fff; white-space: nowrap;
  border: 1.5px solid transparent;
}
.s-researching { background: #56616f; }
.s-applied { background: #1d4fa3; }
.s-written-test, .s-pt-test, .s-oral-board { background: #4a3d9e; }
.s-background, .s-polygraph-psych, .s-medical { background: #8a4600; }
.s-conditional-offer { background: #0c6b5a; }
.s-hired { background: #1e6b3a; }
.s-rejected { background: #a3221b; }
.s-withdrawn { background: #343c48; }
.s-on-hold { background: transparent; color: var(--text); border: 1.5px dashed var(--border-strong); }
@media (prefers-color-scheme: dark) { .s-withdrawn { background: #4b5463; } }
.dot { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block; }
.prio { font-size: 14px; font-weight: 720; padding: 2px 9px; border-radius: 6px; border: 1.5px solid; white-space: nowrap; }
.prio-High { color: var(--danger); border-color: var(--danger); }
.prio-Med { color: var(--warn-text); border-color: var(--warn-border); }
.prio-Low { color: var(--muted); border-color: var(--border-strong); }

/* Dashboard */
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.summary div { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
.summary b { display: block; font-size: 28px; line-height: 1.1; }
.summary span { font-size: 14px; font-weight: 650; color: var(--muted); }
.stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 560px) { .stat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.stat {
  display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 12px;
  background: var(--surface-2); border: 1.5px solid var(--border); border-radius: 10px;
  font: inherit; color: var(--text); text-align: left; cursor: pointer; width: 100%;
}
.stat { gap: 8px; }
.stat b { font-size: 22px; min-width: 1.1em; }
.stat span:last-child { font-size: 14.5px; font-weight: 650; line-height: 1.2; min-width: 0; }
.backup { border-left: 6px solid var(--ok); }
.backup.warn { background: var(--warn-bg); border-color: var(--warn-border); border-left-color: var(--warn-border); color: var(--warn-text); }
.backup.warn .muted { color: var(--warn-text); }
.backup p { margin: 0 0 10px; }
.alert-card { border-left: 6px solid var(--danger); }
.events { list-style: none; margin: 0; padding: 0; }
.events li + li { border-top: 1px solid var(--border); }
.event {
  display: grid; grid-template-columns: 58px 1fr; gap: 12px; align-items: center;
  padding: 10px 0; min-height: 60px; text-decoration: none; color: var(--text);
}
.datebox {
  background: var(--navy); color: #fff; border-radius: 9px; text-align: center; padding: 5px 0; line-height: 1.1;
}
@media (prefers-color-scheme: dark) { .datebox { background: #24375a; } }
.datebox small { display: block; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.datebox b { font-size: 21px; }
.datebox.overdue { background: var(--danger); }
@media (prefers-color-scheme: dark) { .datebox.overdue { background: #8f1d17; } }
.event-title { font-weight: 720; overflow-wrap: anywhere; }
.event-sub { font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
.event-when { font-weight: 720; }
.event-when.late { color: var(--danger); }

/* List */
.controls { display: grid; gap: 10px; margin-bottom: 12px; }
.controls-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
.controls-row label { font-size: 14px; font-weight: 680; display: block; margin-bottom: 4px; }
details.filters { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); }
details.filters > summary {
  list-style: none; cursor: pointer; min-height: 48px; padding: 0 14px;
  display: flex; align-items: center; justify-content: space-between; font-weight: 700;
}
details.filters > summary::-webkit-details-marker { display: none; }
details.filters > summary::after { content: "Show"; font-size: 14px; color: var(--accent); font-weight: 650; }
details.filters[open] > summary::after { content: "Hide"; }
.filters-body { padding: 0 14px 14px; display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
.filters-body .field label { font-size: 14px; }
.check {
  display: flex; align-items: center; gap: 12px; min-height: 48px; cursor: pointer; font-weight: 650;
}
.check input { width: 26px; height: 26px; margin: 0; flex: none; accent-color: var(--primary); cursor: pointer; }
.result-line { display: flex; justify-content: space-between; align-items: center; font-size: 15px; color: var(--muted); margin: 4px 2px 8px; min-height: 44px; }
.dept-card {
  display: block; text-decoration: none; color: var(--text);
  background: var(--surface); border: 1.5px solid var(--border); border-left-width: 6px;
  border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px;
}
.dept-card.p-High { border-left-color: var(--danger); }
.dept-card.p-Med { border-left-color: var(--warn-border); }
.dept-card.p-Low { border-left-color: var(--border-strong); }
.dept-card:active { background: var(--surface-2); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-top h3 { font-size: 18px; font-weight: 760; overflow-wrap: anywhere; }
.card-meta { font-size: 15px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
.card-next { margin-top: 8px; font-size: 16px; overflow-wrap: anywhere; }
.card-next .late { color: var(--danger); font-weight: 720; }
.card-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: 14px; color: var(--muted); }

/* Detail */
.back {
  display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 6px 0 0;
  background: none; border: 0; color: var(--accent); font: inherit; font-weight: 680; cursor: pointer;
}
.back svg { width: 20px; height: 20px; }
.detail-head h1 { font-size: 25px; font-weight: 790; overflow-wrap: anywhere; margin: 2px 0 4px; }
.detail-head .meta { color: var(--muted); font-size: 15.5px; overflow-wrap: anywhere; }
.detail-head .row { margin-top: 8px; }
.progress { height: 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.progress span { display: block; height: 100%; background: var(--accent); }
.quick-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 14px; }
.quick-actions .btn { flex: 1 1 0; min-width: 96px; }
.status-select { font-weight: 700; }
#status-card .field > label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
details.sec { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; }
details.sec > summary {
  list-style: none; cursor: pointer; min-height: 56px; padding: 10px 16px;
  display: flex; flex-direction: column; justify-content: center;
}
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary .sum-title { font-size: 18px; font-weight: 750; display: flex; justify-content: space-between; gap: 8px; }
details.sec > summary .sum-title::after { content: "+"; font-size: 22px; line-height: 1; color: var(--accent); font-weight: 600; }
details.sec[open] > summary .sum-title::after { content: "\2212"; }
details.sec > summary .sum-sub { font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
details.sec > .sec-body { padding: 2px 16px 16px; }
.note-add textarea { min-height: 88px; }
.note-add-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; margin-top: 10px; }
.note-add-row label { font-size: 14px; font-weight: 680; display: block; margin-bottom: 4px; }
.notes { list-style: none; margin: 14px 0 0; padding: 0; }
.notes > li { border-top: 1px solid var(--border); padding: 10px 0 4px; }
.note-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14.5px; font-weight: 720; color: var(--muted); }
.tag { font-size: 12.5px; font-weight: 700; border: 1px solid var(--border-strong); border-radius: 5px; padding: 0 6px; }
.note-text { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.note-actions { display: flex; gap: 12px; }
.docs { list-style: none; margin: 0; padding: 0; }
.docs li { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--border); }
.docs li:last-child { border-bottom: 0; }
.docs .check { flex: 1; overflow-wrap: anywhere; }
.docs .done-label { text-decoration: line-through; color: var(--muted); }
.doc-add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; margin-top: 12px; }
.meta-list { font-size: 15px; color: var(--muted); margin: 0 0 12px; }

/* Data view */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 15.5px; margin: 0; }
.kv dt { color: var(--muted); font-weight: 650; }
.kv dd { margin: 0; }

/* Toast + modal */
.toast {
  position: fixed; left: 16px; right: 16px; z-index: 60;
  bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px);
  max-width: 520px; margin: 0 auto; padding: 13px 16px; border-radius: 10px;
  background: #0b1726; color: #fff; font-weight: 650; box-shadow: 0 6px 24px rgba(0,0,0,.25);
  opacity: 0; transform: translateY(10px); transition: opacity .18s, transform .18s; pointer-events: none;
}
@media (prefers-color-scheme: dark) { .toast { background: #eef2f7; color: #0b1726; } }
.toast.show { opacity: 1; transform: none; }
.toast.error { background: var(--danger); color: #fff; }
@media (prefers-color-scheme: dark) { .toast.error { color: #1a0402; } }
.modal-backdrop {
  position: fixed; inset: 0; z-index: 70; background: rgba(5, 12, 24, .62);
  display: flex; align-items: flex-end; justify-content: center; padding: 16px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom));
}
@media (min-width: 560px) { .modal-backdrop { align-items: center; } }
.modal {
  background: var(--surface); color: var(--text); border-radius: 14px; width: 100%; max-width: 480px;
  padding: 18px; border: 1.5px solid var(--border); max-height: 85vh; overflow: auto;
}
.modal h2 { font-size: 20px; margin-bottom: 8px; }
.modal .modal-body { margin: 0 0 16px; }
.modal .modal-body p { margin: 0 0 10px; }
.modal-actions { display: grid; gap: 10px; }
body.modal-open { overflow: hidden; }
body.typing .tabbar { display: none; }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/dashboard">PD Tracker</a>
  <a class="data-link" href="#/data" data-tab="data">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
    Backup
  </a>
</header>

<main id="app" tabindex="-1"></main>

<nav class="tabbar" aria-label="Main">
  <a href="#/dashboard" data-tab="dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
    Dashboard
  </a>
  <a href="#/list" data-tab="list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1.3"/><circle cx="4" cy="12" r="1.3"/><circle cx="4" cy="18" r="1.3"/></svg>
    List
  </a>
  <a href="#/add" data-tab="add">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
    Add
  </a>
</nav>

<datalist id="county-list">
  <option value="Montgomery"><option value="Bucks"><option value="Philadelphia"><option value="Delaware">
  <option value="Chester"><option value="Lehigh"><option value="Northampton"><option value="Berks">
</datalist>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal-root"></div>

<script>
(function () {
  'use strict';

  /* ---------- Constants ---------- */
  var STORAGE_KEY = 'pdtracker.data';
  var UI_KEY = 'pdtracker.ui';
  var SCHEMA_VERSION = 1;
  var PIPELINE = ['Researching', 'Applied', 'Written Test', 'PT Test', 'Oral Board', 'Background', 'Polygraph/Psych', 'Medical', 'Conditional Offer', 'Hired'];
  var TERMINAL = ['Rejected', 'Withdrawn', 'On Hold'];
  var STATUSES = PIPELINE.concat(TERMINAL);
  var CLOSED = ['Rejected', 'Withdrawn'];
  // Not "active": excluded from overdue/upcoming/stale.
  var INACTIVE = ['Hired', 'Rejected', 'Withdrawn', 'On Hold'];
  var TYPES = ['Cadet Sponsorship', 'Entry-Level Hire', 'Civil Service List', 'Other'];
  var PRIORITIES = ['High', 'Med', 'Low'];
  var TUITION = ['Unknown', 'Yes', 'No'];
  var DEFAULT_DOCS = ['Resume', 'Cover letter', 'Transcripts', "Driver's license", 'Birth certificate', 'References', 'PHQ/background packet'];
  var DAY = 86400000;

  /* ---------- List ---------- */
  function counties() {
    var seen = {};

  }
  function blankLast(a, b) { return a && b ? a.localeCompare(b) : a ? -1 : b ? 1 : 0; }
  function byName(a, b) { return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }); }
  var SORTS = {
    next: { label: 'Next step date', fn: function (a, b) { return blankLast(a.nextStepDate, b.nextStepDate) || prioRank(a.priority) - prioRank(b.priority) || byName(a, b); } },
    deadline: { label: 'Deadline', fn: function (a, b) { return blankLast(a.deadline, b.deadline) || byName(a, b); } },
    priority: { label: 'Priority', fn: function (a, b) { return prioRank(a.priority) - prioRank(b.priority) || blankLast(a.nextStepDate, b.nextStepDate) || byName(a, b); } },
    name: { label: 'Name (A-Z)', fn: byName },
    updated: { label: 'Last updated', fn: function (a, b) { return lastActivity(b) - lastActivity(a); } }
  };
  function filteredDepts() {
    var q = ui.q.trim().toLowerCase();

      if (ui.status && d.status !== ui.status) return false;
      if (ui.type && d.appType !== ui.type) return false;
      if (ui.priority && d.priority !== ui.priority) return false;
      if (ui.county && d.county.trim().toLowerCase() !== ui.county.toLowerCase()) return false;
      if (q) {
        var hay = [d.name, d.municipality, d.county, d.appType, d.status, d.nextStepDesc, d.contact.name, d.contact.title,
          d.contact.email, d.contact.phone, d.salary, d.payNotes].concat(d.notes.map(function (n) { return n.text; })).join(' \n ').toLowerCase();
        if (hay.indexOf(q) === -1) return false;

  /* ---------- Fields + validation ---------- */
  function fieldHTML(key, val, inline) {
    var f = F[key];
    var id = (inline ? 'i-' : 'f-') + key.replace('.', '-');
    var attrs = 'id="' + id + '" name="' + key + '" data-field="' + key + '"' + (inline ? ' data-inline' : '') +
      (f.required ? ' required aria-required="true"' : '') +
      (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : '') +
      (f.list ? ' list="' + f.list + '"' : '') +
      (f.autocap ? ' autocapitalize="none" autocorrect="off" spellcheck="false"' : '') +
      ' autocomplete="off" aria-describedby="' + id + '-err"';
    var control;
    if (f.type === 'select') {
      control = '<select ' + attrs + (key === 'status' ? ' class="status-select"' : '') + '>' +
        f.options.map(function (o) { return '<option value="' + esc(o) + '"' + (o === val ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>';
    } else if (f.type === 'textarea') {
      control = '<textarea ' + attrs + ' rows="3">' + esc(val) + '</textarea>';
    } else {
      control = '<input type="' + f.type + '" ' + attrs + ' value="' + esc(val) + '"' +
        (f.type === 'number' ? ' min="1" step="1" inputmode="numeric"' : '') + '>';
    }
    return '<div class="field' + (f.wide ? ' span2' : '') + '"><label for="' + id + '">' + esc(f.label) +
      (f.required ? ' <span class="req">(required)</span>' : '') + '</label>' + control +
      '<div class="field-error" id="' + id + '-err" hidden></div></div>';
  }
  function cleanField(key, raw, el) {
    var f = F[key];
    var v = typeof raw === 'string' ? raw.trim() : raw;
    if (el && el.validity && el.validity.badInput) return { error: f.type === 'date' ? 'Enter a valid date.' : 'Enter a number.' };
    if (key === 'name' && !v) return { error: 'Department name is required.' };
    if (key === 'contact.email' && v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return { error: 'Enter a valid email address, or leave it blank.' };
    if (key === 'url' && v) {
      if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
      try { new URL(v); } catch (e) { return { error: 'Enter a valid web address.' }; }
    }
    if (key === 'listRank') {
      if (v === '' || v == null) v = '';
      else {
        var n = Number(v);
        if (!Number.isInteger(n) || n < 1) return { error: 'Rank must be a whole number, 1 or higher.' };
        v = n;
      }
    }
    if (f.type === 'select' && f.options.indexOf(v) === -1) return { error: 'Choose an option.' };
    if (f.type === 'date' && v && !isDateStr(v)) return { error: 'Enter a valid date.' };

  }

    var h = '<h1 class="page-title">' + (d ? 'Edit department' : 'Add department') + '</h1>' +
      '<form id="dept-form" novalidate data-id="' + (d ? esc(d.id) : '') + '">';
    FORM_GROUPS.forEach(function (g) {
      h += '<fieldset class="card"><legend>' + esc(g.title) + '</legend><div class="fields">' +
        g.fields.map(function (k) { return fieldHTML(k, str(getPath(src, k)), false); }).join('') + '</div></fieldset>';
    });
    if (!d) {
      h += '<fieldset class="card"><legend>First note</legend><div class="field"><label for="f-first-note">Optional. How you heard about it, who you talked to, etc.</label>' +
        '<textarea id="f-first-note" rows="3"></textarea></div></fieldset>';
    }

      '<button type="button" class="btn" data-action="cancel-form">Cancel</button></div></form>';

    if (!d) document.getElementById('f-name').focus({ preventScroll: true });
  }
  function submitForm(form) {
    if (state.saving) return; // ignore a double tap on Save
    var id = form.dataset.id;
    var existing = id ? getDept(id) : null;
    var values = {}, firstBad = null;
    form.querySelectorAll('[data-field]').forEach(function (el) {
      var r = cleanField(el.dataset.field, el.value, el);
      setFieldError(el, r.error);
      if (r.error) { if (!firstBad) firstBad = el; } else values[el.dataset.field] = r.value;
    });
    if (firstBad) {
      firstBad.focus();
      toast('Fix the highlighted field' + (form.querySelectorAll('[aria-invalid="true"]').length > 1 ? 's' : '') + '.', true);
      return;
    }
    var dup = data.departments.find(function (x) { return x.id !== id && x.name.trim().toLowerCase() === values.name.toLowerCase(); });
    state.saving = true;
    var p = dup ? confirmModal('Possible duplicate', '<p>You already have a department named <strong>' + esc(dup.name) + '</strong>. Save this one anyway?</p>', 'Save anyway') : Promise.resolve(true);
    p.then(function (ok) {
      if (!ok || state.view !== (existing ? 'edit' : 'add')) { state.saving = false; return; }
      var d = existing || blankDept();
      var newStatus = values.status;
      Object.keys(values).forEach(function (k) { if (k !== 'status') setPath(d, k, values[k]); });
      if (existing) {
        changeStatus(d, newStatus);
        touch(d);
      } else {
        d.status = newStatus;
        var first = document.getElementById('f-first-note').value.trim();
        if (first) d.notes.push(makeNote(todayStr(), first, false));
        data.departments.push(d);
      }
      if (save()) toast(existing ? 'Changes saved' : 'Department added');
      state.formDirty = false;
      go('#/dept/' + encodeURIComponent(d.id), true);
    });
  }
  function confirmDiscard() {
    if (!state.formDirty || (state.view !== 'add' && state.view !== 'edit')) return Promise.resolve(true);

  }

  /* ---------- Detail ---------- */

  // leaving=true when called because the page is changing: save, but don't redraw the detail view.
  function onInlineChange(el, leaving) {
    if (state.pendingInline === el) state.pendingInline = null;
    var d = getDept(state.id);
    if (!d) return;
    var key = el.dataset.field;
    if (key === 'status') {
      var r0 = cleanField(key, el.value, el);
      if (r0.error) return;
      var res = changeStatus(d, r0.value);
      if (!res.changed) return;
      save();
      if (leaving) return;
      var y = window.scrollY;
      renderDetail();
      window.scrollTo(0, y);
      toast(res.autoApplied ? 'Status logged. Date applied set to today.' : 'Status changed and logged');

    var r = cleanField(key, el.value, el);
    if (r.error) {

    setFieldError(el, null);
    if (str(getPath(d, key)) === str(r.value)) { el.value = str(r.value); return; }

  function renderNotes(d, focusSel) {

  /* Documents */
  function docsHTML(d) {
    var done = d.documents.filter(function (x) { return x.done; }).length;
    return '<h2>Documents <span class="count-pill" id="docs-count">' + done + ' of ' + d.documents.length + ' ready</span></h2>' +
      (d.documents.length ? '<ul class="docs">' + d.documents.map(function (x) {
        return '<li><label class="check"><input type="checkbox" data-doc="' + esc(x.id) + '"' + (x.done ? ' checked' : '') + '>' +
          '<span class="' + (x.done ? 'done-label' : '') + '">' + esc(x.label) + '</span></label>' +
          (x.custom ? '<button type="button" class="link-btn danger" data-action="doc-remove" data-id="' + esc(x.id) + '" aria-label="Remove ' + esc(x.label) + '">Remove</button>' : '') +
          '</li>';
      }).join('') + '</ul>' : '<p class="empty">No documents in the checklist.</p>') +
      '<form id="doc-add" class="doc-add" autocomplete="off"><label for="doc-new" class="sr-only">Add another document</label>' +
      '<input type="text" id="doc-new" placeholder="Add other document..." enterkeyhint="done">' +

  function renderDocs(d, refocus) {

  /* ---------- Data / backup ---------- */
  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }
  function backupPayload() {
    return JSON.stringify({
      app: 'pd-tracker', schemaVersion: SCHEMA_VERSION, exportedAt: nowISO(),
      meta: data.meta, departments: data.departments
    }, null, 2);
  }
  function backupFilename() { return 'pd-tracker-backup-' + todayStr() + '.json'; }
  function markBackedUp() {
    data.meta.lastBackup = nowISO();
    save();
    if (state.view === 'dashboard' || state.view === 'data') render();
  }
  function isStandalone() {
    return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  }
  // Home-screen apps (especially on iPhone) can't reliably download files, so there we open the
  // share sheet ("Save to Files", email, Drive). Resolves to 'downloaded', 'shared' or 'cancelled'.
  function saveFile(text, filename, type) {
    function download() { downloadBlob(new Blob([text], { type: type }), filename); return 'downloaded'; }
    if (isStandalone() && navigator.share && navigator.canShare) {
      var file = new File([text], filename, { type: type });
      var ok = false;
      try { ok = navigator.canShare({ files: [file] }); } catch (e) { /* unsupported */ }
      if (ok) {
        return navigator.share({ files: [file], title: filename }).then(function () { return 'shared'; }, function (e) {
          return e && e.name === 'AbortError' ? 'cancelled' : download();
        });
      }
    }
    return Promise.resolve(download());
  }
  function exportJSON() {
    var name = backupFilename();
    saveFile(backupPayload(), name, 'application/json').then(function (r) {
      if (r === 'cancelled') return;
      markBackedUp();
      toast(r === 'shared' ? 'Backup saved' : 'Backup downloaded: ' + name);
    });
  }
  function canShareFiles() {
    try {
      return !!(navigator.canShare && navigator.canShare({ files: [new File(['{}'], 'x.json', { type: 'application/json' })] }));
    } catch (e) { return false; }
  }
  function shareJSON() {
    var file = new File([backupPayload()], backupFilename(), { type: 'application/json' });
    navigator.share({ files: [file], title: 'PD Tracker backup' }).then(function () {
      markBackedUp();
      toast('Backup shared');
    }).catch(function (e) {
      if (e && e.name === 'AbortError') return;
      toast('Sharing failed. Use Download instead.', true);
    });
  }
  function csvCell(v) {
    var s = str(v);
    if (/^[=+\-@]/.test(s)) s = ' ' + s; // keep Excel from treating text as a formula
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function exportCSV() {
    var cols = [
      ['Department', 'name'], ['Municipality', 'municipality'], ['County', 'county'], ['Website', 'url'],
      ['Application Type', 'appType'], ['Status', 'status'], ['Priority', 'priority'],
      ['Date Applied', 'dateApplied'], ['Application Deadline', 'deadline'], ['Next Step Date', 'nextStepDate'], ['Next Step', 'nextStepDesc'],
      ['Contact Name', 'contact.name'], ['Contact Title', 'contact.title'], ['Contact Phone', 'contact.phone'], ['Contact Email', 'contact.email'],
      ['Starting Salary', 'salary'], ['Sponsorship Covers Tuition', 'tuitionCovered'], ['Pay Notes', 'payNotes'], ['Civil Service Rank', 'listRank']
    ];
    var header = cols.map(function (c) { return c[0]; }).concat(['Documents Ready', 'Documents Outstanding', 'Notes (newest first)', 'Created', 'Updated']);
    var rows = data.departments.slice().sort(byName).map(function (d) {
      var r = cols.map(function (c) { return getPath(d, c[1]); });
      r.push(d.documents.filter(function (x) { return x.done; }).map(function (x) { return x.label; }).join('; '));
      r.push(d.documents.filter(function (x) { return !x.done; }).map(function (x) { return x.label; }).join('; '));
      r.push(sortedNotes(d).map(function (n) { return n.date + ': ' + n.text.replace(/\s*[\r\n]+\s*/g, ' '); }).join(' | '));
      r.push(d.createdAt, d.updatedAt);
      return r;
    });
    var csv = '﻿' + [header].concat(rows).map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
    saveFile(csv, 'pd-tracker-' + todayStr() + '.csv', 'text/csv').then(function (r) {
      if (r !== 'cancelled') toast(r === 'shared' ? 'CSV saved' : 'CSV downloaded');
    });
  }
  function mergeInto(current, incoming) {
    var stats = { added: 0, updated: 0, unchanged: 0 };
    var byId = Object.create(null);
    current.forEach(function (d, i) { byId[d.id] = i; });
    incoming.forEach(function (inc) {
      if (byId[inc.id] === undefined) { current.push(inc); byId[inc.id] = current.length - 1; stats.added++; return; }
      var cur = current[byId[inc.id]];
      var incNewer = new Date(inc.updatedAt) > new Date(cur.updatedAt);
      var base = incNewer ? inc : cur;
      // Keep notes from both copies; for the same note, the more recently edited version wins.
      var notes = Object.create(null);
      cur.notes.concat(inc.notes).forEach(function (n) {
        if (!notes[n.id] || new Date(n.updatedAt) > new Date(notes[n.id].updatedAt)) notes[n.id] = n;
      });
      var merged = Object.assign({}, base, { notes: Object.keys(notes).map(function (k) { return notes[k]; }) });
      if (JSON.stringify(merged) === JSON.stringify(cur)) { stats.unchanged++; return; }
      current[byId[inc.id]] = merged;
      stats.updated++;
    });
    return stats;
  }
  function importFile(file) {
    if (!file) return;
    file.text().then(function (text) {
      var parsed, incoming;
      try { parsed = JSON.parse(text); } catch (e) { throw new Error('That file is not valid JSON.'); }
      if (!parsed || (!Array.isArray(parsed) && !Array.isArray(parsed.departments))) throw new Error('That file does not look like a PD Tracker backup.');
      incoming = migrate(parsed);
      var n = incoming.departments.length, m = data.departments.length;
      var when = parsed.exportedAt ? ' exported ' + esc(fmtTimestamp(parsed.exportedAt)) : '';
      return modal({
        title: 'Import backup',
        body: '<p>The file has <strong>' + n + ' department' + (n === 1 ? '' : 's') + '</strong>' + when + '. You currently have <strong>' + m + '</strong>.</p>' +
          '<p><strong>Merge:</strong> adds new departments and updates ones in both (most recent edit wins; notes from both are kept).</p>' +
          '<p><strong>Replace:</strong> deletes everything in the app now and uses the file instead.</p>',
        buttons: [{ label: 'Merge', value: 'merge', kind: 'primary' }, { label: 'Replace', value: 'replace', kind: 'danger' }, { label: 'Cancel', value: null }]
      }).then(function (choice) {
        if (!choice) return;
        var body = choice === 'replace'
          ? '<p>Replace all <strong>' + m + '</strong> current department' + (m === 1 ? '' : 's') + ' with the <strong>' + n + '</strong> from the file?</p><p class="small muted">A safety copy of your current data is kept on this device.</p>'
          : '<p>Merge <strong>' + n + '</strong> department' + (n === 1 ? '' : 's') + ' from the file into your current <strong>' + m + '</strong>?</p>';
        return confirmModal(choice === 'replace' ? 'Replace all data?' : 'Merge data?', body, choice === 'replace' ? 'Yes, replace' : 'Yes, merge', choice === 'replace')
          .then(function (ok) {
            if (!ok) return;
            try { localStorage.setItem(STORAGE_KEY + '.before-import', JSON.stringify(data)); } catch (e) { /* ignore */ }
            var msg;
            if (choice === 'replace') {
              data.departments = incoming.departments;
              msg = 'Replaced: ' + n + ' department' + (n === 1 ? '' : 's') + ' loaded';
            } else {
              var st = mergeInto(data.departments, incoming.departments);
              msg = 'Merged: ' + st.added + ' added, ' + st.updated + ' updated, ' + st.unchanged + ' unchanged';
            }
            var fileBackup = parsed.exportedAt || (parsed.meta && parsed.meta.lastBackup);
            if (fileBackup && (!data.meta.lastBackup || new Date(fileBackup) > new Date(data.meta.lastBackup))) data.meta.lastBackup = fileBackup;
            data.meta.seeded = true;
            if (save()) toast(msg);
            go('#/dashboard');
          });
      });
    }).catch(function (e) {
      modal({ title: 'Import failed', body: '<p>' + esc(e.message) + '</p><p class="small muted">Nothing was changed.</p>', buttons: [{ label: 'OK', value: true, kind: 'primary' }] });
    });
  }
  function renderData() {
    var lb = data.meta.lastBackup;
    var notes = data.departments.reduce(function (a, d) { return a + d.notes.length; }, 0);
    var kb = 0;
    try { kb = Math.round((localStorage.getItem(STORAGE_KEY) || '').length / 1024 * 10) / 10; } catch (e) { /* ignore */ }
    app.innerHTML = '<h1 class="page-title">Backup &amp; data</h1>' +
      backupCardHTML().replace('<a class="link-btn" href="#/data">Backup options</a>', '') +
      '<section class="card stack"><h2>Back up</h2>' +
        '<p class="muted small" style="margin:0">Your data is stored only in this browser on this device. A backup is a .json file you keep in Files, iCloud Drive, Google Drive, or email to yourself.</p>' +
        '<button type="button" class="btn btn-primary btn-block" data-action="export-json">' + (isStandalone() ? 'Save backup file (.json)' : 'Download backup (.json)') + '</button>' +
        (canShareFiles() && !isStandalone() ? '<button type="button" class="btn btn-block" data-action="share-json">Share backup file (save to Files, email...)</button>' : '') +
      '</section>' +
      '<section class="card stack"><h2>Restore</h2>' +
        '<p class="muted small" style="margin:0">Pick a backup file. You will choose to merge it with what is here or replace everything, then confirm.</p>' +
        '<label class="btn btn-block" for="import-file">Choose backup file to import</label>' +
        '<input type="file" id="import-file" class="sr-only">' +
      '</section>' +
      '<section class="card stack"><h2>Spreadsheet</h2>' +
        '<p class="muted small" style="margin:0">One row per department, notes combined into one column. Opens in Excel or Google Sheets. This is for viewing, not restoring.</p>' +
        '<button type="button" class="btn btn-block" data-action="export-csv">Download CSV</button>' +
      '</section>' +
      '<section class="card"><h2>On this device</h2><dl class="kv">' +
        '<dt>Departments</dt><dd>' + data.departments.length + '</dd>' +
        '<dt>Notes</dt><dd>' + notes + '</dd>' +
        '<dt>Stored size</dt><dd>' + kb + ' KB</dd>' +
        '<dt>Last backup</dt><dd>' + (lb ? esc(fmtTimestamp(lb)) : 'Never') + '</dd>' +

  }
  function renderLoadError() {

      (rawStored ? '<div class="stack"><button type="button" class="btn btn-primary btn-block" data-action="download-raw">Download raw saved data</button>' +

  }

  /* ---------- Events ---------- */
  var actions = {
    'export-json': exportJSON,
    'share-json': shareJSON,
    'export-csv': exportCSV,
    'download-raw': function () { saveFile(rawStored, 'pd-tracker-raw-' + todayStr() + '.json', 'application/json'); },
    'start-over': function () {
      confirmModal('Start over?', '<p>The unreadable data stays saved on this device under a separate name, and the app starts fresh. Download it first if you want to keep it somewhere else.</p>', 'Start over', true)
        .then(function (ok) {
          if (!ok) return;
          try { localStorage.setItem(STORAGE_KEY + '.unreadable-' + Date.now(), rawStored); } catch (e) {

    'filter-status': function (el) {

    },
    'clear-filters': function () {
      Object.assign(ui, { q: '', status: '', type: '', county: '', priority: '' });

    },
    'back': function () {
      if (state.navCount > 1 && history.length > 1) history.back(); else go('#/list');
    },
    'cancel-form': function () {

      });
    },
    'delete-dept': function () {
      var d = getDept(state.id);
      if (!d) return;
      confirmModal('Delete department?', '<p>Delete <strong>' + esc(d.name) + '</strong> along with its ' + d.notes.length + ' note' + (d.notes.length === 1 ? '' : 's') +
        ' and document checklist?</p><p>This cannot be undone. Download a backup first if you are not sure.</p>', 'Delete', true)
        .then(function (ok) {

  document.addEventListener('click', function (e) {

  window.addEventListener('storage', function (e) {

    try { data = migrate(JSON.parse(e.newValue)); loadError = null; } catch (err) { return; }
    if (!isTextEntry(document.activeElement) && !closeOpenModal) render();
  });

  /* ---------- Boot ---------- */
  load();
  if (loadError && data) toast(loadError, true);
  window.addEventListener('hashchange', route);
  route();

  // Ask the browser not to evict our storage under pressure.
  if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
