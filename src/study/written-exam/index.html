,{"id":"gu-037","section":"grammar","subtype":"subject-verb-agreement","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":3,"stimulus":null,"stem":"Either the manager or the cashiers _____ the alarm code.","choices":["know","knows"],"answer":0,"fixed":false,"explanation":"When two subjects are joined by \"either ... or,\" the verb agrees with the subject closer to it. \"Cashiers\" is plural, so the plural verb \"know\" is correct."},{"id":"gu-038","section":"grammar","subtype":"subject-verb-agreement","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":1,"stimulus":null,"stem":"There _____ two bicycles leaning against the fence when Officer Marsh arrived.","choices":["was","is","were"],"answer":2,"fixed":false,"explanation":"In a sentence that begins with \"there,\" the subject follows the verb. The subject is \"two bicycles,\" which is plural, and the event is in the past, so \"were\" is correct."},{"id":"gu-039","section":"grammar","subtype":"subject-verb-agreement","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"Neither the driver nor the passenger _____ wearing a seat belt when the car was stopped.","choices":["was","were"],"answer":0,"fixed":false,"explanation":"When two singular subjects are joined by \"neither ... nor,\" the verb stays singular. Both \"driver\" and \"passenger\" are singular, so \"was\" is correct."},{"id":"gu-040","section":"grammar","subtype":"subject-verb-agreement","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":3,"stimulus":null,"stem":"Sergeant Ito, along with two patrol officers, _____ assigned to the parade route.","choices":["were","was"],"answer":1,"fixed":false,"explanation":"A phrase that begins with \"along with\" does not become part of the subject. The subject is still \"Sergeant Ito,\" one person, so the singular verb \"was\" is correct."},{"id":"gu-041","section":"grammar","subtype":"subject-verb-agreement","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"Everyone in the three apartments _____ been told to stay inside.","choices":["has","have","is","are"],"answer":0,"fixed":false,"explanation":"\"Everyone\" is always singular, so it takes \"has.\" The plural word \"apartments\" is part of a describing phrase and does not change the subject, and only \"has\" or \"have\" can come before \"been.\""},{"id":"gu-042","section":"grammar","subtype":"verb-tense-form","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":1,"stimulus":null,"stem":"The witness stated that she had _____ the same van parked on the street the day before.","choices":["seen","saw"],"answer":0,"fixed":false,"explanation":"After a helping verb such as \"had,\" use the past participle, which is \"seen.\" \"Saw\" is the simple past and is used alone, as in \"she saw the van.\""},{"id":"gu-043","section":"grammar","subtype":"verb-tense-form","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":1,"stimulus":null,"stem":"By the time the officers arrived, the caller had already _____ home.","choices":["went","gone"],"answer":1,"fixed":false,"explanation":"After the helping verb \"had,\" use the past participle \"gone.\" \"Went\" is the simple past and is never used with \"had.\""},{"id":"gu-044","section":"grammar","subtype":"verb-tense-form","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":3,"stimulus":null,"stem":"Officer Pruitt _____ the recovered handgun on the hood of the patrol car and photographed it.","choices":["lay","laid","lain"],"answer":1,"fixed":false,"explanation":"\"Lay\" means \"to put something down\" and takes an object, here the handgun; its past tense is \"laid,\" which matches the past-tense verb \"photographed.\" \"Lain\" belongs to the verb \"lie,\" meaning \"to rest,\" and needs a helping verb."},{"id":"gu-045","section":"grammar","subtype":"verb-tense-form","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":3,"stimulus":null,"stem":"The injured cyclist _____ on the shoulder of the road until the paramedics arrived.","choices":["laid","lain","lied","lay"],"answer":3,"fixed":false,"explanation":"The verb \"lie,\" meaning \"to rest or recline,\" has no object, and its past tense is \"lay.\" \"Laid\" means \"put something down,\" \"lain\" needs a helping verb such as \"had,\" and \"lied\" means \"told an untruth.\""},{"id":"gu-046","section":"grammar","subtype":"verb-tense-form","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":1,"stimulus":null,"stem":"The report noted that the contractor _____ the repairs without a permit.","choices":["done","did"],"answer":1,"fixed":false,"explanation":"\"Did\" is the simple past tense and can stand alone as the verb. \"Done\" is a past participle and must have a helping verb, as in \"had done.\""},{"id":"gu-047","section":"grammar","subtype":"verb-tense-form","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"The officer approached the vehicle, asked for the driver's license, and _____ the registration.","choices":["checked","checks","checking"],"answer":0,"fixed":false,"explanation":"Verbs in a series that describe the same past events must stay in the same tense. \"Approached\" and \"asked\" are past tense, so the third verb must be \"checked.\""},{"id":"gu-048","section":"grammar","subtype":"verb-tense-form","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"Yesterday at 3:15 p.m., Officer Bae _____ a report of a stolen bicycle on Corliss Lane.","choices":["takes","taken","took","will take"],"answer":2,"fixed":false,"explanation":"\"Yesterday\" places the action in the past, so the simple past tense \"took\" is needed. \"Taken\" is a past participle and cannot be used without a helping verb such as \"has\" or \"had.\""},{"id":"gu-049","section":"grammar","subtype":"verb-tense-form","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"The driver said he had _____ two beers at a restaurant earlier that evening.","choices":["drank","drinked","drunk"],"answer":2,"fixed":false,"explanation":"After the helping verb \"had,\" use the past participle, which is \"drunk.\" \"Drank\" is the simple past and is used without a helping verb, and \"drinked\" is not a word."},{"id":"gu-050","section":"grammar","subtype":"plural-spelling","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":1,"stimulus":null,"stem":"The suspect is wanted for three _____ in Brightwater Borough.","choices":["burglarys","burglaries","burglary's"],"answer":1,"fixed":false,"explanation":"When a noun ends in a consonant followed by y, change the y to i and add es to make it plural: burglaries. An apostrophe shows ownership, not a plural."},{"id":"gu-051","section":"grammar","subtype":"plural-spelling","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":1,"stimulus":null,"stem":"Both _____ were recovered from a pawn shop on Tolland Street.","choices":["watches","watchs","watch's"],"answer":0,"fixed":false,"explanation":"Nouns that end in ch, sh, s, x or z add es to form the plural: watches. An apostrophe and s would show ownership, not more than one."},{"id":"gu-052","section":"grammar","subtype":"plural-spelling","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"Two kitchen _____ were found on the counter next to the open drawer.","choices":["knifes","knive's","knives"],"answer":2,"fixed":false,"explanation":"\"Knife\" is one of the nouns that change f to v and add es in the plural: knives. A plural is never formed with an apostrophe."},{"id":"gu-053","section":"grammar","subtype":"plural-spelling","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":2,"stimulus":null,"stem":"The suspect had used at least two _____ when renting cars in Marlow Township.","choices":["aliasses","aliases","alias's"],"answer":1,"fixed":false,"explanation":"A noun that ends in s adds es to form the plural, and the final s is not doubled: aliases. An apostrophe and s would show ownership instead."},{"id":"gu-054","section":"grammar","subtype":"plural-spelling","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":3,"stimulus":null,"stem":"The two _____ agreed to share the records from the Larchmont case.","choices":["attorneys","attornies","attorney's"],"answer":0,"fixed":false,"explanation":"When a noun ends in a vowel followed by y, as in \"attorney,\" keep the y and just add s. The y changes to ies only when a consonant comes before it, as in \"burglary.\""},{"id":"gu-055","section":"grammar","subtype":"plural-spelling","families":["upper-dublin","montco","bucks","radnor"],"products":["post","ngle"],"difficulty":3,"stimulus":null,"stem":"Two _____ stopped to help the driver out of the overturned car.","choices":["passerbys","passerbies","passersby"],"answer":2,"fixed":false,"explanation":"In a compound noun the main noun takes the plural ending. The main noun in \"passerby\" is \"passer,\" so the plural is \"passersby.\""},{"id":"gs-001","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"Officer Delgado issued a citation after the driver could not produce a valid liscense or proof of insurance.\n\nWhich word in the sentence above is misspelled?","choices":["citation","liscense","produce","insurance"],"answer":1,"fixed":false,"explanation":"The misspelled word is \"liscense\"; the correct spelling is \"license\". There is no \"s\" before the \"c\"."},{"id":"gs-002","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"The witness stated that the two men had a loud arguement outside the pharmacy on Wednesday evening.\n\nWhich word in the sentence above is misspelled?","choices":["arguement","witness","pharmacy","Wednesday","evening"],"answer":0,"fixed":false,"explanation":"The misspelled word is \"arguement\"; the correct spelling is \"argument\". The \"e\" in \"argue\" is dropped before \"-ment\"."},{"id":"gs-003","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"Sergeant Okafor recieved the anonymous complaint at approximately 9:15 on Thursday morning.\n\nWhich word in the sentence above is misspelled?","choices":["Sergeant","anonymous","recieved","approximately","Thursday"],"answer":2,"fixed":false,"explanation":"The misspelled word is \"recieved\"; the correct spelling is \"received\". After \"c\" the order is \"ei\"."},{"id":"gs-004","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"The stolen vehical was recovered in the parking garage behind the Brightwater Borough library.\n\nWhich word in the sentence above is misspelled?","choices":["recovered","garage","vehical","library"],"answer":2,"fixed":false,"explanation":"The misspelled word is \"vehical\"; the correct spelling is \"vehicle\". The word ends in \"-cle\", not \"-cal\"."},{"id":"gs-005","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"Detective Nguyen kept the two suspects in seperate interview rooms until their attorneys arrived.\n\nWhich word in the sentence above is misspelled?","choices":["Detective","interview","attorneys","seperate"],"answer":3,"fixed":false,"explanation":"The misspelled word is \"seperate\"; the correct spelling is \"separate\". The middle vowel is \"a\": sep-a-rate."},{"id":"gs-006","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"The collision occured at the intersection of Alder Avenue and Fenwick Road during heavy rain.\n\nWhich word in the sentence above is misspelled?","choices":["occured","collision","intersection","Avenue"],"answer":0,"fixed":false,"explanation":"The misspelled word is \"occured\"; the correct spelling is \"occurred\". The \"r\" is doubled before \"-ed\"."},{"id":"gs-007","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"A neighbor reported a suspiscious person looking into parked cars along Tamarack Lane in February.\n\nWhich word in the sentence above is misspelled?","choices":["neighbor","suspiscious","parked","February"],"answer":1,"fixed":false,"explanation":"The misspelled word is \"suspiscious\"; the correct spelling is \"suspicious\". There is no \"s\" before the \"c\"."},{"id":"gs-008","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"The judge signed the search warrent for the apartment after reviewing the officer's sworn affidavit.\n\nWhich word in the sentence above is misspelled?","choices":["judge","warrent","apartment","reviewing","affidavit"],"answer":1,"fixed":false,"explanation":"The misspelled word is \"warrent\"; the correct spelling is \"warrant\". The word ends in \"-ant\"."},{"id":"gs-009","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"The defendent was scheduled to appear before the magistrate on the eighth of November.\n\nWhich word in the sentence above is misspelled?","choices":["scheduled","magistrate","eighth","November","defendent"],"answer":4,"fixed":false,"explanation":"The misspelled word is \"defendent\"; the correct spelling is \"defendant\". The word ends in \"-ant\"."},{"id":"gs-010","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":null,"stem":"Officers conducted surveilance of the warehouse for twelve consecutive nights before making an arrest.\n\nWhich word in the sentence above is misspelled?","choices":["warehouse","twelve","consecutive","surveilance"],"answer":3,"fixed":false,"explanation":"The misspelled word is \"surveilance\"; the correct spelling is \"surveillance\". The word has a double \"l\"."},{"id":"gs-011","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"The driver appeared intoxacated and had difficulty keeping his balance during the roadside evaluation.\n\nWhich word in the sentence above is misspelled?","choices":["appeared","difficulty","balance","intoxacated","evaluation"],"answer":3,"fixed":false,"explanation":"The misspelled word is \"intoxacated\"; the correct spelling is \"intoxicated\". The vowel after the \"x\" is \"i\"."},{"id":"gs-012","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":null,"stem":"Ms. Castellano filed a harrassment complaint against a former colleague who repeatedly telephoned her residence.\n\nWhich word in the sentence above is misspelled?","choices":["complaint","harrassment","colleague","repeatedly","residence"],"answer":1,"fixed":false,"explanation":"The misspelled word is \"harrassment\"; the correct spelling is \"harassment\". The word has one \"r\" and a double \"s\"."},{"id":"gs-013","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"The burgler entered through an unlocked basement window and removed jewelry from the bedroom.\n\nWhich word in the sentence above is misspelled?","choices":["burgler","basement","jewelry","bedroom"],"answer":0,"fixed":false,"explanation":"The misspelled word is \"burgler\"; the correct spelling is \"burglar\". The word ends in \"-ar\"; \"jewelry\" is the correct American spelling."},{"id":"gs-014","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"It was neccessary to close the bridge temporarily while the damaged guardrail was repaired.\n\nWhich word in the sentence above is misspelled?","choices":["temporarily","damaged","neccessary","repaired"],"answer":2,"fixed":false,"explanation":"The misspelled word is \"neccessary\"; the correct spelling is \"necessary\". The word has one \"c\" and a double \"s\"."},{"id":"gs-015","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"The suspect was charged with posession of stolen property and resisting arrest.\n\nWhich word in the sentence above is misspelled?","choices":["posession","suspect","charged","property","resisting"],"answer":0,"fixed":false,"explanation":"The misspelled word is \"posession\"; the correct spelling is \"possession\". The word has two pairs of double \"s\"."},{"id":"gs-016","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"The officer marked the court date on the calender and notified the prosecutor immediately.\n\nWhich word in the sentence above is misspelled?","choices":["marked","notified","prosecutor","immediately","calender"],"answer":4,"fixed":false,"explanation":"The misspelled word is \"calender\"; the correct spelling is \"calendar\". A chart of dates ends in \"-ar\"."},{"id":"gs-017","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"According to the report, this was the third occurence of vandalism at the elementary school since August.\n\nWhich word in the sentence above is misspelled?","choices":["According","vandalism","elementary","occurence","August"],"answer":3,"fixed":false,"explanation":"The misspelled word is \"occurence\"; the correct spelling is \"occurrence\". The word has a double \"c\" and a double \"r\"."},{"id":"gs-018","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":null,"stem":"The perpatrator fled on foot through the cemetery and was last seen heading toward the railroad tracks.\n\nWhich word in the sentence above is misspelled?","choices":["cemetery","heading","railroad","perpatrator"],"answer":3,"fixed":false,"explanation":"The misspelled word is \"perpatrator\"; the correct spelling is \"perpetrator\". The second vowel is \"e\"; \"cemetery\" is spelled correctly with three e's."},{"id":"gs-019","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"It was apparant from the broken glass that someone had forced open the rear entrance.\n\nWhich word in the sentence above is misspelled?","choices":["broken","apparant","forced","entrance"],"answer":1,"fixed":false,"explanation":"The misspelled word is \"apparant\"; the correct spelling is \"apparent\". The word ends in \"-ent\"."},{"id":"gs-020","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"The victim said the license plate definately began with the letters KRT, but she was uncertain about the numbers.\n\nWhich word in the sentence above is misspelled?","choices":["victim","license","definately","uncertain","numbers"],"answer":2,"fixed":false,"explanation":"The misspelled word is \"definately\"; the correct spelling is \"definitely\". The word contains \"finite\": de-finite-ly."},{"id":"gs-021","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":null,"stem":"The hotel manager agreed to accomodate the displaced residents until the electricity was restored.\n\nWhich word in the sentence above is misspelled?","choices":["manager","accomodate","displaced","residents","electricity"],"answer":1,"fixed":false,"explanation":"The misspelled word is \"accomodate\"; the correct spelling is \"accommodate\". The word has a double \"c\" and a double \"m\"."},{"id":"gs-022","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":null,"stem":"Lieutenant Abara reminded the recruits that carrying a badge is a privelege that requires good judgment.\n\nWhich word in the sentence above is misspelled?","choices":["privelege","Lieutenant","recruits","judgment"],"answer":0,"fixed":false,"explanation":"The misspelled word is \"privelege\"; the correct spelling is \"privilege\". The second vowel is \"i\"; \"judgment\" is the standard American spelling."},{"id":"gs-023","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":2,"stimulus":null,"stem":"Sargent Whitfield assigned four officers to direct traffic near the stadium on Saturday afternoon.\n\nWhich word in the sentence above is misspelled?","choices":["assigned","traffic","stadium","Saturday","Sargent"],"answer":4,"fixed":false,"explanation":"The misspelled word is \"Sargent\"; the correct spelling is \"Sergeant\". The rank begins \"Serg-\" and ends \"-eant\"."},{"id":"gs-024","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":1,"stimulus":null,"stem":"A second witnes described the getaway car as a maroon sedan with a cracked windshield.\n\nWhich word in the sentence above is misspelled?","choices":["described","maroon","sedan","witnes","windshield"],"answer":3,"fixed":false,"explanation":"The misspelled word is \"witnes\"; the correct spelling is \"witness\". The word ends in a double \"s\"."},{"id":"gs-025","section":"grammar","subtype":"misspelled-word","families":["upper-dublin","montco","bucks","radnor"],"products":["post"],"difficulty":3,"stimulus":null,"stem":"The patient signed a voluntary committment form before the ambulance transported her to the hospital.\n\nWhich word in the sentence above is misspelled?","choices":["committment","patient","voluntary","ambulance","hospital"],"answer":0,"fixed":false,"explanation":"The misspelled word is \"committment\"; the correct spelling is \"commitment\". The word has a double \"m\" but only one \"t\" before \"-ment\"."},{"id":"gs-026","section":"grammar","subtype":"correct-spelling","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"Choose the word or phrase that is spelled correctly and completes the sentence.\n\nThe officer wrote that the suspect's statement was not ______ with the physical evidence.","choices":["consistant","consistent","concistent","consistint"],"answer":1,"fixed":false,"explanation":"The correct spelling is \"consistent\", which ends in \"-ent\". The \"-ant\" ending is the most common slip."},{"id":"gs-027","section":"grammar","subtype":"correct-spelling","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle"],"difficulty":1,"stimulus":null,"stem":"Choose the word or phrase that is spelled correctly and completes the sentence.\n\nThe caller said there were ______ of people gathered outside the arena.","choices":["alot","allot","a lot","a lott"],"answer":2,"fixed":false,"explanation":"\"A lot\" is always written as two words. \"Alot\" is not a word, and \"allot\" is a verb meaning to assign a share."},{"id":"gs-028","section":"grammar","subtype":"correct-spelling","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"Choose the word or phrase that is spelled correctly and completes the sentence.\n\nThe paramedic reported that the injured cyclist was ______ and did not need to go to the hospital.","choices":["all right","allright","alrite","all rite"],"answer":0,"fixed":false,"explanation":"The standard form in report writing is the two-word \"all right\". \"Rite\" means a ceremony, and \"allright\" is not a word."},{"id":"gs-029","section":"grammar","subtype":"correct-spelling","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"Choose the word or phrase that is spelled correctly and completes the sentence.\n\nThe suspect's ______ were unknown at the time the report was filed.","choices":["where abouts","wherabouts","whereabout's","whereabouts"],"answer":3,"fixed":false,"explanation":"\"Whereabouts\" is one word that keeps the full word \"where\" and takes no apostrophe."},{"id":"gs-030","section":"grammar","subtype":"correct-spelling","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle"],"difficulty":1,"stimulus":null,"stem":"Choose the word or phrase that is spelled correctly and completes the sentence.\n\nThe store remained open ______ the investigation.","choices":["through out","throughout","thruout","throughtout"],"answer":1,"fixed":false,"explanation":"\"Throughout\" is a single word made of \"through\" and \"out\" with no extra letters."},{"id":"gs-031","section":"grammar","subtype":"correct-spelling","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle"],"difficulty":3,"stimulus":null,"stem":"Choose the word or phrase that is spelled correctly and completes the sentence.\n\nThe detective interviewed the ______ at her home on Monday afternoon.","choices":["complainent","complaintant","complainant","complainint"],"answer":2,"fixed":false,"explanation":"The person who makes a complaint is a \"complainant\": \"complain\" plus \"-ant\", with no \"t\" in the middle."},{"id":"gs-032","section":"grammar","subtype":"correct-spelling","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"Choose the word or phrase that is spelled correctly and completes the sentence.\n\nThe lieutenant made a ______ to the chief about the new patrol schedule.","choices":["recommendation","recomendation","reccommendation","recommandation"],"answer":0,"fixed":false,"explanation":"\"Recommendation\" has one \"c\", a double \"m\", and an \"e\" before the \"n\"."},{"id":"gs-033","section":"grammar","subtype":"correct-spelling","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"Choose the word or phrase that is spelled correctly and completes the sentence.\n\nThe mayor ______ the officer's quick response in a letter to the department.","choices":["acknowleged","aknowledged","acknoledged","acknowledged"],"answer":3,"fixed":false,"explanation":"\"Acknowledged\" keeps every letter of \"ac-\" plus \"knowledge\" before the final \"d\"."},{"id":"gs-034","section":"grammar","subtype":"correct-spelling","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle"],"difficulty":1,"stimulus":null,"stem":"Choose the word or phrase that is spelled correctly and completes the sentence.\n\nThe store owner gave the officer a ______ of the man who took the cash.","choices":["discription","description","descripsion","desciption"],"answer":1,"fixed":false,"explanation":"\"Description\" begins with \"descri-\" as in \"describe\" and ends in \"-ption\"."},{"id":"gs-035","section":"grammar","subtype":"correct-spelling","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle"],"difficulty":1,"stimulus":null,"stem":"Choose the word or phrase that is spelled correctly and completes the sentence.\n\nThe two drivers gave ______ different accounts of the crash.","choices":["completly","compleatly","completely","completley"],"answer":2,"fixed":false,"explanation":"\"Completely\" is \"complete\" plus \"-ly\"; the \"e\" at the end of \"complete\" is kept."},{"id":"gs-036","section":"grammar","subtype":"error-free-sentence","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle"],"difficulty":1,"stimulus":null,"stem":"The four sentences below describe a stolen car. Which sentence has no errors in spelling, punctuation, or word usage?","choices":["The residents said there car was stolen from the driveway overnight.","The residents said they're car was stolen from the driveway overnight.","The residents said their car was stolen from the driveway overnight.","The resident's said their car was stolen from the driveway overnight."],"answer":2,"fixed":false,"explanation":"The car belongs to the residents, so the possessive \"their\" is needed, and \"residents\" is a simple plural with no apostrophe. \"There\" names a place and \"they're\" means \"they are\"."},{"id":"gs-037","section":"grammar","subtype":"error-free-sentence","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle"],"difficulty":1,"stimulus":null,"stem":"The four sentences below describe a patrol car. Which sentence has no errors in spelling, punctuation, or word usage?","choices":["The patrol car had a flat tire, and its radio was not working.","The patrol car had a flat tire, and it's radio was not working.","The patrol car had a flat tire, and its' radio was not working.","The patrol car had a flat tire and, its radio was not working."],"answer":0,"fixed":false,"explanation":"The possessive \"its\" has no apostrophe (\"it's\" means \"it is\", and \"its'\" is never correct). The comma belongs before \"and\", where it joins the two complete thoughts."},{"id":"gs-038","section":"grammar","subtype":"error-free-sentence","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle"],"difficulty":1,"stimulus":null,"stem":"The four sentences below describe an alarm call. Which sentence has no errors in spelling, punctuation, or word usage?","choices":["The two officers were to far away to hear the alarm.","The too officers were too far away to hear the alarm.","The two officers were too far away to here the alarm.","The two officers were too far away to hear the alarm."],"answer":3,"fixed":false,"explanation":"\"Two\" is the number, \"too\" means excessively, and \"hear\" means to perceive sound. Each of the other sentences swaps in the wrong one of these sound-alike words."},{"id":"gs-039","section":"grammar","subtype":"error-free-sentence","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"The four sentences below describe a missing wallet. Which sentence has no errors in spelling, punctuation, or word usage?","choices":["When the officers arrived, the man who's wallet was missing was waiting outside.","When the officers arrived, the man whose wallet was missing was waiting outside.","When the officers arrived the man, whose wallet was missing was waiting outside.","When the officer's arrived, the man whose wallet was missing was waiting outside."],"answer":1,"fixed":false,"explanation":"\"Whose\" shows ownership (\"who's\" means \"who is\"), \"officers\" is a plain plural, and the comma belongs right after the introductory clause \"When the officers arrived\"."},{"id":"gs-040","section":"grammar","subtype":"error-free-sentence","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"The four sentences below describe a schedule change. Which sentence has no errors in spelling, punctuation, or word usage?","choices":["The supervisor said the new schedule would not effect anyone except the night shift.","The supervisor said the new schedule would not affect anyone accept the night shift.","The supervisor said the new schedule, would not affect anyone except the night shift.","The supervisor said the new schedule would not affect anyone except the night shift."],"answer":3,"fixed":false,"explanation":"\"Affect\" is the verb meaning to influence, and \"except\" means other than. A comma should never separate the subject \"the new schedule\" from its verb."},{"id":"gs-041","section":"grammar","subtype":"error-free-sentence","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"The four sentences below describe a two-car crash. Which sentence has no errors in spelling, punctuation, or word usage?","choices":["Both drivers' statements were recorded before the tow truck arrived.","Both driver's statements were recorded before the tow truck arrived.","Both drivers statements were recorded before the tow truck arrived.","Both drivers' statements were recorded before the toe truck arrived."],"answer":0,"fixed":false,"explanation":"There are two drivers, so the plural possessive puts the apostrophe after the \"s\": \"drivers'\". A truck that pulls vehicles is a \"tow\" truck."},{"id":"gs-042","section":"grammar","subtype":"error-free-sentence","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"The four sentences below describe a cyclist. Which sentence has no errors in spelling, punctuation, or word usage?","choices":["The cyclist rode passed the stop sign and then turned onto Mill Street.","The cyclist rode past the stop sign and then turned onto Mill Street.","The cyclist rode past the stop sign and than turned onto Mill Street.","The cyclist road past the stop sign and then turned onto Mill Street."],"answer":1,"fixed":false,"explanation":"\"Rode\" is the past tense of \"ride\", \"past\" means beyond, and \"then\" shows what happened next. \"Road\", \"passed\", and \"than\" are sound-alike words with other meanings."},{"id":"gs-043","section":"grammar","subtype":"error-free-sentence","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle"],"difficulty":3,"stimulus":null,"stem":"The four sentences below describe a request from a school. Which sentence has no errors in spelling, punctuation, or word usage?","choices":["The school principle asked whether an officer could attend the assembly.","The school principal asked weather an officer could attend the assembly.","The school principal asked whether an officer could attend the assembly.","The school principal asked whether an officer could attend the assembly?"],"answer":2,"fixed":false,"explanation":"The head of a school is a \"principal\", and \"whether\" introduces the choice being asked about. Because the sentence only reports the question, it ends with a period, not a question mark."},{"id":"gs-044","section":"grammar","subtype":"error-free-sentence","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle"],"difficulty":2,"stimulus":null,"stem":"The four sentences below describe a brake failure. Which sentence has no errors in spelling, punctuation, or word usage?","choices":["The driver said her breaks failed, so she steered onto the shoulder.","The driver said her brakes failed so, she steered onto the shoulder.","The driver said her brakes failed, so she steered onto the sholder.","The driver said her brakes failed, so she steered onto the shoulder."],"answer":3,"fixed":false,"explanation":"A vehicle stops with \"brakes\", the comma goes before the joining word \"so\", and \"shoulder\" is spelled with \"ou\"."},{"id":"gs-045","section":"grammar","subtype":"error-free-sentence","families":["upper-dublin","montco","bucks","radnor"],"products":["ngle"],"difficulty":3,"stimulus":null,"stem":"The four sentences below describe an open door. Which sentence has no errors in spelling, punctuation, or word usage?","choices":["Officer Reyes, who was first on the scene found the back door wide open.","Officer Reyes, who was first on the seen, found the back door wide open.","Officer Reyes, who was first on the scene, found the back door wide open.","Officer Reyes, whom was first on the scene, found the back door wide open."],"answer":2,"fixed":false,"explanation":"The clause \"who was first on the scene\" needs a comma on both sides, \"who\" is correct because it is the subject of \"was\", and a location is a \"scene\"."},{"id":"gs-046","section":"grammar","subtype":"clearest-sentence","families":["upper-dublin","montco","bucks","radnor"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":null,"stem":"Facts: Officer Patel found a wallet. The wallet was under a bench. The bench was in Linden Park.\n\nWhich sentence states the information most clearly and correctly?","choices":["Lying under a bench in Linden Park, Officer Patel found a wallet.","A wallet under a bench in Linden Park, found by Officer Patel.","Officer Patel found a wallet on a bench in Linden Park.","Officer Patel found a wallet under a bench in Linden Park."],"answer":3,"fixed":false,"explanation":"The clear version gives all three facts in one complete sentence. The sentence that opens with \"Lying under a bench\" makes it sound as if the officer was under the bench, one version is a fragment, and one changes \"under\" to \"on\"."},{"id":"gs-047","section":"grammar","subtype":"clearest-sentence","families":["upper-dublin","montco","bucks","radnor"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"Facts: Ms. Ortiz saw a man. The man was carrying a television. Ms. Ortiz was standing on her porch at the time.\n\nWhich sentence states the information most clearly and correctly?","choices":["While standing on her porch, Ms. Ortiz saw a man carrying a television.","Ms. Ortiz saw a man carrying a television while standing on her porch.","Ms. Ortiz saw a man he was carrying a television she was standing on her porch.","While standing on his porch, a man saw Ms. Ortiz carrying a television."],"answer":0,"fixed":false,"explanation":"Putting \"While standing on her porch\" next to \"Ms. Ortiz\" makes it clear who was on the porch. When that phrase comes right after \"television\", it could describe the man instead."},{"id":"gs-048","section":"grammar","subtype":"clearest-sentence","families":["upper-dublin","montco","bucks","radnor"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"Facts: Mr. Chen spoke with Mr. Hale. Afterward, Mr. Hale moved his own truck out of the fire lane.\n\nWhich sentence states the information most clearly and correctly?","choices":["After Mr. Chen spoke with Mr. Hale, he moved his truck out of the fire lane.","After Mr. Chen spoke with Mr. Hale, Mr. Hale moved his own truck out of the fire lane.","After Mr. Chen spoke with Mr. Hale, Mr. Chen moved Mr. Hale's truck out of the fire lane.","After Mr. Chen spoke with Mr. Hale, who moved his own truck out of the fire lane."],"answer":1,"fixed":false,"explanation":"Repeating \"Mr. Hale\" leaves no doubt about who moved the truck and whose truck it was. With \"he moved his truck\", the reader cannot tell which man is meant."},{"id":"gs-049","section":"grammar","subtype":"clearest-sentence","families":["upper-dublin","montco","bucks","radnor"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"Facts: The alarm at the bakery sounded at 2:40 a.m. Officer Brandt arrived at 2:52 a.m. He found the front door unlocked.\n\nWhich sentence states the information most clearly and correctly?","choices":["After the bakery alarm sounded at 2:52 a.m., Officer Brandt arrived at 2:40 a.m. and found the front door unlocked.","The bakery alarm sounded at 2:40 a.m., Officer Brandt arrived at 2:52 a.m., he found the front door unlocked.","After the bakery alarm sounded at 2:40 a.m., Officer Brandt arrived at 2:52 a.m. and found the front door unlocked.","Arriving at 2:52 a.m., the front door was found unlocked after the bakery alarm sounded at 2:40 a.m."],"answer":2,"fixed":false,"explanation":"The clear version keeps both times correct and names who arrived and found the door. The others swap the two times, string three sentences together with commas, or leave out the officer so that the door seems to be \"arriving\"."},{"id":"gs-050","section":"grammar","subtype":"clearest-sentence","families":["upper-dublin","montco","bucks","radnor"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":null,"stem":"Facts: A dog bit a mail carrier. The dog was brown. The mail carrier was delivering a package on Quince Street.\n\nWhich sentence states the information most clearly and correctly?","choices":["A mail carrier was bitten by a brown dog delivering a package on Quince Street.","A brown dog chased a mail carrier who was delivering a package on Quince Street.","A brown dog bit a mail carrier who was delivering a package on Quince Street.","A brown dog that bit a mail carrier delivering a package on Quince Street."],"answer":2,"fixed":false,"explanation":"\"Who was delivering a package\" sits right after \"mail carrier\", so it is clear who had the package. Placing \"delivering a package\" after \"dog\" makes the dog the one delivering it."},{"id":"gs-051","section":"grammar","subtype":"clearest-sentence","families":["upper-dublin","montco","bucks","radnor"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"Facts: The store manager called the police. A customer was shouting at a cashier. The customer had refused to leave.\n\nWhich sentence states the information most clearly and correctly?","choices":["The store manager called the police because a customer who was shouting at a cashier had refused to leave.","The store manager called the police about a customer shouting at a cashier because he had refused to leave.","A cashier called the police because a customer who was shouting at the store manager had refused to leave.","The store manager called the police a customer was shouting at a cashier and had refused to leave."],"answer":0,"fixed":false,"explanation":"The clear version says exactly who called, who was shouting, and who refused to leave. In the version with \"because he had refused to leave\", \"he\" could be the manager, the customer, or the cashier."},{"id":"gs-052","section":"grammar","subtype":"clearest-sentence","families":["upper-dublin","montco","bucks","radnor"],"products":["ncjosi2","ngle"],"difficulty":3,"stimulus":null,"stem":"Facts: Officer Lindqvist stopped a blue pickup truck. The truck had a broken taillight. The stop took place on Route 9 near the quarry.\n\nWhich sentence states the information most clearly and correctly?","choices":["Officer Lindqvist stopped a blue pickup truck on Route 9 near the quarry with a broken taillight.","Having a broken taillight, Officer Lindqvist stopped a blue pickup truck on Route 9 near the quarry.","On Route 9 near the quarry, Officer Lindqvist stopped a blue pickup truck that had a broken headlight.","On Route 9 near the quarry, Officer Lindqvist stopped a blue pickup truck that had a broken taillight."],"answer":3,"fixed":false,"explanation":"\"That had a broken taillight\" directly follows \"truck\", the thing it describes. In the other versions the broken taillight seems to belong to the quarry or to the officer, or the taillight becomes a headlight."},{"id":"gs-053","section":"grammar","subtype":"clearest-sentence","families":["upper-dublin","montco","bucks","radnor"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"Facts: Two juveniles were spray-painting a wall of the recreation center. A custodian saw them. The time was about 7:30 p.m.\n\nWhich sentence states the information most clearly and correctly?","choices":["Spray-painting a wall of the recreation center, a custodian saw two juveniles at about 7:30 p.m.","At about 7:30 p.m., a custodian saw two juveniles spray-painting a wall of the recreation center.","At about 7:30 p.m., two juveniles saw a custodian spray-painting a wall of the recreation center.","At about 7:30 p.m., two juveniles spray-painting a wall of the recreation center, seen by a custodian."],"answer":1,"fixed":false,"explanation":"The clear version keeps \"spray-painting\" next to \"two juveniles\". Opening with \"Spray-painting a wall\" makes the custodian the painter, and another version reverses who saw whom."},{"id":"gs-054","section":"grammar","subtype":"clearest-sentence","families":["upper-dublin","montco","bucks","radnor"],"products":["ncjosi2","ngle"],"difficulty":3,"stimulus":null,"stem":"Facts: Officer Adeyemi handed the recovered phone to Ms. Park. Ms. Park thanked the officer. Officer Adeyemi then returned to the patrol car.\n\nWhich sentence states the information most clearly and correctly?","choices":["Officer Adeyemi handed the recovered phone to Ms. Park, and after she thanked her, she returned to the patrol car.","Ms. Park handed the recovered phone to Officer Adeyemi and, after the officer thanked her, returned to the patrol car.","Officer Adeyemi handed the recovered phone to Ms. Park and, after Ms. Park thanked the officer, returned to the patrol car.","Officer Adeyemi handed the recovered phone to Ms. Park she thanked the officer then the officer returned to the patrol car."],"answer":2,"fixed":false,"explanation":"Naming each person instead of using \"she\" and \"her\" makes it certain who thanked whom and who went back to the car. The version with \"after she thanked her, she returned\" could be read either way."},{"id":"gs-055","section":"grammar","subtype":"clearest-sentence","families":["upper-dublin","montco","bucks","radnor"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"Facts: A delivery van struck a parked car. The parked car was a gray sedan. The van was backing out of an alley. No one was injured.\n\nWhich sentence states the information most clearly and correctly?","choices":["A delivery van struck a parked gray sedan backing out of an alley, and no one was injured.","A gray sedan backing out of an alley struck a parked delivery van, and no one was injured.","A delivery van backing out of an alley and striking a parked gray sedan, with no one injured.","A delivery van backing out of an alley struck a parked gray sedan, and no one was injured."],"answer":3,"fixed":false,"explanation":"\"Backing out of an alley\" belongs beside \"delivery van\", the vehicle that was moving. Placed after \"sedan\", it wrongly describes the parked car."},{"id":"rs-001","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":"stim-rs-01","stem":"A caller reports that she has just returned from a week away and found her garage door pried open and a bicycle missing. No one else is at the property. Which priority code applies?","choices":["Priority 1","Priority 2","Priority 3","Priority 4"],"answer":2,"fixed":true,"explanation":"The break-in has already ended and no one is in danger, which matches the Priority 3 definition. It is not Priority 2 because the crime is not in progress at the time of the call."},{"id":"rs-002","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":"stim-rs-01","stem":"A caller reports that he is watching two people break the window of an empty parked car across the street and reach inside. Which priority code applies?","choices":["Priority 1","Priority 2","Priority 3","Priority 4"],"answer":1,"fixed":true,"explanation":"A crime against property is happening at the time of the call and no person is in danger, which is the Priority 2 definition. Priority 3 would apply only after the crime had ended."},{"id":"rs-003","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":"stim-rs-01","stem":"A caller reports that a man has just broken into the house next door and is now chasing her neighbor through the back yard, shouting that he is going to hurt him. Which priority code applies?","choices":["Priority 1","Priority 2","Priority 3","Priority 4"],"answer":0,"fixed":true,"explanation":"The neighbor is in immediate danger of being physically harmed at the time of the call, so Priority 1 applies. Priority 2 covers a property crime in progress only when no person is in immediate danger."},{"id":"rs-004","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":"stim-rs-01","stem":"Which of the following calls should be coded Priority 4?","choices":["A caller reports that his wallet was stolen from a gym locker yesterday.","A caller reports that someone is spray-painting the wall of a closed store right now.","A caller reports that a stranger is trying to pull her out of her car right now.","A caller asks what time the borough's overnight parking ban begins."],"answer":3,"fixed":false,"explanation":"A question about the parking ban involves no crime and no danger, which is the Priority 4 definition. The stolen wallet is a crime that has ended (Priority 3), the spray-painting is a property crime in progress (Priority 2), and the caller being pulled from her car is in immediate danger (Priority 1)."},{"id":"rs-005","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":"stim-rs-02","stem":"Which situation violates Rule 7.3?","choices":["Officer Luis Ortega, off duty and carrying his department radio, drives his assigned vehicle and gives a ride to a neighbor who is not a department employee.","Officer Nadia Rahman, who lives 8 miles outside the township line, drives her assigned vehicle to a grocery store off duty, alone, carrying her department radio.","Officer Grace Kim returns her assigned vehicle to the station lot before leaving home for a 5-day trip.","Officer Paul Adeyemi, off duty and carrying his department radio, drives his assigned vehicle and gives a ride to a department records clerk."],"answer":0,"fixed":false,"explanation":"The rule bars any off-duty passenger who is not a department employee, so giving the neighbor a ride is a violation. The records clerk is a department employee, 8 miles is within the 10-mile limit, and returning the vehicle before a 5-day trip is exactly what the rule requires."},{"id":"rs-006","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":"stim-rs-02","stem":"Officer Minh Tran lives outside Marlow Township, 12 miles from the township line. According to Rule 7.3, which statement must be true?","choices":["Officer Tran may be assigned a take-home vehicle if he always carries a department radio.","Officer Tran may not be assigned a take-home vehicle.","Officer Tran may be assigned a take-home vehicle if he returns it to the station lot every 3 days.","Officer Tran may be assigned a take-home vehicle if he never carries passengers."],"answer":1,"fixed":false,"explanation":"The words \"only if\" make living in the township or within 10 miles of its line a requirement for being assigned a vehicle. Officer Tran lives 12 miles away, so he cannot be assigned one no matter which other conditions he meets."},{"id":"rs-007","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":"stim-rs-02","stem":"Officer Dana Whitfield has an assigned take-home vehicle. She will be away from home for exactly 3 days in a row. Under Rule 7.3, which statement is correct?","choices":["She must return the vehicle to the station lot, because the rule covers any absence of 3 days or more.","She may leave the vehicle with a family member to drive while she is away.","She must return the vehicle to the station lot only if she lives outside the township.","She is not required to return the vehicle to the station lot, because the rule covers only absences of more than 3 days."],"answer":3,"fixed":false,"explanation":"The return requirement applies to absences of more than 3 days in a row, and exactly 3 days is not more than 3. Letting a family member drive the vehicle would break the rule that only the assigned officer may drive it off duty."},{"id":"rs-008","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":"stim-rs-02","stem":"Which situation satisfies every requirement of Rule 7.3?","choices":["Officer Jenna Kowalski, who lives in the township, has her husband, who is not a department employee, drive her assigned vehicle to the car wash.","Officer Omar Haddad, who lives in the township, drives his assigned vehicle to a hardware store off duty, alone, carrying his department radio.","Officer Samuel Osei, who lives in the township, drives his assigned vehicle off duty, alone, after leaving his department radio at home.","Officer Mei Chen, who lives in the township, leaves her assigned vehicle in her driveway while she is away from home for 6 days in a row."],"answer":1,"fixed":false,"explanation":"Officer Haddad lives in the township, drives the vehicle himself, carries his radio and has no passengers, so every requirement is met. Each of the other situations breaks one requirement: someone other than the assigned officer drives, the radio is missing, or the vehicle is not returned before an absence of more than 3 days."},{"id":"rs-009","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":"stim-rs-03","stem":"A woman reports that a stranger pushed her to the ground and ran off with her handbag. The bag and its contents were worth $350. How should the report be categorized?","choices":["Force Taking","Major Loss","Entry Taking","Simple Taking"],"answer":0,"fixed":false,"explanation":"The property was worth less than $2,000 and force was used against a person, which is the Force Taking definition. It is not a Major Loss because $350 is below $2,000."},{"id":"rs-010","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":"stim-rs-03","stem":"A man reports that while he was at work, someone entered his locked garage without permission and took tools worth $2,600. No one was threatened or hurt. How should the report be categorized?","choices":["Force Taking","Entry Taking","Simple Taking","Major Loss"],"answer":3,"fixed":false,"explanation":"Property worth $2,000 or more is a Major Loss no matter how it was taken. Entry Taking looks tempting because of the unpermitted entry, but that category applies only when the property is worth less than $2,000."},{"id":"rs-011","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":"stim-rs-03","stem":"A customer who was welcomed into a jewelry store during business hours slips a $900 watch into his pocket while the clerk is busy and walks out. No force or threat is used. How should the report be categorized?","choices":["Major Loss","Force Taking","Simple Taking","Entry Taking"],"answer":2,"fixed":false,"explanation":"The watch is worth less than $2,000, no force or threat was used, and the customer entered the store with permission, so none of the first three definitions fits and the report is a Simple Taking. Entry Taking requires that the taker entered without permission."},{"id":"rs-012","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":"stim-rs-03","stem":"Which incident should be categorized as an Entry Taking?","choices":["A passerby takes a $150 bicycle that was lying on a front lawn while no one is home.","A man threatens a cashier and takes $600 from the register.","A teenager climbs through a neighbor's window without permission while no one is home and takes a game console worth $400.","Someone enters a parked work truck without permission while no one is nearby and takes equipment worth $3,100."],"answer":2,"fixed":false,"explanation":"The game console is worth less than $2,000, no force or threat was used, and it was taken from inside a building entered without permission, which is the Entry Taking definition. The lawn bicycle is a Simple Taking, the threat makes the register theft a Force Taking, and the $3,100 value makes the truck theft a Major Loss."},{"id":"rs-013","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":3,"stimulus":"stim-rs-03","stem":"A report has been correctly categorized as a Simple Taking. Which statement must be true?","choices":["The property was taken from an outdoor location.","The taker had permission to enter the place where the property was kept.","The property taken was worth less than $500.","The property taken was worth less than $2,000."],"answer":3,"fixed":false,"explanation":"Any property worth $2,000 or more is a Major Loss, so a Simple Taking must involve property worth less than $2,000. The other statements could be true but do not have to be; for example, a Simple Taking can happen inside a store the taker was invited into, or outdoors where no entry is involved at all."},{"id":"rs-014","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"A Brightwater Borough park rule states: \"Amplified music is not allowed in any borough park unless the group has a park permit and the music ends by 9:00 p.m.\" Which situation violates the rule?","choices":["A group with a park permit plays amplified music in a borough park from 6:00 p.m. to 8:30 p.m.","A group with a park permit plays amplified music in a borough park until 9:45 p.m.","A group with no park permit plays unamplified guitars in a borough park until 10:00 p.m.","A group with a park permit plays amplified music in a borough park from 7:00 p.m. to 9:00 p.m."],"answer":1,"fixed":false,"explanation":"Amplified music needs both a permit and an end time of 9:00 p.m. or earlier, so music that runs until 9:45 p.m. breaks the rule even with a permit. The unamplified guitars are not covered by the rule at all, and music that ends exactly at 9:00 p.m. has ended by 9:00 p.m."},{"id":"rs-015","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":null,"stem":"All officers assigned to the Garnet Lake Borough Marine Unit are certified divers. Officer Reyes is assigned to the Marine Unit. Which statement must be true?","choices":["Every certified diver in Garnet Lake Borough is assigned to the Marine Unit.","Officer Reyes is the only certified diver in the department.","Officers who are not assigned to the Marine Unit are not certified divers.","Officer Reyes is a certified diver."],"answer":3,"fixed":false,"explanation":"Everyone in the Marine Unit is a certified diver and Officer Reyes is in the Marine Unit, so Officer Reyes must be a certified diver. The statements say nothing about divers outside the unit, so the reversed versions do not follow."},{"id":"rs-016","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"All members of the Ashford Township Crash Team are trained in scene photography. Some Ashford Township sergeants are members of the Crash Team. Which statement must be true?","choices":["All Ashford Township sergeants are trained in scene photography.","Everyone trained in scene photography is a member of the Crash Team.","Some Ashford Township sergeants are not trained in scene photography.","Some Ashford Township sergeants are trained in scene photography."],"answer":3,"fixed":false,"explanation":"The sergeants who are on the Crash Team must be trained in scene photography, because every team member is. Nothing is said about sergeants who are not on the team, so it cannot be concluded that all of them are trained or that some of them are not."},{"id":"rs-017","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"At the Stonebridge Borough Police Department, if a report involves a juvenile, Sergeant Bello must review it before it is filed. Report 88 was filed without being reviewed by Sergeant Bello, and no rule was broken. Which statement must be true?","choices":["Report 88 involves a juvenile.","Sergeant Bello reviews only reports that involve juveniles.","Report 88 does not involve a juvenile.","Sergeant Bello was off duty when Report 88 was filed."],"answer":2,"fixed":false,"explanation":"If Report 88 involved a juvenile, filing it without Sergeant Bello's review would have broken the rule. Since no rule was broken, the report cannot involve a juvenile. The rule does not say what else Sergeant Bello reviews or why he did not review this one."},{"id":"rs-018","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":3,"stimulus":null,"stem":"Whenever a fog warning is in effect, the Harbor Road bridge in Garnet Lake Borough is closed. This morning the Harbor Road bridge is closed. What can be concluded with certainty about the fog warning?","choices":["A fog warning is in effect.","Nothing certain; a warning may or may not be in effect.","A fog warning is not in effect.","A fog warning was in effect earlier but has now ended."],"answer":1,"fixed":false,"explanation":"The statement says fog warnings close the bridge; it does not say fog warnings are the only thing that closes it. A closed bridge is consistent with a warning being in effect or not, so nothing certain follows about the warning."},{"id":"rs-019","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":null,"stem":"No probationary officer in the Wexley Township Police Department is allowed to patrol alone on the night shift. Last Tuesday, Officer Lindqvist patrolled alone on the night shift, and no rule was broken. Which statement must be true?","choices":["Officer Lindqvist is a probationary officer.","Probationary officers never work the night shift.","Every officer who is not probationary patrols alone on the night shift.","Officer Lindqvist is not a probationary officer."],"answer":3,"fixed":false,"explanation":"A probationary officer patrolling alone at night would break the rule, and no rule was broken, so Officer Lindqvist cannot be probationary. The rule bars probationary officers only from patrolling alone at night; it does not keep them off the night shift or say what other officers do."},{"id":"rs-020","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":3,"stimulus":null,"stem":"Every vehicle in the Marlow Township impound lot has an inventory tag. Everything that has an inventory tag is listed in the property log. A blue van is not listed in the property log. Which statement must be true?","choices":["The blue van has an inventory tag.","The blue van is not in the impound lot.","Everything listed in the property log is in the impound lot.","The blue van is in the impound lot but was left out of the log."],"answer":1,"fixed":false,"explanation":"If the van were in the impound lot it would have a tag, and anything with a tag is in the log. The van is not in the log, so it has no tag and cannot be in the lot. The statements do not say that everything in the log is in the lot."},{"id":"rs-021","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":null,"stem":"Officer Abara has more years of service than Officer Brandt. Officer Cho has fewer years of service than Officer Brandt. Officer Dvorak has more years of service than Officer Abara. Which officer has the fewest years of service?","choices":["Officer Abara","Officer Brandt","Officer Dvorak","Officer Cho"],"answer":3,"fixed":false,"explanation":"Putting the statements in order gives Dvorak, then Abara, then Brandt, then Cho, from most years to fewest. Cho is below Brandt, who is below everyone else, so Cho has the fewest years."},{"id":"rs-022","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":3,"stimulus":null,"stem":"In the Pine Hollow Borough Police Department, an officer may carry a patrol rifle only if the officer has passed the rifle qualification within the last 12 months. Officer Santos is carrying a patrol rifle today, and no rule is being broken. Officer Mbeki passed the rifle qualification 3 months ago. Which statement must be true?","choices":["Officer Mbeki is carrying a patrol rifle today.","Every officer who passed the rifle qualification within the last 12 months carries a patrol rifle.","Officer Santos passed the rifle qualification within the last 12 months.","Officer Santos passed the rifle qualification more recently than Officer Mbeki did."],"answer":2,"fixed":false,"explanation":"\"Only if\" makes a recent qualification a requirement for carrying a rifle, so Officer Santos, who is carrying one within the rules, must have qualified in the last 12 months. Qualifying allows an officer to carry a rifle but does not require it, so nothing follows about whether Officer Mbeki is carrying one."},{"id":"rs-023","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"All K-9 handlers in the Orrin Borough Police Department work the evening shift. No officer who works the evening shift is assigned to the school detail. Which statement must be true?","choices":["No K-9 handler is assigned to the school detail.","All officers on the evening shift are K-9 handlers.","Some K-9 handlers are assigned to the school detail.","Every officer who is not on the school detail works the evening shift."],"answer":0,"fixed":false,"explanation":"Every K-9 handler is on the evening shift, and nobody on the evening shift is on the school detail, so no K-9 handler can be on the school detail. The statements do not say that the evening shift consists only of K-9 handlers or that everyone off the school detail works evenings."},{"id":"rs-024","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":3,"stimulus":"stim-rs-04","stem":"Which statement must be true of every assignment that follows the rules?","choices":["Dempsey is assigned to Patrol.","Alvarez is assigned to the Front Desk.","Eze is assigned to Traffic.","Brooks is assigned to Traffic."],"answer":2,"fixed":false,"explanation":"Brooks can never join Chaudhry on Patrol, because Eze would then take the Front Desk and Dempsey would be forced into Traffic. Dempsey therefore takes the second Patrol spot or the Front Desk, and in either case Alvarez and Brooks must be split up, which always leaves Eze in Traffic. The other statements are true in some valid assignments but not in all of them."},{"id":"rs-025","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":"stim-rs-04","stem":"If Dempsey is assigned to the Front Desk, who must be assigned to Patrol with Chaudhry?","choices":["Alvarez","Brooks","Eze","Either Alvarez or Brooks; the rules allow both"],"answer":0,"fixed":false,"explanation":"With Dempsey on the Front Desk, Brooks cannot take Patrol because Rule 4 would then require Eze on the Front Desk, which is already filled. Eze cannot take Patrol either, because that would leave Alvarez and Brooks together in Traffic. Only Alvarez can fill the second Patrol spot."},{"id":"rs-026","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":"stim-rs-04","stem":"If Alvarez is assigned to Traffic, which statement must be true?","choices":["Dempsey is assigned to the Front Desk.","Brooks is assigned to Patrol.","Brooks is assigned to the Front Desk.","Eze is assigned to Patrol."],"answer":2,"fixed":false,"explanation":"Brooks cannot share Traffic with Alvarez. Brooks also cannot take Patrol, since Eze would then need the Front Desk and Dempsey would be forced into Traffic. That leaves the Front Desk for Brooks, with Dempsey joining Chaudhry on Patrol and Eze joining Alvarez in Traffic."},{"id":"rs-027","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":3,"stimulus":"stim-rs-04","stem":"Which assignment is impossible under the rules?","choices":["Alvarez assigned to Patrol","Brooks assigned to Patrol","Dempsey assigned to Patrol","Brooks assigned to the Front Desk"],"answer":1,"fixed":false,"explanation":"If Brooks took Patrol with Chaudhry, Rule 4 would put Eze on the Front Desk, leaving only the two Traffic spots for Alvarez and Dempsey, and Dempsey cannot work Traffic. Each of the other assignments appears in at least one arrangement that follows all four rules."},{"id":"rs-028","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":null,"stem":"Three officers - Ito, Jankowski and Kamara - each work one shift on Tuesday: day, evening or night. No two of them work the same shift. Kamara works only days. Ito cannot work nights. Who works Tuesday night?","choices":["Ito","Kamara","Jankowski","It cannot be determined from the information given."],"answer":2,"fixed":false,"explanation":"Kamara works only days, so Kamara has the day shift. Ito cannot work nights, so Ito must take the evening shift, which leaves the night shift for Jankowski."},{"id":"rs-029","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":null,"stem":"Sergeant Okoye must split four officers - Lang, Mendez, Novak and Price - into two patrol cars with two officers in each car. Lang cannot ride with Mendez. Mendez cannot ride with Novak. Who rides with Lang?","choices":["Mendez","Price","Novak","Either Novak or Price; the rules allow both"],"answer":2,"fixed":false,"explanation":"Mendez cannot ride with Lang or with Novak, so Mendez must ride with Price. That leaves Lang and Novak to share the other car."},{"id":"rs-030","section":"reasoning","subtype":"deductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":3,"stimulus":null,"stem":"Four officers - Quinn, Rossi, Shah and Tanaka - each cover the front desk on a different day from Monday through Thursday. Tanaka covers Monday. Shah covers the day immediately after Quinn. Rossi does not cover Thursday. Who covers Wednesday?","choices":["Rossi","Quinn","Shah","Tanaka"],"answer":1,"fixed":false,"explanation":"With Tanaka on Monday, Quinn and Shah must take Tuesday and Wednesday or Wednesday and Thursday. Tuesday and Wednesday would leave Thursday for Rossi, which is not allowed. So Rossi covers Tuesday, Quinn covers Wednesday and Shah covers Thursday."},{"id":"rs-031","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":"stim-rs-05","stem":"Which statement is true of all four burglaries?","choices":["Each took place at a home on the same street.","A wristwatch was among the items taken in each.","Entry was made through a front window in each.","Each took place on a Thursday, in the middle of the day."],"answer":3,"fixed":false,"explanation":"All four dates are Thursdays and every time window falls between 10:00 a.m. and 1:00 p.m. Three different streets are listed, a wristwatch was taken only once, and entry was always through a rear sliding door."},{"id":"rs-032","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":3,"stimulus":"stim-rs-05","stem":"Which of these other March reports most likely belongs to the same series?","choices":["Thursday, March 12, about 11:00 p.m.: front door kicked in at a home on Fern Road; a television and a laptop were taken, and jewelry was left behind.","Thursday, March 19, about 11:30 a.m.: rear sliding door pried open at a second home backing onto the trail; jewelry was taken, and electronics were left behind.","Saturday, March 21, about 2:00 a.m.: rear window broken at a hardware store on Route 9; power tools were taken, and the cash register was left untouched.","Tuesday, March 10, about 11:00 a.m.: an unlocked car in a driveway on Sorrel Lane was entered; loose change was taken, and the house was not entered."],"answer":1,"fixed":false,"explanation":"The second trail-side home matches the series on every point: a Thursday, late morning, a pried rear sliding door, jewelry taken and electronics left behind. The Fern Road report shares the day and the street but happened at night through the front door with electronics taken, and the other two differ in day, target and method."},{"id":"rs-033","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":"stim-rs-05","stem":"If the pattern continues, when and where is the next burglary most likely?","choices":["Friday, March 27, in the late evening, at a home that backs onto the Otter Run Trail","Thursday, April 2, after midnight, at a business on Route 9","Thursday, April 2, in the late morning, at a home that backs onto the Otter Run Trail","Sunday, March 29, in the late morning, at an apartment in the town center"],"answer":2,"fixed":false,"explanation":"The burglaries have occurred one week apart on Thursdays, between mid-morning and early afternoon, at homes backing onto the trail. One week after March 26 is Thursday, April 2, and only one choice matches the day, the time of day and the type of location."},{"id":"rs-034","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":"stim-rs-05","stem":"Which conclusion about the burglar's method is best supported by the table?","choices":["The burglar probably approaches each home from the trail behind it and enters at the back.","The burglar probably knows the homeowners and is let in through the front door.","The burglar is mainly looking for large electronics to resell.","The burglar works at night while the residents are asleep."],"answer":0,"fixed":false,"explanation":"Every home backs onto the trail and every entry was through a pried rear sliding door, which points to an approach from the trail side. The forced entry rules out being let in, the electronics were left behind, and every burglary happened in the middle of the day."},{"id":"rs-035","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":"stim-rs-06","stem":"If the pattern continues, when and where is the next theft most likely?","choices":["June 14 at the Ashby lot","June 14 at the Elmhurst lot","June 12 at the Elmhurst lot","June 15 at the Fenwick lot"],"answer":1,"fixed":false,"explanation":"The thefts are three days apart (June 2, 5, 8, 11) and move one station north each time (Ashby, Birchwood, Carver, Dalton). Three days after June 11 is June 14, and the next station north of Dalton is Elmhurst."},{"id":"rs-036","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":"stim-rs-06","stem":"What do the four thefts have in common?","choices":["All four thefts happened at the same station lot, on the same date.","A bag was taken from the back seat after a rear passenger window was broken.","All four thefts happened overnight, between midnight and 5:00 a.m.","The vehicle itself was stolen and later found at another station."],"answer":1,"fixed":false,"explanation":"In every report a rear passenger window was broken and a bag of some kind was taken from the back seat. The thefts happened at four different lots, all during daytime hours, and no vehicle was stolen."},{"id":"rs-037","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":"stim-rs-06","stem":"Which piece of advice to commuters would most directly address the pattern shown in the table?","choices":["Do not leave bags on the back seat where they can be seen.","Do not leave your car in a station lot overnight.","Always lock your doors, because the thief is getting into unlocked cars.","Use a steering-wheel lock, because cars are being driven away."],"answer":0,"fixed":false,"explanation":"Each theft involved a bag taken from the back seat, so removing visible bags addresses what the thief is after. The thefts happened in the daytime, entry was by breaking a window rather than opening an unlocked door, and no car was driven away."},{"id":"rs-038","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":1,"stimulus":"stim-rs-07","stem":"Four of the five reports appear to describe the same method. Which report does not belong with the others?","choices":["Report 1","Report 2","Report 3","Report 4"],"answer":3,"fixed":true,"explanation":"The bakery report describes a forced entry on a Wednesday night after closing, with a safe taken. The other reports all describe a Saturday afternoon theft of register cash while the only employee was drawn away by a customer."},{"id":"rs-039","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":2,"stimulus":"stim-rs-07","stem":"Most of the reports describe the same method. What is that method?","choices":["A rear door is forced open after the business has closed for the night.","A thief threatens the employee and demands the cash in the register.","Merchandise is hidden in a bag and carried out of the store unpaid.","A woman draws the only employee away, and cash is taken from the unattended register."],"answer":3,"fixed":false,"explanation":"In four reports a woman's request for help pulled the only employee away from the counter, and register cash was taken or found missing afterward. Forced entry appears in only one report, and no report mentions a threat or hidden merchandise."},{"id":"rs-040","section":"reasoning","subtype":"inductive","families":["upper-dublin","montco"],"products":["ncjosi2","ngle"],"difficulty":3,"stimulus":"stim-rs-07","stem":"Most of the reports follow one pattern. Which additional report most likely belongs to that series?","choices":["On a Saturday afternoon at a large supermarket, a man walked out with a cart of unpaid groceries while all eight cashiers were busy with customers.","On a Saturday night after closing, someone pried open the back door of a small gift shop and carried off the cash register.","On a Saturday aftern
