<!doctype html>
<!--

  This page is the artwork; src/images/share-card.jpg is a screenshot of it.
  If the names, date or venue ever change, edit the text below, open this file
  in a browser at 1200 x 630 and re-save the screenshot (see README.md here).
  Colors and fonts are the ones in DESIGN.md.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Cormorant Garamond'; font-weight: 300 700; font-style: normal; src: url("../../src/fonts/cormorant-garamond-latin.woff2") format("woff2"); }
  @font-face { font-family: 'Cormorant Garamond'; font-weight: 300 700; font-style: italic; src: url("../../src/fonts/cormorant-garamond-italic-latin.woff2") format("woff2"); }
  @font-face { font-family: 'Jost'; font-weight: 300 600; src: url("../../src/fonts/jost-latin.woff2") format("woff2"); }
  @font-face { font-family: 'Pinyon Script'; src: url("../../src/fonts/pinyon-script-ampersand.woff2") format("woff2"); }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #BCCAB3; display: flex; align-items: center; justify-content: center; }
  .card { position: relative; width: 1080px; height: 510px; background: #FBF8F2; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .card::before { content: ''; position: absolute; inset: 14px; border: 1.5px solid #C9A04A; opacity: 0.6; }
  .eyebrow { font: 500 22px/1 'Jost', sans-serif; letter-spacing: 0.26em; text-indent: 0.26em; text-transform: uppercase; color: #7E5C2E; }
  .names { margin-top: 26px; font: 300 150px/1.05 'Cormorant Garamond', serif; letter-spacing: 0.02em; color: #243022; display: flex; align-items: baseline; gap: 0.16em; }
  .amp { font: 400 0.8em/1 'Pinyon Script', cursive; color: #94702F; }
  .sprig { margin-top: 14px; width: 250px; height: 49px; color: #7E5C2E; }
  .sprig svg { width: 100%; height: 100%; }
  .date { margin-top: 18px; font: 400 46px/1.2 'Cormorant Garamond', serif; letter-spacing: 0.02em; color: #243022; }
  .place { margin-top: 6px; font: italic 400 33px/1.25 'Cormorant Garamond', serif; letter-spacing: 0.02em; color: #56634F; }
</style>
</head>
