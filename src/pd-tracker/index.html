<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Police Application Tracker</title>
<meta name="description" content="Track police department applications, sponsorships, and hiring steps.">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#BCCAB3">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PD Tracker">
<!-- Loaded without blocking the first paint, so the app still opens instantly with no signal (system fonts until these arrive). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Jost:wght@400;500&display=swap" media="print" onload="this.media='all'">
<style>
:root {
  /* DESIGN.md palette */
  --ivory: #FBF8F2;
  --mist: #EBECE2;
  --white: #FFFFFF;
  --hairline: #E4DCCA;
  --sage: #BCCAB3;
  --blush: #F3DCD5;
  --gold: #C9A04A;
  --champagne: rgba(201, 160, 74, .14);
  --gold-line: linear-gradient(90deg, #A47A2C, #D9B860, #F5E6A8, #C9A04A, #8F6A26);
  --text: #243022;
  --muted: #56634F;
  --link: #7E5C2E;
  --on-sage: #1F2A20;
  --on-sage-muted: #3E4A39;
  --gold-on-sage: #5E4519;
  --error: #A33B2E;
  --font-display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-body: Jost, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --tab-h: 64px;
  --radius: 12px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--ivory);
  color: var(--text);
  font: 400 17px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
b, strong { font-weight: 500; }
a { color: var(--link); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.15; margin: 0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }

/* Top bar */
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--sage); color: var(--on-sage);
  padding: calc(env(safe-area-inset-top) + 6px) 16px 8px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--gold-line); }
.topbar .brand { font-family: var(--font-display); font-size: 24px; font-style: italic; color: var(--on-sage); text-decoration: none; line-height: 1.1; }
.topbar .data-link {
  color: var(--on-sage); min-height: 44px; display: inline-flex; align-items: center; gap: 6px;
  padding: 0 14px; border: 1px solid var(--on-sage-muted); border-radius: 999px;
  text-decoration: none; font-weight: 500; font-size: 15px; flex: none;
}
.topbar .data-link[aria-current="page"] { background: var(--text); color: var(--ivory); border-color: var(--text); }
.topbar .data-link svg { width: 18px; height: 18px; }

main {
  max-width: 760px; margin: 0 auto;
  padding: 18px 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 28px);
}

/* Bottom tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; background: var(--sage);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--gold-line); }
.tabbar a {
  flex: 1; position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: var(--tab-h); color: var(--on-sage-muted); text-decoration: none;
  font-size: 13px; font-weight: 500;
}
.tabbar a svg { width: 25px; height: 25px; }
.tabbar a[aria-current="page"] { color: var(--on-sage); background: rgba(251, 248, 242, .5); }
.tabbar a[aria-current="page"]::before {
  content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 4px;
  background: var(--gold-on-sage); border-radius: 0 0 3px 3px;
}
@media (min-width: 760px) {
  .tabbar { justify-content: center; }
  .tabbar a { flex: 0 1 200px; }
}

/* Generic blocks */
.page-title { font-size: 34px; margin: 2px 0 6px; }
.lede { margin: 0 0 16px; color: var(--muted); }
.lede strong { color: var(--text); }
.card {
  background: var(--white); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
}
.card > h2, .section-title { font-size: 24px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
.count-pill {
  font-family: var(--font-body); font-size: 13px; font-weight: 500; background: var(--champagne); color: var(--text);
  border-radius: 999px; padding: 2px 10px; line-height: 1.5; white-space: nowrap;
}
.eyebrow { display: block; font-size: 12.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--link); }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.empty { color: var(--muted); margin: 6px 0; }
.stack > * + * { margin-top: 10px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 8px 22px; border-radius: 999px; text-align: center;
  font: inherit; font-size: 16px; font-weight: 500; line-height: 1.25; text-decoration: none; cursor: pointer;
  border: 1px solid var(--muted); background: var(--white); color: var(--text);
  -webkit-tap-highlight-color: transparent;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--text); color: var(--ivory); border-color: var(--text); }
.btn-danger { color: var(--error); border-color: var(--error); background: var(--white); }
.btn-danger-solid { background: var(--error); color: var(--ivory); border-color: var(--error); }
.btn-small { min-height: 44px; padding: 6px 16px; font-size: 15px; }
.btn-block { width: 100%; }
.btn svg { width: 18px; height: 18px; flex: none; }
.link-btn {
  background: none; border: 0; padding: 0 4px; min-height: 44px; font: inherit; font-size: 15px;
  font-weight: 500; color: var(--link); cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
}
.link-btn.danger { color: var(--error); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 4px 14px;
  background: var(--white); color: var(--text); border: 1px solid var(--muted); border-radius: 999px;
  font: inherit; font-size: 15px; line-height: 1.2; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.chip.done { background: var(--mist); border-color: var(--hairline); }
.chip.done::before { content: "\2713"; color: var(--muted); }
.chip[aria-current] { background: var(--text); color: var(--ivory); border-color: var(--text); font-weight: 500; }

/* Forms */
.fields { display: grid; gap: 14px; }
@media (min-width: 560px) { .fields { grid-template-columns: 1fr 1fr; } .span2 { grid-column: 1 / -1; } }
.field label, .note-add-row label, .controls-row label {
  display: block; font-size: 12.5px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 5px;
}
.field .req { letter-spacing: 0; text-transform: none; font-weight: 400; }
input[type=text], input[type=url], input[type=email], input[type=tel], input[type=number],
input[type=date], input[type=search], select, textarea {
  display: block; width: 100%; min-width: 0; min-height: 48px;
  font: inherit; font-size: 17px; color: var(--text);
  background: var(--white); border: 1px solid var(--muted); border-radius: 10px;
  padding: 10px 12px;
}
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; }
input[type=date] { -webkit-appearance: none; appearance: none; }
input[type=date]::-webkit-date-and-time-value { text-align: left; }
textarea { resize: vertical; line-height: 1.4; }
select { cursor: pointer; }
.field-error { color: var(--error); font-size: 15px; font-weight: 500; margin-top: 5px; }
[aria-invalid="true"] { border-color: var(--error) !important; border-width: 2px !important; }
.form-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.form-actions .btn { flex: 1 1 140px; }
fieldset { border: 0; padding: 0; margin: 0; }
legend { font-family: var(--font-display); font-size: 24px; line-height: 1.15; padding: 0; margin-bottom: 12px; }
.form-hint { margin: 12px 0 0; font-size: 15px; color: var(--muted); }
.form-group + .form-group { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--hairline); }

/* Stage badges */
.badge {
  display: inline-block; padding: 3px 11px; border-radius: 999px;
  font-size: 13.5px; font-weight: 500; line-height: 1.35; color: var(--text); white-space: nowrap;
  border: 1px solid transparent;
}
.s-researching { background: var(--mist); }
.s-applied, .s-written-test, .s-pt-test, .s-oral-board,
.s-background, .s-polygraph-psych, .s-medical { background: var(--champagne); border-color: var(--gold); }
.s-conditional-offer, .s-hired { background: var(--sage); color: var(--on-sage); }
.s-rejected { background: var(--blush); }
.s-withdrawn { background: var(--white); border-color: var(--muted); color: var(--muted); }
.s-on-hold { background: var(--white); border: 1px dashed var(--muted); }
.prio { font-size: 13.5px; font-weight: 500; padding: 2px 10px; border-radius: 999px; background: var(--champagne); white-space: nowrap; }

/* Stage progress */
.ticks { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; }
.ticks i { display: block; height: 8px; border-radius: 2px; background: var(--mist); }
.ticks i.on { background: var(--text); }
.ticks.mini { margin-top: 10px; }
.ticks.mini i { height: 5px; }
.stage-name { font-family: var(--font-display); font-size: 30px; line-height: 1.15; margin: 2px 0 2px; }
.stage-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; column-gap: 12px; margin-bottom: 8px; }
.stage-sub { font-size: 15px; color: var(--muted); margin: 0; }
#status-card .btn-primary { margin-top: 12px; }
details.stage-more { margin-top: 2px; }
details.stage-more > summary {
  list-style: none; cursor: pointer; min-height: 44px; display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 500; color: var(--link); text-decoration: underline; text-underline-offset: 3px;
}
details.stage-more > summary::-webkit-details-marker { display: none; }
.stage-more .eyebrow { margin: 14px 0 8px; }

/* Today */
.group-label { font-family: var(--font-body); font-size: 12.5px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--link); margin: 16px 0 2px; }
.group-label.urgent { color: var(--error); }
.card > h2 + .group-label { margin-top: 4px; }
.group-hint { font-size: 15px; color: var(--muted); margin: 0 0 2px; }
.stat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 560px) { .stat-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.stat {
  display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 8px 12px;
  background: var(--mist); border: 1px solid var(--hairline); border-radius: 10px;
  font: inherit; color: var(--text); text-align: left; cursor: pointer; width: 100%;
}
.stat b { font-size: 22px; line-height: 1; min-width: .8em; }
.stat span { font-size: 14.5px; line-height: 1.2; min-width: 0; }
.backup p, .install p { margin: 0 0 10px; }
.backup { font-size: 15px; }
.backup.warn { background: var(--champagne); border-color: var(--gold); }
.install h2 { font-size: 24px; margin-bottom: 6px; }
.alert-card { border-left: 4px solid var(--error); }
.events { list-style: none; margin: 0; padding: 0; }
.events li + li { border-top: 1px solid var(--hairline); }
.event {
  display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 12px; align-items: center;
  padding: 10px 0; min-height: 64px; text-decoration: none; color: var(--text);
}
.datebox {
  background: var(--sage); color: var(--on-sage); border-radius: 9px; text-align: center; padding: 5px 0; line-height: 1.1;
}
.datebox small { display: block; font-size: 11.5px; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; }
.datebox b { font-size: 21px; line-height: 1.1; }
.datebox.overdue { background: var(--blush); color: var(--text); }
.datebox.none { background: var(--mist); color: var(--muted); padding: 11px 0; }
.event-title { font-weight: 500; overflow-wrap: anywhere; }
.event-sub { font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
.event-when { font-weight: 500; color: var(--text); }
.event-when.late, .late { color: var(--error); font-weight: 500; }
.chev { font-size: 24px; line-height: 1; color: var(--muted); }

/* List */
.controls { display: grid; gap: 10px; margin-bottom: 8px; }
details.filters { background: var(--white); border: 1px solid var(--hairline); border-radius: var(--radius); }
details.filters > summary {
  list-style: none; cursor: pointer; min-height: 48px; padding: 0 14px;
  display: flex; align-items: center; justify-content: space-between; font-weight: 500; font-size: 16px;
}
details.filters > summary::-webkit-details-marker { display: none; }
details.filters > summary::after { content: "Show"; font-size: 14px; color: var(--link); font-weight: 500; }
details.filters[open] > summary::after { content: "Hide"; }
.filters-body { padding: 2px 14px 14px; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.filters-body .wide { grid-column: 1 / -1; }
.check {
  display: flex; align-items: center; gap: 12px; min-height: 48px; cursor: pointer;
}
.check input { width: 26px; height: 26px; margin: 0; flex: none; accent-color: var(--text); cursor: pointer; }
.result-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 15px; color: var(--muted); margin: 0 2px 6px; min-height: 44px; }
.result-actions { display: flex; gap: 10px; }
.dept-card {
  display: block; text-decoration: none; color: var(--text);
  background: var(--white); border: 1px solid var(--hairline);
  border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
}
.dept-card.p-High { border-left: 4px solid var(--gold); }
.dept-card:active { background: var(--mist); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.card-top h3 { font-size: 23px; overflow-wrap: anywhere; }
.card-meta { font-size: 15px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
.card-next { margin-top: 10px; font-size: 16px; overflow-wrap: anywhere; }
.needs { color: var(--link); font-weight: 500; }
.card-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: 14px; color: var(--muted); }

/* Detail */
.back {
  display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 6px 0 0;
  background: none; border: 0; color: var(--link); font: inherit; font-weight: 500; cursor: pointer;
}
.back svg { width: 20px; height: 20px; }
.detail-head h1 { font-size: 34px; overflow-wrap: anywhere; margin: 2px 0 4px; }
.detail-head .meta { color: var(--muted); font-size: 15.5px; overflow-wrap: anywhere; }
.detail-head .row { margin-top: 8px; }
.quick-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 14px; }
.quick-actions .btn { flex: 1 1 0; min-width: 96px; padding: 6px 10px; }
.head-gap { height: 14px; }
.next-when { font-size: 15.5px; color: var(--muted); margin: 12px 0 0; min-height: 1.5em; }
.next-card.is-late { border-left: 4px solid var(--error); }
#next-actions .btn { margin-top: 12px; }
details.sec { background: var(--white); border: 1px solid var(--hairline); border-radius: var(--radius); margin-bottom: 14px; }
details.sec > summary {
  list-style: none; cursor: pointer; min-height: 60px; padding: 10px 16px;
  display: flex; flex-direction: column; justify-content: center;
}
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary .sum-title { font-family: var(--font-display); font-size: 23px; line-height: 1.2; display: flex; justify-content: space-between; gap: 8px; }
details.sec > summary .sum-title::after { content: "+"; font-family: var(--font-body); font-size: 22px; line-height: 1; color: var(--link); }
details.sec[open] > summary .sum-title::after { content: "\2212"; }
details.sec > summary .sum-sub { font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
details.sec > .sec-body { padding: 2px 16px 16px; }
.note-add textarea { min-height: 68px; }
.note-add-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: end; margin-top: 10px; }
.notes { list-style: none; margin: 14px 0 0; padding: 0; }
.notes > li { border-top: 1px solid var(--hairline); padding: 10px 0 4px; }
.note-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14.5px; font-weight: 500; color: var(--muted); }
.tag { font-size: 12.5px; font-weight: 500; background: var(--mist); border-radius: 5px; padding: 0 6px; }
.note-text { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.note-actions { display: flex; gap: 12px; }
.docs { list-style: none; margin: 0; padding: 0; }
.docs li { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--hairline); }
.docs li:last-child { border-bottom: 0; }
.docs .check { flex: 1; overflow-wrap: anywhere; }
.docs .done-label { text-decoration: line-through; color: var(--muted); }
.doc-add { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; margin-top: 12px; }
.meta-list { font-size: 15px; color: var(--muted); margin: 0 0 12px; }

/* Data view */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 15.5px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

/* Toast + modal */
.toast {
  position: fixed; left: 16px; right: 16px; z-index: 60;
  bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px);
  max-width: 520px; margin: 0 auto; padding: 13px 16px; border-radius: 10px;
  background: var(--text); color: var(--ivory); font-weight: 500; box-shadow: 0 6px 24px rgba(36, 48, 34, .25);
  opacity: 0; transform: translateY(10px); transition: opacity .18s, transform .18s; pointer-events: none;
}
.toast.show { opacity: 1; transform: none; }
.toast.error { background: var(--error); }
.toast.has-action { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 8px 5px 16px; }
.toast.show.has-action { pointer-events: auto; }
.toast-undo {
  flex: none; min-height: 44px; padding: 0 14px; background: none; border: 0; cursor: pointer;
  font: inherit; font-weight: 500; color: var(--ivory); text-decoration: underline; text-underline-offset: 3px;
}
.modal-backdrop {
  position: fixed; inset: 0; z-index: 70; background: rgba(31, 42, 32, .6);
  display: flex; align-items: flex-end; justify-content: center; padding: 16px;
  padding-bottom: calc(16px + env(safe-area-inset-bottom));
}
@media (min-width: 560px) { .modal-backdrop { align-items: center; } }
.modal {
  background: var(--white); color: var(--text); border-radius: 14px; width: 100%; max-width: 480px;
  padding: 18px; border: 1px solid var(--hairline); max-height: 85vh; overflow: auto;
}
.modal h2 { font-size: 26px; margin-bottom: 8px; }
.modal .modal-body { margin: 0 0 16px; }
.modal .modal-body p { margin: 0 0 10px; }
.modal-actions { display: grid; gap: 10px; }
body.modal-open { overflow: hidden; }
body.typing .tabbar { display: none; }
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/dashboard">Application Tracker</a>
  <a class="data-link" href="#/data" data-tab="data">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></svg>
    Backup
  </a>
</header>

<main id="app" tabindex="-1"></main>

<nav class="tabbar" aria-label="Main">
  <a href="#/dashboard" data-tab="dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
    Today
  </a>

<script>
(function () {
  'use strict';

  /* ---------- Constants ---------- */
  var STORAGE_KEY = 'pdtracker.data';
  var UI_KEY = 'pdtracker.ui';
  var SCHEMA_VERSION = 1;
  var PIPELINE = ['Researching', 'Applied', 'Written Test', 'PT Test', 'Oral Board', 'Background', 'Polygraph/Psych', 'Medical', 'Conditional Offer', 'Hired'];
  var TERMINAL = ['Rejected', 'Withdrawn', 'On Hold'];
  var STATUSES = PIPELINE.concat(TERMINAL);
  var CLOSED = ['Rejected', 'Withdrawn'];
  // Not "active": excluded from overdue/upcoming/stale.
  var INACTIVE = ['Hired', 'Rejected', 'Withdrawn', 'On Hold'];
  var TYPES = ['Cadet Sponsorship', 'Entry-Level Hire', 'Civil Service List', 'Other'];
  var PRIORITIES = ['High', 'Med', 'Low'];
  var TUITION = ['Unknown', 'Yes', 'No'];
  var DEFAULT_DOCS = ['Resume', 'Cover letter', 'Transcripts', "Driver's license", 'Birth certificate', 'References', 'PHQ/background packet'];
  var DAY = 86400000;
  var STALE_DAYS = 14;
  var UPCOMING_DAYS = 14;
  var BACKUP_NUDGE_DAYS = 7;
  var LOG_PREVIEW = 3;

  var F = {
    name: { label: 'Department name', type: 'text', required: true, wide: true, placeholder: 'e.g. Warwick Township PD' },
    municipality: { label: 'Municipality', type: 'text' },
    county: { label: 'County', type: 'text', list: 'county-list' },
    url: { label: 'Website / job posting URL', type: 'url', wide: true, placeholder: 'https://', autocap: 'none' },
    appType: { label: 'Application type', type: 'select', options: TYPES },
    priority: { label: 'Priority', type: 'select', options: PRIORITIES },
    status: { label: 'Stage', type: 'select', options: STATUSES },
    dateApplied: { label: 'Date applied', type: 'date' },
    deadline: { label: 'Application deadline', type: 'date' },
    nextStepDate: { label: 'By when?', type: 'date' },
    nextStepDesc: { label: 'What needs to happen?', type: 'text', wide: true, placeholder: 'e.g. Oral board at HQ, 9:00 AM' },
    'contact.name': { label: 'Contact name', type: 'text', autocomplete: 'off' },
    'contact.title': { label: 'Title', type: 'text', placeholder: 'e.g. Sgt., Chief, HR' },
    'contact.phone': { label: 'Phone', type: 'tel' },
    'contact.email': { label: 'Email', type: 'email', autocap: 'none' },
    salary: { label: 'Starting salary', type: 'text', placeholder: 'e.g. $62,000' },
    tuitionCovered: { label: 'Sponsorship covers tuition', type: 'select', options: TUITION },
    payNotes: { label: 'Pay / benefits notes', type: 'textarea', wide: true },
    listRank: { label: 'Civil service list rank', type: 'number', placeholder: 'Optional' }
  };

  // The Add form leads with these; everything else sits under "More details".
  var QUICK_FIELDS = ['name', 'appType', 'status', 'nextStepDesc', 'nextStepDate'];
  var FORM_GROUPS = [
    { title: 'Department', fields: ['municipality', 'county', 'url', 'priority', 'listRank'] },
    { title: 'Key dates', fields: ['dateApplied', 'deadline'] },
    { title: 'Contact', fields: ['contact.name', 'contact.title', 'contact.phone', 'contact.email'] },
    { title: 'Pay & benefits', fields: ['salary', 'tuitionCovered', 'payNotes'] }
  ];

  var ICONS = {
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>',
    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
    link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>'
  };

  /* ---------- Utilities ---------- */
  function uid() {
    if (window.crypto && crypto.randomUUID) { try { return crypto.randomUUID(); } catch (e) { /* insecure context */ } }
    return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function dateToStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayStr() { return dateToStr(new Date()); }
  function nowISO() { return new Date().toISOString(); }
  function isDateStr(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function parseDate(s) {
    if (!isDateStr(s)) return null;
    var p = s.split('-').map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }
  function daysUntil(s) {
    var d = parseDate(s);
    if (!d) return null;
    return Math.round((d - parseDate(todayStr())) / DAY);
  }
  function daysSince(ts) { return Math.floor((Date.now() - ts) / DAY); }
  function fmtDate(s, withYear) {
    var d = parseDate(s);
    if (!d) return '';
    var opts = { weekday: 'short', month: 'short', day: 'numeric' };
    if (withYear || d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
    return d.toLocaleDateString(undefined, opts);
  }
  function fmtTimestamp(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return 'unknown';
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  function relDays(n) {
    if (n === null || n === undefined) return '';
    if (n === 0) return 'Today';
    if (n === 1) return 'Tomorrow';
    if (n === -1) return 'Yesterday';
    return n > 0 ? 'In ' + n + ' days' : Math.abs(n) + ' days ago';
  }
  function relAgo(ts) {
    var n = daysSince(ts);
    if (n <= 0) return 'today';
    if (n === 1) return 'yesterday';
    return n + ' days ago';
  }
  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {

    });
  }
  function slug(s) { return String(s).toLowerCase().replace(/[^a-z]+/g, '-').replace(/^-|-$/g, ''); }
  function getPath(o, path) { return path.split('.').reduce(function (a, k) { return a == null ? undefined : a[k]; }, o); }
  function setPath(o, path, v) {
    var keys = path.split('.'), last = keys.pop();
    var t = keys.reduce(function (a, k) { if (a[k] == null || typeof a[k] !== 'object') a[k] = {}; return a[k]; }, o);
    t[last] = v;
  }
  function str(v) { return v === null || v === undefined ? '' : String(v); }
  function countyLabel(c) {
    c = str(c).trim();
    if (!c) return '';
    return /county|co\.?$/i.test(c) || /^philadelphia$/i.test(c) ? c : c + ' County';
  }
  function prioRank(p) { var i = PRIORITIES.indexOf(p); return i < 0 ? 9 : i; }
  function statusBadge(s) { return '<span class="badge s-' + slug(s) + '">' + esc(s) + '</span>'; }
  function prioBadge(p) { return p === 'High' ? '<span class="prio">High priority</span>' : ''; }
  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }
  function whenText(n) { return n < 0 ? plural(-n, 'day') + ' overdue' : relDays(n); }
  function ticksHTML(d, mini) {
    var idx = PIPELINE.indexOf(d.status);
    if (idx < 0) return '';
    return '<div class="ticks' + (mini ? ' mini' : '') + '" aria-hidden="true">' +
      PIPELINE.map(function (s, i) { return '<i' + (i <= idx ? ' class="on"' : '') + '></i>'; }).join('') + '</div>';
  }
  function isActive(d) { return INACTIVE.indexOf(d.status) === -1; }

  /* ---------- Data model ---------- */
  function makeDoc(label, custom) { return { id: uid(), label: label, done: false, custom: !!custom }; }
  function makeNote(date, text, auto) {
    var t = nowISO();
    return { id: uid(), date: isDateStr(date) ? date : todayStr(), text: text, auto: !!auto, createdAt: t, updatedAt: t };
  }
  function blankDept() {
    var t = nowISO();
    return {
      id: uid(), name: '', municipality: '', county: '', url: '',
      appType: 'Cadet Sponsorship', status: 'Researching', priority: 'Med',
      dateApplied: '', deadline: '', nextStepDate: '', nextStepDesc: '',
      contact: { name: '', title: '', phone: '', email: '' },
      salary: '', tuitionCovered: 'Unknown', payNotes: '', listRank: '',
      documents: DEFAULT_DOCS.map(function (l) { return makeDoc(l, false); }),
      notes: [], createdAt: t, updatedAt: t
    };
  }
  // Fill in any missing/invalid fields without discarding unknown ones (keeps data from newer versions intact).
  function normalizeDept(raw) {
    var b = blankDept();
    var d = Object.assign({}, b, raw && typeof raw === 'object' ? raw : {});
    d.contact = Object.assign({}, b.contact, raw && raw.contact && typeof raw.contact === 'object' ? raw.contact : {});
    if (!d.id) d.id = uid();
    ['name', 'municipality', 'county', 'url', 'nextStepDesc', 'salary', 'payNotes'].forEach(function (k) { d[k] = str(d[k]); });
    ['name', 'title', 'phone', 'email'].forEach(function (k) { d.contact[k] = str(d.contact[k]); });
    ['dateApplied', 'deadline', 'nextStepDate'].forEach(function (k) { if (!isDateStr(d[k])) d[k] = ''; });
    if (STATUSES.indexOf(d.status) === -1) d.status = 'Researching';
    if (TYPES.indexOf(d.appType) === -1) d.appType = 'Other';
    if (PRIORITIES.indexOf(d.priority) === -1) d.priority = 'Med';
    if (TUITION.indexOf(d.tuitionCovered) === -1) d.tuitionCovered = 'Unknown';
    var rank = Number(d.listRank);
    d.listRank = d.listRank === '' || d.listRank == null || !Number.isFinite(rank) ? '' : rank;
    d.documents = Array.isArray(raw && raw.documents)
      ? raw.documents.filter(function (x) { return x && str(x.label).trim(); }).map(function (x) {
          return { id: x.id || uid(), label: str(x.label).trim(), done: !!x.done, custom: !!x.custom };
        })
      : b.documents;
    d.notes = Array.isArray(raw && raw.notes)
      ? raw.notes.filter(function (n) { return n && typeof n.text === 'string'; }).map(function (n) {
          var c = n.createdAt || n.updatedAt || nowISO();
          return {
            id: n.id || uid(), date: isDateStr(n.date) ? n.date : dateToStr(new Date(c)),
            text: n.text, auto: !!n.auto, createdAt: c, updatedAt: n.updatedAt || c
          };
        })
      : [];
    if (isNaN(new Date(d.createdAt))) d.createdAt = nowISO();
    if (isNaN(new Date(d.updatedAt))) d.updatedAt = d.createdAt;
    return d;
  }

  // Each migration takes data at version N and returns data at version N+1.
  // To change the schema later: bump SCHEMA_VERSION and add MIGRATIONS[oldVersion].
  var MIGRATIONS = {
    0: function (raw) {
      // v0: an unversioned bare array of department records.
      return { departments: Array.isArray(raw) ? raw : (raw && raw.departments) || [], meta: (raw && raw.meta) || {} };
    }
  };
  function schemaVersionOf(raw) { return Array.isArray(raw) ? 0 : Number(raw && raw.schemaVersion) || 0; }
  function migrate(raw) {
    var v = schemaVersionOf(raw);
    if (v > SCHEMA_VERSION) {

    }
    var data = raw;
    while (v < SCHEMA_VERSION) {
      if (!MIGRATIONS[v]) throw new Error('No migration from schema ' + v + '.');
      data = MIGRATIONS[v](data);
      v++;
      data.schemaVersion = v;
    }
    if (!Array.isArray(data.departments)) throw new Error('No departments list found.');
    return {
      schemaVersion: SCHEMA_VERSION,
      departments: data.departments.map(normalizeDept),
      meta: Object.assign({ lastBackup: null, seeded: false, createdAt: nowISO() }, data.meta || {})
    };
  }
  function seedData() {
    var d = blankDept();
    Object.assign(d, {
      name: 'Warwick Township PD', municipality: 'Warwick Township', county: 'Bucks',
      appType: 'Cadet Sponsorship', status: 'Applied', priority: 'High'
    });
    d.notes.push(makeNote(todayStr(), 'Department reached out; phone call scheduled (Oct 2026).', false));
    return { schemaVersion: SCHEMA_VERSION, departments: [d], meta: { lastBackup: null, seeded: true, createdAt: nowISO() } };
  }

  /* ---------- Storage ---------- */
  var data = null;
  var loadError = null;
  var rawStored = null;

  function load() {
    try {
      rawStored = localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      loadError = 'This browser is blocking local storage, so nothing can be saved. Turn off private browsing or allow site data.';
      data = seedData();
      return;
    }
    if (rawStored === null) { data = seedData(); save(); return; }
    try {
      var parsed = JSON.parse(rawStored);
      var before = schemaVersionOf(parsed);
      data = migrate(parsed);
      if (before < SCHEMA_VERSION) {
        // Keep the pre-migration copy so an upgrade can never lose data.
        try { localStorage.setItem(STORAGE_KEY + '.pre-v' + SCHEMA_VERSION, rawStored); } catch (e) { /* ignore */ }
        save();
      }
    } catch (e) {
      loadError = 'Saved data could not be read: ' + e.message;
      data = null;
    }
  }
  function save() {
    if (!data) return false;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      toast('Could not save. Device storage may be full. Download a backup now.', true);
      return false;
    }
  }
  function touch(d) { d.updatedAt = nowISO(); }
  function getDept(id) { return data.departments.find(function (d) { return d.id === id; }); }
  function lastActivity(d) {
    var t = new Date(d.updatedAt).getTime() || 0;
    d.notes.forEach(function (n) {
      var nd = parseDate(n.date);
      if (nd && nd.getTime() > t) t = nd.getTime();
    });
    return t;
  }
  function sortedNotes(d) {
    return d.notes.slice().sort(function (a, b) {
      return b.date.localeCompare(a.date) || str(b.createdAt).localeCompare(str(a.createdAt));
    });
  }
  function changeStatus(d, to) {
    var from = d.status;
    if (from === to) return { changed: false };
    d.status = to;
    var autoApplied = false;
    if (to === 'Applied' && !d.dateApplied) { d.dateApplied = todayStr(); autoApplied = true; }
    d.notes.push(makeNote(todayStr(), 'Status: ' + from + ' → ' + to, true));
    touch(d);
    return { changed: true, autoApplied: autoApplied };
  }

  /* ---------- UI prefs (per device) ---------- */
  var UI_DEFAULTS = { q: '', status: '', type: '', county: '', priority: '', sort: 'next', hideClosed: true, installDismissed: false };
  var ui = Object.assign({}, UI_DEFAULTS);
  try { Object.assign(ui, JSON.parse(localStorage.getItem(UI_KEY) || '{}')); } catch (e) { /* ignore */ }
  function saveUI() { try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch (e) { /* ignore */ } }

  // Unsent note text per department, so a half-typed note survives the phone closing the app.
  var DRAFTS_KEY = 'pdtracker.drafts';
  function readDrafts() { try { return JSON.parse(localStorage.getItem(DRAFTS_KEY) || '{}') || {}; } catch (e) { return {}; } }
  function getDraft(id) { var v = readDrafts()[id]; return typeof v === 'string' ? v : ''; }
  function setDraft(id, text) {
    var all = readDrafts();
    if (text) all[id] = text; else delete all[id];
    try { localStorage.setItem(DRAFTS_KEY, JSON.stringify(all)); } catch (e) { /* ignore */ }
  }

  /* ---------- Toast + modal ---------- */
  var toastTimer, undoFn = null;
  function hideToast() {
    var el = document.getElementById('toast');
    el.className = el.className.indexOf('error') !== -1 ? 'toast error' : 'toast';
    undoFn = null;
  }
  function toast(msg, isError, undo) {
    var el = document.getElementById('toast');
    el.textContent = msg;
    undoFn = undo || null;
    if (undo) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'toast-undo'; b.dataset.action = 'undo'; b.textContent = 'Undo';
      el.appendChild(b);
    }
    el.className = 'toast show' + (isError ? ' error' : '') + (undo ? ' has-action' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, isError ? 4500 : undo ? 7000 : 2200);
  }
  // Returns a function that puts a department back exactly as it is right now.
  function snapshot(d) {
    var id = d.id, before = JSON.stringify(d);
    return function () {
      var i = data.departments.findIndex(function (x) { return x.id === id; });
      if (i < 0) return;
      data.departments[i] = JSON.parse(before);
      if (save()) toast('Undone');
      var y = window.scrollY;
      render();
      window.scrollTo(0, y);
    };
  }
  // buttons: [{label, value, kind: 'primary'|'danger'|''}]
  var closeOpenModal = null;
  function dismissModal() { if (closeOpenModal) closeOpenModal(null); }
  function modal(opts) {
    dismissModal();
    return new Promise(function (resolve) {
      var root = document.getElementById('modal-root');
      var prevFocus = document.activeElement;
      root.innerHTML =
        '<div class="modal-backdrop" data-modal-backdrop>' +
          '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
            '<h2 id="modal-title">' + esc(opts.title) + '</h2>' +
            '<div class="modal-body">' + opts.body + '</div>' +
            '<div class="modal-actions">' +
              opts.buttons.map(function (b, i) {
                var cls = b.kind === 'primary' ? 'btn-primary' : b.kind === 'danger' ? 'btn-danger-solid' : '';
                return '<button type="button" class="btn ' + cls + '" data-modal-btn="' + i + '">' + esc(b.label) + '</button>';
              }).join('') +
            '</div>' +
          '</div>' +
        '</div>';
      var backdrop = root.firstChild;
      function done(v) {
        if (closeOpenModal !== done) return;
        closeOpenModal = null;
        document.removeEventListener('keydown', onKey, true);
        document.body.classList.remove('modal-open');
        root.innerHTML = '';
        if (prevFocus && prevFocus.focus && document.contains(prevFocus)) prevFocus.focus();
        resolve(v);
      }
      function onKey(e) {
        if (e.key === 'Escape') { e.preventDefault(); done(null); }
        if (e.key === 'Tab') {
          var btns = backdrop.querySelectorAll('button');
          var first = btns[0], last = btns[btns.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      }

        var b = e.target.closest('[data-modal-btn]');
        if (b) done(opts.buttons[Number(b.dataset.modalBtn)].value);
        else if (e.target === backdrop) done(null);
      });
      document.addEventListener('keydown', onKey, true);
      document.body.classList.add('modal-open');
      closeOpenModal = done;
      backdrop.querySelector('button').focus();
    });
  }
  function confirmModal(title, body, okLabel, danger) {
    return modal({
      title: title, body: body,
      buttons: [{ label: okLabel, value: true, kind: danger ? 'danger' : 'primary' }, { label: 'Cancel', value: false }]
    }).then(function (v) { return v === true; });
  }

  /* ---------- Routing ---------- */
  var app = document.getElementById('app');
  var state = { view: '', id: null, editingNote: null, openSecs: {}, listScroll: 0, navCount: 0, formDirty: false, saving: false, renderDay: '', pendingInline: null, notesAll: false };

  function parseHash() {
    var parts = location.hash.replace(/^#\/?/, '').split('/');
    var id = null;
    try { id = parts[1] ? decodeURIComponent(parts[1]) : null; } catch (e) { /* malformed link */ }
    return { view: parts[0] || 'dashboard', id: id };
  }
  // replace=true swaps the current history entry, so Back skips a submitted form or a deleted department.
  function go(hash, replace) {
    if (location.hash === hash) return route();
    if (replace) location.replace(hash); else location.hash = hash;
  }
  // Save a detail field the user is still typing in (it would otherwise be lost on Back or app switch).
  function flushActiveField() {
    var el = state.pendingInline;
    state.pendingInline = null;
    if (data && state.view === 'dept' && el && document.contains(el)) onInlineChange(el, true);
  }
  function route() {
    flushActiveField();
    dismissModal();
    var r = parseHash();
    var prevView = state.view;
    if (prevView === 'list') state.listScroll = window.scrollY;
    if (r.view !== 'dept' || r.id !== state.id) { state.editingNote = null; state.notesAll = false; }
    state.view = r.view; state.id = r.id; state.navCount++;
    state.formDirty = false; state.saving = false;
    var tab = r.view === 'dept' || r.view === 'edit' ? 'list' : r.view;
    document.querySelectorAll('[data-tab]').forEach(function (a) {
      if (a.dataset.tab === tab) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    render();
    if (r.view === 'list' && prevView !== 'list') window.scrollTo(0, state.listScroll);
    else if (prevView !== r.view || r.view === 'dept') window.scrollTo(0, 0);
  }
  function render() {
    state.renderDay = todayStr();
    // Some browsers skip focusout when the focused field is removed; never leave the tab bar hidden.
    document.body.classList.remove('typing');
    if (!data) return renderLoadError();
    switch (state.view) {
      case 'list': return renderList();
      case 'add': return renderForm(null);
      case 'edit': return renderForm(state.id);

        items.push({ d: d, group: 'plan', label: 'No next step set', detail: d.status + '. ' + last });

  /* ---------- Data / backup ---------- */
  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = filename; a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  }
  function backupPayload() {
    return JSON.stringify({
      app: 'pd-tracker', schemaVersion: SCHEMA_VERSION, exportedAt: nowISO(),
      meta: data.meta, departments: data.departments
    }, null, 2);
  }
  function backupFilename() { return 'pd-tracker-backup-' + todayStr() + '.json'; }
  function markBackedUp() {
    data.meta.lastBackup = nowISO();
    save();
    if (state.view === 'dashboard' || state.view === 'data') render();
  }
  function isStandalone() {
    return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  }
  // Home-screen apps (especially on iPhone) can't reliably download files, so there we open the
  // share sheet ("Save to Files", email, Drive). Resolves to 'downloaded', 'shared' or 'cancelled'.
  function saveFile(text, filename, type) {
    function download() { downloadBlob(new Blob([text], { type: type }), filename); return 'downloaded'; }
    if (isStandalone() && navigator.share && navigator.canShare) {
      var file = new File([text], filename, { type: type });
      var ok = false;
      try { ok = navigator.canShare({ files: [file] }); } catch (e) { /* unsupported */ }
      if (ok) {
        return navigator.share({ files: [file], title: filename }).then(function () { return 'shared'; }, function (e) {
          return e && e.name === 'AbortError' ? 'cancelled' : download();
        });
      }
    }
    return Promise.resolve(download());
  }
  function exportJSON() {
    var name = backupFilename();
    saveFile(backupPayload(), name, 'application/json').then(function (r) {
      if (r === 'cancelled') return;
      markBackedUp();
      toast(r === 'shared' ? 'Backup saved' : 'Backup downloaded: ' + name);
    });
  }
  function canShareFiles() {
    try {
      return !!(navigator.canShare && navigator.canShare({ files: [new File(['{}'], 'x.json', { type: 'application/json' })] }));
    } catch (e) { return false; }
  }
  function shareJSON() {
    var file = new File([backupPayload()], backupFilename(), { type: 'application/json' });
    navigator.share({ files: [file], title: 'PD Tracker backup' }).then(function () {
      markBackedUp();
      toast('Backup shared');
    }).catch(function (e) {
      if (e && e.name === 'AbortError') return;
      toast('Sharing failed. Use Download instead.', true);
    });
  }
  function csvCell(v) {
    var s = str(v);
    if (/^[=+\-@]/.test(s)) s = ' ' + s; // keep Excel from treating text as a formula
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function exportCSV() {
    var cols = [
      ['Department', 'name'], ['Municipality', 'municipality'], ['County', 'county'], ['Website', 'url'],
      ['Application Type', 'appType'], ['Status', 'status'], ['Priority', 'priority'],
      ['Date Applied', 'dateApplied'], ['Application Deadline', 'deadline'], ['Next Step Date', 'nextStepDate'], ['Next Step', 'nextStepDesc'],
      ['Contact Name', 'contact.name'], ['Contact Title', 'contact.title'], ['Contact Phone', 'contact.phone'], ['Contact Email', 'contact.email'],
      ['Starting Salary', 'salary'], ['Sponsorship Covers Tuition', 'tuitionCovered'], ['Pay Notes', 'payNotes'], ['Civil Service Rank', 'listRank']
    ];
    var header = cols.map(function (c) { return c[0]; }).concat(['Documents Ready', 'Documents Outstanding', 'Notes (newest first)', 'Created', 'Updated']);
    var rows = data.departments.slice().sort(byName).map(function (d) {
      var r = cols.map(function (c) { return getPath(d, c[1]); });
      r.push(d.documents.filter(function (x) { return x.done; }).map(function (x) { return x.label; }).join('; '));
      r.push(d.documents.filter(function (x) { return !x.done; }).map(function (x) { return x.label; }).join('; '));
      r.push(sortedNotes(d).map(function (n) { return n.date + ': ' + n.text.replace(/\s*[\r\n]+\s*/g, ' '); }).join(' | '));
      r.push(d.createdAt, d.updatedAt);
      return r;
    });
    var csv = '﻿' + [header].concat(rows).map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
    saveFile(csv, 'pd-tracker-' + todayStr() + '.csv', 'text/csv').then(function (r) {
      if (r !== 'cancelled') toast(r === 'shared' ? 'CSV saved' : 'CSV downloaded');
    });
  }
  function mergeInto(current, incoming) {
    var stats = { added: 0, updated: 0, unchanged: 0 };
    var byId = Object.create(null);
    current.forEach(function (d, i) { byId[d.id] = i; });
    incoming.forEach(function (inc) {
      if (byId[inc.id] === undefined) { current.push(inc); byId[inc.id] = current.length - 1; stats.added++; return; }
      var cur = current[byId[inc.id]];
      var incNewer = new Date(inc.updatedAt) > new Date(cur.updatedAt);
      var base = incNewer ? inc : cur;
      // Keep notes from both copies; for the same note, the more recently edited version wins.
      var notes = Object.create(null);
      cur.notes.concat(inc.notes).forEach(function (n) {
        if (!notes[n.id] || new Date(n.updatedAt) > new Date(notes[n.id].updatedAt)) notes[n.id] = n;
      });
      var merged = Object.assign({}, base, { notes: Object.keys(notes).map(function (k) { return notes[k]; }) });
      if (JSON.stringify(merged) === JSON.stringify(cur)) { stats.unchanged++; return; }
      current[byId[inc.id]] = merged;
      stats.updated++;

    return stats;
  }
  function importFile(file) {
    if (!file) return;

      if (!parsed || (!Array.isArray(parsed) && !Array.isArray(parsed.departments))) throw new Error('That file does not look like a PD Tracker backup.');
      incoming = migrate(parsed);
      var n = incoming.departments.length, m = data.departments.length;
      var when = parsed.exportedAt ? ' exported ' + esc(fmtTimestamp(parsed.exportedAt)) : '';
      return modal({
        title: 'Import backup',
        body: '<p>The file has <strong>' + n + ' department' + (n === 1 ? '' : 's') + '</strong>' + when + '. You currently have <strong>' + m + '</strong>.</p>' +
          '<p><strong>Merge:</strong> adds new departments and updates ones in both (most recent edit wins; notes from both are kept).</p>' +
          '<p><strong>Replace:</strong> deletes everything in the app now and uses the file instead.</p>',

      }).then(function (choice) {

          : '<p>Merge <strong>' + n + '</strong> department' + (n === 1 ? '' : 's') + ' from the file into your current <strong>' + m + '</strong>?</p>';
        return confirmModal(choice === 'replace' ? 'Replace all data?' : 'Merge data?', body, choice === 'replace' ? 'Yes, replace' : 'Yes, merge', choice === 'replace')
          .then(function (ok) {
            if (!ok) return;
            try { localStorage.setItem(STORAGE_KEY + '.before-import', JSON.stringify(data)); } catch (e) { /* ignore */ }
            var msg;
            if (choice === 'replace') {
              data.departments = incoming.departments;

            } else {
              var st = mergeInto(data.departments, incoming.departments);

            }

          });

    }).catch(function (e) {

    });
  }

    app.innerHTML = '<section class="card alert-card"><h2>Saved data could not be loaded</h2><p>' + esc(loadError) + '</p>' +
      '<p class="muted small">Nothing has been deleted. Download the raw data so it is not lost, then reload or update the app.</p>' +
      (rawStored ? '<div class="stack"><button type="button" class="btn btn-primary btn-block" data-action="download-raw">Download raw saved data</button>' +
        '<button type="button" class="btn btn-danger btn-block" data-action="start-over">Start over (keeps a copy)</button></div>' : '') +
      '</section>';
  }

  /* ---------- Events ---------- */
  var actions = {
    'export-json': exportJSON,
    'share-json': shareJSON,
    'export-csv': exportCSV,
    'download-raw': function () { saveFile(rawStored, 'pd-tracker-raw-' + todayStr() + '.json', 'application/json'); },
    'start-over': function () {
      confirmModal('Start over?', '<p>The unreadable data stays saved on this device under a separate name, and the app starts fresh. Download it first if you want to keep it somewhere else.</p>', 'Start over', true)
        .then(function (ok) {
          if (!ok) return;
          try { localStorage.setItem(STORAGE_KEY + '.unreadable-' + Date.now(), rawStored); } catch (e) {
            toast('Could not keep a copy (storage full). Download the raw data first.', true);
            return;
          }
          data = seedData();
          loadError = null;
          save();
          go('#/dashboard', true);
        });
    },
    'filter-status': function (el) {
      Object.assign(ui, { status: el.dataset.status, type: '', county: '', priority: '', q: '' });
      saveUI();
      go('#/list');
    },
    'undo': function () {
      var f = undoFn;
      clearTimeout(toastTimer);
      hideToast();
      if (f) f();
    },
    'dismiss-install': function () {
      ui.installDismissed = true;
      saveUI();
      render();
    },
    'show-closed': function () {
      ui.hideClosed = false;
      saveUI();
      renderList();
    },
    'set-stage': function (el) {
      flushActiveField();
      var d = getDept(state.id);
      if (!d) return;
      var undo = snapshot(d);
      var res = changeStatus(d, el.dataset.status);
      if (!res.changed) return;
      save();
      var y = window.scrollY;
      renderDetail();
      window.scrollTo(0, y);
      toast(res.autoApplied ? 'Moved to Applied. Date applied set to today.' : 'Moved to ' + d.status + '.', false, undo);
    },
    'next-in': function (el) {
      var input = document.getElementById('i-nextStepDate');
      if (!input) return;
      var dt = new Date();
      dt.setDate(dt.getDate() + Number(el.dataset.days));
      input.value = dateToStr(dt);
      onInlineChange(input);
    },
    'step-done': function () {
      flushActiveField();
      var d = getDept(state.id);
      if (!d || !(d.nextStepDesc || d.nextStepDate)) return;
      var undo = snapshot(d);
      d.notes.push(makeNote(todayStr(), 'Done: ' + (d.nextStepDesc || 'Next step'), false));
      d.nextStepDesc = ''; d.nextStepDate = '';
      touch(d);
      save();
      var y = window.scrollY;
      renderDetail();
      window.scrollTo(0, y);
      toast('Logged as done. What is next?', false, undo);
      // On phones the keyboard would cover the Undo button, so only jump to the field with a mouse and keyboard.
      if (!coarse) document.getElementById('i-nextStepDesc').focus({ preventScroll: true });
    },
    'notes-all': function () {
      state.notesAll = true;
      renderNotes(getDept(state.id));
    },
    'clear-filters': function () {
      Object.assign(ui, { q: '', status: '', type: '', county: '', priority: '' });
      saveUI();
      renderList();
    },
    'back': function () {
      if (state.navCount > 1 && history.length > 1) history.back(); else go('#/list');
    },
    'cancel-form': function () {
      confirmDiscard().then(function (ok) {
        if (!ok) return;
        state.formDirty = false;
        if (state.view === 'edit') go('#/dept/' + encodeURIComponent(state.id), true);
        else if (state.navCount > 1 && history.length > 1) history.back();
        else go('#/dashboard', true);
      });
    },
    'delete-dept': function () {
      var d = getDept(state.id);
      if (!d) return;
      confirmModal('Delete department?', '<p>Delete <strong>' + esc(d.name) + '</strong> along with its ' + d.notes.length + ' note' + (d.notes.length === 1 ? '' : 's') +
        ' and document checklist?</p><p>This cannot be undone. Download a backup first if you are not sure.</p>', 'Delete', true)
        .then(function (ok) {
          if (!ok) return;
          data.departments = data.departments.filter(function (x) { return x.id !== d.id; });
          setDraft(d.id, '');
          if (save()) toast('Deleted ' + d.name);
          go('#/list', true);
        });
    },
    'note-edit': function (el) {
      state.editingNote = el.dataset.id;
      renderNotes(getDept(state.id), '#ne-text');
    },
    'note-cancel': function () {
      state.editingNote = null;
      renderNotes(getDept(state.id));
    },
    'note-delete': function (el) {
      var d = getDept(state.id);
      var n = d && d.notes.find(function (x) { return x.id === el.dataset.id; });
      if (!n) return;
      var preview = n.text.length > 120 ? n.text.slice(0, 120) + '...' : n.text;
      confirmModal('Delete note?', '<p><strong>' + esc(fmtDate(n.date, true)) + '</strong>: ' + esc(preview) + '</p>', 'Delete note', true).then(function (ok) {
        if (!ok) return;
        d.notes = d.notes.filter(function (x) { return x.id !== n.id; });
        touch(d);
        if (save()) toast('Note deleted');
        renderNotes(d);
        refreshDetailChrome(d);
      });
    },
    'doc-remove': function (el) {
      var d = getDept(state.id);
      d.documents = d.documents.filter(function (x) { return x.id !== el.dataset.id; });
      touch(d);
      if (save()) toast('Removed');
      renderDocs(d);
      refreshDetailChrome(d);
    }
  };

  document.addEventListener('click', function (e) {
    // Leaving the add/edit form by a link or tab: confirm if there are unsaved changes.
    var link = e.target.closest('a[href^="#"]');
    if (link && state.formDirty && (state.view === 'add' || state.view === 'edit')) {
      e.preventDefault();
      confirmDiscard().then(function (ok) {
        if (ok) { state.formDirty = false; go(link.getAttribute('href')); }
      });
      return;
    }
    var el = e.target.closest('[data-action]');
    if (!el || !actions[el.dataset.action]) return;
    e.preventDefault();
    actions[el.dataset.action](el, e);
  });

  document.addEventListener('submit', function (e) {
    var form = e.target;
    e.preventDefault();
    var d = getDept(state.id);
    if (form.id === 'dept-form') return submitForm(form);
    if (form.id === 'note-add' && d) {
      var ta = form.querySelector('#note-text');
      var text = ta.value.trim();
      if (!text) { toast('Type a note first.', true); ta.focus(); return; }
      var date = form.querySelector('#note-date').value;
      d.notes.push(makeNote(isDateStr(date) ? date : todayStr(), text, false));
      touch(d);
      if (save()) toast('Note added');
      setDraft(d.id, '');
      ta.value = '';
      form.querySelector('#note-date').value = todayStr();
      renderNotes(d);
      refreshDetailChrome(d);
      return;
    }
    if (form.classList.contains('note-edit') && d) {
      var n = d.notes.find(function (x) { return x.id === form.dataset.id; });
      var t = form.querySelector('[name=text]').value.trim();
      if (!t) { toast('A note cannot be empty. Use Delete to remove it.', true); return; }
      var nd = form.querySelector('[name=date]').value;
      n.text = t;
      if (isDateStr(nd)) n.date = nd;
      n.updatedAt = nowISO();
      touch(d);
      state.editingNote = null;
      if (save()) toast('Note updated');
      renderNotes(d);
      refreshDetailChrome(d);
      return;
    }
    if (form.id === 'doc-add' && d) {
      var inp = form.querySelector('#doc-new');
      var label = inp.value.trim();
      if (!label) { inp.focus(); return; }
      d.documents.push(makeDoc(label, true));
      touch(d);
      if (save()) toast('Document added');
      renderDocs(d, true);
      refreshDetailChrome(d);
    }
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.matches('[data-inline]')) return onInlineChange(el);
    if (el.matches('[data-doc]')) {
      var d = getDept(state.id);
      var doc = d && d.documents.find(function (x) { return x.id === el.dataset.doc; });
      if (!doc) return;
      doc.done = el.checked;
      touch(d);
      save();
      el.nextElementSibling.className = doc.done ? 'done-label' : '';
      document.getElementById('docs-count').textContent = docsCountText(d);
      refreshDetailChrome(d);
      return;
    }
    if (el.matches('[data-ui]')) {
      var k = el.dataset.ui;
      ui[k] = el.type === 'checkbox' ? el.checked : el.value;
      saveUI();
      renderListResults();
      return;
    }
    if (el.id === 'import-file') {
      importFile(el.files && el.files[0]);
      el.value = '';
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'search') { ui.q = e.target.value; saveUI(); renderListResults(); }
    if (e.target.id === 'note-text' && state.view === 'dept') setDraft(state.id, e.target.value);
    if (e.target.matches('[data-inline]')) state.pendingInline = e.target;
    if (e.target.closest('#dept-form')) state.formDirty = true;
    if (e.target.matches('#dept-form [aria-invalid="true"]')) setFieldError(e.target, null);
  });

  // Remember which detail sections are expanded ("toggle" does not bubble, so capture it).
  document.addEventListener('toggle', function (e) {
    var sec = e.target.dataset && e.target.dataset.sec;
    if (sec) state.openSecs[sec] = e.target.open;
  }, true);

  // Ctrl/Cmd+Enter submits a note.
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.matches('#note-text, #ne-text')) {
      e.preventDefault();
      var btn = e.target.form.querySelector('[type=submit]');
      if (btn) btn.click();
    }
  });

  // On touch devices, hide the tab bar while typing so it doesn't sit on top of the keyboard.
  var coarse = window.matchMedia && matchMedia('(pointer: coarse)').matches;
  function isTextEntry(el) {
    return el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && !/^(checkbox|radio|file|button|submit)$/.test(el.type)));
  }
  document.addEventListener('focusin', function (e) { if (coarse && isTextEntry(e.target)) document.body.classList.add('typing'); });
  document.addEventListener('focusout', function () { document.body.classList.remove('typing'); });

  // Phones suspend or kill a backgrounded web app: save the field being edited first.
  // When it comes back on a new day, redraw so "today" and day counts are current.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') { flushActiveField(); return; }
    if (data && state.renderDay !== todayStr() && !isTextEntry(document.activeElement) && !closeOpenModal) {
      var y = window.scrollY;
      render();
      window.scrollTo(0, y);
    }
  });
  window.addEventListener('pagehide', flushActiveField);

  // Keep two open tabs/windows from overwriting each other's changes.
  window.addEventListener('storage', function (e) {
    if (e.key !== STORAGE_KEY || e.newValue === null) return;
    try { data = migrate(JSON.parse(e.newValue)); loadError = null; } catch (err) { return; }
    if (!isTextEntry(document.activeElement) && !closeOpenModal) render();
  });

  /* ---------- Boot ---------- */
  load();
  if (loadError && data) toast(loadError, true);
  window.addEventListener('hashchange', route);
  route();

  // Ask the browser not to evict our storage under pressure.
  if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
