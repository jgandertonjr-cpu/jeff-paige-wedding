"During a production outage at Proconex, I had to decide whether to roll back a change we'd made the night before — without knowing for certain that it was the cause. Every hour we were down, orders weren't shipping, so waiting for perfect information wasn't really an option. So I gathered what I could, quickly. I compared when the errors started to when the change went in. I checked the logs, and I checked what else had changed. Everything pointed to that change. I explained my reasoning to my manager in about two minutes — here's what I know, here's what I don't, here's what I want to do and why — and then I rolled it back. The system recovered, and later we confirmed the change was the cause. What I took from it is that you almost never get all the facts before you have to act. Policing is like that too, just faster. You act on the best information you have, you explain your reasoning, and you stay ready to adjust if new facts come in.",
["Paralysis.", "Recklessness."],
["What if you'd been wrong?"],"pressure");
add("b7","behavioral","Tell us about a time you had to deliver bad news.",
"Communication and honesty.",
["STAR.", "Direct, timely, in person.", "Bring a solution.", "Tie to notifications / arrests."],
"At one point I found a calculation error in a report that leadership had been using for months to make decisions. So I had to go tell them that numbers they'd trusted were wrong — and that I was the one who built it. I didn't want to send that in an email, so I went in person. I explained what was wrong, how long it had been wrong, and what the real impact was. I didn't downplay it. And I didn't walk in with just a problem — I brought the corrected numbers and the fix I'd already made. They weren't thrilled, but they told me afterward they appreciated hearing it from me first instead of finding it on their own. That stuck with me. Officers deliver bad news all the time, and some of it is devastating — a death notification, telling a parent their son's been arrested, telling someone their car isn't coming back. I think the same principles apply. Be direct, be honest, don't make people drag it out of you, and be compassionate about how it lands. And whenever you can, tell them what happens next.",
["Avoiding it.", "Hiding behind an email."],
["How would you handle a death notification?"],"ethics");
add("b8","behavioral","Tell us about a time you went above and beyond.",
"Work ethic and service mindset.",
["STAR.", "Beyond your job description.", "Service motive, not credit."],
"There was a plant supervisor at Proconex who spent hours every Monday morning building the same spreadsheet by hand, copying numbers out of IFS. It wasn't my project, and nobody asked me to fix it. I noticed because she mentioned it while I was working on something else, and I knew I could help. So I built a Power BI report that pulled all of it automatically, working it in around my other projects. Then I sat with her and walked her through it until she was comfortable using it. It saved her about [X] hours every single week, and it got rid of the copy-and-paste errors too. Honestly, I didn't do it for credit. I don't think my manager even knew about it for a while. I did it because I saw somebody struggling with something I could fix in an afternoon. That's the mindset I want to bring to patrol. A lot of what officers do isn't in any job description. It's noticing that someone needs help, and then actually doing something about it.",
["Everything is 'just my job.'"],
["Did you get credit for it?"],"leadership");
add("b9","behavioral","Tell us about a time you disagreed with your boss.",
"Respectful dissent, then support.",
["STAR.", "Private, respectful, data-driven.", "Accept the decision and support it fully."],
"My manager wanted to push a system change live right before month-end. I thought that was risky, because if something broke, it would break during the most important week of the month. So I asked for a few minutes with him privately — not in front of the team. I laid out specifically what could fail and what the impact would be on shipping and closing the books, and I suggested waiting one week until after close. He listened, but he had reasons to go ahead — there was pressure from above that I didn't know about. So he decided to push it live. Once he made that call, I supported it completely. I didn't drag my feet or line up an \"I told you so.\" I built a rollback plan, tested it, and stayed close to it that night. It ended up going fine. What I took from it is that my job is to give my honest input once, with facts, and then back the decision. That's how I'd handle it with a sergeant — say my piece respectfully, then follow the order, as long as it's lawful and ethical.",
["Going over the boss's head.", "Refusing to do it."],
["What if he'd been wrong?"],"conflict");
add("b10","behavioral","Tell us about a time you dealt with an angry or difficult person.",
"Service temperament.",
["STAR.", "Let them vent; acknowledge impact.", "Focus on what they need.", "Solve, then fix root cause."],
"We made an update to our ERP system, and it broke one user's workflow right before a big customer shipment was supposed to go out. He called me, and he was furious — raised voice, blaming IT, the whole thing. The first thing I did was let him vent without interrupting or getting defensive. Then I acknowledged it: \"You're right, this is a real problem, and it's on us to fix it.\" Once he felt heard, I focused on exactly what needed to ship and by when. I got a manual workaround in place within the hour so the shipment could go out, and then I went back and fixed the underlying issue properly so it wouldn't happen again. The shipment went out on time, and later that week he actually came by and thanked me. What I've learned is that most angry people want two things: to be heard, and to see that you're actually doing something. If you give them both, the anger usually drains out pretty fast. I think that applies to a lot of calls, too.",
["Blaming the customer."],
["What if you couldn't fix it?"],"conflict");

/* ---- SELF-AWARENESS ---- */
add("s1","self","What are your greatest strengths?",
"Self-knowledge relevant to policing.",
["Two or three strengths tied to the job.", "Evidence for each.", "Not generic."],
"I'd say three things. First, I'm calm under pressure. In my job, production outages are normal. When something breaks and everybody's looking at me, I slow down, figure out what's actually happening, and work the problem. People have told me that my staying calm helps them calm down too. Second, attention to detail and documentation. I work in data all day, and I've learned that small errors turn into big problems. I document what I do so someone else can follow it, and I think that's half of police work — a good report is the foundation of everything that comes after it. Third, I'm a problem-solver. I don't assume. I ask questions, gather facts, and follow the evidence until I understand what really happened. I'd also add discipline. I train consistently — CrossFit and running — and I show up whether I feel like it or not. I think those four things line up directly with what this academy demands and what the job needs on the street.",
["'I'm a people person.'", "Listing seven."],
["Which one matters most on the street?"]);
add("s2","self","What is your biggest weakness?",
"Honesty and self-improvement.",
["A real weakness — not 'perfectionist.'", "What you're doing about it.", "Not job-disqualifying."],
"I can overanalyze. In my current job, when there's time, digging deeper is usually a strength — I find root causes other people miss. But I've learned there are moments where you have to make a decision with eighty percent of the information, and waiting for the last twenty percent costs more than it's worth. There was a time [brief example — e.g., during an outage I spent too long confirming a cause I was already fairly sure of, and it delayed the fix by an hour]. That stuck with me. So I've been working on it. I set decision deadlines for myself, and during outages I commit to a course of action based on what I know, communicate it, and adjust if new information comes in. It's gotten a lot better. And I actually think policing will push me on this faster than anything else could, because on the street you often have seconds, not hours. Between the academy and a good FTO, I expect to get a lot of reps making sound decisions quickly — and I welcome that.",
["'I'm a perfectionist' / 'I work too hard.'", "Anything disqualifying: temper, dishonesty."],
["Give us an example where that hurt you."]);
add("s3","self","What would your current employer and coworkers say about you?",
"Self-perception vs. reality — they will check your references.",
["Two or three traits, each with a quick example.", "Match what your references will actually say.", "Include one honest growth area they'd mention.", "Keep it humble."],
"I think they'd say I'm reliable, calm, and the person who'll figure it out. When something breaks at Proconex, I'm usually one of the first people they call, and I think that's because I don't panic, and I don't stop until it's actually fixed. My manager would probably say I'm thorough and that he doesn't have to double-check my work. Coworkers would probably say I'm easy to work with — I'll explain things without making people feel dumb, and I'll help even when it's not technically my job. [Use a real line from a review or a coworker if you have one: In my last review, my manager wrote ___.] If they were being completely honest, they'd probably also say I can dig too deep sometimes when a quicker answer would do. That's fair, and it's something I've been working on. Outside of work, my friends would say I'm loyal, and that I'll tell them the truth even when they don't want to hear it. I'm comfortable with you calling any of them.",
["Arrogance.", "Contradicting what your references will say.", "'I don't know.'"],
["What would someone who doesn't like you say?", "Will your supervisor give you a good reference?"]);
add("s4","self","How do you manage stress?",
"Healthy coping — critical for a career with trauma exposure.",
["A physical outlet.", "A support system.", "Sleep, nutrition, habits.", "No stigma about peer support / EAP."],
"Training is my main outlet. I do CrossFit and I run, and it's not optional for me — it's how I burn off stress and reset my head. I also take care of the basics people underestimate: I eat well, I get plenty of protein, and I protect my sleep as much as I can. And I talk. My fiancée and I are open with each other. If something's bothering me, I say it instead of carrying it around. I also know policing brings a completely different level of stress than my current job. Shift work, traumatic calls, seeing things you can't unsee — and it adds up over years. I'm not naive about that. So I'd use peer support and the employee assistance program without any stigma. I don't see asking for help as weakness. I see it the same way I see training: it's maintenance, so you stay good at the job for a whole career. And if I noticed a partner struggling, I'd say something to them. Nobody should have to carry that stuff alone.",
["Alcohol.", "'I don't get stressed.'", "Stigma about counseling."],
["What would you do if you noticed a partner struggling?"]);
add("s5","self","Are you physically ready for the academy?",
"Fitness readiness.",
["Yes — with evidence.", "Ongoing training.", "Beyond the minimum."],
"Yes. I passed the PFT, and I don't treat that as the finish line — it's the minimum. I train consistently, CrossFit and running several days a week, and I'm careful about nutrition and recovery. My goal isn't to pass the physical standard in the academy. It's to be comfortable enough that PT isn't draining the energy I need for academics. With an 80 required on every module, I can't afford to be wrecked every night. I also know academy PT is different from a gym. It's early mornings, running in formation, getting smoked as a group when someone messes up, and then going straight into a classroom. So I've been building conditioning, not just strength. And beyond the academy, I think fitness is part of the job. If I have to chase someone, control someone, or carry someone, the people depending on me need me to be ready. That's why I'll keep training through the academy and after it.",
["'I'll get in shape in the academy.'"],
["What's your mile and a half time?"]);
add("s6","self","What will be the hardest part of the academy for you?",
"Self-awareness.",
["Honest and not disqualifying.", "Your plan for it."],
"Honestly, probably the paramilitary structure. I've spent my career in a corporate setting where you can discuss things, push back in a meeting, and debate the best approach. In the academy, you do what you're told, immediately, and you don't debate it. I understand why that matters. When things go bad on the street, there isn't time to talk it over, and orders have to be followed fast. So I'm ready for it. I just know it'll be an adjustment, and I'd rather name that than pretend it won't be. My plan is simple: \"Yes, sir,\" \"Yes, ma'am,\" and do it. If I have a question, I'll ask it at the right time and in the right way. The other hard part will be the pace — balancing studying, PT, and home for twenty-four weeks without letting anything slip. But I've planned for that with my fiancée, and I think knowing the hard parts ahead of time makes them a lot easier to handle.",
["'Nothing.'"],
["How will you handle being yelled at by instructors?"]);
add("s7","self","What would you do if you realized the job wasn't what you expected?",
"Commitment and realism.",
["You've done your homework — few surprises.", "Lean on FTO, veterans, support system.", "Committed to a career, not trying it on."],
"I've tried to do my homework so there aren't big surprises. [If true: I've talked with officers and done a ride-along.] I know it's not what's on TV — it's a lot of paperwork, traffic, mental-health calls, and difficult people. But I'm sure some parts will still be harder than I expect. Maybe it's the shift work, or a certain kind of call that stays with me. If that happens, I'd do what I do with any hard problem. I'd talk to people who've been through it — my FTO, veteran officers, peer support — and figure out whether it gets better with experience or whether I need to adjust something. And I'd lean on my fiancée and my support system. What I wouldn't do is make a quick decision on a bad week. Every career has a hard first year. I'm committing to a career here, not trying one on for size. I've given up a stable job to be in this room, and I don't plan to walk away from it because it turned out to be hard.",
["'I'd go back to my old job.'"],
["How long would you give it?"]);
add("s8","self","Why should we pick you over the other candidates?",
"Confidence without arrogance — can you make your own case?",
["Don't knock other candidates.", "Three reasons: proven readiness, transferable skills, maturity/commitment.", "Evidence for each.", "Close with why you're here."],
"I won't knock anybody else here — I'm sure there are strong candidates in this process. But I can tell you what I bring. First, I've already proven I'm ready. I passed the reading test, the PFT, and the psych, and I've handled the things that usually knock people out of an academy — my family's on board, the money's set aside, and I've planned around my job. Second, I bring professional experience that transfers directly. I spend my days investigating problems, following evidence, documenting clearly, and dealing with frustrated people when things go wrong. That's a lot of what this job is. And I've learned to stay calm when everyone's looking at me to fix something. Third, maturity. I'm not here on a whim or because I don't know what else to do. I'm walking away from a stable career because I know exactly why I want this — to serve this community with integrity. So if you pick me, you're getting someone who will finish this academy, hold the standard, and represent it well.",
["Arrogance or knocking other candidates.", "Begging.", "Generic 'I really want it.'"],
["What does a younger candidate have that you don't?", "What will you do if we don't select you?"]);
add("s9","self","Where do you see yourself in 5 years?",
"Realistic ambition and staying power.",
["Years 1–2: graduate, strong field training, solid patrol officer.", "Years 3–5: trusted and reliable; add a specialty or training role.", "Stay humble — no 'I want to be chief.'", "Tie back to service and this community."],
"In five years, I see myself as a solid, trusted patrol officer in a Montgomery County department. The first couple of years are about the basics — graduating from this academy, getting through field training, and learning to do the job the right way from experienced officers. I want to be the kind of officer my sergeant doesn't worry about. My reports are accurate, I'm on time, I handle my calls, and people in the community know my name for good reasons. By year five, I'd like to be someone other officers trust to back them up and to get things right. And I'd like to be adding something — maybe [an area that interests you — crash reconstruction, investigations, training, or a community program]. Given my background, anything involving data, investigations, or training newer officers would be a natural fit. I'm not in a rush to specialize, though. I think you earn those opportunities by being a really good patrol officer first. Personally, in five years I'll be married and settled here, and I'd like to be serving the same community I live in.",
["'I want to be chief' or 'in the FBI.'", "'Out of patrol as fast as possible.'", "No answer at all."],
["What specialty interests you, and why?", "What would make you leave the department that hires you?"]);

add("k1","knowledge","What does a police officer actually do day to day?",
"Realistic expectations.",
["Patrol and calls for service.", "Traffic, crashes, disputes, welfare checks.", "Mental-health and social-service calls.", "Report writing and court."],
"Most of it is patrol and calls for service. That's alarms, car crashes, neighbor disputes, welfare checks, shoplifting, suspicious persons, and a lot of calls where someone just needs help and doesn't know who else to call. A growing share of calls involve mental health, addiction, or someone in crisis, and those take patience more than force. A big piece of the job is report writing. Every call generates paperwork, and those reports go to the DA, the courts, insurance companies, and sometimes the news, so they have to be clear and accurate. There's traffic enforcement, which is a big part of safety in a county like this. There's investigation, follow-ups, court testimony, and ongoing training. And there's constant interaction with the community — business owners, kids, people who just want to talk. The dramatic stuff you see on TV is a small percentage. Most of the job is being present, solving problems, keeping people safe, and writing it up accurately. Honestly, that's what appeals to me — a lot of it looks like the problem-solving I already do.",
["The TV version."],
["Which calls do you think are most dangerous?"]);
add("k2","knowledge","What is community policing?",
"Philosophy alignment.",
["Police + community partnership.", "Prevent problems, not just respond.", "Know your beat; build trust.", "A concrete example."],
"Community policing is the idea that police and the community work together to prevent problems, not just respond after something happens. In practice, that means knowing the people and businesses on your beat — getting out of the car, talking to store owners, knowing which neighbors watch the street. It means being visible and approachable before there's a crisis. And it means actually listening to what's bothering people, because what worries a neighborhood isn't always what shows up in the crime stats. Maybe it's speeding on one street, or a vacant property, or kids with nowhere to go after school. Then you work on the root cause, sometimes with other agencies — code enforcement, schools, social services. The payoff is trust. When people trust you, they call you, they give you information, and they give you the benefit of the doubt on a hard day. That's what makes you effective. It's close to how I already work, too. Before I build anything at Proconex, I sit down with the people who'll use it and find out what the real problem is.",
["'It's PR.'"],
["Give us one thing you'd do on your beat."]);
add("k3","knowledge","What do you know about this academy?",
"Did you do your research?",
["919 hours / ~24 weeks.", "Blue Bell campus, Health Sciences Center.", "MPOETC-certified, Act 120.", "80 minimum per module; ~$5,995; Sunday sessions."],
"It's MCCC's Municipal Police Academy — the Act 120 program, certified by MPOETC, the Municipal Police Officers' Education and Training Commission. It's 919 hours over about 24 weeks, held at the Health Sciences Center on the Blue Bell campus, and the schedule includes Sunday sessions. Every module requires a minimum score of 80 to pass, so there's no coasting through any part of it, and tuition is around $5,995. From what I understand, the curriculum covers criminal law and procedure, the vehicle code, firearms, defensive tactics, emergency vehicle operations, first aid, report writing, and a lot of scenario-based training. [Add anything specific you learned — from the info session, the website, or a graduate.] I chose it because it's local — a lot of Montgomery County departments hire from here — and because it's rigorous. I'd rather be pushed hard in a program with a high standard than get through an easy one. And practically, the location and schedule fit my plan. I've been planning around this program specifically for a while now.",
["Knowing nothing."],
["What does MPOETC stand for?"]);
add("k4","knowledge","What is Act 120?",
"Basic knowledge.",
["PA law requiring municipal police training and certification.", "Overseen by MPOETC."],
"Act 120 is the Pennsylvania law — the Municipal Police Education and Training Law — that requires municipal police officers to complete basic training and be certified before they can enforce the law. It's overseen by MPOETC, the Municipal Police Officers' Education and Training Commission. The Commission sets the curriculum and the standards, certifies the academies, and requires officers to keep up with annual in-service training once they're certified. This academy is my path to that certification.",
["Not knowing."],
["What does the Commission oversee?"],null,{short: true});
add("k5","knowledge","What are the most important qualities of a police officer?",
"Values.",
["Integrity first — your word is your evidence.", "Communication, judgment, empathy, courage.", "Tie to yourself."],
"For me, integrity is first. Without it, nothing else matters, because an officer's word is evidence. If people can't trust your report or your testimony, you can't do the job. Second is communication. Most of policing is talking to people — calming them down, getting information, explaining what's happening. An officer who communicates well has to use force a lot less. Third is judgment. You have to make good decisions quickly, often with incomplete information, and then be able to explain them afterward. Fourth is empathy. You're meeting people on their worst days, and how you treat them sticks with them for a long time. And fifth is courage — physical courage, obviously, but also the moral courage to speak up when another officer is doing something wrong. If I'm honest about myself, I'm strongest in integrity, communication, and judgment, because that's what my job has demanded for years. Courage under physical danger is something I'll build in the academy and on the street, and I'm going in with my eyes open about that.",
["'Being tough.'", "'Authority.'"],
["Which is hardest to maintain over a career?"]);
add("k6","knowledge","What are the biggest challenges facing policing today?",
"Awareness and balance.",
["Public trust.", "Recruitment and retention.", "Mental-health and addiction calls.", "Officer wellness. Balanced, not political."],
"I'd say there are a few big ones. The first is trust. High-profile incidents around the country have damaged the relationship between police and some communities. Every officer either rebuilds that trust or erodes it, one interaction at a time, even if they had nothing to do with what happened somewhere else. The second is staffing. A lot of departments are short-handed, which means more overtime, more burnout, and less time for the proactive community work that prevents problems. The third is the kind of calls officers are handling. More and more calls involve mental health, addiction, and homelessness, and officers aren't always trained or resourced for them. That's why crisis intervention training and co-responder programs matter. And the fourth is officer wellness. The stress of this job adds up, and officers have historically been bad at asking for help. My part in all of that is simple. I can be professional, fair, and accountable on every call, take the training seriously, and look after my own mental health so I last a whole career.",
["Political rants.", "Blaming the public or the media."],
["How would you personally build trust?"]);
add("k7","knowledge","What's the most recent thing you've read about policing?",
"Are you genuinely engaged with the profession — and can you discuss it thoughtfully?",
["Name a real, specific article and source — read one tonight.", "One-sentence summary.", "Your balanced take — not political.", "Connect it to the kind of officer you want to be."],
"[Read one real article tonight and swap in its details — they may ask a follow-up.] The most recent thing I read was [an article on Police1 / in the Inquirer / in local news] about [co-responder programs, where departments pair officers with mental-health professionals on crisis calls]. The piece talked about how [clinicians respond alongside officers, so that someone in crisis gets connected to treatment instead of ending up in a cell or the ER]. What stood out to me was [that it wasn't framed as police versus social workers. It was about getting the right person to the call, and freeing up officers for the calls that need them]. I thought it was a smart approach, and it lines up with what I understand about the job — a big share of calls involve someone in crisis. My takeaway was that crisis intervention training is going to be one of the most important things I learn, because even with co-responders, patrol is usually first on scene. I try to read about the profession regularly. I want to walk into this academy already understanding the conversations happening in the field.",
["'I don't really read about it.'", "Naming something you can't discuss when they follow up.", "Turning it into a political rant."],
["What did you think the article got wrong?", "How would that change how you do the job?"]);
add("k8","knowledge","Do you have any family or friends in law enforcement?",
"Your realistic exposure to the job — and whether you'll try to trade on connections.",
["Truthful — yes or no.", "If yes: what you've learned from them about the reality of the job.", "If no: how you learned about it anyway (ride-along, research, officers you've talked to).", "Never imply a connection should help you."],
"[Use the version that's true.] If yes: \"Yes — my [relation] is [an officer with ___ / retired from ___]. Being around that, I saw the parts of the job most people don't — the missed holidays, the calls that came home with them, and how much the community respected someone who did it right. They've been honest with me about how hard it is, and they didn't try to talk me into it, which is part of why I trust my decision. To be clear, I'm not expecting any connection to help me here. I want to earn this on my own.\" If no: \"No, not directly. I don't come from a police family, so I've made a point of learning about the job on my own. [If true: I've done a ride-along and talked with officers in the county about what the job really looks like day to day.] I've read up on the academy, the certification, and the reality of patrol. I think coming in without a family connection means I've had to think harder about why I want this — and I'm confident in the answer.\"",
["Name-dropping, or implying it should help you.", "Inventing a connection.", "Clearly no idea what the job involves."],
["What did they tell you about the job that surprised you?", "Have you done a ride-along?"]);

function extrasHTML(){return `<div id="txw" class="card hide"><div class="small mute">Live transcript</div><div class="tx" id="tx"></div></div>
 <div id="fbw" class="card hide"><div class="small" id="fbn" style="color:var(--warn);margin-bottom:6px"></div><textarea id="fbt" rows="4" placeholder="Optional: type key points, or tap 🎤 on your keyboard to dictate."></textarea></div>`}
// Wires Start → Done on #ans. Falls back to a text box when transcription is off,
// unsupported, or fails mid-answer. Calls done(seconds, text, typed).
function answerFlow(lim,warn,done){
 const btn=$("#ans"),box=$("#tbox"),st=$("#tstat");
 let getE=null,armed=0,startedRec=false;
 const showFallback=msg=>{$("#fbn").textContent=msg;$("#fbw").classList.remove("hide");$("#txw").classList.add("hide")};
 btn.onclick=()=>{
  if(getE){ // Done
   if(Date.now()<armed)return; // ignore the second tap of a double-tap
   const dur=getE();stopTimer();const said=stopRec();const typed=($("#fbt").value||"").trim();
   getE=null;done(dur,said||typed,!said&&!!typed);return;
  }
  hush();
  btn.textContent="■ Done";btn.className="btn bad hero";armed=Date.now()+800;
  const rep=$("#rep");if(rep)rep.classList.add("hide");
  startedRec=startRec(()=>{const el=$("#tx");if(el)el.textContent=liveTx()||"(listening…)"},msg=>{showFallback(msg);st.textContent="Timer running"});
  if(startedRec){$("#txw").classList.remove("hide");$("#tx").textContent="(listening…)";st.textContent="Recording + transcribing"}
  else{showFallback(!S.mic?"Transcription is off (Home → toggle). Timer still runs.":!SR?"Live transcription isn't supported in this browser — type or use your keyboard's 🎤 to dictate.":"Couldn't start transcription — type or dictate below.");st.textContent="Timer running"}
  getE=runTimer(lim,warn,box,()=>{st.textContent=`${lim-warn} seconds left — start landing it`},()=>{st.textContent="Time — wrap it up now"});
 };
}

/* ============ ANALYSIS ============ */
// "like" skips normal verb/comparison uses ("I'd like", "looks like"); "feel like" is counted as a hedge
const FILLERS=[["um","\\bu+m+\\b"],["uh","\\bu+h+\\b"],["like","(?<!\\b(?:would|i'd|you'd|we'd|they'd|look|looks|looked|seem|seems|sound|sounds|feel|feels|felt|just|be|is|was|things|something|anything|nothing|people|exactly|more|less|much|not|don't|didn't|i|you|we|they) )\\blike\\b"],["you know","\\byou know\\b(?! (?:what|how|that|the|about|when|where|why|who))"],["basically","\\bbasically\\b"],["literally","\\bliterally\\b"],["I mean","\\bi mean\\b"]];
const HEDGES=["i think maybe","i guess","maybe","probably","i feel like","i'm not sure","hopefully","i would try","i might","it depends","sort of","kind of"];
function lengthFlag(dur,q){
 // Background yes/no questions are meant to be short: answer, then stop.
 const L=q.range||(q.short?{lo:15,hi:75,max:120,target:"30–60s: answer, then stop"}:{lo:30,hi:95,max:120,target:"60–90s"});
 if(dur<L.lo)return ["b",`Too short: ${fmt(dur)}. ${q.short?"Even short answers need the full truth + what changed.":`Aim for ${L.target} — the board wants substance.`}`];
 if(dur>L.max)return ["b",`Too long: ${fmt(dur)}. Cut to ${L.target}.`];
 if(dur<=L.hi)return ["g",`Good length: ${fmt(dur)}.`];
 return ["w",`${fmt(dur)} — a bit long. Target ${L.target}.`];
}
function analyze(tx,dur,q,typed){
 const t=" "+String(tx||"").toLowerCase()+" ",out=[lengthFlag(dur,q)];
 if(!String(tx||"").trim()){out.push(["w","No transcript captured — self-score honestly."]);return {flags:out,fill:0,hedge:0}}
 let fc=0;const fl=[];
 FILLERS.forEach(([n,re])=>{const m=t.match(new RegExp(re,"g"));if(m){fc+=m.length;fl.push(`${n} ×${m.length}`)}});
 if(fc>=3)out.push(["b",`Filler words: ${fc} (${fl.join(", ")}). Replace with a pause.`]);
 else if(fc)out.push(["w",`Filler words: ${fl.join(", ")}.`]);
 else out.push(["g","No filler words detected."]);
 let hc=0;const hl=[];let ht=t;
 HEDGES.forEach(h=>{const re=new RegExp("\\b"+h+"\\b","g");const m=ht.match(re);if(m){hc+=m.length;hl.push(`“${h}” ×${m.length}`);ht=ht.replace(re," ")}});
 const firm=q.c==="integrity"||q.c==="honesty";
 if(hc)out.push([firm?"b":"w",`Hedging: ${hl.join(", ")}. ${firm?"Integrity and honesty answers must be decisive.":"State it plainly."}`]);
 if(q.c==="behavioral"){
  const star={
   Situation:/\b(when i|there was|at proconex|we had|situation|one time|last year|a while back|a few (months|years)|at work|at one point)\b/,
   Task:/\b(my (job|role|task|responsibility)|i was responsible|i needed to|i had to|the goal|task was|i was asked|i was the one)\b/,
   Action:/\b(i (went|called|met|built|pulled|asked|decided|talked|sat|set up|wrote|fixed|created|reached out|listened|explained|documented|rolled|traced|scheduled|rebuilt|laid out|showed|got|brought))\b/,
   Result:/\b(result|as a result|ended up|outcome|in the end|so now|we were able|reduced|improved|saved|percent|%|learned|dropped|stopped|what i took)\b/};
  const miss=Object.keys(star).filter(k=>!star[k].test(t));
  out.push(miss.length?["b","STAR missing: "+miss.join(", ")+"."]:["g","STAR structure: all four parts present."]);
 }
 const w=words(tx);
 out.push(["g",typed?`${w} words typed`:`${w} words · ~${Math.round(w/Math.max(dur,1)*60)} wpm`]);
 return {flags:out,fill:fc,hedge:hc};
}

/* ============ SCORING ============ */
// Per-item score = mean of the dimensions actually rated. Unrated items are ignored,
// so skipped or partially-scored answers never produce NaN.
function itemScore(i){return avg(DIMS.map(d=>i.sc[d]).filter(Boolean))}
function stats(items){
 const dims=DIMS.map(d=>[d,avg(items.map(i=>i.sc[d]).filter(Boolean))]);
 const byCat={};items.forEach(i=>{const s=itemScore(i);if(s!==null)(byCat[i.c]=byCat[i.c]||[]).push(s)});
 const cats=Object.entries(byCat).map(([c,v])=>[c,avg(v),v.length]).sort((a,b)=>a[1]-b[1]||b[2]-a[2]);
 const scoredN=items.filter(i=>itemScore(i)!==null).length;
 return {dims,cats,scoredN,weak:cats.filter(c=>c[1]<4).slice(0,2)};
}
function weakHTML(items){
 const s=stats(items);
 if(!s.scoredN)return `<div class="mute small">No self-scores recorded.</div>`;
 return `${s.weak.length?`<div class="flag b"><b>Weakest:</b> ${s.weak.map(w=>`${CATS[w[0]].n} (${w[1].toFixed(1)})`).join(" · ")}</div>`:`<div class="flag g">No category under 4.0 — strong session.</div>`}
 ${s.dims.map(([d,v])=>`<div class="stat"><span>${d}</span><b>${v===null?"–":v.toFixed(1)}</b></div>`).join("")}`;
}

/* ---- MOCK BOARD ---- */
let M=null;
const qW=q=>q.why?3:CATS[q.c].w;
// Weighted sampling without replacement: removes each pick from `avail`.
function drawWeighted(avail,k){
 const out=[];
 while(out.length<k&&avail.length){
  const tot=avail.reduce((a,q)=>a+qW(q),0);if(tot<=0)break;
  let r=Math.random()*tot,idx=-1;
  for(let i=0;i<avail.length;i++){if(qW(avail[i])>0)idx=i;r-=qW(avail[i]);if(r<0&&qW(avail[i])>0)break}
  out.push(avail.splice(idx,1)[0]);
 }
 return out;
}
// Weak spots: questions whose most recent scored attempt averaged ≤3. The main answer decides;
// a follow-up probe's score is only used when the main answer wasn't scored.
function weakQs(){
 const last={};
 S.sessions.forEach(s=>{const main={},fu={};s.items.forEach(i=>{const v=itemScore(i);if(v!==null){const m=i.fu?fu:main;(m[i.qid]=m[i.qid]||[]).push(v)}});
  new Set([...Object.keys(main),...Object.keys(fu)]).forEach(id=>last[id]=avg(main[id]||fu[id]))});
 return Object.keys(last).filter(id=>QMAP[id]&&last[id]<=3).map(id=>({q:QMAP[id],score:last[id]})).sort((a,b)=>a.score-b.score);
}
function buildDeck(mode){
 if(mode==="quick")return drawWeighted(Q.filter(q=>q.c!=="closer"),5);
 if(mode==="drill")return shuffle(weakQs().map(w=>w.q)).slice(0,12);
 const n=10+Math.floor(Math.random()*3); // 10–12 including opener + closer
 const avail=Q.filter(q=>q.id!=="o1"&&q.c!=="closer");
 const take=list=>{list.forEach(q=>avail.splice(avail.indexOf(q),1));return list};
 // Guarantee coverage of what boards hit hardest, then fill by weight.
 const chosen=[...take(shuffle(avail.filter(q=>q.c==="integrity")).slice(0,3)),...take(shuffle(avail.filter(q=>q.why)).slice(0,2))];
 chosen.push(...drawWeighted(avail,n-2-chosen.length));
 return [QMAP.o1,...shuffle(chosen),pick(Q.filter(q=>q.c==="closer"))];
}
function panelistFor(q){const c=PANEL.filter(p=>p.cats.includes(q.c));return pick(c.length?c:PANEL)}
const MODE_NAME={board:"Mock Board",drill:"Weak Spot Drill",quick:"Quick 5"};
VIEWS.mock=mode=>{
 mode=MODE_NAME[mode]?mode:"board";
 const deck=buildDeck(mode);
 M={mode,deck,i:0,items:[],skipped:0,start:Date.now()};
 if(!deck.length){app.innerHTML=hdr(MODE_NAME[mode])+`<div class="card">No weak spots yet. Weak Spot Drill pulls every question whose latest self-score averaged 3 or lower — run a Mock Board and score yourself honestly first.</div><button class="btn pri" id="gb">Start Mock Board</button>`;$("#gb").onclick=()=>go("mock","board");return}
 app.innerHTML=hdr(MODE_NAME[mode])+`<div class="panel">${PANEL.map(p=>`<div class="pm on"><div class="av">${p.av}</div><b>${p.n}</b><span>${p.d}</span></div>`).join("")}</div>
 ${mode==="drill"?`<div class="card"><b>Drilling ${deck.length} weak question${deck.length>1?"s":""}</b> (latest score ≤3). Score yourself again — anything that rises above 3 drops off the list.</div>`:""}
 <div class="card"><b>${deck.length} questions.</b> Each question is read aloud. Tap <b>Start Answer</b>, speak to the panel, tap <b>Done</b>. 90-second timer — yellow at 60s, red at 90s. Follow-up probes fire ~40% of the time.</div>
 <div class="card small mute">Stand up, phone propped at eye level. Answer like it's real — “Sir/Ma'am,” eye contact.</div>
 <button class="btn pri hero" id="go">Enter the Room</button>`;
 $("#go").onclick=()=>{
  // iOS only lets speech start inside a tap; a silent utterance here unlocks it for the session.
  if(synth&&S.voice){try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;synth.speak(u)}catch(e){}}
  M.live=true;wakeOn();askQ(M.deck[0],false)};
 if(mode==="quick")$("#go").onclick();

function askQ(q,isFU,fuText,panelist){
 stopAll();window.scrollTo(0,0);

 M.cur={q,isFU,text,p};
 app.innerHTML=hdr(`Question ${M.i+1} of ${M.deck.length}${isFU?" · Follow-up":""}`,"end")+
 `<div class="panel">${PANEL.map(x=>`<div class="pm ${x===p?"on":""}"><div class="av">${x.av}</div><b>${x.n}</b><span>${x.d}</span></div>`).join("")}</div>
 <div class="card"><span class="tag">${CATS[q.c].n}</span>${isFU?'<span class="tag" style="color:var(--warn)">Probe</span>':""}${q.short?'<span class="tag">Short answer</span>':""}

 ${guideHTML(q,isFU)}
 <button class="btn pri" id="nx">Next →</button>
 <button class="btn ghost" id="redo">↺ Redo this answer</button>`;
 $("#redo").onclick=()=>askQ(q,isFU,text,p);
 app.querySelectorAll(".opts").forEach(o=>o.querySelectorAll("button").forEach(b=>b.onclick=()=>{
  o.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");sc[o.dataset.k]=+b.dataset.n}));
 let used=false;
 $("#nx").onclick=()=>{
  if(used)return;used=true;
  M.items.push({qid:q.id,c:q.c,fu:isFU,probe:isFU?text:undefined,dur:Math.round(dur),fill:a.fill,hedge:a.hedge,sc:cleanSc(sc)});
  if(M.mode!=="quick"&&!isFU&&q.p.length&&Math.random()<0.4)askQ(q,true,pick(q.p),p);
  else nextQ();
 };
 bindNav();bindEnd();
}

 <div class="row"><button class="btn" id="pv">← Prev</button><button class="btn" id="sh">Shuffle</button><button class="btn" id="nx">Next →</button></div>`;

 $("#card").onclick=e=>{if(e.target.closest("details"))return;F.flip=!F.flip;renderFlash()};
 $("#pv").onclick=()=>{F.i=(F.i-1+F.list.length)%F.list.length;F.flip=false;renderFlash();window.scrollTo(0,0)};
 $("#nx").onclick=()=>{F.i=(F.i+1)%F.list.length;F.flip=false;renderFlash();window.scrollTo(0,0)};
 $("#sh").onclick=()=>{F.list=shuffle(F.list);F.i=0;F.flip=false;renderFlash()};
 bindNav();
}

/* ---- STORY BANK ---- */
VIEWS.stories=()=>{
 const hints={conflict:"Coworker/stakeholder disagreement — e.g., ops manager disputing your Power BI numbers.",failure:"Something that went wrong that you owned — e.g., untested report that went to leadership.",leadership:"Leading without authority — e.g., aligning sales/ops/finance on one IFS definition.",pressure:"High-stakes deadline — e.g., month-end production outage, orders not posting.",ethics:"A time you did the right thing when it cost you, or reported/corrected something.",why:"The specific moment or person that made you want this job."};
 app.innerHTML=hdr("Story Bank")+`<div class="card small mute">Write each in STAR: <b>S</b>ituation · <b>T</b>ask · <b>A</b>ction · <b>R</b>esult. Short bullets are fine. Saves as you type. These show up in flashcards and mock review.</div>`+
 Object.entries(STORIES).map(([k,n])=>{const qs=Q.filter(q=>q.st===k);return `<div class="card"><h2 style="margin-top:0">${n}</h2><div class="small mute">${esc(hints[k])}</div>
 <textarea data-k="${k}" placeholder="S: &#10;T: &#10;A: &#10;R: ">${esc(S.stories[k]||"")}</textarea>
 <div class="row" style="align-items:center"><div class="small mute" id="sv-${k}" style="flex:2">${S.stories[k]&&S.stories[k].trim()?"Saved":""}</div><button class="btn ghost" data-del="${k}" style="margin:6px 0">Clear</button></div>
 <div class="small mute">Answers:</div>${qs.map(q=>`<span class="tag" style="margin-top:4px">${esc(q.q)}</span>`).join("")}</div>`}).join("");
 const mark=(k,msg)=>{const s=$("#sv-"+k);if(s)s.textContent=msg};
 app.querySelectorAll("textarea").forEach(ta=>ta.oninput=()=>{const k=ta.dataset.k;if(ta.value)S.stories[k]=ta.value;else delete S.stories[k];mark(k,save()?"Saved ✓":"Not saved — storage blocked")});
 app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const k=b.dataset.del;if(!S.stories[k]||confirm(`Clear your ${STORIES[k]} story?`)){delete S.stories[k];save();app.querySelector(`textarea[data-k="${k}"]`).value="";mark(k,"Cleared")}});
};

VIEWS.quickDone=()=>{
 const n=M.items.length;
 app.innerHTML=hdr("Quick 5")+`<div class="card"><b>${n} rep${n===1?"":"s"} done${M.skipped?`, ${M.skipped} skipped`:""}.</b><div class="small mute" style="margin-top:4px">Quick 5 isn't scored or saved — it's for warm-up reps.</div></div>
 <button class="btn pri hero" id="again">⚡ Another 5</button><button class="btn ghost" data-go="home">Home</button>`;
 $("#again").onclick=()=>go("mock","quick");
};

/* ---- EXPORT ---- */
function exportText(){
 const L=[],line="-".repeat(44),d=new Date();
 const sc=i=>DIMS.map(k=>`${k==="Specific Example"?"Example":k} ${i.sc[k]||"–"}`).join(" · ");
 L.push("ORAL BOARD PREP — MCCC Municipal Police Academy (Act 120)","Exported "+d.toLocaleString(),"");
 const t=tmayText(),m=tmayMeta();
 L.push("TELL ME ABOUT YOURSELF"+(t?`  (${m.w} words, ~${m.sec}s)`:""),line,t||"(not written yet)","");
 L.push("STORY BANK",line);Object.entries(STORIES).forEach(([k,n])=>{L.push(`[${n}]`,(S.stories[k]||"").trim()||"(not written yet)","")});
 const wq=weakQs();L.push("WEAK SPOTS — latest self-score 3 or lower",line);
 if(wq.length)wq.forEach(w=>L.push(`${w.score.toFixed(1)}  ${w.q.q}`));else L.push("(none)");L.push("");
 const all=S.sessions.flatMap(s=>s.items),st=stats(all);
 L.push("OVERALL — all saved sessions",line);
 if(st.scoredN){st.dims.forEach(([k,v])=>L.push(`${k.padEnd(18)} ${v===null?"–":v.toFixed(1)}`));L.push("");st.cats.forEach(([c,v,n])=>L.push(`${CATS[c].n.padEnd(24)} ${v.toFixed(1)}  (${n} answer${n>1?"s":""})`))}
 else L.push("(no self-scores yet)");L.push("");
 L.push("SESSIONS",line);
 if(!S.sessions.length)L.push("(none yet)");
 S.sessions.forEach((s,k)=>{const ss=stats(s.items);
  L.push(`#${k+1}  ${s.mode==="drill"?"Weak Spot Drill":"Mock Board"} · ${new Date(s.date).toLocaleString()} · ${s.items.length} answers${s.skipped?` · ${s.skipped} skipped`:""}`);
  if(ss.weak.length)L.push("   Weakest: "+ss.weak.map(w=>`${CATS[w[0]].n} ${w[1].toFixed(1)}`).join(", "));
  s.items.forEach(i=>{const q=QMAP[i.qid];L.push(`   ${i.fu?"  ↳ Follow-up: "+(i.probe||"(probe)"):"• "+q.q}`,`       ${sc(i)} | ${fmt(i.dur)} | fillers ${i.fill} · hedges ${i.hedge}`)});
  L.push("")});
 L.push("DAY-OF CHECKLIST",line);CHECK.forEach(([id,,c])=>L.push(`[${S.check[id]?"x":" "}] ${c}`));
 return L.join("\n")+"\n";
}
VIEWS.export=()=>{
 const txt=exportText(),name=`oral-board-prep-${new Date().toISOString().slice(0,10)}.txt`;
 app.innerHTML=hdr("Export")+`<div class="card small mute">Stories, your "tell me about yourself," weak spots, every scored session, and the checklist — as plain text you can print or read on paper.</div>
 <button class="btn pri" id="dl">⬇ Download ${esc(name)}</button><button class="btn" id="cp">Copy to clipboard</button><div class="small mute" id="exs" style="text-align:center"></div>
 <textarea id="ext" readonly style="min-height:320px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace">${esc(txt)}</textarea>`;
 const msg=t=>{$("#exs").textContent=t};
 $("#dl").onclick=()=>{try{const u=URL.createObjectURL(new Blob([txt],{type:"text/plain;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);msg("Downloaded — check your Downloads / Files app.")}catch(e){msg("Download blocked here — use Copy instead.")}};
 $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(txt);msg("Copied.")}catch(e){const t=$("#ext");t.focus();t.select();try{document.execCommand("copy");msg("Copied.")}catch(x){msg("Select the text below and copy it.")}}};
};

/* ---- TELL ME ABOUT YOURSELF ---- */
const TMAY_F=[
 ["role","1 · Present role","Who you are and what you do now.","I'm [Name]. I live here in Montgomery County, and I'm engaged. For the last [X] years I've been a Business Systems Analyst at Proconex — I'm the person people call when something breaks."],
 ["skills","2 · Relevant skills","What you do that transfers to policing.","I dig into Oracle databases to find out what went wrong, build the Power BI reports leadership uses to make decisions, and support the IFS system that runs the business. That's taught me to stay calm under pressure, ask good questions, and follow the facts instead of assumptions."],
 ["drew","3 · What drew me to policing","The real reason — one moment or person if you have it.","What drew me to policing is that I want to point those skills at people, not systems. [One real moment or person that sparked it.] I want to serve the community I actually live in."],
 ["now","4 · Why now","Why this is the right time — and proof you're ready.","The timing's right. My fiancée and I made this decision together, the finances are planned, and I'm in shape. I've passed the reading test, the PFT, and the psych, and I'm ready to commit to the 919 hours and earn my place."]
];
const tmayText=()=>TMAY_F.map(f=>(S.tmay[f[0]]||"").trim()).filter(Boolean).join("\n\n");
function tmayMeta(){const w=words(tmayText()),sec=Math.round(w/150*60);return {w,sec,col:!w?"var(--mute)":sec<45?"var(--warn)":sec<=70?"var(--good)":"var(--bad)"}}
VIEWS.tmay=()=>{
 app.innerHTML=hdr("Tell Me About Yourself")+`<div class="card small mute">Four short parts that stitch into one answer. Target <b>~130–170 words ≈ 60 seconds</b> spoken. Saves as you type.</div>
 ${TMAY_F.map(([k,l,h,ex])=>`<div class="card"><div style="font-weight:600">${l}</div><div class="small mute" style="margin-bottom:6px">${h}</div><textarea rows="4" data-t="${k}" placeholder="${esc(ex)}">${esc(S.tmay[k]||"")}</textarea></div>`).join("")}
 <div class="card"><div class="stat"><span>Length</span><b id="tw"></b></div><div class="tx" id="tp" style="margin-top:8px"></div></div>
 <button class="btn pri" id="tgo">▶ Practice with 60s timer</button>
 <div class="row"><button class="btn ghost" id="tfill">Fill from sample</button><button class="btn ghost" id="tclr">Clear</button></div>`;
 const upd=()=>{const m=tmayMeta();$("#tw").innerHTML=`<span style="color:${m.col}">${m.w} words · ~${m.sec}s</span>`;$("#tp").innerHTML=tmayText()?ph(tmayText()):'<span class="mute">Your stitched answer appears here.</span>'};
 app.querySelectorAll("textarea[data-t]").forEach(t=>t.oninput=()=>{const k=t.dataset.t;if(t.value)S.tmay[k]=t.value;else delete S.tmay[k];save();upd()});
 $("#tfill").onclick=()=>{if(tmayText()&&!confirm("Replace what you've written with the sample?"))return;TMAY_F.forEach(f=>S.tmay[f[0]]=f[3]);save();go("tmay")};
 $("#tclr").onclick=()=>{if(tmayText()&&confirm("Clear all four parts?")){S.tmay={};save();go("tmay")}};
 $("#tgo").onclick=()=>{if(!tmayText()){alert("Write at least one part first (or tap Fill from sample).");return}go("tmayPractice")};
 upd();
};
const TMAY_Q={c:"opener",range:{lo:40,hi:70,max:90,target:"45–70s"}};
VIEWS.tmayPractice=()=>{
 const m=tmayMeta();
 app.innerHTML=hdr("Practice: About Yourself")+`${timerHTML(60,"compact sticky")}
 <button class="btn pri" id="ans">▶ Start</button>
 <div id="tres"></div>
 <div class="card"><div class="row" style="align-items:center"><span class="small mute" style="flex:2">${m.w} words · ~${m.sec}s</span><button class="btn ghost" id="thide" style="margin:0">Hide text</button></div>
 <div id="ttext" style="font-size:19px;line-height:1.5;margin-top:8px">${ph(tmayText()).replace(/\n/g,"<br>")}</div></div>
 ${extrasHTML()}
 <div class="row"><button class="btn ghost" id="rep">🔊 Read it to me</button><button class="btn ghost" id="tedit">✎ Edit</button></div>`;
 $("#thide").onclick=()=>{const t=$("#ttext"),h=t.classList.toggle("hide");$("#thide").textContent=h?"Show text":"Hide text"};
 $("#rep").onclick=()=>speak(tmayText().replace(/\[[^\]]*\]/g,""),Object.assign({},PANEL[0],{rate:1}));
 $("#tedit").onclick=()=>go("tmay");
 answerFlow(60,45,(dur,tx,typed)=>{
  const a=analyze(tx,dur,TMAY_Q,typed);
  $("#ans").textContent="↺ Again";$("#ans").className="btn pri";$("#ans").onclick=()=>go("tmayPractice");
  $("#tres").innerHTML=`<div class="card"><h3 style="margin-top:0">How it went</h3>${a.flags.map(f=>`<div class="flag ${f[0]}">${esc(f[1])}</div>`).join("")}${tx?`<details><summary>Your ${typed?"notes":"transcript"}</summary><div class="tx">${esc(tx)}</div></details>`:""}</div>`;
  window.scrollTo({top:0,behavior:"smooth"});
 });
};

/* ---- CHECKLIST ---- */
VIEWS.check=()=>{
 let sec="";
 app.innerHTML=hdr("Day-Of Checklist")+`<div class="card" style="padding:0 4px">${CHECK.map(([id,s,c])=>{const h=s!==sec?`<h3 style="padding:0 12px">${esc(s)}</h3>`:"";sec=s;return h+`<label class="ck ${S.check[id]?"done":""}"><input type="checkbox" data-id="${id}" ${S.check[id]?"checked":""}><span>${esc(c)}</span></label>`}).join("")}</div><button class="btn ghost" id="rs">Reset checklist</button>`;
 app.querySelectorAll(".ck input").forEach(cb=>cb.onchange=()=>{const id=cb.dataset.id;if(cb.checked)S.check[id]=true;else delete S.check[id];cb.parentNode.classList.toggle("done",cb.checked);save()});
 $("#rs").onclick=()=>{if(confirm("Uncheck everything?")){S.check={};save();go("check")}};
};

go("home");
</script>
