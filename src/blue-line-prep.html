<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Blue Line Prep"/>
<meta name="theme-color" content="#07080b"/>
<title>Blue Line Prep</title>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg:#07080b;
    --surface:#13161d;
    --surface-hi:#191d26;
    --line:rgba(255,255,255,.07);
    --line-2:rgba(255,255,255,.13);
    --tx:#e9ecf2;
    --tx-2:#98a1b2;
    --tx-3:#606877;
    --org:#f4640a;
    --grn:#22c55e;
    --pur:#a855f7;
    --cyn:#22d3ee;
    --red:#f43f5e;
    --amb:#f59e0b;
    --blu:#3b82f6;
    --r:16px;
    --cond:'Barlow Condensed',system-ui,sans-serif;
    --tabh:calc(60px + env(safe-area-inset-bottom));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html{background:var(--bg);color-scheme:dark}
  body{
    min-height:100%;
    background:var(--bg);
    color:var(--tx);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    overscroll-behavior-y:none;
    text-rendering:optimizeLegibility;
  }
  button,input,select{font-family:inherit;color:inherit;touch-action:manipulation}
  button{border:none;background:none;cursor:pointer}

  /* ── shell ───────────────────────────────────── */
  .app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;isolation:isolate}
  .pane{padding:14px 14px calc(var(--tabh) + 28px);animation:rise .28s cubic-bezier(.22,1,.36,1)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ── hero ────────────────────────────────────── */
  .hero{
    position:relative;
    padding:calc(env(safe-area-inset-top) + 20px) 16px 18px;
    background:
      radial-gradient(130% 90% at 8% 0%, rgba(59,130,246,.16) 0%, transparent 55%),
      radial-gradient(100% 80% at 100% 0%, rgba(244,100,10,.13) 0%, transparent 55%),
      linear-gradient(180deg,#101420 0%, #0a0c11 100%);
  }
  .hero::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
    background:linear-gradient(90deg,transparent,#1d4ed8 18%,#3b82f6 50%,#1d4ed8 82%,transparent);
    opacity:.9;
  }
  .brand{
    font-family:var(--cond);font-size:11px;font-weight:700;letter-spacing:.34em;
    color:var(--org);display:flex;align-items:center;gap:8px;
  }
  .brand::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,rgba(244,100,10,.45),transparent)}
  .dayname{
    font-family:var(--cond);font-size:58px;font-weight:800;line-height:.82;
    letter-spacing:.005em;color:#fff;
  }
  .metaline{font-family:var(--cond);font-size:16px;font-weight:700;letter-spacing:.1em;color:var(--tx-2)}
  .metasub{font-size:9.5px;font-weight:700;letter-spacing:.16em;color:var(--tx-3);margin-top:3px}
  .streak{
    display:inline-flex;align-items:center;gap:5px;margin-top:9px;
    font-size:11px;font-weight:700;color:#fdba74;
    background:rgba(244,100,10,.12);border:1px solid rgba(244,100,10,.24);
    border-radius:999px;padding:4px 10px;white-space:nowrap;
  }
  .save{font-size:10px;font-weight:600;letter-spacing:.05em;transition:color .3s}

  .track{flex:1 1 0;min-width:0;background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
  .track-l{font-size:9px;font-weight:700;letter-spacing:.16em;font-family:var(--cond)}
  .track-v{font-size:11px;font-weight:700;color:var(--tx-2);font-variant-numeric:tabular-nums}
  .track-rail{height:3px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
  .track-fill{height:100%;border-radius:99px;transition:width .45s cubic-bezier(.22,1,.36,1)}

  .pill{
    font-family:var(--cond);font-size:11px;font-weight:700;letter-spacing:.08em;
    padding:4px 10px;border-radius:999px;white-space:nowrap;
  }

  /* ── sticky day bar ──────────────────────────── */
  .daybar{
    position:sticky;top:0;z-index:40;
    display:flex;gap:6px;align-items:center;
    padding:9px 12px;
    background:rgba(7,8,11,.82);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid var(--line);
  }
  .arr{
    width:34px;height:44px;flex-shrink:0;border-radius:11px;
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    color:var(--tx-2);font-size:19px;font-weight:700;line-height:1;
    display:flex;align-items:center;justify-content:center;transition:all .15s;
  }
  .arr:active{background:rgba(255,255,255,.12);transform:scale(.94)}
  .arr:disabled{opacity:.3}
  .days{flex:1;display:flex;gap:4px;min-width:0}
  .day{
    flex:1;min-width:0;height:44px;border-radius:11px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    background:rgba(255,255,255,.04);border:1px solid var(--line);
    transition:all .18s cubic-bezier(.22,1,.36,1);
  }
  .day:active{transform:scale(.94)}
  .day.on{background:#fff;border-color:#fff;box-shadow:0 4px 14px rgba(255,255,255,.14)}
  .day-t{font-family:var(--cond);font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--tx-2)}
  .day.on .day-t{color:#0a0c11}
  .dot{width:5px;height:5px;border-radius:50%}

  /* ── cards ───────────────────────────────────── */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .pad{padding:15px}
  .sec{display:flex;align-items:center;gap:8px;margin:20px 2px 9px}
  .sec:first-child{margin-top:2px}
  .sec-bar{width:3px;height:13px;border-radius:99px;flex-shrink:0;align-self:center}
  .sec-t{
    font-family:var(--cond);font-size:12px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;line-height:1.25;flex:1;min-width:0;
  }
  .badge{
    font-size:9.5px;font-weight:800;letter-spacing:.09em;border-radius:6px;
    padding:4px 8px;font-family:var(--cond);white-space:nowrap;flex-shrink:0;
  }
  .h-card{font-family:var(--cond);font-size:15px;font-weight:700;letter-spacing:.14em;color:var(--tx)}

  /* ── exercise rows ───────────────────────────── */
  .ex{border-bottom:1px solid var(--line);transition:background .2s}
  .ex:last-child{border-bottom:none}
  .ex.open{background:var(--surface-hi)}
  .ex-row{display:flex;align-items:center;min-height:58px}
  .ex-main{flex:1;min-width:0;text-align:left;padding:11px 2px 11px 0}
  .ex-n{font-size:14.5px;font-weight:600;line-height:1.3;transition:color .2s}
  .ex-sr{font-size:11.5px;color:var(--tx-3);margin-top:3px;font-weight:500}
  .ex-c{padding:0 16px 14px 54px;font-size:13px;color:var(--tx-2);line-height:1.6;animation:rise .22s ease}
  .chev{width:44px;height:58px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .chev svg{transition:transform .25s cubic-bezier(.22,1,.36,1);color:var(--tx-3)}
  .ex.open .chev svg{transform:rotate(180deg);color:var(--tx-2)}

  .cbx{width:54px;height:58px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .cbx-b{
    width:24px;height:24px;border-radius:8px;border:2px solid var(--line-2);
    display:flex;align-items:center;justify-content:center;
    transition:all .2s cubic-bezier(.22,1,.36,1);
  }
  .cbx:active .cbx-b{transform:scale(.85)}
  .cbx-b svg{opacity:0;transform:scale(.4);transition:all .2s cubic-bezier(.34,1.56,.64,1)}
  .cbx-b.on svg{opacity:1;transform:scale(1)}

  .strike{color:var(--tx-3);text-decoration:line-through;text-decoration-thickness:1.5px}

  /* ── notes / callouts ────────────────────────── */
  .note{border-radius:14px;padding:13px 15px;font-size:13px;line-height:1.6;color:var(--tx-2)}
  .note strong.k{font-weight:700}

  /* ── rows in list cards ──────────────────────── */
  .lrow{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
  .lrow:last-child{border-bottom:none}
  .lkey{font-family:var(--cond);font-size:12px;font-weight:700;letter-spacing:.06em;flex-shrink:0}
  .lval{font-size:12.5px;color:var(--tx-2);line-height:1.55}
  .fine{font-size:11.5px;color:var(--tx-3);line-height:1.55}

  /* ── pain scale ──────────────────────────────── */
  .pain{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
  .pain button{
    height:42px;border-radius:10px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--tx-2);
    font-family:var(--cond);font-weight:700;font-size:15px;transition:all .16s;
  }
  .pain button:active{transform:scale(.9)}

  /* ── gate banner ─────────────────────────────── */
  .gate{border-radius:14px;padding:14px 15px;font-size:13.5px;font-weight:600;line-height:1.55}
  .gate-h{font-family:var(--cond);font-size:15px;font-weight:800;letter-spacing:.1em;margin-bottom:6px}

  /* ── flag rows ───────────────────────────────── */
  .flag{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
  .flag:last-child{border-bottom:none}
  .flag-b{width:19px;height:19px;border-radius:6px;border:2px solid var(--line-2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .18s}
  .flag-t{font-size:12.5px;color:var(--tx-2);line-height:1.5}

  /* ── inputs ──────────────────────────────────── */
  .lab{font-size:9.5px;color:var(--tx-3);font-weight:700;letter-spacing:.13em;text-transform:uppercase;display:block;margin-bottom:6px}
  .inp{
    width:100%;height:50px;padding:0 12px;
    background:var(--surface-hi);border:1px solid var(--line);border-radius:12px;
    font-size:19px;font-weight:700;font-family:var(--cond);letter-spacing:.04em;
    text-align:center;outline:none;color:var(--tx);transition:all .18s;
  }
  .inp::placeholder{color:var(--tx-3);font-weight:600;letter-spacing:.06em}
  .inp:focus{border-color:var(--blu);background:rgba(59,130,246,.07);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}
  input[type=date].inp{font-size:15px;letter-spacing:0}
  .btn{
    height:50px;border-radius:12px;background:linear-gradient(180deg,#fafbfc,#e6e9ee);color:#0a0c11;
    font-family:var(--cond);font-size:15px;font-weight:800;letter-spacing:.13em;
    display:flex;align-items:center;justify-content:center;transition:transform .14s,opacity .14s;
  }
  .btn:active{transform:scale(.975);opacity:.88}
  .btn:disabled{opacity:.4}
  .btn-ghost{
    border:1px solid var(--line);background:none;color:var(--tx-3);
    font-size:12.5px;padding:10px 20px;border-radius:11px;font-weight:600;
  }
  .btn-ghost:active{background:rgba(255,255,255,.05)}

  .chipw{font-size:11.5px;color:var(--tx-2);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;padding:6px 10px}

  .stat{text-align:center;padding:11px 4px;border-radius:12px}
  .stat-l{font-size:10px;font-weight:700;letter-spacing:.1em;font-family:var(--cond);opacity:.85}
  .stat-v{font-family:var(--cond);font-size:19px;font-weight:800;margin-top:2px;letter-spacing:.02em}

  /* ── bottom tab bar ──────────────────────────── */
  .tabbar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:520px;z-index:60;display:flex;
    padding-bottom:env(safe-area-inset-bottom);
    background:rgba(7,8,11,.86);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    backdrop-filter:blur(24px) saturate(180%);
    border-top:1px solid var(--line);
  }
  .tab{
    flex:1;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    color:var(--tx-3);position:relative;transition:color .2s;
  }
  .tab.on{color:#fff}
  .tab::before{
    content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:0;height:2.5px;border-radius:0 0 3px 3px;background:var(--org);transition:width .28s cubic-bezier(.22,1,.36,1);
  }
  .tab.on::before{width:36px}
  .tab-l{font-family:var(--cond);font-size:11px;font-weight:700;letter-spacing:.14em}
  .tab svg{transition:transform .2s}
  .tab.on svg{transform:translateY(-1px)}

  button:focus-visible{outline:2px solid var(--org);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useMemo,useRef}=React;

/* ═══════════════════════════════════════════════════════════════════════
   BLUE LINE PREP — v6 "Academy Build"
   MCCC Municipal Police Academy · Act 120 / MPOETC · class opens MON 4 JAN
   2027 (Jan–Jun cohort, Mon–Fri days plus Sundays on the firearms range).

   WHY v5 WAS RETIRED
   v5 was a pre-entrance PFT taper and "ready-and-hold" tool. That test was
   run on 21 Sep 2026 — push-ups 26 and sit-ups 35 (BOTH STOPPED AT THE
   STANDARD, so they are floors, not maxes), 300 m 54 s, 1.5 mi 13:12 — and
   he is in. The problem is now different, in this priority order:
     1. Hold every standard WITH BUFFER, all the way through the academy —
        MPOETC requires the 30th percentile be maintained until completion.
        Train to the goal column, not the pass column.
     2. Arrive on 4 Jan with shins that survive formation runs, daily PT and
        drill in boots. A footwear change plus a running spike is the classic
        academy MTSS trigger, so BOTH are progressed before day one.
     3. Get measurably stronger.  4. Lose fat while keeping muscle.
   Phase A build (Oct 12 – Dec 20) · Phase B arrival taper (Dec 21 – Jan 3)
   · Phase C academy (Jan 4 →), where academy PT is logged and counted.

   STANDARDS — verified 9 Oct 2026. Male, 18–29.
     • MPOETC Physical Fitness page (current): 30th percentile = sit-ups 35
       · 300 m 62.1 s · push-ups 26 · 1.5 mi 13:16. Order sit-ups → 300 m →
       push-ups → 1.5 mi, ≥5 min rest, all inside two hours. The standard
       must be maintained "throughout your time in the academy"; graduation
       is an obstacle course with three attempts.
       https://www.pa.gov/en/agencies/mpoetc/programs/training/basic-police-officer-training/physical-fitness.html
     • MPOETC "Physical Fitness Assessment Standards — Entrance and Retention
       in the Act 120 Police Academy" (2024 chart): 35 / 62.1 / 26 and the
       retention rule. (Its 1.5-mile row did not extract cleanly — not used.)
       https://www.policeapp.com/Jobs/customer-files/MPOETC-Fitness-Charts-2024.pdf
     • MPOETC FAQ (Mar 2014, Cooper 2013 norms): entry 1.5 mi 13:15; the
       then-GRADUATION standard at the 50th percentile, 20–29 male = sit-ups
       40 · 300 m 56.0 · push-ups 33 · 1.5 mi 11:58. Superseded as a
       graduation rule by the obstacle course — but the 50th percentile is
       precisely the "real buffer" the goal column asks for, so it IS the
       goal column.
       https://www.policeapp.com/Jobs/customer-files/FAQs-Regarding-Physical-Fitness-Tests-and-Standards.pdf
     • MCCC academy page: 35 / 62.1 / 26 / 1.5 mi in 13:08.
       https://www.mc3.edu/degrees-and-programs/municipal-police-academy
   13:16 vs 13:08 — RESOLVED: 13:16 is the commission's current standard and
   the one shown as the pass line. 13:08 appears only on MCCC's program page
   and matches no MPOETC document found (the 2014 FAQ says 13:15). His 13:12
   was accepted on 21 Sep, which is consistent with 13:16 being applied. The
   app flags 13:08 rather than hiding it — and the goal (11:58) clears both
   by a margin that makes the question moot.
   NOT VERIFIED, so NOT GUESSED: the obstacle-course events, how often MCCC
   re-tests inside the academy, and the graduation date. Enter test dates as
   they are announced; the taper engine fires off whatever you enter.

   SAFETY MODEL.
   The old ≤3/10 "acceptable pain" gate came from Silbernagel 2007, which
   studied ACHILLES TENDINOPATHY. MTSS sits on the bone stress continuum,
   where the standard for impact loading is pain-free. So the gate is split:
   impact runs at 0/10, or at ≤2/10 that settles with a 0/10 morning (see
   impactGate — tightened on the PT review); rehab strength may run in the
   1–3/10 band. A
   next-morning (first-steps) check and a 7-day trend rule were added —
   a same-day scalar cannot tell "3/10 that clears by breakfast" from
   "3/10 every day for three weeks", and that distinction is the injury.
   ═══════════════════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════════════════
   v7 — 4 NOV 2026 REVISION. Read blue-line-prep/HANDOFF.md before editing:
   it holds the rationale, every source, the decision rules and the rules
   for changing this file without breaking his logged history.

   WHAT v7 CHANGED (from Week 5, Mon 9 Nov 2026 — see V7_FROM):
     • STANDARD CORRECTED. The 1.5-mile line for his class is 13:16 — the
       state's current page, its 2024 chart, and MCCC's own application
       packet for the January 2027 class (p.21). 13:08 was the state's 2023
       chart; only MCCC's web page still shows it. Everything above that says
       otherwise is history.
     • ENGINE. Two hard bike sessions a week (4 × 4 min; threshold) instead
       of one, 110–170 bike/row min, 10–14 min a week at goal pace, two
       time trials before the mock (14 Nov, 5 Dec).
     • LIFTING. Three upper-body sessions for size (10–17 hard sets per
       muscle a week, last sets near failure) and two short lower sessions.
     • PUSH-UPS / SIT-UPS. Test-pace intervals Monday, volume with a failure
       set Wednesday, a 60-second max of each every Friday.
     • SHINS. His call: no daily pain ratings and no "rate first" lock. Pain
       is reported BY EXCEPTION from the Shins card; "Swap the run" is always
       there. Run caps stay; fast minutes are capped too.
     • The daily battery became a 3-minute pre-run primer; the unproven
       extras came out (neck holds, hip-flexor holds, short-foot, get-ups…).
   Weeks 1–4 build exactly as before — check-offs are positional.
   ═══════════════════════════════════════════════════════════════════════ */

const STORE="blp-v6";
const V5_STORE="blp-v5";
const LEGACY_STORE="blp-v4";
/* v5 counted from Mon 24 Aug 2026. Mon 12 Oct is EXACTLY seven weeks later,
   so every v5 week-keyed record shifts by −7 and lands on its true date —
   pain history stays inside the 7-day trend rule across the changeover
   instead of silently resetting it. */
const V5_SHIFT=7;

/* ── calendar ─────────────────────────────────────────────────────────── */
const START=new Date(2026,9,12);            // Mon 12 Oct 2026 = Week 1 Day 1
const ACADEMY_WK=13;                         // Mon 4 Jan 2027 = academy day one
const TAPER_WKS=[11,12];                     // Mon 21 Dec – Sun 3 Jan
/* Jan–Jun cohort per MCCC; the graduation date is not published, so the
   calendar runs to Sun 27 Jun 2027 and stops rather than inventing one. */
/* v6.2 (head-coach review, 2 Nov 2026 — blue-line-prep/REVIEW.md): the
   calendar ends the week of graduation (~Mon 7 Jun 2027, Week 35). */
const TOTAL_WEEKS=35;
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
/* v6.2 changes start at Week 5. Weeks 1–4 were already trained and their
   check-offs are keyed by item POSITION (trackKeys), so those weeks keep
   building exactly as they did — nothing he logged is orphaned. */
/* 2 Nov 2026 (his call): no deload in Week 4 — the program ADVANCES a
   week instead. The old Weeks 5–10 run one calendar week earlier (Week 4
   onward), the Thanksgiving-week deload moves to Week 6 (16 Nov), and
   Week 10 (14 Dec) gets one more small step (66 min, longest 25) before
   the arrival taper, whose dates are fixed. */
const NEW_FROM=4;
const isNew=w=>w>=NEW_FROM;
/* v7 (4 Nov 2026): the Stage-2 revision starts Week 5 (Mon 9 Nov). Week 4
   was in progress when it was written, so Week 4 and everything before it
   keeps building exactly as it did. NEVER lower this number: every week
   below it has positional check-offs on his phone. */
const V7_FROM=5;
const isV7=w=>w>=V7_FROM;
/* Fresh 1.5-mile time trials before the academy: Sat 14 Nov and Sat 5 Dec.
   The mock PFT (Tue 22 Dec) is the third read, in test order. */
const TT_WKS=[5,8];
const TT_TARGET={5:"12:55",8:"12:35"};
/* 3:1, with the second deload pulled one week early onto Thanksgiving week
   (Nov 23–29): a holiday week you will under-train anyway is a free deload,
   and it leaves three straight build weeks into the taper. In the academy
   the 3:1 governs only YOUR supplemental work — academy PT does not deload
   because you would like it to. */
/* v6.2: academy deloads 16/20/24/28. Week 32 is no longer a whole-week
   deload — the graduation peak gives it a running unload instead (T−14). */
/* 2 Nov 2026: Week 4 is NOT a deload — his call ("I don't need a deload
   this week"). It repeats Week 3; the next easy week is Week 7. */
const DELOADS=[6,16,20,24,28];
const isDeload=w=>DELOADS.includes(w);

/* The REFERENCE for the ≤10% / ≤+5 min audit is the highest of the last four

const refWeeks=w=>{const o=[];let p=w-1;while(p>=1&&o.length<4){if(!isStepOver(p))o.push(p);p--;}return o;};

const RUN_CEIL={13:60,14:64,15:70,17:75,18:80,19:85,21:88,22:92,23:96,25:100,26:105,27:110,29:110,30:110,31:110};

/* PT days (0=Mon … 4=Fri). Default Tue/Thu until MCCC publishes the real
   schedule — set on the Plan tab. Template: 2 = up to 2 PT days, 3 = three,
   4 = four or five (no own running at all). */
const PT_DAYS_DEFAULT=[1,3];
const ptTemplateOf=(n,pick)=>pick&&pick!=="auto"?pick:(n>=4?"4":n===3?"3":"2");
const dayTypeOf=(d,pt)=>pt.includes(d)?"pt":(d>0&&pt.includes(d-1))?"after":(d<4&&pt.includes(d+1))?"before":"free";
/* The own easy run goes on the first weekday that never makes three run days
   in a row (PT days and Saturday count as run days), preferring a day that is
   not straight after PT. */
function easyRunDayOf(pt){
  const ok=d=>{const run=new Set([...pt,5,d]);for(let x=0;x<=4;x++)if(run.has(x)&&run.has(x+1)&&run.has(x+2))return false;return true;};
  const c=[0,1,2,3,4].filter(d=>!pt.includes(d)&&ok(d));
  return c.find(d=>!pt.includes(d-1))??c[0]??null;
}
const runCeil=w=>w<ACADEMY_WK?WEEK_MIN_CAP:(RUN_CEIL[w]||null);
/* Planning assumption for academy running: 30 min per PT day until three
   academy weeks are logged (plan at the high estimate). */
const ACAD_PER_PT=30;
function ownRunAcademy(w,acadExp,ref,ptN,prevOwn){
  if(w<ACADEMY_WK+2||ptN>=4)return{own:0,easy:0};
  if(isDeload(w)){const o=Math.floor(0.5*(prevOwn||0));return{own:o>=8?o:0,easy:0};}
  if(w>=32)return{own:0,easy:0};              // graduation peak writes its own running
  /* Room = the ceiling, AND ≤10% / ≤+6 min over the highest of the last four
     counted weeks. The smallest own run is 8 min (easy + strides) — with a
     12-min minimum the room never opened and the total jumped +21% later. */
  const ceil=runCeil(w)||110;
  let room=Math.min(ceil-acadExp,1.1*ref-acadExp,ref+6-acadExp);
  if(w===23)room=Math.min(room,0.7*(ceil-acadExp));   // provisional assessment window: −30%
  /* v7: the floor is 6 min (it was 8). Week 12 now ends on 60 min, so with
     an 8-min floor the 10% rule left 6 min of room in Week 15 and the door
     never opened — his own running would have stayed at zero all academy. */
  if(room<6)return{own:0,easy:0};
  if(ptN===3)return{own:Math.floor(Math.min(room,25)),easy:0};   // one run, no easy run
  /* Quality run first (≤20 run-min of it reps + warm-up). A leftover too
     small for its own run (<12) is added to the quality run as easy minutes
     (≤28 total); otherwise it becomes a separate easy run (≤20). */
  if(room-20>=12)return{own:20,easy:Math.floor(Math.min(20,room-20))};
  return{own:Math.floor(Math.min(28,room)),easy:0};
}
/* Sequential, because each week's room depends on the previous counted
   week's total. acadLogged = {week: logged academy running minutes}. Only
   weeks BEFORE w feed w's expectation; w's own log, once it exists, is the
   actual. ownTotals = {week: own prescribed minutes} for weeks < academy. */
function academyWeeks(acadLogged,assume,ownTotals,ptN){
  const out={};
  const n=ptN==null?2:ptN;
  const total=w=>out[w]?out[w].total:(ownTotals[w]||0);
  for(let w=ACADEMY_WK;w<=TOTAL_WEEKS;w++){
    /* v6.2: the assumption holds until THREE academy weeks are logged, then
       the highest of the last three. The LARGER, never the mean — planning
       against the academy's bigger week keeps the part he controls from
       ever being what breaks the ramp rule. */
    const prior=Object.keys(acadLogged).map(Number).filter(x=>x<w&&x>=ACADEMY_WK).sort((a,b)=>b-a).slice(0,3);
    const exp=prior.length>=3?Math.max(...prior.map(x=>acadLogged[x])):Math.max(assume,...prior.map(x=>acadLogged[x]));
    const rw=refWeeks(w);
    const r=ownRunAcademy(w,exp,rw.length?Math.max(...rw.map(total)):exp,n,out[w-1]?out[w-1].own+out[w-1].easy:0);
    const act=acadLogged[w];
    out[w]={acadExp:Math.round(exp),acadLogged:act==null?null:act,own:r.own,easy:r.easy,
      total:Math.round((act!=null?Math.max(act,exp):exp)+r.own+r.easy)};
  }
  return out;
}

/* ── duty-boot progression ──────────────────────────────────────────────

   lower than running, which is why boots progress faster than running; it
   is still gated 0/10 during AND next morning like any weight-bearing load.
   Two walks a week on non-running days — Tue + Fri, moving to Tue + Thu
   once Friday becomes a run day in Week 8. Minutes per walk; Week 1 is

const BOOT_MIN={1:0,2:10,3:15,4:20,5:25,6:20,7:30,8:35,9:40,10:40,11:30,12:30};

   errands, with 10 min of marching at ~120 steps/min and some stairs. The
   full-day rehearsal is Sat 26 Dec — NOT Jan 2: a first full day in boots
   48 h before day one is itself a spike. */
const BOOT_HOURS={5:2,6:2,7:3,8:4,9:5,10:5,12:3};

/* ── surface progression ────────────────────────────────────────────────
   Formation runs are on asphalt; he trains on grass, track and the TrueForm.
   A surface change is a load change, so asphalt arrives on the long run in
   ≤6-minute steps (PT review: v6.0 jumped 12 → 22 asphalt minutes in Week 8,

/* v7: Weeks 5 and 8 are time trials on the track, so the road steps run
   6 → 11 → (TT) → 17 → 23, then all 26 min on the road on Sat 2 Jan. No
   injury trial supports stepping the surface; it is kept because it is
   already his routine and costs nothing. */
const ASPHALT={4:5,5:0,6:6,7:11,8:0,9:17,10:23,11:99,12:99};
const surfaceOf=(w,mins)=>{const a=ASPHALT[w]||0;
  return a===0?"grass or track (TrueForm for no more than half of it through Week 4 — curved treadmills push you onto the forefoot)":a>=mins?"all on asphalt — the formation-run surface":`first ${a} min on asphalt, the rest on grass or track`;};
/* Formation pace is unknown (ask the academy). Group runs commonly sit near
   9:30–10:30/mi, which is threshold effort for an 11:00+/mi easy runner, so
   the last few minutes of the Week 8–10 Saturday run are run at ~10:00/mi
   on asphalt. Inside the minutes, never added to them. */
const FORMATION={7:6,9:8,10:10};

/* ── cadence retraining ─────────────────────────────────────────────────

   low-quality trial), and a +5–10% step rate measurably lowers per-step
   load (Heiderscheit 2011). Three 1-minute blocks a week (v6.0) does not
   change a habit, so: Weeks 1–4 metronome for the whole easy part of every
   run; Weeks 5–8 on the Wednesday and Saturday runs; Week 9 on, just check
   on the long run that the new rate has held. */
const cadNote=(w,dow)=>w<=4?" Run the easy part to a metronome app set a little quicker than your normal steps (about 5–7% more steps a minute, e.g. 160 → 170)."
  :w<=8?(dow===2||dow===5?" Metronome on for the easy part today (your quicker step rate).":"")
  :(dow===5?" Check on the Watch that your steps per minute stayed at the quicker rate.":"");

/* ── barbell strength, driven by e1RM ─────────────────────────────────── */
const LIFTS=[
  {k:"squat",n:"Back Squat"},{k:"bench",n:"Bench Press"},{k:"dl",n:"Deadlift"},
  {k:"ohp",n:"Overhead Press"},{k:"sol",n:"Soleus Raise (bent-knee)"},
];
/* Epley. Valid to ~12 reps; past that it overstates, so the input caps there. */
const epley=(wt,r)=>wt*(1+Math.min(r,12)/30);
const rnd5=x=>Math.round(x/5)*5;
/* THE e1RM ESTIMATE — rewritten on the coach review. v6.0 ran Epley on the
   raw top set, but the app tells him to stop that set ~3 reps short of
   failure, so every log UNDER-read and the loads drifted DOWN by design
   (205 × 7 logged as e1RM 253 against a true ~275 → week 2 lighter than
   week 1). Now:
     • reps are adjusted for reps-in-reserve: Epley(wt, reps + (10 − RPE));
       a log without an RPE is treated as RPE 10 (raw, the conservative read)
     • logs from deload or taper weeks never move it — sets there are
       deliberately easy and say nothing about capacity
     • it rises on any higher reading, but only FALLS after two consecutive
       readings ≥5% below it, and then to the higher of those two — one bad
       day in a deficit should not cut next week's loads. */
const e1Of=x=>epley(+x.wt,+x.reps+(10-(x.rpe!=null&&x.rpe!==""?+x.rpe:10)));
/* v6.2 (S&C review): one optimistic "reps left" can move e1RM ~11%. From
   2 Nov 2026 a single session can raise it by at most 5%. Earlier entries
   are read exactly as before, so no logged history changes. */
const E1_CAP_FROM="2026-11-02";
/* v7: from Week 5 only the two mock/arrival weeks are "easy" for lifting.
   The light RUNNING weeks (6, and 16/20/24/28 in the academy) lift as
   normal — scheduled lifting deloads have no outcome evidence (Bell 2023;
   Coleman 2024) — so their logs count. Weeks 1–4 are read exactly as before. */
const isEasyLog=x=>!!x.re||(x.week!=null&&(isTaperWk(x.week)||(!isV7(x.week)&&isDeload(x.week))));
function e1Track(entries){
  let cur=null,lows=[];
  /* With no build-week log yet, an easy-week log SEEDS the number — the
     deload's "work up to a set of 5" was the first log for most lifts, and
     ignoring it left the lift blank with no loads at all. */
  const counted=entries.filter(x=>!isEasyLog(x));
  if(!counted.length&&entries.length)return Math.max(...entries.map(e1Of));
  counted.forEach(x=>{
    let v=e1Of(x);
    if(cur!=null&&v>1.05*cur&&x.iso&&x.iso>=E1_CAP_FROM)v=1.05*cur;
    if(cur==null||v>=cur){cur=v;lows=[];}
    else if(v<0.95*cur){lows.push(v);if(lows.length>=2){cur=Math.max(...lows);lows=[];}}
    else lows=[];
  });
  return cur;
}
/* Phase A wave as [sets, reps, %e1RM]. LOADS CLIMB BECAUSE e1RM CLIMBS: log
   the last set of every session with its RPE, and next session's loads are
   computed from it. Nothing adds weight on a calendar alone, which is what
   a deficit-proof progression needs. */
/* v6.2 (S&C review): capped at 85%. None of the four tests rewards a 1RM, and
   90% doubles in the peak running week are risk without return. */
const WAVE={1:[3,5,.75],2:[4,5,.775],3:[4,4,.825],4:[4,5,.80],5:[4,4,.825],6:[2,5,.70],
  7:[4,5,.80],8:[4,3,.85],9:[3,3,.85],10:[3,3,.85],11:[2,3,.80],12:[2,2,.80]};
/* Academy: two short sessions, rotating 5s / 3s / 4s at 80–85%, top set
   capped at RPE 8 — enough to hold and slowly build on top of academy PT,
   never enough to compete with it. Weeks 13–14 are 2×3 at 75% with no top
   set at all (coach review): the first fortnight is for absorbing a load
   nobody here controls, and Week 12 already ended on 2×2. */
const waveOf=w=>w<ACADEMY_WK?WAVE[w]:(w<ACADEMY_WK+2?[2,3,.75]:isDeload(w)?[2,5,.70]:[[3,5,.80],[3,3,.85],[3,4,.825]][(w-ACADEMY_WK)%3]);
const easyLiftWk=w=>isDeload(w)||isTaperWk(w)||(w>=ACADEMY_WK&&w<ACADEMY_WK+2);
function liftSr(k,w,e1,note){
  const[s,r,p]=waveOf(w), e=e1&&e1[k];
  const push=easyLiftWk(w)?" · easy week — no extra reps"
    :w>=ACADEMY_WK?" · stop every set with 2 reps left · log the last set"
    :" · if the last set felt like 3+ reps left, do 1–2 extra reps on it · log the last set (weight, reps, reps left)";
  if(!e)return `Work up to 1 set × 5 reps with about 2 reps left in the tank · 2–3 min rest between warm-up sets · log it in Records → Lift Log; every load after this is calculated from it${note?" · "+note:""}`;
  return `${s} sets × ${r} reps @ ${rnd5(p*e)} lb · 2–3 min rest${push}${note?" · "+note:""}`;
}
/* Heavy slow soleus work at a true 8RM ≈ e1RM ÷ (1 + 8/30). */
const solSr=(w,e1)=>{const e=e1&&e1.sol;const sets=easyLiftWk(w)?2:(w>=ACADEMY_WK?3:4);
  return e?`${sets} sets × 6–8 reps @ ~${rnd5(e/(1+8/30))} lb · 90 s rest · 3 s lowering · when every set reaches 8, add 10 lb and log it`
          :`${sets} sets × 6–8 reps · 90 s rest · heavy (about 2 reps left), 3 s lowering · log the weight in Records → Lift Log`;};

/* ══ v7 LIFTING (Week 5 on) — size up top, maintenance below ═════════════
   The v6.2 wave (4 × 3–5 at 80–85%, each lift once a week) holds strength
   and cannot build visible size: muscle gain rises with weekly hard sets
   (Schoenfeld 2017; Pelland 2026) and with sets ended near failure
   (Robinson 2024). Endurance work interferes mainly with the LEGS and
   mainly inside the same session (Schumann 2022; Petré 2021), so the upper
   body takes the volume and the legs keep one short heavy exposure per
   lift — which is enough to hold strength (Androulakis-Korakakis 2020).
     Bench, overhead press  4 × 6 at ~77.5% of e1RM, last set to one rep
                            short of failure (the logged set moves e1RM)
     Squat, deadlift        3 × 5 at ~80%, two reps always left
     Accessories            3 sets in the 8–20 range, last set to failure
   Volume by week (vol7): "ramp" Weeks 5–6 (one set fewer, nothing to
   failure — a new exercise list in a deficit), "full" Weeks 7–10, "lite"
   the mock and arrival weeks and the first two academy weeks (about two-
   thirds, nothing to failure), "acad" the rest of the academy (3 sets). */
const LIFT7={bench:[4,6,.775],ohp:[4,6,.775],squat:[3,5,.80],dl:[3,5,.80]};
const vol7=w=>isTaperWk(w)||(w>=ACADEMY_WK&&w<ACADEMY_WK+2)?"lite":w<=6?"ramp":w>=ACADEMY_WK?"acad":"full";
function liftSr7(k,e1,vol,note){
  const[s0,r,p]=LIFT7[k], e=e1&&e1[k], upper=k==="bench"||k==="ohp";
  const s=vol==="lite"?(upper?3:2):vol==="acad"?3:s0;
  const tail=vol==="lite"?" · leave 2–3 reps in every set this week · log the last set"
    :upper?" · last set: as many clean reps as you can, stopping 1 short of failure (5–8 is the range) · log that set (weight, reps, reps left)"
          :" · stop every set with 2 reps left · log the last set";
  if(!e)return `Work up to 1 set × 5 reps with about 2 reps left in the tank · 2–3 min rest between warm-up sets · log it in Records → Lift Log; every load after this is calculated from it${note?" · "+note:""}`;
  return `${s} sets × ${r} reps @ ${rnd5(p*e)} lb · 2–3 min rest${tail}${note?" · "+note:""}`;
}
const acc7=(sets,reps,vol,cue)=>{
  const n=vol==="ramp"||vol==="lite"?Math.max(2,sets-1):vol==="acad"?Math.min(3,sets):sets;
  const effort=vol==="lite"?"leave 2 reps in every set":vol==="ramp"?"last set 1 rep short of failure":"last set to failure";
  return `${n} sets × ${reps} reps · 60–90 s rest · ${effort}${cue?" · "+cue:""}`;};
const sol7=(e1,sets)=>{const e=e1&&e1.sol;
  return e?`${sets} sets × 6–8 reps @ ~${rnd5(e/(1+8/30))} lb · 90 s rest · 3 s lowering · when every set reaches 8, add 10 lb and log it`
          :`${sets} sets × 6–8 reps · 90 s rest · heavy (about 2 reps left), 3 s lowering · log the weight in Records → Lift Log`;};
const chin7=(sets,grip)=>`${sets} sets × (your best set minus 2) reps · 90 s rest · ${grip} · under 5 clean reps? slow negatives, or feet on a box · past 10, add weight`;
function upper7(which,e1,vol){
  const pullSets=vol==="full"?4:3;
  if(which==="A")return[{id:"bench",sr:liftSr7("bench",e1,vol)},{id:"chin",sr:chin7(pullSets,"overhand or neutral grip")},
    {id:"inclineDB",sr:acc7(3,"8–12",vol)},{id:"latRaise",sr:acc7(3,"12–20",vol)},{id:"triExt",sr:acc7(3,"10–15",vol)}];
  if(which==="B")return[{id:"ohp",sr:liftSr7("ohp",e1,vol)},{id:"bbRow",sr:acc7(4,"8–12",vol)},
    ...(vol==="full"||vol==="ramp"?[{id:"chin",sr:chin7(3,"underhand grip today")}]:[]),
    {id:"rearDelt",sr:acc7(3,"15–20",vol)},{id:"curl",sr:acc7(3,"8–12",vol)},{id:"shrug",sr:acc7(3,"10–15",vol)}];
  return[{id:"dbPress",sr:acc7(3,"8–12",vol)},{id:"row",sr:acc7(3,"8–12",vol,"per arm")},{id:"latRaise",sr:acc7(4,"12–20",vol)},
    {id:"curl",sr:acc7(3,"10–15",vol,"back and forth with the triceps")},{id:"triExt",sr:acc7(3,"10–15",vol)},
    {id:"carry",sr:"3 sets × 40 m · 60 s rest · heaviest dumbbells you can hold without your grip opening"}];
}
const lowerA7=(e1,vol)=>[{id:"squat",sr:liftSr7("squat",e1,vol)},{id:"calfSol",sr:sol7(e1,vol==="lite"?2:vol==="acad"?3:4)},
  {id:"tibRaise",sr:"2 sets × 15–20 reps · 45 s rest · 3 s lowering"}];
const lowerB7=(e1,vol)=>[{id:"dl",sr:liftSr7("dl",e1,vol)},{id:"splitSq",sr:"2 sets × 8 reps / leg · 60–90 s rest"},
  {id:"calfStr",sr:"3 sets × 8–12 reps · 90 s rest · 3 s lowering · add 5–10 lb when you get 3 × 12"},{id:"kneeRaise",sr:"3 sets × 10–15 reps · 60 s rest"}];

/* ══ v7 PUSH-UPS AND SIT-UPS (Week 5 on) ═════════════════════════════════
   The evidence is thin, so this follows the little there is: practising
   the test movement beats bench training for push-up scores (Kotarsky
   2018), bench strength explains about a fifth of them (Mayhew 1991), and
   sets taken to failure build repetition endurance better (Izquierdo 2006).
     Mon  test pace: timed intervals at the rate the NEXT target needs
     Wed  volume: 4 sets at 65% of max, the last to failure · sit-up sprints
     Fri  THE TEST: 60 s of sit-ups all-out, 5 min, 60 s of push-ups all-
          out — before lifting. Every dose reads the latest logged max.
   No Friday max on 18 Dec (the mock is four days later). */
const PU_INT={5:[3,30],6:[3,30],7:[3,35],8:[3,35],9:[2,45],10:[2,45],12:[2,30]};
const puRate=m=>Math.min(46,m+5), suRate=m=>Math.min(54,Math.max(46,m+6));
const FRI_MAX_WKS=[5,6,7,8,9];
function calis7(day,w,pm,sm){
  if(day==="mon"){const[n,sec]=PU_INT[w]||[3,30],pr=puRate(pm),sr=suRate(sm);
    return[{id:"puIso",sr:`${n} sets × ${sec} s at ${pr} a minute (≈${Math.round(pr*sec/60)} reps) · ${sec>=45?"90":"60"} s rest · a metronome helps · rest only at the top, arms locked`},
           {id:"suIso",sr:`1 set × 45 s at ${sr} a minute (≈${Math.round(sr*0.75)} reps) · full test form · rest only sitting up`}];}
  if(day==="wed")return[{id:"puClust",sr:`4 sets × ${Math.max(6,Math.round(0.65*pm))} reps · 60 s rest · after the pressing · LAST set: keep going to failure`},
                        {id:"suLadder",sr:`5 sets × 15 s ALL-OUT, 45 s rest · aim for ${Math.max(11,Math.round(suRate(sm)/4))}+ full-range reps each`}];
  if(day==="fri")return[{id:"suAmrap",sr:"1 set · 60 seconds, max reps · FIRST, before any lifting, at least 90 min after waking · full test form: fingers interlocked behind the head, elbows to knees, shoulder blades to the floor, rest only sitting up · log it in Records"},
                        {id:"puAmrap",sr:"1 set · 60 seconds, max reps · 5 min after the sit-ups · chest to a fist, rest only at the top with arms locked · log it in Records — every push-up and sit-up dose rescales from these two numbers"}];
  /* "pace": an easy rehearsal inside four days of the mock. */
  return[{id:"suIso",sr:`1 set × ${Math.round(0.6*sm)} reps at ${suRate(sm)} a minute · easy — the mock PFT is Tuesday`},
         {id:"puIso",sr:`1 set × ${Math.round(0.6*pm)} reps at ${puRate(pm)} a minute · easy — the mock PFT is Tuesday`}];
}

/* ══ v7 BIKE (Week 5 on) ═════════════════════════════════════════════════
   Two hard sessions a week, never more. Reps of 2–4 min adding up to 15+
   min of hard work are the best-supported format for aerobic power
   (Helgerud 2007; Wen 2019), and cycling training moved run performance
   about as much as running did in seven small trials (Menges 2026) — so
   the intensity lives here, where it costs the tibia nothing. It does NOT
   fully replace running (Pierce 1990), which is why the goal-pace run and
   the time trials stay. The 30/15s are gone (tested in trained cyclists).
   In a time-trial week the 4 × 4 goes on Tuesday and Thursday is lighter. */
const BK7={
  v44:"40 min · 10 min warm-up · 4 × 4 min hard at Power Zone 5 (about 105–110% of FTP, effort 9/10 — too hard to talk), 3 min easy between · easy to finish",
  v54:"45 min · 10 min warm-up · 5 × 4 min hard at Power Zone 5 (about 105–110% of FTP, effort 9/10 — too hard to talk), 3 min easy between · easy to finish",
  v43:"35 min · 10 min warm-up · 4 × 3 min hard at Power Zone 5 (effort 9/10), 3 min easy between · easy to finish",
  t:(n,m,tot)=>`${tot} min · 10 min warm-up · ${n} × ${m} min at Power Zone 4 (about 90–95% of FTP, effort 7/10 — hard but steady), 3 min easy between · easy to finish`,
};
/* tue / thu: [label, text] · fri: easy-ride minutes (0 = none) · sat: minutes
   on the bike or rower straight after the run (after a time trial it is a spin). */
const BIKE7={
  5:{tue:["4 × 4 Bike",BK7.v44],thu:["Threshold Bike",BK7.t(2,10,35)],fri:25,sat:25},
  6:{tue:["Threshold Bike",BK7.t(3,8,45)],thu:["4 × 3 Bike",BK7.v43],fri:0,sat:30},
  7:{tue:["Threshold Bike",BK7.t(3,10,50)],thu:["4 × 4 Bike",BK7.v44],fri:0,sat:40},
  8:{tue:["4 × 4 Bike",BK7.v44],thu:["Threshold Bike",BK7.t(2,12,40)],fri:25,sat:25},
  9:{tue:["Threshold Bike",BK7.t(2,15,50)],thu:["5 × 4 Bike",BK7.v54],fri:20,sat:40},
  10:{tue:["Threshold Bike",BK7.t(2,20,60)],thu:["5 × 4 Bike",BK7.v54],fri:20,sat:40},
};

/* ══ THE CALISTHENICS ENGINE ═══════════════════════════════════════════
   Rewritten 4 Sep 2026 after a full staff review (research + PT), revised
   for v6. The three defects it fixed still stand as rules:

     1. NOTHING EVER APPROACHED FAILURE. Sets of 30 s at cadence sat ~10
        reps in reserve — the flat region of every published proximity-to-
        failure dose-response curve. It matters here because a push-up at
        his bodyweight is about 64% of body mass (Ebben 2011, JSCR; Gouvali
        & Boudolos put it near 66%) — ~155 lb per rep at 245 — which makes it
        a LOW-LOAD exercise for him, and low load is the one case where the
        evidence puts effort clearly ahead of volume (Lasevicius 2022;
        Schoenfeld & Grgic 2021).
     2. THE DOSE NEVER READ HIS MEASURED MAX. Every dose below is computed
        from the most recent logged 60-second max.
     3. HE NEVER PERFORMED THE ACTUAL EVENT. v5 fixed that with a weekly
        all-out Monday. v6 changes it, deliberately: the all-out AMRAP runs
        every 3–4 weeks (RETEST_WKS, the mock PFT, academy tests), and the
        weeks between carry an event-specific INTERRUPTED SET at goal cadence
        instead — the full movement, the legal rest positions, the cadence,
        without a weekly failure exposure on top of four lifting days.

   Ceilings are the LOWER of an absolute number and a multiple of the
   measured max, so a small max can never be handed a large relative dose. */
/* Seeded from the 21 Sep entry test. BOTH WERE STOPPED AT THE STANDARD, so
   they are floors: the Week-1 Monday AMRAP replaces them before any dose has
   had time to matter. */
const PU_BASE=26, SU_BASE=35;

/* PT ceilings, 4 Sep 2026. Deliberately generous: if a written week ever
   HITS one of these, the week is wrong, not the ceiling. Ramp caps matter
   more than the absolute ones — the documented adverse event for a heavy,
   motivated athlete moving fast on high-rep trunk work is rhabdomyolysis,
   not a disc. */
const capOf=(m,abs,mult)=>Math.min(abs,Math.round(mult*m));
const puCaps=m=>({wk:capOf(m,350,13),sess:capOf(m,90,3.5),roll72:Math.round(0.45*capOf(m,350,13)),set:Math.floor(0.70*m)});
const suCaps=m=>({wk:capOf(m,350,12),flex:capOf(m,450,15),test:capOf(m,250,8.5),sess:capOf(m,100,3.5),set:20});

/* ── the cadence, and an honest label on it ────────────────────────────
   33/min held for 60 s IS 33 push-ups — the goal; 40/min IS 40 sit-ups. The
   cadence is a PACING TARGET and a training tool. It is NOT a validated
   claim about the optimum: there is no study of pacing for a fixed-time
   max-rep test, and the nearest literature (Jones 2008 — cycling time-to-
   exhaustion 174 s from a fast start vs 128 s even-paced) runs the other
   way. The retests record 15-second splits because his own decay curve is
   the only evidence that will ever exist on the question. */
const PU_CAD=33, SU_CAD=40;
/* v6.2 (S&C review): the cadence was set exactly AT the goal, so it held no
   margin. From Week 5 the training pace is 36/min push-ups and 45/min sit-ups
   (46 from Week 8, 48 in the academy). Weeks 1–4 keep their numbers. */
const puCad=w=>!isNew(w)?PU_CAD:36;
const suCad=w=>!isNew(w)?SU_CAD:w>=ACADEMY_WK?48:w>=8?46:45;
const CADENCE={pu:"36–38 reps/min",su:"45–48 reps/min"};

/* Sub-maximal cluster sets. Weekly VOLUME stays roughly flat; the set size
   rises as a fraction of measured max, 55% → 70%, because for low-load work
   effort progresses better than volume. Log a new max and every dose below
   rescales itself. On a deload the set size is 85% of the PRIOR week's —
   v6.0 let a deload week raise reps per set (Week 4: 3×20 after 5×18). */
const clusterPct=w=>w<=2?0.55:w<=3?0.60:w<=6?0.65:0.70;
const setPct=w=>isDeload(w)?0.85*clusterPct(w-1):clusterPct(w);

/* Taper multiplier on sub-maximal volume. Frequency is HELD throughout —
   dropping to one session a week is how you arrive detrained. */
const calisTaper=d=>d==null?1:(d>10?1:(d>=5?0.5:(d>=3?0.4:(d>=2?0.4:0))));

/* ── THE WEEK (Phase A) ────────────────────────────────────────────────
   dow 0=Mon … 6=Sun. Sit-ups live in the PM wherever there is one — the
   app's own rule is "not within 90 min of waking", and v6.0 scheduled every
   sit-up session first thing in the morning.
     Mon  AM goal-pace run · PM Upper A → push-up clusters → sit-up interrupted set
     Tue  Lower A (squat, heavy soleus) + jumps + boots · PM rower
     Wed  short run + speed · PM bike, then push-up interrupted set + sit-up ladder
     Thu  Lower B (deadlift) + jumps (+ boots from Wk 8) · PM the one hard bike
     Fri  (Wk 8+: AM short run) · Upper B → push-up clusters → durability → sit-up technique (+ boots to Wk 7)
     Sat  long easy run
     Sun  rest + weekly objective screen
   Retest weeks: Monday AM becomes the test-order rehearsal (sit-ups → bike
   sprint → push-ups), at least 90 min after waking, and Monday PM loses its
   clusters.
   THREE sit-up sessions, not four (coach review): ~270 anchored reps a week
   in flat 20-rep sets was volume for its own sake; the gap from 35 to 40 is
   technique and late-minute speed, so Friday adds one over-cadence set.

   Satisfied by construction: 3 push-up and 3 sit-up sessions a week · days
   with zero pressing (Tue, Thu, Sat, Sun) · days with zero loaded spinal
   flexion (Tue, Thu, Sat, Sun) · the two heaviest sit-up sessions ≥48 h
   apart (Wed, Fri) · no barbell pressing inside 24 h BEFORE a push-up max
   · push-ups always AFTER the pressing on a shared day, never before. */
const PU_DAYS=[0,2,4], SU_DAYS=[0,2,4];
/* Academy: PT already hands you push-ups and sit-ups most days. Yours are one
   pacing touch on Thursday evening, plus the retest on a deload Saturday. */
const PU_DAYS_C=[3], SU_DAYS_C=[3];
/* Per-day sub-maximal REP TARGETS as fractions of the binding weekly ceiling,
   so they shrink with the measured max. */
const PU_TGT=[0.26,0,0,0,0.26,0,0];
const SU_TGT=[0,0,0.33,0,0,0,0];
const NECK_DAYS=[0,2,4], HIPF_DAYS=[1,4];
const SIM_DOW=0;
const isRetestMon=(w,d)=>d===SIM_DOW&&RETEST_WKS.includes(w);

/* Sets derived from a budget; the 2-set floor gives way to smaller reps
   rather than overshooting the day's budget at a large max. */
function calisSets(budget,reps,minReps,sessCap){
  let sets=Math.round(budget/reps);
  if(sets<2){ reps=Math.max(minReps,Math.floor(budget/2)); sets=2; }
  sets=Math.max(1,Math.min(sets,Math.floor(sessCap/reps)));
  return[sets,reps];
}
/* The interrupted set, counted in BLOCKS so the numbers add up: 10 reps at
   goal cadence, then a 5 s hold in the legal rest position, repeated. v6.0
   wrote "44 s at 33/min — 10 reps, 5 s hold, repeat", which ends half-way
   through the second hold. Blocks ≈ 80% of the measured max, 2–4 of them. */
const isoBlocks=m=>Math.max(2,Math.min(4,Math.round(0.8*m/10)));
/* ONE FORMAT for every set-based line in the app (his request, Oct 14):
   "4 sets × 18 reps · 45–60 s rest", then at most one short cue. The
   "3 blocks of 10 reps … (~70 s)" wording was correct but hard to follow
   mid-workout; the detail lives in the expanded library text instead. */
const setLine=(sets,reps,rest,cue)=>`${sets} ${sets===1?"set":"sets"} × ${reps} reps${sets>1&&rest?` · ${rest} rest`:""}${cue?` · ${cue}`:""}`;
/* The pace set: the event at goal cadence, short of failure — written as a
   plain set of N reps with the pace and the pause as the one cue. */
/* Reps are a straight percentage of the measured max — 70% push-ups, 75%
   sit-ups (coach review). Whole blocks of 10 made the set jump from 65% to
   94% of max the day a push-up retest logged 32, and froze sit-ups at 30
   for any max from 33 to 43. */
const isoSr=(m,cad,sets,hold)=>{const r=Math.max(10,Math.round((hold==="crunched"?0.75:0.70)*m)),at=[10,20,30].filter(x=>x<r);
  return setLine(sets,r,"3 min",`one rep per metronome beat (${cad}/min) · ${hold==="crunched"?"sit up and hold":"hold the top, arms locked,"} 5 s at rep${at.length>1?"s":""} ${at.join(" and ")}`);};

function puFor(m,w,dow,dTest){
  const c=puCaps(m), t=calisTaper(dTest);
  /* D-1 and test day: nothing — neck and hip-flexor work are gated with it. */
  if(dTest!=null&&dTest<=1)return null;
  if(dTest===2){const cad=isV7(w)?puRate(m):PU_CAD;return{id:"puPacing",sr:setLine(2,Math.min(Math.floor(0.7*m),Math.round(cad/2)),"90 s",`pace ${cad}/min · last touch before the test, easy`)};}
  if(t===0||isTaperWk(w))return null;      // the arrival taper writes its own, smaller doses
  if(isAcademy(w)){
    if(dow===5&&isDeload(w)&&!(dTest!=null&&dTest<=10))
      return{id:"puAmrap",sr:"1 set · 60 seconds, max reps · 5 min after the sit-ups · film it or have someone call out 15/30/45 s"};
    if(!PU_DAYS_C.includes(dow))return null;
    return{id:"puIso",sr:isoSr(m,PU_CAD,1,"locked-arm")};
  }
  if(!PU_DAYS.includes(dow))return null;
  if(isRetestMon(w,dow)){
    if(dTest!=null&&dTest<=10)
      return{id:"puPacing",sr:`1 set × ${Math.round(0.6*m)} reps at ${PU_CAD}/min · NO max effort inside 10 days of a test.`};
    return{id:"puAmrap",sr:`1 set · 60 seconds, max reps · 5 min after the bike sprint · film it or have someone call out 15/30/45 s${w===1?" · your true baseline (9/21 stopped you at 26)":""}`};
  }
  if(dow===2)return{id:"puIso",sr:isoSr(m,PU_CAD,isDeload(w)?1:2,"locked-arm")};
  const budget=Math.max(12,c.wk*PU_TGT[dow]*t*(isDeload(w)?0.6:1));
  const[sets,reps]=calisSets(budget,Math.max(6,Math.min(c.set,Math.round(setPct(w)*m))),6,c.sess);
  if(dow===4)return{id:"puClust",sr:setLine(sets,reps,"45–60 s",`after the pressing · sets 1–${Math.ceil(sets/2)} on parallettes, the rest on the floor · if you can't finish a set with ~3 left, do fewer reps`)};
  return{id:"puClust",sr:setLine(sets,reps,"45–60 s","after the bench · if you can't finish a set with ~3 left, do fewer reps")};
}

function suFor(m,w,dow,dTest){
  const c=suCaps(m), t=calisTaper(dTest);
  if(dTest!=null&&dTest<=1)return null;
  if(dTest===2){const cad=isV7(w)?suRate(m):SU_CAD;return{id:"suPacing",sr:setLine(2,Math.min(Math.floor(0.7*m),Math.round(cad/2)),"90 s",`pace ${cad}/min · last touch before the test, easy`)};}
  if(t===0||isTaperWk(w))return null;
  if(isAcademy(w)){
    if(dow===5&&isDeload(w)&&!(dTest!=null&&dTest<=10))
      return{id:"suAmrap",sr:"1 set · 60 seconds, max reps · first, at least 90 min after waking · film it or have someone call out 15/30/45 s"};
    if(!SU_DAYS_C.includes(dow))return null;
    return{id:"suIso",sr:isoSr(m,SU_CAD,1,"crunched")};
  }
  if(!SU_DAYS.includes(dow))return null;
  if(isRetestMon(w,dow)){
    if(dTest!=null&&dTest<=10)
      return{id:"suPacing",sr:setLine(2,Math.min(20,Math.round(0.7*m)),"90 s",`pace ${SU_CAD}/min · no max effort inside 10 days of a test`)};
    return{id:"suAmrap",sr:`1 set · 60 seconds, max reps · first hard thing today, at least 90 min after waking · film it or have someone call out 15/30/45 s${w===1?" · your true baseline (9/21 stopped you at 35)":""}`};
  }
  if(dow===0)return{id:"suIso",sr:isoSr(m,SU_CAD,isDeload(w)?1:2,"crunched")};
  if(dow===4){
    const r=Math.min(20,Math.round(0.55*m));
    /* From Week 5 one fast set: 22 reps ≈ 30 s at 45/min, faster than the
       goal cadence so 40/min feels roomy late in the minute. */
    const over=w>=5&&!isDeload(w)?" · then rest 2 min and do 1 set × 22 reps fast but clean (aim ~30 s)":"";
    return{id:"suPacing",sr:setLine(2,r,"75 s",`one rep per beat at 40/min, slow and exact${over}`)};
  }
  const budget=Math.max(12,c.test*SU_TGT[dow]*t*(isDeload(w)?0.6:1));
  const[sets,reps]=calisSets(budget,Math.max(6,Math.min(c.set,Math.round(setPct(w)*m))),6,c.sess);
  return{id:"suLadder",sr:setLine(sets,reps,"45–60 s","test position · stop each set with ~3 left")};
}

/* ── exercise libraries ───────────────────────────────────────────────── */
const SHIN_EX={
  tender:  {n:"Posteromedial Tenderness Map",sr:"Both tibiae · measure in cm · photograph",c:"Palpate the distal two-thirds of the posteromedial border, top to bottom. Mark the ends of any tender segment in pen, measure it, and photograph it with a ruler in frame. Half the flare protocol cannot run without this number, because nobody can tell whether tenderness has INCREASED if nobody measured what it was. A documented zero is a baseline. Diffuse tenderness over 5 cm that warms up is consistent with MTSS; a focal spot under 5 cm is a red flag."},
  tibRaise: {n:"Tib Raises — Anterior Shin",sr:"3 sets × 15–25 reps · 45 s rest · 3 s lowering",c:"Back against a wall, heels about 12 inches out, weight on them. Pull your toes up toward your shins as hard as you can, hold a beat at the top, lower over 3 seconds. \n\nLoad it once 25 reps is easy: hang a dumbbell or a plate over your toes, or use a tib bar. This should burn along the FRONT of the shin — that is the point, and it is a different muscle from the one that hurts on your inner edge.\n\nHonest framing: the strongest MTSS evidence sits on the calf and hip work. Anterior tib strengthening is standard practice and cheap insurance, and it earns its place on eccentric control of foot-strike rather than on trial data."},
  dorsiBand:{n:"Banded Dorsiflexion",sr:"3 sets × 20–25 reps / foot · 30 s rest",c:"Sit with the foot off a bench, band looped over the top of the foot and anchored in front. Pull the toes toward your face against the band, lower slowly. \n\nPairs with tib raises — same muscle, different angle and a longer range. Two to three sets, stop well short of cramping."},
  shortFoot:{n:"Short Foot — Arch Dome",sr:"2 sets × 8 reps / foot · hold each 5 s · no rest needed",c:"Seated, then standing, then single-leg: dome the arch by drawing the ball of the foot toward the heel WITHOUT curling the toes, hold 5 s. Foot-intrinsic strength for arch control under fatigue — the thing that goes first late in a formation run.\n\nHonest framing: it improves mechanics; the one RCT on foot-intrinsic training did not move MTSS pain on its own (p=.17), so it is part of the battery, not the fix. The toe-yoga half stays OUT, at your request — this is the dome only, three days a week."},
  balance:  {n:"Single-Leg Balance",sr:"3 sets × 30–45 s / leg · switch legs, no other rest",c:"Soft knee, hips level. Progress eyes open → eyes closed → foam pad. Neuromuscular/balance training is the single strongest evidence-backed MTSS prevention intervention there is — do not skip it because it feels easy."},
  ankleMob: {n:"Knee-to-Wall Mobility",sr:"2 sets × 10 reps / leg · no rest needed",c:"Heel pinned to the floor, drive the knee over the toes toward the wall. Aim for symmetry side to side. Restricted dorsiflexion is an MTSS risk factor."},

  calfStr:  {n:"Calf Raise – Straight Knee",sr:"3 sets × 6–10 reps · 90 s rest · heavy enough that 10 is hard, 3 s lowering · once you get 3 × 10, add 5–10 lb",c:"Full range off a step edge. 1s up, 1s hold, 3s down. Load it properly — you own a barbell, so use it."},
  hipAbdL:  {n:"Hip Abduction + Rotation (band or DB)",sr:"3 sets × 10–12 reps / side · 45 s rest",c:"Banded or DB-loaded, through range — not a static hold. Hip abductor weakness is an association-level risk factor, so this is insurance rather than proven treatment, but it is cheap insurance."},
  splitSq:  {n:"Split Squat (front foot on a step)",sr:"3 sets × 6–12 reps / leg · 60–90 s rest",c:"Front foot on a 4–8 inch step, back foot on the floor behind you. Drive the front knee forward over the toes to depth, stand up through the whole foot.\n\nThis is the single-leg loading the calf raises do not give you — it hits the hip, knee and ankle chain together under real load. Add dumbbells as it gets easy."},
  slRDL:    {n:"Single-Leg RDL",sr:"3 sets × 8–10 reps / leg · 60 s rest",c:"Hinge to near-parallel, drive the free knee up without touching down. Hips stay level."},
  solEnd:   {n:"Soleus Endurance Set",sr:"2 sets / leg × as many reps as you can, stopping 1–2 short · 60 s rest",c:"Bent-knee single-leg raises to near-failure. The soleus is ~80% slow-twitch — it needs stamina as well as strength."},
  smr:      {n:"Soft-Tissue Release",sr:"3–4 min per lower leg",c:"Foam roller or ball on the CALF and peroneals — slow, 3–4 minutes per side. Then a ball under the arch for the plantar fascia.\n\nDo NOT roll directly on the posteromedial tibial border where your tenderness map is drawn. That is bone and periosteum, not muscle — pressing on an irritated attachment site does not release anything, it just hurts and can inflame it further. Work the muscle bellies around it.\n\nHonest framing: soft-tissue work reliably improves short-term range of motion and comfort. It is NOT established that it changes MTSS outcomes. It earns its four minutes on symptom relief and mobility, not on cure."},
  slHop:    {n:"Single-Leg Hop Screen",sr:"10 hops / leg · must be pain-free",c:"Not training — a GATE. Ten controlled single-leg hops must be 0/10. Pain here is a stop sign, and it is one of the screens that separates MTSS from a stress fracture."},
  pogo:     {n:"Jump Prep · Pogos, Jacks, Burpees",sr:"see dose",c:"Getting the shins ready for academy PT, where jumping jacks and jump burpees come in the hundreds. Pogos: stiff ankles, small quick hops on the balls of the feet, soft and quiet landings. Jacks: easy rhythm, land softly. Jump burpees: chest to the floor, small jump at the top.\n\nOn a flat, forgiving surface (gym floor, mat, grass) in your training shoes, 60 s rest between sets. Pain-free only: this only appears when the last 7 days were clean, and any shin pain during it ends the session — swap nothing in, just stop. Stop a set the moment landings get loud or sloppy."},
  heelTest: {n:"Calf Capacity Test",sr:"single-leg heel raises to fatigue, each leg",c:"Straight knee, off a step edge, metronome at 30/min (1 s up, 1 s down), full range, fingertips on the wall for balance only. Count reps until you cannot keep the rhythm or the range. Both legs.\n\nTarget by Dec 13: 30+ straight-knee and 25+ bent-knee per side, the two legs within 10% of each other (raised in v6.2 — 25 was low for 245 lb). Low calf endurance is associated with MTSS (Madeley 2007). Record the numbers by updating the Baseline Screen on the Records tab (Heel raises L / R)."},
  /* v7: replaces the 8-minute daily battery on run days. Honest framing: no

  primer:   {n:"Pre-Run Primer",sr:"3 min · calf raises 2 × 15 · tib raises 1 × 15 · 30 s single-leg balance per leg",c:"Three minutes before every run, in your running shoes: two sets of 15 calf raises, one set of 15 tib raises against a wall, then 30 seconds balancing on each leg.\n\nIt replaced the 8-minute daily battery on 9 Nov. No exercise has good trial evidence for preventing shin splints, so this is a warm-up for the calf and shin, not protection. The protection is in the caps: no run more than 10% longer than your longest of the last 30 days, and fast running kept small. The heavy calf work that used to sit here now lives in Tuesday's and Thursday's lifting."},

/* Shared so the two heaviest sit-up sessions carry the cues too — they
   used to live only on the lightest day of the week. */
const SU_CUES="\n\nTHE TWO CUES THAT ARE WORTH MORE THAN THE TRAINING. First: DROP, do not lower. A controlled descent is eccentric work you are not scored on and can legally delete — it is the AbMat bounce you already own. Second: THE HANDS ARE A HAT, NOT A HANDLE — fingers interlaced, palms resting on the back of the head, zero pulling, eyes fixed on one spot on the ceiling, a fist-width gap between chin and chest, exhale on the way up. Under fatigue the hands become a handle, you yank the chin down, and the neck fails before the abs do.\n\nANCHOR WITH THE HEELS HOOKED and the ankle supported — never the toes wedged under something rigid. Knees at 90 degrees or a little more, heels drawn in toward you.\n\nNOT WITHIN 90 MINUTES OF WAKING. The disc is maximally hydrated and spinal bending stresses are highest in the first hour or two out of bed. It costs nothing to wait, and it doubles as test-day advice: be awake at least 90 minutes before your reporting time.";
const PACE_EX={
  puAmrap: {n:"Push-Ups — 60 s ALL OUT",sr:"see dose",c:"The set the whole lane exists to move. Full test standard: chest to a fist, full lockout, back flat, no worming. Rest ONLY at the top with elbows locked — going to the ground ends the event.\n\nRECORD FOUR SPLITS: reps at 15 s, 30 s, 45 s, 60 s. Not the total alone. Nobody has ever studied the optimal pacing for a fixed-time max-rep test, so your own decay curve is the only evidence that will ever exist on the question, and four numbers per retest is how you build it.\n\nAN HONEST NOTE ON THE LEGAL REST AT YOUR SIZE: the locked-arm top position is roughly 155 lb of isometric support for you. At 175 lb bodyweight it is about 110. That rest is worth materially less to you than the standard implies, so plan to use it EARLY and briefly rather than as a rescue late in the minute."},
  suAmrap: {n:"Sit-Ups — 60 s ALL OUT",sr:"see dose",c:"FIRST hard thing in the session, before the push-ups and anything else — that is the test order and this is a rehearsal of it.\n\nFull test position: feet anchored, fingers interlocked behind the head, elbows to the knees at the top, shoulder blades to the floor at the bottom. Rest only sitting up.\n\nRECORD FOUR SPLITS: 15 s, 30 s, 45 s, 60 s.\n\nThe goal is 45 or more, and it has to hold for six months of academy PT, not one morning. The reps that build that buffer most cheaply are technique reps, not fitness reps. Read the cues below and treat them as the actual program."+SU_CUES},
  puClust:{n:"Push-Up Sets",sr:"see dose",c:"Volume at a real effort. From 9 Nov this is Wednesday: four sets at about 65% of your latest max, and the LAST set keeps going to failure. Sets taken to failure build repetition endurance better than sets stopped early (Izquierdo 2006), and at your size a push-up is roughly 64% of bodyweight per rep (Ebben 2011) — light enough that effort matters more than volume.\n\nIf a set will not finish, cut the reps, never the rest. If an elbow or shoulder reaches 3/10, drop these sets first and keep Friday's max and the rows.\n\nElbows at about 45°, not flared to 90° — flare plus depth is what puts the front of the shoulder at risk. Chest to a fist is the standard AND the safe depth; do not chase the floor."},
  suLadder:{n:"Sit-Up Sets",sr:"see dose",c:"Full test position, sub-maximal, stopping well short of failure. No set here exceeds 20 reps — the only unbroken 60-second efforts are the retests.\n\nOptional extra: on the last two reps of a set, hold the sitting-up position for 5 seconds. That hold is the legal rest, and it is a hip-flexor isometric: fine-wire EMG (Juker 1998) puts psoas at 15–35% MVC in every sit-up variant against under 10% in a curl-up, and Szasz 2002 showed the hip flexors take over as the abdominals fatigue — with those reps still counting under the standard. Your hip flexors pay for the work AND for the rest, so they get trained on purpose."+SU_CUES},
  neckEnd:{n:"Neck Endurance",sr:"3 sets × 20–30 s chin-tuck hold · 30 s rest · then press your head into your hand 10 s front, back and each side",c:"Supine chin-tuck head lifts — heels of the hands off the floor, chin gently tucked, hold the head an inch up for 20–30 s. Then light 4-way isometrics against your own hand, 10 s each way.\n\nThis is not accessory work, it is probably costing you reps right now. In athletes with untrained necks the neck fails before the abdominals inside a 60-second maximal set, and the fix is two minutes three times a week. Neck strengthening also has decent evidence for reducing neck pain incidence in athletic populations."},
  hipFlexTol:{n:"Hip Flexor Tolerance",sr:"2 sets × 30 s hold / side",c:"Seated banded hip flexion, or a standing march isometric with the knee held above hip height. LOAD tolerance, not stretching — do not aggressively stretch an irritated psoas.\n\nWhy it is here: anchoring your feet is exactly what lets the hip flexors contribute, which is why the anchored sit-up produces more reps and why it is the tested standard. At 200+ anchored reps a week they are the most likely thing to get sore.\n\nAND IT FEEDS BACK INTO THE SHIN GATE: sore, guarded hip flexors change how you walk, altered gait changes tibial loading, and it will contaminate your next-morning first-steps reading. If hip flexor soreness is visibly changing your gait, halve that day's sit-ups and treat the day as non-impact whatever the shin score says."},
  puIso:   {n:"Push-Up Test-Pace Set",sr:"see dose",c:"Timed sets at the rate your NEXT target needs — a few more a minute than your current max. Set a metronome to the rate on the line and do one push-up per beat for the seconds shown. From 9 Nov these are Monday's work; Wednesday is volume and Friday is the 60-second max.\n\nFull test standard every rep: hands slightly wider than the shoulders, chest down to a fist (or elbows to 90°), back straight, full lockout. The state protocol allows rest ONLY in the up position, so if you need a breath take it at the top with the arms locked. Going to the knees or the floor ends the event on test day.\n\nWeeks 1–4 used an older version of this set at 33 a minute with a 5-second hold every 10 reps."},
  suIso:   {n:"Sit-Up Test-Pace Set",sr:"see dose",c:"One timed set at the rate your NEXT target needs. Metronome on, one sit-up per beat, for the seconds on the line.\n\nFull test standard: knees about 90°, feet flat and held, fingers interlocked behind the head (not on top of it, not on the neck), elbows touch the knees, shoulder blades touch the mat, hips stay down. Rest is legal only sitting up — lying back to rest ends the test.\n\nWeeks 1–4 used an older version at 40 a minute with a 5-second hold every 10 reps."+SU_CUES},
  suPacing:{n:"Sit-Up Technique Set",sr:"see dose",c:"Metronome at 40 bpm — ONE SIT-UP PER BEAT, and the beat is deliberately slower than you want to go. Feet anchored, fingers interlocked BEHIND THE HEAD (the MPOETC standard, and the harder variant — train it, not the arms-crossed version). Elbows touch the knees at the top, shoulder blades touch the floor at the bottom. Rest only in the UP position.\n\nTHE ONE TECHNIQUE CHANGE WORTH MORE THAN ANY TRAINING: stop lowering yourself and start DROPPING. A controlled descent is eccentric work you are not scored on and can legally delete. It is the AbMat bounce you already own. Best estimate +2 to +4 reps on its own — the PT's judgement rather than a measured figure, but it is the cheapest gain on the board and it costs nothing to take.\n\nTHE HANDS ARE A HAT, NOT A HANDLE. Fingers interlaced, palms resting on the back of the head, ZERO pulling. Pick a spot on the ceiling and hold your eyes on it through every rep, and keep a fist-width gap between chin and chest. Exhale on the way up. Under fatigue the hands become a handle, you yank the chin down, and the neck fails before the abs do.\n\nANCHOR WITH THE HEELS HOOKED and the ankle supported — never with the toes wedged under something rigid. Knees at 90° or a little more, heels drawn in toward you.\n\nLAST 15 SECONDS: this is where the test is won. Shorten nothing — full elbows-to-knees, full shoulder-blades-down — because a rep that does not count costs you the rep AND the time. If you have to stop, stop SITTING UP, breathe twice, and go again.\n\nON THE CADENCE ITSELF, HONESTLY: 40/min held for a full minute is 40 sit-ups, but that leaves only a 5-rep margin over the academy standard and zero tolerance for one form reset. And there is no study of pacing for a fixed-time max-rep test — the nearest evidence (Jones 2008) actually favours fast starts. Even pacing is a starting hypothesis, not a rule — your retest counts tell you what suits you."},
  puPacing:{n:"Push-Up Easy Set",sr:"see dose",c:"Metronome at 33 bpm — ONE PUSH-UP PER BEAT. It will feel far too slow for the first 20 seconds. That is the point. Chest to a fist, full lockout at the top, no worming or kipping, back flat.\n\nUSE THE LOCKED-ARM REST DELIBERATELY — resting at the top with elbows extended is legal and expected, and using it on purpose is worth more than the cadence itself. Never rest on the ground; that ends the test.\n\nAn earlier 25-in-40-seconds was 37.5/min: too fast out, then a stall. 33/min for the full minute IS 33 push-ups — the 50th-percentile goal — so the cadence is the target."},
};

  squat:   {n:"Back Squat",sr:"see dose",c:"Sequence barbell work FIRST in any shared session to protect neuromuscular quality. In a deficit, cut volume and keep the load — intensity is what preserves strength."},
