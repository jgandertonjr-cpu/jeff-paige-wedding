              <strong style={{color:"#fbbf24"}}>1.5-mile note:</strong> MCCC's own program page lists 13:08; the commission's current standard is 13:16, and 13:16 is what your 13:12 was accepted against. Train as if 13:08 were the line — the goal clears both.
            </div>
          </div>

          <div className="card pad" style={{marginBottom:12}}>
            <div className="h-card" style={{marginBottom:12}}>PACING TARGETS</div>
            <div className="lrow"><span className="lkey" style={{color:"#3b82f6",minWidth:68}}>PUSH-UPS</span><span className="lval">{CADENCE.pu} is the GOAL cadence — 33 in the minute. Your current max is {puMax}{puLogged?"":" (the 9/21 floor — retest Monday)"}, so open near {Math.min(PU_CAD,Math.round(puMax*0.95))}–{Math.min(PU_CAD,puMax)}/min and let the splits tell you whether a faster opening pays. Rest only at the top, elbows locked.</span></div>
            <div className="lrow"><span className="lkey" style={{color:"#a855f7",minWidth:68}}>SIT-UPS</span><span className="lval">{CADENCE.su} is the goal cadence; your current max is {suMax}{suLogged?"":" (the 9/21 floor)"}. Feet anchored, fingers interlocked behind the head. There is no evidence that even pacing beats a fast start on a fixed-time rep test — follow your own decay curve from the retest splits.</span></div>
            <div className="lrow"><span className="lkey" style={{color:"#f4640a",minWidth:68}}>1.5-MILE</span><span className="lval">Your last logged 1.5 is <strong style={{color:"var(--tx)"}}>{runPaces(run15).curT}</strong> ({runPaces(run15).curMi}). Interval pace is the next step: <strong style={{color:"var(--tx)"}}>{runPaces(run15).repMi}</strong> ({runPaces(run15).nextT} for 1.5). Goal 11:58 = {runPaces(run15).goalMi}. All of it updates when you log a new 1.5. Even pacing — do not bank time you will pay back on the last lap.</span></div>
            <div className="lrow"><span className="lkey" style={{color:"#f4640a",minWidth:68}}>300M</span><span className="lval">You ran {ENTRY_TEST.t300} s; the goal is ≤56. Through 200 m in ~36 s, then hold form. Controlled aggression, not a redlined first 100 — the 1.5 mile comes after the push-ups, and it is the event with the thin margin.</span></div>
          </div>

          <div className="card pad" style={{marginBottom:12}}>
            <div className="h-card" style={{marginBottom:12}}>SHINS · WHAT THE EVIDENCE SUPPORTS</div>
            {[["Load","Graded running exposure is the best-supported prevention there is — hence the ≤10% rule, the cap, and building toward academy load BEFORE January rather than meeting it there.","#22c55e"],
              ["Balance","Neuromuscular / balance training — the single strongest prevention signal in the file. Daily, ~2 min.","#22c55e"],
              ["Calf","Heavy slow soleus + straight-knee calf work: calf endurance deficits are associated with MTSS and the soleus attaches at the painful border. Logged, and it must climb.","#22c55e"],
              ["Cadence","+5–10% step rate measurably lowers per-step loading (Heiderscheit 2011), and gait retraining cut MTSS in army recruits (Sharma 2014). Metronome on every run in Weeks 1–4, two runs a week in Weeks 5–8, then a check that it held.","#22c55e"],
              ["Hips","Hip abductor / ER strength: association-level evidence — cheap insurance, on both lower days.","#f59e0b"],
              ["Feet","Toe flexors (FDL) daily; short-foot domes three days a week. Mechanics support, not a proven fix — the toe-yoga half stays out. If you have orthotics, wear them in the boots AND the running shoes: foot orthoses cut stress fractures in recruits (Bonanno 2017, RR 0.59); soft cushioned insoles did not.","#f59e0b"],
              ["Tib","Tib raises: standard practice and cheap, weak trial evidence — kept for eccentric control of foot-strike.","#f59e0b"],
              ["Jumps","Academy PT means hundreds of jumping jacks and burpees. Pogos → jacks → jump burpees from Week 3, ≤80 contacts, only on pain-free weeks — so January is not the first time.","#3b82f6"],
              ["Boots","One new variable at a time: boots on WALKS from Week 2, never on runs, ramping to 40 min; hours of standing and marching in them from Week 6; a full day on Dec 26. Asphalt arrives on the long run in ≤6-minute steps. Academy PT shoes in your rotation before January.","#3b82f6"],
              ["Sleep","7.5 h+ — under 8 h is linked to ~1.7× injury risk (Milewski 2014). From Dec 21, start waking at your academy wake-up time.","#3b82f6"],
              ["Weight","Higher BMI predicts both MTSS onset and slower recovery — the deficit is shin work too, which is exactly why shin symptoms shrink it.","#3b82f6"]].map(([k,v,c])=>(
              <div key={k} className="lrow"><span className="lkey" style={{color:c,minWidth:58}}>{k}</span><span className="lval">{v}</span></div>
            ))}
          </div>

          <div className="card pad" style={{marginBottom:12}}>
            <div className="h-card" style={{marginBottom:12}}>FLARE PROTOCOL</div>
            {[["Tier 1","Any impact-gate failure. Swap running for Zone 2 bike at equal duration, keep strength and neuromuscular work, re-gate daily. Typically about a week.","#f59e0b"],
              ["Tier 2","4–5/10, or the 7-day trend rule firing. No impact for a minimum of 7 days, reduce strength load ~30%, screen red flags. Typically 3–4 weeks.","#f43f5e"],
              ["Tier 3","Any red flag. Stop loading and get imaged before anything else.","#f43f5e"],
              ["Academy","You cannot swap the academy's run. Tell the PT staff the same day, use their injury pathway, and zero everything optional.","#3b82f6"],
              ["Return","Graded ladder on alternate days, advancing only on a 0/10 session AND a 0/10 next morning.","#22c55e"]].map(([k,v,c])=>(
              <div key={k} className="lrow"><span className="lkey" style={{color:c,minWidth:58}}>{k}</span><span className="lval">{v}</span></div>
            ))}
            <div className="fine" style={{marginTop:12}}>A flare in October or November is cheap — the bike carries the engine and there are weeks of slack. A second flare within six weeks means the plan is wrong: re-phase, do not retry the same progression.</div>
          </div>

          <div className="card pad" style={{marginBottom:12,background:"linear-gradient(180deg,#22c55e0d,transparent 55%),var(--surface)"}}>
            <div className="h-card" style={{marginBottom:12}}>TEST-DAY PLAYBOOK</div>
            {[["48h out","No lifting, no hard running. Sleep 8+ both nights. Maintenance calories or slightly above."],
              ["Morning of","Light breakfast 2–3 h before. Awake at least 90 minutes before reporting — spinal flexion stress is highest in the first hour out of bed."],
              ["Warm-up","Whatever they allow: easy jog, dynamic work, a few ascending strides, a few easy reps to prime — not to fatigue."],
              ["Sit-ups","DROP, do not lower. Hands are a hat, not a handle: eyes on one spot on the ceiling, fist-width gap at the chin, zero pulling. Rest only sitting up. Do not shorten a single rep in the last 15 seconds."],
              ["300m","Through 200 m in ~36 s, then hold form. 54 and 58 both pass; the difference is paid for in the 1.5 mile."],
              ["Push-ups","You will be winded — the closest study found no real rep decrement after a maximal sprint. Elbows at 45°, chest to a fist, take the locked-arm rest EARLY and briefly. Never rest on the ground."],
              ["1.5-mile",`Run it OFF YOUR WATCH — ${runPaces(run15).curHalf} at the half-mile (${runPaces(run15).curMi}, your last logged pace); if you are on it at the mile, empty the tank. After a maximal 300 m neither your legs nor your breathing tell you anything useful.`]].map(([k,v])=>(
              <div key={k} className="lrow"><span className="lkey" style={{color:"#4ade80",minWidth:68}}>{k}</span><span className="lval">{v}</span></div>
            ))}
          </div>
        </div>
      )}

      {/* ══════════ FUEL ══════════ */}
      {tab==="fuel"&&(
        <div className="pane" key="fuel">
          <div className="card pad" style={{marginBottom:12}}>
            <div className="h-card" style={{marginBottom:7}}>BODY STATS</div>
            <div className="fine" style={{marginBottom:12}}>Everything below scales off fat-free mass. A rough body-fat estimate is fine — 3% off moves the target by about a hundred calories. A weigh-in updates bodyweight and recalculates body fat assuming the loss was fat; re-estimate body fat every 4–6 weeks{body.bfAt&&daysBetween(parseISO(body.bfAt),todayMid())>35?<strong style={{color:"#fbbf24"}}> — yours is due</strong>:""}.</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div><label className="lab">Bodyweight</label><input className="inp" value={body.bw} onChange={e=>setBody(p=>({...p,bw:e.target.value,bfAt:isoOf(todayMid())}))} type="number" inputMode="decimal" placeholder="lbs"/></div>
              <div><label className="lab">Body fat</label><input className="inp" value={body.bf} onChange={e=>setBody(p=>({...p,bf:e.target.value,bfAt:isoOf(todayMid())}))} type="number" inputMode="decimal" placeholder="%"/></div>
            </div>
            <div style={{marginTop:10}}>
              <label className="lab">Training burn — kcal/day averaged over the week</label>
              <div style={{display:"flex",gap:8}}>
                <input className="inp" style={{flex:1}} value={body.ex} onChange={e=>setBody(p=>({...p,ex:e.target.value,exAt:isoOf(todayMid())}))} type="number" inputMode="decimal" placeholder="kcal"/>
                <button className="btn-ghost" style={{flexShrink:0}} onClick={()=>setBody(p=>({...p,exAt:isoOf(todayMid())}))}>Still right</button>
              </div>
              <div className="fine" style={{marginTop:8}}>Add up the <strong style={{color:"var(--tx-2)"}}>workout</strong> calories for the week — NOT the Move ring, which already counts your walking (the step setting below covers that) — divide by 7, then take off 15%: wearables overestimate exercise burn. Update it whenever training changes, and every couple of weeks in the academy.{exStale&&<> <strong style={{color:"#fbbf24"}}>{exAge==null?"Not confirmed yet":`Last updated ${exAge} days ago`} — {getPhase(Math.max(1,realWk)).id==="C"?"in the academy a stale number means maintenance until you update it.":"check it and tap Still right."}</strong></>}</div>
            </div>
            <div style={{marginTop:10}}>
              <label className="lab">Sleep — average hours a night, last 7 days</label>
              <input className="inp" value={body.sleep||""} onChange={e=>setBody(p=>({...p,sleep:e.target.value,sleepAt:isoOf(todayMid())}))} type="number" inputMode="decimal" placeholder="h"/>
              <div className="fine" style={{marginTop:8}}>Under 6.5 h caps the deficit at 250 kcal: in a deficit, short sleep takes the loss from muscle rather than fat, and it carries real injury risk. Aim for 7.5+. Re-enter it every couple of weeks{body.sleep&&!sleepFresh?<strong style={{color:"#fbbf24"}}> — your entry is over 14 days old and is being ignored until you update it</strong>:""}.</div>
            </div>
            <div style={{marginTop:12}}>
              <label className="lab">Daily movement outside training</label>
              <div style={{display:"grid",gap:6}}>
                {NEAT.map(o=>{
                  const on=body.neat===o.k;
                  return(
                    <button key={o.k} onClick={()=>setBody(p=>({...p,neat:o.k}))}
                      style={{textAlign:"left",padding:"11px 13px",borderRadius:11,fontSize:12.5,fontWeight:600,
                        background:on?"#22c55e18":"rgba(255,255,255,.04)",border:`1px solid ${on?"#22c55e55":"var(--line)"}`,
                        color:on?"#4ade80":"var(--tx-2)"}}>{o.n}</button>
                  );
                })}
              </div>
              <div className="fine" style={{marginTop:8}}>The single most consequential control on this screen — steps are the only thing that widens the deficit you can safely run. Move it honestly.</div>
            </div>
          </div>

          <div style={{marginBottom:12}}>
            <Note color={shin==="clear"?"#22c55e":shin==="symptomatic"?"#f59e0b":"#f43f5e"}>
              <strong className="k" style={{color:shin==="clear"?"#4ade80":shin==="symptomatic"?"#fbbf24":"#fb7185"}}>Shin status: {shin==="clear"?"CLEAR":shin==="symptomatic"?"SYMPTOMATIC":"FLARE"}.</strong>{" "}
              {shin==="clear"?"No tibial pain in the last 7 days and no flags — no shin cap on the deficit.":shin==="symptomatic"?`${trend} pain day${trend===1?"":"s"} in the last 7 — the deficit is capped at 250 kcal until a clean week.`:"Trend rule, red flag, failed gate or return-to-run active — maintenance calories until it clears."} Read from the same gates the Today tab uses.
            </Note>
          </div>

          {!nutri?(
            <Note color="#f59e0b">Enter bodyweight and body fat above to compute your intake range, protein target, and energy-availability floor.</Note>
          ):(
            <>
              <div className="card pad" style={{marginBottom:12,background:"linear-gradient(180deg,#22c55e0d,transparent 55%),var(--surface)"}}>
                <div className="h-card" style={{marginBottom:12}}>DAILY TARGETS</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8,marginBottom:12}}>
                  <div className="stat" style={{background:"#22c55e14",border:"1px solid #22c55e2e"}}>
                    <div className="stat-l" style={{color:"#22c55e"}}>INTAKE</div>
                    <div className="stat-v" style={{color:"#22c55e"}}>{nutri.intakeLo===nutri.intakeHi?nutri.intakeLo:`${nutri.intakeLo}–${nutri.intakeHi}`}</div>
                  </div>
                  <div className="stat" style={{background:"#3b82f614",border:"1px solid #3b82f62e"}}>
                    <div className="stat-l" style={{color:"#3b82f6"}}>PROTEIN</div>
                    <div className="stat-v" style={{color:"#3b82f6"}}>{nutri.proteinLo}–{nutri.proteinHi} g</div>
                  </div>
                  <div className="stat" style={{background:"#f59e0b14",border:"1px solid #f59e0b2e"}}>
                    <div className="stat-l" style={{color:"#f59e0b"}}>CARBS · FAT</div>
                    <div className="stat-v" style={{color:"#f59e0b"}}>~{nutri.carbG} · ≥{nutri.fatG} g</div>
                  </div>
                  <div className="stat" style={{background:"#a855f714",border:"1px solid #a855f72e"}}>
                    <div className="stat-l" style={{color:"#a855f7"}}>EXPECTED LOSS</div>
                    <div className="stat-v" style={{color:"#a855f7"}}>{nutri.lossLo===nutri.lossHi?nutri.lossHi:`${nutri.lossLo}–${nutri.lossHi}`} lb/wk</div>
                  </div>
                </div>
                <div className="fine">Est. TDEE {Math.round(nutri.tdee)} kcal (incl. {nutri.exKcal} from training) · fat-free mass {nutri.ffmLb.toFixed(0)} lb · deficit {nutri.defLo===nutri.defHi?nutri.defHi:`${nutri.defLo}–${nutri.defHi}`} kcal/day · {nutri.pctHi}% bodyweight per week · energy availability {nutri.eaLo.toFixed(0)}–{nutri.eaHi.toFixed(0)} kcal/kg FFM · protein {nutri.gPerKgFfm} g/kg FFM. Carbs are what is left after protein and the fat floor: put more of them on run, PT and test days (~{nutri.carbHard} g there) and fewer on rest days.</div>
              </div>

              <div style={{marginBottom:12}}>
                <Note color={nutri.override?"#f59e0b":nutri.capped?"#f59e0b":"#22c55e"}>
                  <strong className="k" style={{color:nutri.override||nutri.capped?"#fbbf24":"#4ade80"}}>Binding constraint: {nutri.binding}</strong>{" "}
                  {nutri.override?null:nutri.capped
                    ? <>The honest rate is <strong style={{color:"var(--tx)"}}>{nutri.lossHi} lb/week</strong>. 30 kcal/kg fat-free mass is a conservative floor — male thresholds are probably lower and less certain — but a bone-stress history earns the margin, and a stress fracture costs you the class while slow fat loss does not.<br/><br/><strong style={{color:"var(--tx)"}}>The counter-intuitive part:</strong> training harder does not shrink this cap and training less does not widen it — exercise cancels out of the energy-availability equation. The only lever is movement <em>outside</em> training. Your ceiling at this floor: <strong style={{color:"var(--tx)"}}>{nutri.tierPct[body.neat]}%/week</strong> at your current steps · {nutri.tierPct.target}% at 8–10k · {nutri.tierPct.active}% at 10–12k · {nutri.tierPct.high}% at 12k+. Anything from 0.4% up is a good rate.</>
                    : <>Energy availability stays above the floor, so the {nutri.wantPct}%/week target governs.</>}
                </Note>
              </div>

              <div className="card pad" style={{marginBottom:12}}>
                <div className="h-card" style={{marginBottom:12}}>HOW TO ACTUALLY EAT IT</div>
                <div className="lrow"><span className="lkey" style={{color:"#3b82f6",minWidth:62}}>SPLIT</span><span className="lval">Four meals of roughly {nutri.proteinMeal} g protein — or four of ~{Math.round((nutri.proteinLo+nutri.proteinHi)/2/4-10)} g plus ~40 g of slow protein (Greek yogurt, cottage cheese, casein) before bed.</span></div>
                <div className="lrow"><span className="lkey" style={{color:"#3b82f6",minWidth:62}}>MEAT</span><span className="lval">93/7 ground or leaner. Fattier grinds are the fastest way to eat the calorie budget without adding protein.</span></div>
                <div className="lrow"><span className="lkey" style={{color:"#f59e0b",minWidth:62}}>CARBS</span><span className="lval">Protect them around runs, hard sessions and academy PT. Never diet hard the day before a test.</span></div>
                <div className="lrow"><span className="lkey" style={{color:"#22c55e",minWidth:62}}>BONE</span><span className="lval">Get your vitamin D level (25-OH-D) checked now — aim for ≥30 ng/mL. Pennsylvania skin makes almost none October–March, so take D3 1,000–2,000 IU/day through the academy. Calcium 1,500–2,000 mg/day total, food first (dairy), any supplement in doses of 500 mg or less. In a Navy recruit trial (women), 2,000 mg calcium + 800 IU D cut stress fractures ~20%; in Army basic training a similar dose raised tibial bone density. A dairy-based meal ~90 min before hard sessions is a cheap extra.</span></div>
                <div className="lrow"><span className="lkey" style={{color:"#22d3ee",minWidth:62}}>FLUIDS</span><span className="lval">Pale urine is the target. After a sweaty session, ~1.25–1.5 L per kg of bodyweight lost, with some salt.</span></div>
                <div className="lrow"><span className="lkey" style={{color:"#22d3ee",minWidth:62}}>CAFFEINE</span><span className="lval">For a test: ~200–300 mg 45–60 min before — rehearsed in training first, never new on the day. Nothing after 2 pm; it costs sleep.</span></div>
                <div className="lrow"><span className="lkey" style={{color:"#22d3ee",minWidth:62}}>IRON</span><span className="lval">No iron supplement without a blood test (ferritin + CBC) — men can overload.</span></div>
                <div className="lrow"><span className="lkey" style={{color:"#a855f7",minWidth:62}}>ALCOHOL</span><span className="lval">1–4 drinks/week is fine on sleep and calories. Nothing within 24 h of a key session or test — holidays included.</span></div>
              </div>

              <div className="card pad" style={{marginBottom:12}}>
                <div className="h-card" style={{marginBottom:12}}>ACADEMY DAYS · EATING WHEN YOU DON'T CONTROL THE DAY</div>
                <div className="lrow"><span className="lkey" style={{color:"#3b82f6",minWidth:62}}>BEFORE</span><span className="lval">60–90 min before PT: oats or a bagel, a scoop of whey, a banana, milk (~80 g carbs, ~40 g protein). Under 30 min: 30–50 g fast carbs only.</span></div>
                <div className="lrow"><span className="lkey" style={{color:"#3b82f6",minWidth:62}}>PACKED</span><span className="lval">Two ready-to-drink protein shakes, jerky, Greek yogurt, fruit, milk. Eat on every break you get.</span></div>
                <div className="lrow"><span className="lkey" style={{color:"#3b82f6",minWidth:62}}>EVENING</span><span className="lval">A protein + carb meal within 2 h of the evening session.</span></div>
                <div className="lrow"><span className="lkey" style={{color:"#f43f5e",minWidth:62}}>RULE</span><span className="lval">Never make up a weekday of under-eating with a weekend deficit. If the week ran short, the weekend is maintenance.</span></div>
              </div>
            </>
          )}

          <div className="card pad" style={{marginBottom:12}}>
            <div className="h-card" style={{marginBottom:7}}>BODYWEIGHT TREND</div>
            {wt&&wt.pts.length>=2?(
              <>
                <div style={{display:"flex",alignItems:"baseline",gap:12,marginBottom:8}}>
                  <span style={{fontFamily:"var(--cond)",fontSize:32,fontWeight:800,lineHeight:1}}>{wt.trend.toFixed(1)}</span>
                  <span style={{fontSize:12,color:"var(--tx-3)"}}>lb trend{wt.pctWk!=null&&<> · <strong style={{color:wt.pctWk<-warnPct?"#fb7185":wt.pctWk<0?"#4ade80":"#fbbf24"}}>{wt.pctWk>=0?"+":""}{wt.pctWk.toFixed(2)}%/wk</strong> ({wt.lbWk>=0?"+":""}{wt.lbWk.toFixed(1)} lb/wk, last 21 days)</>}</span>
                </div>
                <Spark pts={wt.pts}/>
                <div className="fine" style={{marginTop:8}}>Green is the trend; grey dots are the daily readings it smooths. {wt.pctWk==null
                  ?"The rate appears once you have 6+ weigh-ins across at least two weeks — early water and glycogen loss would make any verdict wrong."
                  :wt.pctWk<-warnPct&&nutri&&nutri.defHi===0
                    ?"You are on maintenance now, but the last 21 days still include your previous deficit — give it two weeks before reading this rate."
                  :wt.pctWk<-warnPct
                    ?<strong style={{color:"#fb7185"}}>Faster than {warnPct}%/week, which is too fast for this phase — add 250–300 kcal, mostly carbs.</strong>
                    :wt.pctWk>0?"The trend is up — check the intake before the training. (After a deficit ends, 1–3 lb of water and glycogen comes back in the first week. That is not fat.)":"On target. Judge the rate over two weeks, never a single morning."}</div>
              </>
            ):<div className="fine">Log at least two weigh-ins on the Records tab and the trend appears here. Weigh every morning, same conditions — more readings make a faster, truer trend.</div>}
          </div>

          <div className="card pad" style={{marginBottom:12}}>
            <div className="h-card" style={{marginBottom:7}}>WHY THIS IS THE PERFORMANCE LEVER</div>
            <div style={{fontSize:12.5,color:"var(--tx-2)",lineHeight:1.6}}>
              Roughly <strong style={{color:"var(--tx)"}}>2 seconds per mile per pound.</strong> Fifteen pounds is ~45 seconds off the 1.5 mile — the biggest single lever on your thinnest event. It also lowers per-step tibial force and push-up load, and elevated BMI predicts both MTSS onset and prolonged recovery.<br/><br/>
              Rate matters more than size: in lean athletes, 0.7%/week built lean mass and lost more fat than 1.4%/week, which did not gain lean mass (Garthe 2011). Slower is not the cautious option — it is the better one.
            </div>
          </div>

          <Note color="#f43f5e">
            <strong className="k" style={{color:"#fb7185"}}>Deficit rules that override the numbers above.</strong> Shin symptoms in the last 7 days → ≤250 kcal. Flare, red flag or return-to-run → maintenance. Under 6.5 h sleep → ≤250 kcal. Trend faster than the phase's limit → eat more. Arrival taper (Dec 21 – Jan 3), the first two academy weeks, and any test inside its taper window → maintenance. The rest of the academy → ≤250 kcal, and maintenance if the training-burn number goes stale.
          </Note>
        </div>
      )}

      {/* ══════════ RECORDS ══════════ */}
      {tab==="records"&&(
        <div className="pane" key="records">
          <div className="card pad" style={{marginBottom:12,background:screenDone?undefined:"linear-gradient(180deg,#f43f5e14,transparent 55%),var(--surface)"}}>
            <div className="h-card" style={{marginBottom:7}}>BASELINE SCREEN {screenDone&&<span style={{color:"#4ade80",fontSize:12}}>✓ RECORDED</span>}</div>
            <div className="fine" style={{marginBottom:12}}>
              Do this once, write the numbers down, and keep the photo. Every Sunday re-measure compares against it.
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
              {[["tenderL","Tenderness L (cm)"],["tenderR","Tenderness R (cm)"],
                ["hopL","10 hops L (0–10)"],["hopR","10 hops R (0–10)"],
                ["raiseL","Heel raises L"],["raiseR","Heel raises R"]].map(([k,lbl])=>(
                <div key={k}>
                  <label className="lab">{lbl}</label>
                  <input className="inp" value={scr[k]} onChange={e=>setScr(v=>({...v,[k]:e.target.value}))} type="number" inputMode="decimal" placeholder="—"/>
                </div>
              ))}
            </div>
            <div className="fine" style={{marginBottom:12}}>
              <strong style={{color:"var(--tx-2)"}}>Tenderness:</strong> palpate the distal two-thirds of the posteromedial border, mark the ends of any tender segment in pen, measure it, photograph it with a ruler in frame. <strong style={{color:"var(--tx-2)"}}>A documented 0 is a valid baseline.</strong> Diffuse over 5&nbsp;cm that warms up is the MTSS pattern; a focal spot under 5&nbsp;cm is a red flag.<br/><br/>
              <strong style={{color:"var(--tx-2)"}}>Heel raises:</strong> single-leg to failure, straight knee. Symmetry within 10% matters more than the raw number.
            </div>
            <button className="btn" style={{width:"100%"}} onClick={()=>{
              const anyVal=Object.values(scr).some(v=>v!=="");
              if(!anyVal){window.alert("Enter at least one number — including a zero, which is a real result.");return;}
              setScreen({date:new Date().toLocaleDateString(),...scr});
            }}>{screenDone?"UPDATE SCREEN":"SAVE SCREEN"}</button>
            {screen&&(
              <div style={{marginTop:14}}>
                <div className="fine" style={{marginBottom:8}}>Recorded {screen.date} — compare every re-measure against this:</div>
                <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
                  {[["Tender L",screen.tenderL,"cm"],["Tender R",screen.tenderR,"cm"],["Hop L",screen.hopL,"/10"],["Hop R",screen.hopR,"/10"],["Raise L",screen.raiseL,""],["Raise R",screen.raiseR,""]]
                    .filter(([,v])=>v!=null&&v!=="").map(([l,v,u])=>(
                    <div key={l} className="chipw">{l} <span style={{fontWeight:800,color:"var(--tx)"}}>{v}{u}</span></div>
                  ))}
                </div>
              </div>
            )}
          </div>

          <div className="card pad" style={{marginBottom:12}}>
            <div className="h-card" style={{marginBottom:14}}>LOG A TEST</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
              {[[logPU,setLogPU,"Push-ups (1-min)","reps","number"],[logSU,setLogSU,"Sit-ups (1-min)","reps","number"]].map(([val,setter,label,ph2,type])=>(
                <div key={label}>
                  <label className="lab">{label}</label>
                  <input className="inp" value={val} onChange={e=>setter(e.target.value)} type={type} inputMode="numeric" placeholder={ph2}/>
                </div>
              ))}
              {[[logPUsp,setLogPUsp,"Push-up splits","15/30/45/60"],[logSUsp,setLogSUsp,"Sit-up splits","15/30/45/60"],
                [logRun,setLogRun,"1.5-Mile Run","MM:SS"],[log300,setLog300,"300m Run","SS.s"]].map(([val,setter,label,ph2])=>(
                <div key={label}>
                  <label className="lab">{label}</label>
                  <input className="inp" value={val} onChange={e=>setter(e.target.value)} type="text" placeholder={ph2}/>
                </div>
              ))}
            </div>
            <div className="fine" style={{marginBottom:12}}>Log every retest, the mock PFT, and every academy test. Your most recent push-up and sit-up numbers drive every calisthenics dose — currently <strong style={{color:"#3b82f6"}}>{puMax} push-ups</strong>{puLogged?"":" (9/21 floor)"} and <strong style={{color:"#a855f7"}}>{suMax} sit-ups</strong>{suLogged?"":" (9/21 floor)"}. Log honestly but never a sandbagged effort.<br/><br/>Splits are the four running totals at 15, 30, 45 and 60 seconds — <em>cumulative</em>, not per-quarter.</div>
            <button className="btn" style={{width:"100%"}} onClick={addScore}>SAVE SCORE</button>
          </div>

          <div className="card pad" style={{marginBottom:12}}>
            <div className="h-card" style={{marginBottom:7}}>LIFT LOG · e1RM</div>
            <div className="fine" style={{marginBottom:12}}>Log the last set of each main lift: weight, reps, and how many more reps you could have done (0 = nothing left). Your loads are calculated from it. Easy-week logs are kept but don't change your numbers, and they only drop after two weak sessions in a row.</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginBottom:10}}>
              {LIFTS.map(L=>{const on=liftK===L.k;return(
                <button key={L.k} onClick={()=>setLiftK(L.k)} style={{minHeight:40,padding:"6px 4px",borderRadius:10,fontSize:11.5,fontWeight:700,lineHeight:1.2,
                  border:`1px solid ${on?"#22c55e":"var(--line)"}`,background:on?"#22c55e":"rgba(255,255,255,.04)",color:on?"#07080b":"var(--tx-2)"}}>{L.n}</button>);})}
            </div>
            <div style={{display:"flex",gap:8}}>
              <input className="inp" style={{flex:1}} value={liftWt} onChange={e=>setLiftWt(e.target.value)} type="number" inputMode="decimal" placeholder="lb"/>
              <input className="inp" style={{flex:1}} value={liftReps} onChange={e=>setLiftReps(e.target.value)} type="number" inputMode="numeric" placeholder="reps"/>
              <input className="inp" style={{flex:1}} value={liftRpe} onChange={e=>setLiftRpe(e.target.value)} type="number" inputMode="decimal" placeholder="reps left"/>
              <button className="btn" style={{padding:"0 22px",flexShrink:0}} onClick={addLift}>LOG</button>
            </div>
            <div style={{marginTop:14,display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
              {LIFTS.map(L=>{
                const hist=lifts.filter(x=>x.k===L.k);
                const first=hist.length?e1Of(hist[0]):null, cur=e1[L.k];
                return(
                  <div key={L.k} className="stat" style={{background:"rgba(255,255,255,.045)",border:"1px solid var(--line)"}}>
                    <div className="stat-l" style={{color:"var(--tx-3)"}}>{L.n.split(" (")[0].toUpperCase()}</div>
                    <div className="stat-v">{cur?Math.round(cur):"—"}</div>
                    {cur&&first&&hist.length>1&&<div style={{fontSize:10.5,fontWeight:700,color:cur>=first?"#4ade80":"#fb7185"}}>{cur>=first?"+":""}{Math.round(cur-first)} lb</div>}
                  </div>
                );
              })}
            </div>
          </div>

          <div className="card pad" style={{marginBottom:12,background:effortsUsed>=MAX_300_EFFORTS?"linear-gradient(180deg,#f43f5e12,transparent 55%),var(--surface)":undefined}}>
            <div className="h-card" style={{marginBottom:7}}>300M EFFORT TOKENS · BEFORE JAN 4</div>
            <div style={{display:"flex",gap:8,marginBottom:10}}>
              {Array.from({length:MAX_300_EFFORTS},(_,i)=>(
                <div key={i} style={{flex:1,textAlign:"center",padding:"14px 4px",borderRadius:12,
                  background:i<effortsUsed?"#f43f5e18":"#22c55e14",border:`1px solid ${i<effortsUsed?"#f43f5e3d":"#22c55e2e"}`}}>
                  <div style={{fontFamily:"var(--cond)",fontSize:15,fontWeight:800,letterSpacing:".08em",color:i<effortsUsed?"#fb7185":"#4ade80"}}>
                    {i<effortsUsed?"SPENT":"AVAILABLE"}
                  </div>
                  <div style={{fontSize:10.5,color:"var(--tx-3)",marginTop:3}}>{i===0?"Mock PFT":"Spare"}</div>
                </div>
              ))}
            </div>
            <div className="fine">Two full-effort 300 m runs between now and day one: the mock PFT and one spare. You ran 54 s on 21 Sep — the event is banked, and the training dose is the smallest that holds it. Academy tests do not count against these.</div>
          </div>

          <div className="card pad" style={{marginBottom:12}}>
            <div className="h-card" style={{marginBottom:7}}>LOG WEEK {week} RUNNING MINUTES</div>
            <div className="fine" style={{marginBottom:12}}>Actual minutes of {isAcademy(week)?"YOUR OWN running (academy PT is added from the quick log)":"running"} this week — what you did, not what was written. This drives the collapse detector. Prescribed: <strong style={{color:"var(--tx-2)"}}>{weekSummary(week,ctx).own} min</strong>.</div>
            <div style={{display:"flex",gap:10}}>
              <input className="inp" style={{flex:1}} value={logRM} onChange={e=>setLogRM(e.target.value)} type="number" inputMode="decimal" placeholder={runLog[week]!=null?String(runLog[week]):"min"}/>
              <button className="btn" style={{padding:"0 26px",flexShrink:0}} onClick={()=>{const v=parseFloat(logRM);if(isNaN(v))return;setRunLog(p=>({...p,[week]:v}));setLogRM("");}}>LOG</button>
            </div>
            {Object.keys(runLog).length>0&&<div style={{marginTop:14,display:"flex",gap:7,flexWrap:"wrap"}}>{Object.entries(runLog).sort((a,b)=>b[0]-a[0]).slice(0,8).map(([w,v])=><div key={w} className="chipw">{runWkLabel(Number(w))} · <span style={{fontWeight:800,color:"var(--tx)"}}>{v}</span> min</div>)}</div>}
          </div>

          {Object.keys(acadWeek).length>0&&(
            <div className="card pad" style={{marginBottom:12}}>
              <div className="h-card" style={{marginBottom:10}}>ACADEMY PT · BY WEEK</div>
              {Object.entries(acadWeek).sort((a,b)=>b[0]-a[0]).slice(0,8).map(([w,v])=>(
                <div key={w} className="lrow" style={{justifyContent:"space-between"}}>
                  <span className="lval"><strong style={{color:"var(--tx)"}}>Wk {w}</strong> · {fmtDate(dateOf(+w,0))}</span>
                  <span className="lval">{v.n} sessions · <strong style={{color:"var(--tx)"}}>{v.run}</strong> min running · load {v.srpe}</span>
                </div>
              ))}
            </div>
          )}

          <div className="card pad" style={{marginBottom:12}}>
            <div className="h-card" style={{marginBottom:7}}>LOG BODYWEIGHT</div>
            <div className="fine" style={{marginBottom:12}}>Weigh 2–4× a week, same time of day. The Fuel tab turns these into a trend — the daily number is noise around it.</div>
            <div style={{display:"flex",gap:10}}>
              <input className="inp" style={{flex:1}} value={logBW} onChange={e=>setLogBW(e.target.value)} type="number" inputMode="decimal" placeholder="lbs"/>
              <button className="btn" style={{padding:"0 26px",flexShrink:0}} onClick={addWeight}>LOG</button>
            </div>
            {wt&&wt.pts.length>=2&&(()=>{const diff=wt.trend-wt.first.tr,down=diff<0;return(
              <div style={{marginTop:14,display:"flex",alignItems:"baseline",gap:9}}>
                <span style={{fontFamily:"var(--cond)",fontSize:32,fontWeight:800,color:down?"#4ade80":"#fb7185",lineHeight:1}}>{down?"−":"+"}{Math.abs(diff).toFixed(1)}</span>
                <span style={{fontSize:12,color:"var(--tx-3)",lineHeight:1.4}}>lb of TREND since {fmtDate(parseISO(wt.first.iso))} · est. {down?"−":"+"}{Math.abs(Math.round(diff*2))}s / mile</span>
              </div>
            );})()}
            {weights.length>0&&<div style={{marginTop:14,display:"flex",gap:7,flexWrap:"wrap"}}>{[...weights].slice(-8).reverse().map((w,i)=><div key={i} className="chipw"><span style={{fontWeight:800,color:"var(--tx)"}}>{w.bw}</span> · {w.iso?fmtDate(parseISO(w.iso)):`Wk ${w.week}`}</div>)}</div>}
          </div>

          <div className="card pad" style={{marginBottom:12}}>
            <div className="h-card" style={{marginBottom:12,color:"var(--tx-3)",fontSize:13}}>GOAL BUFFERS</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8}}>
              {[["PU","33+","#3b82f6"],["SU","40+","#a855f7"],["1.5mi","11:58","#f4640a"],["300m","56.0","#f4640a"]].map(([label,t,c])=>(
                <div key={label} className="stat" style={{background:c+"14",border:`1px solid ${c}2e`}}>
                  <div className="stat-l" style={{color:c}}>{label}</div>
                  <div className="stat-v" style={{color:c}}>{t}</div>
                </div>
              ))}
            </div>
            <div className="fine" style={{marginTop:12}}>The 50th percentile. The pass line is 26 / 35 / 13:16 / 62.1 s — and it has to hold for six months, not one morning.</div>
          </div>

          {scores.length>0&&(
            <div className="card pad" style={{marginBottom:12}}>
              <div className="h-card" style={{marginBottom:12}}>SCORE HISTORY</div>
              {[...scores].reverse().map((e,i)=>(
                <div key={i} style={{padding:"11px 0",borderBottom:i<scores.length-1?"1px solid var(--line)":"none"}}>
                  <div style={{fontSize:10,color:"var(--tx-3)",marginBottom:8,letterSpacing:".08em",fontWeight:700}}>{e.week!=null&&e.week>=1?`WK ${e.week} · `:""}{e.date}</div>
                  <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
                    {e.pushups!=null&&<div style={{display:"flex",alignItems:"baseline",gap:4}}><span style={{fontSize:10,fontWeight:800,color:"#3b82f6",letterSpacing:".08em"}}>PU</span><span style={{fontFamily:"var(--cond)",fontSize:26,fontWeight:800,lineHeight:1,color:e.pushups>=GOAL.pu?"#4ade80":e.pushups>=PASS.pu?"var(--tx)":"#fb7185"}}>{e.pushups}</span>{e.pushups>=GOAL.pu&&<span style={{fontSize:12}}>🎯</span>}{e.pushups<PASS.pu&&<span style={{fontSize:10,color:"#fb7185",fontWeight:600}}>below</span>}</div>}
                    {e.situps!=null&&<div style={{display:"flex",alignItems:"baseline",gap:4}}><span style={{fontSize:10,fontWeight:800,color:"#a855f7",letterSpacing:".08em"}}>SU</span><span style={{fontFamily:"var(--cond)",fontSize:26,fontWeight:800,lineHeight:1,color:e.situps>=GOAL.su?"#4ade80":e.situps>=PASS.su?"var(--tx)":"#fb7185"}}>{e.situps}</span>{e.situps>=GOAL.su&&<span style={{fontSize:12}}>🎯</span>}{e.situps<PASS.su&&<span style={{fontSize:10,color:"#fb7185",fontWeight:600}}>below</span>}</div>}
                    {e.run15&&<div style={{display:"flex",alignItems:"baseline",gap:4}}><span style={{fontSize:10,fontWeight:800,color:"#f4640a",letterSpacing:".08em"}}>1.5MI</span><span style={{fontFamily:"var(--cond)",fontSize:26,fontWeight:800,lineHeight:1,color:"var(--tx)"}}>{e.run15}</span></div>}
                    {e.t300&&<div style={{display:"flex",alignItems:"baseline",gap:4}}><span style={{fontSize:10,fontWeight:800,color:"#f4640a",letterSpacing:".08em"}}>300M</span><span style={{fontFamily:"var(--cond)",fontSize:26,fontWeight:800,lineHeight:1,color:"var(--tx)"}}>{e.t300}</span></div>}
                  </div>
                </div>
              ))}
            </div>
          )}

          {Object.keys(pmPain).length+Object.keys(amPain).length>0&&(
            <div className="card pad" style={{marginBottom:12}}>
              <div className="h-card" style={{marginBottom:10}}>SHIN LOG (last 12)</div>
              {[...new Set([...Object.keys(pmPain),...Object.keys(amPain)])]
                .map(k=>{const m=/^(-?\d+)-(\d)$/.exec(k);return m?{k,w:+m[1],d:+m[2]}:null;}).filter(Boolean)
                .sort((a,b)=>(b.w*7+b.d)-(a.w*7+a.d)).slice(0,12).map(({k,w,d})=>{
                const v=pmPain[k], am=amPain[k];
                return(
                  <div key={k} className="lrow" style={{justifyContent:"space-between",alignItems:"center"}}>
                    <span style={{fontSize:13,color:"var(--tx-2)",fontWeight:500}}>{fmtDate(dateOf(w,d))} · {DAYS[d]||"?"}</span>
                    <span style={{display:"flex",gap:14,alignItems:"baseline"}}>
                      <span style={{fontSize:10,color:"var(--tx-3)",fontWeight:700}}>DAY <span style={{fontFamily:"var(--cond)",fontSize:20,fontWeight:800,color:v==null?"var(--tx-3)":v===0?"#4ade80":v<=3?"#fbbf24":"#fb7185"}}>{v==null?"–":v}</span></span>
                      <span style={{fontSize:10,color:"var(--tx-3)",fontWeight:700}}>AM <span style={{fontFamily:"var(--cond)",fontSize:20,fontWeight:800,color:am==null?"var(--tx-3)":am===0?"#4ade80":am<=2?"#fbbf24":"#fb7185"}}>{am==null?"–":am}</span></span>
                    </span>
                  </div>
                );
              })}
            </div>
          )}

          <div style={{textAlign:"center",padding:"10px 0 4px"}}>
            <button className="btn-ghost" onClick={resetAll}>Reset all progress</button>
            <p className="fine" style={{marginTop:12}}>Progress saves to this device automatically.</p>
          </div>
        </div>
      )}

      <nav className="tabbar">
        {[["today","Today"],["plan","Plan"],["fuel","Fuel"],["records","Records"]].map(([id,lbl])=>{
          const Ico=TAB_ICONS[id];
          return(
            <button key={id} className={"tab"+(tab===id?" on":"")} onClick={()=>setTab(id)}>
              <Ico/>
              <span className="tab-l">{lbl.toUpperCase()}</span>
            </button>
          );
        })}
      </nav>
    </div>
  );
}

/* Debug handle — lets the whole calendar be swept from the console for
   missing library ids, broken doses, or rule violations. */
window.__blp={runPaces,buildDay,trackKeys,weekSummary,academyWeeks,ownTotalsPre,OWN_PRE,nutrition,weightTrend,migrateV5,migrateV4,getPhase,isDeload,isTaperWk,priorBuildWeek,refWeeks,LIBS,DAYS,NEAT,WEEK_MIN_CAP,ACADEMY_WK,TOTAL_WEEKS,dateOf};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
